<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미니지 - 부루마블</title>
  <style>
    :root { --bg: #f8f9fa; --text: #333; --canvas-bg: #0f172a; --border: #e9ecef; --btn-bg: #fff; }
    [data-theme="dark"] { --bg: #0d1117; --text: #c9d1d9; --canvas-bg: #0f172a; --border: #30363d; --btn-bg: #21262d; }
    [data-theme="beige"] { --bg: #f5ebe0; --text: #4e3d30; --canvas-bg: #1e1b18; --border: #ddcbbb; --btn-bg: #eddfd0; }
    body { background-color: var(--bg) !important; color: var(--text) !important; text-align: center; font-family: sans-serif; padding-top: 10px; margin: 0; transition: 0.3s; }
    button, select { background-color: var(--btn-bg) !important; color: var(--text) !important; border: 1px solid var(--border) !important; padding: 8px 14px; font-size: 0.85rem; border-radius: 8px; cursor: pointer; margin: 2px; font-weight: bold; }
    button:hover { filter: brightness(0.95); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    select { padding: 4px 8px; cursor: pointer; font-size: 1.1rem; }
    #marble-panel { font-size: 1.1rem; font-weight: bold; color: #fcc419; margin-bottom: 8px; min-height: 1.5em; }

    .container { max-width: 960px; margin: 0 auto; padding: 16px; }
    .lobby-layout { display:grid; grid-template-columns: minmax(430px, 1fr) 330px; gap:14px; align-items:stretch; }
    .online-modal { max-width:460px; margin:0 auto; box-sizing:border-box; background:var(--btn-bg); border:1px solid var(--border); border-radius:16px; padding:20px; box-shadow:0 6px 18px rgba(0,0,0,.12); }
    .online-title { font-size:1.18rem; font-weight:800; margin-bottom:8px; }
    .network-status { min-height:1.2em; color:#868e96; font-size:.78rem; margin-bottom:12px; }
    .network-status.ok { color:#2b8a3e; }
    .online-section { border:1px solid var(--border); border-radius:12px; padding:15px; background:rgba(0,0,0,.025); }
    .online-section h4 { margin:0 0 10px; font-size:.98rem; }
    .online-primary { background:#4dabf7 !important; color:#fff !important; border:none !important; padding:9px 16px; }
    .join-row { display:flex; justify-content:center; align-items:center; gap:7px; }
    .room-input { width:220px !important; font-size:1rem !important; letter-spacing:0.05em; text-align:center; }
    .online-secondary { padding:8px 16px; }
    .or-divider { display:flex; align-items:center; gap:10px; margin:9px 0; color:#adb5bd; font-size:.82rem; }
    .or-divider::before,.or-divider::after { content:""; flex:1; height:1px; background:var(--border); }
    .close-btn { margin-top:12px; }
    .participants-card { background:var(--btn-bg); border:1px solid var(--border); border-radius:16px; padding:20px; box-shadow:0 6px 18px rgba(0,0,0,.12); }
    .participants-title { font-size:1.08rem; font-weight:800; margin-bottom:4px; }
    .participants-count { font-size:.78rem; color:#868e96; margin-bottom:12px; }
    .participant-list { display:flex; flex-direction:column; gap:8px; }
    .participant { display:flex; justify-content:space-between; align-items:center; gap:8px; min-height:28px; padding:10px 11px; border:1px solid var(--border); border-radius:9px; background:rgba(0,0,0,.025); }
    .participant .who { display:flex; align-items:center; gap:7px; min-width:0; }
    .participant .name { font-weight:700; white-space:nowrap; }
    .participant .state { font-size:.75rem; color:#868e96; white-space:nowrap; }
    .participant.me { border-color:#4dabf7; background:rgba(77,171,247,.10); }

    @media (max-width:820px) {
      .container { max-width:680px; }
      .lobby-layout { grid-template-columns:1fr; }
      .online-modal { max-width:100%; }
    }
    
    canvas { background-color: var(--canvas-bg); border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); max-width: 100%; height: auto; vertical-align: middle; }
    
    .status-board { font-size: 0.8rem; margin-top: 10px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .p-status { border: 1px solid var(--border); padding: 8px; border-radius: 6px; text-align: left; background: var(--btn-bg); }
    .p-status.active { border-color: #fcc419; background: rgba(252, 196, 25, 0.1); }
    
    #action-panel { margin-top: 8px; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--btn-bg); display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; }
    .btn-action { font-size: 0.85rem; padding: 8px 12px; border-radius: 6px; }
    .btn-buy { background: #40c057 !important; color: #fff !important; border: none !important; }
    .btn-danger { background: #fa5252 !important; color: #fff !important; border: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <h2 style="margin:5px 0 10px 0;">🎲 정통 40칸 부루마블</h2>

    <!-- 온라인 멀티 로비 -->
    <div id="lobby-panel" class="lobby-layout">
      <section class="online-modal">
        <div class="online-title">🌐 1:1 ~ 4인 온라인 접속</div>
        <div id="network-status" class="network-status">P2P 연결 대기 중...</div>

        <div class="online-section">
          <h4>🏠 방 만들기 (방장)</h4>
          <button class="online-primary" onclick="createRoom()">방 코드 생성</button>
          <div id="host-room-info" style="display:none; margin-top:10px; color:#4dabf7; font-size:.95rem;">
            발급된 방 코드: <b id="host-room-code" style="font-size:1.1rem; word-break:break-all;"></b>
          </div>
          <div id="host-controls" style="display:none; margin-top:10px;">
            <button onclick="startGame()" style="background:#40c057 !important; color:#fff !important; border:none !important; width:100%; padding:9px 12px;">🚀 게임 시작 (방장)</button>
          </div>
        </div>

        <div class="or-divider"><span>또는</span></div>

        <div class="online-section">
          <h4>🎮 방 참가하기 (참가자)</h4>
          <div class="join-row">
            <input id="room-code-input" class="room-input" type="text" placeholder="방 코드 입력" autocomplete="off">
            <button class="online-secondary" onclick="joinRoom()">입장</button>
          </div>
        </div>

        <button class="close-btn" onclick="
          closeNetworking();
          document.getElementById('host-controls').style.display='none';
          document.getElementById('host-room-info').style.display='none';
          document.getElementById('guest-waiting').style.display='none';
          setNetworkStatus('P2P 연결 대기 중...');
          updateUI();
        ">❌ 초기화</button>

        <div id="guest-waiting" style="display:none; color:#868e96; margin-top:10px; font-size:.8rem;">
          방장이 게임을 시작하기를 기다리고 있습니다...
        </div>
      </section>

      <aside class="participants-card">
        <div class="participants-title">👥 참가자 목록</div>
        <div id="participants-count" class="participants-count">1 / 4명 접속</div>
        <div id="participant-list" class="participant-list"></div>
      </aside>
    </div>

    <!-- 게임 진행 화면 -->
    <div id="game-panel" style="display:none;">
      <div id="marble-panel">게임 준비 중...</div>
      
      <!-- 660x660 40칸 보드 캔버스 -->
      <canvas id="boardCanvas" width="660" height="660"></canvas>

      <div id="action-panel"></div>

      <div id="player-status-grid" class="status-board"></div>
    </div>
  </div>

  <script>

      "🎈", "🚗", "🚀", "💎", "🦁", "🐱", "🐶", "🦊",

      "👾", "🎲", "🎯", "🎨", "🎪", "🎭", "🎮", "🕹️",

    ];

    const savedTheme = localStorage.getItem('minig-theme');
    if (savedTheme && savedTheme !== 'white') document.documentElement.setAttribute('data-theme', savedTheme);

    let audioCtx = null;
    function initAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (_) {}
    }

    function playSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        if (type === 'roll') {
          const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(180 + Math.random() * 100, now);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.04);
        } else if (type === 'buy') {
          [523, 659, 783, 1046].forEach((f, i) => {
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            const t = now + i * 0.05;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, t);
            gain.gain.setValueAtTime(0.08, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(t); osc.stop(t + 0.1);
          });
        } else if (type === 'rent') {
          const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(60, now + 0.25);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.25);
        }
      } catch (_) {}
    }

      { name: "황금열쇠", type: "key", icon: "🔑" },

      { name: "로마", type: "city", land: 40, villa: 30, bldg: 90, hotel: 150, rLand: 35, rVilla: 110, rBldg: 270, rHotel: 500, icon: "🇮🇹" },
      { name: "런던", type: "city", land: 45, villa: 30, bldg: 90, hotel: 150, rLand: 40, rVilla: 120, rBldg: 300, rHotel: 550, icon: "🇬🇧" },
      { name: "뉴욕", type: "city", land: 45, villa: 30, bldg: 90, hotel: 150, rLand: 40, rVilla: 120, rBldg: 300, rHotel: 550, icon: "🇺🇸" },
      { name: "우주여행", type: "space", icon: "🚀" },
      { name: "콩코드", type: "city", land: 50, villa: 35, bldg: 100, hotel: 180, rLand: 45, rVilla: 130, rBldg: 330, rHotel: 600, icon: "✈️" },
      { name: "모스크바", type: "city", land: 55, villa: 35, bldg: 100, hotel: 180, rLand: 50, rVilla: 140, rBldg: 360, rHotel: 650, icon: "🇷🇺" },
      { name: "태평양호", type: "city", land: 60, villa: 35, bldg: 100, hotel: 180, rLand: 55, rVilla: 150, rBldg: 390, rHotel: 700, icon: "🚢" },
      { name: "컬럼비아", type: "city", land: 65, villa: 40, bldg: 120, hotel: 200, rLand: 60, rVilla: 170, rBldg: 430, rHotel: 800, icon: "🛰️" },
      { name: "황금열쇠", type: "key", icon: "🔑" },
      { name: "제네바", type: "city", land: 70, villa: 40, bldg: 120, hotel: 200, rLand: 65, rVilla: 180, rBldg: 460, rHotel: 850, icon: "🇨🇭" },
      { name: "몬트리올", type: "city", land: 75, villa: 40, bldg: 120, hotel: 200, rLand: 70, rVilla: 190, rBldg: 490, rHotel: 900, icon: "🇨🇦" },
      { name: "황금열쇠", type: "key", icon: "🔑" },
      { name: "서울", type: "city", land: 100, villa: 50, bldg: 150, hotel: 250, rLand: 100, rVilla: 300, rBldg: 700, rHotel: 1200, icon: "🇰🇷" }
    ];

    const TILE_POS = [];
    const S = 60;
    for (let i = 10; i >= 0; i--) TILE_POS.push({ x: i * S, y: 10 * S });
    for (let j = 9; j >= 1; j--) TILE_POS.push({ x: 0, y: j * S });
    for (let i = 0; i <= 10; i++) TILE_POS.push({ x: i * S, y: 0 });
    for (let j = 1; j <= 9; j++) TILE_POS.push({ x: 10 * S, y: j * S });

    const PLAYER_CONFIG = [
      { name: "P1", color: "#ff6b6b" },
      { name: "P2", color: "#4dabf7" },
      { name: "P3", color: "#51cf66" },
      { name: "P4", color: "#fcc419" }
    ];

    let roomCode = "";
    let localPlayerIndex = -1;
    let isHost = false;
    let peer = null;
    let hostConnection = null;
    let myClientId = "";
    const connections = new Map();
    let stateSeq = 0;
    let rollTimer = null;
    let moveTimer = null;
    let aiTimer = null;

    const PEER_OPTIONS = {
      debug: 1,
      config: {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" }
        ]
      }
    };

    let gameState = makeInitialState();

    function makeInitialState() {
      return {
        status: "lobby",
        roomCode: "",
        turn: 0,
        dice1: 1,
        dice2: 1,
        isDouble: false,
        doubleCount: 0,
        isRolling: false,
        isMoving: false,
        awaitingAction: null,
        vote: null,
        socialFundPool: 0,
        message: "방장이 게임을 시작하기를 기다립니다.",
        players: [
          { id: null, name: "P1", emoji: "🎈", isAI: true, money: 300, loan: 0, pos: 0, islandTurns: 0, bankrupt: false },
          { id: null, name: "P2", emoji: "🚗", isAI: true, money: 300, loan: 0, pos: 0, islandTurns: 0, bankrupt: false },
          { id: null, name: "P3", emoji: "🚀", isAI: true, money: 300, loan: 0, pos: 0, islandTurns: 0, bankrupt: false },
          { id: null, name: "P4", emoji: "💎", isAI: true, money: 300, loan: 0, pos: 0, islandTurns: 0, bankrupt: false }
        ],
        board: TILES.map(() => ({ owner: -1, villa: false, bldg: false, hotel: false }))
      };
    }

    function setNetworkStatus(text, ok = false) {
      const el = document.getElementById('network-status');
      if (!el) return;
      el.textContent = text;
      el.classList.toggle('ok', !!ok);
    }

    function normalizeRoomCode(value) {
      return String(value || '').trim();
    }

    function cloneState() {
      return JSON.parse(JSON.stringify(gameState));
    }

    function clearTimers() {
      if (rollTimer) { clearInterval(rollTimer); rollTimer = null; }
      if (moveTimer) { clearInterval(moveTimer); moveTimer = null; }
      if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
      gameState.isRolling = false;
      gameState.isMoving = false;
    }

    function closeNetworking() {
      clearTimers();
      for (const conn of connections.values()) {
        try { conn.close(); } catch (_) {}
      }
      connections.clear();
      if (hostConnection) { try { hostConnection.close(); } catch (_) {} hostConnection = null; }
      if (peer) { try { peer.destroy(); } catch (_) {} peer = null; }
      myClientId = '';
    }

    function createRoom() {
      initAudio();
      closeNetworking();
      
      isHost = true;
      localPlayerIndex = 0;
      gameState = makeInitialState();
      gameState.players[0].isAI = false;

      // 발급받기 전에는 방 정보 및 시작 버튼을 노출하지 않음
      document.getElementById('host-room-info').style.display = 'none';
      document.getElementById('host-controls').style.display = 'none';
      document.getElementById('guest-waiting').style.display = 'none';
      setNetworkStatus('서버로부터 P2P 방 코드 발급 중...', false);
      updateUI();

      if (typeof Peer === 'undefined') {
        setNetworkStatus('PeerJS 로딩 실패', false);
        return;
      }

      // ID 파라미터를 넘기지 않아 PeerJS 서버에서 고유 ID를 할당받음
      peer = new Peer(PEER_OPTIONS);
      peer.on('open', id => {
        roomCode = id;
        gameState.roomCode = roomCode;
        myClientId = id;
        gameState.players[0].id = id;

        // 서버 발급 완료 후에만 화면에 노출
        document.getElementById('host-room-info').style.display = 'block';
        document.getElementById('host-room-code').innerText = roomCode;
        document.getElementById('host-controls').style.display = 'block';

        setNetworkStatus(`P2P 방 개설 완료 · 코드 발급됨`, true);
        syncStateToNetwork();
      });
      peer.on('connection', conn => attachGuestConnection(conn));
      peer.on('error', err => {
        setNetworkStatus(`P2P 오류: ${err?.type || '연결 오류'}`, false);
      });
    }

    function joinRoom() {
      initAudio();
      closeNetworking();
      const code = normalizeRoomCode(document.getElementById('room-code-input').value);
      if (!code) {
        alert('방 코드를 올바르게 입력해주세요!');
        return;
      }
      roomCode = code;
      isHost = false;
      localPlayerIndex = -1;
      gameState = makeInitialState();
      gameState.roomCode = roomCode;
      document.getElementById('host-room-info').style.display = 'none';
      document.getElementById('host-controls').style.display = 'none';
      document.getElementById('guest-waiting').style.display = 'block';
      setNetworkStatus('방장에게 P2P 연결 중...', false);
      updateUI();

      if (typeof Peer === 'undefined') {
        setNetworkStatus('PeerJS 로딩 실패', false);
        return;
      }

      peer = new Peer(PEER_OPTIONS);
      peer.on('open', id => {
        myClientId = id;
        const conn = peer.connect(roomCode, { reliable: true, serialization: 'json', metadata: { clientId: id } });
        attachHostConnection(conn);
      });
      peer.on('error', err => {
        setNetworkStatus(`P2P 연결 실패: ${err?.type || '연결 오류'}`, false);
      });
    }

    function attachHostConnection(conn) {
      if (hostConnection && hostConnection !== conn) {
        try { hostConnection.close(); } catch (_) {}
      }
      hostConnection = conn;
      conn.on('open', () => {
        setNetworkStatus('방장과 P2P 연결됨', true);
        conn.send({ type: 'JOIN_REQUEST', clientId: myClientId });
      });
      conn.on('data', handleGuestData);
      conn.on('close', () => {
        setNetworkStatus('방장과의 연결이 끊겼습니다.', false);
      });
    }

    function attachGuestConnection(conn) {
      conn.on('open', () => {
        const clientId = conn.metadata?.clientId || conn.peer;
        connections.set(clientId, conn);
        setNetworkStatus('플레이어 P2P 연결됨', true);
      });
      conn.on('data', data => handleHostData(conn, data));
      conn.on('close', () => handleGuestDisconnect(conn));
    }

    function handleGuestDisconnect(conn) {
      const clientId = conn.metadata?.clientId || [...connections.entries()].find(([, c]) => c === conn)?.[0];
      if (!clientId) return;
      connections.delete(clientId);
      const idx = gameState.players.findIndex(p => p.id === clientId);
      if (idx !== -1) {
        if (gameState.status === 'playing') {
          startDisconnectVote(idx);
        } else {
          gameState.players[idx].id = null;
          gameState.players[idx].isAI = true;
          gameState.message = `P${idx + 1} 플레이어 연결이 끊겼습니다.`;
          syncStateToNetwork();
        }
      }
    }

    function startDisconnectVote(targetIdx) {
      gameState.players[targetIdx].id = null;
      gameState.vote = {
        targetIdx: targetIdx,
        votes: {}
      };
      gameState.message = `⚠️ P${targetIdx + 1} 님의 연결이 끊겼습니다. 처리 방식 투표가 시작됩니다.`;
      
      const humanVoters = gameState.players.filter((p, i) => !p.bankrupt && !p.isAI && i !== targetIdx);
      if (humanVoters.length === 0) {
        resolveVote();
      } else {
        syncStateToNetwork();
      }
    }

    function submitVote(choice) {
      if (localPlayerIndex < 0) return;
      if (isHost) {
        handleHostVote(localPlayerIndex, choice);
      } else {
        sendToHost({ type: 'SUBMIT_VOTE', clientId: myClientId, choice });
      }
    }

    function handleHostVote(voterIdx, choice) {
      if (!isHost || !gameState.vote) return;
      
      gameState.vote.votes[voterIdx] = choice;

      const humanVoters = gameState.players.filter((p, i) => !p.bankrupt && !p.isAI && i !== gameState.vote.targetIdx);
      const allVoted = humanVoters.every(p => {
        const pIdx = gameState.players.indexOf(p);
        return gameState.vote.votes[pIdx] !== undefined;
      });

      if (allVoted || humanVoters.length === 0) {
        resolveVote();
      } else {
        syncStateToNetwork();
      }
    }

    function resolveVote() {
      if (!gameState.vote) return;
      const targetIdx = gameState.vote.targetIdx;
      const votes = Object.values(gameState.vote.votes);
      
      let aiCount = votes.filter(v => v === 'ai').length;
      let removeCount = votes.filter(v => v === 'remove').length;

      if (aiCount >= removeCount) {
        gameState.players[targetIdx].isAI = true;
        gameState.message = `투표 완료: P${targetIdx + 1} 님이 AI로 전환되었습니다.`;
      } else {
        gameState.players[targetIdx].bankrupt = true;
        gameState.players[targetIdx].money = 0;
        gameState.board.forEach(b => {
          if (b.owner === targetIdx) {
            b.owner = -1; b.villa = b.bldg = b.hotel = false;
          }
        });
        gameState.message = `투표 완료: P${targetIdx + 1} 님이 삭제(파산) 처리되었습니다.`;
      }

      gameState.vote = null;
      syncStateToNetwork();

      const activePlayers = gameState.players.filter(p => !p.bankrupt);
      if (activePlayers.length <= 1) {
        gameState.status = 'ended';
        gameState.message = `🎉 게임 종료! 승자: P${gameState.turn + 1} (${gameState.players[gameState.turn].emoji})`;
        syncStateToNetwork();
        return;
      }

      if (gameState.turn === targetIdx) {
        nextTurn();
      } else {
        checkTurnAndAI();
      }
    }

    function sendToHost(message) {
      if (!hostConnection || !hostConnection.open) return false;
      try { hostConnection.send(message); return true; } catch (_) { return false; }
    }

    function broadcastToGuests(message) {
      for (const [clientId, conn] of connections.entries()) {
        if (!conn || !conn.open) continue;
        try { conn.send(message); } catch (_) { connections.delete(clientId); }
      }
    }

    function syncStateToNetwork() {
      updateUI();
      if (!isHost || !peer || !peer.open) return;
      stateSeq++;
      broadcastToGuests({ type: 'STATE_UPDATE', seq: stateSeq, state: cloneState() });
    }

    function handleGuestData(data) {
      if (!data || isHost) return;
      if (data.type === 'JOIN_RESPONSE') {
        localPlayerIndex = Number(data.slotIndex);
        setNetworkStatus(`P2P 연결 완료 · P${localPlayerIndex + 1}`, true);
        if (gameState.players[localPlayerIndex]) {
          gameState.players[localPlayerIndex].isAI = false;
          gameState.players[localPlayerIndex].id = myClientId;
        }
        updateUI();
        return;
      }
      if (data.type === 'STATE_UPDATE' && data.state) {
        gameState = data.state;
        if (localPlayerIndex >= 0 && gameState.players[localPlayerIndex]) {
          gameState.players[localPlayerIndex].isAI = false;
          gameState.players[localPlayerIndex].id = myClientId;
        }
        updateUI();
      }
    }

    function handleHostData(conn, data) {
      if (!data || !isHost) return;
      if (data.type === 'JOIN_REQUEST') {
        const clientId = String(data.clientId || '').trim();
        if (!clientId) return;
        let slot = gameState.players.findIndex(p => p.id === clientId);
        if (slot === -1 && gameState.status === 'lobby') {
          slot = gameState.players.findIndex((p, idx) => idx > 0 && p.isAI && p.id === null);
          if (slot !== -1) {
            gameState.players[slot].isAI = false;
            gameState.players[slot].id = clientId;
          }
        }
        if (slot !== -1) {
          try {
            conn.send({ type: 'JOIN_RESPONSE', slotIndex: slot, clientId });
            conn.send({ type: 'STATE_UPDATE', seq: stateSeq, state: cloneState() });
          } catch (_) {}
          gameState.message = `P${slot + 1} 플레이어가 참가했습니다.`;
          syncStateToNetwork();
        }
        return;
      }

      if (data.type === 'CHANGE_EMOJI') {
        const idx = gameState.players.findIndex(p => p.id === data.clientId);
        if (idx !== -1 && gameState.status === 'lobby' && EMOJI_OPTIONS.includes(data.emoji)) {
          gameState.players[idx].emoji = data.emoji;
          syncStateToNetwork();
        }
        return;
      }

      if (data.type === 'SUBMIT_VOTE') {
        const idx = gameState.players.findIndex(p => p.id === data.clientId);
        if (idx !== -1) handleHostVote(idx, data.choice);
        return;
      }

      if (data.type === 'ROLL_REQUEST') {
        const idx = gameState.players.findIndex(p => p.id === data.clientId);
        if (idx === gameState.turn) triggerDiceRoll();
        return;
      }

      if (data.type === 'ACTION_TRIGGER') {
        const idx = gameState.players.findIndex(p => p.id === data.clientId);
        if (idx === gameState.turn) handleHostAction(idx, data.action);
      }
    }

    function requestEmojiChange(newEmoji) {
      if (localPlayerIndex < 0) return;
      if (isHost) {
        if (gameState.status === 'lobby' && EMOJI_OPTIONS.includes(newEmoji)) {
          gameState.players[localPlayerIndex].emoji = newEmoji;
          syncStateToNetwork();
        }
      } else {
        sendToHost({ type: 'CHANGE_EMOJI', clientId: myClientId, emoji: newEmoji });
      }
    }

    function startGame() {
      if (!isHost || gameState.status !== 'lobby') return;
      gameState.status = 'playing';
      gameState.turn = 0;
      gameState.awaitingAction = null;
      gameState.message = `게임 시작! P1(${gameState.players[0].emoji})의 순서입니다.`;
      syncStateToNetwork();
      checkTurnAndAI();
    }

    function handleRollClick() {
      if (gameState.status !== 'playing' || gameState.vote) return;
      if (gameState.turn !== localPlayerIndex) return;
      if (gameState.isRolling || gameState.isMoving || gameState.awaitingAction) return;

      if (isHost) {
        triggerDiceRoll();
      } else {
        sendToHost({ type: 'ROLL_REQUEST', clientId: myClientId });
      }
    }

    function triggerDiceRoll() {
      if (!isHost || gameState.isRolling || gameState.isMoving || gameState.awaitingAction || gameState.vote) return;
      gameState.isRolling = true;
      syncStateToNetwork();

      let ticks = 0;
      rollTimer = setInterval(() => {
        gameState.dice1 = Math.floor(Math.random() * 6) + 1;
        gameState.dice2 = Math.floor(Math.random() * 6) + 1;
        playSound('roll');
        syncStateToNetwork();
        ticks++;
        if (ticks >= 8) {
          clearInterval(rollTimer);
          rollTimer = null;
          gameState.isRolling = false;
          processDiceResult();
        }
      }, 100);
    }

    function processDiceResult() {
      const p = gameState.players[gameState.turn];
      const sum = gameState.dice1 + gameState.dice2;
      gameState.isDouble = (gameState.dice1 === gameState.dice2);

      if (p.islandTurns > 0) {
        if (gameState.isDouble) {
          p.islandTurns = 0;
          gameState.message = `더블! 무인도 탈출 성공. (${sum}칸 이동)`;
          movePlayer(gameState.turn, sum);
        } else {
          p.islandTurns--;
          gameState.message = `무인도 탈출 실패! 남은 대기: ${p.islandTurns}턴`;
          finishTurn();
        }
        return;
      }

      if (gameState.isDouble) {
        gameState.doubleCount++;
        if (gameState.doubleCount >= 3) {
          p.pos = 10;
          p.islandTurns = 3;
          gameState.doubleCount = 0;
          gameState.message = `3연속 더블! 무인도로 억류됩니다.`;
          finishTurn();
          return;
        }
      } else {
        gameState.doubleCount = 0;
      }

      gameState.message = `P${gameState.turn + 1} 주사위: ${gameState.dice1} + ${gameState.dice2} = ${sum} 이동`;
      movePlayer(gameState.turn, sum);
    }

    function movePlayer(playerIdx, steps) {
      gameState.isMoving = true;
      let remaining = steps;
      moveTimer = setInterval(() => {
        const p = gameState.players[playerIdx];
        p.pos = (p.pos + 1) % 40;
        if (p.pos === 0) {
          p.money += 20;
          gameState.message = `P${playerIdx + 1} 출발지 통과! (월급 +20만)`;
        }
        playSound('roll');
        syncStateToNetwork();
        remaining--;
        if (remaining <= 0) {
          clearInterval(moveTimer);
          moveTimer = null;
          gameState.isMoving = false;
          handleTileLanding(playerIdx, p.pos);
        }
      }, 150);
    }

    function handleTileLanding(playerIdx, tileIdx) {
      const p = gameState.players[playerIdx];
      const tile = TILES[tileIdx];
      const b = gameState.board[tileIdx];

      if (tile.type === 'city') {
        if (b.owner === -1) {
          gameState.awaitingAction = { type: 'BUY_PROPERTY', tileIdx, options: ['land', 'villa', 'bldg', 'hotel'] };
        } else if (b.owner === playerIdx) {
          gameState.awaitingAction = { type: 'UPGRADE_PROPERTY', tileIdx };
        } else {
          let rent = tile.rLand;
          if (b.villa) rent += tile.rVilla;
          if (b.bldg) rent += tile.rBldg;
          if (b.hotel) rent += tile.rHotel;

          p.money -= rent;
          gameState.players[b.owner].money += rent;
          playSound('rent');
          gameState.message = `P${playerIdx + 1}이(가) P${b.owner + 1}의 ${tile.name} 방문! 통행료 ${rent}만 지급.`;
          checkBankruptcy(playerIdx);
          finishTurn();
          return;
        }
      } else if (tile.type === 'key') {
        const cards = [
          { txt: "복권 당첨! (+30만)", money: 30 },
          { txt: "세금 납부 (-15만)", money: -15 },
          { txt: "무인도로 이동", island: true },
          { txt: "기금 수령지로 이동", goto: 20 }
        ];
        const card = cards[Math.floor(Math.random() * cards.length)];
        gameState.message = `황금열쇠: ${card.txt}`;
        if (card.money) p.money += card.money;
        if (card.island) { p.pos = 10; p.islandTurns = 3; }
        if (card.goto !== undefined) { p.pos = card.goto; }
        checkBankruptcy(playerIdx);
        finishTurn();
        return;
      } else if (tile.type === 'tax') {
        const tax = Math.min(30, Math.floor(p.money * 0.1));
        p.money -= tax;
        gameState.socialFundPool += tax;
        gameState.message = `복지기금 납부: -${tax}만`;
        checkBankruptcy(playerIdx);
        finishTurn();
        return;
      } else if (tile.type === 'fund_get') {
        p.money += gameState.socialFundPool;
        gameState.message = `복지기금 수령! +${gameState.socialFundPool}만`;
        gameState.socialFundPool = 0;
        playSound('buy');
        finishTurn();
        return;
      } else if (tile.type === 'island') {
        p.islandTurns = 3;
        gameState.message = `무인도 도착! 3턴 동안 대기합니다.`;
        finishTurn();
        return;
      } else {
        finishTurn();
        return;
      }

      syncStateToNetwork();
      if (p.isAI) handleAIAction();
    }

    function sendPlayerAction(action) {
      if (gameState.turn !== localPlayerIndex || gameState.vote) return;
      if (isHost) {
        handleHostAction(localPlayerIndex, action);
      } else {
        sendToHost({ type: 'ACTION_TRIGGER', clientId: myClientId, action });
      }
    }

    function handleHostAction(playerIdx, action) {
      if (!isHost || gameState.turn !== playerIdx || gameState.vote) return;
      const p = gameState.players[playerIdx];
      const awaiting = gameState.awaitingAction;
      if (!awaiting) return;

      if (action.type === 'BUY' || action.type === 'UPGRADE') {
        const tile = TILES[awaiting.tileIdx];
        const b = gameState.board[awaiting.tileIdx];
        let cost = 0;

        if (action.build.includes('land') && b.owner === -1) { cost += tile.land; b.owner = playerIdx; }
        if (action.build.includes('villa') && !b.villa) { cost += tile.villa; b.villa = true; }
        if (action.build.includes('bldg') && !b.bldg) { cost += tile.bldg; b.bldg = true; }
        if (action.build.includes('hotel') && !b.hotel) { cost += tile.hotel; b.hotel = true; }

        if (p.money >= cost && cost > 0) {
          p.money -= cost;
          playSound('buy');
          gameState.message = `P${playerIdx + 1}이(가) ${tile.name}에 건물 매수! (-${cost}만)`;
        }
      } else {
        gameState.message = `P${playerIdx + 1}이(가) 매수를 포기했습니다.`;
      }

      gameState.awaitingAction = null;
      finishTurn();
    }

    function checkBankruptcy(playerIdx) {
      const p = gameState.players[playerIdx];
      if (p.money < 0) {
        p.bankrupt = true;
        p.money = 0;
        gameState.message = `P${playerIdx + 1} 파산!`;
        gameState.board.forEach(b => { if (b.owner === playerIdx) { b.owner = -1; b.villa = b.bldg = b.hotel = false; } });
      }
    }

    function finishTurn() {
      gameState.awaitingAction = null;
      if (gameState.isDouble && !gameState.players[gameState.turn].bankrupt && gameState.doubleCount > 0) {
        gameState.message += ` (더블! 한 번 더 주사위를 굴릴 수 있습니다.)`;
        syncStateToNetwork();
        checkTurnAndAI();
      } else {
        gameState.doubleCount = 0;
        nextTurn();
      }
    }

    function nextTurn() {
      let count = 0;
      do {
        gameState.turn = (gameState.turn + 1) % 4;
        count++;
      } while (gameState.players[gameState.turn].bankrupt && count < 4);

      const activePlayers = gameState.players.filter(p => !p.bankrupt);
      if (activePlayers.length <= 1) {
        gameState.status = 'ended';
        gameState.message = `🎉 게임 종료! 승자: P${gameState.turn + 1} (${gameState.players[gameState.turn].emoji})`;
        syncStateToNetwork();
        return;
      }

      gameState.message = `P${gameState.turn + 1}(${gameState.players[gameState.turn].emoji})의 순서입니다.`;
      syncStateToNetwork();
      checkTurnAndAI();
    }

    function checkTurnAndAI() {
      if (!isHost || gameState.status !== 'playing' || gameState.vote) return;
      const p = gameState.players[gameState.turn];
      if (p.isAI && !p.bankrupt) {
        aiTimer = setTimeout(() => {
          if (!gameState.awaitingAction) {
            triggerDiceRoll();
          } else {
            handleAIAction();
          }
        }, 1000);
      }
    }

    function handleAIAction() {
      if (!isHost || gameState.vote) return;
      const p = gameState.players[gameState.turn];
      const awaiting = gameState.awaitingAction;
      if (!awaiting) return;

      const tile = TILES[awaiting.tileIdx];
      const build = [];
      let totalCost = 0;

      if (awaiting.type === 'BUY_PROPERTY') {
        if (p.money >= tile.land + tile.villa + 20) {
          build.push('land', 'villa');
          totalCost = tile.land + tile.villa;
        }
      } else if (awaiting.type === 'UPGRADE_PROPERTY') {
        const b = gameState.board[awaiting.tileIdx];
        if (!b.bldg && p.money >= tile.bldg + 10) { build.push('bldg'); totalCost += tile.bldg; }
        if (!b.hotel && p.money >= totalCost + tile.hotel + 10) { build.push('hotel'); totalCost += tile.hotel; }
      }

      if (build.length > 0) {
        handleHostAction(gameState.turn, { type: awaiting.type === 'BUY_PROPERTY' ? 'BUY' : 'UPGRADE', build });
      } else {
        handleHostAction(gameState.turn, { type: 'PASS' });
      }
    }

    const canvas = document.getElementById('boardCanvas');
    const ctx = canvas.getContext('2d');

    function renderParticipants() {
      const el = document.getElementById('participant-list');
      if (!el) return;
      el.innerHTML = '';
      let connectedCount = 0;
      gameState.players.forEach((p, idx) => {
        if (!p.isAI || idx === 0) connectedCount++;
        const div = document.createElement('div');
        div.className = 'participant' + (idx === localPlayerIndex ? ' me' : '');
        let stateText = p.isAI ? '🤖 AI 컴퓨터' : (p.id ? '👤 연결됨' : '⌛ 연결 중...');
        let nameText = `P${idx+1}`;
        
        let emojiPickerHtml = '';
        if (idx === localPlayerIndex && gameState.status === 'lobby') {
          emojiPickerHtml = `<select onchange="requestEmojiChange(this.value)">${EMOJI_OPTIONS.map(e => `<option value="${e}" ${e === p.emoji ? 'selected' : ''}>${e}</option>`).join('')}</select>`;
        } else {
          emojiPickerHtml = `<span style="font-size:1.25rem">${p.emoji}</span>`;
        }

        div.innerHTML = `<div class="who">${emojiPickerHtml}<span class="name">${nameText}</span></div><span class="state">${stateText}</span>`;
        el.appendChild(div);
      });
      const cntEl = document.getElementById('participants-count');
      if (cntEl) cntEl.textContent = `${connectedCount} / 4명 접속`;
    }

    function updateUI() {
      if (gameState.status === 'playing') {
        document.getElementById('lobby-panel').style.display = 'none';
        document.getElementById('game-panel').style.display = 'block';
      } else {
        document.getElementById('lobby-panel').style.display = 'grid';
        document.getElementById('game-panel').style.display = 'none';
      }

      renderParticipants();
      document.getElementById('marble-panel').innerText = gameState.message;

      drawBoard();
      updateActionPanel();
      updateStatusBoard();
    }

    function drawBoard() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, 660, 660);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`🏛️ 복지기금: ${gameState.socialFundPool}만 원`, 330, 300);

      ctx.font = 'bold 36px sans-serif';
      ctx.fillText(`🎲 ${gameState.dice1}   🎲 ${gameState.dice2}`, 330, 360);

      TILES.forEach((tile, i) => {
        const pos = TILE_POS[i];
        const b = gameState.board[i];

        ctx.fillStyle = b.owner >= 0 ? PLAYER_CONFIG[b.owner].color : '#1e293b';
        ctx.fillRect(pos.x, pos.y, S, S);
        ctx.strokeStyle = '#334155';
        ctx.strokeRect(pos.x, pos.y, S, S);

        ctx.fillStyle = '#ffffff';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(tile.name, pos.x + S/2, pos.y + 18);
        ctx.font = '14px sans-serif';
        ctx.fillText(tile.icon, pos.x + S/2, pos.y + 36);

        if (tile.type === 'city') {
          let bldgs = '';
          if (b.villa) bldgs += '🛖';
          if (b.bldg) bldgs += '🏢';
          if (b.hotel) bldgs += '🏨';
          ctx.font = '9px sans-serif';
          ctx.fillText(bldgs || `${tile.land}만`, pos.x + S/2, pos.y + 52);
        }
      });

      gameState.players.forEach((p, idx) => {
        if (p.bankrupt) return;
        const pos = TILE_POS[p.pos];
        const offsetX = (idx % 2) * 24 + 14;
        const offsetY = Math.floor(idx / 2) * 24 + 14;

        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.emoji, pos.x + offsetX, pos.y + offsetY);
      });
    }

    function updateActionPanel() {
      const panel = document.getElementById('action-panel');
      panel.innerHTML = '';

      if (gameState.status !== 'playing') return;

      if (gameState.vote) {
        const myVote = gameState.vote.votes[localPlayerIndex];
        const me = gameState.players[localPlayerIndex];

        if (me && !me.bankrupt && !me.isAI && localPlayerIndex !== gameState.vote.targetIdx) {
          if (myVote) {
            panel.innerHTML = `<span style="color:#4dabf7; font-weight:bold;">투표 완료: 다른 참가자의 투표를 기다리는 중... (${myVote === 'ai' ? '🤖 AI 전환' : '❌ 완전 삭제'})</span>`;
          } else {
            panel.innerHTML = `
              <div style="width:100%; margin-bottom:8px; font-weight:bold; color:#fa5252;">
                ⚠️ P${gameState.vote.targetIdx + 1} 님이 퇴장했습니다. 대처 방식을 투표해주세요:
              </div>
              <button class="btn-action btn-buy" onclick="submitVote('ai')">🤖 AI로 전환</button>
              <button class="btn-action btn-danger" onclick="submitVote('remove')">❌ 완전 삭제 (파산)</button>
            `;
          }
        } else {
          panel.innerHTML = `<span style="color:#868e96;">P${gameState.vote.targetIdx + 1} 퇴장에 따른 참가자 투표가 진행 중입니다...</span>`;
        }
        return;
      }

      const isMyTurn = (gameState.turn === localPlayerIndex);
      if (!isMyTurn) {
        panel.innerHTML = `<span style="color:#868e96;">P${gameState.turn + 1} 플레이어의 순서 진행 중...</span>`;
        return;
      }

      if (!gameState.isRolling && !gameState.isMoving && !gameState.awaitingAction) {
        const btn = document.createElement('button');
        btn.className = 'btn-action';
        btn.style.background = '#fcc419';
        btn.style.color = '#000';
        btn.innerHTML = '🎲 주사위 굴리기';
        btn.onclick = handleRollClick;
        panel.appendChild(btn);
      } else if (gameState.awaitingAction) {
        const awaiting = gameState.awaitingAction;
        const tile = TILES[awaiting.tileIdx];

        if (awaiting.type === 'BUY_PROPERTY') {
          const btnLand = document.createElement('button');
          btnLand.className = 'btn-action btn-buy';
          btnLand.innerText = `토지+별장 구매 (${tile.land + tile.villa}만)`;
          btnLand.onclick = () => sendPlayerAction({ type: 'BUY', build: ['land', 'villa'] });
          panel.appendChild(btnLand);
        } else if (awaiting.type === 'UPGRADE_PROPERTY') {
          const b = gameState.board[awaiting.tileIdx];
          if (!b.bldg) {
            const btnBldg = document.createElement('button');
            btnBldg.className = 'btn-action btn-buy';
            btnBldg.innerText = `빌딩 건설 (${tile.bldg}만)`;
            btnBldg.onclick = () => sendPlayerAction({ type: 'UPGRADE', build: ['bldg'] });
            panel.appendChild(btnBldg);
          }
          if (!b.hotel) {
            const btnHotel = document.createElement('button');
            btnHotel.className = 'btn-action btn-buy';
            btnHotel.innerText = `호텔 건설 (${tile.hotel}만)`;
            btnHotel.onclick = () => sendPlayerAction({ type: 'UPGRADE', build: ['hotel'] });
            panel.appendChild(btnHotel);
          }
        }

        const btnPass = document.createElement('button');
        btnPass.className = 'btn-action btn-danger';
        btnPass.innerText = '패스 / 턴 종료';
        btnPass.onclick = () => sendPlayerAction({ type: 'PASS' });
        panel.appendChild(btnPass);
      }
    }

    function updateStatusBoard() {
      const grid = document.getElementById('player-status-grid');
      grid.innerHTML = '';

      gameState.players.forEach((p, idx) => {
        const div = document.createElement('div');
        div.className = 'p-status' + (gameState.turn === idx ? ' active' : '');
        div.innerHTML = `
          <div><b>P${idx + 1} ${p.emoji}</b> ${p.bankrupt ? '<span style="color:#fa5252">[파산/제외]</span>' : ''}</div>
          <div>자산: <b>${p.money}만 원</b></div>
          <div>위치: ${TILES[p.pos].name}</div>
        `;
        grid.appendChild(div);
      });
    }

    updateUI();
  </script>
</body>
</html>
