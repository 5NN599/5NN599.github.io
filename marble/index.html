<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미니지 - 부루마블</title>
  <style>
    :root { --bg: #f8f9fa; --text: #333; --canvas-bg: #0f172a; --border: #e9ecef; --btn-bg: #fff; }
    [data-theme="dark"] { --bg: #0d1117; --text: #c9d1d9; --canvas-bg: #0f172a; --border: #30363d; --btn-bg: #21262d; }
    [data-theme="beige"] { --bg: #f5ebe0; --text: #4e3d30; --canvas-bg: #1e1b18; --border: #ddcbbb; --btn-bg: #eddfd0; }
    body { background-color: var(--bg) !important; color: var(--text) !important; text-align: center; font-family: sans-serif; padding-top: 10px; margin: 0; transition: 0.3s; }
    button, select { background-color: var(--btn-bg) !important; color: var(--text) !important; border: 1px solid var(--border) !important; padding: 8px 14px; font-size: 0.85rem; border-radius: 8px; cursor: pointer; margin: 2px; font-weight: bold; }
    button:hover { filter: brightness(0.95); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    select { padding: 4px 8px; cursor: pointer; font-size: 1.1rem; }
    #marble-panel { font-size: 1.1rem; font-weight: bold; color: #fcc419; margin-bottom: 8px; min-height: 1.5em; }

    .container { max-width: 960px; margin: 0 auto; padding: 16px; }
    .lobby-layout { display:grid; grid-template-columns: minmax(430px, 1fr) 330px; gap:14px; align-items:stretch; }
    .online-modal { max-width:460px; margin:0 auto; box-sizing:border-box; background:var(--btn-bg); border:1px solid var(--border); border-radius:16px; padding:20px; box-shadow:0 6px 18px rgba(0,0,0,.12); }
    .online-title { font-size:1.18rem; font-weight:800; margin-bottom:8px; }
    .network-status { min-height:1.2em; color:#868e96; font-size:.78rem; margin-bottom:12px; }
    .network-status.ok { color:#2b8a3e; }
    .online-section { border:1px solid var(--border); border-radius:12px; padding:15px; background:rgba(0,0,0,.025); }
    .online-section h4 { margin:0 0 10px; font-size:.98rem; }
    .online-primary { background:#4dabf7 !important; color:#fff !important; border:none !important; padding:9px 16px; }
    .join-row { display:flex; justify-content:center; align-items:center; gap:7px; }
    .room-input { width:145px !important; font-size:1rem !important; letter-spacing:.2em; }
    .online-secondary { padding:8px 16px; }
    .or-divider { display:flex; align-items:center; gap:10px; margin:9px 0; color:#adb5bd; font-size:.82rem; }
    .or-divider::before,.or-divider::after { content:""; flex:1; height:1px; background:var(--border); }
    .close-btn { margin-top:12px; }
    .participants-card { background:var(--btn-bg); border:1px solid var(--border); border-radius:16px; padding:20px; box-shadow:0 6px 18px rgba(0,0,0,.12); }
    .participants-title { font-size:1.08rem; font-weight:800; margin-bottom:4px; }
    .participants-count { font-size:.78rem; color:#868e96; margin-bottom:12px; }
    .participant-list { display:flex; flex-direction:column; gap:8px; }
    .participant { display:flex; justify-content:space-between; align-items:center; gap:8px; min-height:28px; padding:10px 11px; border:1px solid var(--border); border-radius:9px; background:rgba(0,0,0,.025); }
    .participant .who { display:flex; align-items:center; gap:7px; min-width:0; }
    .participant .name { font-weight:700; white-space:nowrap; }
    .participant .state { font-size:.75rem; color:#868e96; white-space:nowrap; }
    .participant.me { border-color:#4dabf7; background:rgba(77,171,247,.10); }
    @media (max-width:820px) {
      .container { max-width:680px; }
      .lobby-layout { grid-template-columns:1fr; }
      .online-modal { max-width:100%; }
    }
    .status-board { font-size: 0.8rem; margin-top: 10px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .p-status { border: 1px solid var(--border); padding: 8px; border-radius: 6px; text-align: left; background: var(--btn-bg); }
    .p-status.active { border-color: #fcc419; background: rgba(252, 196, 25, 0.08); }

    canvas { background-color: var(--canvas-bg); border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); max-width: 100%; height: auto; vertical-align: middle; }
    #action-panel { margin-top: 8px; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--btn-bg); display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
    .btn-buy { background: #40c057 !important; color: #fff !important; border: none !important; }
    .btn-danger { background: #fa5252 !important; color: #fff !important; border: none !important; }
    .btn-warn { background: #fd7e14 !important; color: #fff !important; border: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <h2 style="margin:5px 0 10px 0;">🎲 정통 40칸 부루마블</h2>

    <!-- 온라인 멀티 로비 -->
    <div id="lobby-panel" class="lobby-layout">
      <section class="online-modal">
        <div class="online-title">🌐 1:1 온라인 접속</div>
        <div id="network-status" class="network-status">P2P 연결 대기 중...</div>

        <div class="online-section">
          <h4>🏠 방 만들기 (방장)</h4>
          <button class="online-primary" onclick="createRoom()">방 번호 생성</button>
          <div id="host-room-info" style="display:none; margin-top:10px; color:#4dabf7; font-size:.86rem;">
            방 번호: <b id="host-room-code"></b>
          </div>
          <div id="host-controls" style="display:none; margin-top:10px;">
            <button onclick="startGame()" style="background:#40c057 !important; color:#fff !important; border:none !important; width:100%; padding:9px 12px;">🚀 게임 시작 (방장)</button>
          </div>
        </div>

        <div class="or-divider"><span>또는</span></div>

        <div class="online-section">
          <h4>🎮 방 참가하기 (참가자)</h4>
          <div class="join-row">
            <input id="room-code-input" class="room-input" type="text" maxlength="4" placeholder="0000" inputmode="numeric" autocomplete="off">
            <button class="online-secondary" onclick="joinRoom()">입장</button>
          </div>
        </div>

        <button class="close-btn" onclick="
          closeNetworking();
          document.getElementById('host-controls').style.display='none';
          document.getElementById('host-room-info').style.display='none';
          document.getElementById('guest-waiting').style.display='none';
          setNetworkStatus('P2P 연결 대기 중...');
          updateUI();
        ">❌ 닫기</button>

        <div id="guest-waiting" style="display:none; color:#868e96; margin-top:10px; font-size:.8rem;">
          방장이 게임을 시작하기를 기다리고 있습니다...
        </div>
      </section>

      <aside class="participants-card">
        <div class="participants-title">👥 참가자</div>
        <div id="participants-count" class="participants-count">1 / 4명 접속</div>
        <div id="participant-list" class="participant-list"></div>
      </aside>
    </div>

    <!-- 게임 진행 화면 -->
    <div id="game-panel" style="display:none;">
      <div id="marble-panel">게임 준비 중...</div>
      
      <canvas id="boardCanvas" width="660" height="660"></canvas>

      <div id="action-panel"></div>

      <div id="player-status-grid" class="status-board"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script>
    const EMOJI_OPTIONS = ["🎈", "🚗", "🚀", "💎", "🦁", "🐱", "🐶", "🦊", "👑", "⚡", "🔥", "🍀", "🤖", "👻", "🦄", "⚽"];

    let audioCtx = null;
    function initAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (_) {}
    }

    function playSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        if (type === 'roll') {
          const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(180 + Math.random() * 100, now);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.04);
        } else if (type === 'buy') {
          [523, 659, 783, 1046].forEach((f, i) => {
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            const t = now + i * 0.05;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, t);
            gain.gain.setValueAtTime(0.08, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(t); osc.stop(t + 0.1);
          });
        } else if (type === 'rent') {
          const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(60, now + 0.25);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.25);
        }
      } catch (_) {}
    }

      /* 25 */ { name: "황금열쇠", type: "key", icon: "🔑" },
      /* 26 */ { name: "파리", type: "city", land: 40, villa: 30, bldg: 90, hotel: 150, rLand: 35, rVilla: 110, rBldg: 270, rHotel: 500, icon: "🇫🇷" },
      /* 27 */ { name: "로마", type: "city", land: 40, villa: 30, bldg: 90, hotel: 150, rLand: 35, rVilla: 110, rBldg: 270, rHotel: 500, icon: "🇮🇹" },

      /* 30 */ { name: "우주여행", type: "space", icon: "🚀" },
      /* 31 */ { name: "콩코드", type: "city", land: 50, villa: 35, bldg: 100, hotel: 180, rLand: 45, rVilla: 130, rBldg: 330, rHotel: 600, icon: "✈️" },
      /* 32 */ { name: "모스크바", type: "city", land: 55, villa: 35, bldg: 100, hotel: 180, rLand: 50, rVilla: 140, rBldg: 360, rHotel: 650, icon: "🇷🇺" },
      /* 33 */ { name: "태평양호", type: "city", land: 60, villa: 35, bldg: 100, hotel: 180, rLand: 55, rVilla: 150, rBldg: 390, rHotel: 700, icon: "🚢" },
      /* 34 */ { name: "컬럼비아", type: "city", land: 65, villa: 40, bldg: 120, hotel: 200, rLand: 60, rVilla: 170, rBldg: 430, rHotel: 800, icon: "🛰️" },
      /* 35 */ { name: "황금열쇠", type: "key", icon: "🔑" },
      /* 36 */ { name: "제네바", type: "city", land: 70, villa: 40, bldg: 120, hotel: 200, rLand: 65, rVilla: 180, rBldg: 460, rHotel: 850, icon: "🇨🇭" },
      /* 37 */ { name: "몬트리올", type: "city", land: 75, villa: 40, bldg: 120, hotel: 200, rLand: 70, rVilla: 190, rBldg: 490, rHotel: 900, icon: "🇨🇦" },
      /* 38 */ { name: "황금열쇠", type: "key", icon: "🔑" },
      /* 39 */ { name: "서울", type: "city", land: 100, villa: 50, bldg: 150, hotel: 250, rLand: 100, rVilla: 300, rBldg: 700, rHotel: 1200, icon: "🇰🇷" }
    ];

    const TILE_POS = [];
    const S = 60;
    for (let i = 10; i >= 0; i--) TILE_POS.push({ x: i * S, y: 10 * S });
    for (let j = 9; j >= 1; j--) TILE_POS.push({ x: 0, y: j * S });
    for (let i = 0; i <= 10; i++) TILE_POS.push({ x: i * S, y: 0 });
    for (let j = 1; j <= 9; j++) TILE_POS.push({ x: 10 * S, y: j * S });

    const PLAYER_CONFIG = [
      { name: "P1", color: "#ff6b6b" },
      { name: "P2", color: "#4dabf7" },
      { name: "P3", color: "#51cf66" },
      { name: "P4", color: "#fcc419" }
    ];

    let roomCode = "";
    let localPlayerIndex = -1;
    let isHost = false;
    let peer = null;
    let hostConnection = null;
    let myClientId = "";
    const connections = new Map();
    let stateSeq = 0;
    let rollTimer = null;
    let moveTimer = null;
    let aiTimer = null;

    const PEER_OPTIONS = {
      debug: 1,
      config: { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] }
    };

    let gameState = makeInitialState();

    function makeInitialState() {
      return {
        status: "lobby",
        roomCode: "",
        turn: 0,
        dice1: 1,
        dice2: 1,
        isDouble: false,
        doubleCount: 0,
        isRolling: false,
        isMoving: false,
        awaitingAction: null,
        socialFundPool: 0,
        message: "방장이 게임을 시작하기를 기다립니다.",
        players: [
          { id: null, name: "P1", emoji: "🎈", isAI: true, money: 300, pos: 0, islandTurns: 0, bankrupt: false },
          { id: null, name: "P2", emoji: "🚗", isAI: true, money: 300, pos: 0, islandTurns: 0, bankrupt: false },
          { id: null, name: "P3", emoji: "🚀", isAI: true, money: 300, pos: 0, islandTurns: 0, bankrupt: false },
          { id: null, name: "P4", emoji: "💎", isAI: true, money: 300, pos: 0, islandTurns: 0, bankrupt: false }
        ],
        board: TILES.map(() => ({ owner: -1, villa: false, bldg: false, hotel: false }))
      };
    }

    function setNetworkStatus(text, ok = false) {
      const el = document.getElementById('network-status');
      if (!el) return;
      el.textContent = text;
      el.classList.toggle('ok', !!ok);
    }

    function normalizeRoomCode(value) {
      const code = String(value || '').replace(/\D/g, '').slice(0, 4);
      return code.length === 4 ? code : '';
    }

    function hostPeerId(code) {
      return `minig-host-${code}`;
    }

    function cloneState() {
      return JSON.parse(JSON.stringify(gameState));
    }

    function clearTimers() {
      if (rollTimer) { clearInterval(rollTimer); rollTimer = null; }
      if (moveTimer) { clearInterval(moveTimer); moveTimer = null; }
      if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
      gameState.isRolling = false;
      gameState.isMoving = false;
    }

    function closeNetworking() {
      clearTimers();
      for (const conn of connections.values()) { try { conn.close(); } catch (_) {} }
      connections.clear();
      if (hostConnection) { try { hostConnection.close(); } catch (_) {} hostConnection = null; }
      if (peer) { try { peer.destroy(); } catch (_) {} peer = null; }
      myClientId = '';
    }

    function createRoom() {
      initAudio();
      closeNetworking();
      const input = normalizeRoomCode(document.getElementById('room-code-input').value);
      roomCode = input || String(Math.floor(1000 + Math.random() * 9000));
      document.getElementById('room-code-input').value = roomCode;
      isHost = true;
      localPlayerIndex = 0;
      gameState = makeInitialState();
      gameState.roomCode = roomCode;
      gameState.players[0].id = null;
      gameState.players[0].isAI = false;

      document.getElementById('host-room-info').style.display = 'block';
      document.getElementById('host-room-code').innerText = roomCode;
      document.getElementById('host-controls').style.display = 'block';
      document.getElementById('guest-waiting').style.display = 'none';
      setNetworkStatus('P2P 방을 만드는 중...', false);
      updateUI();

      if (typeof Peer === 'undefined') {
        setNetworkStatus('PeerJS 로딩 실패', false);
        return;
      }

      peer = new Peer(hostPeerId(roomCode), PEER_OPTIONS);
      peer.on('open', id => {
        myClientId = id;
        gameState.players[0].id = id;
        setNetworkStatus(`P2P 방 개설 완료 · 방 번호 ${roomCode}`, true);
        syncStateToNetwork();
      });
      peer.on('connection', conn => attachGuestConnection(conn));
      peer.on('error', err => setNetworkStatus(`P2P 오류: ${err?.type || '연결 오류'}`, false));
    }

    function joinRoom() {
      initAudio();
      closeNetworking();
      const code = normalizeRoomCode(document.getElementById('room-code-input').value);
      if (!code) { alert('방 번호 4자리를 입력해주세요!'); return; }
      roomCode = code;
      isHost = false;
      localPlayerIndex = -1;
      gameState = makeInitialState();
      gameState.roomCode = roomCode;
      document.getElementById('host-room-info').style.display = 'block';
      document.getElementById('host-room-code').innerText = roomCode;
      document.getElementById('host-controls').style.display = 'none';
      document.getElementById('guest-waiting').style.display = 'block';
      setNetworkStatus('방장에게 P2P 연결 중...', false);
      updateUI();

      peer = new Peer(null, PEER_OPTIONS);
      peer.on('open', id => {
        myClientId = id;
        const conn = peer.connect(hostPeerId(roomCode), { reliable: true, serialization: 'json', metadata: { clientId: id } });
        attachHostConnection(conn);
      });
      peer.on('error', err => setNetworkStatus(`P2P 연결 실패`, false));
    }

    function attachHostConnection(conn) {
      if (hostConnection && hostConnection !== conn) { try { hostConnection.close(); } catch (_) {} }
      hostConnection = conn;
      conn.on('open', () => {
        setNetworkStatus('방장과 P2P 연결됨', true);
        conn.send({ type: 'HELLO', clientId: myClientId });
      });
      conn.on('data', data => handleHostData(conn, data));
      conn.on('close', () => setNetworkStatus('방장과의 연결이 끊겼습니다.', false));
    }

    function attachGuestConnection(conn) {
      conn.on('open', () => {
        const clientId = conn.metadata?.clientId || conn.peer;
        connections.set(clientId, conn);
        setNetworkStatus('플레이어 P2P 연결됨', true);
        conn.send({ type: 'JOIN_REQUEST', clientId });
      });
      conn.on('data', data => handleGuestData(data));
      conn.on('close', () => handleGuestDisconnect(conn));
    }

    function handleGuestDisconnect(conn) {
      const clientId = conn.metadata?.clientId || [...connections.entries()].find(([, c]) => c === conn)?.[0];
      if (!clientId) return;
      connections.delete(clientId);
      const idx = gameState.players.findIndex(p => p.id === clientId);
      if (idx !== -1) {
        gameState.players[idx].id = null;
        gameState.players[idx].isAI = true;
        gameState.message = `P${idx + 1} 플레이어가 연결 해제되어 AI로 전환되었습니다.`;
        syncStateToNetwork();
        checkTurnAndAI();
      }
    }

    function sendToHost(message) {
      if (!hostConnection || !hostConnection.open) return false;
      try { hostConnection.send(message); return true; } catch (_) { return false; }
    }

    function broadcastToGuests(message) {
      for (const [clientId, conn] of connections.entries()) {
        if (!conn || !conn.open) continue;
        try { conn.send(message); } catch (_) { connections.delete(clientId); }
      }
    }

    function syncStateToNetwork() {
      updateUI();
      if (!isHost || !peer || !peer.open) return;
      stateSeq++;
      broadcastToGuests({ type: 'STATE_UPDATE', seq: stateSeq, state: cloneState() });
    }

    function handleHostData(conn, data) {
      if (!data || isHost) return;
      if (data.type === 'JOIN_RESPONSE') {
        localPlayerIndex = Number(data.slotIndex);
        setNetworkStatus(`P2P 연결 완료 · P${localPlayerIndex + 1}`, true);
        updateUI();
        return;
      }
      if (data.type === 'STATE_UPDATE' && data.state) {
        gameState = data.state;
        updateUI();
      }
    }

    function handleGuestData(data) {
      if (!data || !isHost) return;
      if (data.type === 'JOIN_REQUEST') {
        const clientId = String(data.clientId || '').trim();
        let slot = gameState.players.findIndex(p => p.id === clientId);
        if (slot === -1 && gameState.status === 'lobby') {
          slot = gameState.players.findIndex((p, idx) => idx > 0 && p.isAI && p.id === null);
          if (slot !== -1) {
            gameState.players[slot].isAI = false;
            gameState.players[slot].id = clientId;
          }
        }
        const conn = [...connections.entries()].find(([id]) => id === clientId)?.[1];
        if (slot !== -1 && conn) {
          try {
            conn.send({ type: 'JOIN_RESPONSE', slotIndex: slot, clientId });
            conn.send({ type: 'STATE_UPDATE', seq: stateSeq, state: cloneState() });
          } catch (_) {}
          gameState.message = `P${slot + 1} 플레이어가 참가했습니다.`;
          syncStateToNetwork();
        }
        return;
      }

      if (data.type === 'CHANGE_EMOJI') {
        const idx = gameState.players.findIndex(p => p.id === data.clientId);
        if (idx !== -1 && gameState.status === 'lobby' && EMOJI_OPTIONS.includes(data.emoji)) {
          gameState.players[idx].emoji = data.emoji;
          syncStateToNetwork();
        }
        return;
      }

      if (data.type === 'ROLL_REQUEST') {
        const idx = gameState.players.findIndex(p => p.id === data.clientId);
        if (idx === gameState.turn) handleRollClick();
        return;
      }

      if (data.type === 'ACTION_TRIGGER') {
        const idx = gameState.players.findIndex(p => p.id === data.clientId);
        if (idx === gameState.turn) handleHostAction(idx, data.action, data.param);
      }
    }

    function requestEmojiChange(newEmoji) {
      if (localPlayerIndex < 0) return;
      if (isHost) {
        if (gameState.status === 'lobby' && EMOJI_OPTIONS.includes(newEmoji)) {
          gameState.players[localPlayerIndex].emoji = newEmoji;
          syncStateToNetwork();
        }
      } else {
        sendToHost({ type: 'CHANGE_EMOJI', clientId: myClientId, emoji: newEmoji });
      }
    }

    function startGame() {
      if (!isHost || !peer?.open || gameState.status !== 'lobby') return;
      gameState.status = 'playing';
      gameState.turn = 0;
      gameState.message = `게임 시작! P1(${gameState.players[0].emoji})의 순서입니다.`;
      syncStateToNetwork();
      checkTurnAndAI();
    }

    // --- 게임 플레이 제어 엔진 ---

    function handleRollClick() {
      if (gameState.isRolling || gameState.isMoving) return;
      if (!isHost) {
        sendToHost({ type: 'ROLL_REQUEST', clientId: myClientId });
        return;
      }
      triggerDiceRoll();
    }

    function triggerDiceRoll() {
      if (gameState.isRolling || gameState.isMoving) return;
      clearTimers();
      gameState.isRolling = true;
      gameState.awaitingAction = null;
      let count = 0;

      rollTimer = setInterval(() => {
        gameState.dice1 = Math.floor(Math.random() * 6) + 1;
        gameState.dice2 = Math.floor(Math.random() * 6) + 1;
        playSound('roll');
        syncStateToNetwork();
        count++;
        if (count >= 10) {
          clearInterval(rollTimer);
          rollTimer = null;
          gameState.isRolling = false;
          gameState.isDouble = (gameState.dice1 === gameState.dice2);
          if (gameState.isDouble) gameState.doubleCount++;
          else gameState.doubleCount = 0;

          processMove(gameState.turn, gameState.dice1 + gameState.dice2);
        }
      }, 70);
    }

    function processMove(pIdx, totalSteps) {
      const p = gameState.players[pIdx];
      if (p.islandTurns > 0) {
        if (gameState.isDouble) {
          p.islandTurns = 0;
          gameState.message = `더블! ${p.name}이(가) 무인도를 탈출했습니다.`;
        } else {
          p.islandTurns--;
          gameState.message = `${p.name}이(가) 무인도에서 대기 중입니다. (남은 턴: ${p.islandTurns})`;
          syncStateToNetwork();
          setTimeout(passTurn, 1200);
          return;
        }
      }

      gameState.isMoving = true;
      let stepCount = 0;

      moveTimer = setInterval(() => {
        p.pos = (p.pos + 1) % 40;
        if (p.pos === 0) {
          p.money += 20; // 월급
          gameState.message = `${p.name}이(가) 출발지를 통과하여 월급 20만원을 받았습니다!`;
        }
        playSound('roll');
        syncStateToNetwork();
        stepCount++;

        if (stepCount >= totalSteps) {
          clearInterval(moveTimer);
          moveTimer = null;
          gameState.isMoving = false;
          resolveTile(pIdx, p.pos);
        }
      }, 150);
    }

    function resolveTile(pIdx, pos) {
      const p = gameState.players[pIdx];
      const tile = TILES[pos];

      if (tile.type === 'city') {
        const boardTile = gameState.board[pos];
        if (boardTile.owner === -1) {
          gameState.awaitingAction = { type: 'buy', tileIdx: pos, cost: tile.land };
          gameState.message = `${tile.name}에 도착! 토지를 구매하시겠습니까? (${tile.land}만원)`;
        } else if (boardTile.owner !== pIdx) {
          const owner = gameState.players[boardTile.owner];
          let rent = tile.rLand;
          if (boardTile.villa) rent += tile.rVilla;
          if (boardTile.bldg) rent += tile.rBldg;
          if (boardTile.hotel) rent += tile.rHotel;

          p.money -= rent;
          owner.money += rent;
          playSound('rent');
          gameState.message = `${tile.name}에 도착! ${owner.name}에게 통행료 ${rent}만원을 지불했습니다.`;
          checkBankruptcy(pIdx);
          setTimeout(passTurn, 1500);
        } else {
          gameState.awaitingAction = { type: 'upgrade', tileIdx: pos };
          gameState.message = `내 소유의 ${tile.name}에 도착했습니다. 건물을 추가 건설하시겠습니까?`;
        }
      } else if (tile.type === 'island') {
        p.islandTurns = 3;
        gameState.message = `${p.name}이(가) 무인도에 갇혔습니다! (3턴 대기)`;
        setTimeout(passTurn, 1500);
      } else if (tile.type === 'tax') {
        const tax = Math.min(Math.floor(p.money * 0.1), 30);
        p.money -= tax;
        gameState.socialFundPool += tax;
        gameState.message = `${p.name}이(가) 복지기금 ${tax}만원을 기부했습니다.`;
        checkBankruptcy(pIdx);
        setTimeout(passTurn, 1500);
      } else if (tile.type === 'fund_get') {
        p.money += gameState.socialFundPool;
        gameState.message = `${p.name}이(가) 적립된 복지기금 ${gameState.socialFundPool}만원을 모두 수령했습니다!`;
        gameState.socialFundPool = 0;
        setTimeout(passTurn, 1500);
      } else if (tile.type === 'space') {
        gameState.awaitingAction = { type: 'space_travel' };
        gameState.message = `${p.name}이(가) 우주여행에 도착했습니다! 원하는 곳으로 이동할 수 있습니다.`;
      } else if (tile.type === 'key') {
        const bonus = (Math.floor(Math.random() * 5) + 1) * 10;
        p.money += bonus;
        gameState.message = `🔑 황금열쇠: 복권 당첨! 축하금 ${bonus}만원을 받았습니다.`;
        setTimeout(passTurn, 1500);
      } else {
        setTimeout(passTurn, 1200);
      }
      syncStateToNetwork();
      checkTurnAndAI();
    }

    function sendPlayerAction(action, param) {
      if (isHost) handleHostAction(localPlayerIndex, action, param);
      else sendToHost({ type: 'ACTION_TRIGGER', clientId: myClientId, action, param });
    }

    function handleHostAction(pIdx, action, param) {
      if (pIdx !== gameState.turn) return;
      const p = gameState.players[pIdx];

      if (action === 'buy_land') {
        const tileIdx = p.pos;
        const tile = TILES[tileIdx];
        if (p.money >= tile.land) {
          p.money -= tile.land;
          gameState.board[tileIdx].owner = pIdx;
          playSound('buy');
          gameState.message = `${p.name}이(가) ${tile.name} 토지를 구매했습니다!`;
        }
      } else if (action === 'upgrade') {
        const tileIdx = p.pos;
        const tile = TILES[tileIdx];
        const b = gameState.board[tileIdx];
        if (param === 'villa' && !b.villa && p.money >= tile.villa) {
          p.money -= tile.villa; b.villa = true; playSound('buy');
        } else if (param === 'bldg' && !b.bldg && p.money >= tile.bldg) {
          p.money -= tile.bldg; b.bldg = true; playSound('buy');
        } else if (param === 'hotel' && !b.hotel && p.money >= tile.hotel) {
          p.money -= tile.hotel; b.hotel = true; playSound('buy');
        }
      } else if (action === 'space_travel') {
        p.pos = Number(param) || 0;
        gameState.awaitingAction = null;
        resolveTile(pIdx, p.pos);
        return;
      }

      gameState.awaitingAction = null;
      syncStateToNetwork();
      passTurn();
    }

    function checkBankruptcy(pIdx) {
      const p = gameState.players[pIdx];
      if (p.money < 0) {
        p.bankrupt = true;
        p.money = 0;
        gameState.board.forEach(b => { if (b.owner === pIdx) { b.owner = -1; b.villa = b.bldg = b.hotel = false; } });
        gameState.message = `💥 ${p.name}이(가) 파산했습니다!`;
      }
    }

    function passTurn() {
      clearTimers();
      gameState.awaitingAction = null;
      const activePlayers = gameState.players.filter(p => !p.bankrupt);
      if (activePlayers.length <= 1) {
        gameState.status = 'ended';
        gameState.message = `🏆 축하합니다! ${activePlayers[0]?.name || '누군가'}의 최종 승리!`;
        syncStateToNetwork();
        return;
      }

      do {
        gameState.turn = (gameState.turn + 1) % 4;
      } while (gameState.players[gameState.turn].bankrupt);

      gameState.message = `P${gameState.turn + 1}(${gameState.players[gameState.turn].emoji})의 순서입니다.`;
      syncStateToNetwork();
      checkTurnAndAI();
    }

    function checkTurnAndAI() {
      if (!isHost || gameState.status !== 'playing') return;
      const curP = gameState.players[gameState.turn];
      if (curP.isAI && !gameState.isRolling && !gameState.isMoving) {
        if (aiTimer) clearTimeout(aiTimer);
        aiTimer = setTimeout(() => {
          if (!gameState.awaitingAction) {
            triggerDiceRoll();
          } else {
            if (gameState.awaitingAction.type === 'buy') {
              handleHostAction(gameState.turn, 'buy_land');
            } else {
              handleHostAction(gameState.turn, 'pass');
            }
          }
        }, 1200);
      }
    }

    // --- 화면 렌더링 ---

    function renderParticipants() {
      const el = document.getElementById('participant-list');
      const countEl = document.getElementById('participants-count');
      if (!el) return;
      el.innerHTML = '';
      let connectedCount = 0;

      gameState.players.forEach((p, idx) => {
        if (!p.isAI) connectedCount++;
        const div = document.createElement('div');
        div.className = 'participant' + (idx === localPlayerIndex ? ' me' : '');
        let nameText = p.isAI ? '🤖 AI 컴퓨터' : (idx === localPlayerIndex ? '나 (접속됨)' : `플레이어 ${idx+1}`);
        let stateText = p.isAI ? 'AI' : (p.id ? '연결됨' : '대기중');

        let selectHtml = (idx === localPlayerIndex && gameState.status === 'lobby') ?
          `<select onchange="requestEmojiChange(this.value)">${EMOJI_OPTIONS.map(e => `<option value="${e}" ${e === p.emoji ? 'selected' : ''}>${e}</option>`).join('')}</select>` :
          `<span style="font-size:1.2rem">${p.emoji}</span>`;

        div.innerHTML = `<div class="who">${selectHtml}<div style="text-align:left;"><div class="name">P${idx+1} · ${nameText}</div><div class="state">${stateText}</div></div></div>`;
        el.appendChild(div);
      });

      if (countEl) countEl.innerText = `${connectedCount} / 4명 접속`;
    }

    function drawBoard() {
      const canvas = document.getElementById('boardCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 보드 타일 그리기
      TILES.forEach((tile, i) => {
        const pos = TILE_POS[i];
        const b = gameState.board[i];
        ctx.strokeStyle = '#30363d';
        ctx.lineWidth = 1;
        ctx.strokeRect(pos.x, pos.y, S, S);

        // 소유주 배경색
        if (b && b.owner !== -1) {
          ctx.fillStyle = PLAYER_CONFIG[b.owner].color + '33';
          ctx.fillRect(pos.x, pos.y, S, S);
        }

        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(tile.icon, pos.x + S / 2, pos.y + 24);

        ctx.fillStyle = '#ffffff';
        ctx.font = '10px sans-serif';
        ctx.fillText(tile.name, pos.x + S / 2, pos.y + 42);

        // 건물 표시
        if (b && (b.villa || b.bldg || b.hotel)) {
          let str = (b.villa ? '🏡' : '') + (b.bldg ? '🏢' : '') + (b.hotel ? '🏰' : '');
          ctx.font = '9px sans-serif';
          ctx.fillText(str, pos.x + S / 2, pos.y + 54);
        }
      });

      // 중앙 주사위 및 상태 정보
      ctx.fillStyle = '#fcc419';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`🎲 ${gameState.dice1}  +  🎲 ${gameState.dice2}`, 330, 310);
      ctx.fillStyle = '#adb5bd';
      ctx.font = '14px sans-serif';
      ctx.fillText(`🏛️ 복지기금: ${gameState.socialFundPool}만원`, 330, 350);

      // 플레이어 말 그리기
      gameState.players.forEach((p, idx) => {
        if (p.bankrupt) return;
        const pos = TILE_POS[p.pos];
        const offsetX = (idx % 2) * 22 + 14;
        const offsetY = Math.floor(idx / 2) * 22 + 14;
        ctx.font = '18px sans-serif';
        ctx.fillText(p.emoji, pos.x + offsetX, pos.y + offsetY);
      });
    }

    function renderStatusGrid() {
      const grid = document.getElementById('player-status-grid');
      if (!grid) return;
      grid.innerHTML = '';
      gameState.players.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = 'p-status' + (idx === gameState.turn ? ' active' : '');
        card.style.borderLeft = `4px solid ${PLAYER_CONFIG[idx].color}`;
        card.innerHTML = `
          <div><b>P${idx+1} ${p.emoji} ${p.name}</b> ${p.isAI ? '🤖' : ''}</div>
          <div>자산: <b>${p.bankrupt ? '파산' : p.money + '만원'}</b></div>
          <div style="font-size:0.75rem; color:#868e96;">위치: ${TILES[p.pos].name}</div>
        `;
        grid.appendChild(card);
      });
    }

    function renderActionPanel() {
      const panel = document.getElementById('action-panel');
      if (!panel) return;
      panel.innerHTML = '';

      const isMyTurn = (gameState.turn === localPlayerIndex) || (isHost && gameState.players[gameState.turn].isAI);

      if (gameState.status === 'playing') {
        if (!gameState.awaitingAction) {
          const btn = document.createElement('button');
          btn.id = 'btn-roll';
          btn.style.cssText = 'background:#fcc419 !important; color:#000 !important; font-size:1rem; padding:8px 18px;';
          btn.innerText = '🎲 주사위 2개 굴리기';
          btn.disabled = !isMyTurn || gameState.isRolling || gameState.isMoving;
          btn.onclick = handleRollClick;
          panel.appendChild(btn);
        } else if (isMyTurn) {
          const act = gameState.awaitingAction;
          if (act.type === 'buy') {
            panel.innerHTML = `
              <button class="btn-buy" onclick="sendPlayerAction('buy_land')">🏢 땅 구매 (${act.cost}만원)</button>
              <button class="btn-warn" onclick="sendPlayerAction('pass')">SKIP 패스</button>
            `;
          } else if (act.type === 'upgrade') {
            const tile = TILES[act.tileIdx];
            panel.innerHTML = `
              <button class="btn-buy" onclick="sendPlayerAction('upgrade', 'villa')">🏡 빌라 (${tile.villa}만)</button>
              <button class="btn-buy" onclick="sendPlayerAction('upgrade', 'bldg')">🏢 빌딩 (${tile.bldg}만)</button>
              <button class="btn-buy" onclick="sendPlayerAction('upgrade', 'hotel')">🏰 호텔 (${tile.hotel}만)</button>
              <button class="btn-warn" onclick="sendPlayerAction('pass')">턴 종료</button>
            `;
          } else if (act.type === 'space_travel') {
            let options = TILES.map((t, idx) => `<option value="${idx}">${idx}. ${t.name}</option>`).join('');
            panel.innerHTML = `
              <select id="space-dest">${options}</select>
              <button class="btn-buy" onclick="sendPlayerAction('space_travel', document.getElementById('space-dest').value)">🚀 이동하기</button>
            `;
          }
        }
      }
    }

    function updateUI() {
      const lobbyPanel = document.getElementById('lobby-panel');
      const gamePanel = document.getElementById('game-panel');
      const marblePanel = document.getElementById('marble-panel');

      if (gameState.status === 'lobby') {
        if (lobbyPanel) lobbyPanel.style.display = 'grid';
        if (gamePanel) gamePanel.style.display = 'none';
        renderParticipants();
      } else {
        if (lobbyPanel) lobbyPanel.style.display = 'none';
        if (gamePanel) gamePanel.style.display = 'block';
        if (marblePanel) marblePanel.innerText = gameState.message;

        renderParticipants();
        drawBoard();
        renderStatusGrid();
        renderActionPanel();
      }
    }

    // 초기 UI 초기화 실행
    updateUI();
  </script>
</body>
</html>
