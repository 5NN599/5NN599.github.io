<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정통 부루마블 - 6자리 실시간 멀티</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; --border: #334155; }
    body { background-color: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; margin: 0; padding: 16px; }
    .container { max-width: 980px; margin: 0 auto; }
    
    /* 로비 스타일 */
    .net-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 480px; margin: 20px auto; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .room-display { font-size: 1.8rem; font-weight: 800; letter-spacing: 4px; color: var(--accent); margin: 10px 0; }
    input.room-input { font-size: 1.4rem; letter-spacing: 4px; text-align: center; width: 160px; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: #020617; color: #fff; }
    button { background: var(--card); color: #fff; border: 1px solid var(--border); padding: 10px 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; margin: 4px; }
    button:hover { background: #334155; }
    button.primary { background: #0284c7; border: none; }
    button.primary:hover { background: #0369a1; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* 게임 보드 및 상태 */
    #game-layout { display: none; margin-top: 15px; }
    canvas { background: #020617; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); max-width: 100%; height: auto; }
    .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 15px; }
    .player-card { background: var(--card); border: 2px solid var(--border); border-radius: 8px; padding: 10px; text-align: left; }
    .player-card.active { border-color: #f59e0b; background: #1e1b4b; }
    .action-bar { margin-top: 12px; background: var(--card); padding: 12px; border-radius: 8px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .log-msg { font-size: 1.1rem; color: #f59e0b; font-weight: bold; min-height: 1.5em; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🎲 6자리 검증 멀티 부루마블</h2>

    <!-- 멀티플레이 접속 로비 -->
    <div id="net-lobby" class="net-box">
      <div id="net-status" style="color:#94a3b8; font-size:0.9rem; margin-bottom:12px;">P2P 네트워크 준비 중...</div>
      
      <div style="border-bottom:1px solid var(--border); padding-bottom:15px; margin-bottom:15px;">
        <button class="primary" onclick="netManager.createRoom()">🏠 6자리 방 만들기 (방장)</button>
        <div id="host-code-wrap" style="display:none;" class="room-display">CODE: <span id="display-room-code">------</span></div>
        <div id="host-start-wrap" style="display:none; margin-top:10px;">
          <button class="primary" style="background:#16a34a; width:100%;" onclick="netManager.startGame()">🚀 게임 시작</button>
        </div>
      </div>

      <div>
        <div style="margin-bottom:8px; font-size:0.95rem;">🎮 방 참가하기</div>
        <input type="text" id="join-code-input" class="room-input" maxlength="6" placeholder="000000" inputmode="numeric">
        <button onclick="netManager.joinRoom()">입장</button>
      </div>

      <div id="player-list-preview" style="margin-top:20px; font-size:0.85rem; color:#cbd5e1; text-align:left;">
        <b>참가자 목록:</b> <span id="connected-count">1</span>/4명
        <ul id="peer-list-ul" style="padding-left:20px; margin:5px 0 0 0;"></ul>
      </div>
    </div>

    <!-- 실제 게임 실행 메인 판 -->
    <div id="game-layout">
      <div id="game-log" class="log-msg">게임을 대기 중입니다.</div>
      <canvas id="boardCanvas" width="660" height="660"></canvas>
      <div id="action-controls" class="action-bar"></div>
      <div id="players-status" class="status-grid"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script>
    // ----------------------------------------------------
    // 1. 보드 및 게임 데이터 정의
    // ----------------------------------------------------
    const TILES = [
      { name: "출발지", type: "start", icon: "🚩" },
      { name: "타이베이", type: "city", land: 5, rLand: 2, icon: "🇹🇼" },
      { name: "홍콩", type: "city", land: 8, rLand: 4, icon: "🇭🇰" },
      { name: "마닐라", type: "city", land: 8, rLand: 4, icon: "🇵🇭" },
      { name: "싱가포르", type: "city", land: 10, rLand: 6, icon: "🇸🇬" },
      { name: "황금열쇠", type: "key", icon: "🔑" },
      { name: "카이로", type: "city", land: 14, rLand: 10, icon: "🇪🇬" },
      { name: "이스탄불", type: "city", land: 16, rLand: 12, icon: "🇹🇷" },
      { name: "아테네", type: "city", land: 16, rLand: 12, icon: "🇬🇷" },
      { name: "복지기금", type: "tax", icon: "🏛️" },
      { name: "무인도", type: "island", icon: "🏝️" },
      { name: "코펜하겐", type: "city", land: 20, rLand: 16, icon: "🇩🇰" },
      { name: "스톡홀름", type: "city", land: 22, rLand: 18, icon: "🇸🇪" },
      { name: "베른", type: "city", land: 22, rLand: 18, icon: "🇨🇭" },
      { name: "베를린", type: "city", land: 24, rLand: 20, icon: "🇩🇪" },
      { name: "황금열쇠", type: "key", icon: "🔑" },
      { name: "오타와", type: "city", land: 26, rLand: 22, icon: "🇨🇦" },
      { name: "부에노스", type: "city", land: 28, rLand: 24, icon: "🇦🇷" },
      { name: "상파울루", type: "city", land: 28, rLand: 24, icon: "🇧🇷" },
      { name: "시드니", type: "city", land: 30, rLand: 26, icon: "🇦🇺" },
      { name: "기금수령", type: "fund_get", icon: "💰" },
      { name: "하와이", type: "city", land: 32, rLand: 28, icon: "🌺" },
      { name: "리스본", type: "city", land: 32, rLand: 28, icon: "🇵🇹" },
      { name: "마드리드", type: "city", land: 35, rLand: 30, icon: "🇪🇸" },
      { name: "도쿄", type: "city", land: 35, rLand: 30, icon: "🇯🇵" },
      { name: "황금열쇠", type: "key", icon: "🔑" },
      { name: "파리", type: "city", land: 40, rLand: 35, icon: "🇫🇷" },
      { name: "로마", type: "city", land: 40, rLand: 35, icon: "🇮🇹" },
      { name: "런던", type: "city", land: 45, rLand: 40, icon: "🇬🇧" },
      { name: "뉴욕", type: "city", land: 45, rLand: 40, icon: "🇺🇸" },
      { name: "우주여행", type: "space", icon: "🚀" },
      { name: "콩코드", type: "city", land: 50, rLand: 45, icon: "✈️" },
      { name: "모스크바", type: "city", land: 55, rLand: 50, icon: "🇷🇺" },
      { name: "태평양호", type: "city", land: 60, rLand: 55, icon: "🚢" },
      { name: "컬럼비아", type: "city", land: 65, rLand: 60, icon: "🛰️" },
      { name: "황금열쇠", type: "key", icon: "🔑" },
      { name: "제네바", type: "city", land: 70, rLand: 65, icon: "🇨🇭" },
      { name: "몬트리올", type: "city", land: 75, rLand: 70, icon: "🇨🇦" },
      { name: "황금열쇠", type: "key", icon: "🔑" },
      { name: "서울", type: "city", land: 100, rLand: 100, icon: "🇰🇷" }
    ];

    const TILE_POS = [];
    const S = 60;
    for (let i = 10; i >= 0; i--) TILE_POS.push({ x: i * S, y: 10 * S });
    for (let j = 9; j >= 1; j--) TILE_POS.push({ x: 0, y: j * S });
    for (let i = 0; i <= 10; i++) TILE_POS.push({ x: i * S, y: 0 });
    for (let j = 1; j <= 9; j++) TILE_POS.push({ x: 10 * S, y: j * S });

    const PLAYER_COLORS = ["#ef4444", "#3b82f6", "#22c55e", "#eab308"];
    const EMOJIS = ["🚗", "🚀", "💎", "👑"];

    // ----------------------------------------------------
    // 2. 호스트 중심 중앙집권형 멀티플레이 엔진 (Proven P2P)
    // ----------------------------------------------------
    class NetworkManager {
      constructor() {
        this.peer = null;
        this.isHost = false;
        this.mySlot = -1;
        this.roomCode = "";
        this.connections = new Map(); // Host전용: clientPeerId -> DataConnection
        this.hostConn = null;          // Guest전용: DataConnection
        
        // 동기화 원본 데이터 (State)
        this.state = {
          status: 'LOBBY', // LOBBY, PLAYING, ENDED
          turn: 0,
          dice: [1, 1],
          fundPool: 0,
          log: '방장이 게임을 시작하기를 기다리고 있습니다.',
          awaitingAction: null, // { type: 'BUY', tileIdx: 1, cost: 5 }
          players: [
            { id: null, name: "P1", emoji: EMOJIS[0], money: 300, pos: 0, bankrupt: false, isAI: true },
            { id: null, name: "P2", emoji: EMOJIS[1], money: 300, pos: 0, bankrupt: false, isAI: true },
            { id: null, name: "P3", emoji: EMOJIS[2], money: 300, pos: 0, bankrupt: false, isAI: true },
            { id: null, name: "P4", emoji: EMOJIS[3], money: 300, pos: 0, bankrupt: false, isAI: true }
          ],
          board: TILES.map(() => ({ owner: -1 }))
        };
      }

      getRoomPeerId(code) {
        return `bm-room6-${code}`;
      }

      setStatusText(txt) {
        document.getElementById('net-status').innerText = txt;
      }

      // [호스트] 6자리 방 생성
      createRoom() {
        const code = String(Math.floor(100000 + Math.random() * 900000));
        this.roomCode = code;
        this.isHost = true;
        this.mySlot = 0;

        this.state.players[0].id = 'HOST';
        this.state.players[0].isAI = false;

        this.setStatusText(`PeerJS 방 생성 시도 중 (${code})...`);

        this.peer = new Peer(this.getRoomPeerId(code), {
          config: { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] }
        });

        this.peer.on('open', id => {
          this.setStatusText(`P2P 대기실 개설 완료 (6자리 방번호)`);
          document.getElementById('display-room-code').innerText = code;
          document.getElementById('host-code-wrap').style.display = 'block';
          document.getElementById('host-start-wrap').style.display = 'block';
          this.updateLobbyUI();
        });

        this.peer.on('connection', conn => {
          conn.on('open', () => {
            // 빈 슬롯 검색 및 할당
            let assignedSlot = -1;
            for (let i = 1; i < 4; i++) {
              if (this.state.players[i].isAI && !this.state.players[i].id) {
                assignedSlot = i;
                break;
              }
            }

            if (assignedSlot === -1 || this.state.status !== 'LOBBY') {
              conn.send({ type: 'REJECT', reason: '방이 가득 찼거나 이미 게임 중입니다.' });
              setTimeout(() => conn.close(), 500);
              return;
            }

            const guestId = conn.peer;
            this.connections.set(guestId, conn);
            this.state.players[assignedSlot].id = guestId;
            this.state.players[assignedSlot].isAI = false;

            conn.send({ type: 'WELCOME', slot: assignedSlot });
            this.broadcastState();
            this.updateLobbyUI();

            conn.on('data', data => this.handleHostData(guestId, data));
            conn.on('close', () => {
              this.connections.delete(guestId);
              this.state.players[assignedSlot].id = null;
              this.state.players[assignedSlot].isAI = true;
              this.broadcastState();
              this.updateLobbyUI();
            });
          });
        });

        this.peer.on('error', err => this.setStatusText(`P2P 오류: ${err.type}`));
      }

      // [게스트] 6자리 방 참가
      joinRoom() {
        const input = document.getElementById('join-code-input').value.trim();
        if (input.length !== 6 || isNaN(input)) {
          alert("6자리 숫자 방 번호를 올바르게 입력해주세요.");
          return;
        }

        this.roomCode = input;
        this.isHost = false;
        this.setStatusText(`방장(${input})에게 연결 시도 중...`);

        this.peer = new Peer(null, {
          config: { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] }
        });

        this.peer.on('open', id => {
          const conn = this.peer.connect(this.getRoomPeerId(input));
          this.hostConn = conn;

          conn.on('open', () => {
            this.setStatusText("방장과 연결 성공. 참가 승인 대기 중...");
          });

          conn.on('data', data => this.handleGuestData(data));
          conn.on('close', () => {
            alert("방장과의 P2P 연결이 종료되었습니다.");
            location.reload();
          });
        });

        this.peer.on('error', err => this.setStatusText(`연결 실패: ${err.type}`));
      }

      // [호스트] 전체 클라이언트에 최신 State 전송
      broadcastState() {
        if (!this.isHost) return;
        const payload = { type: 'SYNC_STATE', state: this.state };
        for (const [id, conn] of this.connections.entries()) {
          if (conn.open) conn.send(payload);
        }
        renderGameUI(); // 호스트 자가 렌더링
      }

      // [호스트] 게스트 메시지 수신 및 검증 처리
      handleHostData(guestId, msg) {
        if (!this.isHost) return;
        const playerIdx = this.state.players.findIndex(p => p.id === guestId);
        if (playerIdx === -1) return;

        // 해당 플레이어의 턴인지 검증
        if (msg.type === 'ACTION') {
          if (this.state.turn !== playerIdx) return; // 턴 차단
          gameEngine.processAction(playerIdx, msg.action, msg.payload);
        }
      }

      // [게스트] 호스트 수신 처리
      handleGuestData(msg) {
        if (msg.type === 'WELCOME') {
          this.mySlot = msg.slot;
          this.setStatusText(`접속 완료! (내 플레이어: P${this.mySlot + 1})`);
        } else if (msg.type === 'REJECT') {
          alert(msg.reason);
        } else if (msg.type === 'SYNC_STATE') {
          this.state = msg.state;
          if (this.state.status === 'PLAYING') {
            document.getElementById('net-lobby').style.display = 'none';
            document.getElementById('game-layout').style.display = 'block';
          }
          renderGameUI();
        }
      }

      // 게스트가 호스트로 액션 요청
      dispatchAction(action, payload = null) {
        if (this.isHost) {
          gameEngine.processAction(this.mySlot, action, payload);
        } else if (this.hostConn && this.hostConn.open) {
          this.hostConn.send({ type: 'ACTION', action, payload });
        }
      }

      // 방장이 게임 시작
      startGame() {
        if (!this.isHost) return;
        this.state.status = 'PLAYING';
        this.state.log = "🎲 게임 시작! P1의 순서입니다.";
        document.getElementById('net-lobby').style.display = 'none';
        document.getElementById('game-layout').style.display = 'block';
        this.broadcastState();
        gameEngine.checkAITurn();
      }

      updateLobbyUI() {
        const listUl = document.getElementById('peer-list-ul');
        listUl.innerHTML = '';
        let count = 0;
        this.state.players.forEach((p, idx) => {
          if (p.id || idx === 0) {
            count++;
            const li = document.createElement('li');
            li.innerText = `P${idx+1}: ${p.id === 'HOST' ? '방장(나)' : (idx === this.mySlot ? '나' : p.id)}`;
            listUl.appendChild(li);
          }
        });
        document.getElementById('connected-count').innerText = count;
      }
    }

    const netManager = new NetworkManager();

    // ----------------------------------------------------
    // 3. 부루마블 단일 진실 원천(Single Source) 처리 엔진
    // ----------------------------------------------------
    class BlueMarbleEngine {
      processAction(pIdx, action, payload) {
        const state = netManager.state;
        if (state.turn !== pIdx) return; // 유효하지 않은 액션 거부

        const p = state.players[pIdx];

        if (action === 'ROLL') {
          if (state.awaitingAction) return;

          const d1 = Math.floor(Math.random() * 6) + 1;
          const d2 = Math.floor(Math.random() * 6) + 1;
          state.dice = [d1, d2];
          
          const steps = d1 + d2;
          const oldPos = p.pos;
          p.pos = (p.pos + steps) % 40;

          // 월급 수령
          if (p.pos < oldPos) {
            p.money += 20;
            state.log = `P${pIdx+1}이(가) 주사위 ${steps}(${d1},${d2})를 굴려 출발지를 지나 20만원을 받았습니다!`;
          } else {
            state.log = `P${pIdx+1}이(가) 주사위 ${steps}(${d1},${d2})를 굴려 ${TILES[p.pos].name}(으)로 이동했습니다.`;
          }

          this.resolveTile(pIdx, p.pos);
        } else if (action === 'BUY_LAND') {
          const tileIdx = p.pos;
          const tile = TILES[tileIdx];
          if (state.board[tileIdx].owner === -1 && p.money >= tile.land) {
            p.money -= tile.land;
            state.board[tileIdx].owner = pIdx;
            state.log = `P${pIdx+1}이(가) ${tile.name} 토지를 ${tile.land}만원에 구매했습니다!`;
          }
          state.awaitingAction = null;
          this.nextTurn();
        } else if (action === 'PASS') {
          state.awaitingAction = null;
          this.nextTurn();
        } else if (action === 'SPACE_TRAVEL') {
          p.pos = Number(payload) || 0;
          state.awaitingAction = null;
          state.log = `🚀 P${pIdx+1}이(가) ${TILES[p.pos].name}(으)로 우주여행을 떠났습니다.`;
          this.resolveTile(pIdx, p.pos);
        }

        netManager.broadcastState();
        this.checkAITurn();
      }

      resolveTile(pIdx, pos) {
        const state = netManager.state;
        const p = state.players[pIdx];
        const tile = TILES[pos];

        if (tile.type === 'city') {
          const b = state.board[pos];
          if (b.owner === -1) {
            state.awaitingAction = { type: 'BUY', tileIdx: pos, cost: tile.land };
          } else if (b.owner !== pIdx) {
            const owner = state.players[b.owner];
            const rent = tile.rLand;
            p.money -= rent;
            owner.money += rent;
            state.log += ` (${owner.name}에게 통행료 ${rent}만원 지불)`;
            this.checkBankrupt(pIdx);
            this.nextTurn();
          } else {
            this.nextTurn();
          }
        } else if (tile.type === 'tax') {
          const tax = 15;
          p.money -= tax;
          state.fundPool += tax;
          state.log += ` (복지기금 ${tax}만원 납부)`;
          this.checkBankrupt(pIdx);
          this.nextTurn();
        } else if (tile.type === 'fund_get') {
          p.money += state.fundPool;
          state.log += ` (적립된 복지기금 ${state.fundPool}만원 수령!)`;
          state.fundPool = 0;
          this.nextTurn();
        } else if (tile.type === 'space') {
          state.awaitingAction = { type: 'SPACE' };
        } else {
          this.nextTurn();
        }
      }

      checkBankrupt(pIdx) {
        const state = netManager.state;
        const p = state.players[pIdx];
        if (p.money < 0) {
          p.bankrupt = true;
          p.money = 0;
          state.board.forEach(b => { if (b.owner === pIdx) b.owner = -1; });
          state.log += ` 💥 P${pIdx+1} 파산!`;
        }
      }

      nextTurn() {
        const state = netManager.state;
        do {
          state.turn = (state.turn + 1) % 4;
        } while (state.players[state.turn].bankrupt);

        state.log += ` ➔ P${state.turn + 1}의 순서입니다.`;
      }

      checkAITurn() {
        if (!netManager.isHost) return;
        const state = netManager.state;
        const curP = state.players[state.turn];

        if (curP.isAI && !curP.bankrupt) {
          setTimeout(() => {
            if (!state.awaitingAction) {
              this.processAction(state.turn, 'ROLL');
            } else if (state.awaitingAction.type === 'BUY') {
              this.processAction(state.turn, 'BUY_LAND');
            } else {
              this.processAction(state.turn, 'PASS');
            }
          }, 1000);
        }
      }
    }

    const gameEngine = new BlueMarbleEngine();

    // ----------------------------------------------------
    // 4. UI 및 캔버스 렌더링 (State기반 순수 출력)
    // ----------------------------------------------------
    function renderGameUI() {
      const state = netManager.state;
      document.getElementById('game-log').innerText = state.log;

      // 1. 보드 그려주기
      const canvas = document.getElementById('boardCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      TILES.forEach((tile, i) => {
        const pos = TILE_POS[i];
        const b = state.board[i];
        
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        ctx.strokeRect(pos.x, pos.y, S, S);

        if (b && b.owner !== -1) {
          ctx.fillStyle = PLAYER_COLORS[b.owner] + '44';
          ctx.fillRect(pos.x, pos.y, S, S);
        }

        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(tile.icon, pos.x + S / 2, pos.y + 24);

        ctx.fillStyle = '#f8fafc';
        ctx.font = '10px sans-serif';
        ctx.fillText(tile.name, pos.x + S / 2, pos.y + 44);
      });

      // 중앙 주사위 및 기금 표기
      ctx.fillStyle = '#f59e0b';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`🎲 ${state.dice[0]} + 🎲 ${state.dice[1]} = ${state.dice[0] + state.dice[1]}`, 330, 310);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '14px sans-serif';
      ctx.fillText(`🏛️ 모인 기금: ${state.fundPool}만원`, 330, 350);

      // 말 그리기
      state.players.forEach((p, idx) => {
        if (p.bankrupt) return;
        const pos = TILE_POS[p.pos];
        const offsetX = (idx % 2) * 22 + 14;
        const offsetY = Math.floor(idx / 2) * 22 + 14;
        ctx.font = '18px sans-serif';
        ctx.fillText(p.emoji, pos.x + offsetX, pos.y + offsetY);
      });

      // 2. 컨트롤 버튼 UI 업데이트
      const ctrl = document.getElementById('action-controls');
      ctrl.innerHTML = '';

      const isMyTurn = (state.turn === netManager.mySlot);

      if (isMyTurn && !state.players[netManager.mySlot].bankrupt) {
        if (!state.awaitingAction) {
          const btn = document.createElement('button');
          btn.className = 'primary';
          btn.innerText = '🎲 주사위 굴리기';
          btn.onclick = () => netManager.dispatchAction('ROLL');
          ctrl.appendChild(btn);
        } else if (state.awaitingAction.type === 'BUY') {
          ctrl.innerHTML = `
            <button class="primary" onclick="netManager.dispatchAction('BUY_LAND')">🏢 땅 구매 (${state.awaitingAction.cost}만)</button>
            <button onclick="netManager.dispatchAction('PASS')">패스</button>
          `;
        } else if (state.awaitingAction.type === 'SPACE') {
          let opts = TILES.map((t, i) => `<option value="${i}">${i}. ${t.name}</option>`).join('');
          ctrl.innerHTML = `
            <select id="sp-dest" style="padding:8px; font-size:1rem;">${opts}</select>
            <button class="primary" onclick="netManager.dispatchAction('SPACE_TRAVEL', document.getElementById('sp-dest').value)">🚀 이동</button>
          `;
        }
      } else {
        ctrl.innerHTML = `<span style="color:#94a3b8; font-size:0.9rem;">P${state.turn + 1}의 조작을 기다리는 중...</span>`;
      }

      // 3. 플레이어 현황 그리드
      const pGrid = document.getElementById('players-status');
      pGrid.innerHTML = '';
      state.players.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = 'player-card' + (idx === state.turn ? ' active' : '');
        card.style.borderLeft = `4px solid ${PLAYER_COLORS[idx]}`;
        card.innerHTML = `
          <div><b>P${idx+1} ${p.emoji}</b> ${p.isAI ? '(AI)' : ''} ${idx === netManager.mySlot ? '<b>[나]</b>' : ''}</div>
          <div>자산: ${p.bankrupt ? '💥 파산' : p.money + '만원'}</div>
          <div style="font-size:0.75rem; color:#94a3b8;">위치: ${TILES[p.pos].name}</div>
        `;
        pGrid.appendChild(card);
      });
    }
  </script>
</body>
</html>
