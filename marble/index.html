<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미니지 - 부루마블</title>
  <style>
    :root { --bg: #f8f9fa; --text: #333; --canvas-bg: #0f172a; --border: #e9ecef; --btn-bg: #fff; }
    [data-theme="dark"] { --bg: #0d1117; --text: #c9d1d9; --canvas-bg: #0f172a; --border: #30363d; --btn-bg: #21262d; }
    [data-theme="beige"] { --bg: #f5ebe0; --text: #4e3d30; --canvas-bg: #1e1b18; --border: #ddcbbb; --btn-bg: #eddfd0; }
    body { background-color: var(--bg) !important; color: var(--text) !important; text-align: center; font-family: sans-serif; padding-top: 10px; margin: 0; transition: 0.3s; }
    button, select { background-color: var(--btn-bg) !important; color: var(--text) !important; border: 1px solid var(--border) !important; padding: 8px 14px; font-size: 0.85rem; border-radius: 8px; cursor: pointer; margin: 2px; font-weight: bold; }
    button:hover { filter: brightness(0.95); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    select { padding: 4px 8px; cursor: pointer; font-size: 1.1rem; }
    #marble-panel { font-size: 1.1rem; font-weight: bold; color: #fcc419; margin-bottom: 8px; min-height: 1.5em; }

    .container { max-width: 680px; margin: 0 auto; padding: 8px; }
    .card { background-color: var(--btn-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .player-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .player-slot { border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: rgba(0,0,0,0.03); font-size: 0.85rem; text-align: left; display: flex; align-items: center; justify-content: space-between; }
    .player-slot.active { border-color: #fcc419; background: rgba(252, 196, 25, 0.1); }
    input[type="text"] { width: 120px; padding: 6px; font-size: 0.95rem; text-align: center; border-radius: 6px; border: 1px solid var(--border); font-weight: bold; }
    
    /* 40칸 대형 보드 캔버스 */
    canvas { background-color: var(--canvas-bg); border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); max-width: 100%; height: auto; vertical-align: middle; }
    
    .status-board { font-size: 0.8rem; margin-top: 10px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .p-status { border: 1px solid var(--border); padding: 8px; border-radius: 6px; text-align: left; background: var(--btn-bg); }
    
    #action-panel { margin-top: 8px; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--btn-bg); display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
    .btn-action { font-size: 0.85rem; padding: 6px 10px; border-radius: 6px; }
    .btn-buy { background: #40c057 !important; color: #fff !important; border: none !important; }
    .btn-danger { background: #fa5252 !important; color: #fff !important; border: none !important; }
    .btn-warn { background: #fd7e14 !important; color: #fff !important; border: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <h2 style="margin:5px 0 10px 0;">🎲 정통 40칸 부루마블</h2>

    <!-- 로비 대기실 -->
    <div id="lobby-panel" class="card">
      <h3>🎮 멀티플레이 대기실</h3>
      <div style="font-size:0.78rem; color:#868e96; margin:-4px 0 10px 0;">※ 현재 네트워크 방식은 같은 브라우저/기기 내 탭·창 간 동기화용입니다.</div>
      <div style="margin-bottom: 12px;">
        방 번호: <input type="text" id="room-code-input" maxlength="4" placeholder="1234">
        <button onclick="createRoom()">방 만들기</button>
        <button onclick="joinRoom()">참가하기</button>
      </div>

      <div id="room-info" style="display:none; font-weight:bold; color:#4dabf7; margin-bottom:8px;">
        현재 방 번호: <span id="current-room-id"></span>
      </div>

      <div class="player-list">
        <div id="slot-p1" class="player-slot"><span><b>P1:</b> <span class="st">대기 중...</span></span></div>
        <div id="slot-p2" class="player-slot"><span><b>P2:</b> <span class="st">대기 중...</span></span></div>
        <div id="slot-p3" class="player-slot"><span><b>P3:</b> <span class="st">대기 중...</span></span></div>
        <div id="slot-p4" class="player-slot"><span><b>P4:</b> <span class="st">대기 중...</span></span></div>
      </div>

      <div id="host-controls" style="display:none;">
        <button onclick="startGame()" style="background:#40c057 !important; color:#fff !important; width:100%; font-size:1rem; padding:10px;">🚀 게임 시작 (방장)</button>
      </div>
      <div id="guest-waiting" style="display:none; color:#868e96;">
        방장이 게임을 시작하기를 기다리고 있습니다...
      </div>
    </div>

    <!-- 게임 진행 화면 -->
    <div id="game-panel" style="display:none;">
      <div id="marble-panel">게임 준비 중...</div>
      
      <!-- 660x660 정통 40칸 보드 캔버스 (11x11 격자) -->
      <canvas id="boardCanvas" width="660" height="660"></canvas>

      <div id="action-panel">
        <button id="btn-roll" onclick="handleRollClick()" style="background:#fcc419 !important; color:#000 !important; font-size:1rem; padding:8px 18px;">🎲 주사위 2개 굴리기</button>
      </div>

      <div id="player-status-grid" class="status-board"></div>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const EMOJI_OPTIONS = ["🎈", "🚗", "🚀", "💎", "🦁", "🐱", "🐶", "🦊", "👑", "⚡", "🔥", "🍀", "🤖", "👻", "🦄", "⚽"];

    const savedTheme = localStorage.getItem('minig-theme');
    if (savedTheme && savedTheme !== 'white') document.documentElement.setAttribute('data-theme', savedTheme);

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      try {
        initAudio(); if (!audioCtx) return;
        const now = audioCtx.currentTime;
        if (type === 'roll') {
          const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
          osc.type = 'square'; osc.frequency.setValueAtTime(180 + Math.random() * 100, now);
          gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.04);
        } else if (type === 'buy') {
          [523, 659, 783, 1046].forEach((f, i) => {
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(f, now + i * 0.05);
            gain.gain.setValueAtTime(0.08, now + i * 0.05); gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + i * 0.05); osc.stop(now + i * 0.05 + 0.1);
          });
        } else if (type === 'rent') {
          const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, now); osc.frequency.exponentialRampToValueAtTime(60, now + 0.25);
          gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.25);
        }
      } catch(e) {}
    }

    const TILES = [

      /* 11 */ { name: "코펜하겐", type: "city", land: 20, villa: 15, bldg: 45, hotel: 75, rLand: 16, rVilla: 50, rBldg: 130, rHotel: 240, icon: "🇩🇰" },
      /* 12 */ { name: "스톡홀름", type: "city", land: 22, villa: 15, bldg: 45, hotel: 75, rLand: 18, rVilla: 55, rBldg: 140, rHotel: 260, icon: "🇸🇪" },

      /* 25 */ { name: "황금열쇠", type: "key", icon: "🔑" },
      /* 26 */ { name: "파리", type: "city", land: 40, villa: 30, bldg: 90, hotel: 150, rLand: 35, rVilla: 110, rBldg: 270, rHotel: 500, icon: "🇫🇷" },
      /* 27 */ { name: "로마", type: "city", land: 40, villa: 30, bldg: 90, hotel: 150, rLand: 35, rVilla: 110, rBldg: 270, rHotel: 500, icon: "🇮🇹" },
      /* 28 */ { name: "런던", type: "city", land: 45, villa: 30, bldg: 90, hotel: 150, rLand: 40, rVilla: 120, rBldg: 300, rHotel: 550, icon: "🇬🇧" },
      /* 29 */ { name: "뉴욕", type: "city", land: 45, villa: 30, bldg: 90, hotel: 150, rLand: 40, rVilla: 120, rBldg: 300, rHotel: 550, icon: "🇺🇸" },
      /* 30 */ { name: "우주여행", type: "space", icon: "🚀" },
      /* 31 */ { name: "콩코드", type: "city", land: 50, villa: 35, bldg: 100, hotel: 180, rLand: 45, rVilla: 130, rBldg: 330, rHotel: 600, icon: "✈️" },
      /* 32 */ { name: "모스크바", type: "city", land: 55, villa: 35, bldg: 100, hotel: 180, rLand: 50, rVilla: 140, rBldg: 360, rHotel: 650, icon: "🇷🇺" },
      /* 33 */ { name: "태평양호", type: "city", land: 60, villa: 35, bldg: 100, hotel: 180, rLand: 55, rVilla: 150, rBldg: 390, rHotel: 700, icon: "🚢" },
      /* 34 */ { name: "컬럼비아", type: "city", land: 65, villa: 40, bldg: 120, hotel: 200, rLand: 60, rVilla: 170, rBldg: 430, rHotel: 800, icon: "🛰️" },
      /* 35 */ { name: "황금열쇠", type: "key", icon: "🔑" },
      /* 36 */ { name: "제네바", type: "city", land: 70, villa: 40, bldg: 120, hotel: 200, rLand: 65, rVilla: 180, rBldg: 460, rHotel: 850, icon: "🇨🇭" },
      /* 37 */ { name: "몬트리올", type: "city", land: 75, villa: 40, bldg: 120, hotel: 200, rLand: 70, rVilla: 190, rBldg: 490, rHotel: 900, icon: "🇨🇦" },
      /* 38 */ { name: "황금열쇠", type: "key", icon: "🔑" },
      /* 39 */ { name: "서울", type: "city", land: 100, villa: 50, bldg: 150, hotel: 250, rLand: 100, rVilla: 300, rBldg: 700, rHotel: 1200, icon: "🇰🇷" }
    ];

    const TILE_POS = [];
    const S = 60;
    for (let i = 10; i >= 0; i--) TILE_POS.push({ x: i * S, y: 10 * S });
    for (let j = 9; j >= 1; j--) TILE_POS.push({ x: 0, y: j * S });
    for (let i = 0; i <= 10; i++) TILE_POS.push({ x: i * S, y: 0 });
    for (let j = 1; j <= 9; j++) TILE_POS.push({ x: 10 * S, y: j * S });

    const PLAYER_CONFIG = [
      { name: "P1", color: "#ff6b6b" },
      { name: "P2", color: "#4dabf7" },
      { name: "P3", color: "#51cf66" },
      { name: "P4", color: "#fcc419" }
    ];

    let roomCode = "";
    let localPlayerIndex = -1;
    let isHost = false;
    let peer = null;
    let hostConnection = null;
    const guestConnections = new Map();
    let rollLock = false;
    let aiTimer = null;

    let gameState = {
      status: "lobby",
      roomCode: "",
      turn: 0,
      dice1: 1,
      dice2: 1,
      isDouble: false,
      doubleCount: 0,
      isRolling: false,
      awaitingAction: null,
      socialFundPool: 0,
      message: "방장이 게임을 시작하기를 기다립니다.",
      players: [
        { id: null, name: "P1", emoji: "🎈", isAI: true, money: 300, loan: 0, pos: 0, islandTurns: 0, bankrupt: false },
        { id: null, name: "P2", emoji: "🚗", isAI: true, money: 300, loan: 0, pos: 0, islandTurns: 0, bankrupt: false },
        { id: null, name: "P3", emoji: "🚀", isAI: true, money: 300, loan: 0, pos: 0, islandTurns: 0, bankrupt: false },
        { id: null, name: "P4", emoji: "💎", isAI: true, money: 300, loan: 0, pos: 0, islandTurns: 0, bankrupt: false }
      ],
      board: TILES.map(() => ({ owner: -1, villa: false, bldg: false, hotel: false }))
    };

    const myClientId = 'usr_' + Math.random().toString(36).slice(2, 10);

    function getHostPeerId(code) { return 'minig-host-' + code; }

    function closeNetwork() {
      if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
      try { if (hostConnection) hostConnection.close(); } catch (_) {}
      hostConnection = null;
      guestConnections.forEach(conn => { try { conn.close(); } catch (_) {} });
      guestConnections.clear();
      try { if (peer) peer.destroy(); } catch (_) {}
      peer = null;
    }

    function setupHostNetwork(code) {
      closeNetwork();
      roomCode = code;
      if (typeof Peer === 'undefined') {
        alert('온라인 연결 모듈을 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');
        isHost = false;
        return;
      }
      peer = new Peer(getHostPeerId(roomCode));
      peer.on('open', () => {
        gameState.roomCode = roomCode;
        syncStateToNetwork();
      });
      peer.on('connection', conn => {
        conn.on('open', () => {
          guestConnections.set(conn.peer, conn);
          conn.on('data', data => handleNetworkData(data, conn));
          conn.on('close', () => guestConnections.delete(conn.peer));
          conn.on('error', () => guestConnections.delete(conn.peer));
        });
      });
      peer.on('error', err => {
        console.error('Peer host error:', err);
        if (err && err.type === 'unavailable-id') {
          alert('이 방 번호는 이미 사용 중입니다. 다른 방 번호를 사용해주세요.');
          isHost = false;
          closeNetwork();
        } else {
          gameState.message = '⚠️ 온라인 연결 오류가 발생했습니다.';
          updateUI();
        }
      });
    }

    function setupGuestNetwork(code) {
      closeNetwork();
      roomCode = code;
      if (typeof Peer === 'undefined') {
        alert('온라인 연결 모듈을 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');
        return;
      }
      peer = new Peer();
      peer.on('open', () => {
        const conn = peer.connect(getHostPeerId(roomCode), { reliable: true });
        hostConnection = conn;
        conn.on('open', () => {
          conn.on('data', data => handleNetworkData(data, conn));
          conn.on('close', () => {
            hostConnection = null;
            gameState.message = '⚠️ 방장과의 연결이 끊어졌습니다.';
            updateUI();
          });
          conn.on('error', () => {
            hostConnection = null;
            gameState.message = '⚠️ 방장과의 연결 오류가 발생했습니다.';
            updateUI();
          });
          conn.send({ type: 'JOIN_REQUEST', clientId: myClientId });
        });
        conn.on('error', () => alert('방에 연결하지 못했습니다. 방 번호를 확인해주세요.'));
      });
      peer.on('error', err => {
        console.error('Peer guest error:', err);
        if (err && err.type === 'peer-unavailable') alert('해당 방을 찾을 수 없습니다. 방장이 먼저 방을 만들어야 합니다.');
      });
    }

    function sendNetworkData(data) {
      if (isHost) {
        guestConnections.forEach(conn => {
          try { if (conn.open) conn.send(data); } catch (_) {}
        });
      } else if (hostConnection && hostConnection.open) {
        try { hostConnection.send(data); } catch (_) {}
      }
    }

    function handleNetworkData(data, conn) {
      if (!data) return;

      if (data.type === 'JOIN_REQUEST' && isHost) {
        if (gameState.status !== 'lobby') {
          if (conn) conn.send({ type: 'JOIN_REJECTED', targetId: data.clientId, reason: '게임이 이미 시작되었습니다.' });
          return;
        }
        let slot = gameState.players.findIndex(p => p.id === data.clientId);
        if (slot === -1) {
          for (let i = 1; i < 4; i++) {
            if (gameState.players[i].isAI) {
              slot = i;
              gameState.players[i].isAI = false;
              gameState.players[i].id = data.clientId;
              break;
            }
          }
        }
        if (slot !== -1 && conn) {
          conn.send({ type: 'JOIN_RESPONSE', targetId: data.clientId, slotIndex: slot, state: gameState });
          syncStateToNetwork();
        } else if (conn) {
          conn.send({ type: 'ROOM_FULL', targetId: data.clientId });
        }
        return;
      }

      if (data.type === 'JOIN_RESPONSE' && data.targetId === myClientId) {
        localPlayerIndex = data.slotIndex;
        if (data.state) gameState = data.state;
        updateUI();
        return;
      }

      if (data.type === 'JOIN_REJECTED' && data.targetId === myClientId) {
        alert(data.reason || '방 참가에 실패했습니다.');
        return;
      }

      if (data.type === 'ROOM_FULL' && data.targetId === myClientId) {
        alert('방이 가득 찼습니다.');
        return;
      }

      if (data.type === 'CHANGE_EMOJI' && isHost) {
        const slot = gameState.players.findIndex(p => p.id === data.clientId && !p.isAI);
        if (slot !== -1 && gameState.status === 'lobby') {
          gameState.players[slot].emoji = String(data.emoji || '🎈');
          syncStateToNetwork();
        }
        return;
      }

      if (data.type === 'ROLL_REQUEST' && isHost) {
        const actorIndex = gameState.players.findIndex(p => p.id === data.clientId && !p.isAI);
        if (actorIndex === gameState.turn && !gameState.isRolling && !gameState.awaitingAction && gameState.status === 'playing') {
          triggerDiceRoll();
        }
        return;
      }

      if (data.type === 'ACTION_TRIGGER' && isHost) {
        const actorIndex = gameState.players.findIndex(p => p.id === data.clientId && !p.isAI);
        if (actorIndex !== gameState.turn || gameState.players[actorIndex].bankrupt) return;
        if (data.action === 'CONFIRM_BUY') confirmBuy(data.buildType);
        else if (data.action === 'TAKE_LOAN') takeLoan();
        else if (data.action === 'SELL_PROP') sellProperty(Number(data.tileIdx));
        else if (data.action === 'BANKRUPT') declareBankrupt();
        return;
      }

      if (data.type === 'STATE_UPDATE' && !isHost) {
        gameState = data.state;
        updateUI();
      }
    }

    function syncStateToNetwork() {
      sendNetworkData({ type: 'STATE_UPDATE', state: gameState });
      updateUI();
    }

    function changeMyEmoji(newEmoji) {
      if (localPlayerIndex === -1) return;
      if (isHost) {
        gameState.players[localPlayerIndex].emoji = newEmoji;
        syncStateToNetwork();
      } else {
        sendNetworkData({ type: 'CHANGE_EMOJI', clientId: myClientId, emoji: newEmoji });
      }
    }

    function createRoom() {
      initAudio();
      const input = document.getElementById('room-code-input').value.trim();
      if (input && !/^\d{4}$/.test(input)) { alert('방 번호는 4자리 숫자여야 합니다.'); return; }
      roomCode = input || Math.floor(1000 + Math.random() * 9000).toString();
      document.getElementById('room-code-input').value = roomCode;
      isHost = true;
      localPlayerIndex = 0;
      gameState = {
        status: 'lobby', roomCode, turn: 0, dice1: 1, dice2: 1, isDouble: false, doubleCount: 0,
        isRolling: false, awaitingAction: null, socialFundPool: 0, message: '방장이 게임을 시작하기를 기다립니다.',
        players: [
          { id: myClientId, name: 'P1', emoji: '🎈', isAI: false, money: 300, loan: 0, pos: 0, islandTurns: 0, bankrupt: false },
          { id: null, name: 'P2', emoji: '🚗', isAI: true, money: 300, loan: 0, pos: 0, islandTurns: 0, bankrupt: false },
          { id: null, name: 'P3', emoji: '🚀', isAI: true, money: 300, loan: 0, pos: 0, islandTurns: 0, bankrupt: false },
          { id: null, name: 'P4', emoji: '💎', isAI: true, money: 300, loan: 0, pos: 0, islandTurns: 0, bankrupt: false }
        ],
        board: TILES.map(() => ({ owner: -1, villa: false, bldg: false, hotel: false }))
      };
      setupHostNetwork(roomCode);
      document.getElementById('room-info').style.display = 'block';
      document.getElementById('current-room-id').innerText = roomCode;
      document.getElementById('host-controls').style.display = 'block';
      document.getElementById('guest-waiting').style.display = 'none';
      updateUI();
    }

    function joinRoom() {
      initAudio();
      const input = document.getElementById('room-code-input').value.trim();
      if (!/^\d{4}$/.test(input)) { alert('4자리 방 번호를 입력해주세요!'); return; }
      isHost = false;
      localPlayerIndex = -1;
      roomCode = input;
      setupGuestNetwork(roomCode);
      document.getElementById('room-info').style.display = 'block';
      document.getElementById('current-room-id').innerText = roomCode;
      document.getElementById('host-controls').style.display = 'none';
      document.getElementById('guest-waiting').style.display = 'block';
    }

    function startGame() {
      if (!isHost) return;
      gameState.status = 'playing';
      gameState.turn = 0;
      gameState.awaitingAction = null;
      gameState.message = `게임 시작! P1(${gameState.players[0].emoji})의 순서입니다.`;
      syncStateToNetwork();
      checkTurnAndAI();
    }

    function updateUI() {
      for (let i = 0; i < 4; i++) {
        const slotEl = document.getElementById(`slot-p${i+1}`);
        const p = gameState.players[i];
        let statusText = "🤖 AI 컴퓨터";
        if (!p.isAI) statusText = (i === localPlayerIndex) ? "👤 나 (접속됨)" : "👤 플레이어";
        
        let emojiPickerHtml = "";
        if (i === localPlayerIndex && gameState.status === 'lobby') {
          emojiPickerHtml = `<select onchange="changeMyEmoji(this.value)">
            ${EMOJI_OPTIONS.map(e => `<option value="${e}" ${e === p.emoji ? 'selected' : ''}>${e}</option>`).join('')}
          </select>`;
        } else {
          emojiPickerHtml = `<span style="font-size:1.2rem; margin-left:4px;">${p.emoji}</span>`;
        }

        slotEl.innerHTML = `<div><b>P${i+1}:</b> ${emojiPickerHtml}</div><span class="st">${statusText}</span>`;
        if (i === localPlayerIndex) slotEl.classList.add('active'); else slotEl.classList.remove('active');
      }

      if (gameState.status === 'playing' || gameState.status === 'gameover') {
        document.getElementById('lobby-panel').style.display = 'none';
        document.getElementById('game-panel').style.display = 'block';
      } else {
        document.getElementById('lobby-panel').style.display = 'block';
        document.getElementById('game-panel').style.display = 'none';
      }

      document.getElementById('marble-panel').innerText = gameState.message;
      renderActionPanel();

      const grid = document.getElementById('player-status-grid');
      grid.innerHTML = "";
      gameState.players.forEach((p, idx) => {
        const div = document.createElement('div');
        div.className = 'p-status';
        if (idx === gameState.turn) div.style.borderColor = "#fcc419";
        const stateStr = p.bankrupt ? "💀 파산" : (p.islandTurns > 0 ? "🏝️ 무인도" : `${p.money}만 원`);
        const loanStr = p.loan > 0 ? ` <span style="color:#fa5252;">(대출:${p.loan}만)</span>` : "";
        div.innerHTML = `<b>${p.emoji} ${p.name}</b>: ${stateStr}${loanStr}`;
        grid.appendChild(div);
      });

      drawBoard();
    }

    function renderActionPanel() {
      const panel = document.getElementById('action-panel');
      panel.innerHTML = "";
      const myPlayer = gameState.players[localPlayerIndex];
      const isMyTurn = localPlayerIndex !== -1 && gameState.turn === localPlayerIndex && myPlayer && !myPlayer.isAI;

      if (!isMyTurn || gameState.status === 'gameover') {
        panel.innerHTML = `<span style="color:#868e96; font-size:0.85rem;">상대방 턴 진행 중...</span>`;
        return;
      }

      if (gameState.awaitingAction === 'BUY') {
        const p = gameState.players[localPlayerIndex];
        const tile = TILES[p.pos];
        const bState = gameState.board[p.pos];

        let html = `<div style="width:100%; margin-bottom:4px; font-weight:bold; font-size:0.9rem;">${tile.name} 매입:</div>`;
        html += `<button class="btn-action" onclick="handleUserAction('CONFIRM_BUY', 'NONE')">구매 안 함</button>`;
        if (p.money >= tile.land) html += `<button class="btn-action btn-buy" onclick="handleUserAction('CONFIRM_BUY', 'LAND')">🌳 토지 (+${tile.land}만)</button>`;
        if (!bState.villa && p.money >= tile.land + tile.villa) html += `<button class="btn-action btn-buy" onclick="handleUserAction('CONFIRM_BUY', 'VILLA')">🏘️ 별장 (+${tile.land + tile.villa}만)</button>`;
        if (!bState.bldg && p.money >= tile.land + tile.bldg) html += `<button class="btn-action btn-buy" onclick="handleUserAction('CONFIRM_BUY', 'BLDG')">🏢 빌딩 (+${tile.land + tile.bldg}만)</button>`;
        if (!bState.hotel && p.money >= tile.land + tile.hotel) html += `<button class="btn-action btn-buy" onclick="handleUserAction('CONFIRM_BUY', 'HOTEL')">🏨 호텔 (+${tile.land + tile.hotel}만)</button>`;
        panel.innerHTML = html;
      } else if (gameState.awaitingAction === 'CRISIS') {
        const p = gameState.players[localPlayerIndex];
        let html = `<div style="width:100%; margin-bottom:4px; color:#fa5252; font-weight:bold; font-size:0.85rem;">⚠️ 자금 부족! 해결 방법을 선택하세요:</div>`;
        if (p.loan < 300) html += `<button class="btn-action btn-warn" onclick="handleUserAction('TAKE_LOAN')">🏦 대출 받기 (+100만 원)</button>`;
        const hasProperty = gameState.board.some(t => t.owner === localPlayerIndex);
        if (hasProperty) html += `<button class="btn-action btn-warn" onclick="openSellMenu()">🏠 매각하기</button>`;
        html += `<button class="btn-action btn-danger" onclick="handleUserAction('BANKRUPT')">💀 즉시 파산</button>`;
        panel.innerHTML = html;
      } else if (gameState.awaitingAction === 'SELL_SELECT') {
        let html = `<div style="width:100%; margin-bottom:4px; font-weight:bold; font-size:0.85rem;">매각할 소유지를 선택하세요:</div>`;
        gameState.board.forEach((t, idx) => {
          if (t.owner === localPlayerIndex) {
            const tile = TILES[idx];
            let val = tile.land + (t.villa?tile.villa:0) + (t.bldg?tile.bldg:0) + (t.hotel?tile.hotel:0);
            const refund = Math.floor(val * 0.8);
            html += `<button class="btn-action btn-warn" onclick="handleUserAction('SELL_PROP', ${idx})">${tile.name} (+${refund}만)</button>`;
          }
        });
        html += `<button class="btn-action" onclick="cancelSellMenu()">취소</button>`;
        panel.innerHTML = html;
      } else {
        const btn = document.createElement('button');
        btn.id = 'btn-roll';
        btn.innerHTML = '🎲 주사위 2개 굴리기';
        btn.style.cssText = 'background:#fcc419 !important; color:#000 !important; font-size:0.95rem; padding:8px 18px;';
        btn.disabled = gameState.isRolling;
        btn.onclick = handleRollClick;
        panel.appendChild(btn);
      }
    }

    function handleUserAction(actionType, p1, p2) {
      if (localPlayerIndex === -1 || gameState.turn !== localPlayerIndex) return;
      if (isHost) {
        if (actionType === 'CONFIRM_BUY') confirmBuy(p1);
        else if (actionType === 'TAKE_LOAN') takeLoan();
        else if (actionType === 'SELL_PROP') sellProperty(Number(p1));
        else if (actionType === 'BANKRUPT') declareBankrupt();
      } else {
        sendNetworkData({ type: 'ACTION_TRIGGER', action: actionType, clientId: myClientId, buildType: p1, tileIdx: p1 });
      }
    }

    function drawBoard() {
      ctx.clearRect(0, 0, 660, 660);

      for (let i = 0; i < 40; i++) {
        const pos = TILE_POS[i];
        const tile = TILES[i];
        const state = gameState.board[i];

        ctx.fillStyle = "#1e293b"; ctx.fillRect(pos.x, pos.y, 60, 60);
        ctx.strokeStyle = "#334155"; ctx.lineWidth = 1; ctx.strokeRect(pos.x, pos.y, 60, 60);

        if (state.owner !== -1) {
          ctx.fillStyle = PLAYER_CONFIG[state.owner].color;
          ctx.fillRect(pos.x, pos.y, 60, 10);
        }

        ctx.font = "12px sans-serif"; ctx.textAlign = "center";
        ctx.fillText(tile.icon, pos.x + 30, pos.y + 25);

        ctx.fillStyle = "#f8fafc"; ctx.font = "bold 9px sans-serif";
        ctx.fillText(tile.name, pos.x + 30, pos.y + 38);

        if (tile.type === 'city') {
          let bIcons = "";
          if (state.villa) bIcons += "🏘️";
          if (state.bldg) bIcons += "🏢";
          if (state.hotel) bIcons += "🏨";
          ctx.fillStyle = "#fcc419"; ctx.font = "8px sans-serif";
          ctx.fillText(bIcons || `${tile.land}만`, pos.x + 30, pos.y + 52);
        }
      }

      ctx.fillStyle = "#0f172a"; ctx.fillRect(60, 60, 540, 540);
      ctx.strokeStyle = "#fcc419"; ctx.lineWidth = 2; ctx.strokeRect(62, 62, 536, 536);

      ctx.fillStyle = "#fcc419"; ctx.font = "bold 22px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("부 루 마 블", 330, 200);
      ctx.fillStyle = "#94a3b8"; ctx.font = "14px sans-serif";
      ctx.fillText(`🏛️ 모금된 사회복지기금: ${gameState.socialFundPool}만 원`, 330, 235);

      drawDice(270, 280, gameState.dice1);
      drawDice(340, 280, gameState.dice2);

      if (gameState.isDouble) {
        ctx.fillStyle = "#ff6b6b"; ctx.font = "bold 18px sans-serif";
        ctx.fillText("✨ DOUBLE! 한 번 더! ✨", 330, 370);
      }

      gameState.players.forEach((p, idx) => {
        if (p.bankrupt) return;
        const base = TILE_POS[p.pos];
        const offsets = [
          { dx: 18, dy: 18 }, { dx: 42, dy: 18 },
          { dx: 18, dy: 42 }, { dx: 42, dy: 42 }
        ];
        const pt = offsets[idx];

        ctx.beginPath();
        ctx.arc(base.x + pt.dx, base.y + pt.dy, 9, 0, Math.PI * 2);
        ctx.fillStyle = PLAYER_CONFIG[idx].color; ctx.fill();
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1; ctx.stroke();

        ctx.font = "9px sans-serif"; ctx.textAlign = "center";
        ctx.fillText(p.emoji, base.x + pt.dx, base.y + pt.dy + 3);
      });
    }

    function drawDice(x, y, value) {
      ctx.fillStyle = "#ffffff"; ctx.fillRect(x, y, 45, 45);
      ctx.strokeStyle = "#000000"; ctx.lineWidth = 2; ctx.strokeRect(x, y, 45, 45);
      ctx.fillStyle = "#000000"; ctx.font = "bold 24px sans-serif"; ctx.textAlign = "center";
      ctx.fillText(value, x + 22, y + 32);
    }

    function handleRollClick() {
      if (rollLock || gameState.isRolling || gameState.awaitingAction) return;
      if (localPlayerIndex === -1 || gameState.turn !== localPlayerIndex) return;
      rollLock = true;
      if (isHost) triggerDiceRoll();
      else {
        sendNetworkData({ type: 'ROLL_REQUEST', clientId: myClientId });
        setTimeout(() => { rollLock = false; }, 500);
      }
    }

    function scheduleAI() {
      if (!isHost || gameState.status !== 'playing' || aiTimer) return;
      const currP = gameState.players[gameState.turn];
      if (!currP || !currP.isAI || currP.bankrupt) return;
      aiTimer = setTimeout(() => {
        aiTimer = null;
        const p = gameState.players[gameState.turn];
        if (!p || !p.isAI || p.bankrupt || gameState.status !== 'playing') return;
        if (gameState.awaitingAction === 'BUY') aiDecisionBuy();
        else if (gameState.awaitingAction === 'CRISIS') aiDecisionCrisis();
        else if (!gameState.isRolling && !gameState.awaitingAction) triggerDiceRoll();
      }, 800);
    }

    function checkTurnAndAI() {
      if (gameState.status !== 'playing') return;
      const currP = gameState.players[gameState.turn];
      if (!currP) return;
      if (currP.bankrupt) { nextTurn(); return; }
      if (currP.isAI && isHost) scheduleAI();
    }

    function triggerDiceRoll() {
      if (!isHost) return;
      if (gameState.status !== 'playing' || gameState.isRolling || gameState.awaitingAction) {
        rollLock = false;
        return;
      }
      gameState.isRolling = true;
      gameState.isDouble = false;
      syncStateToNetwork();
      let count = 0;
      const interval = setInterval(() => {
        gameState.dice1 = Math.floor(Math.random() * 6) + 1;
        gameState.dice2 = Math.floor(Math.random() * 6) + 1;
        playSound('roll');
        drawBoard();
        count++;
        if (count > 10) {
          clearInterval(interval);
          gameState.isRolling = false;
          rollLock = false;
          if (gameState.dice1 === gameState.dice2) {
            gameState.isDouble = true;
            gameState.doubleCount++;
            playSound('buy');
          } else {
            gameState.isDouble = false;
            gameState.doubleCount = 0;
          }
          if (gameState.doubleCount >= 3) {
            gameState.doubleCount = 0;
            gameState.isDouble = false;
            const p = gameState.players[gameState.turn];
            p.pos = 10;
            p.islandTurns = 3;
            gameState.message = `🚨 3연속 더블! ${p.name}님이 무인도로 구금됩니다!`;
            syncStateToNetwork();
            setTimeout(nextTurn, 1400);
            return;
          }
          executeMove(gameState.dice1 + gameState.dice2);
        }
      }, 50);
    }

    function executeMove(steps) {
      if (!isHost) return;
      const p = gameState.players[gameState.turn];

      if (p.islandTurns > 0) {
        p.islandTurns--;
        gameState.message = `${p.name}님이 무인도에서 휴식 중입니다. (남은 턴: ${p.islandTurns})`;
        gameState.isDouble = false;
        syncStateToNetwork();
        setTimeout(nextTurn, 1000);
        return;
      }

      let count = 0;
      const moveInterval = setInterval(() => {
        p.pos = (p.pos + 1) % 40;
        count++;
        playSound('roll');
        drawBoard();
        if (p.pos === 0) p.money += 20;
        if (count >= steps) {
          clearInterval(moveInterval);
          handleTileEvent(p);
        }
      }, 120);
    }

    function handleTileEvent(p) {
      if (!isHost) return;
      const tile = TILES[p.pos];
      const state = gameState.board[p.pos];

      if (tile.type === 'city') {
        if (state.owner === -1) {
          gameState.awaitingAction = 'BUY';
          gameState.message = `${p.name}님이 빈 땅 ${tile.name}에 도착했습니다. 건물을 매입하시겠습니까?`;
        } else if (state.owner !== gameState.turn) {
          const owner = gameState.players[state.owner];
          const rent = tile.rLand + (state.villa ? tile.rVilla : 0) + (state.bldg ? tile.rBldg : 0) + (state.hotel ? tile.rHotel : 0);
          p.money -= rent;
          owner.money += rent;
          playSound('rent');
          gameState.message = `${p.name}님이 ${owner.name}의 ${tile.name} 통행료 ${rent}만 원을 지불했습니다!`;
          if (p.money < 0) gameState.awaitingAction = 'CRISIS';
        }
      } else if (tile.type === 'island') {
        p.islandTurns = 3;
        gameState.message = `🏝️ 무인도 도착! 3턴 동안 갇히게 됩니다.`;
      } else if (tile.type === 'tax') {
        const tax = 15;
        p.money -= tax;
        gameState.socialFundPool += tax;
        playSound('rent');
        gameState.message = `🏛️ 사회복지기금 15만 원을 기부하셨습니다.`;
        if (p.money < 0) gameState.awaitingAction = 'CRISIS';
      } else if (tile.type === 'fund_get') {
        const getFund = gameState.socialFundPool || 30;
        p.money += getFund;
        gameState.socialFundPool = 0;
        playSound('buy');
        gameState.message = `💰 축하합니다! 사회복지기금 ${getFund}만 원을 수령했습니다!`;
      } else if (tile.type === 'space') {
        p.pos = 39;
        gameState.message = `🚀 우주여행! 서울(🇰🇷)로 즉시 이동합니다.`;
        playSound('buy');
      } else if (tile.type === 'key') {
        const bonus = (Math.floor(Math.random() * 5) + 1) * 10;
        p.money += bonus;
        playSound('buy');
        gameState.message = `🔑 황금열쇠 행운! (+${bonus}만 원 획득)`;
      }

      syncStateToNetwork();
      if (gameState.awaitingAction) checkTurnAndAI();
      else setTimeout(nextTurn, 900);
    }

    function confirmBuy(buildType) {
      if (!isHost) return;
      const p = gameState.players[gameState.turn];
      const tile = TILES[p.pos];
      const state = gameState.board[p.pos];
      if (!p || tile.type !== 'city' || state.owner !== -1 || gameState.awaitingAction !== 'BUY') return;

      if (buildType === 'NONE') {
        gameState.awaitingAction = null;
        gameState.message = `${p.name}님이 ${tile.name} 매입을 포기했습니다.`;
      } else {
        const costs = { VILLA: tile.villa, BLDG: tile.bldg, HOTEL: tile.hotel };
        const cost = costs[buildType];
        if (!Number.isFinite(cost) || p.money < cost) return;
        p.money -= cost;
        state.owner = gameState.turn;
        state.villa = buildType === 'VILLA';
        state.bldg = buildType === 'BLDG';
        state.hotel = buildType === 'HOTEL';
        playSound('buy');
        gameState.awaitingAction = null;
        gameState.message = `${p.name}님이 ${tile.name}을(를) 매입했습니다.`;
      }
      syncStateToNetwork();
      setTimeout(nextTurn, 900);
    }

    function aiDecisionBuy() {
      const p = gameState.players[gameState.turn];
      const tile = TILES[p.pos];
      if (p.money >= tile.land + tile.hotel + 30) confirmBuy('HOTEL');
      else if (p.money >= tile.land + tile.bldg + 20) confirmBuy('BLDG');
      else if (p.money >= tile.land + tile.villa + 10) confirmBuy('VILLA');
      else if (p.money >= tile.land) confirmBuy('LAND');
      else confirmBuy('NONE');
    }

    function takeLoan() {
      const p = gameState.players[gameState.turn];
      p.money += 100; p.loan += 100; playSound('buy');
      gameState.message = `${p.name}님이 대출 100만 원을 받았습니다.`;
      if (p.money >= 0) gameState.awaitingAction = null;
      if (isHost) syncStateToNetwork();
      if (!gameState.awaitingAction) setTimeout(nextTurn, 1000);
    }

    function openSellMenu() { gameState.awaitingAction = 'SELL_SELECT'; updateUI(); }
    function cancelSellMenu() { gameState.awaitingAction = 'CRISIS'; updateUI(); }

    /* --- 복원 및 추가된 유실 함수 --- */

    function sellProperty(tileIdx) {
      if (!isHost) return;
      const p = gameState.players[gameState.turn];
      const tile = TILES[tileIdx];
      const bState = gameState.board[tileIdx];
      if (!p || !tile || !bState || bState.owner !== gameState.turn) return;
      const val = tile.land + (bState.villa ? tile.villa : 0) + (bState.bldg ? tile.bldg : 0) + (bState.hotel ? tile.hotel : 0);
      const refund = Math.floor(val * 0.8);
      p.money += refund;
      bState.owner = -1;
      bState.villa = false;
      bState.bldg = false;
      bState.hotel = false;
      playSound('buy');
      gameState.message = `${p.name}님이 ${tile.name}을(를) ${refund}만 원에 매각했습니다.`;
      if (p.money >= 0) gameState.awaitingAction = null;
      syncStateToNetwork();
      if (!gameState.awaitingAction) setTimeout(nextTurn, 900);
      else checkTurnAndAI();
    }

    function declareBankrupt() {
      const p = gameState.players[gameState.turn];
      p.bankrupt = true;
      p.money = 0;

      // 부동산 매각 처리
      gameState.board.forEach(tile => {
        if (tile.owner === gameState.turn) {
          tile.owner = -1;
          tile.villa = false;
          tile.bldg = false;
          tile.hotel = false;
        }
      });

      playSound('rent');
      gameState.message = `💀 ${p.name}님이 파산했습니다!`;
      gameState.awaitingAction = null;

      if (isHost) syncStateToNetwork();
      setTimeout(nextTurn, 1000);
    }

    function aiDecisionCrisis() {
      const p = gameState.players[gameState.turn];
      if (p.loan < 300) {
        takeLoan();
        return;
      }

      const propIdx = gameState.board.findIndex(t => t.owner === gameState.turn);
      if (propIdx !== -1) {
        const tile = TILES[propIdx];
        const t = gameState.board[propIdx];
        let val = tile.land + (t.villa ? tile.villa : 0) + (t.bldg ? tile.bldg : 0) + (t.hotel ? tile.hotel : 0);
        sellProperty(propIdx);
        return;
      }

      declareBankrupt();
    }

    function nextTurn() {
      if (gameState.status === 'gameover') return;
      rollLock = false;
      if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }

      const activePlayers = gameState.players.filter(p => !p.bankrupt);
      if (activePlayers.length <= 1) {
        const winner = activePlayers[0] || gameState.players[0];
        gameState.status = 'gameover';
        gameState.message = `🏆 축하합니다! ${winner.name}(${winner.emoji})님이 최종 승리했습니다!`;
        if (isHost) syncStateToNetwork();
        return;
      }

      if (!gameState.isDouble) {
        gameState.turn = (gameState.turn + 1) % 4;
        while (gameState.players[gameState.turn].bankrupt) {
          gameState.turn = (gameState.turn + 1) % 4;
        }
      } else {
        gameState.isDouble = false; // 한 번 더 진행 후 해제
      }

      gameState.awaitingAction = null;
      gameState.message = `${gameState.players[gameState.turn].name}(${gameState.players[gameState.turn].emoji})님의 순서입니다.`;
      
      if (isHost) syncStateToNetwork();
      checkTurnAndAI();
    }
  </script>
