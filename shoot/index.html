<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미니지호: 스페이스 슈터 (Theme Fitted)</title>
  <style>
    /* 📌 메인 오락실 테마 실시간 가변 연동 CSS 규격 */
    :root {
        --bg: #f8f9fa; --text: #333;
        --canvas-bg: #151b22; --border: #e9ecef;
        --btn-bg: #fff;
    }
    [data-theme="dark"] {
        --bg: #0d1117; --text: #c9d1d9;
        --canvas-bg: #151b22; --border: #30363d;
        --btn-bg: #21262d;
    }
    [data-theme="beige"] {
        --bg: #f5ebe0; --text: #4e3d30;
        --canvas-bg: #1e1b18; --border: #ddcbbb;
        --btn-bg: #eddfd0;
    }

    /* 🎨 위 변수를 적용한 무결성 자동 도색 디자인 */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg) !important;
        color: var(--text) !important;
        transition: background-color 0.3s, color 0.3s;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
    }

    button {
        background-color: var(--btn-bg) !important;
        color: var(--text) !important;
        border: 1px solid var(--border) !important;
        transition: 0.3s;
        cursor: pointer;
    }

    /* 게임 컨테이너 및 오버레이 UI */
    #game-container {
      position: relative;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    #gameCanvas {
      display: block;
      background-color: var(--canvas-bg);
      transition: background-color 0.3s;
    }

    #top-ui-bar {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 100;
      display: flex;
      gap: 8px;
    }

    #top-ui-bar button {
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      backdrop-filter: blur(6px);
      outline: none;
    }

    #top-ui-bar button:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    /* 시작 / 상점 레이어 */
    .overlay-screen {
      position: absolute;
      inset: 0;
      background: var(--bg);
      opacity: 0.95;
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 90;
      transition: background-color 0.3s;
    }

    .overlay-screen h1 {
      font-size: 32px;
      color: var(--text);
      margin-bottom: 10px;
    }

    .overlay-screen p {
      color: var(--text);
      opacity: 0.8;
      margin-bottom: 24px;
      font-size: 14px;
    }

    .btn-main {
      padding: 12px 32px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
    }

    .btn-main:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body data-theme="dark">

<div id="game-container">
  <!-- 상단 UI 컨텍스트 바 -->
  <div id="top-ui-bar">
    <button id="btn-theme" onclick="cycleTheme()">🎨 테마: DARK</button>
    <button id="btn-pause" onclick="togglePause()">⏸️ 일시정지</button>
    <button id="btn-sound" onclick="toggleSound()">🔊 사운드 ON</button>
  </div>

  <!-- 게임 오버레이 화면 (시작 화면) -->
  <div id="start-screen" class="overlay-screen">
    <h1>MINI JIHO: SPACE SHOOTER</h1>
    <p>방향키 / WASD : 이동 | Space : 발사</p>
    <button class="btn-main" onclick="startGame()">게임 시작</button>
  </div>

  <canvas id="gameCanvas" width="480" height="640"></canvas>
</div>

<script>
// ==========================================
// 테마 실시간 가변 연동 로직
// ==========================================
const themes = ['dark', 'beige', 'light'];
let currentThemeIdx = 0;

function cycleTheme() {
  currentThemeIdx = (currentThemeIdx + 1) % themes.length;
  const newTheme = themes[currentThemeIdx];
  
  if (newTheme === 'light') {
    document.body.removeAttribute('data-theme');
  } else {
    document.body.setAttribute('data-theme', newTheme);
  }
  
  document.getElementById('btn-theme').innerText = `🎨 테마: ${newTheme.toUpperCase()}`;
}

// ==========================================
// 1. 프로 작곡가 스타일 Web Audio BGM 합성 엔진
// ==========================================
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

const MusicComposer = {
  ctx: null,
  currentBGM: null,
  isPlaying: false,
  step: 0,

  m2f(note) {
    return note ? 440 * Math.pow(2, (note - 69) / 12) : 0;
  },

  tracks: {
    1: { bpm: 132, lead: [72, 0, 72, 74, 76, 0, 72, 67, 69, 0, 72, 69, 67, 0, 64, 62], bass: [36, 36, 48, 36, 41, 41, 53, 41, 43, 43, 55, 43, 36, 36, 48, 36], type: 'square' },
    2: { bpm: 115, lead: [69, 72, 76, 79, 76, 72, 69, 72, 67, 71, 74, 78, 74, 71, 67, 71], bass: [45, 0, 45, 0, 43, 0, 43, 0, 41, 0, 41, 0, 43, 0, 43, 0], type: 'sine' },
    3: { bpm: 145, lead: [66, 66, 69, 66, 73, 66, 71, 69, 66, 66, 69, 66, 75, 74, 71, 69], bass: [42, 42, 42, 54, 42, 42, 52, 42, 40, 40, 40, 52, 40, 40, 50, 40], type: 'sawtooth' },
    4: { bpm: 128, lead: [63, 67, 70, 75, 73, 70, 67, 63, 65, 68, 72, 77, 75, 72, 68, 65], bass: [39, 39, 51, 39, 41, 41, 53, 41, 44, 44, 56, 44, 43, 43, 55, 43], type: 'triangle' },
    5: { bpm: 138, lead: [62, 0, 65, 68, 67, 0, 65, 62, 60, 0, 63, 67, 65, 0, 63, 60], bass: [38, 38, 38, 38, 36, 36, 36, 36, 34, 34, 34, 34, 36, 36, 36, 36], type: 'sawtooth' },
    6: { bpm: 160, lead: [72, 73, 72, 69, 72, 73, 75, 73, 72, 73, 72, 69, 68, 69, 68, 65], bass: [48, 60, 48, 60, 49, 61, 49, 61, 48, 60, 48, 60, 44, 56, 44, 56], type: 'sawtooth' }
  },

  playTone(freq, type, duration, vol, pan = 0) {
    if (!freq || !this.ctx || this.ctx.state !== 'running' || isMuted) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    const panner = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;

    osc.type = type;
    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

    if (panner) {
      panner.pan.setValueAtTime(pan, this.ctx.currentTime);
      osc.connect(gain);
      gain.connect(panner);
      panner.connect(this.ctx.destination);
    } else {
      osc.connect(gain);
      gain.connect(this.ctx.destination);
    }

    osc.start();
    osc.stop(this.ctx.currentTime + duration);
  },

  playDrum(step) {
    if (isMuted || !this.ctx || this.ctx.state !== 'running') return;
    if (step % 4 === 0) {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.frequency.setValueAtTime(120, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.15);
    }
    if (step % 4 === 2) {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(220, this.ctx.currentTime);
      gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.1);
    }
  },

  start(stageNum) {
    this.stop();
    this.ctx = audioCtx;
    if (!this.ctx) return;

    const track = this.tracks[stageNum] || this.tracks[1];
    this.isPlaying = true;
    this.step = 0;
    const stepTime = (60 / track.bpm) / 4 * 1000;

    this.currentBGM = setInterval(() => {
      if (!this.isPlaying || isPaused) return;

      const leadNote = track.lead[this.step % track.lead.length];
      const bassNote = track.bass[this.step % track.bass.length];

      if (leadNote) this.playTone(this.m2f(leadNote), track.type, 0.2, 0.1, -0.2);
      if (bassNote) this.playTone(this.m2f(bassNote), 'triangle', 0.25, 0.15, 0.2);
      this.playDrum(this.step);

      this.step++;
    }, stepTime);
  },

  stop() {
    this.isPlaying = false;
    if (this.currentBGM) {
      clearInterval(this.currentBGM);
      this.currentBGM = null;
    }
  }
};

function playLaserSFX() {
  if (isMuted || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(800, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.08);
  gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.08);
}

// ==========================================
// 2. 게임 메인 로직 및 엔진
// ==========================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let isPaused = false;
let isMuted = false;
let gameRunning = false;
let stage = 1;
let score = 0;
let gold = 0;

const player = {
  x: canvas.width / 2 - 15,
  y: canvas.height - 60,
  w: 30,
  h: 30,
  speed: 5,
  hp: 100
};

const keys = {};
const bullets = [];
const enemies = [];

window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });

function togglePause() {
  isPaused = !isPaused;
  document.getElementById('btn-pause').innerText = isPaused ? '▶️ 재개' : '⏸️ 일시정지';
}

function toggleSound() {
  isMuted = !isMuted;
  document.getElementById('btn-sound').innerText = isMuted ? '🔇 사운드 OFF' : '🔊 사운드 ON';
}

function startGame() {
  initAudio();
  document.getElementById('start-screen').style.display = 'none';
  gameRunning = true;
  stage = 1;
  score = 0;
  gold = 0;
  player.hp = 100;
  MusicComposer.start(stage);
  requestAnimationFrame(gameLoop);
}

let lastShootTime = 0;

function update() {
  if (isPaused || !gameRunning) return;

  if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 0) player.x -= player.speed;
  if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - player.w) player.x += player.speed;
  if ((keys['ArrowUp'] || keys['KeyW']) && player.y > 0) player.y -= player.speed;
  if ((keys['ArrowDown'] || keys['KeyS']) && player.y < canvas.height - player.h) player.y += player.speed;

  const now = Date.now();
  if (keys['Space'] && now - lastShootTime > 150) {
    bullets.push({ x: player.x + player.w / 2 - 3, y: player.y, w: 6, h: 14, speed: 8 });
    playLaserSFX();
    lastShootTime = now;
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].y -= bullets[i].speed;
    if (bullets[i].y < -20) bullets.splice(i, 1);
  }

  if (Math.random() < 0.03 + (stage * 0.005)) {
    enemies.push({
      x: Math.random() * (canvas.width - 30),
      y: -30,
      w: 30,
      h: 30,
      hp: 1 + Math.floor(stage / 2),
      speed: 1.5 + Math.random() * 2 + (stage * 0.2)
    });
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.y += e.speed;

    if (e.x < player.x + player.w && e.x + e.w > player.x &&
        e.y < player.y + player.h && e.y + e.h > player.y) {
      player.hp -= 10;
      enemies.splice(i, 1);
      continue;
    }

    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (b.x < e.x + e.w && b.x + b.w > e.x &&
          b.y < e.y + e.h && b.y + b.h > e.y) {
        e.hp--;
        bullets.splice(j, 1);
        if (e.hp <= 0) {
          score += 100;
          gold += 10;
          enemies.splice(i, 1);
          if (score >= stage * 2000 && stage < 6) {
            stage++;
            MusicComposer.start(stage);
          }
          break;
        }
      }
    }

    if (e && e.y > canvas.height + 30) enemies.splice(i, 1);
  }
}

function render() {
  // CSS 변수 `--canvas-bg`를 캔버스 배경에 자동 연동
  const canvasBg = getComputedStyle(document.body).getPropertyValue('--canvas-bg').trim() || '#151b22';
  ctx.fillStyle = canvasBg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 별빛 배경 연출
  ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
  for (let i = 0; i < 20; i++) {
    const rx = (Math.sin(i * 99 + Date.now() * 0.001) * 0.5 + 0.5) * canvas.width;
    const ry = (Math.cos(i * 33 + Date.now() * 0.001) * 0.5 + 0.5) * canvas.height;
    ctx.fillRect(rx, ry, 2, 2);
  }

  if (!gameRunning) return;

  // 기체 (플레이어)
  ctx.fillStyle = '#00e5ff';
  ctx.beginPath();
  ctx.moveTo(player.x + player.w / 2, player.y);
  ctx.lineTo(player.x, player.y + player.h);
  ctx.lineTo(player.x + player.w, player.y + player.h);
  ctx.fill();

  // 총알
  ctx.fillStyle = '#ffea00';
  bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

  // 적
  ctx.fillStyle = '#ff0055';
  enemies.forEach(e => ctx.fillRect(e.x, e.y, e.w, e.h));

  // HUD
  ctx.fillStyle = '#ffffff';
  ctx.font = '14px sans-serif';
  ctx.fillText(`STAGE: ${stage}`, 15, 30);
  ctx.fillText(`SCORE: ${score}`, 15, 50);
  ctx.fillText(`GOLD: ${gold}`, 15, 70);

  // 체력바
  ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
  ctx.fillRect(15, 80, 100, 8);
  ctx.fillStyle = '#00ff88';
  ctx.fillRect(15, 80, Math.max(0, player.hp), 8);

  // 일시정지 오버레이
  if (isPaused) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00e5ff';
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
    ctx.textAlign = 'left';
  }
}

function gameLoop() {
  update();
  render();
  if (gameRunning) {
    requestAnimationFrame(gameLoop);
  }
}
</script>
</body>
</html>
