<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"><title>미니지 - 슈팅게임</title>
    <style>:root { --bg: #f8f9fa; --text: #333; --canvas-bg: #05070a; --border: #e9ecef; --btn-bg: #fff; } [data-theme="beige"] { --bg: #f5ebe0; --text: #4e3d30; --canvas-bg: #14100c; --border: #ddcbbb; --btn-bg: #eddfd0; } [data-theme="dark"] { --bg: #0d1117; --text: #c9d1d9; --canvas-bg: #020305; --border: #30363d; --title-color: #58a6ff; --sub-color: #8b949e; --accent-color: #58a6ff; } body { text-align: center; background-color: var(--bg); color: var(--text); font-family: sans-serif; padding-top: 15px; margin:0; transition: 0.3s; } canvas { background-color: var(--canvas-bg); display: block; margin: 10px auto; border: 4px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); } button { background-color: var(--btn-bg); color: var(--text); border: 1px solid var(--border); padding: 8px 16px; font-size: 0.95rem; border-radius: 8px; cursor: pointer; margin:4px; font-weight: bold; } #board { font-size: 1.25rem; font-weight: bold; color: #fcc419; margin-bottom: 4px; } .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index:10; } .modal-content { background: var(--bg); padding: 25px; border-radius: 16px; border: 2px solid var(--border); text-align: center; color: var(--text); max-width: 320px; } .shop-grid { display: flex; flex-direction: column; gap: 8px; margin: 15px 0; } .shop-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.05); padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; } .choice-btn { background-color: #ff6b6b; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; } .choice-btn.yes { background-color: #4dadf7; }</style>
</head>
<body>
    <h1>🚀 스페이스 슈팅</h1><div id="board">❤️ 실드: 10 / 10 | 🏆 점수: 0</div><canvas id="gameCanvas" width="400" height="460"></canvas><div><button onclick="openShop()">🛒 강화 상점 열기</button><button onclick="location.href='../'">🏠 오락실 메인</button></div><div class="modal" id="overModal"><div class="modal-content"><h2 id="modalTitle" style="margin-top:0;">💥 GAME OVER</h2><p id="finalScore" style="font-size:1.1rem; font-weight:bold;"></p><button onclick="restart()">🔄 다시 시작</button></div></div><div class="modal" id="weaponModal"><div class="modal-content"><h2 style="color:#fcc419; margin-top:0;">🎁 특수 장비 드롭!</h2><p id="weaponDesc" style="font-size:1.1rem; font-weight:bold;"></p><button class="choice-btn yes" onclick="equipWeapon(true)">예 (개조)</button><button class="choice-btn" onclick="equipWeapon(false)">아니오</button></div></div><div class="modal" id="shopModal"><div class="modal-content"><h2 style="color:#51cf66; margin-top:0;">🛒 전투 연구 상점</h2><p id="shopPoints" style="font-weight:bold; color:#fcc419;">보유 포인트: 0 P</p><div class="shop-grid"><div class="shop-item"><span id="strLv">⚔️ 공격력 Lv.1</span><button id="dmgCostBtn" onclick="buyUpgrade('dmg')">5P</button></div><div class="shop-item"><span id="probLv">🍀 장비확률업 Lv.1</span><button id="probCostBtn" onclick="buyUpgrade('prob')">5P</button></div><div class="shop-item"><span id="hpLv">🛡️ 최대실드 Lv.10</span><button id="hpCostBtn" onclick="buyUpgrade('hp')">5P</button></div></div><button class="choice-btn yes" onclick="closeShop()">💾 연구 완료 (닫기)</button></div></div>
    <script>const savedTheme=localStorage.getItem('minig-theme'); if(savedTheme&&savedTheme!=='white')document.documentElement.setAttribute('data-theme',savedTheme); const audioCtx=new(window.AudioContext||window.webkitAudioContext)(); let bgmInterval=null,bgmStep=0,bgmGain=null;
    function startBGM(){ if(bgmInterval)return; try{ bgmGain=audioCtx.createGain(); bgmGain.gain.setValueAtTime(0.01,audioCtx.currentTime); bgmGain.connect(audioCtx.destination); }catch(e){}
    bgmInterval=setInterval(()=>{ if(gameState!=='play'||isOver)return; if(document.getElementById("shopModal").style.display==="flex")return; try{ const osc=audioCtx.createOscillator(); osc.connect(bgmGain); osc.type='triangle'; let f=(bgmStep%4===0)?110:(bgmStep%4===2)?146:130; if(bgmStep%8>=6)f=165; osc.frequency.setValueAtTime(f,audioCtx.currentTime); osc.start(); osc.stop(audioCtx.currentTime+0.12); bgmStep++; }catch(e){} },180); }
    function playSound(type){ try{ const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); const now=audioCtx.currentTime; if(type==='laser'){ osc.type='square'; osc.frequency.setValueAtTime(900,now); osc.frequency.exponentialRampToValueAtTime(300,now+0.05); gain.gain.setValueAtTime(0.015,now); gain.gain.linearRampToValueAtTime(0,now+0.05); osc.start(now); osc.stop(now+0.05); }else if(type==='hit'){ osc.type='triangle'; osc.frequency.setValueAtTime(220,now); gain.gain.setValueAtTime(0.05,now); gain.gain.linearRampToValueAtTime(0,now+0.05); osc.start(now); osc.stop(now+0.05); }else if(type==='explode'){ osc.type='sawtooth'; osc.frequency.setValueAtTime(350,now); osc.frequency.linearRampToValueAtTime(50,now+0.1); gain.gain.setValueAtTime(0.04,now); gain.gain.linearRampToValueAtTime(0,now+0.1); osc.start(now); osc.stop(now+0.1); }else if(type==='win'){ osc.type='square'; osc.frequency.setValueAtTime(523,now); osc.frequency.setValueAtTime(659,now+0.06); osc.frequency.setValueAtTime(783,now+0.12); gain.gain.setValueAtTime(0.03,now); gain.gain.linearRampToValueAtTime(0,now+0.2); osc.start(now); osc.stop(now+0.2); }else if(type==='over'){ osc.type='sawtooth'; osc.frequency.setValueAtTime(180,now); osc.frequency.linearRampToValueAtTime(30,now+0.4); gain.gain.setValueAtTime(0.12,now); gain.gain.linearRampToValueAtTime(0,now+0.4); osc.start(now); osc.stop(now+0.4); }else if(type==='talk'){ osc.type='sine'; osc.frequency.setValueAtTime(400,now); gain.gain.setValueAtTime(0.01,now); gain.gain.linearRampToValueAtTime(0,now+0.03); osc.start(now); osc.stop(now+0.03); }else if(type==='start'){ osc.type='square'; osc.frequency.setValueAtTime(587,now); osc.frequency.setValueAtTime(880,now+0.08); gain.gain.setValueAtTime(0.04,now); gain.gain.linearRampToValueAtTime(0,now+0.12); osc.start(now); osc.stop(now+0.12); } }catch(e){}}
    const canvas=document.getElementById("gameCanvas"),ctx=canvas.getContext("2d"); let player={x:180,y:380,w:32,h:32,speed:6,hp:10,maxHp:10,invuln:0,currentWeapon:'기본 레이저',dmg:1,upgProbLv:0}; let bullets=[],enemyBullets=[],enemies=[],stars=[],items=[],explosions=[]; let score=0,keys={},isOver=!1,gameId=null,boss=null,bossSpawned=!1,shopPoints=0,bossLevel=1,gameState='story',storyIndex=0,textProgress=0,pendingWeapon=null,enemiesKilled=0; let upgCost={dmg:5,prob:5,hp:5},upgLv={dmg:1,prob:1,hp:10};
    const storyTexts=["서기 2026년... 지구 방위대 최후의 함선 '미니지호'..","상점에서 확률 연구 시 커먼 확률은 줄어들고 레어/에픽/전설 확률이 일제히 상승한다!","다이아몬드 기동, 공중 루프 도약 등 잡몹들의 비행 전술 모션이 대폭 강화되었다.","격파할 때마다 진화하여 차원을 넘어 쳐들어오는 보스를 섬멸하라!","👉 [Space] 또는 화면을 터치해 우주 전쟁을 시작하세요!"];
    document.addEventListener("keydown",e=>{keys[e.key]=!0;if(gameState==='story'&&e.key===" "){if(textProgress<storyTexts[storyIndex].length)textProgress=storyTexts[storyIndex].length;else{storyIndex++;textProgress=0;if(storyIndex>=storyTexts.length){gameState='play';playSound('start');startBGM();}}}else if(gameState==='play'&&e.key===" "&&!isOver&&document.getElementById("weaponModal").style.display!=="flex"&&document.getElementById("shopModal").style.display!=="flex"){fireWeapon();}}); document.addEventListener("keyup",e=>keys[e.key]=!1);
    function openShop(){document.getElementById("shopModal").style.display="flex";updateShopUI()} function closeShop(){document.getElementById("shopModal").style.display="none";keys[" "]=!1}
    function updateShopUI(){let e=Math.max(10,50-5*player.upgProbLv),t=35+3*player.upgProbLv,n=13+1.5*player.upgProbLv,s=2+0.5*player.upgProbLv; document.getElementById("shopPoints").innerText=`보유 포인트: ${shopPoints} P`;document.getElementById("strLv").innerText=`\u2694\ufe0f 공격력 Lv.${upgLv.dmg} (+${upgLv.dmg-1})`;document.getElementById("probLv").innerText=`\ud83c\udf40 확률업 Lv.${upgLv.prob} (전설:${s.toFixed(1)}%)`;document.getElementById("hpLv").innerText=`\ud83d\udee1\ufe0f 최대실드 Lv.${upgLv.hp}`;document.getElementById("dmgCostBtn").innerText=`${upgCost.dmg} P`;document.getElementById("probCostBtn").innerText=`${upgCost.prob} P`;document.getElementById("hpCostBtn").innerText=`${upgCost.hp} P`}
    function buyUpgrade(type){if(shopPoints>=upgCost[type]){shopPoints-=upgCost[type];if(type==='dmg'){upgLv.dmg++;player.dmg+=0.5}else if(type==='prob'){upgLv.prob++;player.upgProbLv++}else if(type==='hp'){upgLv.hp+=2;player.maxHp+=2;player.hp+=2}upgCost[type]=Math.floor(1.6*upgCost[type]);updateShopUI();updateBoard();playSound('start')}}
    function getRandomWeapon(){let e=100*Math.random(),t=Math.max(10,50-5*player.upgProbLv),n=35+3*player.upgProbLv,s=13+1.5*player.upgProbLv;if(e<t)return Math.random()<0.5?{wp:'기본 레이저',grade:'\ud83d\udfe2 [커먼]'}:{wp:'\ud83d\udd31 3갈래 확산탄',grade:'\ud83d\udfe2 [커먼]'};if(e<t+n){let a=Math.random();return a<0.33?{wp:'\ud83d\ude80 범위 미사일',grade:'\ud83d\udd35 [레어]'}:a<0.66?{wp:'\ud83d\udce1 관통 레이저',grade:'\ud83d\udd35 [레어]'}:{wp:'\ud83d\udca5 기뢰 설치',grade:'\ud83d\udd35 [레어]'}}else return e<t+n+s?Math.random()<0.5?{wp:'\ud83d\udee1\ufe0f 유도 드론',grade:'\ud83d\udfe3 [에픽]'}:{wp:'CNG 블랙홀',grade:'\ud83d\udfe3 [에픽]'}:{wp:'\ud83d\udca5 핵융합 폭탄',grade:'\ud83d\udfe1 [전설]'}}
    function fireWeapon(){if(player.currentWeapon=='기본 레이저'){bullets.push({x:player.x+14,y:player.y,w:4,h:10,speed:9,type:'normal'});playSound('laser')}else if(player.currentWeapon==='\ud83d\ude80 범위 미사일'){bullets.push({x:player.x+10,y:player.y,w:12,h:16,speed:7,type:'missile'});playSound('laser')}else if(player.currentWeapon==='\ud83d\udca5 기뢰 설치'){bullets.push({x:player.x+14,y:player.y+player.h,w:10,h:10,speed:-1,type:'mine'});playSound('hit')}else if(player.currentWeapon==='\ud83d\udce1 관통 레이저'){bullets.push({x:player.x+13,y:player.y,w:6,h:25,speed:12,type:'piece'});playSound('laser')}else if(player.currentWeapon==='\ud83d\udd31 3갈래 확산탄'){bullets.push({x:player.x+14,y:player.y,w:4,h:8,speed:8,dx:-2,type:'normal'});bullets.push({x:player.x+14,y:player.y,w:4,h:10,speed:9,dx:0,type:'normal'});bullets.push({x:player.x+14,y:player.y,w:4,h:8,speed:8,dx:2,type:'normal'});playSound('laser')}else if(player.currentWeapon==='\ud83d\udee1\ufe0f 유도 드론'){bullets.push({x:player.x-8,y:player.y+10,w:6,h:6,speed:7,type:'drone'});bullets.push({x:player.x+player.w+2,y:player.y+10,w:6,h:6,speed:7,type:'drone'});playSound('laser')}else if(player.currentWeapon==='CNG 블랙홀'){bullets.push({x:player.x+10,y:player.y,w:12,h:12,speed:4,type:'blackhole'});playSound('hit')}else if(player.currentWeapon==='\ud83d\udca5 핵융합 폭탄'){explosions.push({x:200,y:220,rad:10,isNuke:!0});playSound('explode');player.currentWeapon='기본 레이저'}}
    function askEquip(g,wp){pendingWeapon=wp;document.getElementById("weaponDesc").innerText=`${g} ${wp}`;document.getElementById("weaponModal").style.display="flex"} function equipWeapon(yes){if(yes&&pendingWeapon){player.currentWeapon=pendingWeapon;playSound('start')}document.getElementById("weaponModal").style.display="none";pendingWeapon=null;keys[" "]=!1;openShop()}
    function initStars(){for(let e=0;e<25;e++)stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,size:1+1.5*Math.random(),speed:1+2*Math.random()})}
    function restart(){document.getElementById("overModal").style.display="none";document.getElementById("weaponModal").style.display="none";document.getElementById("shopModal").style.display="none";player.x=180;player.y=380;player.hp=10;player.maxHp=10;player.currentWeapon='기본 레이저';player.dmg=1;player.upgProbLv=0;bullets=[];enemyBullets=[];enemies=[];items=[];explosions=[];boss=null;bossSpawned=!1;score=0;enemiesKilled=0;bossLevel=1;shopPoints=0;isOver=!1;gameState='story';storyIndex=0;textProgress=0;updateBoard();loop()}
    function updateBoard(){const e=document.getElementById("board");if(gameState==='story')e.innerText="\ud83c\udf0c 우주 상황실";else if(bossSpawned&&boss&&boss.hp>0)e.innerText=`\ud83d\udee1\ufe0f 실드: ${player.hp}/${player.maxHp} | \ud83c\fc6 점수: ${score} | \ud83d\udc7e BOSS Lv.${bossLevel}: ${Math.ceil(boss.hp)} / ${30*bossLevel}`;else e.innerText=`\ud83d\udee1\ufe0f 실드: ${player.hp}/${player.maxHp} | \ud83c\fc6 점수: ${score} | 다음 습격까지 잡몹: ${Math.max(0,15-enemiesKilled)}마리`}
    let frameCount=0;
    for(let o=enemyBullets.length-1; o>=0; o--){enemyBullets[o].y+=enemyBullets[o].speed;if(enemyBullets[o].dx)enemyBullets[o].x+=enemyBullets[o].dx;ctx.fillStyle="#ff4d4d";ctx.fillRect(enemyBullets[o].x,enemyBullets[o].y,enemyBullets[o].w,enemyBullets[o].h);if(enemyBullets[o].y>canvas.height||enemyBullets[o].x<0||enemyBullets[o].x>canvas.width){enemyBullets.splice(o,1);continue}explosions.forEach(e=>{if(enemyBullets[o]){let t=Math.sqrt(Math.pow(enemyBullets[o].x-e.x,2)+Math.pow(enemyBullets[o].y-e.y,2));if(t<=e.rad)enemyBullets.splice(o,1)}});if(!enemyBullets[o])continue;if(player.invuln==0&&enemyBullets[o].x<player.x+player.w&&enemyBullets[o].x+enemyBullets[o].w>player.x&&enemyBullets[o].y<player.y+player.h&&enemyBullets[o].y+enemyBullets[o].h>player.y){enemyBullets.splice(o,1);player.hp--;player.invuln=60;updateBoard();playSound('hit');if(player.hp<=0){triggerGameOver();return}continue}}
    for(let u=items.length-1; u>=0; u--){items[u].y+=1.5;ctx.save();ctx.font="24px sans-serif";ctx.fillText("\ud83c\udf81",items[u].x,items[u].y+20);ctx.restore();if(items[u].x<player.x+player.w&&items[u].x+24>player.x&&items[u].y<player.y+player.h&&items[u].y+20>player.y){items.splice(u,1);playSound('item');player.hp=player.maxHp;updateBoard();let e=getRandomWeapon();askEquip(e.grade,e.wp);continue}if(items[u].y>canvas.height){items.splice(u,1);openShop()}}
    if(enemiesKilled>=15&&!bossSpawned){bossSpawned=!0;boss={x:160,y:-60,w:64,h:44,hp:30*bossLevel,maxHp:30*bossLevel,targetY:50,speed:1.8+0.1*bossLevel,dx:2,shotTimer:0};updateBoard()}
    if(bossSpawned&&boss){if(boss.hp>0){if(boss.y<boss.targetY)boss.y+=1;else{boss.x+=boss.dx;if(boss.x<10||boss.x>canvas.width-boss.w-10)boss.dx=-boss.dx;boss.shotTimer++;if(boss.shotTimer%Math.max(15,35-2*bossLevel)===0){enemyBullets.push({x:boss.x+boss.w/2-2,y:boss.y+boss.h,w:6,h:12,speed:4.5})}if(boss.shotTimer%70===0){enemyBullets.push({x:boss.x+10,y:boss.y+boss.h,w:6,h:6,speed:3.8,dx:-1.2});enemyBullets.push({x:boss.x+boss.w/2,y:boss.y+boss.h,w:6,h:6,speed:4.2,dx:0});enemyBullets.push({x:boss.x+boss.w-10,y:boss.y+boss.h,w:6,h:6,speed:3.5,dx:1.2})}if(boss.shotTimer%110===0){for(let e=0;e<6;e++){let t=e*Math.PI/3;enemyBullets.push({x:boss.x+32,y:boss.y+22,w:5,h:5,speed:2.2,dx:Math.cos(t)*2})}}if(boss.shotTimer%140===0){enemyBullets.push({x:boss.x+5,y:boss.y+boss.h,w:4,h:10,speed:3});enemyBullets.push({x:boss.x+30,y:boss.y+boss.h,w:4,h:10,speed:3});enemyBullets.push({x:boss.x+55,y:boss.y+boss.h,w:4,h:10,speed:3})}}ctx.save();ctx.font="54px sans-serif";ctx.fillText("\ud83d\udef8",boss.x,boss.y+44);ctx.restore();explosions.forEach(e=>{if(boss&&boss.hp>0){let t=Math.sqrt(Math.pow(boss.x+32-e.x,2)+Math.pow(boss.y+22-e.y,2));if(t<=e.rad+32){boss.hp-=e.isNuke?0.4*player.dmg:0.15*player.dmg;updateBoard();if(boss.hp<=0){score+=150*bossLevel;shopPoints+=5+5*bossLevel;enemiesKilled=0;bossSpawned=!1;playSound('win');items.push({x:boss.x+boss.w/2-12,y:boss.y});bossLevel++;enemies=[];enemyBullets=[];updateBoard()}}}});if(boss&&boss.hp>0&&player.invuln==0&&player.x<boss.x+boss.w&&player.x+player.w>boss.x&&player.y<boss.y+boss.h&&player.y+player.h>boss.y){player.hp=0;triggerGameOver();return}}for(let p=bullets.length-1;p>=0;p--){if(boss&&boss.hp>0&&bullets[p].x<boss.x+boss.w&&bullets[p].x+bullets[p].w>boss.x&&bullets[p].y<boss.y+boss.h&&bullets[p].y+bullets[p].h>boss.y){if(bullets[p].type==='missile')explosions.push({x:bullets[p].x,y:bullets[p].y,rad:10});boss.hp-=player.dmg;if(bullets[p].type!=='piece')bullets.splice(p,1);updateBoard();playSound('hit');if(boss.hp<=0){score+=150*bossLevel;shopPoints+=5+5*bossLevel;enemiesKilled=0;bossSpawned=!1;playSound('win');items.push({x:boss.x+boss.w/2-12,y:boss.y});bossLevel++;enemies=[];enemyBullets=[];updateBoard()}break}}}
    if(!bossSpawned&&Math.random()<0.025){let h=Math.random(),g='sine',m=2+1.2*Math.random();if(h<0.2)g='rush';else if(h<0.4)g='track';else if(h<0.65)g='diamond';else if(h<0.85)g='loop';if(g==='rush')m=4.5;enemies.push({x:Math.random()*(canvas.width-38),y:-40,w:36,h:32,speed:m,pType:g,sinTimer:Math.random()*10,shotTimer:Math.floor(40*Math.random()),dx:Math.random()<0.5?-2:2,dirY:1})}
    for(let f=enemies.length-1;f>=0;f--){enemies[f].y+=enemies[f].speed;if(enemies[f].pType==='diamond'){enemies[f].y+=0.7*enemies[f].speed;enemies[f].x+=enemies[f].dx;if(enemies[f].x<10||enemies[f].x>canvas.width-45)enemies[f].dx=-enemies[f].dx}else if(enemies[f].pType==='loop'){enemies[f].sinTimer+=0.06;enemies[f].y+=enemies[f].speed*enemies[f].dirY;enemies[f].x+=1.8*Math.cos(enemies[f].sinTimer);if(enemies[f].y>180&&enemies[f].dirY===1)enemies[f].dirY=-0.4;if(enemies[f].y<60&&enemies[f].dirY<0)enemies[f].dirY=1}else{enemies[f].y+=enemies[f].speed;if(enemies[f].pType==='sine'){enemies[f].sinTimer+=0.05;enemies[f].x+=2.5*Math.sin(enemies[f].sinTimer)}else if(enemies[f].pType==='track'){enemies[f].x+=0.015*(player.x-enemies[f].x)}}if(enemies[f].x<5)enemies[f].x=5;if(enemies[f].x>canvas.width-40)enemies[f].x=canvas.width-40;enemies[f].shotTimer++;if(!bossSpawned&&enemies[f].shotTimer>=150&&enemies[f].y<player.y-30){let e=player.x+16-(enemies[f].x+18),t=player.y+16-(enemies[f].y+32),n=Math.sqrt(e*e+t*t);enemyBullets.push({x:enemies[f].x+16,y:enemies[f].y+32,w:5,h:5,speed:3.2,dx:e/n*1.6});enemies[f].shotTimer=0}ctx.save();ctx.font="36px sans-serif";ctx.fillText("\ud83d\udef8",enemies[f].x,enemies[f].y+30);ctx.restore();if(enemies[f].y>canvas.height){enemies.splice(f,1);continue}explosions.forEach(e=>{if(enemies[f]){let t=Math.sqrt(Math.pow(enemies[f].x+18-e.x,2)+Math.pow(enemies[f].y+16-e.y,2));if(t<=e.rad+16){enemies.splice(f,1);score+=10;enemiesKilled++;updateBoard();playSound('explode')}}});if(!enemies[f])continue;if(player.invuln==0&&enemies[f].x<player.x+player.w&&enemies[f].x+enemies[f].w>player.x&&enemies[f].y<player.y+player.h&&enemies[f].y+enemies[f].h>player.y){enemies.splice(f,1);player.hp--;player.invuln=60;updateBoard();playSound('hit');if(player.hp<=0){triggerGameOver();return}continue}for(let v=bullets.length-1;v>=0;v--){if(bullets[v].x<enemies[f].x+enemies[f].w&&bullets[v].x+bullets[v].w>enemies[f].x&&bullets[v].y<enemies[f].y+enemies[f].h&&bullets[v].y+bullets[v].h>enemies[f].y){if(bullets[v].type==='missile')explosions.push({x:bullets[v].x,y:bullets[v].y,rad:10});enemies.splice(f,1);if(bullets[v].type!=='piece')bullets.splice(v,1);score+=10;enemiesKilled++;updateBoard();playSound('explode');break}}}}
    function triggerGameOver(){isOver=!0;cancelAnimationFrame(gameId);playSound('over');document.getElementById("modalTitle").innerText="\ud83d\udca5 GAME OVER";document.getElementById("finalScore").innerText=`최종 점수: ${score}점\n처치한 보스: ${bossLevel-1}기`;document.getElementById("overModal").style.display="flex"} initStars();restart();</script>
