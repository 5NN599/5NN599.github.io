<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Space Shooter - Final Complete Edition</title>
    <style>
        :root {
            --bg-color: #05050a;
            --text-color: #00ffcc;
            --panel-bg: rgba(10, 15, 30, 0.85);
            --border-color: #00ffcc;
            --accent-color: #ff0055;
            --gold-color: #ffd700;
        }

        [data-theme="beige"], [data-theme="light"] {
            --bg-color: #f4eae1;
            --text-color: #2b2118;
            --panel-bg: rgba(235, 222, 208, 0.9);
            --border-color: #8c6d53;
            --accent-color: #d9381e;
            --gold-color: #b8860b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        #game-container {
            position: relative;
            width: 900px;
            height: 650px;
            border: 3px solid var(--border-color);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            background: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlays */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 5px var(--border-color);
        }

        .hp-bar-container {
            width: 150px;
            height: 14px;
            background: #222;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-left: 8px;
        }

        .hp-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff0055, #00ffcc);
            transition: width 0.1s ease;
        }

        .boss-hp-container {
            position: absolute;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            background: var(--panel-bg);
            border: 1px solid var(--accent-color);
            padding: 6px 12px;
            text-align: center;
            display: none;
        }

        .boss-hp-bar {
            width: 100%;
            height: 12px;
            background: #222;
            border: 1px solid var(--accent-color);
            margin-top: 4px;
        }

        .boss-hp-fill {
            width: 100%;
            height: 100%;
            background: var(--accent-color);
            transition: width 0.05s linear;
        }

        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
        }

        .overlay-title {
            font-size: 36px;
            margin-bottom: 15px;
            color: var(--border-color);
            text-shadow: 0 0 10px var(--border-color);
            text-align: center;
        }

        .overlay-btn {
            background: transparent;
            color: var(--border-color);
            border: 2px solid var(--border-color);
            padding: 12px 30px;
            font-size: 18px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }

        .overlay-btn:hover {
            background: var(--border-color);
            color: #000;
            box-shadow: 0 0 20px var(--border-color);
        }

        .guide-text {
            font-size: 13px;
            color: #aaa;
            margin-top: 15px;
            line-height: 1.6;
            text-align: center;
        }

        .super-status {
            color: var(--gold-color);
            font-weight: bold;
            animation: blink 0.5s infinite alternate;
            display: none;
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="900" height="650"></canvas>

    <!-- HUD Layer -->
    <div class="ui-layer">
        <div class="hud-top">
            <div>
                HP: <div class="hp-bar-container"><div id="hpFill" class="hp-bar-fill"></div></div>
            </div>
            <div>STAGE: <span id="stageTxt">1</span></div>
            <div>WEAPON: <span id="weaponTxt" style="color: var(--accent-color);">VULCAN</span></div>
            <div>SCORE: <span id="scoreTxt">000000</span></div>
            <div id="superStatus" class="super-status">🔥 SUPER BURST 🔥</div>
        </div>

        <!-- Boss Health Bar -->
        <div id="bossHpBox" class="boss-hp-container">
            <div style="font-size: 12px; color: var(--accent-color); font-weight: bold;" id="bossNameTxt">WARNING: BOSS APPROACHING</div>
            <div class="boss-hp-bar">
                <div id="bossHpFill" class="boss-hp-fill"></div>
            </div>
        </div>
    </div>

    <!-- Start / Game Over Screen -->
    <div id="startScreen" class="overlay-screen">
        <h1 class="overlay-title">SPACE SHOOTER<br><span style="font-size: 20px; color: var(--accent-color);">ULTIMATE EXPANSION</span></h1>
        <button class="overlay-btn" onclick="startGame()">MISSION START</button>
        <div class="guide-text">
            [이동] W,A,S,D 또는 방향키 | [공격] 스페이스바 또는 J<br>
            * 잡몹은 아이템을 드롭하지 않습니다. 보스를 격파하여 무기 상자(🎁)를 획득하세요!<br>
            * STAGE 10 달 표면 기지에 도달하여 건물을 파괴하고 슈퍼 [S] 캡슐을 획득하세요!
        </div>
    </div>

    <div id="gameOverScreen" class="overlay-screen" style="display: none;">
        <h1 class="overlay-title" style="color: var(--accent-color);">MISSION FAILED</h1>
        <p style="font-size: 18px; margin-bottom: 10px;">FINAL SCORE: <span id="finalScoreTxt">0</span></p>
        <button class="overlay-btn" onclick="resetGame()">RETRY MISSION</button>
    </div>
</div>

<script>
    // [1. 웹사이트 테마(다크모드/베이지모드) 동기화 - 최상단 필수 연동]
    const savedTheme = localStorage.getItem('minig-theme');
    if (savedTheme && savedTheme !== 'white') {
        document.documentElement.setAttribute('data-theme', savedTheme);
    }

    // Canvas Setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const hpFill = document.getElementById('hpFill');
    const stageTxt = document.getElementById('stageTxt');
    const weaponTxt = document.getElementById('weaponTxt');
    const scoreTxt = document.getElementById('scoreTxt');
    const superStatus = document.getElementById('superStatus');
    const bossHpBox = document.getElementById('bossHpBox');
    const bossHpFill = document.getElementById('bossHpFill');
    const bossNameTxt = document.getElementById('bossNameTxt');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreTxt = document.getElementById('finalScoreTxt');

    // Web Audio API Synthesizer Sound Engine
    class SoundEngine {
        constructor() {
            this.ctx = null;
        }

        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        playShoot(type) {
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);

            const now = this.ctx.currentTime;
            if (type === 'super') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            }
        }

        playExplode() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.linearRampToValueAtTime(20, now + 0.3);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.3);
        }

        playPowerup() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.4);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        }
    }

    const sound = new SoundEngine();

    // Game Core State Variables
    let gameRunning = false;
    let score = 0;
    let stage = 1;
    let bossLevel = 1;
    let moonMode = false;
    let transitionAlpha = 0;
    let isTransitioning = false;
    let transitionDirection = 1; // 1: fading out, -1: fading in

    // Input Handler
    const keys = {};
    window.addEventListener('keydown', e => {
        keys[e.code] = true;
        sound.init();
    });
    window.addEventListener('keyup', e => {
        keys[e.code] = false;
    });

    // Weapon Names & Specs (7 Types)
    const WEAPONS = [
        { name: "VULCAN", color: "#00ffcc", delay: 8, dmg: 15 },
        { name: "TWIN LASER", color: "#3399ff", delay: 10, dmg: 18 },
        { name: "SPREAD SHOT", color: "#33ff33", delay: 14, dmg: 12 },
        { name: "HOMING MISSILE", color: "#ffcc00", delay: 16, dmg: 22 },
        { name: "PLASMA CANNON", color: "#aa00ff", delay: 20, dmg: 40 },
        { name: "WAVE BLADE", color: "#ff00aa", delay: 12, dmg: 25 },
        { name: "MEGA RAILGUN", color: "#ffffff", delay: 25, dmg: 80 }
    ];

    // Player Object
    const player = {
        x: 100,
        y: 300,
        w: 40,
        h: 28,
        speed: 6,
        hp: 100,
        maxHp: 100,
        weaponIndex: 0,
        shootCooldown: 0,
        superTimer: 0,
        invulnTimer: 0
    };

    // Game Arrays
    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let boss = null;
    let items = [];
    let buildings = [];
    let particles = [];
    let stars = [];
    let craters = [];

    // Background Initializations
    for (let i = 0; i < 80; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 1,
            speed: Math.random() * 3 + 1
        });
    }

    for (let i = 0; i < 15; i++) {
        craters.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 30 + 10,
            speed: 1.5
        });
    }

    // Reset / Game Setup Functions
    function startGame() {
        startScreen.style.display = 'none';
        gameOverScreen.style.display = 'none';
        sound.init();
        initGameVariables();
        gameRunning = true;
        requestAnimationFrame(gameLoop);
    }

    function resetGame() {
        startGame();
    }

    function initGameVariables() {
        score = 0;
        stage = 1;
        bossLevel = 1;
        moonMode = false;
        transitionAlpha = 0;
        isTransitioning = false;
        
        player.x = 100;
        player.y = 300;
        player.hp = 100;
        player.weaponIndex = 0;
        player.superTimer = 0;
        player.invulnTimer = 0;

        bullets = [];
        enemyBullets = [];
        enemies = [];
        boss = null;
        items = [];
        buildings = [];
        particles = [];

        updateHUD();
    }

    function updateHUD() {
        scoreTxt.innerText = String(score).padStart(6, '0');
        stageTxt.innerText = stage;
        weaponTxt.innerText = WEAPONS[player.weaponIndex].name;
        weaponTxt.style.color = WEAPONS[player.weaponIndex].color;
        hpFill.style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
        
        if (player.superTimer > 0) {
            superStatus.style.display = 'inline-block';
        } else {
            superStatus.style.display = 'none';
        }

        if (boss) {
            bossHpBox.style.display = 'block';
            bossNameTxt.innerText = `BOSS LEVEL ${bossLevel} - HP: ${Math.ceil(boss.hp)} / ${boss.maxHp}`;
            bossHpFill.style.width = Math.max(0, (boss.hp / boss.maxHp) * 100) + '%';
        } else {
            bossHpBox.style.display = 'none';
        }
    }

    // Player Shooting Logic
    function shootWeapon() {
        if (player.shootCooldown > 0) return;

        const w = WEAPONS[player.weaponIndex];
        player.shootCooldown = player.superTimer > 0 ? Math.floor(w.delay / 2) : w.delay;
        
        const dmgMultiplier = player.superTimer > 0 ? 2.0 : 1.0;
        const baseDmg = w.dmg * dmgMultiplier;

        sound.playShoot(player.superTimer > 0 ? 'super' : 'normal');

        switch (player.weaponIndex) {
            case 0: // Vulcan
                bullets.push({ x: player.x + 30, y: player.y + 12, vx: 12, vy: 0, w: 12, h: 4, dmg: baseDmg, color: w.color });
                break;
            case 1: // Twin Laser
                bullets.push({ x: player.x + 30, y: player.y + 4, vx: 14, vy: 0, w: 16, h: 3, dmg: baseDmg, color: w.color });
                bullets.push({ x: player.x + 30, y: player.y + 20, vx: 14, vy: 0, w: 16, h: 3, dmg: baseDmg, color: w.color });
                break;
            case 2: // Spread Shot
                for (let angle of [-0.2, 0, 0.2]) {
                    bullets.push({
                        x: player.x + 30, y: player.y + 12,
                        vx: Math.cos(angle) * 11, vy: Math.sin(angle) * 11,
                        w: 8, h: 8, dmg: baseDmg, color: w.color
                    });
                }
                break;
            case 3: // Homing Missile
                bullets.push({ x: player.x + 20, y: player.y + 12, vx: 6, vy: 0, w: 12, h: 6, dmg: baseDmg, color: w.color, homing: true });
                break;
            case 4: // Plasma Cannon
                bullets.push({ x: player.x + 30, y: player.y + 6, vx: 8, vy: 0, w: 20, h: 16, dmg: baseDmg, color: w.color, pierce: true });
                break;
            case 5: // Wave Blade
                bullets.push({ x: player.x + 30, y: player.y + 12, vx: 10, vy: 0, w: 14, h: 14, dmg: baseDmg, color: w.color, wave: true, baseY: player.y + 12, time: 0 });
                break;
            case 6: // Mega Railgun
                bullets.push({ x: player.x + 35, y: player.y + 8, vx: 22, vy: 0, w: 40, h: 10, dmg: baseDmg, color: w.color, pierce: true });
                break;
        }
    }

    // Spawning Enemies (5 Sub-mob patterns)
    let enemySpawnTimer = 0;
    function handleEnemySpawning() {
        if (boss || isTransitioning) return;

        enemySpawnTimer++;
        if (enemySpawnTimer > Math.max(25, 60 - stage * 3)) {
            enemySpawnTimer = 0;
            const type = Math.floor(Math.random() * 5);
            let e = { x: canvas.width + 30, y: Math.random() * (canvas.height - 100) + 40, w: 30, h: 30, type: type, hp: 20 + stage * 5, maxHp: 20 + stage * 5, vx: -3, vy: 0, time: 0 };

            switch (type) {
                case 0: // Straight Rush
                    e.vx = -(4 + Math.random() * 2);
                    break;
                case 1: // Zigzag
                    e.vx = -3;
                    e.vy = 3;
                    break;
                case 2: // Sine Wave
                    e.vx = -3;
                    e.baseY = e.y;
                    break;
                case 3: // Shooter / Sniper
                    e.vx = -2;
                    e.shootTimer = 0;
                    break;
                case 4: // Heavy Tank
                    e.w = 45;
                    e.h = 45;
                    e.hp = 60 + stage * 15;
                    e.vx = -1.5;
                    break;
            }
            enemies.push(e);
        }

        // Spawn Boss when score reaches stage threshold
        if (score >= stage * 2500 && !boss) {
            spawnBoss();
        }

        // Moon Mode Buildings Spawning
        if (moonMode && Math.random() < 0.015) {
            buildings.push({
                x: canvas.width + 50,
                y: canvas.height - 90,
                w: 60,
                h: 70,
                hp: 120,
                maxHp: 120
            });
        }
    }

    // [3. 보스 성장 시스템 및 10레벨 달 표면 기지 진입]
    function spawnBoss() {
        enemies = []; // Clear sub-mobs
        // Exponential scaling for HP and attack speed
        const hpScale = Math.pow(1.35, bossLevel - 1);
        const maxHp = Math.floor(400 * hpScale);
        
        boss = {
            x: canvas.width + 100,
            targetX: canvas.height > 600 ? 650 : 600,
            y: 200,
            w: 110,
            h: 120,
            hp: maxHp,
            maxHp: maxHp,
            vy: 2,
            attackTimer: 0,
            // Fire rate scales faster with level
            attackInterval: Math.max(20, 60 - bossLevel * 3)
        };
    }

    function triggerMoonBaseTransition() {
        isTransitioning = true;
        transitionDirection = 1; // Fade to black
    }

    // Main Update Loop
    function update() {
        if (!gameRunning) return;

        // [3. 달 표면 기지 시네마틱 암전 처리]
        if (isTransitioning) {
            transitionAlpha += 0.02 * transitionDirection;
            if (transitionAlpha >= 1 && transitionDirection === 1) {
                // Completely Black: Switch to Moon Mode
                moonMode = true;
                stage = 10;
                boss = null;
                enemies = [];
                enemyBullets = [];
                bullets = [];
                transitionDirection = -1; // Fade back in
            } else if (transitionAlpha <= 0 && transitionDirection === -1) {
                transitionAlpha = 0;
                isTransitioning = false;
            }
        }

        // Timers
        if (player.superTimer > 0) player.superTimer--;
        if (player.invulnTimer > 0) player.invulnTimer--;
        if (player.shootCooldown > 0) player.shootCooldown--;

        // Player Controls
        if (keys['KeyW'] || keys['ArrowUp']) player.y = Math.max(10, player.y - player.speed);
        if (keys['KeyS'] || keys['ArrowDown']) player.y = Math.min(canvas.height - player.h - 10, player.y + player.speed);
        if (keys['KeyA'] || keys['ArrowLeft']) player.x = Math.max(10, player.x - player.speed);
        if (keys['KeyD'] || keys['ArrowRight']) player.x = Math.min(canvas.width - player.w - 10, player.x + player.speed);
        if (keys['Space'] || keys['KeyJ']) shootWeapon();

        // Stars & Craters Background Move
        stars.forEach(s => {
            s.x -= s.speed;
            if (s.x < 0) s.x = canvas.width;
        });

        if (moonMode) {
            craters.forEach(c => {
                c.x -= c.speed;
                if (c.x < -c.radius * 2) c.x = canvas.width + c.radius;
            });
        }

        // Update Bullets
        bullets.forEach((b, index) => {
            if (b.homing && (boss || enemies.length > 0)) {
                let target = boss || enemies[0];
                let dy = (target.y + target.h / 2) - b.y;
                b.vy += dy * 0.03;
            }
            if (b.wave) {
                b.time += 0.2;
                b.y = b.baseY + Math.sin(b.time) * 20;
            }

            b.x += b.vx;
            b.y += b.vy;

            // Remove out of bounds bullets
            if (b.x > canvas.width + 50 || b.y < -20 || b.y > canvas.height + 20) {
                bullets.splice(index, 1);
            }
        });

        // Update Enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            e.time += 0.05;

            if (e.type === 1) { // Zigzag
                if (e.y < 20 || e.y > canvas.height - 60) e.vy *= -1;
            } else if (e.type === 2) { // Sine wave
                e.y = e.baseY + Math.sin(e.time * 2) * 40;
            } else if (e.type === 3) { // Shooter
                e.shootTimer++;
                if (e.shootTimer % 80 === 0) {
                    enemyBullets.push({ x: e.x, y: e.y + e.h / 2, vx: -6, vy: 0, r: 4 });
                }
            }

            e.x += e.vx;
            e.y += e.vy;

            // Collision with Player
            if (checkCollision(player, e)) {
                damagePlayer(20);
                createExplosion(e.x, e.y, "#ff5500", 15);
                enemies.splice(i, 1);
                continue;
            }

            // Remove out of screen
            if (e.x < -50) enemies.splice(i, 1);
        }

        // Update Boss
        if (boss) {
            if (boss.x > boss.targetX) boss.x -= 2;

            boss.y += boss.vy;
            if (boss.y < 50 || boss.y > canvas.height - 180) boss.vy *= -1;

            boss.attackTimer++;
            if (boss.attackTimer >= boss.attackInterval) {
                boss.attackTimer = 0;
                // Multi-directional pattern
                for (let a = -0.4; a <= 0.4; a += 0.2) {
                    enemyBullets.push({
                        x: boss.x,
                        y: boss.y + boss.h / 2,
                        vx: -7 * Math.cos(a),
                        vy: 7 * Math.sin(a),
                        r: 5
                    });
                }
            }
        }

        // Update Enemy Bullets
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
            let eb = enemyBullets[i];
            eb.x += eb.vx;
            eb.y += eb.vy;

            if (checkCircleCollision(eb, player)) {
                damagePlayer(12);
                enemyBullets.splice(i, 1);
                continue;
            }

            if (eb.x < -20 || eb.x > canvas.width + 20 || eb.y < -20 || eb.y > canvas.height + 20) {
                enemyBullets.splice(i, 1);
            }
        }

        // Update Buildings (Moon Mode)
        for (let i = buildings.length - 1; i >= 0; i--) {
            let bld = buildings[i];
            bld.x -= 1.5;

            if (checkCollision(player, bld)) {
                damagePlayer(25);
            }

            if (bld.x < -100) buildings.splice(i, 1);
        }

        // Bullet Collisions with Enemies, Boss & Buildings
        for (let bi = bullets.length - 1; bi >= 0; bi--) {
            let b = bullets[bi];
            let bulletUsed = false;

            // Vs Sub-mobs
            for (let ei = enemies.length - 1; ei >= 0; ei--) {
                let e = enemies[ei];
                if (checkCollision(b, e)) {
                    e.hp -= b.dmg;
                    createExplosion(b.x, b.y, b.color, 5);

                    if (e.hp <= 0) {
                        createExplosion(e.x, e.y, "#ffaa00", 20);
                        sound.playExplode();
                        score += (e.type + 1) * 100;
                        // [2. 아이템 드롭 시점 정정] - 잡몹은 더 이상 아이템을 드롭하지 않음!
                        enemies.splice(ei, 1);
                    }

                    if (!b.pierce) { bullets.splice(bi, 1); bulletUsed = true; break; }
                }
            }
            if (bulletUsed) continue;

            // Vs Boss
            if (boss && checkCollision(b, boss)) {
                boss.hp -= b.dmg;
                createExplosion(b.x, b.y, b.color, 6);

                if (boss.hp <= 0) {
                    createExplosion(boss.x + boss.w / 2, boss.y + boss.h / 2, "#ff0055", 50);
                    sound.playExplode();
                    score += 5000 * bossLevel;

                    // [2. 보스 처치 시 무기 상자(🎁) 확정 드롭]
                    items.push({
                        x: boss.x + boss.w / 2,
                        y: boss.y + boss.h / 2,
                        type: 'weapon',
                        vy: 1
                    });

                    // [3. 10레벨 보스 격파 시 달 표면 기지 시네마틱 전환]
                    if (bossLevel === 10 && !moonMode) {
                        triggerMoonBaseTransition();
                    } else {
                        stage++;
                        bossLevel++;
                        boss = null;
                    }
                }

                if (!b.pierce) { bullets.splice(bi, 1); continue; }
            }

            // Vs Moon Base Buildings
            if (moonMode) {
                for (let bui = buildings.length - 1; bui >= 0; bui--) {
                    let bld = buildings[bui];
                    if (checkCollision(b, bld)) {
                        bld.hp -= b.dmg;
                        createExplosion(b.x, b.y, "#ffffff", 6);

                        if (bld.hp <= 0) {
                            createExplosion(bld.x + bld.w / 2, bld.y + bld.h / 2, "#ffd700", 30);
                            sound.playExplode();
                            score += 800;

                            // [3. 건물을 파괴하면 황금빛 슈퍼 [S] 캡슐 드롭]
                            items.push({
                                x: bld.x + bld.w / 2,
                                y: bld.y + bld.h / 2,
                                type: 'super',
                                vy: 1
                            });

                            buildings.splice(bui, 1);
                        }

                        if (!b.pierce) { bullets.splice(bi, 1); break; }
                    }
                }
            }
        }

        // Update Items & Pickups
        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            item.y += item.vy;

            if (checkCollision(player, { x: item.x - 12, y: item.y - 12, w: 24, h: 24 })) {
                sound.playPowerup();

                if (item.type === 'weapon') {
                    // Next weapon unlock / cycle
                    player.weaponIndex = (player.weaponIndex + 1) % WEAPONS.length;
                    score += 500;
                } else if (item.type === 'super') {
                    // [3. 슈퍼 [S] 캡슐 획득: 불꽃 모드 + 2배 공격력 + 무적]
                    player.superTimer = 360; // 6 seconds of Max Burst
                    player.hp = Math.min(player.maxHp, player.hp + 30);
                    score += 1500;
                }

                items.splice(i, 1);
                continue;
            }

            if (item.y > canvas.height + 30) items.splice(i, 1);
        }

        // Update Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.03;
            if (p.alpha <= 0) particles.splice(i, 1);
        }

        handleEnemySpawning();
        updateHUD();
    }

    function damagePlayer(amount) {
        // [3. 슈퍼 캡슐 무적(invuln) 상태 체크]
        if (player.superTimer > 0 || player.invulnTimer > 0) return;

        player.hp -= amount;
        player.invulnTimer = 30; // Brief immunity frames
        createExplosion(player.x, player.y, "#ff0000", 15);

        if (player.hp <= 0) {
            player.hp = 0;
            gameRunning = false;
            finalScoreTxt.innerText = score;
            gameOverScreen.style.display = 'flex';
        }
    }

    function createExplosion(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            let angle = Math.random() * Math.PI * 2;
            let speed = Math.random() * 4 + 1;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                color: color,
                alpha: 1.0
            });
        }
    }

    // Collision Detection Helpers
    function checkCollision(a, b) {
        return a.x < b.x + b.w &&
               a.x + a.w > b.x &&
               a.y < b.y + b.h &&
               a.y + a.h > b.y;
    }

    function checkCircleCollision(circle, rect) {
        let distX = Math.abs(circle.x - rect.x - rect.w / 2);
        let distY = Math.abs(circle.y - rect.y - rect.h / 2);

        if (distX > (rect.w / 2 + circle.r)) return false;
        if (distY > (rect.h / 2 + circle.r)) return false;

        if (distX <= (rect.w / 2)) return true;
        if (distY <= (rect.h / 2)) return true;

        let dx = distX - rect.w / 2;
        let dy = distY - rect.h / 2;
        return (dx * dx + dy * dy <= (circle.r * circle.r));
    }

    // Render Loop
    function draw() {
        // Clear screen based on space / moon mode background
        if (moonMode) {
            ctx.fillStyle = '#111116';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Craters on Moon Surface
            ctx.fillStyle = '#22222a';
            craters.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Ground Surface Line
            ctx.fillStyle = '#333340';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
        } else {
            ctx.fillStyle = '#05050a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(s => {
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });
        }

        // Draw Moon Base Buildings
        if (moonMode) {
            buildings.forEach(bld => {
                ctx.fillStyle = '#444455';
                ctx.fillRect(bld.x, bld.y, bld.w, bld.h);
                ctx.strokeStyle = '#00ffcc';
                ctx.strokeRect(bld.x, bld.y, bld.w, bld.h);

                // Health Bar for Buildings
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(bld.x, bld.y - 8, bld.w, 4);
                ctx.fillStyle = '#00ffcc';
                ctx.fillRect(bld.x, bld.y - 8, bld.w * (bld.hp / bld.maxHp), 4);
            });
        }

        // Draw Player (with 🔥 Flame effect during Super Burst)
        if (player.invulnTimer % 4 < 2) {
            if (player.superTimer > 0) {
                // Fire Flame Aura Rendering
                ctx.fillStyle = '#ff3300';
                ctx.beginPath();
                ctx.arc(player.x + player.w / 2, player.y + player.h / 2, 28, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.arc(player.x + player.w / 2, player.y + player.h / 2, 18, 0, Math.PI * 2);
                ctx.fill();
            }

            // Ship Body
            ctx.fillStyle = player.superTimer > 0 ? '#ffffff' : '#00ffcc';
            ctx.beginPath();
            ctx.moveTo(player.x + player.w, player.y + player.h / 2);
            ctx.lineTo(player.x, player.y);
            ctx.lineTo(player.x + 8, player.y + player.h / 2);
            ctx.lineTo(player.x, player.y + player.h);
            ctx.closePath();
            ctx.fill();
        }

        // Draw Bullets
        bullets.forEach(b => {
            ctx.fillStyle = b.color;
            ctx.shadowColor = b.color;
            ctx.shadowBlur = 8;
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.shadowBlur = 0;
        });

        // Draw Sub-mobs
        enemies.forEach(e => {
            ctx.fillStyle = e.type === 4 ? '#ff0055' : '#ff9900';
            ctx.fillRect(e.x, e.y, e.w, e.h);
        });

        // Draw Boss
        if (boss) {
            ctx.fillStyle = '#ff0055';
            ctx.shadowColor = '#ff0055';
            ctx.shadowBlur = 15;
            ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
            ctx.shadowBlur = 0;

            // Boss Core Detail
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(boss.x + 20, boss.y + 35, 30, 50);
        }

        // Draw Enemy Bullets
        ctx.fillStyle = '#ff3366';
        enemyBullets.forEach(eb => {
            ctx.beginPath();
            ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI * 2);
            ctx.fill();
        });

        // Draw Dropped Items
        items.forEach(item => {
            ctx.font = '20px sans-serif';
            if (item.type === 'weapon') {
                ctx.fillText('🎁', item.x - 10, item.y + 10);
            } else if (item.type === 'super') {
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(item.x, item.y, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 12px monospace';
                ctx.fillText('S', item.x - 4, item.y + 4);
            }
        });

        // Draw Explosive Particles
        particles.forEach(p => {
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, 3, 3);
            ctx.globalAlpha = 1.0;
        });

        // [3. 시네마틱 전환 암전 오버레이]
        if (transitionAlpha > 0) {
            ctx.fillStyle = `rgba(0, 0, 0, ${transitionAlpha})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (transitionAlpha > 0.5) {
                ctx.fillStyle = '#00ffcc';
                ctx.font = '24px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('🌕 ENTERING LUNAR SURFACE BASE...', canvas.width / 2, canvas.height / 2);
                ctx.textAlign = 'left';
            }
        }
    }

    // Main Engine Loop
    function gameLoop() {
        if (!gameRunning) return;
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }
</script>
