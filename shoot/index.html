<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정통 수직 종스크롤 아케이드 슈팅</title>
  <style>
    :root {
      --bg: #f8f9fa;
      --text: #333;
      --canvas-bg: #05070a;
      --border: #e9ecef;
      --btn-bg: #fff;
    }
    /* 다크모드 강제 동기화 속성 */
    [data-theme="dark"] {
      --bg: #0d1117;
      --text: #c9d1d9;
      --canvas-bg: #020305;
      --border: #30363d;
      --btn-bg: #21262d;
    }
    /* 베이지모드 강제 동기화 속성 */
    [data-theme="beige"] {
      --bg: #f5ebe0;
      --text: #4e3d30;
      --canvas-bg: #14100c;
      --border: #ddcbbb;
      --btn-bg: #eddfd0;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background-color: var(--bg) !important;
      color: var(--text) !important;
      transition: background-color 0.3s, color 0.3s;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    button, .modal-content {
      background-color: var(--btn-bg) !important;
      color: var(--text) !important;
      border: 1px solid var(--border) !important;
    }

    #game-container {
      position: relative;
      border: 3px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background-color: var(--canvas-bg);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    canvas {
      display: block;
      background-color: var(--canvas-bg);
    }

    /* HUD (계기판 #board) */
    .hud {
      position: absolute;
      top: 8px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      font-size: 11px;
      font-weight: bold;
      z-index: 10;
      background-color: var(--btn-bg) !important;
      color: var(--text) !important;
      border: 1px solid var(--border) !important;
      padding: 6px 10px;
      border-radius: 4px;
      opacity: 0.95;
    }
    .hud-item {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .hud-btn {
      pointer-events: auto;
      cursor: pointer;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: bold;
      border-radius: 3px;
    }

    /* Boss HP Bar */
    .boss-bar-container {
      position: absolute;
      top: 42px;
      left: 15%;
      width: 70%;
      height: 8px;
      background: #220011;
      border: 1px solid #ff0055;
      display: none;
      z-index: 10;
      border-radius: 4px;
      overflow: hidden;
    }
    .boss-bar {
      width: 100%;
      height: 100%;
      background: #ff0055;
    }

    /* Overlay Screens */
    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg) !important;
      color: var(--text) !important;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      padding: 20px;
      text-align: center;
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 18px;
      letter-spacing: 1px;
    }
    p {
      margin: 4px 0;
      font-size: 12px;
      line-height: 1.4;
    }
    button {
      margin-top: 10px;
      padding: 8px 18px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
      transition: transform 0.1s ease;
    }
    button:active {
      transform: scale(0.96);
    }

    /* Intro Dialog */
    #intro-box {
      width: 90%;
      height: 120px;
      border: 1px solid var(--border);
      background-color: var(--btn-bg);
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      text-align: left;
      white-space: pre-wrap;
      overflow: hidden;
      margin-bottom: 12px;
      border-radius: 4px;
    }

    /* Modals */
    .modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 30;
      padding: 15px;
    }
    .modal-content {
      width: 90%;
      border-radius: 6px;
      padding: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .shop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 11px;
    }
    .shop-item button {
      margin-top: 0;
      padding: 4px 8px;
      font-size: 10px;
    }

    /* Fade Transition Screen */
    #fade-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      opacity: 0;
      pointer-events: none;
      z-index: 40;
      transition: opacity 1.5s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- UI HUD (계기판 #board: ❤️ 삭제 후 🛡️ 실드 변경 반영) -->
    <div class="hud" id="board">
      <div class="hud-item">🏆 <span id="score-val">0</span></div>
      <div class="hud-item">🛡️ <span id="hp-val">100</span></div>
      <div class="hud-item">LV:<span id="level-val">1</span></div>
      <div class="hud-item">💰<span id="points-val">0</span>P</div>
      <div class="hud-item">🔫<span id="weapon-val">일반</span></div>
      <button class="hud-btn" onclick="openShop()">🛒연구소</button>
    </div>

    <!-- 보스 체력바 -->
    <div id="boss-bar-container" class="boss-bar-container">
      <div id="boss-bar" class="boss-bar"></div>
    </div>

    <!-- 1단계: 스토리 인트로 화면 -->
    <div id="start-screen" class="overlay-screen">
      <h1>📡 우주 상황실 긴급 전언</h1>
      <div id="intro-box"></div>
      <button id="start-btn" style="display:none;" onclick="startGame()">🚀 출격 (Spacebar)</button>
    </div>

    <!-- 게임 오버 / 클리어 화면 -->
    <div id="game-over-screen" class="overlay-screen" style="display: none;">
      <h1 id="game-over-title">💥 GAME OVER</h1>
      <p id="game-over-desc">함선이 파괴되었습니다.</p>
      <button onclick="startGame()">🔄 다시 출격</button>
    </div>

    <!-- 3단계: 무기 체인지 가챠 모달 -->
    <div id="gachaModal" class="modal">
      <div class="modal-content">
        <h3>🎁 보스 보급품 획득!</h3>
        <p>전술 무기 가챠 룰렛 가동 중...</p>
        <div id="gacha-roulette" style="font-size: 36px; margin: 10px 0;">🎰</div>
        <div id="gacha-result" style="font-size: 14px; font-weight: bold; min-height: 20px;"></div>
        <button id="gacha-claim-btn" style="display:none;" onclick="claimWeapon()">⚔️ 장착하기</button>
      </div>
    </div>

    <!-- 4단계: 연구소 상점 모달 -->
    <div id="shopModal" class="modal">
      <div class="modal-content">
        <h3>🛒 전술 강화 연구소</h3>
        <div>보유 포인트: 💰 <span id="shop-points">0</span> P</div>
        
        <div class="shop-item">
          <div style="text-align:left;">
            <b>⚔️ 공격력 강화</b> (LV <span id="atk-lv">1</span>)
          </div>
          <button onclick="buyUpgrade('atk')"><span id="atk-cost">100</span>P</button>
        </div>

        <div class="shop-item">
          <div style="text-align:left;">
            <b>🍀 확률/포인트 제어</b> (LV <span id="luck-lv">1</span>)
          </div>
          <button onclick="buyUpgrade('luck')"><span id="luck-cost">150</span>P</button>
        </div>

        <div class="shop-item">
          <div style="text-align:left;">
            <b>🛡️ 실드 용량 확장</b> (LV <span id="shield-lv">1</span>)
          </div>
          <button onclick="buyUpgrade('shield')"><span id="shield-cost">200</span>P</button>
        </div>

        <button onclick="closeShop()">🚀 전투 복귀</button>
      </div>
    </div>

    <!-- 5단계/6단계 전환 암전 레이어 -->
    <div id="fade-screen">🌕 달 기지 작전 구역 진입...</div>

    <!-- 캔버스 (360x500 종스크롤) -->
    <canvas id="gameCanvas" width="360" height="500"></canvas>
  </div>

  <script>
    // 1. 웹사이트 테마 동기화 (최상단 기재)
    const savedTheme = localStorage.getItem('minig-theme');
    if (savedTheme && savedTheme !== 'white') { document.documentElement.setAttribute('data-theme', savedTheme); }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const CANVAS_WIDTH = 360;
    const CANVAS_HEIGHT = 500;

    // Web Audio API 사운드 시스템
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      if (type === 'talk') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440 + Math.random() * 200, now);
        gain.gain.setValueAtTime(0.03, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(now + 0.04);
      } else if (type === 'shoot') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.06);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.06);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(now + 0.06);
      } else if (type === 'explosion') {
        const bufferSize = audioCtx.sampleRate * 0.15;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.15);
        noise.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
      } else if (type === 'powerup') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(now + 0.2);
      }
    }

    // 1단계: 스토리 타이핑 연출
    const introText = "[경보] 외계 군단이 지구 방어선을 돌파했습니다.\n최후의 추동 전함 🚀 출격 준비 완료.\n적 보스를 격파하여 무기를 탈취하고 달 기지(Moon Base)로 진격하십시오!";
    let introIdx = 0;

    function typeIntro() {
      if (introIdx < introText.length) {
        document.getElementById('intro-box').textContent += introText.charAt(introIdx);
        playSound('talk');
        introIdx++;
        setTimeout(typeIntro, 40);
      } else {
        document.getElementById('start-btn').style.display = 'inline-block';
      }
    }

    // 게임 상태 및 보스 스폰 제어 변수
    let gameState = 'INTRO';
    let previousState = 'INTRO';
    let score = 0;
    let shopPoints = 0;
    let level = 1;
    let enemiesKilled = 0; // 잡몹 처치 카운터
    let bossSpawned = false; // 보스 출격 플래그
    let moonMode = false;
    const keys = {};

    // 4단계: 연구소 상점 강화 단가 (Math.floor(cost * 1.6) 공식 적용)
    const shopUpgrades = {
      atkLv: 1,
      atkCost: 100,
      luckLv: 1,
      luckCost: 150,
      shieldLv: 1,
      shieldCost: 200
    };

    // 3단계: 무기 가챠 데이터 정의
    const WEAPONS = [
      { name: '3갈래 확산탄', emoji: '🔱', type: 'SPREAD' },
      { name: '유도 미사일', emoji: '🚀', type: 'HOMING' },
      { name: '관통 레이저', emoji: '⚡', type: 'LASER' },
      { name: '기뢰 격발', emoji: '💣', type: 'MINE' },
      { name: '유도 드론', emoji: '🛡️', type: 'DRONE' },
      { name: '블랙홀 생성', emoji: '🌀', type: 'BLACKHOLE' },
      { name: '핵융합 폭탄', emoji: '💥', type: 'NUKE' }
    ];
    let currentWeapon = { name: '기본 레이저', emoji: '🔫', type: 'NORMAL' };
    let pendingGachaWeapon = null;

    // 아군 함선 객체
    const player = {
      x: 180,
      y: 420,
      width: 28,
      height: 28,
      speed: 4.2,
      hp: 100,
      maxHp: 100,
      shieldTime: 0,
      superMode: false,
      lastShot: 0,
      shootDelay: 130
    };

    function resetPlayer() {
      player.x = 180;
      player.y = 420;
      player.hp = 100;
      player.shieldTime = 0;
      player.superMode = false;
      player.lastShot = 0;
      currentWeapon = { name: '기본 레이저', emoji: '🔫', type: 'NORMAL' };
    }

    // 배경 스크롤 객체
    const stars = Array.from({ length: 45 }, () => ({
      x: Math.random() * CANVAS_WIDTH,
      y: Math.random() * CANVAS_HEIGHT,
      size: Math.random() * 2 + 1,
      speed: Math.random() * 1.5 + 1.0
    }));

    const craters = [];
    function initCraters() {
      craters.length = 0;
      for (let i = 0; i < 6; i++) {
        craters.push({
          x: Math.random() * CANVAS_WIDTH,
          y: Math.random() * CANVAS_HEIGHT,
          radius: Math.random() * 16 + 8,
          speed: 1.2
        });
      }
    }

    // 엔티티 관리 배열
    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let items = [];
    let particles = [];
    let boss = null;
    let hangar = null;
    let enemySpawnTimer = 0;

    const ENEMY_EMOJIS = ['🛸', '👾', '👽', '🤖', '🛸'];

    function spawnEnemy() {
      if (boss || bossSpawned) return;
      const type = Math.floor(Math.random() * 5);
      const enemyX = Math.random() * (CANVAS_WIDTH - 40) + 20;

      enemies.push({
        x: enemyX,
        baseX: enemyX,
        y: -40,
        width: 28,
        height: 28,
        type: type,
        emoji: ENEMY_EMOJIS[type],
        hp: type === 2 ? 4 : 1,
        speed: Math.random() * 1.2 + 1.5,
        vx: (Math.random() - 0.5) * 1.8,
        time: 0,
        shootTimer: 0
      });
    }

    // 보스 스폰 (지침 2: 보스 체력 난이도 하향 15 * bossLevel 반영)
    function spawnBoss() {
      bossSpawned = true;
      const bossLevel = level;
      const hpVal = 15 * bossLevel; // 수식: boss.hp = 15 * bossLevel;
      boss = {
        x: CANVAS_WIDTH / 2,
        y: -80,
        targetY: 65,
        width: 64,
        height: 64,
        emoji: level >= 10 ? '🪐' : '🛸',
        hp: hpVal,
        maxHp: hpVal,
        vx: 1.8,
        shootTimer: 0
      };
    }

    function spawnHangar() {
      hangar = {
        x: CANVAS_WIDTH / 2,
        y: -60,
        targetY: 80,
        width: 46,
        height: 46,
        emoji: '🏬',
        hp: 70,
        maxHp: 70
      };
    }

    // 메인 로직 업데이트
    function update() {
      if (gameState !== 'PLAYING') return;

      if (player.shieldTime > 0) player.shieldTime--;

      // 성단 하강
      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > CANVAS_HEIGHT) {
          s.y = 0;
          s.x = Math.random() * CANVAS_WIDTH;
        }
      });

      // 6단계: 달 기지 백그라운드 크레이터 수직 스크롤
      if (moonMode) {
        craters.forEach(c => {
          c.y += c.speed;
          if (c.y > CANVAS_HEIGHT + c.radius) {
            c.y = -c.radius;
            c.x = Math.random() * CANVAS_WIDTH;
          }
        });
      }

      // 조작
      if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
      if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
      if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
      if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;

      player.x = Math.max(player.width / 2, Math.min(CANVAS_WIDTH - player.width / 2, player.x));
      player.y = Math.max(player.height / 2, Math.min(CANVAS_HEIGHT - player.height / 2, player.y));

      // 사격 메커니즘
      const now = Date.now();
      const atkMult = (1 + (shopUpgrades.atkLv - 1) * 0.3) * (player.superMode ? 2.0 : 1.0);
      const delay = player.superMode ? player.shootDelay * 0.6 : player.shootDelay;

      if ((keys['Space'] || keys['KeyZ']) && now - player.lastShot > delay) {
        player.lastShot = now;
        playSound('shoot');

        if (currentWeapon.type === 'NORMAL') {
          bullets.push({ x: player.x, y: player.y - 14, vx: 0, vy: -10, radius: 2.5, power: 1 * atkMult });
        } else if (currentWeapon.type === 'SPREAD') { // 🔱 3갈래
          bullets.push({ x: player.x, y: player.y - 14, vx: 0, vy: -10, radius: 2.5, power: 1 * atkMult });
          bullets.push({ x: player.x - 6, y: player.y - 10, vx: -2.2, vy: -9, radius: 2.5, power: 1 * atkMult });
          bullets.push({ x: player.x + 6, y: player.y - 10, vx: 2.2, vy: -9, radius: 2.5, power: 1 * atkMult });
        } else if (currentWeapon.type === 'HOMING') { // 🚀 유도
          bullets.push({ x: player.x, y: player.y - 14, vx: 0, vy: -8, radius: 3, power: 1.4 * atkMult, homing: true });
        } else if (currentWeapon.type === 'LASER') { // ⚡ 관통
          bullets.push({ x: player.x, y: player.y - 14, vx: 0, vy: -14, radius: 3.5, power: 2.2 * atkMult, pierce: true });
        } else if (currentWeapon.type === 'MINE') { // 💣 기뢰
          bullets.push({ x: player.x, y: player.y + 10, vx: 0, vy: 1, radius: 5, power: 3.5 * atkMult, mine: true });
        } else if (currentWeapon.type === 'DRONE') { // 🛡️ 드론
          bullets.push({ x: player.x - 14, y: player.y - 5, vx: 0, vy: -10, radius: 2.5, power: 1 * atkMult });
          bullets.push({ x: player.x + 14, y: player.y - 5, vx: 0, vy: -10, radius: 2.5, power: 1 * atkMult });
        } else if (currentWeapon.type === 'BLACKHOLE') { // 🌀 블랙홀
          bullets.push({ x: player.x, y: player.y - 14, vx: 0, vy: -6, radius: 8, power: 0.5 * atkMult, blackhole: true });
        } else if (currentWeapon.type === 'NUKE') { // 💥 핵융합 폭탄
          bullets.push({ x: player.x, y: player.y - 14, vx: 0, vy: -7, radius: 6, power: 5.0 * atkMult, nuke: true });
        }
      }

      // 투사체 처리
      bullets.forEach((b, bIdx) => {
        if (b.homing && enemies.length > 0) {
          const target = enemies[0];
          const angle = Math.atan2(target.y - b.y, target.x - b.x);
          b.vx += Math.cos(angle) * 0.5;
          b.vy += Math.sin(angle) * 0.5;
        }
        b.x += b.vx;
        b.y += b.vy;

        if (b.y < -20 || b.y > CANVAS_HEIGHT + 20 || b.x < -20 || b.x > CANVAS_WIDTH + 20) {
          bullets.splice(bIdx, 1);
        }
      });

      // 적 탄막 처리
      enemyBullets.forEach((eb, index) => {
        eb.x += eb.vx;
        eb.y += eb.vy;

        const dist = Math.hypot(eb.x - player.x, eb.y - player.y);
        if (dist < eb.radius + player.width / 3.0) {
          if (player.shieldTime <= 0 && !player.superMode) {
            player.hp -= eb.damage || 10;
            createExplosion(player.x, player.y, 16);
            if (player.hp <= 0) {
              player.hp = 0;
              gameState = 'GAMEOVER';
              playSound('explosion');
            }
          }
          enemyBullets.splice(index, 1);
          return;
        }

        if (eb.y > CANVAS_HEIGHT + 10 || eb.x < -10 || eb.x > CANVAS_WIDTH + 10 || eb.y < -20) {
          enemyBullets.splice(index, 1);
        }
      });

      // 적 스폰
      enemySpawnTimer++;
      if (enemySpawnTimer > Math.max(20, 50 - level * 3) && !boss && !bossSpawned) {
        spawnEnemy();
        enemySpawnTimer = 0;
      }

      // 잡몹 15마리 처치 시 보스 출격
      if (enemiesKilled >= 15 && !bossSpawned && !boss && gameState === 'PLAYING') {
        spawnBoss();
      }

      // 적 기동 및 피격
      enemies.forEach((enemy, eIdx) => {
        enemy.time += 0.05;
        switch (enemy.type) {
          case 0: enemy.y += enemy.speed; break;
          case 1: 
            enemy.y += enemy.speed * 0.9;
            enemy.x = enemy.baseX + Math.sin(enemy.time * 2.2) * 38;
            break;
          case 2: enemy.y += enemy.speed * 0.65; break;
          case 3:
            const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
            enemy.x += Math.cos(angle) * enemy.speed * 0.85;
            enemy.y += Math.sin(angle) * enemy.speed * 0.85;
            break;
          case 4:
            enemy.x += enemy.vx;
            enemy.y += enemy.speed * 1.1;
            if (enemy.x < 15 || enemy.x > CANVAS_WIDTH - 15) enemy.vx *= -1;
            break;
        }

        // 적 총알 발사
        enemy.shootTimer++;
        if (enemy.shootTimer > 85 && enemy.y > 30 && enemy.y < CANVAS_HEIGHT - 120) {
          enemy.shootTimer = 0;
          if (Math.random() < 0.4) {
            const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
            enemyBullets.push({
              x: enemy.x,
              y: enemy.y + 10,
              vx: Math.cos(angle) * 2.8,
              vy: Math.sin(angle) * 2.8,
              radius: 3.5,
              damage: 10
            });
          }
        }

        // 잡몹 피격
        bullets.forEach((b, bIdx) => {
          if (Math.hypot(b.x - enemy.x, b.y - enemy.y) < enemy.width / 2 + b.radius) {
            enemy.hp -= b.power;
            if (!b.pierce) bullets.splice(bIdx, 1);
            createExplosion(b.x, b.y, 8);

            if (enemy.hp <= 0) {
              createExplosion(enemy.x, enemy.y, 20);
              playSound('explosion');
              score += 100;
              const luckMult = 1 + (shopUpgrades.luckLv - 1) * 0.2;
              shopPoints += Math.floor(15 * luckMult);
              enemiesKilled++; // 잡몹 처치 카운트 증가
              enemies.splice(eIdx, 1);
            }
          }
        });

        if (enemy.y > CANVAS_HEIGHT + 40) enemies.splice(eIdx, 1);
      });

      // 보스 처리
      if (boss) {
        if (boss.y < boss.targetY) boss.y += 1.2;
        else {
          boss.x += boss.vx;
          if (boss.x < boss.width / 2 + 15 || boss.x > CANVAS_WIDTH - boss.width / 2 - 15) boss.vx *= -1;

          boss.shootTimer++;
          if (boss.shootTimer > 38) {
            boss.shootTimer = 0;
            const count = 7;
            for (let i = 0; i < count; i++) {
              const spreadAngle = (Math.PI / (count - 1)) * i;
              enemyBullets.push({
                x: boss.x,
                y: boss.y + 20,
                vx: Math.cos(spreadAngle) * 3,
                vy: Math.sin(spreadAngle) * 3,
                radius: 3.5,
                damage: 12
              });
            }
          }
        }

        // 보스 피격 및 무한 리스폰 완치 지침 (지침 1 반영)
        bullets.forEach((b, bIdx) => {
          if (Math.hypot(b.x - boss.x, b.y - boss.y) < boss.width / 2) {
            boss.hp -= b.power;
            if (!b.pierce) bullets.splice(bIdx, 1);
            createExplosion(b.x, b.y, 10);

            if (boss.hp <= 0) {
              createExplosion(boss.x, boss.y, 45);
              playSound('explosion');
              score += 3000;
              shopPoints += Math.floor(250 * (1 + (shopUpgrades.luckLv - 1) * 0.2));

              // 보스 자리에 무기 상자 드롭
              items.push({ x: boss.x, y: boss.y, width: 22, height: 22, speed: 1.2, type: 'WEAPON_BOX', emoji: '🎁' });

              // [⚠️ 1. 보스 무한 리스폰 버그 완전 완치 필수 4대 수칙 적용]
              enemiesKilled = 0;   // 잡몹 처치 카운터 0 초기화
              bossSpawned = false; // 보스 출격 플래그 해제
              boss = null;         // 보스 메모리 즉시 삭제
              enemyBullets = [];   // 화면 내 모든 적 탄막 완전 소거

              level++; // 다음 스테이지 레벨 상승

              // 5단계: 10레벨 보스 격파 시 암전 연출 및 달 기지 진입
              if (level > 10 && !moonMode) {
                triggerMoonTransition();
              }
            }
          }
        });
      }

      // 6단계: 달 기지 격납고 파괴 시 무적 [S] 캡슐 ⚡ 드롭
      if (hangar) {
        if (hangar.y < hangar.targetY) hangar.y += 1.0;

        bullets.forEach((b, bIdx) => {
          if (Math.hypot(b.x - hangar.x, b.y - hangar.y) < hangar.width / 2) {
            hangar.hp -= b.power;
            if (!b.pierce) bullets.splice(bIdx, 1);
            createExplosion(b.x, b.y, 10);

            if (hangar.hp <= 0) {
              createExplosion(hangar.x, hangar.y, 35);
              playSound('explosion');
              items.push({ x: hangar.x, y: hangar.y, width: 22, height: 22, speed: 1.2, type: 'SUPER_CAPSULE', emoji: '⚡' });
              hangar = null;
            }
          }
        });
      }

      // 아이템 드롭 및 획득
      items.forEach((item, index) => {
        item.y += item.speed;

        if (Math.hypot(player.x - item.x, player.y - item.y) < player.width / 2 + item.width / 2) {
          playSound('powerup');
          if (item.type === 'WEAPON_BOX') {
            triggerGachaModal();
          } else if (item.type === 'SUPER_CAPSULE') {
            // 6단계: 불꽃(🔥) 변신 및 무적 폭증 모드
            player.superMode = true;
            player.shieldTime = 400 + (shopUpgrades.shieldLv - 1) * 100;
          }
          items.splice(index, 1);
        } else if (item.y > CANVAS_HEIGHT + 20) {
          items.splice(index, 1);
        }
      });

      // 폭발 효과
      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.size += 0.6;
        p.alpha -= 0.04;
        if (p.alpha <= 0) particles.splice(index, 1);
      });
    }

    // 5단계 & 6단계: 달 기지 페이드 전환 로직
    function triggerMoonTransition() {
      gameState = 'TRANSITION';
      const fadeScreen = document.getElementById('fade-screen');
      fadeScreen.style.opacity = '1';

      setTimeout(() => {
        moonMode = true;
        initCraters();
        spawnHangar();
        fadeScreen.style.opacity = '0';
        gameState = 'PLAYING';
        requestAnimationFrame(gameLoop);
      }, 1600);
    }

    // 3단계: 무기 가챠 룰렛 팝업
    function triggerGachaModal() {
      gameState = 'GACHA';
      const modal = document.getElementById('gachaModal');
      const roulette = document.getElementById('gacha-roulette');
      const result = document.getElementById('gacha-result');
      const claimBtn = document.getElementById('gacha-claim-btn');

      modal.style.display = 'flex';
      claimBtn.style.display = 'none';
      result.innerText = '선택 중...';

      let count = 0;
      const interval = setInterval(() => {
        const temp = WEAPONS[Math.floor(Math.random() * WEAPONS.length)];
        roulette.innerText = temp.emoji;
        playSound('talk');
        count++;

        if (count > 15) {
          clearInterval(interval);
          pendingGachaWeapon = WEAPONS[Math.floor(Math.random() * WEAPONS.length)];
          roulette.innerText = pendingGachaWeapon.emoji;
          result.innerText = `[획득] ${pendingGachaWeapon.name}!`;
          claimBtn.style.display = 'inline-block';
        }
      }, 90);
    }

    function claimWeapon() {
      if (pendingGachaWeapon) {
        currentWeapon = pendingGachaWeapon;
      }
      document.getElementById('gachaModal').style.display = 'none';
      gameState = 'PLAYING';
      requestAnimationFrame(gameLoop);
    }

    // 4단계: 연구소 상점 (단가 Math.floor(cost * 1.6) 적용)
    function openShop() {
      if (gameState === 'PLAYING') {
        previousState = 'PLAYING';
        gameState = 'PAUSED';
      }
      updateShopUI();
      document.getElementById('shopModal').style.display = 'flex';
    }

    function closeShop() {
      document.getElementById('shopModal').style.display = 'none';
      if (previousState === 'PLAYING') {
        gameState = 'PLAYING';
        requestAnimationFrame(gameLoop);
      }
    }

    function updateShopUI() {
      document.getElementById('shop-points').innerText = shopPoints;
      document.getElementById('atk-lv').innerText = shopUpgrades.atkLv;
      document.getElementById('atk-cost').innerText = shopUpgrades.atkCost;
      document.getElementById('luck-lv').innerText = shopUpgrades.luckLv;
      document.getElementById('luck-cost').innerText = shopUpgrades.luckCost;
      document.getElementById('shield-lv').innerText = shopUpgrades.shieldLv;
      document.getElementById('shield-cost').innerText = shopUpgrades.shieldCost;
    }

    function buyUpgrade(type) {
      if (type === 'atk' && shopPoints >= shopUpgrades.atkCost) {
        shopPoints -= shopUpgrades.atkCost;
        shopUpgrades.atkLv++;
        shopUpgrades.atkCost = Math.floor(shopUpgrades.atkCost * 1.6);
        playSound('powerup');
      } else if (type === 'luck' && shopPoints >= shopUpgrades.luckCost) {
        shopPoints -= shopUpgrades.luckCost;
        shopUpgrades.luckLv++;
        shopUpgrades.luckCost = Math.floor(shopUpgrades.luckCost * 1.6);
        playSound('powerup');
      } else if (type === 'shield' && shopPoints >= shopUpgrades.shieldCost) {
        shopPoints -= shopUpgrades.shieldCost;
        shopUpgrades.shieldLv++;
        shopUpgrades.shieldCost = Math.floor(shopUpgrades.shieldCost * 1.6);
        playSound('powerup');
      }
      updateShopUI();
    }

    // 캔버스 렌더링
    function render() {
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // 성단 배경
      stars.forEach(s => {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });

      // 6단계: 달 크레이터 배경
      if (moonMode) {
        ctx.fillStyle = 'rgba(180, 180, 200, 0.15)';
        craters.forEach(c => {
          ctx.beginPath();
          ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      // 격납고 🏬
      if (hangar) {
        ctx.font = '34px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(hangar.emoji, hangar.x, hangar.y);
      }

      // 아군 비행선 (슈퍼모드 시 🔥, 일반 🚀)
      ctx.save();
      ctx.translate(player.x, player.y);
      if (player.shieldTime > 0) {
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 22, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.font = '28px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const pEmoji = player.superMode ? '🔥' : '🚀';
      ctx.fillText(pEmoji, 0, 0);
      ctx.restore();

      // 총알
      ctx.fillStyle = '#ffff00';
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // 적 탄막
      ctx.fillStyle = '#ff0055';
      enemyBullets.forEach(eb => {
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, eb.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // 적
      enemies.forEach(e => {
        ctx.font = '26px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(e.emoji, e.x, e.y);
      });

      // 보스
      if (boss) {
        ctx.font = '56px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(boss.emoji, boss.x, boss.y);

        document.getElementById('boss-bar-container').style.display = 'block';
        document.getElementById('boss-bar').style.width = Math.max(0, (boss.hp / boss.maxHp * 100)) + '%';
      } else {
        document.getElementById('boss-bar-container').style.display = 'none';
      }

      // 드롭 아이템
      items.forEach(item => {
        ctx.font = '22px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(item.emoji, item.x, item.y);
      });

      // 폭발 이펙트
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.font = `${Math.floor(p.size)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('💥', p.x, p.y);
        ctx.restore();
      });

      // 계기판 HUD 연동 (지침 3: 🛡️ 실드 이모지 표시)
      document.getElementById('score-val').innerText = score;
      document.getElementById('hp-val').innerText = Math.ceil(player.hp);
      document.getElementById('level-val').innerText = level;
      document.getElementById('points-val').innerText = shopPoints;
      document.getElementById('weapon-val').innerText = currentWeapon.emoji;
    }

    function createExplosion(x, y, startSize = 16) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 1.5 + 0.5;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: startSize,
        alpha: 1.0
      });
    }

    function gameLoop() {
      update();
      render();

      if (gameState === 'GAMEOVER') {
        document.getElementById('game-over-screen').style.display = 'flex';
        document.getElementById('game-over-desc').innerText = `최종 점수: ${score} | 획득 포인트: ${shopPoints}P`;
      } else if (gameState === 'PLAYING') {
        requestAnimationFrame(gameLoop);
      }
    }

    // 키 리스너
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
        e.preventDefault();
      }
      if (e.code === 'Space' && gameState === 'INTRO' && introIdx >= introText.length) {
        startGame();
      }
    });

    window.addEventListener('keyup', e => {
      keys[e.code] = false;
    });

    // 게임 시작
    function startGame() {
      initAudio();
      score = 0;
      level = 1;
      enemiesKilled = 0;
      bossSpawned = false;
      moonMode = false;
      enemies = [];
      bullets = [];
      enemyBullets = [];
      items = [];
      particles = [];
      boss = null;
      hangar = null;
      resetPlayer();
      gameState = 'PLAYING';

      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-over-screen').style.display = 'none';
      document.getElementById('gachaModal').style.display = 'none';
      document.getElementById('shopModal').style.display = 'none';
      requestAnimationFrame(gameLoop);
    }

    // 초기 타이핑 시작
    window.onload = () => {
      typeIntro();
    };
  </script>
</body>
</html>
