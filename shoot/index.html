<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정통 수직 종스크롤 슈팅 게임 (Vertical Arcade Shooter)</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0c10;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      border: 3px solid #00ffcc;
      border-radius: 4px;
      overflow: hidden;
      background: #020205;
    }
    canvas {
      display: block;
      background: #020205;
    }
    .hud {
      position: absolute;
      top: 8px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-size: 13px;
      font-weight: bold;
      z-index: 10;
    }
    .hud-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .boss-bar-container {
      position: absolute;
      top: 34px;
      left: 15%;
      width: 70%;
      height: 8px;
      background: #220011;
      border: 1px solid #ff0055;
      display: none;
      z-index: 10;
    }
    .boss-bar {
      width: 100%;
      height: 100%;
      background: #ff0055;
    }
    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 12, 18, 0.92);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #00ffcc;
      margin: 0 0 10px 0;
      font-size: 20px;
      letter-spacing: 1px;
    }
    p {
      color: #cccccc;
      margin: 5px 0;
      font-size: 13px;
      line-height: 1.4;
    }
    button {
      margin-top: 16px;
      padding: 8px 22px;
      background: #00ffcc;
      border: none;
      color: #000000;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.15s ease;
    }
    button:hover {
      background: #ffffff;
    }
    .controls-guide {
      margin-top: 12px;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 12px;
      border: 1px solid #333344;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- UI HUD -->
    <div class="hud">
      <div class="hud-item">SCORE: <span id="score-val" style="color: #00ffcc;">0</span></div>
      <div class="hud-item">HP: <span id="hp-val" style="color: #ff3366;">100</span></div>
      <div class="hud-item">KILLS: <span id="kills-val" style="color: #ffcc00;">0</span>/15</div>
      <div class="hud-item">LV: <span id="level-val" style="color: #ffffff;">1</span></div>
    </div>

    <!-- 보스 체력바 -->
    <div id="boss-bar-container" class="boss-bar-container">
      <div id="boss-bar" class="boss-bar"></div>
    </div>

    <!-- 게임 시작 화면 -->
    <div id="start-screen" class="overlay-screen">
      <h1>VERTICAL ARCADE SHOOTER</h1>
      <p>정통 수직 종스크롤 아케이드 슈팅</p>
      <div class="controls-guide">
        <p>🎮 <b>이동</b>: 방향키 또는 WASD</p>
        <p>🚀 <b>격발</b>: 스페이스바 (수직 상단 격발)</p>
        <p>🛸 보스 및 전술 격납고 파괴 시 무기/무적 [S] 캡슐 드롭</p>
      </div>
      <button onclick="startGame()">출격하기</button>
    </div>

    <!-- 게임 오버 / 클리어 화면 -->
    <div id="game-over-screen" class="overlay-screen" style="display: none;">
      <h1 id="game-over-title">GAME OVER</h1>
      <p id="game-over-desc">함선이 파괴되었습니다.</p>
      <button onclick="startGame()">다시 도전</button>
    </div>

    <!-- 캔버스 (360x500 수직 비율) -->
    <canvas id="gameCanvas" width="360" height="500"></canvas>
  </div>

  <script>
    const savedTheme = localStorage.getItem('minig-theme');
    if (savedTheme && savedTheme !== 'white') { document.documentElement.setAttribute('data-theme', savedTheme); }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const CANVAS_WIDTH = 360;
    const CANVAS_HEIGHT = 500;

    // Web Audio API 사운드 효과음
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      if (type === 'shoot') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(750, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.07);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.07);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(now + 0.07);
      } else if (type === 'explosion') {
        const bufferSize = audioCtx.sampleRate * 0.16;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(500, now);
        filter.frequency.linearRampToValueAtTime(30, now + 0.16);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.16);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
      } else if (type === 'powerup') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(350, now);
        osc.frequency.exponentialRampToValueAtTime(1100, now + 0.18);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(now + 0.18);
      }
    }

    // 게임 변수
    let gameState = 'START';
    let score = 0;
    let level = 1;
    let killCount = 0;
    const keys = {};

    // 1. 아군 함선 (최하단 중앙 배치, 위쪽 방향 조준)
    const player = {
      x: 180,
      y: 380,
      width: 26,
      height: 26,
      speed: 4.0,
      hp: 100,
      maxHp: 100,
      powerLevel: 1,
      shieldTime: 0,
      lastShot: 0,
      shootDelay: 130
    };

    function resetPlayer() {
      player.x = 180;
      player.y = 380;
      player.hp = 100;
      player.powerLevel = 1;
      player.shieldTime = 0;
      player.lastShot = 0;
    }

    // 배경 입자 (수직 하강)
    const stars = [];
    for (let i = 0; i < 60; i++) {
      stars.push({
        x: Math.random() * CANVAS_WIDTH,
        y: Math.random() * CANVAS_HEIGHT,
        size: Math.random() * 2 + 1,
        speed: Math.random() * 1.8 + 1.0,
        color: ['#ffffff', '#88ccff', '#ffddaa'][Math.floor(Math.random() * 3)]
      });
    }

    const craters = [];
    function initCraters() {
      craters.length = 0;
      for (let i = 0; i < 6; i++) {
        craters.push({
          x: Math.random() * CANVAS_WIDTH,
          y: Math.random() * CANVAS_HEIGHT - CANVAS_HEIGHT,
          radius: Math.random() * 16 + 8,
          speed: 1.0
        });
      }
    }

    // 엔티티 관리 배열
    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let items = [];
    let particles = [];
    let boss = null;
    let hangar = null;
    let enemySpawnTimer = 0;

    // 적 UFO 스폰 (상단 y: -40)
    function spawnEnemy() {
      if (boss) return;
      const type = Math.floor(Math.random() * 5);
      const enemyX = Math.random() * (CANVAS_WIDTH - 40) + 20;

      enemies.push({
        x: enemyX,
        baseX: enemyX,
        y: -40,
        width: 24,
        height: 24,
        type: type,
        hp: type === 2 ? 3 : 1,
        speed: Math.random() * 1.2 + 1.5,
        vx: (Math.random() - 0.5) * 1.8,
        time: 0,
        shootTimer: 0
      });
    }

    // 거대 보스 스폰
    function spawnBoss() {
      boss = {
        x: CANVAS_WIDTH / 2,
        y: -80,
        targetY: 50,
        width: 64,
        height: 44,
        hp: 130,
        maxHp: 130,
        vx: 1.6,
        shootTimer: 0
      };
    }

    // 10레벨 달 기지 전술 격납고 건물 스폰
    function spawnHangar() {
      hangar = {
        x: CANVAS_WIDTH / 2,
        y: -60,
        targetY: 70,
        width: 50,
        height: 36,
        hp: 60,
        maxHp: 60
      };
    }

    // 메인 로직 업데이트
    function update() {
      if (gameState !== 'PLAYING') return;

      // 무적 시간 차감
      if (player.shieldTime > 0) {
        player.shieldTime--;
      }

      // 성단 입자 수직 하강
      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > CANVAS_HEIGHT) {
          s.y = 0;
          s.x = Math.random() * CANVAS_WIDTH;
        }
      });

      // 달 표면 크레이터 수직 하강
      if (level >= 10 || killCount >= 20) {
        if (craters.length === 0) {
          initCraters();
          spawnHangar();
        }
        craters.forEach(c => {
          c.y += c.speed;
          if (c.y > CANVAS_HEIGHT + c.radius) {
            c.y = -c.radius;
            c.x = Math.random() * CANVAS_WIDTH;
          }
        });
      }

      // 아군 이동 및 화면 경계 제한
      if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
      if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
      if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
      if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;

      player.x = Math.max(player.width / 2, Math.min(CANVAS_WIDTH - player.width / 2, player.x));
      player.y = Math.max(player.height / 2, Math.min(CANVAS_HEIGHT - player.height / 2, player.y));

      // 주포 [하단 -> 상단 방향(y축 마이너스)] 수직 격발
      const now = Date.now();
      if ((keys['Space'] || keys['Spacebar'] || keys['KeyZ']) && now - player.lastShot > player.shootDelay) {
        player.lastShot = now;
        playSound('shoot');

        if (player.powerLevel === 1) {
          bullets.push({ x: player.x, y: player.y - 14, vx: 0, vy: -9.5, radius: 2.5, power: 1 });
        } else if (player.powerLevel === 2) {
          bullets.push({ x: player.x - 6, y: player.y - 10, vx: 0, vy: -9.5, radius: 2.5, power: 1 });
          bullets.push({ x: player.x + 6, y: player.y - 10, vx: 0, vy: -9.5, radius: 2.5, power: 1 });
        } else {
          bullets.push({ x: player.x, y: player.y - 14, vx: 0, vy: -10, radius: 3, power: 1 });
          bullets.push({ x: player.x - 8, y: player.y - 8, vx: -1.8, vy: -9, radius: 2.5, power: 1 });
          bullets.push({ x: player.x + 8, y: player.y - 8, vx: 1.8, vy: -9, radius: 2.5, power: 1 });
        }
      }

      // 아군 총알 이동
      bullets.forEach((b, index) => {
        b.x += b.vx;
        b.y += b.vy;
        if (b.y < -10 || b.x < -10 || b.x > CANVAS_WIDTH + 10) {
          bullets.splice(index, 1);
        }
      });

      // 적 탄막 이동 및 피격 판정
      enemyBullets.forEach((eb, index) => {
        eb.x += eb.vx;
        eb.y += eb.vy;

        const dist = Math.hypot(eb.x - player.x, eb.y - player.y);
        if (dist < eb.radius + player.width / 3.2) {
          if (player.shieldTime <= 0) {
            player.hp -= eb.damage || 10;
            createExplosion(player.x, player.y, '#ff3366', 8);
            if (player.hp <= 0) {
              player.hp = 0;
              gameState = 'GAMEOVER';
              playSound('explosion');
            }
          }
          enemyBullets.splice(index, 1);
          return;
        }

        if (eb.y > CANVAS_HEIGHT + 10 || eb.x < -10 || eb.x > CANVAS_WIDTH + 10 || eb.y < -20) {
          enemyBullets.splice(index, 1);
        }
      });

      // 적 스폰
      enemySpawnTimer++;
      if (enemySpawnTimer > Math.max(22, 55 - level * 3) && !boss) {
        spawnEnemy();
        enemySpawnTimer = 0;
      }

      // 15마리 처치 시 보스 출현
      if (killCount >= 15 && !boss && gameState === 'PLAYING') {
        spawnBoss();
      }

      // 적 5종 변칙 패턴 (상단에서 하단 수직 벡터 연산)
      enemies.forEach((enemy, index) => {
        enemy.time += 0.05;

        switch (enemy.type) {
          case 0: // 직선 하강
            enemy.y += enemy.speed;
            break;
          case 1: // Sine 곡선 하강
            enemy.y += enemy.speed * 0.9;
            enemy.x = enemy.baseX + Math.sin(enemy.time * 2.2) * 38;
            break;
          case 2: // 헤비 직진 하강
            enemy.y += enemy.speed * 0.65;
            break;
          case 3: // 추적 하강
            const dx = player.x - enemy.x;
            const dy = player.y - enemy.y;
            const angle = Math.atan2(dy, dx);
            enemy.x += Math.cos(angle) * enemy.speed * 0.85;
            enemy.y += Math.sin(angle) * enemy.speed * 0.85;
            break;
          case 4: // 지그재그 하강
            enemy.x += enemy.vx;
            enemy.y += enemy.speed * 1.1;
            if (enemy.x < 15 || enemy.x > CANVAS_WIDTH - 15) {
              enemy.vx *= -1;
            }
            break;
        }

        // 적 사격
        enemy.shootTimer++;
        if (enemy.shootTimer > 90 && enemy.y > 30 && enemy.y < CANVAS_HEIGHT - 120) {
          enemy.shootTimer = 0;
          if (Math.random() < 0.45) {
            const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
            enemyBullets.push({
              x: enemy.x,
              y: enemy.y + 10,
              vx: Math.cos(angle) * 2.8,
              vy: Math.sin(angle) * 2.8,
              radius: 3.5,
              damage: 10
            });
          }
        }

        // 잡몹 피격 처리 (잡몹 처치 시 아이템 상자 드롭 없음!)
        bullets.forEach((b, bIndex) => {
          if (Math.hypot(b.x - enemy.x, b.y - enemy.y) < enemy.width / 2 + b.radius) {
            enemy.hp -= b.power;
            bullets.splice(bIndex, 1);
            createExplosion(b.x, b.y, '#ffff55', 3);

            if (enemy.hp <= 0) {
              createExplosion(enemy.x, enemy.y, '#ff6600', 10);
              playSound('explosion');
              score += (enemy.type + 1) * 100;
              killCount++;
              if (killCount % 5 === 0) level++;
              enemies.splice(index, 1);
            }
          }
        });

        // 충돌
        if (Math.hypot(player.x - enemy.x, player.y - enemy.y) < (player.width + enemy.width) / 2.3) {
          if (player.shieldTime <= 0) {
            player.hp -= 20;
            if (player.hp <= 0) gameState = 'GAMEOVER';
          }
          createExplosion(enemy.x, enemy.y, '#ff0000', 12);
          playSound('explosion');
          enemies.splice(index, 1);
        }

        if (enemy.y > CANVAS_HEIGHT + 40) {
          enemies.splice(index, 1);
        }
      });

      // 거대 보스 처리
      if (boss) {
        if (boss.y < boss.targetY) {
          boss.y += 1.4;
        } else {
          boss.x += boss.vx;
          if (boss.x < boss.width / 2 + 15 || boss.x > CANVAS_WIDTH - boss.width / 2 - 15) {
            boss.vx *= -1;
          }

          boss.shootTimer++;
          if (boss.shootTimer > 40) {
            boss.shootTimer = 0;
            const count = 7;
            for (let i = 0; i < count; i++) {
              const spreadAngle = (Math.PI / (count - 1)) * i;
              enemyBullets.push({
                x: boss.x,
                y: boss.y + 18,
                vx: Math.cos(spreadAngle) * 3,
                vy: Math.sin(spreadAngle) * 3,
                radius: 3.5,
                damage: 12
              });
            }
          }
        }

        // 보스 피격 (보스 파괴 시에만 확정 아이템 드롭!)
        bullets.forEach((b, bIndex) => {
          if (Math.hypot(b.x - boss.x, b.y - boss.y) < boss.width / 2) {
            boss.hp -= b.power;
            bullets.splice(bIndex, 1);
            createExplosion(b.x, b.y, '#00ffff', 4);

            if (boss.hp <= 0) {
              createExplosion(boss.x, boss.y, '#ff0055', 35);
              playSound('explosion');
              score += 5000;

              // 보스 파괴 위치에 아이템 상자 확정 드롭
              items.push({ x: boss.x - 10, y: boss.y, width: 16, height: 16, speed: 1.2, type: 'POWER' });
              items.push({ x: boss.x + 10, y: boss.y, width: 16, height: 16, speed: 1.2, type: 'HEAL' });

              boss = null;
              gameState = 'VICTORY';
            }
          }
        });
      }

      // 10레벨 전술 격납고 건물 처리
      if (hangar) {
        if (hangar.y < hangar.targetY) hangar.y += 1.0;

        bullets.forEach((b, bIndex) => {
          if (Math.hypot(b.x - hangar.x, b.y - hangar.y) < hangar.width / 2) {
            hangar.hp -= b.power;
            bullets.splice(bIndex, 1);
            createExplosion(b.x, b.y, '#ffaa00', 3);

            if (hangar.hp <= 0) {
              createExplosion(hangar.x, hangar.y, '#00ffcc', 25);
              playSound('explosion');
              // 격납고 파괴 시 무적 [S] 캡슐 드롭
              items.push({ x: hangar.x, y: hangar.y, width: 16, height: 16, speed: 1.2, type: 'SHIELD' });
              hangar = null;
            }
          }
        });
      }

      // 아이템 수직 하강 및 획득
      items.forEach((item, index) => {
        item.y += item.speed;

        if (Math.hypot(player.x - item.x, player.y - item.y) < player.width / 2 + item.width / 2) {
          playSound('powerup');
          if (item.type === 'POWER') {
            player.powerLevel = Math.min(3, player.powerLevel + 1);
          } else if (item.type === 'HEAL') {
            player.hp = Math.min(player.maxHp, player.hp + 35);
          } else if (item.type === 'SHIELD') {
            player.shieldTime = 300; // 약 5초간 무적
          }
          items.splice(index, 1);
        } else if (item.y > CANVAS_HEIGHT + 20) {
          items.splice(index, 1);
        }
      });

      // 폭발 입자 연산
      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.04;
        if (p.alpha <= 0) particles.splice(index, 1);
      });
    }

    // 메인 렌더링 (네온 및 그림자 효과 완전 제외, 단색 채우기)
    function render() {
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // 1. 우주 성단 배경
      stars.forEach(s => {
        ctx.fillStyle = s.color;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });

      // 2. 달 표면 크레이터
      if (level >= 10 || killCount >= 20) {
        ctx.fillStyle = '#222233';
        craters.forEach(c => {
          ctx.beginPath();
          ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      // 3. 전술 격납고 건물
      if (hangar) {
        ctx.fillStyle = '#555577';
        ctx.fillRect(hangar.x - hangar.width / 2, hangar.y - hangar.height / 2, hangar.width, hangar.height);
        ctx.fillStyle = '#00ffcc';
        ctx.fillRect(hangar.x - 8, hangar.y - 4, 16, 8);
      }

      // 4. 아군 함선 (상단 솟구침)
      ctx.save();
      ctx.translate(player.x, player.y);

      // 무적 막 (단색 원형 선)
      if (player.shieldTime > 0) {
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 20, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 기체 바디
      ctx.fillStyle = '#00ffcc';
      ctx.beginPath();
      ctx.moveTo(0, -14);
      ctx.lineTo(-12, 10);
      ctx.lineTo(0, 5);
      ctx.lineTo(12, 10);
      ctx.closePath();
      ctx.fill();

      // 추진체 불꽃
      ctx.fillStyle = '#ff9900';
      ctx.beginPath();
      ctx.moveTo(-4, 8);
      ctx.lineTo(0, 8 + Math.random() * 6 + 2);
      ctx.lineTo(4, 8);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // 5. 아군 총알
      ctx.fillStyle = '#ffff00';
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // 6. 적 탄막
      ctx.fillStyle = '#ff0055';
      enemyBullets.forEach(eb => {
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, eb.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // 7. 적 UFO
      enemies.forEach(e => {
        ctx.save();
        ctx.translate(e.x, e.y);

        const colors = ['#ff4444', '#cc44ff', '#33ff66', '#ffaa00', '#00ccff'];
        ctx.fillStyle = colors[e.type] || '#ff4444';

        ctx.beginPath();
        ctx.ellipse(0, 0, e.width / 2, e.height / 3.2, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, -e.height / 6, e.width / 4, Math.PI, 0);
        ctx.fill();

        ctx.restore();
      });

      // 8. 거대 보스
      if (boss) {
        ctx.save();
        ctx.translate(boss.x, boss.y);

        ctx.fillStyle = '#ff0055';
        ctx.beginPath();
        ctx.ellipse(0, 0, boss.width / 2, boss.height / 2.5, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        document.getElementById('boss-bar-container').style.display = 'block';
        document.getElementById('boss-bar').style.width = Math.max(0, (boss.hp / boss.maxHp * 100)) + '%';
      } else {
        document.getElementById('boss-bar-container').style.display = 'none';
      }

      // 9. 드롭 아이템 상자 / [S] 무적 캡슐
      items.forEach(item => {
        if (item.type === 'SHIELD') {
          ctx.fillStyle = '#00ffff';
        } else if (item.type === 'POWER') {
          ctx.fillStyle = '#ffdd00';
        } else {
          ctx.fillStyle = '#00ff66';
        }
        ctx.fillRect(item.x - item.width / 2, item.y - item.height / 2, item.width, item.height);

        ctx.fillStyle = '#000000';
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const label = item.type === 'POWER' ? 'P' : item.type === 'HEAL' ? 'H' : 'S';
        ctx.fillText(label, item.x, item.y);
      });

      // 10. 폭발 파티클
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.radius, p.y - p.radius, p.radius * 2, p.radius * 2);
        ctx.restore();
      });

      // UI 정보 반영
      document.getElementById('score-val').innerText = score;
      document.getElementById('level-val').innerText = level;
      document.getElementById('hp-val').innerText = Math.ceil(player.hp);
      document.getElementById('kills-val').innerText = killCount;
    }

    function createExplosion(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 2.8 + 1;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: color,
          radius: Math.random() * 2 + 1,
          alpha: 1
        });
      }
    }

    // 메인 게임 루프
    function gameLoop() {
      update();
      render();

      if (gameState === 'GAMEOVER') {
        document.getElementById('game-over-screen').style.display = 'flex';
        document.getElementById('game-over-title').innerText = 'GAME OVER';
        document.getElementById('game-over-desc').innerText = `최종 점수: ${score} | 처치 수: ${killCount}`;
      } else if (gameState === 'VICTORY') {
        document.getElementById('game-over-screen').style.display = 'flex';
        document.getElementById('game-over-title').innerText = 'MISSION CLEAR!';
        document.getElementById('game-over-desc').innerText = `보스 파괴 완료! 최종 점수: ${score}`;
      } else {
        requestAnimationFrame(gameLoop);
      }
    }

    // 이벤트 리스너
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', e => {
      keys[e.code] = false;
    });

    // 게임 시작
    function startGame() {
      initAudio();
      score = 0;
      level = 1;
      killCount = 0;
      enemies = [];
      bullets = [];
      enemyBullets = [];
      items = [];
      particles = [];
      boss = null;
      hangar = null;
      resetPlayer();
      gameState = 'PLAYING';

      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-over-screen').style.display = 'none';
      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
