<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>미니지 - 스네이크</title>

    <!-- 공통 테마 CSS -->
    <link rel="stylesheet" href="/theme.css">

    <style>
        :root {
            --bg: var(--bg-color);
            --text: var(--text-color);
            --canvas-bg: var(--card-bg);
            --border: var(--card-border);
            --btn-bg: var(--card-bg);
        }

        [data-theme="cream"] {
            --canvas-bg: #fffdf8;
        }

        [data-theme="dark"] {
            --canvas-bg: #161b22;
        }

        body {
            text-align: center;
            background-color: var(--bg);
            color: var(--text);
            font-family: sans-serif;
            padding-top: 30px;
            margin: 0;
            transition: 0.3s;
        }

        canvas {
            background-color: var(--canvas-bg);
            display: block;
            margin: 20px auto;
            border: 4px solid var(--border);
            border-radius: 12px;
            box-shadow:
                0 8px 24px rgba(0,0,0,0.05);
        }

        button {
            background-color: var(--btn-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }

        #score {
            color: #ff6b6b;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--canvas-bg);
            padding: 30px;
            border-radius: 16px;
            border: 2px solid var(--border);
            text-align: center;
            box-shadow:
                0 10px 25px rgba(0,0,0,0.2);
        }


        /* Mobile / touch support */
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body {
            min-width: 0;
            padding-left: max(8px, env(safe-area-inset-left));
            padding-right: max(8px, env(safe-area-inset-right));
            padding-bottom: max(18px, env(safe-area-inset-bottom));
            overflow-x: hidden;
        }
        h1 {
            max-width: 100%;
            padding-left: 8px;
            padding-right: 8px;
            font-size: clamp(1.35rem, 5.5vw, 2rem);
            line-height: 1.25;
            overflow-wrap: anywhere;
        }
        canvas {
            max-width: calc(100vw - 24px);
            height: auto;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        button, select {
            min-height: 44px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .touch-controls {
            display: none;
            width: min(420px, calc(100vw - 24px));
            margin: 12px auto 16px;
            gap: 8px;
            -webkit-user-select: none;
            user-select: none;
        }
        .touch-controls button {
            min-width: 0;
            min-height: 54px;
            margin: 0;
            padding: 10px 8px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .touch-help {
            display: none;
            max-width: 420px;
            margin: 0 auto 10px;
            padding: 0 8px;
            font-size: .82rem;
            line-height: 1.5;
            opacity: .72;
        }
        .pad-space { display: block; }
        .pad-center { display: grid; place-items: center; opacity: .35; font-size: .8rem; }

        @media (max-width: 700px), (pointer: coarse) {
            body { padding-top: max(10px, env(safe-area-inset-top)); }
            .touch-controls { display: grid; }
            .touch-help { display: block; }
            .modal-content {
                width: min(92vw, 420px);
                max-width: 92vw;
                padding: 22px 18px;
            }
            button { font-size: 1rem; }
        }

        #gameCanvas { width: min(400px, calc(100vw - 24px)); height: auto; }
        .snake-dpad {
            grid-template-columns: repeat(3, minmax(0, 1fr));
            max-width: 230px;
        }
        .snake-dpad button { min-height: 58px; font-size: 1.35rem; }
        @media (max-width: 700px), (pointer: coarse) {
            body { padding-top: max(12px, env(safe-area-inset-top)); }
            #score { font-size: clamp(1.2rem, 5vw, 1.5rem); }
        }

    </style>
</head>

<body>
    <h1>🐍 스네이크</h1>

    <div id="score">SCORE: 0</div>

    <canvas
        id="gameCanvas"
        width="400"
        height="400"
        data-swipe-keys="true"
        aria-label="스네이크 게임 화면"
    ></canvas>

    <div class="touch-controls snake-dpad" aria-label="스네이크 방향 조작">
        <span class="pad-space"></span>
        <button type="button" data-key="ArrowUp" aria-label="위로 이동">▲</button>
        <span class="pad-space"></span>
        <button type="button" data-key="ArrowLeft" aria-label="왼쪽 이동">◀</button>
        <span class="pad-center" aria-hidden="true">🐍</span>
        <button type="button" data-key="ArrowRight" aria-label="오른쪽 이동">▶</button>
        <span class="pad-space"></span>
        <button type="button" data-key="ArrowDown" aria-label="아래로 이동">▼</button>
        <span class="pad-space"></span>
    </div>
    <p class="touch-help">화면을 원하는 방향으로 밀거나 아래 방향 버튼을 누르세요.</p>

    <button onclick="location.href='../'">
        🏠 메인으로 가기
    </button>

    <div class="modal" id="overModal">
        <div class="modal-content">

            <h2 style="color:#ff6b6b; margin-top:0;">
                💥 GAME OVER!
            </h2>

            <p
                id="finalScore"
                style="
                    font-size:1.2rem;
                    font-weight:bold;
                "
            >
                최종 점수: 0점
            </p>

            <button onclick="restart()">
                🔄 다시 시작
            </button>

            <button onclick="location.href='../'">
                🏠 메인 메뉴
            </button>

        </div>
    </div>

    <script>
        /*
         * 공통 테마 적용
         * 기존 beige → cream 자동 변환
         */
        let savedTheme =
            localStorage.getItem('minig-theme');

        if (savedTheme === 'beige') {
            savedTheme = 'cream';

            localStorage.setItem(
                'minig-theme',
                'cream'
            );
        }

        if (
            savedTheme &&
            savedTheme !== 'white'
        ) {
            document.documentElement.setAttribute(
                'data-theme',
                savedTheme
            );
        }


        const audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        function playSound(type) {
            try {
                const osc =
                    audioCtx.createOscillator();

                const gain =
                    audioCtx.createGain();

                osc.connect(gain);
                gain.connect(
                    audioCtx.destination
                );

                const now =
                    audioCtx.currentTime;


                if (type === 'eat') {
                    osc.type = 'square';

                    osc.frequency.setValueAtTime(
                        523.25,
                        now
                    );

                    osc.frequency
                        .exponentialRampToValueAtTime(
                            1046.5,
                            now + 0.08
                        );

                    gain.gain.setValueAtTime(
                        0.04,
                        now
                    );

                    gain.gain
                        .linearRampToValueAtTime(
                            0,
                            now + 0.08
                        );

                    osc.start(now);
                    osc.stop(now + 0.08);

                } else if (type === 'over') {
                    osc.type = 'sawtooth';

                    osc.frequency.setValueAtTime(
                        180,
                        now
                    );

                    osc.frequency
                        .linearRampToValueAtTime(
                            40,
                            now + 0.4
                        );

                    gain.gain.setValueAtTime(
                        0.15,
                        now
                    );

                    gain.gain
                        .linearRampToValueAtTime(
                            0,
                            now + 0.4
                        );

                    osc.start(now);
                    osc.stop(now + 0.4);
                }

            } catch(e) {}
        }


        const canvas =
            document.getElementById(
                "gameCanvas"
            );

        const ctx =
            canvas.getContext("2d");


        const grid = 20;

        let count = 0;
        let score = 0;
        let isOver = false;
        let gameId = null;


        let snake = {
            x: 160,
            y: 160,
            dx: grid,
            dy: 0,
            cells: [
                {
                    x: 160,
                    y: 160
                }
            ],
            maxCells: 4
        };


        let apple = {
            x: 320,
            y: 320
        };


        function getRandomInt(min, max) {
            return Math.floor(
                Math.random() *
                (max - min)
            ) + min;
        }


        function loop() {
            if (isOver) return;

            gameId =
                requestAnimationFrame(
                    loop
                );

            if (++count < 8) return;

            count = 0;

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            snake.x += snake.dx;
            snake.y += snake.dy;


            if (
                snake.x < 0 ||
                snake.x >= canvas.width ||
                snake.y < 0 ||
                snake.y >= canvas.height
            ) {
                triggerGameOver();
            }


            snake.cells.unshift({
                x: snake.x,
                y: snake.y
            });


            if (
                snake.cells.length >
                snake.maxCells
            ) {
                snake.cells.pop();
            }


            /*
             * 사과
             * 기존 게임 디자인 유지
             */
            ctx.fillStyle = '#ff6b6b';

            ctx.beginPath();

            ctx.arc(
                apple.x + 10,
                apple.y + 10,
                8,
                0,
                2 * Math.PI
            );

            ctx.fill();


            /*
             * 뱀
             * 기존 게임 디자인 유지
             */
            ctx.fillStyle = '#4dadf7';


            snake.cells.forEach(
                function(cell, index) {

                    ctx.fillRect(
                        cell.x,
                        cell.y,
                        grid - 1,
                        grid - 1
                    );


                    if (
                        cell.x === apple.x &&
                        cell.y === apple.y
                    ) {
                        playSound('eat');

                        snake.maxCells++;

                        score += 10;

                        document.getElementById(
                            "score"
                        ).innerText =
                            "SCORE: " + score;


                        apple.x =
                            getRandomInt(
                                0,
                                20
                            ) * grid;

                        apple.y =
                            getRandomInt(
                                0,
                                20
                            ) * grid;
                    }


                    for (
                        let i = index + 1;
                        i < snake.cells.length;
                        i++
                    ) {
                        if (
                            cell.x ===
                                snake.cells[i].x &&
                            cell.y ===
                                snake.cells[i].y
                        ) {
                            triggerGameOver();
                        }
                    }
                }
            );
        }


        function triggerGameOver() {
            isOver = true;

            cancelAnimationFrame(
                gameId
            );

            playSound('over');

            document.getElementById(
                "finalScore"
            ).innerText =
                "최종 점수: " +
                score +
                "점";

            document.getElementById(
                "overModal"
            ).style.display =
                "flex";
        }


        function restart() {
            document.getElementById(
                "overModal"
            ).style.display =
                "none";

            score = 0;

            document.getElementById(
                "score"
            ).innerText =
                "SCORE: 0";


            snake.x = 160;
            snake.y = 160;

            snake.cells = [
                {
                    x: 160,
                    y: 160
                }
            ];

            snake.maxCells = 4;

            snake.dx = grid;
            snake.dy = 0;


            apple.x =
                getRandomInt(
                    0,
                    20
                ) * grid;

            apple.y =
                getRandomInt(
                    0,
                    20
                ) * grid;

            isOver = false;

            loop();
        }


        document.addEventListener(
            'keydown',
            function(e) {

                if (
                    e.key === 'ArrowLeft' &&
                    snake.dx === 0
                ) {
                    snake.dx = -grid;
                    snake.dy = 0;

                } else if (
                    e.key === 'ArrowUp' &&
                    snake.dy === 0
                ) {
                    snake.dy = -grid;
                    snake.dx = 0;

                } else if (
                    e.key === 'ArrowRight' &&
                    snake.dx === 0
                ) {
                    snake.dx = grid;
                    snake.dy = 0;

                } else if (
                    e.key === 'ArrowDown' &&
                    snake.dy === 0
                ) {
                    snake.dy = grid;
                    snake.dx = 0;
                }
            }
        );


        loop();
    </script>
    
<script>
(() => {
    'use strict';
    const sendKey = (type, key) => {
        document.dispatchEvent(new KeyboardEvent(type, {
            key,
            bubbles: true,
            cancelable: true
        }));
    };

    const activePresses = new Map();
    document.querySelectorAll('.touch-controls [data-key]').forEach((button) => {
        const key = button.dataset.key;
        const hold = button.hasAttribute('data-hold');
        const repeat = button.hasAttribute('data-repeat');
        let repeatTimer = null;
        let pressed = false;

        const stop = (event) => {
            if (!pressed) return;
            if (event) event.preventDefault();
            pressed = false;
            if (repeatTimer !== null) {
                clearInterval(repeatTimer);
                repeatTimer = null;
            }
            sendKey('keyup', key);
            activePresses.delete(button);
        };

        if (hold || repeat) {
            button.addEventListener('pointerdown', (event) => {
                if (pressed) return;
                event.preventDefault();
                pressed = true;
                activePresses.set(button, stop);
                sendKey('keydown', key);
                if (repeat) {
                    repeatTimer = setInterval(() => sendKey('keydown', key), 105);
                }
                try { button.setPointerCapture(event.pointerId); } catch (_) {}
            });
            ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((name) => {
                button.addEventListener(name, stop);
            });
        } else {
            button.addEventListener('click', (event) => {
                event.preventDefault();
                sendKey('keydown', key);
                sendKey('keyup', key);
            });
        }
        button.addEventListener('contextmenu', (event) => event.preventDefault());
    });

    window.addEventListener('pointerup', () => {
        for (const stop of [...activePresses.values()]) stop();
    });
    window.addEventListener('blur', () => {
        for (const stop of [...activePresses.values()]) stop();
    });
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            for (const stop of [...activePresses.values()]) stop();
        }
    });

    window.addEventListener('keydown', (event) => {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(event.key)) {
            const target = event.target;
            const isInput = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT');
            if (!isInput) event.preventDefault();
        }
    }, { passive: false });

    const canvas = document.querySelector('canvas');
    if (canvas && canvas.dataset.swipeKeys === 'true') {
        let startX = 0;
        let startY = 0;
        let pointerId = null;
        canvas.addEventListener('pointerdown', (event) => {
            if (event.pointerType === 'mouse' && event.button !== 0) return;
            startX = event.clientX;
            startY = event.clientY;
            pointerId = event.pointerId;
            try { canvas.setPointerCapture(pointerId); } catch (_) {}
        });
        canvas.addEventListener('pointerup', (event) => {
            if (pointerId !== event.pointerId) return;
            const dx = event.clientX - startX;
            const dy = event.clientY - startY;
            const threshold = Math.max(18, canvas.getBoundingClientRect().width * 0.045);
            pointerId = null;
            if (Math.max(Math.abs(dx), Math.abs(dy)) < threshold) return;
            const key = Math.abs(dx) > Math.abs(dy)
                ? (dx < 0 ? 'ArrowLeft' : 'ArrowRight')
                : (dy < 0 ? 'ArrowUp' : 'ArrowDown');
            sendKey('keydown', key);
            sendKey('keyup', key);
        });
        canvas.addEventListener('pointercancel', () => { pointerId = null; });
    }
})();
</script>


</body>
</html>
