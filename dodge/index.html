<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>미니지 - 똥피하기</title>

    <!-- 공통 테마 CSS -->
    <link rel="stylesheet" href="/theme.css">

    <style>
        :root {
            --bg: var(--bg-color);
            --text: var(--text-color);
            --canvas-bg: var(--card-bg);
            --border: var(--card-border);
            --btn-bg: var(--card-bg);
        }

        [data-theme="cream"] {
            --canvas-bg: #fffdf8;
        }

        [data-theme="dark"] {
            --canvas-bg: #161b22;
        }

        body {
            text-align: center;
            background-color: var(--bg);
            color: var(--text);
            font-family: sans-serif;
            padding-top: 30px;
            margin: 0;
            transition: 0.3s;
        }

        canvas {
            background-color: var(--canvas-bg);
            display: block;
            margin: 20px auto;
            border: 4px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
        }

        button {
            background-color: var(--btn-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }

        #score {
            color: #ff922b;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--canvas-bg);
            padding: 30px;
            border-radius: 16px;
            border: 2px solid var(--border);
            text-align: center;
            box-shadow:
                0 10px 25px rgba(0,0,0,0.2);
        }


        /* Mobile / touch support */
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body {
            min-width: 0;
            padding-left: max(8px, env(safe-area-inset-left));
            padding-right: max(8px, env(safe-area-inset-right));
            padding-bottom: max(18px, env(safe-area-inset-bottom));
            overflow-x: hidden;
        }
        h1 {
            max-width: 100%;
            padding-left: 8px;
            padding-right: 8px;
            font-size: clamp(1.35rem, 5.5vw, 2rem);
            line-height: 1.25;
            overflow-wrap: anywhere;
        }
        canvas {
            max-width: calc(100vw - 24px);
            height: auto;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        button, select {
            min-height: 44px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .touch-controls {
            display: none;
            width: min(420px, calc(100vw - 24px));
            margin: 12px auto 16px;
            gap: 8px;
            -webkit-user-select: none;
            user-select: none;
        }
        .touch-controls button {
            min-width: 0;
            min-height: 54px;
            margin: 0;
            padding: 10px 8px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .touch-help {
            display: none;
            max-width: 420px;
            margin: 0 auto 10px;
            padding: 0 8px;
            font-size: .82rem;
            line-height: 1.5;
            opacity: .72;
        }
        .pad-space { display: block; }
        .pad-center { display: grid; place-items: center; opacity: .35; font-size: .8rem; }

        @media (max-width: 700px), (pointer: coarse) {
            body { padding-top: max(10px, env(safe-area-inset-top)); }
            .touch-controls { display: grid; }
            .touch-help { display: block; }
            .modal-content {
                width: min(92vw, 420px);
                max-width: 92vw;
                padding: 22px 18px;
            }
            button { font-size: 1rem; }
        }

        #gameCanvas { width: min(400px, calc(100vw - 24px)); height: auto; }
        .dodge-controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .dodge-controls button { min-height: 62px; }
        @media (max-width: 700px), (pointer: coarse) {
            body { padding-top: max(12px, env(safe-area-inset-top)); }
            #score { font-size: clamp(1.2rem, 5vw, 1.5rem); }
            .modal-content { padding: 22px 18px; }
        }

    </style>
</head>

<body>

    <h1>💩 똥피하기</h1>

    <div id="score">SCORE: 0</div>

    <canvas
        id="gameCanvas"
        width="400"
        height="400"
    ></canvas>

    <div class="touch-controls dodge-controls" aria-label="플레이어 좌우 이동">
        <button type="button" data-key="ArrowLeft" data-hold aria-label="왼쪽 이동">◀ 왼쪽</button>
        <button type="button" data-key="ArrowRight" data-hold aria-label="오른쪽 이동">오른쪽 ▶</button>
    </div>
    <p class="touch-help">아래 방향 버튼을 길게 눌러 캐릭터를 좌우로 이동하세요.</p>

    <button onclick="location.href='../'">
        🏠 메인으로 가기
    </button>

    <div class="modal" id="overModal">
        <div class="modal-content">

            <h2
                style="
                    color:#ff922b;
                    margin-top:0;
                "
            >
                💥 GAME OVER!
            </h2>

            <p
                id="finalScore"
                style="
                    font-size:1.2rem;
                    font-weight:bold;
                "
            >
                최종 점수: 0점
            </p>

            <button onclick="restart()">
                🔄 다시 시작
            </button>

            <button onclick="location.href='../'">
                🏠 메인 메뉴
            </button>

        </div>
    </div>

    <script>
        /*
         * 공통 테마 적용
         * 기존 beige → cream 자동 변환
         */
        let savedTheme =
            localStorage.getItem('minig-theme');

        if (savedTheme === 'beige') {
            savedTheme = 'cream';

            localStorage.setItem(
                'minig-theme',
                'cream'
            );
        }

        if (
            savedTheme &&
            savedTheme !== 'white'
        ) {
            document.documentElement
                .setAttribute(
                    'data-theme',
                    savedTheme
                );
        }


        const audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        function playSound(type) {
            try {
                const osc =
                    audioCtx.createOscillator();

                const gain =
                    audioCtx.createGain();

                osc.connect(gain);
                gain.connect(
                    audioCtx.destination
                );

                const now =
                    audioCtx.currentTime;

                if (type === 'score') {

                    osc.type = 'triangle';

                    osc.frequency.setValueAtTime(
                        450,
                        now
                    );

                    gain.gain.setValueAtTime(
                        0.04,
                        now
                    );

                    gain.gain
                        .linearRampToValueAtTime(
                            0,
                            now + 0.04
                        );

                    osc.start(now);
                    osc.stop(now + 0.04);

                } else if (type === 'over') {

                    osc.type = 'sawtooth';

                    osc.frequency.setValueAtTime(
                        130,
                        now
                    );

                    osc.frequency
                        .linearRampToValueAtTime(
                            30,
                            now + 0.5
                        );

                    gain.gain.setValueAtTime(
                        0.2,
                        now
                    );

                    gain.gain
                        .linearRampToValueAtTime(
                            0,
                            now + 0.5
                        );

                    osc.start(now);
                    osc.stop(now + 0.5);
                }

            } catch(e) {}
        }


        const canvas =
            document.getElementById(
                "gameCanvas"
            );

        const ctx =
            canvas.getContext("2d");


        let player = {
            x: 185,
            y: 360,
            width: 30,
            height: 30,
            speed: 7
        };


        let poops = [];
        let score = 0;
        let keys = {};
        let isOver = false;
        let gameId = null;


        document.addEventListener(
            "keydown",
            e => keys[e.key] = true
        );

        document.addEventListener(
            "keyup",
            e => keys[e.key] = false
        );


        function update() {
            if (isOver) return;

            if (
                keys["ArrowLeft"] &&
                player.x > 0
            ) {
                player.x -= player.speed;
            }

            if (
                keys["ArrowRight"] &&
                player.x <
                    canvas.width -
                    player.width
            ) {
                player.x += player.speed;
            }


            if (Math.random() < 0.08) {
                poops.push({
                    x:
                        Math.random() *
                        (canvas.width - 20),

                    y: 0,
                    size: 20,

                    speed:
                        4 +
                        Math.random() * 4
                });
            }


            for (
                let i = poops.length - 1;
                i >= 0;
                i--
            ) {
                poops[i].y +=
                    poops[i].speed;


                if (
                    poops[i].y >
                    canvas.height
                ) {
                    poops.splice(i, 1);

                    score += 1;

                    playSound('score');

                    document.getElementById(
                        "score"
                    ).innerText =
                        "SCORE: " + score;

                    continue;
                }


                if (
                    poops[i].x <
                        player.x +
                        player.width &&

                    poops[i].x +
                        poops[i].size >
                        player.x &&

                    poops[i].y <
                        player.y +
                        player.height &&

                    poops[i].y +
                        poops[i].size >
                        player.y
                ) {
                    triggerGameOver();
                }
            }
        }


        function triggerGameOver() {
            isOver = true;

            cancelAnimationFrame(
                gameId
            );

            playSound('over');

            document.getElementById(
                "finalScore"
            ).innerText =
                "최종 점수: " +
                score +
                "점";

            document.getElementById(
                "overModal"
            ).style.display =
                "flex";
        }


        function restart() {
            document.getElementById(
                "overModal"
            ).style.display =
                "none";

            score = 0;
            poops = [];

            player.x = 185;

            document.getElementById(
                "score"
            ).innerText =
                "SCORE: 0";

            isOver = false;

            loop();
        }


        function draw() {
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /*
             * 플레이어
             * 기존 네모 → 사람 이모지
             */
            ctx.save();

            ctx.font =
                "30px sans-serif";

            ctx.textBaseline =
                "top";

            ctx.fillText(
                "🧍",
                player.x,
                player.y
            );

            ctx.restore();


            /*
             * 장애물
             * 기존 갈색 네모 → 똥 이모지
             */
            ctx.save();

            ctx.font =
                "22px sans-serif";

            ctx.textBaseline =
                "top";

            poops.forEach(p => {
                ctx.fillText(
                    "💩",
                    p.x,
                    p.y
                );
            });

            ctx.restore();
        }


        function loop() {
            update();
            draw();

            gameId =
                requestAnimationFrame(
                    loop
                );
        }




(() => {
    'use strict';
    const sendKey = (type, key) => {
        document.dispatchEvent(new KeyboardEvent(type, {
            key,
            bubbles: true,
            cancelable: true
        }));
    };

    const activePresses = new Map();
    document.querySelectorAll('.touch-controls [data-key]').forEach((button) => {
        const key = button.dataset.key;
        const hold = button.hasAttribute('data-hold');
        const repeat = button.hasAttribute('data-repeat');
        let repeatTimer = null;
        let pressed = false;

        const stop = (event) => {
            if (!pressed) return;
            if (event) event.preventDefault();
            pressed = false;
            if (repeatTimer !== null) {
                clearInterval(repeatTimer);
                repeatTimer = null;
            }
            sendKey('keyup', key);
            activePresses.delete(button);
        };

        if (hold || repeat) {
            button.addEventListener('pointerdown', (event) => {
                if (pressed) return;
                event.preventDefault();
                pressed = true;
                activePresses.set(button, stop);
                sendKey('keydown', key);
                if (repeat) {
                    repeatTimer = setInterval(() => sendKey('keydown', key), 105);
                }
                try { button.setPointerCapture(event.pointerId); } catch (_) {}
            });
            ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((name) => {
                button.addEventListener(name, stop);
            });
        } else {
            button.addEventListener('click', (event) => {
                event.preventDefault();
                sendKey('keydown', key);
                sendKey('keyup', key);
            });
        }
        button.addEventListener('contextmenu', (event) => event.preventDefault());
    });

    window.addEventListener('pointerup', () => {
        for (const stop of [...activePresses.values()]) stop();
    });
    window.addEventListener('blur', () => {
        for (const stop of [...activePresses.values()]) stop();
    });
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            for (const stop of [...activePresses.values()]) stop();
        }
    });

    window.addEventListener('keydown', (event) => {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(event.key)) {
            const target = event.target;
            const isInput = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT');
            if (!isInput) event.preventDefault();
        }
    }, { passive: false });

    const canvas = document.querySelector('canvas');
    if (canvas && canvas.dataset.swipeKeys === 'true') {
        let startX = 0;
        let startY = 0;
        let pointerId = null;
        canvas.addEventListener('pointerdown', (event) => {
            if (event.pointerType === 'mouse' && event.button !== 0) return;
            startX = event.clientX;
            startY = event.clientY;
            pointerId = event.pointerId;
            try { canvas.setPointerCapture(pointerId); } catch (_) {}
        });
        canvas.addEventListener('pointerup', (event) => {
            if (pointerId !== event.pointerId) return;
            const dx = event.clientX - startX;
            const dy = event.clientY - startY;
            const threshold = Math.max(18, canvas.getBoundingClientRect().width * 0.045);
            pointerId = null;
            if (Math.max(Math.abs(dx), Math.abs(dy)) < threshold) return;
            const key = Math.abs(dx) > Math.abs(dy)
                ? (dx < 0 ? 'ArrowLeft' : 'ArrowRight')
                : (dy < 0 ? 'ArrowUp' : 'ArrowDown');
            sendKey('keydown', key);
            sendKey('keyup', key);
        });
        canvas.addEventListener('pointercancel', () => { pointerId = null; });
    }
})();


        loop();
    </script>

</body>
</html>
