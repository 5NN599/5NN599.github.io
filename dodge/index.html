<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>미니지 - 똥피하기</title>

    <!-- 공통 테마 CSS -->
    <link rel="stylesheet" href="/theme.css">

    <style>
        :root {
            --bg: var(--bg-color);
            --text: var(--text-color);
            --canvas-bg: var(--card-bg);
            --border: var(--card-border);
            --btn-bg: var(--card-bg);
        }

        [data-theme="cream"] {
            --canvas-bg: #fffdf8;
        }

        [data-theme="dark"] {
            --canvas-bg: #161b22;
        }

        body {
            text-align: center;
            background-color: var(--bg);
            color: var(--text);
            font-family: sans-serif;
            padding-top: 30px;
            margin: 0;
            transition: 0.3s;
        }

        canvas {
            background-color: var(--canvas-bg);
            display: block;
            margin: 20px auto;
            border: 4px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
        }

        button {
            background-color: var(--btn-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }

        #score {
            color: #ff922b;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--canvas-bg);
            padding: 30px;
            border-radius: 16px;
            border: 2px solid var(--border);
            text-align: center;
            box-shadow:
                0 10px 25px rgba(0,0,0,0.2);
        }
    </style>
</head>

<body>

    <h1>💩 똥피하기</h1>

    <div id="score">SCORE: 0</div>

    <canvas
        id="gameCanvas"
        width="400"
        height="400"
    ></canvas>

    <button onclick="location.href='../'">
        🏠 메인으로 가기
    </button>

    <div class="modal" id="overModal">
        <div class="modal-content">

            <h2
                style="
                    color:#ff922b;
                    margin-top:0;
                "
            >
                💥 GAME OVER!
            </h2>

            <p
                id="finalScore"
                style="
                    font-size:1.2rem;
                    font-weight:bold;
                "
            >
                최종 점수: 0점
            </p>

            <button onclick="restart()">
                🔄 다시 시작
            </button>

            <button onclick="location.href='../'">
                🏠 메인 메뉴
            </button>

        </div>
    </div>

    <script>
        /*
         * 공통 테마 적용
         * 기존 beige → cream 자동 변환
         */
        let savedTheme =
            localStorage.getItem('minig-theme');

        if (savedTheme === 'beige') {
            savedTheme = 'cream';

            localStorage.setItem(
                'minig-theme',
                'cream'
            );
        }

        if (
            savedTheme &&
            savedTheme !== 'white'
        ) {
            document.documentElement
                .setAttribute(
                    'data-theme',
                    savedTheme
                );
        }


        const audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        function playSound(type) {
            try {
                const osc =
                    audioCtx.createOscillator();

                const gain =
                    audioCtx.createGain();

                osc.connect(gain);
                gain.connect(
                    audioCtx.destination
                );

                const now =
                    audioCtx.currentTime;

                if (type === 'score') {

                    osc.type = 'triangle';

                    osc.frequency.setValueAtTime(
                        450,
                        now
                    );

                    gain.gain.setValueAtTime(
                        0.04,
                        now
                    );

                    gain.gain
                        .linearRampToValueAtTime(
                            0,
                            now + 0.04
                        );

                    osc.start(now);
                    osc.stop(now + 0.04);

                } else if (type === 'over') {

                    osc.type = 'sawtooth';

                    osc.frequency.setValueAtTime(
                        130,
                        now
                    );

                    osc.frequency
                        .linearRampToValueAtTime(
                            30,
                            now + 0.5
                        );

                    gain.gain.setValueAtTime(
                        0.2,
                        now
                    );

                    gain.gain
                        .linearRampToValueAtTime(
                            0,
                            now + 0.5
                        );

                    osc.start(now);
                    osc.stop(now + 0.5);
                }

            } catch(e) {}
        }


        const canvas =
            document.getElementById(
                "gameCanvas"
            );

        const ctx =
            canvas.getContext("2d");


        let player = {
            x: 185,
            y: 360,
            width: 30,
            height: 30,
            speed: 7
        };


        let poops = [];
        let score = 0;
        let keys = {};
        let isOver = false;
        let gameId = null;


        document.addEventListener(
            "keydown",
            e => keys[e.key] = true
        );

        document.addEventListener(
            "keyup",
            e => keys[e.key] = false
        );


        function update() {
            if (isOver) return;

            if (
                keys["ArrowLeft"] &&
                player.x > 0
            ) {
                player.x -= player.speed;
            }

            if (
                keys["ArrowRight"] &&
                player.x <
                    canvas.width -
                    player.width
            ) {
                player.x += player.speed;
            }


            if (Math.random() < 0.08) {
                poops.push({
                    x:
                        Math.random() *
                        (canvas.width - 20),

                    y: 0,
                    size: 20,

                    speed:
                        4 +
                        Math.random() * 4
                });
            }


            for (
                let i = poops.length - 1;
                i >= 0;
                i--
            ) {
                poops[i].y +=
                    poops[i].speed;


                if (
                    poops[i].y >
                    canvas.height
                ) {
                    poops.splice(i, 1);

                    score += 1;

                    playSound('score');

                    document.getElementById(
                        "score"
                    ).innerText =
                        "SCORE: " + score;

                    continue;
                }


                if (
                    poops[i].x <
                        player.x +
                        player.width &&

                    poops[i].x +
                        poops[i].size >
                        player.x &&

                    poops[i].y <
                        player.y +
                        player.height &&

                    poops[i].y +
                        poops[i].size >
                        player.y
                ) {
                    triggerGameOver();
                }
            }
        }


        function triggerGameOver() {
            isOver = true;

            cancelAnimationFrame(
                gameId
            );

            playSound('over');

            document.getElementById(
                "finalScore"
            ).innerText =
                "최종 점수: " +
                score +
                "점";

            document.getElementById(
                "overModal"
            ).style.display =
                "flex";
        }


        function restart() {
            document.getElementById(
                "overModal"
            ).style.display =
                "none";

            score = 0;
            poops = [];

            player.x = 185;

            document.getElementById(
                "score"
            ).innerText =
                "SCORE: 0";

            isOver = false;

            loop();
        }


        function draw() {
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /*
             * 플레이어
             * 기존 네모 → 사람 이모지
             */
            ctx.save();

            ctx.font =
                "30px sans-serif";

            ctx.textBaseline =
                "top";

            ctx.fillText(
                "🧍",
                player.x,
                player.y
            );

            ctx.restore();


            /*
             * 장애물
             * 기존 갈색 네모 → 똥 이모지
             */
            ctx.save();

            ctx.font =
                "22px sans-serif";

            ctx.textBaseline =
                "top";

            poops.forEach(p => {
                ctx.fillText(
                    "💩",
                    p.x,
                    p.y
                );
            });

            ctx.restore();
        }


        function loop() {
            update();
            draw();

            gameId =
                requestAnimationFrame(
                    loop
                );
        }


        loop();
    </script>

</body>
</html>
