<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>미니지 - 카드 뒤집기</title>
    <style>
        :root { --bg: #f8f9fa; --text: #333; --canvas-bg: #fff; --border: #e9ecef; --btn-bg: #fff; }
        [data-theme="beige"] { --bg: #f5ebe0; --text: #4e3d30; --canvas-bg: #eddfd0; --border: #ddcbbb; --btn-bg: #eddfd0; }
        [data-theme="dark"] { --bg: #0d1117; --text: #c9d1d9; --canvas-bg: #161b22; --border: #30363d; --btn-bg: #21262d; }
        body { text-align: center; background-color: var(--bg); color: var(--text); font-family: sans-serif; padding-top: 30px; margin:0; transition: 0.3s; }
        .grid { display: grid; grid-template-columns: repeat(4, 80px); grid-gap: 10px; justify-content: center; margin: 20px auto; }
        .card { width: 80px; height: 100px; background-color: #ff6b6b; border-radius: 8px; font-size: 2rem; line-height: 100px; cursor: pointer; user-select: none; color: transparent; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card.flipped { background-color: var(--canvas-bg); border: 2px solid var(--border); color: var(--text); }
        .card.matched { background-color: #51cf66; color: white; cursor: default; }
        button { background-color: var(--btn-bg); color: var(--text); border: 1px solid var(--border); padding: 10px 20px; font-size: 1rem; border-radius: 8px; cursor: pointer; margin:5px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: var(--canvas-bg); padding: 30px; border-radius: 16px; border: 2px solid var(--border); text-align: center; }
    </style>
</head>
<body>
    <h1>🃏 카드 뒤집기</h1>
    <p>똑같은 쌍의 이모지 카드를 모두 찾아내세요!</p>
    <div class="grid" id="grid"></div>
    <button onclick="location.href='../'">🏠 메인으로 가기</button>
    <div class="modal" id="overModal">
        <div class="modal-content">
            <h2 style="color:#51cf66; margin-top:0;">🎉 성공 완료!</h2>
            <p style="font-size:1.1rem; font-weight:bold;">모든 쌍을 찾았습니다!</p>
            <button onclick="resetGame()">🔄 다시 하기</button>
            <button onclick="location.href='../'">🏠 메인 메뉴</button>
        </div>
    </div>
    <script>
        const savedTheme = localStorage.getItem('minig-theme'); if (savedTheme && savedTheme !== 'white') document.documentElement.setAttribute('data-theme', savedTheme);
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime;
                if (type === 'flip') { osc.type = 'triangle'; osc.frequency.setValueAtTime(350, now); gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0, now + 0.04); osc.start(now); osc.stop(now + 0.04); }
                else if (type === 'match') { osc.type = 'square'; osc.frequency.setValueAtTime(523, now); osc.frequency.setValueAtTime(659, now + 0.06); gain.gain.setValueAtTime(0.03, now); gain.gain.linearRampToValueAtTime(0, now + 0.15); osc.start(now); osc.stop(now + 0.15); }
            } catch(e){}
        }
        const emojis = ['🍎','🍎','🍌','🍌','🍇','🍇','🍓','🍓','🍉','🍉','🍒','🍒','🥕','🥕','🌽','🌽'];
        let choice = []; const gridElement = document.getElementById("grid");
        function resetGame() {
            document.getElementById("overModal").style.display = "none"; choice = []; gridElement.innerHTML = "";
            let shuffled = emojis.sort(() => Math.random() - 0.5);
            shuffled.forEach((emoji, i) => {
                const card = document.createElement("div"); card.classList.add("card"); card.dataset.value = emoji; card.innerText = emoji;
                card.addEventListener("click", () => {
                    if (card.classList.contains("flipped") || card.classList.contains("matched") || choice.length >= 2) return;
                    card.classList.add("flipped"); playSound('flip'); choice.push(card);
                    if (choice.length === 2) {
                        if (choice[0].dataset.value === choice[1].dataset.value) {
                            setTimeout(() => { choice[0].classList.add("matched"); choice[1].classList.add("matched"); playSound('match'); choice = []; if(document.querySelectorAll(".card:not(.matched)").length === 0) document.getElementById("overModal").style.display = "flex"; }, 300);
                        } else {
                            setTimeout(() => { choice[0].classList.remove("flipped"); choice[1].classList.remove("flipped"); choice = []; }, 800);
                        }
                    }
                });
                gridElement.appendChild(card);
            });
        }
        resetGame();
    </script>
</body>
</html>
