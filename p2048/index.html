<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>미니지 - 2048</title>

    <!-- 공통 테마 CSS -->
    <link rel="stylesheet" href="/theme.css">

    <style>
        :root {
            --bg: var(--bg-color);
            --text: var(--text-color);
            --canvas-bg: #05070a;
            --border: var(--card-border);
            --btn-bg: var(--card-bg);
        }

        [data-theme="cream"] {
            --canvas-bg: #14100c;
        }

        [data-theme="dark"] {
            --canvas-bg: #020305;
        }

        body {
            background-color: var(--bg) !important;
            color: var(--text) !important;
            text-align: center;
            font-family: sans-serif;
            padding-top: 15px;
            margin: 0;
            transition: 0.3s;
        }

        canvas {
            background-color: var(--canvas-bg);
            display: block;
            margin: 10px auto;
            border: 4px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        button {
            background-color: var(--btn-bg) !important;
            color: var(--text) !important;
            border: 1px solid var(--border) !important;
            padding: 8px 16px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            margin: 4px;
            font-weight: bold;
        }

        #hud-panel {
            font-size: 1.25rem;
            font-weight: bold;
            color: #fcc419;
            margin-bottom: 4px;
        }


        /* Mobile / touch support */
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body {
            min-width: 0;
            padding-left: max(8px, env(safe-area-inset-left));
            padding-right: max(8px, env(safe-area-inset-right));
            padding-bottom: max(18px, env(safe-area-inset-bottom));
            overflow-x: hidden;
        }
        h1 {
            max-width: 100%;
            padding-left: 8px;
            padding-right: 8px;
            font-size: clamp(1.35rem, 5.5vw, 2rem);
            line-height: 1.25;
            overflow-wrap: anywhere;
        }
        canvas {
            max-width: calc(100vw - 24px);
            height: auto;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        button, select {
            min-height: 44px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .touch-controls {
            display: none;
            width: min(420px, calc(100vw - 24px));
            margin: 12px auto 16px;
            gap: 8px;
            -webkit-user-select: none;
            user-select: none;
        }
        .touch-controls button {
            min-width: 0;
            min-height: 54px;
            margin: 0;
            padding: 10px 8px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .touch-help {
            display: none;
            max-width: 420px;
            margin: 0 auto 10px;
            padding: 0 8px;
            font-size: .82rem;
            line-height: 1.5;
            opacity: .72;
        }
        .pad-space { display: block; }
        .pad-center { display: grid; place-items: center; opacity: .35; font-size: .8rem; }

        @media (max-width: 700px), (pointer: coarse) {
            body { padding-top: max(10px, env(safe-area-inset-top)); }
            .touch-controls { display: grid; }
            .touch-help { display: block; }
            .modal-content {
                width: min(92vw, 420px);
                max-width: 92vw;
                padding: 22px 18px;
            }
            button { font-size: 1rem; }
        }

        #puzzleCanvas { width: 320px; max-width: calc(100vw - 24px); height: auto; }
        .dpad-controls {
            grid-template-columns: repeat(3, minmax(0, 1fr));
            max-width: 240px;
        }
        .dpad-controls button { min-height: 58px; font-size: 1.35rem; }
        @media (max-width: 700px), (pointer: coarse) {
            body { padding-top: max(12px, env(safe-area-inset-top)); }
            #hud-panel { font-size: clamp(1rem, 4.5vw, 1.25rem); }
            #puzzleCanvas { width: min(420px, calc(100vw - 24px)); }
        }

    </style>
</head>

<body>
    <h1>🔢 레트로 2048 퍼즐</h1>

    <div id="hud-panel">
        🏆 Score: 0 | ⭐ Max: 2
    </div>

    <canvas
        id="puzzleCanvas"
        width="320"
        height="320"
        data-swipe-keys="true"
        aria-label="2048 퍼즐 게임 화면"
    ></canvas>

    <div class="touch-controls dpad-controls" aria-label="2048 방향 조작">
        <span class="pad-space"></span>
        <button type="button" data-key="ArrowUp" aria-label="위로 이동">▲</button>
        <span class="pad-space"></span>
        <button type="button" data-key="ArrowLeft" aria-label="왼쪽 이동">◀</button>
        <button type="button" data-key="ArrowDown" aria-label="아래로 이동">▼</button>
        <button type="button" data-key="ArrowRight" aria-label="오른쪽 이동">▶</button>
    </div>
    <p class="touch-help">보드를 밀거나 방향 버튼을 눌러 타일을 이동하세요.</p>

    <div>
        <button onclick="location.href='../'">
            🏠 오락실 메인
        </button>
    </div>

    <script>
        /*
         * 공통 테마 적용
         * 기존 beige → cream 자동 변환
         */
        let savedTheme =
            localStorage.getItem('minig-theme');

        if (savedTheme === 'beige') {
            savedTheme = 'cream';

            localStorage.setItem(
                'minig-theme',
                'cream'
            );
        }

        if (
            savedTheme &&
            savedTheme !== 'white'
        ) {
            document.documentElement.setAttribute(
                'data-theme',
                savedTheme
            );
        }


        // 🎵 2048 퍼즐 전용 주파수 오디오 엔진 빌드
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();
            }
        }

        function playSound(type) {
            initAudio();

            try {
                const osc =
                    audioCtx.createOscillator();

                const gain =
                    audioCtx.createGain();

                osc.connect(gain);
                gain.connect(
                    audioCtx.destination
                );

                const now =
                    audioCtx.currentTime;

                if (type === 'slide') {
                    osc.type = 'sine';

                    osc.frequency.setValueAtTime(
                        400,
                        now
                    );

                    osc.frequency.linearRampToValueAtTime(
                        250,
                        now + 0.04
                    );

                    gain.gain.setValueAtTime(
                        0.008,
                        now
                    );

                    gain.gain.linearRampToValueAtTime(
                        0,
                        now + 0.04
                    );

                    osc.start(now);
                    osc.stop(now + 0.04);

                } else if (type === 'merge') {
                    osc.type = 'triangle';

                    osc.frequency.setValueAtTime(
                        523,
                        now
                    );

                    osc.frequency.setValueAtTime(
                        783,
                        now + 0.04
                    );

                    gain.gain.setValueAtTime(
                        0.02,
                        now
                    );

                    gain.gain.linearRampToValueAtTime(
                        0,
                        now + 0.08
                    );

                    osc.start(now);
                    osc.stop(now + 0.08);

                } else if (type === 'win') {
                    osc.type = 'square';

                    osc.frequency.setValueAtTime(
                        523,
                        now
                    );

                    osc.frequency.setValueAtTime(
                        659,
                        now + 0.05
                    );

                    osc.frequency.setValueAtTime(
                        783,
                        now + 0.1
                    );

                    osc.frequency.setValueAtTime(
                        1046,
                        now + 0.15
                    );

                    gain.gain.setValueAtTime(
                        0.02,
                        now
                    );

                    gain.gain.linearRampToValueAtTime(
                        0,
                        now + 0.3
                    );

                    osc.start(now);
                    osc.stop(now + 0.3);

                } else if (type === 'over') {
                    osc.type = 'sawtooth';

                    osc.frequency.setValueAtTime(
                        180,
                        now
                    );

                    osc.frequency.linearRampToValueAtTime(
                        40,
                        now + 0.4
                    );

                    gain.gain.setValueAtTime(
                        0.08,
                        now
                    );

                    gain.gain.linearRampToValueAtTime(
                        0,
                        now + 0.4
                    );

                    osc.start(now);
                    osc.stop(now + 0.4);
                }

            } catch (e) {}
        }


        const canvas =
            document.getElementById(
                'puzzleCanvas'
            );

        const ctx =
            canvas.getContext('2d');

        const SIZE = 4;
        const CELL_SIZE = 80;


        let grid =
            Array.from(
                { length: SIZE },
                () => Array(SIZE).fill(0)
            );

        let score = 0;
        let maxTile = 2;
        let winTriggered = false;


        const COLORS = {
            0: "#151b22",
            2: "#343a40",
            4: "#495057",
            8: "#e8590c",
            16: "#f76707",
            32: "#ff922b",
            64: "#ffc078",
            128: "#fab005",
            256: "#fcc419",
            512: "#ffd43b",
            1024: "#74b816",
            2048: "#2b8a3e"
        };


        function addRandomTile() {
            let emptyCells = [];

            for (
                let r = 0;
                r < SIZE;
                r++
            ) {
                for (
                    let c = 0;
                    c < SIZE;
                    c++
                ) {
                    if (
                        grid[r][c] === 0
                    ) {
                        emptyCells.push({
                            r,
                            c
                        });
                    }
                }
            }

            if (emptyCells.length > 0) {
                let cell =
                    emptyCells[
                        Math.floor(
                            Math.random() *
                            emptyCells.length
                        )
                    ];

                grid[cell.r][cell.c] =
                    Math.random() < 0.9
                        ? 2
                        : 4;
            }
        }


        function draw() {
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            for (
                let r = 0;
                r < SIZE;
                r++
            ) {
                for (
                    let c = 0;
                    c < SIZE;
                    c++
                ) {
                    let val = grid[r][c];

                    ctx.fillStyle =
                        COLORS[val] ||
                        "#2b8a3e";

                    ctx.fillRect(
                        c * CELL_SIZE + 4,
                        r * CELL_SIZE + 4,
                        CELL_SIZE - 8,
                        CELL_SIZE - 8
                    );

                    if (val > 0) {
                        ctx.fillStyle = "#fff";

                        ctx.font =
                            "bold 20px sans-serif";

                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";

                        ctx.fillText(
                            val,
                            c * CELL_SIZE +
                                CELL_SIZE / 2,
                            r * CELL_SIZE +
                                CELL_SIZE / 2
                        );
                    }
                }
            }

            document.getElementById(
                'hud-panel'
            ).innerText =
                `🏆 Score: ${score} | ⭐ Max: ${maxTile}`;
        }


        function slide(row) {
            let arr =
                row.filter(
                    val => val
                );

            let missing =
                SIZE - arr.length;

            let zeros =
                Array(missing).fill(0);

            return arr.concat(zeros);
        }


        function combine(row) {
            for (
                let i = 0;
                i < SIZE - 1;
                i++
            ) {
                if (
                    row[i] !== 0 &&
                    row[i] === row[i + 1]
                ) {
                    row[i] *= 2;

                    score += row[i];

                    if (
                        row[i] > maxTile
                    ) {
                        maxTile =
                            row[i];
                    }

                    row[i + 1] = 0;

                    playSound('merge');
                }
            }

            return row;
        }


        function operate(row) {
            row = slide(row);
            row = combine(row);
            row = slide(row);

            return row;
        }


        function rotateGrid() {
            let nextGrid =
                Array.from(
                    {
                        length: SIZE
                    },
                    () =>
                        Array(
                            SIZE
                        ).fill(0)
                );

            for (
                let r = 0;
                r < SIZE;
                r++
            ) {
                for (
                    let c = 0;
                    c < SIZE;
                    c++
                ) {
                    nextGrid[c][
                        SIZE - 1 - r
                    ] =
                        grid[r][c];
                }
            }

            grid = nextGrid;
        }


        function move(dir) {
            let past =
                JSON.stringify(
                    grid
                );

            for (
                let i = 0;
                i < dir;
                i++
            ) {
                rotateGrid();
            }

            for (
                let r = 0;
                r < SIZE;
                r++
            ) {
                grid[r] =
                    operate(
                        grid[r]
                    );
            }

            for (
                let i = 0;
                i <
                (4 - dir) % 4;
                i++
            ) {
                rotateGrid();
            }

            if (
                past !==
                JSON.stringify(grid)
            ) {
                playSound('slide');

                addRandomTile();

                checkGameState();

                draw();
            }
        }


        function checkGameState() {
            if (
                maxTile === 2048 &&
                !winTriggered
            ) {
                winTriggered = true;

                playSound('win');

                alert(
                    "🎉 축하합니다! 전설의 2048 타일을 결합해 냈습니다!"
                );
            }


            for (
                let r = 0;
                r < SIZE;
                r++
            ) {
                for (
                    let c = 0;
                    c < SIZE;
                    c++
                ) {
                    if (
                        grid[r][c] === 0
                    ) {
                        return;
                    }

                    if (
                        r < SIZE - 1 &&
                        grid[r][c] ===
                            grid[r + 1][c]
                    ) {
                        return;
                    }

                    if (
                        c < SIZE - 1 &&
                        grid[r][c] ===
                            grid[r][c + 1]
                    ) {
                        return;
                    }
                }
            }

            playSound('over');

            alert(
                `💥 더 이상 결합할 타일이 없습니다!\n최종 점수: ${score}점`
            );

            restart();
        }


        document.addEventListener(
            'keydown',
            e => {
                if (
                    e.key === 'ArrowLeft' ||
                    e.key === 'a'
                ) {
                    move(0);
                }

                if (
                    e.key === 'ArrowDown' ||
                    e.key === 's'
                ) {
                    move(1);
                }

                if (
                    e.key === 'ArrowRight' ||
                    e.key === 'd'
                ) {
                    move(2);
                }

                if (
                    e.key === 'ArrowUp' ||
                    e.key === 'w'
                ) {
                    move(3);
                }
            }
        );


        function restart() {
            grid =
                Array.from(
                    { length: SIZE },
                    () =>
                        Array(
                            SIZE
                        ).fill(0)
                );

            score = 0;
            maxTile = 2;
            winTriggered = false;

            addRandomTile();
            addRandomTile();

            draw();
        }


        restart();
    </script>
    
<script>
(() => {
    'use strict';
    const sendKey = (type, key) => {
        document.dispatchEvent(new KeyboardEvent(type, {
            key,
            bubbles: true,
            cancelable: true
        }));
    };

    const activePresses = new Map();
    document.querySelectorAll('.touch-controls [data-key]').forEach((button) => {
        const key = button.dataset.key;
        const hold = button.hasAttribute('data-hold');
        const repeat = button.hasAttribute('data-repeat');
        let repeatTimer = null;
        let pressed = false;

        const stop = (event) => {
            if (!pressed) return;
            if (event) event.preventDefault();
            pressed = false;
            if (repeatTimer !== null) {
                clearInterval(repeatTimer);
                repeatTimer = null;
            }
            sendKey('keyup', key);
            activePresses.delete(button);
        };

        if (hold || repeat) {
            button.addEventListener('pointerdown', (event) => {
                if (pressed) return;
                event.preventDefault();
                pressed = true;
                activePresses.set(button, stop);
                sendKey('keydown', key);
                if (repeat) {
                    repeatTimer = setInterval(() => sendKey('keydown', key), 105);
                }
                try { button.setPointerCapture(event.pointerId); } catch (_) {}
            });
            ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((name) => {
                button.addEventListener(name, stop);
            });
        } else {
            button.addEventListener('click', (event) => {
                event.preventDefault();
                sendKey('keydown', key);
                sendKey('keyup', key);
            });
        }
        button.addEventListener('contextmenu', (event) => event.preventDefault());
    });

    window.addEventListener('pointerup', () => {
        for (const stop of [...activePresses.values()]) stop();
    });
    window.addEventListener('blur', () => {
        for (const stop of [...activePresses.values()]) stop();
    });
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            for (const stop of [...activePresses.values()]) stop();
        }
    });

    window.addEventListener('keydown', (event) => {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(event.key)) {
            const target = event.target;
            const isInput = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT');
            if (!isInput) event.preventDefault();
        }
    }, { passive: false });

    const canvas = document.querySelector('canvas');
    if (canvas && canvas.dataset.swipeKeys === 'true') {
        let startX = 0;
        let startY = 0;
        let pointerId = null;
        canvas.addEventListener('pointerdown', (event) => {
            if (event.pointerType === 'mouse' && event.button !== 0) return;
            startX = event.clientX;
            startY = event.clientY;
            pointerId = event.pointerId;
            try { canvas.setPointerCapture(pointerId); } catch (_) {}
        });
        canvas.addEventListener('pointerup', (event) => {
            if (pointerId !== event.pointerId) return;
            const dx = event.clientX - startX;
            const dy = event.clientY - startY;
            const threshold = Math.max(18, canvas.getBoundingClientRect().width * 0.045);
            pointerId = null;
            if (Math.max(Math.abs(dx), Math.abs(dy)) < threshold) return;
            const key = Math.abs(dx) > Math.abs(dy)
                ? (dx < 0 ? 'ArrowLeft' : 'ArrowRight')
                : (dy < 0 ? 'ArrowUp' : 'ArrowDown');
            sendKey('keydown', key);
            sendKey('keyup', key);
        });
        canvas.addEventListener('pointercancel', () => { pointerId = null; });
    }
})();
</script>

</body>
</html>
