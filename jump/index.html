<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>미니지 - 점프맵</title>
    <style>
        :root { --bg: #f8f9fa; --text: #333; --canvas-bg: #fff; --border: #e9ecef; --btn-bg: #fff; }
        [data-theme="beige"] { --bg: #f5ebe0; --text: #4e3d30; --canvas-bg: #eddfd0; --border: #ddcbbb; --btn-bg: #eddfd0; }
        [data-theme="dark"] { --bg: #0d1117; --text: #c9d1d9; --canvas-bg: #161b22; --border: #30363d; --btn-bg: #21262d; }
        body { text-align: center; background-color: var(--bg); color: var(--text); font-family: sans-serif; padding-top: 20px; margin:0; transition: 0.3s; }
        canvas { background-color: var(--canvas-bg); display: block; margin: 15px auto; border: 4px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
        button { background-color: var(--btn-bg); color: var(--text); border: 1px solid var(--border); padding: 10px 20px; font-size: 1rem; border-radius: 8px; cursor: pointer; margin:5px; }
        #info { font-size: 1.3rem; font-weight: bold; color: #ff6b6b; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: var(--canvas-bg); padding: 30px; border-radius: 16px; border: 2px solid var(--border); text-align: center; }
    </style>
</head>
<body>
    <h1>🏃 모험가 점프맵</h1>
    <div id="info">STAGE: 1 / 10</div>
    <canvas id="gameCanvas" width="600" height="360"></canvas>
    <button onclick="location.href='../'">🏠 메인으로 가기</button>
    <div class="modal" id="winModal">
        <div class="modal-content">
            <h2 style="color:#51cf66; margin-top:0;">🎉 ALL CLEAR!</h2>
            <p style="font-size:1.2rem; font-weight:bold;">10개의 모든 스테이지를 정복했습니다!</p>
            <button onclick="location.href='../'">🏠 메인 메뉴로</button>
        </div>
    </div>
    <script>
        const savedTheme = localStorage.getItem('minig-theme'); if (savedTheme && savedTheme !== 'white') document.documentElement.setAttribute('data-theme', savedTheme);
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime;
                if (type === 'jump') { osc.type = 'triangle'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(600, now + 0.1); gain.gain.setValueAtTime(0.06, now); gain.gain.linearRampToValueAtTime(0, now + 0.1); osc.start(now); osc.stop(now + 0.1); }
                else if (type === 'next') { osc.type = 'square'; osc.frequency.setValueAtTime(523, now); osc.frequency.setValueAtTime(659, now + 0.06); osc.frequency.setValueAtTime(783, now + 0.12); gain.gain.setValueAtTime(0.04, now); gain.gain.linearRampToValueAtTime(0, now + 0.2); osc.start(now); osc.stop(now + 0.2); }
                else if (type === 'fall') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(80, now + 0.2); gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0, now + 0.2); osc.start(now); osc.stop(now + 0.2); }
            } catch(e){}
        }
        const canvas = document.getElementById("gameCanvas"); const ctx = canvas.getContext("2d");
        let stage = 1; let keys = {};
        let player = { x: 30, y: 300, w: 20, h: 25, vx: 0, vy: 0, grounded: false, speed: 4, jumpForce: -10, gravity: 0.5 };
        let goal = { x: 550, y: 300, w: 20, h: 30 };
        let platforms = [];
        const maps = {
            1: [{x:0,y:330,w:600,h:30},{x:150,y:260,w:80,h:15},{x:300,y:200,w:80,h:15},{x:450,y:250,w:80,h:15}],
            2: [{x:0,y:330,w:150,h:30},{x:450,y:330,w:150,h:30},{x:200,y:250,w:80,h:15},{x:330,y:190,w:80,h:15}],
            3: [{x:0,y:330,w:80,h:30},{x:140,y:280,w:60,h:15},{x:260,y:230,w:60,h:15},{x:380,y:180,w:60,h:15},{x:500,y:260,w:100,h:70}],
            4: [{x:0,y:330,w:600,h:30},{x:100,y:250,w:50,h:100},{x:250,y:180,w:60,h:15},{x:400,y:120,w:60,h:15},{x:520,y:220,w:40,h:15}],
            5: [{x:0,y:330,w:100,h:30},{x:500,y:330,w:100,h:30},{x:140,y:260,w:50,h:15},{x:240,y:200,w:50,h:15},{x:340,y:230,w:50,h:15},{x:420,y:160,w:50,h:15}],
            6: [{x:0,y:150,w:80,h:15},{x:120,y:200,w:60,h:15},{x:220,y:250,w:60,h:15},{x:320,y:210,w:60,h:15},{x:440,y:160,w:60,h:15},{x:530,y:280,w:70,h:80}],
            7: [{x:0,y:330,w:120,h:30},{x:180,y:300,w:40,h:15},{x:280,y:260,w:40,h:15},{x:380,y:220,w:40,h:15},{x:480,y:180,w:40,h:15},{x:550,y:140,w:50,h:220}],
            8: [{x:0,y:330,w:60,h:30},{x:100,y:260,w:40,h:15},{x:200,y:210,w:40,h:15},{x:120,y:130,w:40,h:15},{x:250,y:100,w:80,h:15},{x:400,y:150,w:40,h:15},{x:500,y:220,w:100,h:120}],
            9: [{x:0,y:330,w:100,h:30},{x:520,y:330,w:80,h:30},{x:130,y:250,w:30,h:15},{x:220,y:260,w:30,h:15},{x:310,y:190,w:30,h:15},{x:400,y:230,w:30,h:15}],
            10:[{x:0,y:330,w:60,h:30},{x:80,y:270,w:30,h:15},{x:160,y:220,w:30,h:15},{x:240,y:170,w:30,h:15},{x:320,y:130,w:30,h:15},{x:410,y:180,w:30,h:15},{x:490,y:240,w:30,h:15},{x:550,y:300,w:50,h:30}]
        };
        document.addEventListener("keydown", e => keys[e.key] = true); document.addEventListener("keyup", e => keys[e.key] = false);
        function loadStage() {
            document.getElementById("info").innerText = `STAGE: ${stage} / 10`;
            player.x = 20; player.y = stage===6 ? 100 : 250; player.vx = 0; player.vy = 0; player.grounded = false;
            platforms = maps[stage]; let last = platforms[platforms.length-1];
            goal.x = last.x + last.w - 30; goal.y = last.y - goal.h;
        }
        function update() {
            if(keys["ArrowLeft"]) player.vx = -player.speed; else if(keys["ArrowRight"]) player.vx = player.speed; else player.vx = 0;
            if((keys[" "] || keys["ArrowUp"]) && player.grounded) { player.vy = player.jumpForce; player.grounded = false; playSound('jump'); }
            player.vy += player.gravity; player.x += player.vx; player.y += player.vy; player.grounded = false;
            if(player.y > canvas.height) { playSound('fall'); loadStage(); return; }
            platforms.forEach(p => {
                if(player.x < p.x+p.w && player.x+player.w > p.x && player.y < p.y+p.h && player.y+player.h > p.y) {
                    if(player.vy > 0 && player.y + player.h - player.vy <= p.y + 4) { player.y = p.y - player.h; player.vy = 0; player.grounded = true; }
                }
            });
            if(player.x < goal.x+goal.w && player.x+player.w > goal.x && player.y < goal.y+goal.h && player.y+player.h > goal.y) {
                if(stage < 10) { stage++; playSound('next'); loadStage(); } else { document.getElementById("winModal").style.display = "flex"; }
            }
        }
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "#ff6b6b"; ctx.fillRect(player.x, player.y, player.w, player.h);
            ctx.fillStyle = "#4dadf7"; platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
            ctx.fillStyle = "#fcc419"; ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
            ctx.fillStyle = "#333"; ctx.font = "14px sans-serif"; ctx.fillText("🏁", goal.x, goal.y-5);
        }
        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        loadStage(); gameLoop();
    </script>
</body>
</html>
