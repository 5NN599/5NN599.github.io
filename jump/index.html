<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니지 - 점프맵</title>
    <style>
        :root { --bg: #f8f9fa; --text: #333; --canvas-bg: #fff; --border: #e9ecef; --btn-bg: #fff; }
        [data-theme="beige"] { --bg: #f5ebe0; --text: #4e3d30; --canvas-bg: #eddfd0; --border: #ddcbbb; --btn-bg: #eddfd0; }
        [data-theme="dark"] { --bg: #0d1117; --text: #c9d1d9; --canvas-bg: #161b22; --border: #30363d; --btn-bg: #21262d; }
        body { text-align: center; background-color: var(--bg); color: var(--text); font-family: sans-serif; padding-top: 20px; margin:0; transition: 0.3s; }
        canvas { background-color: var(--canvas-bg); display: block; margin: 15px auto; border: 4px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
        button { background-color: var(--btn-bg); color: var(--text); border: 1px solid var(--border); padding: 10px 20px; font-size: 1rem; border-radius: 8px; cursor: pointer; margin:5px; }
        #info { font-size: 1.3rem; font-weight: bold; color: #ff6b6b; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 10; }
        .modal-content { background: var(--canvas-bg); padding: 30px; border-radius: 16px; border: 2px solid var(--border); text-align: center; }
    </style>
</head>
<body>
    <h1>🏃 50층 대모험 점프맵</h1>
    <div id="info">STAGE: 1 / 50</div>
    <canvas id="gameCanvas" width="600" height="360"></canvas>
    <button onclick="location.href='../'">🏠 메인으로 가기</button>
    <div class="modal" id="winModal">
        <div class="modal-content">
            <h2 style="color:#51cf66; margin-top:0;">👑 점프마스터 등극!</h2>
            <p style="font-size:1.2rem; font-weight:bold;">인내의 50개 스테이지를 모두 돌파했습니다!</p>
            <button onclick="location.href='../'">🏠 메인 메뉴로</button>
        </div>
    </div>
    <script>
        const savedTheme = localStorage.getItem('minig-theme'); if (savedTheme && savedTheme !== 'white') document.documentElement.setAttribute('data-theme', savedTheme);
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime;
                if (type === 'jump') { osc.type = 'triangle'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(600, now + 0.1); gain.gain.setValueAtTime(0.06, now); gain.gain.linearRampToValueAtTime(0, now + 0.1); osc.start(now); osc.stop(now + 0.1); }
                else if (type === 'next') { osc.type = 'square'; osc.frequency.setValueAtTime(523, now); osc.frequency.setValueAtTime(659, now + 0.06); osc.frequency.setValueAtTime(783, now + 0.12); gain.gain.setValueAtTime(0.04, now); gain.gain.linearRampToValueAtTime(0, now + 0.2); osc.start(now); osc.stop(now + 0.2); }
                else if (type === 'fall') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(250, now); osc.frequency.linearRampToValueAtTime(70, now + 0.2); gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0, now + 0.2); osc.start(now); osc.stop(now + 0.2); }
                else if (type === 'portal') { osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15); gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0, now + 0.15); osc.start(now); osc.stop(now + 0.15); }
            } catch(e){}
        }
        const canvas = document.getElementById("gameCanvas"); const ctx = canvas.getContext("2d");
        let stage = 1; let keys = {};
        let player = { x: 30, y: 250, w: 26, h: 26, vx: 0, vy: 0, grounded: false, speed: 4.5, jumpForce: -10.5, gravity: 0.5 };
        let goal = { x: 540, y: 300, w: 32, h: 32 };
        let platforms = [], spikes = [], portals = [];
        document.addEventListener("keydown", e => keys[e.key] = true); document.addEventListener("keyup", e => keys[e.key] = false);

        const fixedMaps = {
            1: { p: [{x:0,y:310,w:120},{x:170,y:260,w:60},{x:280,y:210,w:100},{x:430,y:260,w:60},{x:520,y:310,w:80}], s: [], pt: [] },
            2: { p: [{x:0,y:310,w:80},{x:140,y:310,w:60},{x:260,y:260,w:60},{x:380,y:210,w:60},{x:490,y:260,w:110}], s: [], pt: [] },
            3: { p: [{x:0,y:310,w:100},{x:160,y:240,w:60},{x:280,y:240,w:60},{x:400,y:240,w:60},{x:510,y:310,w:90}], s: [], pt: [] },
            4: { p: [{x:0,y:310,w:80},{x:140,y:270,w:60},{x:250,y:220,w:60},{x:370,y:170,w:60},{x:480,y:220,w:60},{x:560,y:280,w:40}], s: [], pt: [] },
            5: { p: [{x:0,y:310,w:120},{x:180,y:250,w:110},{x:340,y:190,w:60},{x:460,y:250,w:140}], s: [{x:220,y:230}], pt: [] },
            6: { p: [{x:0,y:310,w:80},{x:140,y:260,w:60},{x:260,y:260,w:110},{x:430,y:260,w:170}], s: [{x:300,y:240}], pt: [] },
            7: { p: [{x:0,y:310,w:100},{x:160,y:220,w:60},{x:270,y:220,w:110},{x:430,y:220,w:60},{x:520,y:310,w:80}], s: [{x:310,y:200}], pt: [] },
            8: { p: [{x:0,y:310,w:80},{x:140,y:260,w:100},{x:290,y:200,w:60},{x:390,y:260,w:100},{x:520,y:310,w:80}], s: [{x:180,y:240},{x:430,y:240}], pt: [] },
            9: { p: [{x:0,y:250,w:70},{x:120,y:290,w:70},{x:240,y:250,w:110},{x:400,y:210,w:70},{x:510,y:290,w:90}], s: [{x:280,y:230}], pt: [] },
            10: { p: [{x:0,y:310,w:100},{x:160,y:260,w:60},{x:270,y:200,w:110},{x:420,y:140,w:60},{x:510,y:230,w:90}], s: [{x:310,y:180}], pt: [] },
            11: { p: [{x:0,y:310,w:80},{x:140,y:260,w:60},{x:240,y:260,w:110},{x:390,y:260,w:110},{x:530,y:310,w:70}], s: [{x:280,y:240},{x:430,y:240}], pt: [] },
            12: { p: [{x:0,y:310,w:100},{x:180,y:250,w:60},{x:300,y:180,w:60},{x:420,y:250,w:60},{x:520,y:310,w:80}], s: [], pt: [{x:195,y:226,tx:430,ty:150}] },
            13: { p: [{x:0,y:310,w:70},{x:120,y:260,w:60},{x:230,y:210,w:110},{x:380,y:260,w:60},{x:480,y:310,w:120}], s: [{x:270,y:190}], pt: [{x:140,y:236,tx:490,ty:200}] },
            14: { p: [{x:0,y:310,w:90},{x:150,y:240,w:60},{x:250,y:180,w:110},{x:400,y:240,w:60},{x:500,y:310,w:100}], s: [{x:290,y:160}], pt: [] },
            15: { p: [{x:0,y:310,w:120},{x:180,y:250,w:110},{x:330,y:190,w:60},{x:430,y:250,w:110},{x:560,y:310,w:40}], s: [{x:220,y:230},{x:470,y:230}], pt: [] },
            16: { p: [{x:0,y:310,w:80},{x:140,y:250,w:60},{x:240,y:250,w:110},{x:390,y:250,w:110},{x:530,y:290,w:70}], s: [{x:280,y:230},{x:430,y:230}], pt: [] },
            17: { p: [{x:0,y:310,w:100},{x:160,y:250,w:60},{x:260,y:190,w:110},{x:410,y:130,w:60},{x:510,y:220,w:90}], s: [{x:300,y:170}], pt: [] },
            18: { p: [{x:0,y:310,w:70},{x:130,y:310,w:100},{x:270,y:250,w:60},{x:370,y:190,w:60},{x:470,y:250,w:130}], s: [{x:170,y:290}], pt: [] },
            19: { p: [{x:0,y:250,w:80},{x:140,y:210,w:60},{x:240,y:270,w:110},{x:390,y:210,w:60},{x:490,y:150,w:110}], s: [{x:280,y:250}], pt: [] },
            20: { p: [{x:0,y:310,w:100},{x:160,y:250,w:110},{x:310,y:190,w:60},{x:410,y:250,w:110},{x:540,y:310,w:60}], s: [{x:200,y:230},{x:450,y:230}], pt: [] },
            21: { p: [{x:0,y:310,w:60},{x:110,y:250,w:60},{x:210,y:190,w:110},{x:360,y:130,w:60},{x:460,y:210,w:60},{x:540,y:290,w:60}], s: [{x:250,y:170}], pt: [] },
            22: { p: [{x:0,y:310,w:100},{x:160,y:260,w:60},{x:260,y:210,w:60},{x:360,y:260,w:60},{x:460,y:310,w:140}], s: [], pt: [{x:175,y:236,tx:470,ty:200}] },
            23: { p: [{x:0,y:310,w:80},{x:140,y:240,w:100},{x:280,y:180,w:60},{x:380,y:240,w:100},{x:510,y:310,w:90}], s: [{x:180,y:220},{x:430,y:220}], pt: [] },
            24: { p: [{x:0,y:310,w:120},{x:180,y:250,w:60},{x:280,y:190,w:110},{x:430,y:250,w:60},{x:520,y:310,w:80}], s: [{x:320,y:170}], pt: [] },
            25: { p: [{x:0,y:310,w:70},{x:120,y:250,w:60},{x:220,y:190,w:110},{x:370,y:250,w:110},{x:510,y:290,w:90}], s: [{x:260,y:170},{x:410,y:230}], pt: [] },
            26: { p: [{x:0,y:310,w:100},{x:150,y:240,w:60},{x:250,y:240,w:110},{x:400,y:240,w:60},{x:500,y:310,w:100}], s: [{x:290,y:220}], pt: [] },
            27: { p: [{x:0,y:310,w:80},{x:130,y:250,w:60},{x:230,y:190,w:110},{x:380,y:130,w:60},{x:480,y:210,w:60},{x:560,y:290,w:40}], s: [{x:270,y:170}], pt: [] },
            28: { p: [{x:0,y:310,w:110},{x:170,y:260,w:110},{x:320,y:200,w:60},{x:420,y:260,w:110},{x:550,y:310,w:50}], s: [{x:210,y:240},{x:460,y:240}], pt: [] },
            29: { p: [{x:0,y:250,w:70},{x:120,y:210,w:60},{x:220,y:270,w:110},{x:370,y:210,w:60},{x:470,y:150,w:60},{x:550,y:250,w:50}], s: [{x:260,y:250}], pt: [] },
            30: { p: [{x:0,y:310,w:90},{x:150,y:250,w:60},{x:250,y:190,w:110},{x:400,y:250,w:60},{x:500,y:310,w:100}], s: [{x:290,y:170}], pt: [] },
            31: { p: [{x:0,y:310,w:70},{x:130,y:250,w:60},{x:230,y:190,w:110},{x:380,y:250,w:60},{x:480,y:310,w:120}], s: [{x:270,y:170}], pt: [] },
            32: { p: [{x:0,y:310,w:100},{x:160,y:240,w:65},{x:260,y:180,w:115},{x:410,y:240,w:65},{x:510,y:310,w:90}], s: [{x:300,y:160}], pt: [] },
            33: { p: [{x:0,y:310,w:80},{x:140,y:250,w:60},{x:240,y:190,w:110},{x:390,y:130,w:60},{x:480,y:210,w:60},{x:550,y:290,w:50}], s: [{x:280,y:170},{x:410,y:110}], pt: [] },
            34: { p: [{x:0,y:310,w:120},{x:180,y:260,w:110},{x:330,y:200,w:60},{x:430,y:260,w:110},{x:560,y:310,w:40}], s: [{x:220,y:240},{x:470,y:240}], pt: [] },
            35: { p: [{x:0,y:250,w:70},{x:130,y:210,w:60},{x:230,y:270,w:110},{x:380,y:210,w:60},{x:480,y:150,w:60},{x:550,y:250,w:50}], s: [{x:270,y:250}], pt: [] },
            36: { p: [{x:0,y:310,w:90},{x:150,y:250,w:60},{x:250,y:190,w:110},{x:400,y:250,w:60},{x:500,y:310,w:100}], s: [{x:290,y:170}], pt: [] },
            37: { p: [{x:0,y:310,w:70},{x:130,y:250,w:60},{x:230,y:190,w:110},{x:380,y:250,w:60},{x:480,y:310,w:120}], s: [{x:270,y:170}], pt: [] },
            38: { p: [{x:0,y:310,w:100},{x:160,y:240,w:65},{x:260,y:180,w:115},{x:410,y:240,w:65},{x:510,y:310,w:90}], s: [{x:300,y:160}], pt: [] },
            39: { p: [{x:0,y:310,w:80},{x:140,y:250,w:60},{x:240,y:190,w:110},{x:390,y:130,w:60},{x:480,y:210,w:60},{x:550,y:290,w:50}], s: [{x:280,y:170}], pt: [] },
            40: { p: [{x:0,y:310,w:120},{x:180,y:260,w:110},{x:330,y:200,w:60},{x:430,y:260,w:110},{x:560,y:310,w:40}], s: [{x:220,y:240},{x:470,y:240}], pt: [] },
            41: { p: [{x:0,y:250,w:70},{x:130,y:210,w:60},{x:230,y:270,w:110},{x:380,y:210,w:60},{x:480,y:150,w:60},{x:550,y:250,w:50}], s: [{x:270,y:250}], pt: [] },
            42: { p: [{x:0,y:310,w:90},{x:150,y:250,w:60},{x:250,y:190,w:110},{x:400,y:250,w:60},{x:500,y:310,w:100}], s: [{x:290,y:170}], pt: [] },
            43: { p: [{x:0,y:310,w:70},{x:130,y:250,w:60},{x:230,y:190,w:110},{x:380,y:250,w:60},{x:480,y:310,w:120}], s: [{x:270,y:170}], pt: [] },
            44: { p: [{x:0,y:310,w:100},{x:160,y:240,w:65},{x:260,y:180,w:115},{x:410,y:240,w:65},{x:510,y:310,w:90}], s: [{x:300,y:160}], pt: [] },
            45: { p: [{x:0,y:310,w:80},{x:140,y:250,w:60},{x:240,y:190,w:110},{x:390,y:130,w:60},{x:480,y:210,w:60},{x:550,y:290,w:50}], s: [{x:280,y:170}], pt: [] },
            46: { p: [{x:0,y:310,w:120},{x:180,y:260,w:110},{x:330,y:200,w:60},{x:430,y:260,w:110},{x:560,y:310,w:40}], s: [{x:220,y:240},{x:470,y:240}], pt: [] },
            47: { p: [{x:0,y:250,w:70},{x:130,y:210,w:60},{x:230,y:270,w:110},{x:380,y:210,w:60},{x:480,y:150,w:60},{x:550,y:250,w:50}], s: [{x:270,y:250}], pt: [] },
            48: { p: [{x:0,y:310,w:90},{x:150,y:250,w:60},{x:250,y:190,w:110},{x:400,y:250,w:60},{x:500,y:310,w:100}], s: [{x:290,y:170}], pt: [] },
            49: { p: [{x:0,y:310,w:70},{x:130,y:250,w:60},{x:230,y:190,w:110},{x:380,y:250,w:60},{x:480,y:310,w:120}], s: [{x:270,y:170}], pt: [] },
            50: { p: [{x:0,y:310,w:60},{x:120,y:260,w:40},{x:210,y:210,w:40},{x:300,y:160,w:40},{x:390,y:120,w:40},{x:470,y:180,w:40},{x:540,y:240,w:30},{x:580,y:300,w:20}], s: [{x:220,y:190},{x:400,y:100}], pt: [] }
        };

        function loadStage() {
            document.getElementById("info").innerText = `STAGE: ${stage} / 50`;
            let map = fixedMaps[stage];
            player.x = 25; player.y = 200; player.vx = 0; player.vy = 0; player.grounded = false;
            platforms = map.p.map(plat => ({x: plat.x, y: plat.y, w: plat.w, h: 200}));
            spikes = map.s.map(spk => ({x: spk.x, y: spk.y, w: 20, h: 20}));
            portals = map.pt.map(ptl => ({x: ptl.x, y: ptl.y, w: 24, h: 24, tx: ptl.tx, ty: ptl.ty}));
            let last = platforms[platforms.length-1];
            goal.x = last.x + last.w - 35; goal.y = last.y - goal.h;
        }
        function update() {
            if(keys["ArrowLeft"] || keys["a"]) player.vx = -player.speed; else if(keys["ArrowRight"] || keys["d"]) player.vx = player.speed; else player.vx = 0;
            if((keys[" "] || keys["ArrowUp"] || keys["w"]) && player.grounded) { player.vy = player.jumpForce; player.grounded = false; playSound('jump'); }
            player.vy += player.gravity; player.x += player.vx; player.y += player.vy; player.grounded = false;
            if(player.y > canvas.height) { playSound('fall'); loadStage(); return; }
            platforms.forEach(p => {
                if(player.x < p.x+p.w && player.x+player.w > p.x && player.y < p.y+p.h && player.y+player.h > p.y) {
                    if(player.vy > 0 && player.y + player.h - player.vy <= p.y + 5) { player.y = p.y - player.h; player.vy = 0; player.grounded = true; }
                }
            });
            spikes.forEach(s => {
                if(player.x < s.x+s.w-2 && player.x+player.w > s.x+2 && player.y < s.y+s.h && player.y+player.h > s.y) { playSound('fall'); loadStage(); }
            });
            portals.forEach(pt => {
                if(player.x < pt.x+pt.w && player.x+player.w > pt.x && player.y < pt.y+pt.h && player.y+player.h > pt.y) {
                    playSound('portal'); player.x = pt.tx; player.y = pt.ty; player.vy = -3;
                }
            });
            if(player.x < goal.x+goal.w && player.x+player.w > goal.x && player.y < goal.y+goal.h && player.y+player.h > goal.y) {
                if(stage < 50) { stage++; playSound('next'); loadStage(); } else { document.getElementById("winModal").style.display = "flex"; }
            }
        }
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height); ctx.font = "26px sans-serif";
            platforms.forEach(p => { for(let i=0; i<p.w; i+=24) { ctx.fillText("🧱", p.x + i, p.y + 22); } });
            spikes.forEach(s => ctx.fillText("⚠️", s.x, s.y + 22));
            portals.forEach(pt => ctx.fillText("🌀", pt.x, pt.y + 22));
            ctx.fillText("🎁", goal.x, goal.y + 28); ctx.fillText("🏃", player.x, player.y + 24);
        }
        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        loadStage(); gameLoop();
    </script>
</body>
</html>
