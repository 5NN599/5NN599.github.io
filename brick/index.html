<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니지 - 벽돌깨기</title>
    <style>
        :root { --bg: #f8f9fa; --text: #333; --canvas-bg: #fff; --border: #e9ecef; --btn-bg: #fff; }
        [data-theme="beige"] { --bg: #f5ebe0; --text: #4e3d30; --canvas-bg: #eddfd0; --border: #ddcbbb; --btn-bg: #eddfd0; }
        [data-theme="dark"] { --bg: #0d1117; --text: #c9d1d9; --canvas-bg: #161b22; --border: #30363d; --btn-bg: #21262d; }
        body { text-align: center; background-color: var(--bg); color: var(--text); font-family: 'Malgun Gothic', sans-serif; padding-top: 20px; margin:0; transition: 0.3s; }
        canvas { background-color: var(--canvas-bg); display: block; margin: 15px auto; border: 4px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
        button { background-color: var(--btn-bg); color: var(--text); border: 1px solid var(--border); padding: 10px 20px; font-size: 1rem; border-radius: 8px; cursor: pointer; margin:5px; }
        #status-board { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 10; }
        .modal-content { background: var(--canvas-bg); padding: 30px; border-radius: 16px; border: 2px solid var(--border); text-align: center; }
    </style>
</head>
<body>
    <h1>🧱 벽돌깨기 (아이템 모드)</h1>
    <div id="status-board">❤️ 목숨: 3 | 🏆 점수: 0</div>
    <canvas id="gameCanvas" width="480" height="340"></canvas>
    <button onclick="location.href='../'">🏠 메인으로 가기</button>

    <div class="modal" id="overModal">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-top:0;">💥 GAME OVER</h2>
            <p id="finalScore" style="font-size:1.1rem; font-weight:bold;"></p>
            <button onclick="restart()">🔄 다시 시작</button>
            <button onclick="location.href='../'">🏠 메인 메뉴</button>
        </div>
    </div>

    <!-- 분리한 핵심 기능 스크립트를 불러옵니다 -->
    <script src="./game.js"></script>
</body>
</html>
