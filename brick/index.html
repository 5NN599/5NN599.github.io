<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    

    <title>미니지 - 벽돌깨기</title>

    <meta
        name="description"
        content="미니지에서 즐기는 무료 벽돌깨기 게임.
        패들을 움직여 공을 튕겨내고 아이템을 획득하며
        모든 벽돌을 깨보세요."
    >

    <meta
        name="robots"
        content="index, follow, max-image-preview:large"
    >

    <meta
        name="googlebot"
        content="index, follow, max-image-preview:large"
    >

    <link
        rel="canonical"
        href="https://mini-g.kro.kr/brick/"
    >

    <link
        rel="icon"
        type="image/png"
        href="../favicon.png"
    >

    <!-- 공통 테마 -->
    <link
        rel="stylesheet"
        href="/theme.css"
    >

    <!-- Open Graph -->
    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:site_name"
        content="미니지"
    >

    <meta
        property="og:title"
        content="미니지 - 벽돌깨기"
    >

    <meta
        property="og:description"
        content="패들을 움직여 공을 튕겨내고
        아이템을 획득하며 벽돌을 깨보세요."
    >

    <meta
        property="og:url"
        content="https://mini-g.kro.kr/brick/"
    >

    <meta
        property="og:image"
        content="https://mini-g.kro.kr/favicon.png"
    >

    <meta
        property="og:locale"
        content="ko_KR"
    >

    <style>
        :root {
            --canvas-bg: #ffffff;
            --btn-bg: var(--card-bg);
        }

        [data-theme="cream"] {
            --canvas-bg: #fffaf2;
        }

        [data-theme="dark"] {
            --canvas-bg: #161b22;
        }

        body {
            text-align: center;

            background-color:
                var(--bg-color);

            color:
                var(--text-color);

            font-family:
                'Malgun Gothic',
                'Apple SD Gothic Neo',
                sans-serif;

            padding-top: 20px;
            margin: 0;

            transition:
                background-color 0.3s ease,
                color 0.3s ease;
        }

        h1 {
            color: var(--title-color);
        }

        .game-description {
            max-width: 720px;
            margin: 0 auto 12px;
            padding: 0 15px;

            color: var(--sub-color);

            font-size: 0.95rem;
            line-height: 1.7;
        }

        .game-controls {
            color: var(--sub-color);
            font-size: 0.88rem;
            margin-bottom: 10px;
        }

        canvas {
            background-color:
                var(--canvas-bg);

            display: block;
            margin: 15px auto;

            border:
                4px solid var(--card-border);

            border-radius: 12px;

            box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.05);
        }

        button {
            background-color:
                var(--btn-bg);

            color:
                var(--text-color);

            border:
                1px solid var(--card-border);

            padding: 10px 20px;

            font-size: 1rem;
            border-radius: 8px;

            cursor: pointer;
            margin: 5px;

            transition:
                border-color 0.2s ease,
                background-color 0.2s ease;
        }

        button:hover {
            border-color:
                var(--accent-color);
        }

        #status-board {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;

            color:
                var(--title-color);
        }

        .modal {
            display: none;

            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(0, 0, 0, 0.5);

            justify-content: center;
            align-items: center;

            z-index: 10;
        }

        .modal-content {
            background:
                var(--canvas-bg);

            padding: 30px;

            border-radius: 16px;

            border:
                2px solid var(--card-border);

            text-align: center;

            color:
                var(--text-color);

            max-width: 90%;
        }

        .modal-content h2 {
            color:
                var(--title-color);
        }

        .modal-content p {
            color:
                var(--sub-color);
        }

        @media (max-width: 600px) {
            body {
                padding-top: 15px;
            }

            h1 {
                font-size: 1.7rem;
                padding: 0 10px;
            }

            #status-board {
                font-size: 1rem;
            }

            canvas {
                width: min(
                    480px,
                    calc(100vw - 24px)
                );

                height: auto;
            }
        }


        /* Mobile / touch support */
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body {
            min-width: 0;
            padding-left: max(8px, env(safe-area-inset-left));
            padding-right: max(8px, env(safe-area-inset-right));
            padding-bottom: max(18px, env(safe-area-inset-bottom));
            overflow-x: hidden;
        }
        h1 {
            max-width: 100%;
            padding-left: 8px;
            padding-right: 8px;
            font-size: clamp(1.35rem, 5.5vw, 2rem);
            line-height: 1.25;
            overflow-wrap: anywhere;
        }
        canvas {
            max-width: calc(100vw - 24px);
            height: auto;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        button, select {
            min-height: 44px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .touch-controls {
            display: none;
            width: min(420px, calc(100vw - 24px));
            margin: 12px auto 16px;
            gap: 8px;
            -webkit-user-select: none;
            user-select: none;
        }
        .touch-controls button {
            min-width: 0;
            min-height: 54px;
            margin: 0;
            padding: 10px 8px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .touch-help {
            display: none;
            max-width: 420px;
            margin: 0 auto 10px;
            padding: 0 8px;
            font-size: .82rem;
            line-height: 1.5;
            opacity: .72;
        }
        .pad-space { display: block; }
        .pad-center { display: grid; place-items: center; opacity: .35; font-size: .8rem; }

        @media (max-width: 700px), (pointer: coarse) {
            body { padding-top: max(10px, env(safe-area-inset-top)); }
            .touch-controls { display: grid; }
            .touch-help { display: block; }
            .modal-content {
                width: min(92vw, 420px);
                max-width: 92vw;
                padding: 22px 18px;
            }
            button { font-size: 1rem; }
        }

    </style>
</head>

<body>

    <main>

        <h1>🧱 벽돌깨기 (아이템 모드)</h1>

        <p class="game-description">
            패들을 움직여 공을 튕겨내고 벽돌을 파괴하세요.
            다양한 아이템을 획득하면서 모든 벽돌을 깨고
            높은 점수에 도전할 수 있습니다.
        </p>

        <p class="game-controls">
            방향키·마우스 또는 화면 드래그로 패들을 움직여보세요.
        </p>

        <div id="status-board">
            ❤️ 목숨: 3 | 🏆 점수: 0
        </div>

        <canvas
            id="gameCanvas"
            width="480"
            height="340"
            aria-label="벽돌깨기 게임 화면"
        ></canvas>

        <div class="touch-controls" aria-label="패들 좌우 이동">
            <button type="button" data-key="ArrowLeft" data-hold aria-label="왼쪽으로 이동">◀ 왼쪽</button>
            <button type="button" data-key="ArrowRight" data-hold aria-label="오른쪽으로 이동">오른쪽 ▶</button>
        </div>
        <p class="touch-help">화면을 누른 채 좌우로 드래그하거나 아래 버튼을 길게 눌러 패들을 움직이세요.</p>

        <button
            onclick="location.href='../'"
        >
            🏠 메인으로 가기
        </button>

    </main>

    <div
        class="modal"
        id="overModal"
    >
        <div class="modal-content">

            <h2
                id="modalTitle"
                style="margin-top:0;"
            >
                💥 GAME OVER
            </h2>

            <p
                id="finalScore"
                style="
                    font-size:1.1rem;
                    font-weight:bold;
                "
            ></p>

            <button
                onclick="restart()"
            >
                🔄 다시 시작
            </button>

            <button
                onclick="location.href='../'"
            >
                🏠 메인 메뉴
            </button>

        </div>
    </div>

    <!--
        메인에서 선택한 테마 유지
        예전 beige 값은 cream으로 변환
    -->
    <script>
        (function () {
            let savedTheme =
                localStorage.getItem(
                    "minig-theme"
                );

            if (savedTheme === "beige") {
                savedTheme = "cream";

                localStorage.setItem(
                    "minig-theme",
                    "cream"
                );
            }

            if (
                savedTheme &&
                savedTheme !== "white"
            ) {
                document.documentElement
                    .setAttribute(
                        "data-theme",
                        savedTheme
                    );
            }
        })();
    </script>

    <!-- 기존 게임 로직 그대로 유지 -->
    <script src="./game.js"></script>
    <script>
    (() => {
        const canvas = document.getElementById('gameCanvas');
        if (!canvas) return;
        // Mobile pointer movement is forwarded as mouse movement for legacy game.js handlers.
        const forwardPointer = (event) => {
            const mouseEvent = new MouseEvent('mousemove', {
                bubbles: true,
                cancelable: true,
                view: window,
                clientX: event.clientX,
                clientY: event.clientY,
                screenX: event.screenX,
                screenY: event.screenY,
                buttons: event.buttons || (event.type === 'pointerup' ? 0 : 1)
            });
            canvas.dispatchEvent(mouseEvent);
        };
        canvas.addEventListener('pointerdown', (event) => {
            event.preventDefault();
            forwardPointer(event);
            try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
        });
        canvas.addEventListener('pointermove', (event) => {
            if (event.pointerType !== 'mouse' || event.buttons !== 0) {
                event.preventDefault();
                forwardPointer(event);
            }
        });
        canvas.addEventListener('pointerup', forwardPointer);
        canvas.addEventListener('contextmenu', (event) => event.preventDefault());
    })();
    </script>
</body>
</html>
