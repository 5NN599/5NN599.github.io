<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>미니지 - 레트로 테트리스</title>

    <meta
        name="description"
        content="미니지에서 즐기는 무료 레트로 테트리스.
        블록을 회전하고 줄을 완성해 최고 점수에 도전해보세요."
    >

    <link rel="canonical"
        href="https://mini-g.kro.kr/tetris/">

    <link
        rel="icon"
        type="image/png"
        href="../favicon.png"
    >

    <!-- 공통 테마 -->
    <link
        rel="stylesheet"
        href="/theme.css"
    >

    <style>
        :root {
            --canvas-bg: #05070a;
            --btn-bg: var(--card-bg);
        }

        [data-theme="cream"] {
            --canvas-bg: #14100c;
        }

        [data-theme="dark"] {
            --canvas-bg: #020305;
        }

        body {
            background-color: var(--bg-color) !important;
            color: var(--text-color) !important;

            text-align: center;
            font-family: sans-serif;

            padding-top: 15px;
            margin: 0;

            transition:
                background-color 0.3s ease,
                color 0.3s ease;
        }

        h1 {
            color: var(--title-color);
        }

        canvas {
            background-color: var(--canvas-bg);

            display: block;
            margin: 10px auto;

            border: 4px solid var(--card-border);
            border-radius: 12px;

            box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.3);
        }

        button {
            background-color: var(--btn-bg) !important;
            color: var(--text-color) !important;

            border: 1px solid var(--card-border) !important;

            padding: 8px 16px;
            font-size: 0.95rem;

            border-radius: 8px;
            cursor: pointer;
            margin: 4px;

            font-weight: bold;

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease,
                color 0.2s ease;
        }

        button:hover {
            border-color: var(--accent-color) !important;
        }

        #score-board {
            font-size: 1.25rem;
            font-weight: bold;
            color: #fcc419;
            margin-bottom: 4px;
        }

        .game-info {
            color: var(--sub-color);
            font-size: 0.9rem;
            margin-top: 8px;
            line-height: 1.6;
        }


        /* Mobile / touch support */
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body {
            min-width: 0;
            padding-left: max(8px, env(safe-area-inset-left));
            padding-right: max(8px, env(safe-area-inset-right));
            padding-bottom: max(18px, env(safe-area-inset-bottom));
            overflow-x: hidden;
        }
        h1 {
            max-width: 100%;
            padding-left: 8px;
            padding-right: 8px;
            font-size: clamp(1.35rem, 5.5vw, 2rem);
            line-height: 1.25;
            overflow-wrap: anywhere;
        }
        canvas {
            max-width: calc(100vw - 24px);
            height: auto;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        button, select {
            min-height: 44px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .touch-controls {
            display: none;
            width: min(420px, calc(100vw - 24px));
            margin: 12px auto 16px;
            gap: 8px;
            -webkit-user-select: none;
            user-select: none;
        }
        .touch-controls button {
            min-width: 0;
            min-height: 54px;
            margin: 0;
            padding: 10px 8px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .touch-help {
            display: none;
            max-width: 420px;
            margin: 0 auto 10px;
            padding: 0 8px;
            font-size: .82rem;
            line-height: 1.5;
            opacity: .72;
        }
        .pad-space { display: block; }
        .pad-center { display: grid; place-items: center; opacity: .35; font-size: .8rem; }

        @media (max-width: 700px), (pointer: coarse) {
            body { padding-top: max(10px, env(safe-area-inset-top)); }
            .touch-controls { display: grid; }
            .touch-help { display: block; }
            .modal-content {
                width: min(92vw, 420px);
                max-width: 92vw;
                padding: 22px 18px;
            }
            button { font-size: 1rem; }
        }

        #tetrisCanvas { width: 240px; max-width: calc(100vw - 24px); height: auto; }
        .tetris-touch-controls { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .tetris-touch-controls button { min-height: 62px; font-size: 1.45rem; }
        @media (max-width: 700px), (pointer: coarse) {
            body { padding-top: max(10px, env(safe-area-inset-top)); }
            #score-board { font-size: clamp(1rem, 4.5vw, 1.25rem); }
            .game-info { max-width: 420px; margin-left: auto; margin-right: auto; padding: 0 8px; }
            #tetrisCanvas { width: min(360px, calc(100vw - 24px)); }
        }

    </style>
</head>

<body>

    <h1>🧱 레트로 테트리스</h1>

    <div id="score-board">
        🏆 Score: 0 | 🟥 Next: ?
    </div>

    <canvas
        id="tetrisCanvas"
        width="240"
        height="400"
        data-swipe-keys="true"
        aria-label="테트리스 게임 화면"
    ></canvas>

    <div>
        <button onclick="location.href='../'">
            🏠 오락실 메인
        </button>
    </div>

    <div class="game-info">
        방향키 또는 WASD로 블록을 움직이세요.<br>
        ↑ / W : 회전 · ↓ / S : 빠르게 내리기
    </div>

    <div class="touch-controls tetris-touch-controls" aria-label="테트리스 터치 조작">
        <button type="button" data-key="ArrowLeft" data-repeat aria-label="왼쪽 이동">◀</button>
        <button type="button" data-key="ArrowUp" aria-label="블록 회전">↻</button>
        <button type="button" data-key="ArrowDown" data-repeat aria-label="빠르게 내리기">▼</button>
        <button type="button" data-key="ArrowRight" data-repeat aria-label="오른쪽 이동">▶</button>
    </div>
    <p class="touch-help">좌우 이동·회전·빠른 낙하를 아래 버튼으로 조작하세요. 버튼을 길게 누르면 반복 이동합니다.</p>

    <script>
        /*
         * 공통 테마 적용
         *
         * index.html에서 선택한
         * white / cream / dark 설정을
         * 이 페이지에서도 그대로 사용합니다.
         *
         * 기존에 beige가 저장되어 있다면
         * 자동으로 cream으로 변환합니다.
         */
        (function () {
            let savedTheme =
                localStorage.getItem("minig-theme");

            if (savedTheme === "beige") {
                savedTheme = "cream";

                localStorage.setItem(
                    "minig-theme",
                    "cream"
                );
            }

            if (
                savedTheme &&
                savedTheme !== "white"
            ) {
                document.documentElement
                    .setAttribute(
                        "data-theme",
                        savedTheme
                    );
            }
        })();


        // 🎵 사운드 신디사이저 엔진
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();
            }
        }

        function playSound(type) {
            initAudio();

            try {
                const osc =
                    audioCtx.createOscillator();

                const gain =
                    audioCtx.createGain();

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now =
                    audioCtx.currentTime;

                if (type === 'move') {
                    osc.type = 'sine';

                    osc.frequency.setValueAtTime(
                        300,
                        now
                    );

                    gain.gain.setValueAtTime(
                        0.01,
                        now
                    );

                    gain.gain
                        .linearRampToValueAtTime(
                            0,
                            now + 0.03
                        );

                    osc.start(now);
                    osc.stop(now + 0.03);

                } else if (type === 'rotate') {
                    osc.type = 'triangle';

                    osc.frequency.setValueAtTime(
                        450,
                        now
                    );

                    osc.frequency
                        .exponentialRampToValueAtTime(
                            600,
                            now + 0.05
                        );

                    gain.gain.setValueAtTime(
                        0.015,
                        now
                    );

                    gain.gain
                        .linearRampToValueAtTime(
                            0,
                            now + 0.05
                        );

                    osc.start(now);
                    osc.stop(now + 0.05);

                } else if (type === 'clear') {
                    osc.type = 'square';

                    osc.frequency.setValueAtTime(
                        523,
                        now
                    );

                    osc.frequency.setValueAtTime(
                        659,
                        now + 0.06
                    );

                    osc.frequency.setValueAtTime(
                        783,
                        now + 0.12
                    );

                    gain.gain.setValueAtTime(
                        0.03,
                        now
                    );

                    gain.gain
                        .linearRampToValueAtTime(
                            0,
                            now + 0.2
                        );

                    osc.start(now);
                    osc.stop(now + 0.2);

                } else if (type === 'over') {
                    osc.type = 'sawtooth';

                    osc.frequency.setValueAtTime(
                        150,
                        now
                    );

                    osc.frequency
                        .linearRampToValueAtTime(
                            40,
                            now + 0.4
                        );

                    gain.gain.setValueAtTime(
                        0.1,
                        now
                    );

                    gain.gain
                        .linearRampToValueAtTime(
                            0,
                            now + 0.4
                        );

                    osc.start(now);
                    osc.stop(now + 0.4);
                }

            } catch (e) {}
        }


        const canvas =
            document.getElementById(
                'tetrisCanvas'
            );

        const ctx =
            canvas.getContext('2d');

        const ROW = 20;
        const COL = 12;
        const BLOCK_SIZE = 20;

        let board =
            Array.from(
                { length: ROW },
                () => Array(COL).fill(0)
            );

        let score = 0;
        let isGameOver = false;
        let dropCounter = 0;
        let lastTime = 0;
        let gameId = null;


        const SHAPES = [
            [],
            [[1,1,1,1]],
            [[0,2,0],[1,1,1]],
            [[3,0,0],[3,3,3]],
            [[0,0,4],[4,4,4]],
            [[5,5,0],[0,5,5]],
            [[0,6,6],[6,6,0]],
            [[7,7],[7,7]]
        ];


        const EMOJIS = [
            "⬛",
            "🟦",
            "🟪",
            "🟧",
            "🟫",
            "🟥",
            "🟩",
            "🟨"
        ];


        let playerPiece = {
            matrix: null,
            x: 0,
            y: 0,
            id: 0
        };


        let nextPieceId =
            Math.floor(
                Math.random() * 7
            ) + 1;


        function createPiece() {
            let id = nextPieceId;

            nextPieceId =
                Math.floor(
                    Math.random() * 7
                ) + 1;

            playerPiece.matrix =
                SHAPES[id];

            playerPiece.id = id;

            playerPiece.y = 0;

            playerPiece.x =
                Math.floor(
                    (
                        COL -
                        playerPiece.matrix[0].length
                    ) / 2
                );

            document.getElementById(
                'score-board'
            ).innerText =
                `🏆 Score: ${score} | 🟥 Next: ${
                    EMOJIS[nextPieceId]
                }`;

            if (collide()) {
                isGameOver = true;

                playSound('over');

                alert(
                    `💥 GAME OVER!\n최종 점수: ${score}점`
                );

                restart();
            }
        }


        function collide() {
            const m =
                playerPiece.matrix;

            for (
                let r = 0;
                r < m.length;
                r++
            ) {
                for (
                    let c = 0;
                    c < m[r].length;
                    c++
                ) {
                    if (m[r][c] !== 0) {

                        let boardX =
                            playerPiece.x + c;

                        let boardY =
                            playerPiece.y + r;

                        if (
                            boardX < 0 ||
                            boardX >= COL ||
                            boardY >= ROW
                        ) {
                            return true;
                        }

                        if (
                            boardY >= 0 &&
                            board[boardY][boardX] !== 0
                        ) {
                            return true;
                        }
                    }
                }
            }

            return false;
        }


        function merge() {
            playerPiece.matrix.forEach(
                (row, r) => {
                    row.forEach(
                        (value, c) => {
                            if (
                                value !== 0 &&
                                playerPiece.y + r >= 0
                            ) {
                                board[
                                    playerPiece.y + r
                                ][
                                    playerPiece.x + c
                                ] =
                                    playerPiece.id;
                            }
                        }
                    );
                }
            );
        }


        function rotate() {
            const m =
                playerPiece.matrix;

            const n =
                Array.from(
                    {
                        length: m[0].length
                    },
                    () =>
                        Array(
                            m.length
                        ).fill(0)
                );

            for (
                let r = 0;
                r < m.length;
                r++
            ) {
                for (
                    let c = 0;
                    c < m[r].length;
                    c++
                ) {
                    n[c][
                        m.length - 1 - r
                    ] =
                        m[r][c];
                }
            }

            const oldMatrix =
                playerPiece.matrix;

            playerPiece.matrix = n;

            if (collide()) {
                playerPiece.matrix =
                    oldMatrix;
            } else {
                playSound('rotate');
            }
        }


        function clearLines() {
            let linesCleared = 0;

            for (
                let r = ROW - 1;
                r >= 0;
                r--
            ) {
                if (
                    board[r].every(
                        val => val !== 0
                    )
                ) {
                    board.splice(r, 1);

                    board.unshift(
                        Array(COL).fill(0)
                    );

                    linesCleared++;

                    r++;
                }
            }

            if (linesCleared > 0) {
                score +=
                    linesCleared * 100;

                playSound('clear');

                document.getElementById(
                    'score-board'
                ).innerText =
                    `🏆 Score: ${score} | 🟥 Next: ${
                        EMOJIS[nextPieceId]
                    }`;
            }
        }


        function playerDrop() {
            playerPiece.y++;

            if (collide()) {
                playerPiece.y--;

                merge();
                clearLines();
                createPiece();
            } else {
                playSound('move');
            }

            dropCounter = 0;
        }


        function draw() {

            /*
             * 게임 영역은 기존처럼
             * 어두운 배경을 유지합니다.
             */
            ctx.fillStyle =
                getComputedStyle(
                    document.documentElement
                )
                .getPropertyValue(
                    '--canvas-bg'
                )
                .trim() || '#05070a';

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            board.forEach(
                (row, r) => {
                    row.forEach(
                        (value, c) => {

                            ctx.font =
                                "18px sans-serif";

                            ctx.fillText(
                                EMOJIS[value],
                                c * BLOCK_SIZE,
                                (r + 1) *
                                    BLOCK_SIZE
                            );
                        }
                    );
                }
            );


            if (playerPiece.matrix) {
                playerPiece.matrix.forEach(
                    (row, r) => {
                        row.forEach(
                            (value, c) => {

                                if (
                                    value !== 0
                                ) {
                                    ctx.font =
                                        "18px sans-serif";

                                    ctx.fillText(
                                        EMOJIS[
                                            playerPiece.id
                                        ],
                                        (
                                            playerPiece.x +
                                            c
                                        ) *
                                            BLOCK_SIZE,
                                        (
                                            playerPiece.y +
                                            r +
                                            1
                                        ) *
                                            BLOCK_SIZE
                                    );
                                }
                            }
                        );
                    }
                );
            }
        }


        function update(time = 0) {

            if (isGameOver) {
                return;
            }

            const deltaTime =
                time - lastTime;

            lastTime = time;

            dropCounter += deltaTime;

            if (dropCounter > 800) {
                playerDrop();
            }

            draw();

            gameId =
                requestAnimationFrame(
                    update
                );
        }


        document.addEventListener(
            'keydown',
            e => {

                if (isGameOver) {
                    return;
                }

                if (
                    e.key === 'ArrowLeft' ||
                    e.key === 'a'
                ) {
                    playerPiece.x--;

                    if (collide()) {
                        playerPiece.x++;
                    } else {
                        playSound('move');
                    }
                }


                if (
                    e.key === 'ArrowRight' ||
                    e.key === 'd'
                ) {
                    playerPiece.x++;

                    if (collide()) {
                        playerPiece.x--;
                    } else {
                        playSound('move');
                    }
                }


                if (
                    e.key === 'ArrowDown' ||
                    e.key === 's'
                ) {
                    playerDrop();
                }


                if (
                    e.key === 'ArrowUp' ||
                    e.key === 'w'
                ) {
                    rotate();
                }
            }
        );


        function restart() {
            board =
                Array.from(
                    { length: ROW },
                    () => Array(COL).fill(0)
                );

            score = 0;
            isGameOver = false;
            dropCounter = 0;

            if (gameId) {
                cancelAnimationFrame(
                    gameId
                );
            }

            createPiece();
            update();
        }


        restart();
    </script>
    
<script>
(() => {
    'use strict';
    const sendKey = (type, key) => {
        document.dispatchEvent(new KeyboardEvent(type, {
            key,
            bubbles: true,
            cancelable: true
        }));
    };

    const activePresses = new Map();
    document.querySelectorAll('.touch-controls [data-key]').forEach((button) => {
        const key = button.dataset.key;
        const hold = button.hasAttribute('data-hold');
        const repeat = button.hasAttribute('data-repeat');
        let repeatTimer = null;
        let pressed = false;

        const stop = (event) => {
            if (!pressed) return;
            if (event) event.preventDefault();
            pressed = false;
            if (repeatTimer !== null) {
                clearInterval(repeatTimer);
                repeatTimer = null;
            }
            sendKey('keyup', key);
            activePresses.delete(button);
        };

        if (hold || repeat) {
            button.addEventListener('pointerdown', (event) => {
                if (pressed) return;
                event.preventDefault();
                pressed = true;
                activePresses.set(button, stop);
                sendKey('keydown', key);
                if (repeat) {
                    repeatTimer = setInterval(() => sendKey('keydown', key), 105);
                }
                try { button.setPointerCapture(event.pointerId); } catch (_) {}
            });
            ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((name) => {
                button.addEventListener(name, stop);
            });
        } else {
            button.addEventListener('click', (event) => {
                event.preventDefault();
                sendKey('keydown', key);
                sendKey('keyup', key);
            });
        }
        button.addEventListener('contextmenu', (event) => event.preventDefault());
    });

    window.addEventListener('pointerup', () => {
        for (const stop of [...activePresses.values()]) stop();
    });
    window.addEventListener('blur', () => {
        for (const stop of [...activePresses.values()]) stop();
    });
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            for (const stop of [...activePresses.values()]) stop();
        }
    });

    window.addEventListener('keydown', (event) => {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(event.key)) {
            const target = event.target;
            const isInput = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT');
            if (!isInput) event.preventDefault();
        }
    }, { passive: false });

    const canvas = document.querySelector('canvas');
    if (canvas && canvas.dataset.swipeKeys === 'true') {
        let startX = 0;
        let startY = 0;
        let pointerId = null;
        canvas.addEventListener('pointerdown', (event) => {
            if (event.pointerType === 'mouse' && event.button !== 0) return;
            startX = event.clientX;
            startY = event.clientY;
            pointerId = event.pointerId;
            try { canvas.setPointerCapture(pointerId); } catch (_) {}
        });
        canvas.addEventListener('pointerup', (event) => {
            if (pointerId !== event.pointerId) return;
            const dx = event.clientX - startX;
            const dy = event.clientY - startY;
            const threshold = Math.max(18, canvas.getBoundingClientRect().width * 0.045);
            pointerId = null;
            if (Math.max(Math.abs(dx), Math.abs(dy)) < threshold) return;
            const key = Math.abs(dx) > Math.abs(dy)
                ? (dx < 0 ? 'ArrowLeft' : 'ArrowRight')
                : (dy < 0 ? 'ArrowUp' : 'ArrowDown');
            sendKey('keydown', key);
            sendKey('keyup', key);
        });
        canvas.addEventListener('pointercancel', () => { pointerId = null; });
    }
})();
</script>


</body>
</html>
