<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우주 전쟁 RTS: AI 하이퍼 업그레이드</title>
  <style>
    :root { --bg: #f8f9fa; --text: #333; --canvas-bg: #05070a; --border: #e9ecef; --btn-bg: #fff; }
    [data-theme="dark"] { --bg: #0d1117; --text: #c9d1d9; --canvas-bg: #020305; --border: #30363d; --btn-bg: #21262d; }
    [data-theme="beige"] { --bg: #f5ebe0; --text: #4e3d30; --canvas-bg: #14100c; --border: #ddcbbb; --btn-bg: #eddfd0; }
    body { background-color: var(--bg) !important; color: var(--text) !important; text-align: center; font-family: sans-serif; padding-top: 10px; margin: 0; transition: 0.3s; user-select: none; overflow: hidden; }
    button { background-color: var(--btn-bg) !important; color: var(--text) !important; border: 1px solid var(--border) !important; padding: 5px 10px; font-size: 0.8rem; border-radius: 6px; cursor: pointer; margin: 2px; font-weight: bold; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    #rts-panel { font-size: 1.05rem; font-weight: bold; color: #fcc419; margin-bottom: 4px; }
    .build-row { margin: 4px 0; display: flex; justify-content: center; flex-wrap: wrap; gap: 2px; }
    .active-mode { border: 2px solid #4dadf7 !important; background-color: #183153 !important; color: #fff !important; }
    #game-canvas { background: var(--canvas-bg); border: 2px solid var(--border); border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); cursor: default; }
    .help-text { font-size: 0.78rem; opacity: 0.85; margin-top: 3px; }
  </style>
</head>
<body>
  <h1>⚔️ 우주 전쟁: 스마트 AI 전술 RTS</h1>
  
  <div id="rts-panel">
    💎 <span id="res-min">50</span> | 🌋 <span id="res-gas">0</span> | 🌊 웨이브: <span id="wave-num">1</span> | 🏰 <span id="hp-player">500</span> | 🏯 <span id="hp-enemy">500</span> | ⚔️ 적 부대: <span id="ai-squad">0</span> (<span id="ai-state-text">방어 모드</span>)
  </div>

  <div class="build-row">
    <button id="btn-barracks" onclick="toggleBuild('barracks')">🏭 병영(💎40)</button>
    <button id="btn-refinery" onclick="toggleBuild('refinery')">🌋 제련소(💎30)</button>
    <button id="btn-factory" onclick="toggleBuild('factory')">⚙️ 공장(💎60/🌋20)</button>
    <button id="btn-starport" onclick="toggleBuild('starport')">🛫 우주항(💎80/🌋40)</button>
    <button id="btn-turret" onclick="toggleBuild('turret')">📡 터렛(💎35)</button>
  </div>
  <div class="build-row">
    <button id="btn-scv" onclick="produce('scv')">🛸 SCV(💎20)</button>
    <button id="btn-fighter" onclick="produce('fighter')" disabled>🚀 전투기(💎30)</button>
    <button id="btn-scout" onclick="produce('scout')" disabled>🥷 정찰기(💎25)</button>
    <button id="btn-tank" onclick="produce('tank')" disabled>🚜 전차(💎60/🌋10)</button>
    <button id="btn-mech" onclick="produce('mech')" disabled>🤖 메카(💎50/🌋15)</button>
    <button id="btn-cruiser" onclick="produce('cruiser')" disabled>🛩️ 중순양함(💎70/🌋30)</button>
    <button id="btn-carrier" onclick="produce('carrier')" disabled>🛸 항공모함(💎100/🌋60)</button>
  </div>

  <canvas id="game-canvas" width="600" height="440"></canvas>
  <div class="help-text">WASD/방향키: 스크롤 | 좌클릭 드래그: 선택 | 우클릭: 이동/전투 (우클릭 메뉴 완벽 차단됨)</div>

  <script>
    // 브라우저 팝업 메뉴 전역 차단
    window.addEventListener('contextmenu', (e) => e.preventDefault());

    const savedTheme = localStorage.getItem('minig-theme');
    if (savedTheme && savedTheme !== 'white') { document.documentElement.setAttribute('data-theme', savedTheme); }

    const WORLD_W = 1500;
    const WORLD_H = 1100;
    const VIEW_W = 600;
    const VIEW_H = 440;

    let camX = 0;
    let camY = WORLD_H - VIEW_H;

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    let resources = { min: 50, gas: 0, enemyMin: 50, enemyGas: 0 };
    let wave = 1;
    let waveTimer = 0;
    let buildMode = null;
    let gameOver = false;

    let tech = { barracks: false, factory: false, starport: false };

    let entities = [];
    let bullets = [];
    let particles = [];
    let selectedUnits = [];
    let keys = {};

    let isDragging = false;
    let dragStartScreen = { x: 0, y: 0 };
    let dragEndScreen = { x: 0, y: 0 };

    let aiStateMode = 'defend';

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
    }

    function playSound(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'produce') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.start(now); osc.stop(now + 0.12);
        } else if (type === 'laser') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(700, now);
          osc.frequency.exponentialRampToValueAtTime(180, now + 0.08);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'explode') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(30, now + 0.2);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        }
      } catch (e) {}
    }

    window.addEventListener('keydown', (e) => { keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    canvas.addEventListener('mousedown', (e) => {
      initAudio();
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      const worldX = mouseX + camX;
      const worldY = mouseY + camY;

      if (e.button === 2) {
        if (selectedUnits.length > 0) {
          const targetEnemy = entities.find(ent => 
            ent.faction === 'enemy' && 
            Math.hypot(ent.x - worldX, ent.y - worldY) <= ent.radius + 10
          );

          selectedUnits.forEach((unit, idx) => {
            const offsetX = (idx % 4 - 1.5) * 18;
            const offsetY = (Math.floor(idx / 4) - 1.5) * 18;
            unit.moveTarget = { x: worldX + offsetX, y: worldY + offsetY };
            unit.forcedTarget = targetEnemy || null;
          });
        }
        return;
      }

      if (e.button === 0) {
        if (buildMode) {
          handleBuild(worldX, worldY);
          return;
        }
        isDragging = true;
        dragStartScreen = { x: mouseX, y: mouseY };
        dragEndScreen = { x: mouseX, y: mouseY };
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const rect = canvas.getBoundingClientRect();
        dragEndScreen = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }
    });

    canvas.addEventListener('mouseup', (e) => {
      if (e.button === 0 && isDragging) {
        isDragging = false;
        const x1 = Math.min(dragStartScreen.x, dragEndScreen.x) + camX;
        const x2 = Math.max(dragStartScreen.x, dragEndScreen.x) + camX;
        const y1 = Math.min(dragStartScreen.y, dragEndScreen.y) + camY;
        const y2 = Math.max(dragStartScreen.y, dragEndScreen.y) + camY;

        const dragDist = Math.hypot(dragEndScreen.x - dragStartScreen.x, dragEndScreen.y - dragStartScreen.y);
        const isCombatUnit = (type) => ['fighter','scout','tank','mech','cruiser','carrier'].includes(type);

        if (dragDist > 10) {
          selectedUnits = entities.filter(ent => 
            ent.faction === 'player' && isCombatUnit(ent.type) &&
            ent.x >= x1 && ent.x <= x2 && ent.y >= y1 && ent.y <= y2
          );
        } else {
          const clickedUnit = entities.find(ent => 
            ent.faction === 'player' && isCombatUnit(ent.type) &&
            Math.hypot(ent.x - (dragStartScreen.x + camX), ent.y - (dragStartScreen.y + camY)) <= ent.radius + 6
          );
          selectedUnits = clickedUnit ? [clickedUnit] : [];
        }
      }
    });

    function toggleBuild(type) {
      initAudio();
      resetBuildButtons();
      if (buildMode === type) {
        buildMode = null;
      } else {
        buildMode = type;
        document.getElementById(`btn-${type}`).classList.add('active-mode');
      }
    }

    function resetBuildButtons() {
      ['barracks', 'refinery', 'factory', 'starport', 'turret'].forEach(t => {
        const btn = document.getElementById(`btn-${t}`);
        if (btn) btn.classList.remove('active-mode');
      });
    }

    function handleBuild(wx, wy) {
      if (buildMode === 'barracks' && resources.min >= 40) {
        resources.min -= 40;
        spawnEntity('barracks', 'player', wx, wy);
        tech.barracks = true; playSound('produce');
      } else if (buildMode === 'refinery' && resources.min >= 30) {
        const gasNode = entities.find(e => e.type === 'resource_gas' && Math.hypot(e.x - wx, e.y - wy) < 45);
        if (gasNode && !gasNode.hasRefinery) {
          resources.min -= 30; gasNode.hasRefinery = true;
          spawnEntity('refinery', 'player', gasNode.x, gasNode.y); playSound('produce');
        }
      } else if (buildMode === 'factory' && resources.min >= 60 && resources.gas >= 20) {
        resources.min -= 60; resources.gas -= 20;
        spawnEntity('factory', 'player', wx, wy);
        tech.factory = true; playSound('produce');
      } else if (buildMode === 'starport' && resources.min >= 80 && resources.gas >= 40) {
        resources.min -= 80; resources.gas -= 40;
        spawnEntity('starport', 'player', wx, wy);
        tech.starport = true; playSound('produce');
      } else if (buildMode === 'turret' && resources.min >= 35) {
        resources.min -= 35;
        spawnEntity('turret', 'player', wx, wy); playSound('produce');
      }
      buildMode = null;
      resetBuildButtons();
      updateUI();
    }

    function produce(unitType) {
      initAudio();
      const costs = {
        scv: { min: 20, gas: 0, req: true },
        fighter: { min: 30, gas: 0, req: tech.barracks },
        scout: { min: 25, gas: 0, req: tech.barracks },
        tank: { min: 60, gas: 10, req: tech.factory },
        mech: { min: 50, gas: 15, req: tech.factory },
        cruiser: { min: 70, gas: 30, req: tech.starport },
        carrier: { min: 100, gas: 60, req: tech.starport }
      };

      const c = costs[unitType];
      if (!c || !c.req || resources.min < c.min || resources.gas < c.gas) return;

      const playerHQ = entities.find(e => e.type === 'hq' && e.faction === 'player');
      if (playerHQ) {
        resources.min -= c.min; resources.gas -= c.gas;
        spawnEntity(unitType, 'player', playerHQ.x + (Math.random() * 60 - 30), playerHQ.y + (Math.random() * 60 - 30));
        playSound('produce'); updateUI();
      }
    }

    function updateUI() {
      document.getElementById('res-min').innerText = resources.min;
      document.getElementById('res-gas').innerText = resources.gas;
      document.getElementById('wave-num').innerText = wave;

      const playerHQ = entities.find(e => e.type === 'hq' && e.faction === 'player');
      const enemyHQ = entities.find(e => e.type === 'hq' && e.faction === 'enemy');

      document.getElementById('hp-player').innerText = playerHQ ? Math.max(0, playerHQ.hp) : 0;
      document.getElementById('hp-enemy').innerText = enemyHQ ? Math.max(0, enemyHQ.hp) : 0;

      const enemySquad = entities.filter(e => e.faction === 'enemy' && ['fighter','scout','tank','mech','cruiser','carrier','boss'].includes(e.type));
      document.getElementById('ai-squad').innerText = enemySquad.length;
      document.getElementById('ai-state-text').innerText = aiStateMode === 'attack' ? '💥 총공격' : (aiStateMode === 'defend' ? '🛡️ 요새화' : '🚨 긴급 방어');

      document.getElementById('btn-fighter').disabled = !tech.barracks || resources.min < 30;
      document.getElementById('btn-scout').disabled = !tech.barracks || resources.min < 25;
      document.getElementById('btn-tank').disabled = !tech.factory || resources.min < 60 || resources.gas < 10;
      document.getElementById('btn-mech').disabled = !tech.factory || resources.min < 50 || resources.gas < 15;
      document.getElementById('btn-cruiser').disabled = !tech.starport || resources.min < 70 || resources.gas < 30;
      document.getElementById('btn-carrier').disabled = !tech.starport || resources.min < 100 || resources.gas < 60;
    }

    function spawnEntity(type, faction, x, y) {
      let e = {
        id: Math.random().toString(),
        type: type, faction: faction,
        x: x, y: y,
        hp: 100, maxHp: 100,
        speed: 0, radius: 15, emoji: '🛸',
        cooldown: 0, cooldownMax: 40, attackRange: 0,
        damage: 10, splash: false, splashRadius: 0,
        cargo: null, moveTarget: null, forcedTarget: null
      };

      if (type === 'hq') {
        e.hp = e.maxHp = 500; e.radius = 32; e.emoji = (faction === 'player') ? '🏰' : '🏯';
      } else if (type === 'barracks') {
        e.hp = e.maxHp = 300; e.radius = 26; e.emoji = '🏭';
      } else if (type === 'factory') {
        e.hp = e.maxHp = 350; e.radius = 28; e.emoji = '⚙️';
      } else if (type === 'starport') {
        e.hp = e.maxHp = 400; e.radius = 30; e.emoji = '🛫';
      } else if (type === 'refinery') {
        e.hp = e.maxHp = 250; e.radius = 22; e.emoji = '🌋';
      } else if (type === 'turret') {
        e.hp = e.maxHp = 240; e.radius = 18; e.emoji = '📡';
        e.attackRange = 175; e.cooldownMax = 35; e.damage = 19;
      } else if (type === 'resource_min') {
        e.radius = 20; e.emoji = '💎'; e.resType = 'min';
      } else if (type === 'resource_gas') {
        e.radius = 20; e.emoji = '🌋'; e.resType = 'gas'; e.hasRefinery = false;
      } else if (type === 'scv') {
        e.hp = e.maxHp = 60; e.speed = 2.1; e.radius = 12; e.emoji = '🛸';
      } else if (type === 'fighter') {
        e.hp = e.maxHp = 100; e.speed = 2.4; e.radius = 14; e.emoji = '🚀';
        e.attackRange = 135; e.cooldownMax = 32; e.damage = 14;
      } else if (type === 'scout') {
        e.hp = e.maxHp = 75; e.speed = 3.0; e.radius = 11; e.emoji = '🥷';
        e.attackRange = 110; e.cooldownMax = 22; e.damage = 9;
      } else if (type === 'tank') {
        e.hp = e.maxHp = 220; e.speed = 1.0; e.radius = 19; e.emoji = '🚜';
        e.attackRange = 210; e.cooldownMax = 75; e.damage = 45; e.splash = true; e.splashRadius = 40;
      } else if (type === 'mech') {
        e.hp = e.maxHp = 260; e.speed = 1.4; e.radius = 18; e.emoji = '🤖';
        e.attackRange = 140; e.cooldownMax = 36; e.damage = 22;
      } else if (type === 'cruiser') {
        e.hp = e.maxHp = 320; e.speed = 1.1; e.radius = 22; e.emoji = '🛩️';
        e.attackRange = 180; e.cooldownMax = 60; e.damage = 35; e.splash = true; e.splashRadius = 35;
      } else if (type === 'carrier') {
        e.hp = e.maxHp = 450; e.speed = 0.85; e.radius = 25; e.emoji = '🛸';
        e.attackRange = 230; e.cooldownMax = 50; e.damage = 50; e.splash = true; e.splashRadius = 50;
      }

      entities.push(e);
      return e;
    }

    function initGame() {
      entities = []; bullets = []; particles = []; selectedUnits = [];
      resources = { min: 50, gas: 0, enemyMin: 50, enemyGas: 0 };
      wave = 1; waveTimer = 0; gameOver = false;
      tech = { barracks: false, factory: false, starport: false };

      // Player Base
      spawnEntity('hq', 'player', 160, 940);
      spawnEntity('resource_min', 'neutral', 90, 1010);
      spawnEntity('resource_gas', 'neutral', 260, 1010);
      for (let i = 0; i < 4; i++) spawnEntity('scv', 'player', 150 + (i * 20), 880);

      // Enemy Base
      spawnEntity('hq', 'enemy', 1340, 160);
      spawnEntity('resource_min', 'neutral', 1410, 90);
      const eGas = spawnEntity('resource_gas', 'neutral', 1240, 90);
      eGas.hasRefinery = true;
      spawnEntity('refinery', 'enemy', 1240, 90);
      for (let i = 0; i < 4; i++) spawnEntity('scv', 'enemy', 1300 + (i * 20), 220);

      updateUI();
    }

    function updateCamera() {
      const speed = 8;
      if (keys['ArrowLeft'] || keys['KeyA']) camX -= speed;
      if (keys['ArrowRight'] || keys['KeyD']) camX += speed;
      if (keys['ArrowUp'] || keys['KeyW']) camY -= speed;
      if (keys['ArrowDown'] || keys['KeyS']) camY += speed;

      camX = Math.max(0, Math.min(WORLD_W - VIEW_W, camX));
      camY = Math.max(0, Math.min(WORLD_H - VIEW_H, camY));
    }

    // AI 스마트 위치 정렬 알고리즘 (충돌 및 중복 설치 방지)
    function findAIBuildPos(baseX, baseY, radius, buildType) {
      if (buildType === 'turret') {
        // 전방 방어선 좌표 계산 (아군 사령부 방향인 좌하단으로 전진 설치)
        const frontPositions = [
          { x: baseX - 180, y: baseY + 80 },
          { x: baseX - 80, y: baseY + 180 },
          { x: baseX - 220, y: baseY + 180 },
          { x: baseX - 120, y: baseY + 260 }
        ];
        for (let pos of frontPositions) {
          if (!entities.some(e => Math.hypot(e.x - pos.x, e.y - pos.y) < e.radius + radius + 15)) {
            return pos;
          }
        }
      }

      // 일반 건물 안전 구역 검색
      for (let attempt = 0; attempt < 30; attempt++) {
        const offsetDist = 80 + Math.random() * 140;
        const angle = Math.PI * 0.2 + Math.random() * Math.PI * 0.6; // 좌하단 전술 방향
        const testX = baseX - Math.cos(angle) * offsetDist;
        const testY = baseY + Math.sin(angle) * offsetDist;

        if (testX > 900 && testX < 1450 && testY > 50 && testY < 550) {
          const overlap = entities.some(e => Math.hypot(e.x - testX, e.y - testY) < e.radius + radius + 20);
          if (!overlap) return { x: testX, y: testY };
        }
      }
      return null;
    }

    // AI 마이크로 컨트롤 및 마크로 생산 엔진
    let aiTimer = 0;
    function updateSmartAI() {
      aiTimer++;
      if (aiTimer % 35 !== 0) return;

      const enemyHQ = entities.find(e => e.type === 'hq' && e.faction === 'enemy');
      if (!enemyHQ) return;

      const eBarracks = entities.find(e => e.type === 'barracks' && e.faction === 'enemy');
      const eFactory = entities.find(e => e.type === 'factory' && e.faction === 'enemy');
      const eStarport = entities.find(e => e.type === 'starport' && e.faction === 'enemy');
      const eSCVs = entities.filter(e => e.type === 'scv' && e.faction === 'enemy');
      const eTurrets = entities.filter(e => e.type === 'turret' && e.faction === 'enemy');
      const enemySquad = entities.filter(e => e.faction === 'enemy' && ['fighter','scout','tank','mech','cruiser','carrier'].includes(e.type));
      const playerThreats = entities.filter(e => e.faction === 'player' && Math.hypot(e.x - enemyHQ.x, e.y - enemyHQ.y) < 550);

      // 1. 위협 감지 및 동적 기지 방어 모드 전환
      if (playerThreats.length > 0) {
        aiStateMode = 'emergency';
        enemySquad.forEach(u => {
          let closestPlayer = playerThreats.reduce((prev, curr) => 
            Math.hypot(curr.x - u.x, curr.y - u.y) < Math.hypot(prev.x - u.x, prev.y - u.y) ? curr : prev, playerThreats[0]);
          u.forcedTarget = closestPlayer;
          u.moveTarget = { x: closestPlayer.x, y: closestPlayer.y };
        });
      } else if (enemySquad.length >= Math.max(5, 12 - wave * 2)) {
        aiStateMode = 'attack';
      } else {
        aiStateMode = 'defend';
      }

      // 2. 일꾼 보충
      if (eSCVs.length < 5 && resources.enemyMin >= 20) {
        resources.enemyMin -= 20;
        spawnEntity('scv', 'enemy', enemyHQ.x - 30, enemyHQ.y + 30);
      }

      // 3. 지능형 건물 테크트리 확장 (겹침 방지 좌표 탐색 적용)
      if (!eBarracks && resources.enemyMin >= 40) {
        let pos = findAIBuildPos(enemyHQ.x, enemyHQ.y, 26, 'barracks');
        if (pos) { resources.enemyMin -= 40; spawnEntity('barracks', 'enemy', pos.x, pos.y); }
      } else if (eBarracks && !eFactory && resources.enemyMin >= 60 && resources.enemyGas >= 20) {
        let pos = findAIBuildPos(enemyHQ.x, enemyHQ.y, 28, 'factory');
        if (pos) { resources.enemyMin -= 60; resources.enemyGas -= 20; spawnEntity('factory', 'enemy', pos.x, pos.y); }
      } else if (eFactory && !eStarport && wave >= 3 && resources.enemyMin >= 80 && resources.enemyGas >= 40) {
        let pos = findAIBuildPos(enemyHQ.x, enemyHQ.y, 30, 'starport');
        if (pos) { resources.enemyMin -= 80; resources.enemyGas -= 40; spawnEntity('starport', 'enemy', pos.x, pos.y); }
      } else if (eTurrets.length < 3 && resources.enemyMin >= 35 && Math.random() < 0.4) {
        let pos = findAIBuildPos(enemyHQ.x, enemyHQ.y, 18, 'turret');
        if (pos) { resources.enemyMin -= 35; spawnEntity('turret', 'enemy', pos.x, pos.y); }
      }

      // 4. 테크별 맞춤 전투 유닛 조합 생산
      if (eBarracks) {
        let prodPoint = eStarport || eFactory || eBarracks;
        if (eStarport && resources.enemyMin >= 100 && resources.enemyGas >= 60 && Math.random() < 0.4) {
          resources.enemyMin -= 100; resources.enemyGas -= 60;
          spawnEntity('carrier', 'enemy', prodPoint.x - 30, prodPoint.y + 30);
        } else if (eFactory && resources.enemyMin >= 60 && resources.enemyGas >= 10 && Math.random() < 0.6) {
          resources.enemyMin -= 60; resources.enemyGas -= 10;
          spawnEntity('tank', 'enemy', prodPoint.x - 30, prodPoint.y + 30);
        } else if (resources.enemyMin >= 30) {
          resources.enemyMin -= 30;
          let unitType = Math.random() < 0.5 ? 'fighter' : 'scout';
          spawnEntity(unitType, 'enemy', prodPoint.x - 30, prodPoint.y + 30);
        }
      }

      // 5. 유닛 지능형 오더 분배 (전진 / 집결 / 방어)
      if (aiStateMode === 'attack') {
        const playerHQ = entities.find(e => e.type === 'hq' && e.faction === 'player');
        if (playerHQ) {
          enemySquad.forEach((unit, idx) => {
            if (!unit.moveTarget || Math.random() < 0.2) {
              const offsetX = (idx % 5 - 2) * 25;
              const offsetY = (Math.floor(idx / 5) - 2) * 25;
              unit.moveTarget = { x: playerHQ.x + offsetX, y: playerHQ.y + offsetY };
            }
          });
        }
      } else if (aiStateMode === 'defend') {
        // 방어 모드: 방어선 주위에 유닛 배치 및 대기
        enemySquad.forEach((unit, idx) => {
          if (!unit.moveTarget) {
            const rallyX = enemyHQ.x - 180 + (idx % 4) * 35;
            const rallyY = enemyHQ.y + 120 + Math.floor(idx / 4) * 35;
            unit.moveTarget = { x: rallyX, y: rallyY };
          }
        });
      }
    }

    function updateEntities() {
      waveTimer++;
      if (waveTimer % 900 === 0) {
        wave++;
        updateUI();
      }

      for (let i = entities.length - 1; i >= 0; i--) {
        let e = entities[i];
        if (e.hp <= 0) {
          for (let p = 0; p < 6; p++) {
            particles.push({
              x: e.x, y: e.y,
              vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
              life: 22, text: '💥'
            });
          }
          playSound('explode');
          selectedUnits = selectedUnits.filter(u => u.id !== e.id);
          
          if (e.faction === 'player') {
            if (e.type === 'barracks') tech.barracks = entities.some(b => b.faction === 'player' && b.type === 'barracks' && b.id !== e.id);
            if (e.type === 'factory') tech.factory = entities.some(b => b.faction === 'player' && b.type === 'factory' && b.id !== e.id);
            if (e.type === 'starport') tech.starport = entities.some(b => b.faction === 'player' && b.type === 'starport' && b.id !== e.id);
          }

          entities.splice(i, 1);
          updateUI();

          if (e.type === 'hq') {
            gameOver = true;
            setTimeout(() => {
              if (e.faction === 'enemy') {
                alert("🎉 우주 대승리! 적 사령부를 함락했습니다!");
              } else {
                alert("💥 아군 사령부가 파괴되었습니다! 게임 오버!");
              }
              initGame();
            }, 100);
          }
          continue;
        }

        // 터렛 자동 조준 방어
        if (e.type === 'turret') {
          if (e.cooldown > 0) e.cooldown--;
          let targets = entities.filter(t => t.faction !== 'neutral' && t.faction !== e.faction);
          let closestTarget = null;
          let minDist = 999999;
          targets.forEach(t => {
            let d = Math.hypot(t.x - e.x, t.y - e.y);
            if (d < minDist) { minDist = d; closestTarget = t; }
          });
          if (closestTarget && minDist <= e.attackRange && e.cooldown <= 0) {
            bullets.push({
              x: e.x, y: e.y, targetX: closestTarget.x, targetY: closestTarget.y,
              targetId: closestTarget.id, faction: e.faction, speed: 8.5,
              damage: e.damage, splash: false, splashRadius: 0
            });
            playSound('laser');
            e.cooldown = e.cooldownMax;
          }
        }

        // SCV 자원 채취
        if (e.type === 'scv') {
          const hq = entities.find(h => h.type === 'hq' && h.faction === e.faction);
          if (!e.cargo) {
            let nodes = entities.filter(n => n.type === 'resource_min' || (n.type === 'resource_gas' && n.hasRefinery));
            let closestNode = null;
            let minDist = 999999;
            nodes.forEach(n => {
              let d = Math.hypot(n.x - e.x, n.y - e.y);
              if (d < minDist) { minDist = d; closestNode = n; }
            });

            if (closestNode) {
              if (minDist > 16) {
                let angle = Math.atan2(closestNode.y - e.y, closestNode.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;
              } else {
                e.cargo = closestNode.resType;
              }
            }
          } else {
            if (hq) {
              let dist = Math.hypot(hq.x - e.x, hq.y - e.y);
              if (dist > 25) {
                let angle = Math.atan2(hq.y - e.y, hq.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;
              } else {
                if (e.faction === 'player') {
                  if (e.cargo === 'min') resources.min += 10;
                  if (e.cargo === 'gas') resources.gas += 5;
                } else {
                  if (e.cargo === 'min') resources.enemyMin += 10;
                  if (e.cargo === 'gas') resources.enemyGas += 5;
                }
                e.cargo = null;
                updateUI();
              }
            }
          }
        }

        // 전투 유닛 AI 및 타격 물리
        if (['fighter','scout','tank','mech','cruiser','carrier'].includes(e.type)) {
          if (e.cooldown > 0) e.cooldown--;

          let targets = entities.filter(t => t.faction !== 'neutral' && t.faction !== e.faction);
          let closestTarget = null;
          let minDist = 999999;

          // 지능형 표적 우선순위 계산 (SCV, 터렛, HQ 조준)
          targets.forEach(t => {
            let d = Math.hypot(t.x - e.x, t.y - e.y);
            let priorityWeight = (t.type === 'turret' ? 0.7 : (t.type === 'hq' ? 0.8 : 1.0));
            if (d * priorityWeight < minDist) { minDist = d * priorityWeight; closestTarget = t; }
          });

          let activeTarget = e.forcedTarget && entities.includes(e.forcedTarget) ? e.forcedTarget : closestTarget;

          if (e.moveTarget) {
            let distToMove = Math.hypot(e.moveTarget.x - e.x, e.moveTarget.y - e.y);
            if (distToMove > 10) {
              let angle = Math.atan2(e.moveTarget.y - e.y, e.moveTarget.x - e.x);
              e.x += Math.cos(angle) * e.speed;
              e.y += Math.sin(angle) * e.speed;
            } else {
              e.moveTarget = null;
            }
          } else if (activeTarget && Math.hypot(activeTarget.x - e.x, activeTarget.y - e.y) > e.attackRange) {
            let angle = Math.atan2(activeTarget.y - e.y, activeTarget.x - e.x);
            e.x += Math.cos(angle) * e.speed;
            e.y += Math.sin(angle) * e.speed;
          }

          if (activeTarget && Math.hypot(activeTarget.x - e.x, activeTarget.y - e.y) <= e.attackRange && e.cooldown <= 0) {
            bullets.push({
              x: e.x, y: e.y,
              targetX: activeTarget.x, targetY: activeTarget.y,
              targetId: activeTarget.id, faction: e.faction,
              speed: 7.5, damage: e.damage,
              splash: e.splash, splashRadius: e.splashRadius
            });
            playSound('laser');
            e.cooldown = e.cooldownMax;
          }
        }
      }

      // 탄환 및 피격 처리
      for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        let angle = Math.atan2(b.targetY - b.y, b.targetX - b.x);
        b.x += Math.cos(angle) * b.speed;
        b.y += Math.sin(angle) * b.speed;

        if (Math.hypot(b.targetX - b.x, b.targetY - b.y) < 8) {
          if (b.splash) {
            playSound('explode');
            particles.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 12, text: '💥' });
            entities.forEach(t => {
              if (t.faction !== 'neutral' && t.faction !== b.faction) {
                if (Math.hypot(t.x - b.x, t.y - b.y) <= b.splashRadius) {
                  t.hp -= b.damage;
                }
              }
            });
          } else {
            let target = entities.find(e => e.id === b.targetId);
            if (target) target.hp -= b.damage;
          }
          bullets.splice(i, 1);
          updateUI();
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function render() {
      ctx.clearRect(0, 0, VIEW_W, VIEW_H);

      ctx.save();
      ctx.translate(-camX, -camY);

      // 격자 배경
      ctx.strokeStyle = '#111827'; ctx.lineWidth = 1;
      for (let x = 0; x < WORLD_W; x += 100) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_H); ctx.stroke();
      }
      for (let y = 0; y < WORLD_H; y += 100) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_W, y); ctx.stroke();
      }

      // 투사체
      bullets.forEach(b => {
        ctx.fillStyle = b.faction === 'player' ? '#4dadf7' : '#ff6b6b';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.splash ? 4 : 3, 0, Math.PI * 2);
        ctx.fill();
      });

      // 엔티티
      entities.forEach(e => {
        if (selectedUnits.includes(e)) {
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius + 4, 0, Math.PI * 2);
          ctx.strokeStyle = '#51cf66'; ctx.lineWidth = 2; ctx.stroke();
        }

        ctx.font = `${e.radius * 1.5}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(e.emoji, e.x, e.y);

        if (e.cargo) {
          ctx.font = '11px sans-serif';
          ctx.fillText('📦', e.x + 10, e.y - 10);
        }

        if (e.type !== 'resource_min' && e.type !== 'resource_gas') {
          const barW = e.radius * 1.8;
          const barH = 4;
          const barX = e.x - barW / 2;
          const barY = e.y - e.radius - 8;
          const hpRatio = Math.max(0, e.hp / e.maxHp);

          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(barX, barY, barW, barH);
          ctx.fillStyle = e.faction === 'player' ? '#51cf66' : '#ff6b6b';
          ctx.fillRect(barX, barY, barW * hpRatio, barH);
        }
      });

      // 파티클
      particles.forEach(p => {
        ctx.font = '15px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(p.text, p.x, p.y);
      });

      ctx.restore();

      // 드래그 박스
      if (isDragging) {
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        const w = dragEndScreen.x - dragStartScreen.x;
        const h = dragEndScreen.y - dragStartScreen.y;
        ctx.fillRect(dragStartScreen.x, dragStartScreen.y, w, h);
        ctx.strokeRect(dragStartScreen.x, dragStartScreen.y, w, h);
      }

      // 미니맵
      const miniW = 110, miniH = 80;
      const miniX = 10, miniY = VIEW_H - miniH - 10;

      ctx.fillStyle = 'rgba(5, 7, 10, 0.85)';
      ctx.fillRect(miniX, miniY, miniW, miniH);
      ctx.strokeStyle = '#30363d'; ctx.lineWidth = 1;
      ctx.strokeRect(miniX, miniY, miniW, miniH);

      const scaleX = miniW / WORLD_W;
      const scaleY = miniH / WORLD_H;

      entities.forEach(e => {
        if (e.type === 'resource_min' || e.type === 'resource_gas') {
          ctx.fillStyle = '#fcc419';
        } else {
          ctx.fillStyle = e.faction === 'player' ? '#51cf66' : '#ff6b6b';
        }
        ctx.fillRect(miniX + e.x * scaleX, miniY + e.y * scaleY, 2, 2);
      });

      ctx.strokeStyle = '#4dadf7'; ctx.lineWidth = 1;
      ctx.strokeRect(miniX + camX * scaleX, miniY + camY * scaleY, VIEW_W * scaleX, VIEW_H * scaleY);
    }

    function gameLoop() {
      if (!gameOver) {
        updateCamera();
        updateSmartAI();
        updateEntities();
      }
      render();
      requestAnimationFrame(gameLoop);
    }

    initGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
