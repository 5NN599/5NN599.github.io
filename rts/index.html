<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>갤럭시 블리츠: 스텔라 워 (Galactic Blitz)</title>
  <style>
    :root { --bg: #f8f9fa; --text: #333; --canvas-bg: #05070a; --border: #30363d; --btn-bg: #fff; }
    [data-theme="dark"] { --bg: #0d1117; --text: #c9d1d9; --canvas-bg: #020305; --border: #30363d; --btn-bg: #21262d; }
    body { background-color: var(--bg); color: var(--text); text-align: center; font-family: sans-serif; padding-top: 6px; margin: 0; user-select: none; overflow: hidden; }
    button { background-color: var(--btn-bg); color: var(--text); border: 1px solid var(--border); padding: 4px 8px; font-size: 0.75rem; border-radius: 5px; cursor: pointer; margin: 1px; font-weight: bold; }
    button:disabled { opacity: 0.3; cursor: not-allowed; }
    #rts-panel { font-size: 0.9rem; font-weight: bold; color: #fcc419; margin-bottom: 3px; display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
    .build-row { margin: 2px 0; display: flex; justify-content: center; flex-wrap: wrap; gap: 2px; }
    .active-mode { border: 2px solid #4dadf7 !important; background-color: #183153 !important; color: #fff !important; }
    .diff-select { background: var(--btn-bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 2px 5px; font-weight: bold; font-size: 0.8rem; }
    
    .canvas-container { position: relative; display: inline-block; }
    #game-canvas { background: var(--canvas-bg); border: 2px solid var(--border); border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); cursor: default; }
    .help-text { font-size: 0.75rem; opacity: 0.8; margin-top: 2px; }

    #toast-msg {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92); color: #74c0fc; border: 1px solid #4dadf7;
      padding: 6px 16px; border-radius: 20px; font-size: 0.82rem; font-weight: bold;
      pointer-events: none; opacity: 0; transition: opacity 0.3s ease; z-index: 100;
    }

    #game-over-modal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(10, 15, 26, 0.95); border: 2px solid #fcc419; padding: 25px 35px;
      border-radius: 12px; color: #fff; text-align: center; display: none; z-index: 200;
    }
    #game-over-modal h2 { margin: 0 0 15px 0; font-size: 1.3rem; color: #fcc419; }
  </style>
</head>
<body>
  <div id="rts-panel">
    <span>💎 <span id="res-min">200</span> | 🌋 <span id="res-gas">0</span></span>
    <span>📦 인구: <span id="p-supply">0/10</span></span>
    <span>🌊 웨이브: <span id="wave-num">1</span></span>
    <span>🏰 사령부: <span id="hq-count">1</span>개</span>
    <span>⚔️ 적: <span id="ai-squad">0</span> (<span id="ai-supply">0/10</span>)</span>
    <select id="diff-select" class="diff-select" onchange="changeDifficulty(this.value)">
      <option value="EASY">난이도: 쉬움</option>
      <option value="NORMAL" selected>난이도: 보통</option>
      <option value="HARD">난이도: 어려움</option>
    </select>
  </div>

  <!-- 건물 버튼 -->
  <div class="build-row">
    <button id="btn-hq" onclick="toggleBuild('hq')">🏰 사령부(💎150)</button>
    <button id="btn-depot" onclick="toggleBuild('depot')">🏠 보급고(💎30)</button>
    <button id="btn-barracks" onclick="toggleBuild('barracks')">🏭 병영(💎40)</button>
    <button id="btn-academy" onclick="toggleBuild('academy')">🎓 사관학교(💎50)</button>
    <button id="btn-refinery" onclick="toggleBuild('refinery')">🌋 제련소(💎30)</button>
    <button id="btn-factory" onclick="toggleBuild('factory')">⚙️ 공장(💎60/🌋20)</button>
    <button id="btn-armory" onclick="toggleBuild('armory')">⚔️ 무기고(💎70/🌋30)</button>
    <button id="btn-starport" onclick="toggleBuild('starport')">🛫 우주항(💎80/🌋40)</button>
    <button id="btn-lab" onclick="toggleBuild('lab')">🔬 연구소(💎100/🌋50)</button>
    <button id="btn-bunker" onclick="toggleBuild('bunker')">🛡️ 벙커(💎45)</button>
    <button id="btn-turret" onclick="toggleBuild('turret')">📡 터렛(💎35)</button>
  </div>

  <!-- 유닛 버튼 -->
  <div class="build-row">
    <button id="btn-scv" onclick="produce('scv')">🛸 SCV(💎20/📦1)</button>
    <button id="btn-marine" onclick="produce('marine')" disabled>🪖 보병(💎15/📦1)</button>
    <button id="btn-medic" onclick="produce('medic')" disabled>🏥 의무병(💎25/📦1)</button>
    <button id="btn-fighter" onclick="produce('fighter')" disabled>🚀 전투기(💎30/📦2)</button>
    <button id="btn-scout" onclick="produce('scout')" disabled>🥷 정찰기(💎25/📦2)</button>
    <button id="btn-tank" onclick="produce('tank')" disabled>🚜 전차(💎60/🌋10/📦3)</button>
    <button id="btn-siegetank" onclick="produce('siegetank')" disabled>💥 공성전차(💎90/🌋30/📦4)</button>
    <button id="btn-mech" onclick="produce('mech')" disabled>🤖 메카(💎50/🌋15/📦3)</button>
    <button id="btn-cruiser" onclick="produce('cruiser')" disabled>🛩️ 중순양함(💎70/🌋30/📦5)</button>
    <button id="btn-carrier" onclick="produce('carrier')" disabled>🛸 항공모함(💎100/🌋60/📦6)</button>
    <button id="btn-titan" onclick="produce('titan')" disabled>🛡️ 요새함(💎150/🌋100/📦8)</button>
  </div>

  <div class="canvas-container">
    <canvas id="game-canvas" width="650" height="460"></canvas>
    <div id="toast-msg"></div>
    <div id="game-over-modal">
      <h2 id="game-over-title">게임 종료</h2>
      <button onclick="restartGame()">🎮 다시 시작하기</button>
    </div>
  </div>

  <div class="help-text">마우스 드래그: 다중 선택 | 우클릭: 이동/채굴/공격 | WASD/방향키: 화면 이동 (대형 맵 3200x2400)</div>

  <script>
    window.addEventListener('contextmenu', (e) => e.preventDefault());

    const WORLD_W = 3200;
    const WORLD_H = 2400;
    const VIEW_W = 650;
    const VIEW_H = 460;

    let camX = 0;
    let camY = WORLD_H - VIEW_H;

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    const DIFFICULTY_SETTINGS = {
      EASY:   { name: '쉬움', aiGatherRate: 0.8, buildInterval: 45 },
      NORMAL: { name: '보통', aiGatherRate: 1.2, buildInterval: 30 },
      HARD:   { name: '어려움', aiGatherRate: 1.8, buildInterval: 18 }
    };
    let currentDifficulty = DIFFICULTY_SETTINGS.NORMAL;

    let resources = { min: 20, gas: 0, enemyMin: 20, enemyGas: 0 };
    let wave = 1;
    let waveTimer = 0;
    let buildMode = null;
    let gameOver = false;

    let tech = { barracks: false, academy: false, factory: false, armory: false, starport: false, lab: false };

    let entities = [];
    let bullets = [];
    let particles = [];
    let sparks = [];
    let selectedUnits = [];
    let keys = {};

    let isDragging = false;
    let dragStartScreen = { x: 0, y: 0 };
    let dragEndScreen = { x: 0, y: 0 };
    let isMinimapDragging = false;

    const UNIT_SPECS = {
      scv:       { min: 20,  gas: 0,   supply: 1, req: true,         bType: 'hq',       time: 70,  name: 'SCV' },
      marine:    { min: 15,  gas: 0,   supply: 1, req: 'barracks',    bType: 'barracks', time: 80,  name: '보병' },
      medic:     { min: 25,  gas: 0,   supply: 1, req: 'academy',     bType: 'barracks', time: 100, name: '의무병' },
      fighter:   { min: 30,  gas: 0,   supply: 2, req: 'barracks',    bType: 'barracks', time: 120, name: '전투기' },
      scout:     { min: 25,  gas: 0,   supply: 2, req: 'barracks',    bType: 'barracks', time: 90,  name: '정찰기' },
      tank:      { min: 60,  gas: 10,  supply: 3, req: 'factory',     bType: 'factory',  time: 180, name: '전차' },
      siegetank: { min: 90,  gas: 30,  supply: 4, req: 'armory',      bType: 'factory',  time: 240, name: '공성전차' },
      mech:      { min: 50,  gas: 15,  supply: 3, req: 'factory',     bType: 'factory',  time: 150, name: '메카' },
      cruiser:   { min: 70,  gas: 30,  supply: 5, req: 'starport',    bType: 'starport', time: 220, name: '중순양함' },
      carrier:   { min: 100, gas: 60,  supply: 6, req: 'starport',    bType: 'starport', time: 320, name: '항공모함' },
      titan:     { min: 150, gas: 100, supply: 8, req: 'lab',         bType: 'starport', time: 420, name: '거대요새함' }
    };

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast-msg');
      toast.innerText = msg;
      toast.style.opacity = '1';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.style.opacity = '0'; }, 2000);
    }

    function changeDifficulty(val) {
      currentDifficulty = DIFFICULTY_SETTINGS[val] || DIFFICULTY_SETTINGS.NORMAL;
      showToast(`난이도가 [${currentDifficulty.name}](으)로 설정되었습니다.`);
    }

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

    function playSound(type, worldX = null, worldY = null) {
      if (!audioCtx) return;

      // 소리는 카메라 중심을 기준으로 거리 감쇠한다.
      // 가까우면 정상 볼륨, 멀어질수록 부드럽게 작아지고
      // 일정 거리 이상 떨어지면 완전히 들리지 않는다.
      let distanceFactor = 1;
      if (worldX !== null && worldY !== null) {
        const cameraCenterX = camX + VIEW_W / 2;
        const cameraCenterY = camY + VIEW_H / 2;
        const distance = Math.hypot(worldX - cameraCenterX, worldY - cameraCenterY);

        const fullVolumeDistance = 180;
        const maxHearDistance = 900;

        if (distance >= maxHearDistance) {
          distanceFactor = 0;
        } else if (distance > fullVolumeDistance) {
          const t = (distance - fullVolumeDistance) /
                    (maxHearDistance - fullVolumeDistance);
          distanceFactor = Math.pow(1 - t, 1.8);
        }
      }

      if (distanceFactor <= 0) return;

      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'produce') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
          gain.gain.setValueAtTime(0.12 * distanceFactor, now);
          gain.gain.exponentialRampToValueAtTime(0.01 * distanceFactor, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'laser') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(650, now);
          osc.frequency.exponentialRampToValueAtTime(150, now + 0.07);
          gain.gain.setValueAtTime(0.06 * distanceFactor, now);
          gain.gain.exponentialRampToValueAtTime(0.01 * distanceFactor, now + 0.07);
          osc.start(now);
          osc.stop(now + 0.07);
        } else if (type === 'explode') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(130, now);
          osc.frequency.exponentialRampToValueAtTime(25, now + 0.2);
          gain.gain.setValueAtTime(0.18 * distanceFactor, now);
          gain.gain.exponentialRampToValueAtTime(0.01 * distanceFactor, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'mine') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(1400, now + 0.06);
          gain.gain.setValueAtTime(0.08 * distanceFactor, now);
          gain.gain.exponentialRampToValueAtTime(0.01 * distanceFactor, now + 0.06);
          osc.start(now);
          osc.stop(now + 0.06);
        }
      } catch (e) {}
    }

    window.addEventListener('keydown', (e) => { keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    function handleMinimapClick(mx, my) {
      const mmW = 160, mmH = 120;
      const mmX = VIEW_W - mmW - 10;
      const mmY = VIEW_H - mmH - 10;

      if (mx >= mmX && mx <= mmX + mmW && my >= mmY && my <= mmY + mmH) {
        const targetX = ((mx - mmX) / mmW) * WORLD_W;
        const targetY = ((my - mmY) / mmH) * WORLD_H;
        camX = Math.max(0, Math.min(WORLD_W - VIEW_W, targetX - VIEW_W / 2));
        camY = Math.max(0, Math.min(WORLD_H - VIEW_H, targetY - VIEW_H / 2));
        return true;
      }
      return false;
    }

    function getSupplyInfo(faction) {
      const hqCount = entities.filter(e => e.faction === faction && e.type === 'hq' && !e.isUnderConstruction).length;
      const depotCount = entities.filter(e => e.faction === faction && e.type === 'depot' && !e.isUnderConstruction).length;
      const maxSupply = Math.min(200, (hqCount * 10) + (depotCount * 8));
      const currentSupply = entities
        .filter(e => e.faction === faction && UNIT_SPECS[e.type])
        .reduce((sum, u) => sum + (UNIT_SPECS[u.type].supply || 1), 0);
      return { current: currentSupply, max: maxSupply };
    }

    // SCV 최적 자원 분산 알고리즘 (특정 자원에 채굴자가 몰리지 않게 할당)
    function assignBaseResource(scv, baseX, baseY, maxDist = 300) {
      const validResources = entities.filter(r =>
        (r.type === 'resource_min' || (r.type === 'resource_gas' && r.hasRefinery)) &&
        r.amount > 0 &&
        Math.hypot(r.x - baseX, r.y - baseY) <= maxDist
      );
      if (validResources.length === 0) return null;

      let bestRes = null;
      let bestScore = Infinity;
      validResources.forEach(res => {
        const miners = entities.filter(e => e.type === 'scv' && e.assignedRes === res && e !== scv).length;
        const dist = Math.hypot(res.x - scv.x, res.y - scv.y);
        const score = dist + miners * 180;
        if (score < bestScore) {
          bestScore = score;
          bestRes = res;
        }
      });
      return bestRes;
    }

    function assignEnemyBaseResource(scv) {
      const baseX = WORLD_W - 350;
      const baseY = 350;
      const res = assignBaseResource(scv, baseX, baseY, 320);
      if (res) scv.assignedRes = res;
      return res;
    }

function assignBestResource(scv) {
      const validResources = entities.filter(r => 
        (r.type === 'resource_min' || (r.type === 'resource_gas' && r.hasRefinery)) && r.amount > 0
      );
      if (validResources.length === 0) return null;

      let bestRes = null;
      let minScore = Infinity;

      validResources.forEach(res => {
        const dist = Math.hypot(res.x - scv.x, res.y - scv.y);
        // 이 자원을 채굴 중인 다른 SCV 수 계산
        const miners = entities.filter(e => e.type === 'scv' && e.assignedRes === res && e !== scv).length;
        // 거리와 현재 일꾼 수를 종합하여 점수 계산
        const score = dist + (miners * 180);

        if (score < minScore) {
          minScore = score;
          bestRes = res;
        }
      });

      return bestRes;
    }

    canvas.addEventListener('mousedown', (e) => {
      initAudio();
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      if (e.button === 0 && handleMinimapClick(mouseX, mouseY)) {
        isMinimapDragging = true;
        return;
      }

      const worldX = mouseX + camX;
      const worldY = mouseY + camY;

      if (e.button === 2) {
        if (selectedUnits.length > 0) {
          const targetEnemy = entities.find(ent => 
            ent.faction === 'enemy' && Math.hypot(ent.x - worldX, ent.y - worldY) <= ent.radius + 12
          );

          const targetRes = entities.find(ent => 
            (ent.type === 'resource_min' || (ent.type === 'resource_gas' && ent.hasRefinery)) &&
            Math.hypot(ent.x - worldX, ent.y - worldY) <= ent.radius + 15
          );

          selectedUnits.forEach((unit, idx) => {
            if (unit.isBuildingSCV) {
              unit.isBuildingSCV = false;
              unit.buildingTargetId = null;
            }
            unit.mineTimer = 0;
            const offsetX = (idx % 4 - 1.5) * 20;
            const offsetY = (Math.floor(idx / 4) - 1.5) * 20;

            if (unit.type === 'scv') {
              if (targetRes) {
                unit.isManualMove = false; 
                unit.moveTarget = null; 
                unit.assignedRes = targetRes;
              } else {
                unit.isManualMove = true; 
                unit.moveTarget = { x: worldX + offsetX, y: worldY + offsetY }; 
                unit.assignedRes = null;
              }
            } else {
              unit.isManualMove = !targetEnemy;
              unit.moveTarget = { x: worldX + offsetX, y: worldY + offsetY };

              if (targetEnemy) {
                // 사용자가 직접 찍은 공격 대상을 최우선 명령으로 기억한다.
                unit.playerOrder = 'attack';
                unit.playerOrderTarget = targetEnemy;
                unit.forcedTarget = targetEnemy;
              } else {
                // 지상 이동 명령 중에는 주변 적에게 멋대로 달려들지 않는다.
                unit.playerOrder = 'move';
                unit.playerOrderTarget = null;
                unit.forcedTarget = null;
              }
            }
          });
        }
        return;
      }

      if (e.button === 0) {
        if (buildMode) { handleBuild(worldX, worldY); return; }
        isDragging = true;
        dragStartScreen = { x: mouseX, y: mouseY };
        dragEndScreen = { x: mouseX, y: mouseY };
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      if (isMinimapDragging) {
        handleMinimapClick(mouseX, mouseY);
      } else if (isDragging) {
        dragEndScreen = { x: mouseX, y: mouseY };
      }
    });

    canvas.addEventListener('mouseup', (e) => {
      if (e.button === 0) {
        isMinimapDragging = false;
        if (isDragging) {
          isDragging = false;
          const x1 = Math.min(dragStartScreen.x, dragEndScreen.x) + camX;
          const x2 = Math.max(dragStartScreen.x, dragEndScreen.x) + camX;
          const y1 = Math.min(dragStartScreen.y, dragEndScreen.y) + camY;
          const y2 = Math.max(dragStartScreen.y, dragEndScreen.y) + camY;

          const dragDist = Math.hypot(dragEndScreen.x - dragStartScreen.x, dragEndScreen.y - dragStartScreen.y);
          const combatTypes = Object.keys(UNIT_SPECS);

          if (dragDist > 8) {
            selectedUnits = entities.filter(ent => 
              ent.faction === 'player' && combatTypes.includes(ent.type) &&
              ent.x >= x1 && ent.x <= x2 && ent.y >= y1 && ent.y <= y2
            );
          } else {
            const clickedUnit = entities.find(ent => 
              ent.faction === 'player' && combatTypes.includes(ent.type) &&
              Math.hypot(ent.x - (dragStartScreen.x + camX), ent.y - (dragStartScreen.y + camY)) <= ent.radius + 6
            );
            selectedUnits = clickedUnit ? [clickedUnit] : [];
          }
        }
      }
    });

    function toggleBuild(type) {
      initAudio();
      resetBuildButtons();
      if (buildMode === type) { buildMode = null; } 
      else { buildMode = type; document.getElementById(`btn-${type}`).classList.add('active-mode'); }
    }

    function resetBuildButtons() {
      ['hq', 'depot', 'barracks', 'academy', 'refinery', 'factory', 'armory', 'starport', 'lab', 'bunker', 'turret'].forEach(t => {
        const btn = document.getElementById(`btn-${t}`);
        if (btn) btn.classList.remove('active-mode');
      });
    }

    function handleBuild(wx, wy) {
      const freeSCV = entities.find(e =>
        e.faction === 'player' &&
        e.type === 'scv' &&
        !e.isBuildingSCV
      );

      if (!freeSCV) {
        showToast("⚠️ 건설 가능한 자유 SCV가 없습니다!");
        buildMode = null;
        resetBuildButtons();
        return;
      }

      const buildTimes = {
        hq: 1200, depot: 450, barracks: 600, academy: 650,
        refinery: 450, factory: 850, armory: 900, starport: 1000,
        lab: 1100, bunker: 550, turret: 500
      };

      const buildCosts = {
        hq: [150, 0], depot: [30, 0], barracks: [40, 0], academy: [50, 0],
        refinery: [30, 0], factory: [60, 20], armory: [70, 30],
        starport: [80, 40], lab: [100, 50], bunker: [45, 0], turret: [35, 0]
      };

      const cost = buildCosts[buildMode];
      if (!cost) {
        buildMode = null;
        resetBuildButtons();
        return;
      }

      if (resources.min < cost[0] || resources.gas < cost[1]) {
        showToast(`⚠️ 자원이 부족합니다! 필요: 💎${cost[0]} / 🌋${cost[1]}`);
        buildMode = null;
        resetBuildButtons();
        return;
      }

      if (buildMode === 'refinery') {
        const gasNode = entities.find(e =>
          e.type === 'resource_gas' &&
          Math.hypot(e.x - wx, e.y - wy) < 50
        );

        if (!gasNode || gasNode.hasRefinery) {
          showToast("⚠️ 가스 간헐천 위에만 제련소를 건설할 수 있습니다!");
          buildMode = null;
          resetBuildButtons();
          return;
        }

        resources.min -= cost[0];
        gasNode.hasRefinery = true;
        startBuildingConstruction('refinery', 'player', gasNode.x, gasNode.y, freeSCV, buildTimes.refinery);
      } else {
        resources.min -= cost[0];
        resources.gas -= cost[1];
        startBuildingConstruction(buildMode, 'player', wx, wy, freeSCV, buildTimes[buildMode]);
      }

      buildMode = null;
      resetBuildButtons();
      updateUI();
    }

    function startBuildingConstruction(type, faction, x, y, scv, maxTime) {
      const b = spawnEntity(type, faction, x, y);
      b.isUnderConstruction = true; 
      b.buildProgress = 0; 
      b.buildMaxTime = maxTime;
      b.builderSCVId = scv ? scv.id : null;
      b.hp = Math.max(1, b.hp || 1);

      if (scv) {
        scv.isBuildingSCV = true; 
        scv.isManualMove = false;
        scv.moveTarget = { x: x, y: y }; 
        scv.cargo = null; 
        scv.mineTimer = 0;
        scv.buildingTargetId = b.id;
      }
    }

    function createSparks(x, y) {
      for (let i = 0; i < 2; i++) {
        sparks.push({
          x: x + (Math.random() - 0.5) * 10,
          y: y + (Math.random() - 0.5) * 10,
          vx: (Math.random() - 0.5) * 3,
          vy: (Math.random() - 0.5) * 3,
          life: 8 + Math.random() * 8,
          color: Math.random() > 0.3 ? '#fcc419' : '#ffffff'
        });
      }
    }

    function produce(unitType) {
      initAudio();
      const c = UNIT_SPECS[unitType];
      if (!c) return;

      const pSupply = getSupplyInfo('player');
      if (pSupply.current + c.supply > pSupply.max) {
        showToast("⚠️ 인구수가 부족합니다! 보급고(Depot)를 건설하세요!");
        return;
      }

      const reqMet = (c.req === true) || (typeof c.req === 'string' && tech[c.req]);
      if (!reqMet || resources.min < c.min || resources.gas < c.gas) return;

      const prodBuilding = entities.find(e => e.faction === 'player' && e.type === c.bType && !e.isUnderConstruction && (!e.productionQueue || e.productionQueue.length < 5));
      if (prodBuilding) {
        resources.min -= c.min; resources.gas -= c.gas;
        if (!prodBuilding.productionQueue) prodBuilding.productionQueue = [];
        prodBuilding.productionQueue.push({ unitType: unitType, progress: 0, maxTime: c.time });
        showToast(`🛠️ ${c.name} 생산 예약됨`);
        playSound('produce', prodBuilding.x, prodBuilding.y);
        updateUI();
      } else {
        showToast("⚠️ 생산 건물이 부족하거나 대기열이 가득 찼습니다!");
      }
    }

    function updateUI() {
      document.getElementById('res-min').innerText = Math.floor(resources.min);
      document.getElementById('res-gas').innerText = Math.floor(resources.gas);
      document.getElementById('wave-num').innerText = wave;

      const pSupply = getSupplyInfo('player');
      document.getElementById('p-supply').innerText = `${pSupply.current}/${pSupply.max}`;

      const aiSupply = getSupplyInfo('enemy');
      document.getElementById('ai-supply').innerText = `${aiSupply.current}/${aiSupply.max}`;
      const aiResMinEl = document.getElementById('ai-res-min');
      const aiResGasEl = document.getElementById('ai-res-gas');
      if (aiResMinEl) aiResMinEl.innerText = Math.floor(resources.enemyMin);
      if (aiResGasEl) aiResGasEl.innerText = Math.floor(resources.enemyGas);

      const playerHQs = entities.filter(e => e.type === 'hq' && e.faction === 'player' && !e.isUnderConstruction);
      document.getElementById('hq-count').innerText = playerHQs.length;

      const enemySquad = entities.filter(e => e.faction === 'enemy' && Object.keys(UNIT_SPECS).includes(e.type));
      document.getElementById('ai-squad').innerText = enemySquad.length;
      
      const aiStateEl = document.getElementById('ai-state-text');
      if (aiStateEl) aiStateEl.innerText = '🟢 AI';

      Object.keys(UNIT_SPECS).forEach(uType => {
        const btn = document.getElementById(`btn-${uType}`);
        if (btn) {
          const spec = UNIT_SPECS[uType];
          const reqOk = (spec.req === true) || tech[spec.req];
          const resOk = resources.min >= spec.min && resources.gas >= spec.gas;
          const supplyOk = (pSupply.current + spec.supply <= pSupply.max);
          btn.disabled = !reqOk || !resOk || !supplyOk;
        }
      });

    function spawnCurvedResources(hqX, hqY, startAngle, endAngle, radius = 140) {
      const count = 7;
      for (let i = 0; i < count; i++) {
        let angle = startAngle + (endAngle - startAngle) * (i / (count - 1));
        let rx = hqX + Math.cos(angle) * radius;
        let ry = hqY + Math.sin(angle) * radius;
        spawnEntity('resource_min', 'neutral', rx, ry);
      }
      let gasAngle = startAngle - 0.3;
      let gx = hqX + Math.cos(gasAngle) * (radius + 20);
      let gy = hqY + Math.sin(gasAngle) * (radius + 20);
      spawnEntity('resource_gas', 'neutral', gx, gy);
    }

    function spawnObstacles() {
      const obsEmojis = ['🪨', '⛰️', '🌋', '🪵'];
      for (let i = 0; i < 30; i++) {
        let ox = Math.random() * (WORLD_W - 400) + 200;
        let oy = Math.random() * (WORLD_H - 400) + 200;
        if (Math.hypot(ox - 350, oy - (WORLD_H - 350)) < 450) continue;
        if (Math.hypot(ox - (WORLD_W - 350), oy - 350) < 450) continue;

        let obs = spawnEntity('obstacle', 'neutral', ox, oy);
        obs.emoji = obsEmojis[Math.floor(Math.random() * obsEmojis.length)];
      }
    }

    function restartGame() {
      document.getElementById('game-over-modal').style.display = 'none';
      initGame();
    }

    function initGame() {
      entities = []; bullets = []; particles = []; sparks = []; selectedUnits = [];
      resources = { min: 20, gas: 0, enemyMin: 20, enemyGas: 0 };
      wave = 1; waveTimer = 0; gameOver = false; window.enemyAITimer = 0;
      enemyAI.initialized = false; enemyAI.phase = 'OPENING'; enemyAI.timer = 0; enemyAI.attackTimer = 0; enemyAI.rallyTimer = 0; enemyAI.attackCount = 0; enemyAI.threatened = false; enemyAI.attackTarget = null; enemyAI.lastAttackSize = 0; enemyAI.rallyPoint = null;
      tech = { barracks: false, academy: false, factory: false, armory: false, starport: false, lab: false };

      const pX = 350, pY = WORLD_H - 350;
      spawnEntity('hq', 'player', pX, pY);
      spawnCurvedResources(pX, pY, -Math.PI * 0.45, Math.PI * 0.05, 140);
      for (let i = 0; i < 5; i++) {
        const scv = spawnEntity('scv', 'player', pX - 50 + (i * 22), pY - 60);
        scv.assignedRes = assignBaseResource(scv, pX, pY, 320);
      }

      const eX = WORLD_W - 350, eY = 350;
      spawnEntity('hq', 'enemy', eX, eY);
      spawnCurvedResources(eX, eY, Math.PI * 0.55, Math.PI * 1.05, 140);
      const eGas = entities.find(e => e.type === 'resource_gas' && Math.hypot(e.x - eX, e.y - eY) < 220);
      if (eGas) { eGas.hasRefinery = true; spawnEntity('refinery', 'enemy', eGas.x, eGas.y); }
      for (let i = 0; i < 5; i++) {
        const scv = spawnEntity('scv', 'enemy', eX - 50 + (i * 22), eY + 60);
        scv.assignedRes = assignEnemyBaseResource(scv);
      }

      spawnCurvedResources(400, 500, 0, Math.PI * 0.5, 120);
      spawnCurvedResources(WORLD_W - 400, WORLD_H - 500, Math.PI, Math.PI * 1.5, 120);
      spawnCurvedResources(WORLD_W / 2 - 300, WORLD_H / 2 - 200, -Math.PI * 0.25, Math.PI * 0.25, 130);
      spawnCurvedResources(WORLD_W / 2 + 300, WORLD_H / 2 + 200, Math.PI * 0.75, Math.PI * 1.25, 130);
      spawnCurvedResources(1100, 1500, Math.PI * 0.2, Math.PI * 0.7, 120);
      spawnCurvedResources(2100, 900, -Math.PI * 0.8, -Math.PI * 0.3, 120);

      spawnObstacles();
      updateUI();
    }

    function updateCamera() {
      const speed = 14;
      if (keys['ArrowLeft'] || keys['KeyA']) camX -= speed;
      if (keys['ArrowRight'] || keys['KeyD']) camX += speed;
      if (keys['ArrowUp'] || keys['KeyW']) camY -= speed;
      if (keys['ArrowDown'] || keys['KeyS']) camY += speed;

      camX = Math.max(0, Math.min(WORLD_W - VIEW_W, camX));
      camY = Math.max(0, Math.min(WORLD_H - VIEW_H, camY));
    }

    // =========================
    // 고전 SC1 스타일 적 AI
    // =========================
    // 실제 스타크래프트 1의 내부 스크립트를 복제하지 않고,
    // "빌드오더 + 상황판단 + 웨이브 공격 + 방어 + 확장" 구조를 재현한다.
    const enemyAI = {
      initialized: false,
      mode: 'BIO_PRESSURE',
      phase: 'OPENING',
      timer: 0,
      attackTimer: 0,
      rallyTimer: 0,
      scoutTimer: 0,
      expansionTimer: 0,
      attackCount: 0,
      lastAttackSize: 0,
      threatened: false,
      rallyPoint: null,
      attackTarget: null
    };

    function enemyTechState() {
      return {
        barracks: entities.some(e => e.faction === 'enemy' && e.type === 'barracks' && !e.isUnderConstruction),
        academy: entities.some(e => e.faction === 'enemy' && e.type === 'academy' && !e.isUnderConstruction),
        factory: entities.some(e => e.faction === 'enemy' && e.type === 'factory' && !e.isUnderConstruction),
        armory: entities.some(e => e.faction === 'enemy' && e.type === 'armory' && !e.isUnderConstruction),
        starport: entities.some(e => e.faction === 'enemy' && e.type === 'starport' && !e.isUnderConstruction),
        lab: entities.some(e => e.faction === 'enemy' && e.type === 'lab' && !e.isUnderConstruction)
      };
    }

    function enemyFreeSCV() {
      return entities.find(e =>
        e.faction === 'enemy' &&
        e.type === 'scv' &&
        !e.isBuildingSCV &&
        !e.isManualMove
      );
    }

    function enemyBuildings(type) {
      return entities.filter(e =>
        e.faction === 'enemy' &&
        e.type === type &&
        !e.isUnderConstruction
      );
    }

    function enemyUnits(type) {
      return entities.filter(e =>
        e.faction === 'enemy' && e.type === type
      );
    }

    function enemyCombatUnits() {
      return entities.filter(e =>
        e.faction === 'enemy' &&
        e.speed > 0 &&
        e.type !== 'scv' &&
        Object.prototype.hasOwnProperty.call(UNIT_SPECS, e.type)
      );
    }

    function playerCombatUnits() {
      return entities.filter(e =>
        e.faction === 'player' &&
        e.speed > 0 &&
        e.type !== 'scv' &&
        Object.prototype.hasOwnProperty.call(UNIT_SPECS, e.type)
      );
    }

    function enemyGetPlayerHQ() {
      return entities.find(e =>
        e.faction === 'player' &&
        e.type === 'hq' &&
        !e.isUnderConstruction
      );
    }

    function enemyBaseHQ() {
      return entities.find(e =>
        e.faction === 'enemy' &&
        e.type === 'hq' &&
        !e.isUnderConstruction
      );
    }

    function enemyCountNear(x, y, radius, faction, combatOnly = false) {
      return entities.filter(e => {
        if (e.faction !== faction) return false;
        if (combatOnly && (e.speed <= 0 || e.type === 'scv')) return false;
        return Math.hypot(e.x - x, e.y - y) <= radius;
      }).length;
    }

    function enemySetState(text) {
      const el = document.getElementById('ai-state-text');
      if (el) el.innerText = text;
    }

    function enemyResetAttackOrders() {
      enemyCombatUnits().forEach(u => {
        u.forcedTarget = null;
        if (u.faction === 'enemy') u.moveTarget = null;
      });
    }

    function enemyAssignRally(point) {
      enemyCombatUnits().forEach(u => {
        u.forcedTarget = null;
        u.moveTarget = { x: point.x, y: point.y };
      });
      enemyAI.rallyPoint = point;
    }

    function enemyChooseAttackTarget(army) {
      const playerHQ = enemyGetPlayerHQ();
      if (!playerHQ || !army.length) return null;

      // 1순위: 전투 중이면 가까운 적 전투 유닛
      const nearbyArmy = playerCombatUnits()
        .filter(u => Math.hypot(u.x - playerHQ.x, u.y - playerHQ.y) <= 700)
        .sort((a, b) =>
          Math.hypot(a.x - army[0].x, a.y - army[0].y) -
          Math.hypot(b.x - army[0].x, b.y - army[0].y)
        );

      if (nearbyArmy.length) return nearbyArmy[0];

      // 2순위: 방어 건물
      const defenses = entities
        .filter(e =>
          e.faction === 'player' &&
          (e.type === 'turret' || e.type === 'bunker')
        )
        .sort((a, b) =>
          Math.hypot(a.x - army[0].x, a.y - army[0].y) -
          Math.hypot(b.x - army[0].x, b.y - army[0].y)
        );

      if (defenses.length) return defenses[0];

      // 3순위: 플레이어 생산/기반 시설
      const structures = entities
        .filter(e =>
          e.faction === 'player' &&
          e.speed === 0 &&
          e.type !== 'resource_min' &&
          e.type !== 'resource_gas' &&
          e.type !== 'obstacle'
        )
        .sort((a, b) =>
          Math.hypot(a.x - army[0].x, a.y - army[0].y) -
          Math.hypot(b.x - army[0].x, b.y - army[0].y)
        );

      return structures[0] || playerHQ;
    }

    function enemyLaunchAttack() {
      const targetHQ = enemyGetPlayerHQ();
      if (!targetHQ) return false;

      const army = enemyCombatUnits();
      const minArmy =
        enemyAI.mode === 'RUSH' ? 5 :
        enemyAI.mode === 'MECH' ? 7 :
        enemyAI.mode === 'AIR' ? 7 : 8;

      if (army.length < minArmy) return false;

      // 공격 전에 적 기지 주변의 플레이어 병력을 확인한다.
      const enemyPower = army.reduce((sum, u) => sum + (u.damage || 1) + (u.maxHp || 1) / 20, 0);
      const playerNearBase = playerCombatUnits().filter(u =>
        Math.hypot(u.x - targetHQ.x, u.y - targetHQ.y) <= 650
      );
      const playerPower = playerNearBase.reduce((sum, u) => sum + (u.damage || 1) + (u.maxHp || 1) / 20, 0);

      // 방어 병력이 훨씬 많으면 바로 꼴아박지 않고 한 번 더 생산한다.
      if (playerNearBase.length >= 5 && playerPower > enemyPower * 1.20) {
        enemyAI.phase = 'REARM';
        enemyAI.rallyPoint = { x: WORLD_W - 750, y: 650 };
        enemyAssignRally(enemyAI.rallyPoint);
        enemySetState('🟡 적 방어 확인 · 재정비');
        return false;
      }

      const rally = {
        x: WORLD_W - 850,
        y: 650
      };

      enemyAssignRally(rally);

      const commitDelay =
        enemyAI.mode === 'RUSH' ? 80 :
        enemyAI.mode === 'MECH' ? 150 :
        enemyAI.mode === 'AIR' ? 130 : 110;

      enemyAI.rallyTimer = commitDelay;
      enemyAI.phase = 'RALLY';
      enemyAI.attackCount++;
      enemyAI.lastAttackSize = army.length;
      enemyAI.attackTimer = 0;
      enemyAI.attackTarget = null;

      enemySetState(`🟠 공격 준비 #${enemyAI.attackCount}`);
      return true;
    }

    function enemyCommitAttack() {
      const targetHQ = enemyGetPlayerHQ();
      if (!targetHQ) return;

      const army = enemyCombatUnits();
      if (!army.length) return;

      const target = enemyChooseAttackTarget(army) || targetHQ;

      army.forEach(u => {
        u.forcedTarget = target;
        u.moveTarget = { x: target.x, y: target.y };
        u.playerOrder = 'none';
        u.playerOrderTarget = null;
      });

      enemyAI.phase = 'ATTACK';
      enemyAI.attackTimer = 0;
      enemyAI.rallyTimer = 0;
      enemyAI.attackTarget = target;
      enemySetState(`🟠 공격 #${enemyAI.attackCount}`);
    }

    function enemyRetreatFromBadFight() {
      const hq = enemyBaseHQ();
      if (!hq) return false;

      const army = enemyCombatUnits();
      const target = enemyAI.attackTarget;
      if (!army.length || !target || target.hp <= 0) return false;

      const localEnemies = playerCombatUnits().filter(u =>
        Math.hypot(u.x - target.x, u.y - target.y) <= 380
      );

      const enemyPower = army.reduce((sum, u) => sum + (u.damage || 1) + (u.maxHp || 1) / 20, 0);
      const localPower = localEnemies.reduce((sum, u) => sum + (u.damage || 1) + (u.maxHp || 1) / 20, 0);

      // 지나치게 불리해지면 후퇴하여 병력 전체를 버리지 않는다.
      if (localEnemies.length >= 4 && localPower > enemyPower * 1.35) {
        const retreatPoint = enemyAI.rallyPoint || { x: WORLD_W - 800, y: 650 };
        army.forEach(u => {
          u.forcedTarget = null;
          u.moveTarget = { x: retreatPoint.x, y: retreatPoint.y };
        });
        enemyAI.phase = 'REARM';
        enemyAI.attackTarget = null;
        enemySetState('🔵 불리한 교전 · 후퇴');
        return true;
      }

      return false;
    }

    function enemyDefendBase() {
      const hq = enemyBaseHQ();
      if (!hq) return;

      const threats = playerCombatUnits()
        .filter(u => Math.hypot(u.x - hq.x, u.y - hq.y) <= 600);

      enemyAI.threatened = threats.length > 0;
      if (!enemyAI.threatened) return;

      const defenders = enemyCombatUnits()
        .sort((a, b) =>
          Math.hypot(a.x - hq.x, a.y - hq.y) -
          Math.hypot(b.x - hq.x, b.y - hq.y)
        )
        .slice(0, Math.max(4, Math.ceil(enemyCombatUnits().length * 0.65)));

      const target = threats[0];
      defenders.forEach(u => {
        u.forcedTarget = target;
        u.moveTarget = { x: target.x, y: target.y };
      });

      enemyAI.phase = 'DEFEND';
      enemySetState('🔵 기지 방어');
    }

    function enemyCanStartBuilding(type) {
      const hq = enemyBaseHQ();
      const scv = enemyFreeSCV();
      if (!hq || !scv) return null;

      const spots = {
        depot: { x: hq.x - 80, y: hq.y + 90 },
        barracks: { x: hq.x - 115, y: hq.y + 70 },
        academy: { x: hq.x - 125, y: hq.y - 55 },
        factory: { x: hq.x - 135, y: hq.y - 105 },
        armory: { x: hq.x - 200, y: hq.y - 30 },
        starport: { x: hq.x - 190, y: hq.y + 105 },
        lab: { x: hq.x - 210, y: hq.y + 155 },
        bunker: { x: hq.x - 65, y: hq.y + 150 },
        turret: { x: hq.x - 55, y: hq.y + 185 }
      };

      return spots[type] ? { scv, pos: spots[type] } : null;
    }

    function enemyBuild(type, minCost, gasCost = 0, time = 500) {
      if (resources.enemyMin < minCost || resources.enemyGas < gasCost) return false;

      const plan = enemyCanStartBuilding(type);
      if (!plan) return false;

      // Avoid stacking duplicate construction orders.
      const already = entities.some(e =>
        e.faction === 'enemy' &&
        e.type === type &&
        e.isUnderConstruction
      );
      if (already) return false;

      resources.enemyMin -= minCost;
      resources.enemyGas -= gasCost;
      startBuildingConstruction(type, 'enemy', plan.pos.x, plan.pos.y, plan.scv, time);
      return true;
    }

    function enemyProduce(unitType, maxQueue = 2) {
      const spec = UNIT_SPECS[unitType];
      if (!spec) return false;

      const supply = getSupplyInfo('enemy');
      if (supply.current + spec.supply > supply.max) return false;
      if (resources.enemyMin < spec.min || resources.enemyGas < spec.gas) return false;

      const candidates = entities.filter(e =>
        e.faction === 'enemy' &&
        e.type === spec.bType &&
        !e.isUnderConstruction &&
        (!e.productionQueue || e.productionQueue.length < maxQueue)
      );

      if (!candidates.length) return false;

      const b = candidates[0];
      resources.enemyMin -= spec.min;
      resources.enemyGas -= spec.gas;

      if (!b.productionQueue) b.productionQueue = [];
      b.productionQueue.push({
        unitType,
        progress: 0,
        maxTime: spec.time
      });
      return true;
    }

    function enemyChooseMode() {
      // Classic-style preset strategy selection:
      // easy = safer bio, normal = pressure/mech mix, hard = aggressive opening.
      const r = Math.random();

      if (currentDifficulty === DIFFICULTY_SETTINGS.EASY) {
        enemyAI.mode = r < 0.70 ? 'BIO_PRESSURE' : 'MECH';
      } else if (currentDifficulty === DIFFICULTY_SETTINGS.HARD) {
        enemyAI.mode = r < 0.45 ? 'RUSH' : (r < 0.80 ? 'MECH' : 'AIR');
      } else {
        enemyAI.mode = r < 0.50 ? 'BIO_PRESSURE' : (r < 0.82 ? 'MECH' : 'AIR');
      }
    }

    function updateHumanlikeAI() {
      const hq = enemyBaseHQ();
      const playerHQ = enemyGetPlayerHQ();
      if (!hq || !playerHQ) return;

      if (!enemyAI.initialized) {
        enemyAI.initialized = true;
        enemyAI.timer = 0;
        enemyAI.attackTimer = 0;
        enemyAI.attackCount = 0;
        enemyChooseMode();
      }

      enemyAI.timer++;

      // Keep every free SCV working at the home mineral/gas line.
      entities.filter(e => e.faction === 'enemy' && e.type === 'scv').forEach(scv => {
        if (scv.isBuildingSCV || scv.isManualMove || scv.isConstructing) return;
        if (!scv.assignedRes ||
            scv.assignedRes.amount <= 0 ||
            Math.hypot(scv.assignedRes.x - hq.x, scv.assignedRes.y - hq.y) > 360) {
          assignEnemyBaseResource(scv);
        }
      });

      // React immediately to an early attack.
      enemyDefendBase();

      // The strategic controller thinks in chunky ticks, like a script-driven AI.
      const thinkInterval = currentDifficulty.buildInterval;
      if (enemyAI.timer % thinkInterval !== 0) {
        if (enemyAI.phase === 'RALLY' && enemyAI.rallyTimer > 0) {
          enemyAI.rallyTimer--;
          if (enemyAI.rallyTimer === 0) enemyCommitAttack();
        }
        return;
      }

      const tech = enemyTechState();
      const supply = getSupplyInfo('enemy');
      const scvCount = enemyUnits('scv').length;
      const marines = enemyUnits('marine').length;
      const medics = enemyUnits('medic').length;
      const tanks = enemyUnits('tank').length;
      const mechs = enemyUnits('mech').length;
      const fighters = enemyUnits('fighter').length;
      const combatCount = enemyCombatUnits().length;

      // 1. Supply management — very high priority.
      if (supply.current + 2 >= supply.max && resources.enemyMin >= 30) {
        if (enemyBuild('depot', 30, 0, 450)) {
          enemySetState('🏠 보급고 증설');
          return;
        }
      }

      // 2. Worker production: maintain a growing economy.
      const workerTarget =
        enemyAI.mode === 'RUSH' ? 8 :
        enemyAI.mode === 'BIO_PRESSURE' ? 14 :
        enemyAI.mode === 'MECH' ? 16 : 18;

      if (scvCount < workerTarget && resources.enemyMin >= 20) {
        if (enemyProduce('scv', 2)) {
          enemySetState('⛏️ SCV 생산');
          return;
        }
      }

      // 3. Opening build order.
      if (!tech.barracks && resources.enemyMin >= 40) {
        if (enemyBuild('barracks', 40, 0, 600)) {
          enemySetState('🏭 병영 건설');
          return;
        }
      }

      // 4. Defensive infrastructure when player is approaching.
      if (enemyAI.threatened && resources.enemyMin >= 45) {
        const bunkerCount = enemyBuildings('bunker').length +
          entities.filter(e => e.faction === 'enemy' && e.type === 'bunker' && e.isUnderConstruction).length;
        if (bunkerCount < 2) {
          if (enemyBuild('bunker', 45, 0, 550)) {
            enemySetState('🛡️ 방어선 구축');
            return;
          }
        }
      }

      // 5. Bio path: academy, additional barracks, medics and sustained marines.
      if (enemyAI.mode === 'BIO_PRESSURE' || enemyAI.mode === 'RUSH') {
        if (tech.barracks && !tech.academy && resources.enemyMin >= 50) {
          if (enemyBuild('academy', 50, 0, 650)) {
            enemySetState('🎓 사관학교 건설');
            return;
          }
        }

        if (tech.barracks && enemyBuildings('barracks').length < 2 && resources.enemyMin >= 40) {
          if (enemyBuild('barracks', 40, 0, 600)) {
            enemySetState('🏭 추가 병영');
            return;
          }
        }

        if (tech.barracks && resources.enemyMin >= 15) {
          if (enemyProduce('marine', 3)) {
            enemySetState('🪖 보병 생산');
            return;
          }
        }

        if (tech.academy && marines >= 4 && medics < Math.max(1, Math.floor(marines / 5)) && resources.enemyMin >= 25) {
          if (enemyProduce('medic', 2)) {
            enemySetState('🏥 의무병 생산');
            return;
          }
        }
      }

      // 6. Mech path: refinery is already present; transition through factory.
      if (enemyAI.mode === 'MECH' || combatCount >= 10) {
        if (tech.barracks && !tech.factory && resources.enemyMin >= 60 && resources.enemyGas >= 20) {
          if (enemyBuild('factory', 60, 20, 850)) {
            enemySetState('⚙️ 공장 전환');
            return;
          }
        }

        if (tech.factory && !tech.armory && resources.enemyMin >= 70 && resources.enemyGas >= 30) {
          if (enemyBuild('armory', 70, 30, 900)) {
            enemySetState('⚔️ 무기고 건설');
            return;
          }
        }

        if (tech.factory && resources.enemyMin >= 60 && resources.enemyGas >= 10) {
          if (enemyProduce('tank', 2)) {
            enemySetState('🚜 전차 생산');
            return;
          }
        }

        if (tech.factory && resources.enemyMin >= 50 && resources.enemyGas >= 15) {
          if (enemyProduce('mech', 2)) {
            enemySetState('🤖 메카 생산');
            return;
          }
        }
      }

      // 7. Air transition in the late game.
      if (enemyAI.mode === 'AIR' || (combatCount >= 18 && tech.factory)) {
        if (tech.factory && !tech.starport && resources.enemyMin >= 80 && resources.enemyGas >= 40) {
          if (enemyBuild('starport', 80, 40, 1000)) {
            enemySetState('🛫 우주항 건설');
            return;
          }
        }

        if (tech.starport && resources.enemyMin >= 30) {
          if (enemyProduce('fighter', 2)) {
            enemySetState('🚀 전투기 생산');
            return;
          }
        }
      }

      // 8. Defensive sensor/technology building in the late game.
      if (tech.starport && !tech.lab && resources.enemyMin >= 100 && resources.enemyGas >= 50) {
        if (enemyBuild('lab', 100, 50, 1100)) {
          enemySetState('🔬 연구소 건설');
          return;
        }
      }

      // 9. Expansion when the first base becomes economically mature.
      const hqCount = enemyBuildings('hq').length;
      const underHQ = entities.filter(e =>
        e.faction === 'enemy' && e.type === 'hq' && e.isUnderConstruction
      ).length;

      const shouldExpand =
        hqCount < 2 &&
        underHQ === 0 &&
        resources.enemyMin >= 150 &&
        scvCount >= 12 &&
        combatCount >= (enemyAI.mode === 'RUSH' ? 6 : 8);

      if (shouldExpand) {
        const expansionSpots = [
          { x: WORLD_W - 800, y: 500 },
          { x: WORLD_W - 800, y: 900 },
          { x: WORLD_W / 2 + 500, y: WORLD_H / 2 - 400 }
        ];

        const spot = expansionSpots[0];
        const free = enemyFreeSCV();

        if (free) {
          resources.enemyMin -= 150;
          startBuildingConstruction('hq', 'enemy', spot.x, spot.y, free, 1200);
          enemySetState('🏰 멀티 확보');
          return;
        }
      }

      // 10. Attack scheduling — periodic waves, not constant unit-by-unit suicide.
      if (!enemyAI.threatened) {
        const army = enemyCombatUnits();
        const minArmy =
          enemyAI.mode === 'RUSH' ? 4 :
          enemyAI.mode === 'MECH' ? 6 :
          enemyAI.mode === 'AIR' ? 7 : 8;

        const attackCooldown =
          enemyAI.mode === 'RUSH' ? 520 :
          enemyAI.mode === 'BIO_PRESSURE' ? 760 :
          enemyAI.mode === 'MECH' ? 920 : 850;

        if (enemyAI.phase !== 'RALLY' &&
            enemyAI.phase !== 'ATTACK' &&
            enemyAI.phase !== 'REARM' &&
            army.length >= minArmy &&
            enemyAI.attackTimer >= attackCooldown) {
          if (enemyLaunchAttack()) return;
        }
      }

      // 11. Rally/attack lifecycle.
      if (enemyAI.phase === 'ATTACK') {
        enemyAI.attackTimer += thinkInterval;

        const target = enemyAI.attackTarget;
        const remaining = enemyCombatUnits();

        if (!remaining.length) {
          enemyAI.phase = 'OPENING';
          enemyAI.attackTimer = 0;
          enemyAI.attackTarget = null;
          return;
        }

        // 큰 손실이 나면 전멸할 때까지 돌진하지 않고 후퇴한다.
        if (enemyRetreatFromBadFight()) {
          return;
        }

        // 목표가 파괴되었다면 바로 다음 목표를 선택한다.
        if (!target || target.hp <= 0) {
          const nextTarget = enemyChooseAttackTarget(remaining);
          if (nextTarget) {
            enemyAI.attackTarget = nextTarget;
            remaining.forEach(u => {
              u.forcedTarget = nextTarget;
              u.moveTarget = { x: nextTarget.x, y: nextTarget.y };
            });
          } else {
            enemyAI.phase = 'REARM';
          }
        }

        // 초기 공격대의 40% 이하로 줄면 본진으로 재편성.
        if (remaining.length <= Math.max(2, Math.floor(enemyAI.lastAttackSize * 0.40))) {
          const regroup = enemyAI.rallyPoint || { x: WORLD_W - 800, y: 650 };
          remaining.forEach(u => {
            u.forcedTarget = null;
            u.moveTarget = { x: regroup.x, y: regroup.y };
          });
          enemyAI.phase = 'REARM';
          enemyAI.attackTarget = null;
          enemySetState('🟡 공격 중단 · 재편성');
          return;
        }

        // 일정 간격으로 전투 상황을 다시 평가한다.
        if (enemyAI.attackTimer % 180 === 0) {
          const bestTarget = enemyChooseAttackTarget(remaining);
          if (bestTarget && bestTarget !== enemyAI.attackTarget) {
            enemyAI.attackTarget = bestTarget;
            remaining.forEach(u => {
              u.forcedTarget = bestTarget;
              u.moveTarget = { x: bestTarget.x, y: bestTarget.y };
            });
          }
        }
      } else if (enemyAI.phase === 'RALLY') {
        if (enemyAI.rallyTimer > 0) {
          enemyAI.rallyTimer -= thinkInterval;
          if (enemyAI.rallyTimer <= 0) enemyCommitAttack();
        }
      } else if (enemyAI.phase === 'REARM') {
        const regroup = enemyAI.rallyPoint || { x: WORLD_W - 800, y: 650 };
        const armyNow = enemyCombatUnits();

        armyNow.forEach(u => {
          if (!u.forcedTarget) {
            u.moveTarget = { x: regroup.x, y: regroup.y };
          }
        });

        // 재편성 후 전투력이 충분해지면 다시 공격을 시도한다.
        if (armyNow.length >= minArmy + 1 &&
            enemyAI.attackTimer >= attackCooldown + 180) {
          enemyAI.phase = 'OPENING';
        }
      }

      if (enemyAI.phase !== 'ATTACK') {
        enemyAI.attackTimer += thinkInterval;
      }

      // 12. Keep the main state understandable in the UI.
      if (enemyAI.phase === 'OPENING') {
        enemySetState(
          enemyAI.mode === 'RUSH' ? '🟢 러시 준비' :
          enemyAI.mode === 'MECH' ? '🟢 메카 준비' :
          enemyAI.mode === 'AIR' ? '🟢 공중 준비' :
          '🟢 병력 준비'
        );
      }
    }

    function updateGameLogic() {
      if (gameOver) return;

      updateCamera();
      updateHumanlikeAI();

      tech.barracks = entities.some(e => e.faction === 'player' && e.type === 'barracks' && !e.isUnderConstruction);
      tech.academy = entities.some(e => e.faction === 'player' && e.type === 'academy' && !e.isUnderConstruction);
      tech.factory = entities.some(e => e.faction === 'player' && e.type === 'factory' && !e.isUnderConstruction);
      tech.armory = entities.some(e => e.faction === 'player' && e.type === 'armory' && !e.isUnderConstruction);
      tech.starport = entities.some(e => e.faction === 'player' && e.type === 'starport' && !e.isUnderConstruction);
      tech.lab = entities.some(e => e.faction === 'player' && e.type === 'lab' && !e.isUnderConstruction);

      entities.forEach(ent => {
        if (ent.productionQueue && ent.productionQueue.length > 0) {
          let item = ent.productionQueue[0];
          item.progress++;
          if (item.progress >= item.maxTime) {
            const produced = spawnEntity(
              item.unitType,
              ent.faction,
              ent.x + (Math.random() - 0.5) * 30,
              ent.y + ent.radius + 15
            );
            if (produced.type === 'scv' && produced.faction === 'enemy') {
              assignEnemyBaseResource(produced);
            } else if (produced.type === 'scv' && produced.faction === 'player') {
              assignBaseResource(produced, 350, WORLD_H - 350, 320);
            }
            ent.productionQueue.shift();
            playSound('produce', ent.x, ent.y);
          }
        }

        if (ent.type === 'scv') {
          if (ent.isBuildingSCV && ent.buildingTargetId) {
            const b = entities.find(e => e.id === ent.buildingTargetId);
            if (b && b.isUnderConstruction) {
              const dist = Math.hypot(b.x - ent.x, b.y - ent.y);
              if (dist > b.radius + 10) {
                const angle = Math.atan2(b.y - ent.y, b.x - ent.x);
                ent.x += Math.cos(angle) * ent.speed;
                ent.y += Math.sin(angle) * ent.speed;
              } else {
                createSparks(ent.x, ent.y);
                b.buildProgress++;
                b.hp = Math.min(b.maxHp, Math.floor((b.buildProgress / b.buildMaxTime) * b.maxHp));
                if (b.buildProgress >= b.buildMaxTime) {
                  b.isUnderConstruction = false;
                  b.hp = b.maxHp;
                  ent.isBuildingSCV = false;
                  ent.buildingTargetId = null;
                  ent.moveTarget = null;
                  ent.cargo = null;
                  ent.mineTimer = 0;

                  // 건설이 끝난 SCV는 즉시 기지 주변 자원 채굴로 복귀
                  if (ent.faction === 'player') {
                    const hq = entities.find(h =>
                      h.faction === 'player' && h.type === 'hq' && !h.isUnderConstruction
                    );
                    ent.assignedRes = hq
                      ? assignBaseResource(ent, hq.x, hq.y, 360)
                      : assignBestResource(ent);
                  } else {
                    ent.assignedRes = assignEnemyBaseResource(ent);
                  }

                  showToast("🏗️ 건물 건설 완료!");
                }
              }
            } else {
              ent.isBuildingSCV = false;
              ent.buildingTargetId = null;
            }
          } else if (!ent.isManualMove) {
            // 적 SCV가 플레이어 영역의 자원을 훔치지 못하도록 제한 (적 진영 반경 800 이내 자원만 채굴)
            if (ent.faction === 'enemy') {
              if (!ent.assignedRes || Math.hypot(ent.assignedRes.x - (WORLD_W - 350), ent.assignedRes.y - 350) > 800) {
                ent.assignedRes = entities.find(r => 
                  (r.type === 'resource_min' || (r.type === 'resource_gas' && r.hasRefinery)) &&
                  r.amount > 0 && Math.hypot(r.x - (WORLD_W - 350), r.y - 350) <= 800
                );
              }
            } else {
              // 플레이어 SCV는 자원이 유효하지 않거나 한곳에 몰려 있을 때 가장 적절한 자원으로 분산 할당
              if (!ent.assignedRes || ent.assignedRes.amount <= 0) {
                const playerHQ = entities.find(h => h.faction === 'player' && h.type === 'hq' && !h.isUnderConstruction);
                if (playerHQ) ent.assignedRes = assignBaseResource(ent, playerHQ.x, playerHQ.y, 360);
                if (!ent.assignedRes) ent.assignedRes = assignBestResource(ent);
              }
            }

            if (ent.assignedRes && ent.assignedRes.amount > 0) {
              const res = ent.assignedRes;
              if (!ent.cargo) {
                const dist = Math.hypot(res.x - ent.x, res.y - ent.y);
                if (dist > res.radius + 5) {
                  const angle = Math.atan2(res.y - ent.y, res.x - ent.x);
                  ent.x += Math.cos(angle) * ent.speed;
                  ent.y += Math.sin(angle) * ent.speed;
                } else {
                  ent.mineTimer++;
                  if (ent.mineTimer >= 40) {
                    ent.cargo = res.resType;
                    res.amount -= 8;
                    ent.mineTimer = 0;
                    playSound('mine', ent.x, ent.y);
                  }
                }
              } else {
                const hq = entities.find(h => h.faction === ent.faction && h.type === 'hq' && !h.isUnderConstruction);
                if (hq) {
                  const dist = Math.hypot(hq.x - ent.x, hq.y - ent.y);
                  if (dist > hq.radius + 5) {
                    const angle = Math.atan2(hq.y - ent.y, hq.x - ent.x);
                    ent.x += Math.cos(angle) * ent.speed;
                    ent.y += Math.sin(angle) * ent.speed;
                  } else {
                    if (ent.cargo === 'min') {
                      if (ent.faction === 'player') resources.min += 10;
                      else resources.enemyMin += 10 * currentDifficulty.aiGatherRate;
                    } else if (ent.cargo === 'gas') {
                      if (ent.faction === 'player') resources.gas += 8;
                      else resources.enemyGas += 8 * currentDifficulty.aiGatherRate;
                    }
                    ent.cargo = null;
                    
                    // 자원 납품 후 더 한가한 자원으로 자동 분산 재배치
                    if (ent.faction === 'player') {
                      ent.assignedRes = assignBestResource(ent);
                    }
                  }
                }
              }
            }
          } else if (ent.moveTarget) {
            const dist = Math.hypot(ent.moveTarget.x - ent.x, ent.moveTarget.y - ent.y);
            if (dist > 3) {
              const angle = Math.atan2(ent.moveTarget.y - ent.y, ent.moveTarget.x - ent.x);
              ent.x += Math.cos(angle) * ent.speed;
              ent.y += Math.sin(angle) * ent.speed;
            } else {
              ent.moveTarget = null;
            }
          }
        }

        const isStaticDefender = (ent.type === 'turret' || ent.type === 'bunker');

        if ((ent.speed > 0 && ent.type !== 'scv') || isStaticDefender) {
          let target = ent.forcedTarget;

          // =========================
          // 플레이어 명령 우선순위
          // =========================
          if (ent.faction === 'player' && !isStaticDefender) {
            if (ent.playerOrder === 'attack') {
              // 직접 지정한 대상이 살아있는 동안 절대로 주변의 다른 적을 우선하지 않는다.
              target = ent.playerOrderTarget;
              ent.forcedTarget = target;

              if (!target || target.hp <= 0) {
                ent.playerOrder = 'none';
                ent.playerOrderTarget = null;
                ent.forcedTarget = null;
                target = null;
              }
            } else if (ent.playerOrder === 'move') {
              // 이동 명령은 주변 적 자동 공격보다 우선한다.
              target = null;
              ent.forcedTarget = null;
            }
          }

          // =========================
          // AI / 자동 전투
          // =========================
          if ((!target || target.hp <= 0) &&
              !(ent.faction === 'player' && ent.playerOrder === 'move') &&
              !(ent.faction === 'player' && ent.playerOrder === 'attack')) {

            ent.forcedTarget = null;

            const opp = (ent.faction === 'player') ? 'enemy' : 'player';
            let nearest = null;
            let nearestDist = Infinity;

            entities.forEach(candidate => {
              if (candidate === ent || candidate.faction !== opp || candidate.hp <= 0) return;
              const dist = Math.hypot(candidate.x - ent.x, candidate.y - ent.y);
              if (dist <= ent.attackRange && dist < nearestDist) {
                nearest = candidate;
                nearestDist = dist;
              }
            });

            target = nearest;

            // AI 집결 단계에서는 멋대로 전투에 끌려가지 않고 집결 명령을 우선한다.
            if (!target && ent.faction === 'enemy' &&
                enemyAI.phase === 'RALLY') {
              target = null;
            }
          }

          if (target && target.hp > 0) {
            const dist = Math.hypot(target.x - ent.x, target.y - ent.y);

            if (!isStaticDefender && dist > ent.attackRange) {
              const angle = Math.atan2(target.y - ent.y, target.x - ent.x);
              ent.x += Math.cos(angle) * ent.speed;
              ent.y += Math.sin(angle) * ent.speed;
            } else if (dist <= ent.attackRange && ent.cooldown <= 0) {
              target.hp -= ent.damage;
              ent.cooldown = ent.cooldownMax;

              bullets.push({
                x: ent.x,
                y: ent.y,
                tx: target.x,
                ty: target.y,
                life: 6
              });

              playSound('laser', ent.x, ent.y);
              if (target.hp <= 0) {
                playSound('explode', target.x, target.y);

                if (ent.faction === 'player' && ent.playerOrderTarget === target) {
                  ent.playerOrder = 'none';
                  ent.playerOrderTarget = null;
                  ent.forcedTarget = null;
                }
              }
            }
          } else if (!isStaticDefender && ent.moveTarget) {
            const dist = Math.hypot(ent.moveTarget.x - ent.x, ent.moveTarget.y - ent.y);
            if (dist > 4) {
              const angle = Math.atan2(ent.moveTarget.y - ent.y, ent.moveTarget.x - ent.x);
              ent.x += Math.cos(angle) * ent.speed;
              ent.y += Math.sin(angle) * ent.speed;
            } else {
              ent.moveTarget = null;

              if (ent.faction === 'player' && ent.playerOrder === 'move') {
                ent.playerOrder = 'none';
              }
            }
          }
        }

        if (ent.cooldown > 0) ent.cooldown--;
      });

      for (let i = sparks.length - 1; i >= 0; i--) {
        let p = sparks[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) sparks.splice(i, 1);
      }

      entities = entities.filter(e => e.hp > 0 || e.isUnderConstruction || e.type.startsWith('resource_') || e.type === 'obstacle');

      const pMaxHQ = entities.some(e => e.faction === 'player' && e.type === 'hq');
      const eMaxHQ = entities.some(e => e.faction === 'enemy' && e.type === 'hq');
      if (!pMaxHQ && !gameOver) {
        gameOver = true;
        document.getElementById('game-over-title').innerText = '💥 패배했습니다!';
        document.getElementById('game-over-modal').style.display = 'block';
      } else if (!eMaxHQ && !gameOver) {
        gameOver = true;
        document.getElementById('game-over-title').innerText = '🎉 승리했습니다!';
        document.getElementById('game-over-modal').style.display = 'block';
      }

      updateUI();
    }

    function render() {
      ctx.clearRect(0, 0, VIEW_W, VIEW_H);

      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      const startX = -(camX % 40);
      const startY = -(camY % 40);
      for (let x = startX; x < VIEW_W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, VIEW_H); ctx.stroke();
      }
      for (let y = startY; y < VIEW_H; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(VIEW_W, y); ctx.stroke();
      }

      const buildings = entities.filter(e => e.speed === 0);
      const units = entities.filter(e => e.speed > 0);

      buildings.forEach(e => {
        const sx = e.x - camX;
        const sy = e.y - camY;
        if (sx < -50 || sx > VIEW_W + 50 || sy < -50 || sy > VIEW_H + 50) return;

        ctx.font = `${e.radius * 1.5}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(e.emoji, sx, sy);

        if (e.isUnderConstruction) {
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(sx - 20, sy - e.radius - 12, 40, 6);
          ctx.fillStyle = '#4dadf7';
          ctx.fillRect(sx - 20, sy - e.radius - 12, (e.buildProgress / e.buildMaxTime) * 40, 6);
        } else if (e.maxHp && e.hp < e.maxHp) {
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(sx - 15, sy - e.radius - 8, 30, 4);
          ctx.fillStyle = '#51cf66';
          ctx.fillRect(sx - 15, sy - e.radius - 8, (e.hp / e.maxHp) * 30, 4);
        }
      });

      units.forEach(e => {
        const sx = e.x - camX;
        const sy = e.y - camY;
        if (sx < -50 || sx > VIEW_W + 50 || sy < -50 || sy > VIEW_H + 50) return;

        if (selectedUnits.includes(e)) {
          ctx.strokeStyle = '#51cf66';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(sx, sy, e.radius + 3, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.font = `${e.radius * 1.5}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(e.emoji, sx, sy);

        if (e.hp < e.maxHp) {
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(sx - 12, sy - e.radius - 6, 24, 3);
          ctx.fillStyle = '#51cf66';
          ctx.fillRect(sx - 12, sy - e.radius - 6, (e.hp / e.maxHp) * 24, 3);
        }
      });

      sparks.forEach(p => {
        const sx = p.x - camX;
        const sy = p.y - camY;
        ctx.fillStyle = p.color;
        ctx.fillRect(sx, sy, 2.5, 2.5);
      });

      bullets.forEach((b, idx) => {
        ctx.strokeStyle = '#ffec99';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(b.x - camX, b.y - camY);
        ctx.lineTo(b.tx - camX, b.ty - camY);
        ctx.stroke();
        b.life--;
        if (b.life <= 0) bullets.splice(idx, 1);
      });

      if (isDragging) {
        ctx.strokeStyle = '#4dadf7';
        ctx.fillStyle = 'rgba(77, 173, 247, 0.15)';
        ctx.lineWidth = 1;
        const w = dragEndScreen.x - dragStartScreen.x;
        const h = dragEndScreen.y - dragStartScreen.y;
        ctx.fillRect(dragStartScreen.x, dragStartScreen.y, w, h);
        ctx.strokeRect(dragStartScreen.x, dragStartScreen.y, w, h);
      }

      const mmW = 160, mmH = 120;
      const mmX = VIEW_W - mmW - 10;
      const mmY = VIEW_H - mmH - 10;

      ctx.fillStyle = 'rgba(5, 7, 10, 0.85)';
      ctx.fillRect(mmX, mmY, mmW, mmH);
      ctx.strokeStyle = '#30363d';
      ctx.strokeRect(mmX, mmY, mmW, mmH);

      entities.forEach(e => {
        const mx = mmX + (e.x / WORLD_W) * mmW;
        const my = mmY + (e.y / WORLD_H) * mmH;
        ctx.fillStyle = (e.faction === 'player') ? '#4dadf7' : (e.faction === 'enemy') ? '#ff6b6b' : '#fcc419';
        ctx.fillRect(mx - 1, my - 1, 2, 2);
      });

      const vx = mmX + (camX / WORLD_W) * mmW;
      const vy = mmY + (camY / WORLD_H) * mmH;
      const vw = (VIEW_W / WORLD_W) * mmW;
      const vh = (VIEW_H / WORLD_H) * mmH;
      ctx.strokeStyle = '#ffffff';
      ctx.strokeRect(vx, vy, vw, vh);
    }

    function gameLoop() {
      updateGameLogic();
      render();
      requestAnimationFrame(gameLoop);
    }

    initGame();
    gameLoop();
  </script>
</body>
