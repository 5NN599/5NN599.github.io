<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미니지 - RTS</title>
  <style>
    :root { --bg: #f8f9fa; --text: #333; --canvas-bg: #05070a; --border: #e9ecef; --btn-bg: #fff; }
    [data-theme="dark"] { --bg: #0d1117; --text: #c9d1d9; --canvas-bg: #020305; --border: #30363d; --btn-bg: #21262d; }
    [data-theme="beige"] { --bg: #f5ebe0; --text: #4e3d30; --canvas-bg: #14100c; --border: #ddcbbb; --btn-bg: #eddfd0; }
    body { background-color: var(--bg) !important; color: var(--text) !important; text-align: center; font-family: sans-serif; padding-top: 10px; margin: 0; transition: 0.3s; overflow-x: hidden; user-select: none; }
    button { background-color: var(--btn-bg) !important; color: var(--text) !important; border: 1px solid var(--border) !important; padding: 6px 12px; font-size: 0.85rem; border-radius: 8px; cursor: pointer; margin: 3px; font-weight: bold; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #rts-panel { font-size: 1.1rem; font-weight: bold; color: #fcc419; margin-bottom: 4px; }
    .build-bar { margin: 6px 0; }
    .active-mode { border: 2px solid #4dadf7 !important; background-color: #183153 !important; color: #fff !important; }
    #game-canvas { background: var(--canvas-bg); border: 2px solid var(--border); border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); cursor: default; }
    .help-text { font-size: 0.8rem; opacity: 0.8; margin-top: 3px; }
  </style>
</head>
<body>
  <h1>⚔️ 우주 전쟁: 미니 RTS 완전판</h1>
  
  <div id="rts-panel">
    💎 광물: <span id="res-min">50</span> | 🌋 가스: <span id="res-gas">0</span> | 🌊 웨이브: <span id="wave-num">1</span> | 🏰 아군HQ: <span id="hp-player">500</span> | 🏯 적군HQ: <span id="hp-enemy">500</span>
  </div>

  <div class="build-bar">
    <button id="btn-barracks" onclick="toggleBuild('barracks')">🏭 병영 (💎40)</button>
    <button id="btn-refinery" onclick="toggleBuild('refinery')">🌋 제련소 (💎30)</button>
    <button id="btn-turret" onclick="toggleBuild('turret')">📡 터렛 (💎35)</button>
    <button id="btn-scv" onclick="produceSCV()">🛸 SCV (💎20)</button>
    <button id="btn-fighter" onclick="produceFighter()" disabled>🚀 전투기 (💎30)</button>
    <button id="btn-cruiser" onclick="produceCruiser()" disabled>🛩️ 중순양함 (💎50/🌋15)</button>
  </div>

  <canvas id="game-canvas" width="600" height="440"></canvas>
  <div class="help-text">WASD/방향키: 이동 | 좌클릭 드래그: 유닛 다중 선택 | 우클릭: 이동/어택 명령</div>

  <script>
    const savedTheme = localStorage.getItem('minig-theme');
    if (savedTheme && savedTheme !== 'white') { document.documentElement.setAttribute('data-theme', savedTheme); }

    const WORLD_W = 1500;
    const WORLD_H = 1100;
    const VIEW_W = 600;
    const VIEW_H = 440;

    let camX = 0;
    let camY = WORLD_H - VIEW_H;

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    let resources = { min: 50, gas: 0, enemyMin: 50, enemyGas: 0 };
    let wave = 1;
    let waveTimer = 0;
    let buildMode = null;
    let hasBarracks = false;
    let gameOver = false;

    let entities = [];
    let bullets = [];
    let particles = [];
    let selectedUnits = [];
    let keys = {};

    let isDragging = false;
    let dragStartScreen = { x: 0, y: 0 };
    let dragEndScreen = { x: 0, y: 0 };

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
    }

    function playSound(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'produce') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.start(now); osc.stop(now + 0.12);
        } else if (type === 'laser') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(750, now);
          osc.frequency.exponentialRampToValueAtTime(180, now + 0.08);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'explode') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(25, now + 0.22);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
          osc.start(now); osc.stop(now + 0.22);
        }
      } catch (e) {}
    }

    window.addEventListener('keydown', (e) => { keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    canvas.addEventListener('mousedown', (e) => {
      initAudio();
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      const worldX = mouseX + camX;
      const worldY = mouseY + camY;

      if (e.button === 2) {
        if (selectedUnits.length > 0) {
          selectedUnits.forEach((unit, idx) => {
            const offsetX = (idx % 3 - 1) * 20;
            const offsetY = (Math.floor(idx / 3) - 1) * 20;
            unit.moveTarget = { x: worldX + offsetX, y: worldY + offsetY };
          });
        }
        return;
      }

      if (e.button === 0) {
        if (buildMode) {
          handleBuild(worldX, worldY);
          return;
        }
        isDragging = true;
        dragStartScreen = { x: mouseX, y: mouseY };
        dragEndScreen = { x: mouseX, y: mouseY };
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const rect = canvas.getBoundingClientRect();
        dragEndScreen = {
          x: e.clientX - rect.left,
          y: e.clientY - rect.top
        };
      }
    });

    canvas.addEventListener('mouseup', (e) => {
      if (e.button === 0 && isDragging) {
        isDragging = false;
        const x1 = Math.min(dragStartScreen.x, dragEndScreen.x) + camX;
        const x2 = Math.max(dragStartScreen.x, dragEndScreen.x) + camX;
        const y1 = Math.min(dragStartScreen.y, dragEndScreen.y) + camY;
        const y2 = Math.max(dragStartScreen.y, dragEndScreen.y) + camY;

        const dragDist = Math.hypot(dragEndScreen.x - dragStartScreen.x, dragEndScreen.y - dragStartScreen.y);

        if (dragDist > 10) {
          selectedUnits = entities.filter(ent => 
            ent.faction === 'player' && 
            (ent.type === 'fighter' || ent.type === 'cruiser') &&
            ent.x >= x1 && ent.x <= x2 && ent.y >= y1 && ent.y <= y2
          );
        } else {
          const clickedUnit = entities.find(ent => 
            ent.faction === 'player' && 
            (ent.type === 'fighter' || ent.type === 'cruiser') &&
            Math.hypot(ent.x - (dragStartScreen.x + camX), ent.y - (dragStartScreen.y + camY)) <= ent.radius + 6
          );
          selectedUnits = clickedUnit ? [clickedUnit] : [];
        }
      }
    });

    function toggleBuild(type) {
      initAudio();
      resetBuildButtons();
      if (buildMode === type) {
        buildMode = null;
      } else {
        buildMode = type;
        document.getElementById(`btn-${type}`).classList.add('active-mode');
      }
    }

    function resetBuildButtons() {
      ['barracks', 'refinery', 'turret'].forEach(t => {
        document.getElementById(`btn-${t}`).classList.remove('active-mode');
      });
    }

    function handleBuild(wx, wy) {
      if (buildMode === 'barracks') {
        if (resources.min >= 40) {
          resources.min -= 40;
          spawnEntity('barracks', 'player', wx, wy);
          hasBarracks = true;
          playSound('produce');
        }
      } else if (buildMode === 'refinery') {
        const gasNode = entities.find(e => e.type === 'resource_gas' && Math.hypot(e.x - wx, e.y - wy) < 45);
        if (gasNode && resources.min >= 30) {
          resources.min -= 30;
          gasNode.hasRefinery = true;
          spawnEntity('refinery', 'player', gasNode.x, gasNode.y);
          playSound('produce');
        }
      } else if (buildMode === 'turret') {
        if (resources.min >= 35) {
          resources.min -= 35;
          spawnEntity('turret', 'player', wx, wy);
          playSound('produce');
        }
      }
      buildMode = null;
      resetBuildButtons();
      updateUI();
    }

    function produceSCV() {
      initAudio();
      if (resources.min >= 20) {
        const playerHQ = entities.find(e => e.type === 'hq' && e.faction === 'player');
        if (playerHQ) {
          resources.min -= 20;
          spawnEntity('scv', 'player', playerHQ.x + (Math.random() * 50 - 25), playerHQ.y + (Math.random() * 50 - 25));
          playSound('produce');
          updateUI();
        }
      }
    }

    function produceFighter() {
      initAudio();
      if (!hasBarracks || resources.min < 30) return;
      const playerHQ = entities.find(e => e.type === 'hq' && e.faction === 'player');
      if (playerHQ) {
        resources.min -= 30;
        spawnEntity('fighter', 'player', playerHQ.x + (Math.random() * 50 - 25), playerHQ.y + (Math.random() * 50 - 25));
        playSound('produce');
        updateUI();
      }
    }

    function produceCruiser() {
      initAudio();
      if (!hasBarracks || resources.min < 50 || resources.gas < 15) return;
      const playerHQ = entities.find(e => e.type === 'hq' && e.faction === 'player');
      if (playerHQ) {
        resources.min -= 50;
        resources.gas -= 15;
        spawnEntity('cruiser', 'player', playerHQ.x + (Math.random() * 50 - 25), playerHQ.y + (Math.random() * 50 - 25));
        playSound('produce');
        updateUI();
      }
    }

    function updateUI() {
      document.getElementById('res-min').innerText = resources.min;
      document.getElementById('res-gas').innerText = resources.gas;
      document.getElementById('wave-num').innerText = wave;

      const playerHQ = entities.find(e => e.type === 'hq' && e.faction === 'player');
      const enemyHQ = entities.find(e => e.type === 'hq' && e.faction === 'enemy');

      document.getElementById('hp-player').innerText = playerHQ ? Math.max(0, playerHQ.hp) : 0;
      document.getElementById('hp-enemy').innerText = enemyHQ ? Math.max(0, enemyHQ.hp) : 0;

      document.getElementById('btn-fighter').disabled = !hasBarracks || resources.min < 30;
      document.getElementById('btn-cruiser').disabled = !hasBarracks || resources.min < 50 || resources.gas < 15;
    }

    function spawnEntity(type, faction, x, y) {
      let e = {
        id: Math.random().toString(),
        type: type,
        faction: faction,
        x: x,
        y: y,
        hp: 100,
        maxHp: 100,
        speed: 0,
        radius: 15,
        emoji: '🛸',
        cooldown: 0,
        cooldownMax: 40,
        attackRange: 0,
        cargo: null,
        moveTarget: null
      };

      if (type === 'hq') {
        e.hp = e.maxHp = 500;
        e.radius = 32;
        e.emoji = (faction === 'player') ? '🏰' : '🏯';
      } else if (type === 'barracks') {
        e.hp = e.maxHp = 300;
        e.radius = 26;
        e.emoji = '🏭';
      } else if (type === 'refinery') {
        e.hp = e.maxHp = 250;
        e.radius = 22;
        e.emoji = '🌋';
      } else if (type === 'turret') {
        e.hp = e.maxHp = 200;
        e.radius = 18;
        e.emoji = '📡';
        e.attackRange = 160;
        e.cooldownMax = 45;
      } else if (type === 'resource_min') {
        e.radius = 20;
        e.emoji = '💎';
        e.resType = 'min';
      } else if (type === 'resource_gas') {
        e.radius = 20;
        e.emoji = '🌋';
        e.resType = 'gas';
        e.hasRefinery = false;
      } else if (type === 'scv') {
        e.hp = e.maxHp = 60;
        e.speed = 2.0;
        e.radius = 12;
        e.emoji = '🛸';
      } else if (type === 'fighter') {
        e.hp = e.maxHp = 100;
        e.speed = 2.4;
        e.radius = 14;
        e.emoji = '🚀';
        e.attackRange = 130;
        e.cooldownMax = 35;
      } else if (type === 'cruiser') {
        e.hp = e.maxHp = 250;
        e.speed = 1.1;
        e.radius = 20;
        e.emoji = '🛩️';
        e.attackRange = 170;
        e.cooldownMax = 65;
      } else if (type === 'boss') {
        e.hp = e.maxHp = 380;
        e.speed = 0.9;
        e.radius = 22;
        e.emoji = '🪐';
        e.attackRange = 190;
        e.cooldownMax = 50;
      }

      entities.push(e);
      return e;
    }

    function initGame() {
      entities = [];
      bullets = [];
      particles = [];
      selectedUnits = [];
      resources = { min: 50, gas: 0, enemyMin: 50, enemyGas: 0 };
      wave = 1;
      waveTimer = 0;
      hasBarracks = false;
      gameOver = false;

      spawnEntity('hq', 'player', 160, 940);
      spawnEntity('resource_min', 'neutral', 90, 1010);
      spawnEntity('resource_gas', 'neutral', 260, 1010);
      for (let i = 0; i < 4; i++) spawnEntity('scv', 'player', 150 + (i * 20), 880);

      spawnEntity('hq', 'enemy', 1340, 160);
      spawnEntity('resource_min', 'neutral', 1410, 90);
      const enemyGas = spawnEntity('resource_gas', 'neutral', 1240, 90);
      enemyGas.hasRefinery = true;
      spawnEntity('refinery', 'enemy', 1240, 90);
      for (let i = 0; i < 4; i++) spawnEntity('scv', 'enemy', 1300 + (i * 20), 220);

      updateUI();
    }

    function updateCamera() {
      const speed = 8;
      if (keys['ArrowLeft'] || keys['KeyA']) camX -= speed;
      if (keys['ArrowRight'] || keys['KeyD']) camX += speed;
      if (keys['ArrowUp'] || keys['KeyW']) camY -= speed;
      if (keys['ArrowDown'] || keys['KeyS']) camY += speed;

      camX = Math.max(0, Math.min(WORLD_W - VIEW_W, camX));
      camY = Math.max(0, Math.min(WORLD_H - VIEW_H, camY));
    }

    let aiTimer = 0;
    function updateAI() {
      aiTimer++;
      if (aiTimer % 60 !== 0) return;

      const enemyHQ = entities.find(e => e.type === 'hq' && e.faction === 'enemy');
      if (!enemyHQ) return;

      const enemyBarracks = entities.find(e => e.type === 'barracks' && e.faction === 'enemy');
      const enemySCVs = entities.filter(e => e.type === 'scv' && e.faction === 'enemy');

      if (!enemyBarracks && resources.enemyMin >= 40) {
        resources.enemyMin -= 40;
        spawnEntity('barracks', 'enemy', enemyHQ.x - 80, enemyHQ.y + 60);
      } else if (enemySCVs.length < 4 && resources.enemyMin >= 20) {
        resources.enemyMin -= 20;
        spawnEntity('scv', 'enemy', enemyHQ.x - 30, enemyHQ.y + 30);
      } else if (enemyBarracks) {
        if (wave < 6) {
          if (resources.enemyMin >= 30) {
            resources.enemyMin -= 30;
            spawnEntity('fighter', 'enemy', enemyBarracks.x + (Math.random() * 40 - 20), enemyBarracks.y + 40);
          }
        } else {
          if (resources.enemyMin >= 50 && resources.enemyGas >= 15) {
            resources.enemyMin -= 50;
            resources.enemyGas -= 15;
            spawnEntity('cruiser', 'enemy', enemyBarracks.x + (Math.random() * 40 - 20), enemyBarracks.y + 40);
          } else if (resources.enemyMin >= 40 && Math.random() < 0.35) {
            resources.enemyMin -= 40;
            spawnEntity('boss', 'enemy', enemyBarracks.x + (Math.random() * 40 - 20), enemyBarracks.y + 40);
          } else if (resources.enemyMin >= 30) {
            resources.enemyMin -= 30;
            spawnEntity('fighter', 'enemy', enemyBarracks.x + (Math.random() * 40 - 20), enemyBarracks.y + 40);
          }
        }
      }
    }

    function updateEntities() {
      waveTimer++;
      if (waveTimer % 1000 === 0) {
        wave++;
        updateUI();
      }

      for (let i = entities.length - 1; i >= 0; i--) {
        let e = entities[i];
        if (e.hp <= 0) {
          for (let p = 0; p < 5; p++) {
            particles.push({
              x: e.x, y: e.y,
              vx: (Math.random() - 0.5) * 4,
              vy: (Math.random() - 0.5) * 4,
              life: 20, text: '💥'
            });
          }
          playSound('explode');
          selectedUnits = selectedUnits.filter(u => u.id !== e.id);
          entities.splice(i, 1);
          updateUI();

          if (e.type === 'hq') {
            gameOver = true;
            setTimeout(() => {
              if (e.faction === 'enemy') {
                alert("🎉 우주 대승리! 적 사령부를 완전히 파괴했습니다!");
              } else {
                alert("💥 아군 사령부가 파괴되었습니다! 게임 오버!");
              }
              initGame();
            }, 100);
          }
          continue;
        }

        if (e.type === 'turret') {
          if (e.cooldown > 0) e.cooldown--;
          let targets = entities.filter(t => t.faction !== 'neutral' && t.faction !== e.faction);
          let closestTarget = null;
          let minDist = 999999;
          targets.forEach(t => {
            let d = Math.hypot(t.x - e.x, t.y - e.y);
            if (d < minDist) { minDist = d; closestTarget = t; }
          });
          if (closestTarget && minDist <= e.attackRange && e.cooldown <= 0) {
            bullets.push({
              x: e.x, y: e.y,
              targetX: closestTarget.x, targetY: closestTarget.y,
              targetId: closestTarget.id, faction: e.faction,
              speed: 8, damage: 18, splash: false
            });
            playSound('laser');
            e.cooldown = e.cooldownMax;
          }
        }

        if (e.type === 'scv') {
          const hq = entities.find(h => h.type === 'hq' && h.faction === e.faction);
          if (!e.cargo) {
            let nodes = entities.filter(n => n.type === 'resource_min' || (n.type === 'resource_gas' && n.hasRefinery));
            let closestNode = null;
            let minDist = 999999;
            nodes.forEach(n => {
              let d = Math.hypot(n.x - e.x, n.y - e.y);
              if (d < minDist) { minDist = d; closestNode = n; }
            });

            if (closestNode) {
              if (minDist > 15) {
                let angle = Math.atan2(closestNode.y - e.y, closestNode.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;
              } else {
                e.cargo = closestNode.resType;
              }
            }
          } else {
            if (hq) {
              let dist = Math.hypot(hq.x - e.x, hq.y - e.y);
              if (dist > 25) {
                let angle = Math.atan2(hq.y - e.y, hq.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;
              } else {
                if (e.faction === 'player') {
                  if (e.cargo === 'min') resources.min += 10;
                  if (e.cargo === 'gas') resources.gas += 5;
                } else {
                  if (e.cargo === 'min') resources.enemyMin += 10;
                  if (e.cargo === 'gas') resources.enemyGas += 5;
                }
                e.cargo = null;
                updateUI();
              }
            }
          }
        }

        if (e.type === 'fighter' || e.type === 'cruiser' || e.type === 'boss') {
          if (e.cooldown > 0) e.cooldown--;

          let targets = entities.filter(t => t.faction !== 'neutral' && t.faction !== e.faction);
          let closestTarget = null;
          let minDist = 999999;
          targets.forEach(t => {
            let d = Math.hypot(t.x - e.x, t.y - e.y);
            if (d < minDist) { minDist = d; closestTarget = t; }
          });

          if (e.moveTarget) {
            let distToMove = Math.hypot(e.moveTarget.x - e.x, e.moveTarget.y - e.y);
            if (distToMove > 10) {
              let angle = Math.atan2(e.moveTarget.y - e.y, e.moveTarget.x - e.x);
              e.x += Math.cos(angle) * e.speed;
              e.y += Math.sin(angle) * e.speed;
            } else {
              e.moveTarget = null;
            }
          } else if (closestTarget && minDist > e.attackRange) {
            let angle = Math.atan2(closestTarget.y - e.y, closestTarget.x - e.x);
            e.x += Math.cos(angle) * e.speed;
            e.y += Math.sin(angle) * e.speed;
          }

          if (closestTarget && minDist <= e.attackRange && e.cooldown <= 0) {
            bullets.push({
              x: e.x, y: e.y,
              targetX: closestTarget.x, targetY: closestTarget.y,
              targetId: closestTarget.id, faction: e.faction,
              speed: 7,
              damage: e.type === 'cruiser' ? 30 : (e.type === 'boss' ? 25 : 12),
              splash: (e.type === 'cruiser' || e.type === 'boss')
            });
            playSound('laser');
            e.cooldown = e.cooldownMax;
          }
        }
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        let angle = Math.atan2(b.targetY - b.y, b.targetX - b.x);
        b.x += Math.cos(angle) * b.speed;
        b.y += Math.sin(angle) * b.speed;

        if (Math.hypot(b.targetX - b.x, b.targetY - b.y) < 8) {
          if (b.splash) {
            playSound('explode');
            particles.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 12, text: '💥' });
            entities.forEach(t => {
              if (t.faction !== 'neutral' && t.faction !== b.faction) {
                if (Math.hypot(t.x - b.x, t.y - b.y) <= 35) {
                  t.hp -= b.damage;
                }
              }
            });
          } else {
            let target = entities.find(e => e.id === b.targetId);
            if (target) target.hp -= b.damage;
          }
          bullets.splice(i, 1);
          updateUI();
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function render() {
      ctx.clearRect(0, 0, VIEW_W, VIEW_H);

      ctx.save();
      ctx.translate(-camX, -camY);

      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 1;
      for (let x = 0; x < WORLD_W; x += 100) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_H); ctx.stroke();
      }
      for (let y = 0; y < WORLD_H; y += 100) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_W, y); ctx.stroke();
      }

      bullets.forEach(b => {
        ctx.fillStyle = b.faction === 'player' ? '#4dadf7' : '#ff6b6b';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.splash ? 4 : 3, 0, Math.PI * 2);
        ctx.fill();
      });

      entities.forEach(e => {
        if (selectedUnits.includes(e)) {
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius + 4, 0, Math.PI * 2);
          ctx.strokeStyle = '#51cf66';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        ctx.font = `${e.radius * 1.5}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(e.emoji, e.x, e.y);

        if (e.cargo) {
          ctx.font = '12px sans-serif';
          ctx.fillText('📦', e.x + 10, e.y - 10);
        }

        if (e.type !== 'resource_min' && e.type !== 'resource_gas') {
          const barW = e.radius * 1.8;
          const barH = 4;
          const barX = e.x - barW / 2;
          const barY = e.y - e.radius - 8;
          const hpRatio = Math.max(0, e.hp / e.maxHp);

          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(barX, barY, barW, barH);
          ctx.fillStyle = e.faction === 'player' ? '#51cf66' : '#ff6b6b';
          ctx.fillRect(barX, barY, barW * hpRatio, barH);
        }
      });

      particles.forEach(p => {
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.text, p.x, p.y);
      });

      ctx.restore();

      if (isDragging) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        const w = dragEndScreen.x - dragStartScreen.x;
        const h = dragEndScreen.y - dragStartScreen.y;
        ctx.fillRect(dragStartScreen.x, dragStartScreen.y, w, h);
        ctx.strokeRect(dragStartScreen.x, dragStartScreen.y, w, h);
      }

      const miniW = 110;
      const miniH = 80;
      const miniX = 10;
      const miniY = VIEW_H - miniH - 10;

      ctx.fillStyle = 'rgba(5, 7, 10, 0.85)';
      ctx.fillRect(miniX, miniY, miniW, miniH);
      ctx.strokeStyle = '#30363d';
      ctx.lineWidth = 1;
      ctx.strokeRect(miniX, miniY, miniW, miniH);

      const scaleX = miniW / WORLD_W;
      const scaleY = miniH / WORLD_H;

      entities.forEach(e => {
        if (e.type === 'resource_min' || e.type === 'resource_gas') {
          ctx.fillStyle = '#fcc419';
        } else {
          ctx.fillStyle = e.faction === 'player' ? '#51cf66' : '#ff6b6b';
        }
        ctx.fillRect(miniX + e.x * scaleX, miniY + e.y * scaleY, 2, 2);
      });

      ctx.strokeStyle = '#4dadf7';
      ctx.lineWidth = 1;
      ctx.strokeRect(
        miniX + camX * scaleX,
        miniY + camY * scaleY,
        VIEW_W * scaleX,
        VIEW_H * scaleY
      );
    }

    function gameLoop() {
      if (!gameOver) {
        updateCamera();
        updateAI();
        updateEntities();
      }
      render();
      requestAnimationFrame(gameLoop);
    }

    initGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
