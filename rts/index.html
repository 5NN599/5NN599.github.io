<title>이모지 RPG · P2P 멀티플레이</title>
<style>
 :root { color-scheme:light dark; --bg:#f5f7fb; --card:#ffffff; --fg:#1b2033; --sub:#65708f; --line:#d8deeb; --acc:#2f68d8; --btnfg:#ffffff; --tile1:#edf1f7; --tile2:#e5eaf3; --ok:#1f9d5b; --bad:#d63a4c; --shadow:rgba(38,46,74,.12); }
@media (prefers-color-scheme:dark) { :root { --bg:#12162b; --card:#1c2240; --fg:#eef0ff; --sub:#9aa3d0; --line:#313a6b; --acc:#6ea1ff; --btnfg:#07111f; --tile1:#232a4d; --tile2:#1f2645; --ok:#5fe39b; --bad:#ff6b7a; --shadow:rgba(0,0,0,.24); } }
* { box-sizing: border-box; }
html, body { width:100%; height:100%; margin:0; }
body { background:var(--bg); color:var(--fg); font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; overflow:hidden; transition:background .2s ease,color .2s ease; }
button,input { font:inherit; color:inherit; }
button { background:var(--acc); color:var(--btnfg); border:0; border-radius:8px; padding:9px 14px; font-weight:700; cursor:pointer; min-height:40px; }
button:focus-visible,input:focus-visible { outline:2px solid var(--fg); outline-offset:2px; }
input { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 10px; min-width:0; flex:1; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:0 8px 24px var(--shadow); }
#lobby { width:min(520px,calc(100vw - 24px)); max-height:calc(100dvh - 24px); overflow:auto; margin:12px auto; }
#lobby h1 { margin:0 0 6px; font-size:26px; }
#lobby h1 small { font-size:13px; color:var(--acc); margin-left:6px; }
#lobby h3 { margin:18px 0 8px; font-size:15px; }
.row { display:flex; gap:8px; margin-top:10px; }
.empty { color:var(--sub); font-size:13px; }
#msg { margin-top:10px; color:var(--bad); min-height:18px; font-size:13px; }
.room { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; margin-bottom:7px; }
.room span { color:var(--sub); font-size:13px; }
#game { position:fixed; inset:0; width:100vw; height:100dvh; overflow:hidden; background:var(--bg); }
#stage { position:absolute; inset:0; width:100%; height:100%; padding:0; border:0; border-radius:0; background:var(--bg); box-shadow:none; }
#cv { position:absolute; z-index:1; inset:0; width:100%; height:100%; display:block; border-radius:0; touch-action:none; background:var(--tile1); }
#stage { isolation:isolate; }
#top { position:absolute; z-index:4; top:max(10px,env(safe-area-inset-top)); left:max(10px,env(safe-area-inset-left)); right:max(10px,env(safe-area-inset-right)); min-height:0; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 11px; border-radius:12px; background:color-mix(in srgb,var(--card) 82%,transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 6px 18px rgba(0,0,0,.18); }
#zoneHud { position:absolute; z-index:4; top:64px; left:max(10px,env(safe-area-inset-left)); display:flex; flex-direction:column; gap:2px; max-width:min(360px,70vw); padding:8px 11px; border-radius:11px; background:color-mix(in srgb,var(--card) 86%,transparent); border:1px solid color-mix(in srgb,var(--line) 70%,transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 6px 18px rgba(0,0,0,.14); pointer-events:none; }
#zoneName { font-weight:800; font-size:14px; }
#zoneMeta { color:var(--sub); font-size:11px; }
#minimapWrap { position:absolute; z-index:5; top:64px; right:12px; width:196px; padding:6px; border-radius:12px; background:color-mix(in srgb,var(--card) 88%,transparent); border:1px solid color-mix(in srgb,var(--line) 75%,transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 8px 22px rgba(0,0,0,.16); }
#minimap { width:100%; height:auto; display:block; image-rendering:pixelated; border-radius:8px; background:var(--bg); }
#minimapLegend { display:flex; flex-wrap:wrap; gap:5px 8px; margin-top:5px; color:var(--sub); font-size:10px; }
@media(max-width:720px){ #minimapWrap { width:154px; right:8px; top:100px; } #zoneHud { top:58px; left:8px; } }
#roomTitle { color:var(--sub); }
#badge { font-weight:700; color:var(--acc); white-space:nowrap; }
#badge .net { color:var(--sub); font-weight:600; margin-left:8px; }
#pad { position:absolute; z-index:5; left:50%; bottom:max(10px,env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(360px,calc(100vw - 20px)); display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:7px; border-radius:14px; background:color-mix(in srgb,var(--card) 76%,transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 8px 24px rgba(0,0,0,.18); }
#pad button { font-size:20px; padding:10px 0; min-height:44px; }
#btnAtk { grid-column:1 / -1; }
#side { display:none; }
button:disabled { opacity:.55; cursor:not-allowed; }
@media (max-width:520px) {
  #lobby { width:calc(100vw - 16px); max-height:calc(100dvh - 16px); margin:8px auto; }
  #pad { width:min(330px,calc(100vw - 12px)); }
  #top { font-size:13px; }
}
@media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto; } }

#menu { position:absolute; z-index:6; top:64px; right:12px; display:flex; gap:6px; }
#menu button { min-height:36px; padding:7px 10px; font-size:13px; background:color-mix(in srgb,var(--card) 88%,transparent); color:var(--fg); border:1px solid var(--line); backdrop-filter:blur(10px); }
#overlayPanel { position:absolute; z-index:8; top:110px; right:12px; width:min(360px,calc(100vw - 24px)); max-height:calc(100dvh - 130px); overflow:auto; display:none; background:color-mix(in srgb,var(--card) 96%,transparent); border:1px solid var(--line); border-radius:14px; box-shadow:0 14px 40px rgba(0,0,0,.3); }
#overlayPanel.open { display:block; }
#networkError { position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; padding:18px; background:rgba(0,0,0,.58); backdrop-filter:blur(5px); }
#networkError[hidden] { display:none; }
.netErrorCard { width:min(420px,100%); background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 18px 60px rgba(0,0,0,.35); }
.netErrorCard h3 { margin:0 0 8px; }
.netErrorCard p { margin:0; color:var(--sub); font-size:13px; line-height:1.5; white-space:pre-line; }
.netErrorActions { display:flex; gap:8px; margin-top:14px; }
.netErrorActions button { flex:1; }
.panelHead { position:sticky; top:0; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 14px; background:color-mix(in srgb,var(--card) 97%,transparent); border-bottom:1px solid var(--line); }
.panelBody { padding:12px 14px; }
.panelGrid { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
.itemBtn { min-height:68px; padding:6px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:12px; }
.itemBtn strong { font-size:23px; line-height:1; }
.itemBtn small { color:var(--sub); }
.section { margin-bottom:14px; }
.section:last-child { margin-bottom:0; }
.sectionTitle { font-size:13px; font-weight:800; margin-bottom:7px; color:var(--sub); }
.statGrid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.statBox { background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:7px 8px; font-size:12px; }
.tradeTarget { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px; border:1px solid var(--line); border-radius:9px; margin-bottom:6px; }
.tradeOffer { border:1px solid var(--line); border-radius:10px; padding:8px; background:var(--bg); }
.tradeLine { display:flex; align-items:center; justify-content:space-between; gap:6px; font-size:12px; margin:4px 0; }
.tradeActions { display:flex; gap:6px; margin-top:8px; }
.tradeActions button { flex:1; min-height:36px; padding:7px 8px; }
.chatLog { max-height:190px; overflow:auto; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:8px; font-size:12px; }
.chatMsg { margin:3px 0; line-height:1.35; word-break:break-word; }
.chatMsg b { color:var(--acc); }
.chatNotice { margin-top:7px; padding:7px 9px; border-radius:8px; background:color-mix(in srgb,var(--tile2) 85%,transparent); color:var(--muted); font-size:11px; line-height:1.4; }
.chatInput { display:flex; gap:6px; margin-top:7px; }
.chatInput input { min-width:0; }
.quest { background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:9px; font-size:12px; }
.socialList{display:flex;flex-direction:column;gap:6px}.socialRow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}.socialMain{min-width:0}.socialMain b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.socialSub{color:var(--muted);font-size:10px}.socialActions{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}.socialActions button{min-height:30px;padding:5px 7px;font-size:11px}.partyBar{padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--bg);margin-bottom:8px}.partyMember{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent);font-size:12px}.partyMember:first-child{border-top:0}.shopGrid{display:grid;gap:6px}.shopRow{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:7px;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}.shopIcon{font-size:23px;text-align:center}.shopInfo{min-width:0}.shopInfo b{display:block}.shopInfo small{color:var(--muted)}.npcHint{padding:8px 9px;border-radius:8px;background:color-mix(in srgb,var(--tile2) 85%,transparent);color:var(--muted);font-size:11px;line-height:1.4;margin-bottom:8px}.friendCodeBox{display:flex;gap:6px;margin-bottom:8px}.friendCodeBox input{min-width:0;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.recoveryLobby{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}.recoveryCode{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;line-height:1.45;word-break:break-all;padding:8px;border:1px dashed var(--line);border-radius:8px;background:color-mix(in srgb,var(--card) 70%,transparent);margin-bottom:7px}.recoveryWarn{padding:8px 9px;border-radius:8px;background:color-mix(in srgb,#f0b 8%,var(--bg));color:var(--sub);font-size:11px;line-height:1.45;margin-top:7px}.recoveryActions{display:flex;gap:6px;flex-wrap:wrap}.recoveryActions button{flex:1;min-width:120px}

/* RPG 확장 UI */
#menu{flex-wrap:wrap;max-width:min(760px,calc(100vw - 24px));justify-content:flex-end}
#menu button.iconBtn{min-width:38px;padding:7px 9px}
.guideGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.guideBtn{min-height:78px;background:var(--bg)!important;color:var(--fg)!important;border:1px solid var(--line)!important;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px}
.guideBtn strong{font-size:27px;line-height:1}.guideDetail{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;font-size:12px;line-height:1.55;white-space:pre-line}
.teleportGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.teleportBtn{min-height:76px;background:var(--bg);color:var(--fg);border:1px solid var(--line)}.teleportBtn b{display:block}.teleportBtn small{display:block;color:var(--sub);margin-top:3px}
.characterPreview{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:10px}.characterAvatar{font-size:48px;line-height:1}.characterSwatches{display:flex;flex-wrap:wrap;gap:6px}.swatch{width:34px;min-width:34px;height:34px;padding:0;border-radius:50%;border:2px solid transparent}.swatch.active{border-color:var(--fg)}
.characterGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.characterGrid button{min-height:58px;background:var(--bg);color:var(--fg);border:1px solid var(--line);font-size:24px}.characterGrid button.active{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 25%,transparent) inset}.chatTabs{display:flex;gap:5px;margin-bottom:7px}.chatTab{flex:1;min-height:34px;padding:5px 7px;background:var(--bg);color:var(--fg);border:1px solid var(--line)}.chatTab.active{background:var(--acc);color:var(--btnfg);border-color:var(--acc)}
.townLabel{font-weight:800;font-size:10px;letter-spacing:.02em}.teleportHint{margin-top:7px;padding:8px;border-radius:8px;background:color-mix(in srgb,var(--tile2) 85%,transparent);color:var(--sub);font-size:11px;line-height:1.45}
@media(max-width:520px){.guideGrid{grid-template-columns:repeat(3,1fr)}.teleportGrid{grid-template-columns:1fr}.characterGrid{grid-template-columns:repeat(4,1fr)}}
.quest progress { width:100%; height:7px; margin-top:7px; }
@media(max-width:720px){ #menu { top:58px; right:8px; } #overlayPanel { top:100px; right:8px; width:min(390px,calc(100vw - 16px)); max-height:calc(100dvh - 112px); } }

/* 건물 내부 / 월드 오브젝트 UI */
.buildingPrompt{position:absolute;left:50%;bottom:calc(max(78px,env(safe-area-inset-bottom)) + 8px);transform:translateX(-50%);z-index:7;padding:7px 11px;border-radius:10px;background:color-mix(in srgb,var(--card) 94%,transparent);border:1px solid var(--line);box-shadow:0 8px 20px rgba(0,0,0,.18);font-size:12px;font-weight:800;pointer-events:none;white-space:nowrap}

/* ===== RPG 완성도 패치 v3 ===== */
#npcQuick { position:absolute; z-index:7; left:50%; bottom:calc(max(78px,env(safe-area-inset-bottom)) + 42px); transform:translateX(-50%); display:none; align-items:center; gap:8px; padding:8px 12px; border:1px solid var(--line); border-radius:12px; background:color-mix(in srgb,var(--card) 94%,transparent); box-shadow:0 10px 26px rgba(0,0,0,.22); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); font-size:12px; pointer-events:none; }
#npcQuick b { color:var(--acc); }
.rpgHero { padding:10px; border:1px solid var(--line); border-radius:11px; background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 8%,var(--bg)),var(--bg)); }

.mapCardMain { min-width:0; }
.mapCardMain b { display:block; }
.mapCardMain small { display:block; margin-top:3px; color:var(--sub); }

.npcCard { border:1px solid var(--line); border-radius:11px; padding:11px; background:var(--bg); }
.npcCardHead { display:flex; align-items:center; gap:10px; }
.npcAvatar { font-size:36px; line-height:1; }
.npcSpeech { margin-top:9px; padding:9px 10px; border-radius:9px; background:color-mix(in srgb,var(--tile2) 78%,transparent); color:var(--sub); line-height:1.45; font-size:12px; }
.rpgActionGrid { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:9px; }

.rpgStatHero { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:9px; }

.rpgEquipRow { display:grid; grid-template-columns:30px 1fr auto; align-items:center; gap:7px; padding:8px; border:1px solid var(--line); border-radius:9px; background:var(--bg); margin-bottom:6px; }
.rpgEquipRow small { color:var(--sub); }
.questBoard { display:grid; gap:7px; }
.questCard { border:1px solid var(--line); border-radius:10px; padding:9px; background:var(--bg); }
.questCard.locked { opacity:.58; }
.questCard b { display:block; }
.questCard small { display:block; color:var(--sub); margin-top:3px; line-height:1.4; }
.questProgress { height:6px; width:100%; margin-top:7px; }

.rpgStorageBox { border:1px solid var(--line); border-radius:9px; padding:9px; background:var(--bg); }

</style>


<style id="rpg-v67-social-notice-style">

/* 기기 성능/네트워크 측정
   - CPU: 짧은 실제 연산 벤치마크 + 논리 코어 수
   - RAM: navigator.deviceMemory(브라우저가 제공하는 대략적인 RAM 등급)
   - Ping: 실제 PeerJS 데이터 채널 RTT를 호스트가 측정
*/
function runCpuBenchmark() {
  try {
    const samples = [];
    let sink = 0;
    for (let round = 0; round < 3; round++) {
      const start = performance.now();
      const end = start + 18;
      let ops = 0;
      while (performance.now() < end) {
        for (let i = 0; i < 1200; i++) {
          sink = Math.imul(sink ^ i, 1664525) + 1013904223;
        }
        ops += 1200;
      }
      const elapsed = Math.max(1, performance.now() - start);
      samples.push(ops / elapsed);
    }
    samples.sort((a, b) => a - b);
    window.__emojiRpgCpuSink = sink;
    return samples[1] || samples[0] || 1;
  } catch (e) {
    return 1;
  }
}

function detectCapabilities() {
  const navConn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  const cores = Math.max(1, Number(navigator.hardwareConcurrency) || 2);
  const ram = Math.max(0.25, Number(navigator.deviceMemory) || 4);
  const cpuPerf = Math.max(1, runCpuBenchmark());
  const browserRtt = Math.max(1, Number(navConn && navConn.rtt) || 80);
  return {
    cores,
    ram,
    cpuPerf: +cpuPerf.toFixed(2),
    browserRtt,
    measuredRtt: null,
    updatedAt: Date.now()
  };
}

function capabilityScore(c) {
  if (!c) return 0;
  const cpuPart = Math.log2(Math.max(1, c.cpuPerf)) * 22;
  const corePart = Math.log2(Math.max(1, c.cores)) * 14;
  const ramPart = Math.log2(Math.max(0.25, c.ram) + 1) * 18;
  return +(cpuPart + corePart + ramPart).toFixed(2);
}

/* ============================================================

   ============================================================ */
let AC = null;
function playSound(type) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime;
    const note = (f, st, d, wave, vol, f2) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = wave;
      o.frequency.setValueAtTime(f, t0 + st);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + st + d);
      g.gain.setValueAtTime(vol, t0 + st);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + st + d);
      o.connect(g); g.connect(AC.destination);
      o.start(t0 + st); o.stop(t0 + st + d + 0.02);
    };
    if (type === 'move') {
      note(240, 0, 0.06, 'triangle', 0.16, 110);
    } else if (type === 'attack') {
      note(1400, 0, 0.14, 'square', 0.07, 500);
      note(2100, 0.015, 0.2, 'sawtooth', 0.045, 900);
      note(180, 0, 0.1, 'triangle', 0.14, 70);
    } else if (type === 'sys') {
      [880, 1175, 1568, 1175, 1568, 1976].forEach((f, i) => note(f, i * 0.11, 0.18, 'sine', 0.2));
    } else if (type === 'lvl') {
      [523, 659, 784, 1047].forEach((f, i) => note(f, i * 0.09, 0.2, 'triangle', 0.18));
    }
  } catch (e) { /* 오디오 미지원 환경 무시 */ }
}

/* ============================================================
   공개 방 목록 (MQTT 공개 브로커 = 시그널링/디렉터리 용도로만 사용)
   ============================================================ */
function initDirectory() {
  try {
    S.directoryReady = false;
    S.directorySubscribed = false;
    S.directoryLastError = '';
    const clientId = ('erpg_' + String(S.uid || rnd(999999)).slice(0, 20) + '_' + rnd(1000000)).replace(/[^A-Za-z0-9_-]/g,'_');
    S.mq = mqtt.connect(BROKER, {
      clientId,
      reconnectPeriod: 2500,
      connectTimeout: 10000,
      keepalive: 25,
      clean: true,
      resubscribe: true
    });
    S.mq.on('connect', () => {
      S.directoryReady = true;
      S.directoryLastError = '';
      S.directorySubscribed = false;
      setNetState(S.started ? 'connected' : 'ready');
      S.mq.subscribe(TOPIC + '+', {qos:0}, err => {
        if (err) {
          S.directorySubscribed = false;
          S.directoryLastError = String(err.message || err);
          if (!S.started) lobbyMsg('공개 방 목록 구독에 실패했어. 다시 연결하는 중…');
          return;
        }
        S.directorySubscribed = true;
        renderRooms();
        if (S.isHost) publishRoom();
      });
    });
    S.mq.on('reconnect', () => {
      S.directoryReady = false;
      S.directorySubscribed = false;
      if (!S.started) lobbyMsg('📡 공개 방 목록에 다시 연결하는 중…');
    });
    S.mq.on('close', () => {
      S.directoryReady = false;
      S.directorySubscribed = false;
    });
    S.mq.on('offline', () => {
      S.directoryReady = false;
      S.directorySubscribed = false;
    });
    S.mq.on('error', e => {
      S.directoryLastError = String(e && e.message ? e.message : e || 'unknown');
      if (!S.started) lobbyMsg('공개 방 목록 연결 오류: ' + S.directoryLastError);
    });
    S.mq.on('message', (topic, buf) => {
      const code = topic.slice(TOPIC.length).trim().toUpperCase(), raw = buf.toString();
      if (!code) return;
      if (!raw) {
        delete S.rooms[code];
      } else {
        try {
          const r = JSON.parse(raw);
          const ts = Number(r && r.ts) || 0;
          const peerId = String(r && r.peerId || '').trim();
          const valid = r && typeof r === 'object' && r.public !== false && String(r.code || '').toUpperCase() === code && ts > 0 && Date.now() - ts < 45000;
          if (valid) {
            S.rooms[code] = {
              code,
              public: true,
              name: String(r.name || '이름 없는 방').slice(0, 16),
              gen: Math.max(0, +r.gen || 0),
              peerId: peerId || hostId(code, Math.max(0, +r.gen || 0)),
              count: clamp(+r.count || 0, 0, 12),
              ts
            };
          } else {
            delete S.rooms[code];
          }
        } catch (e) {
          delete S.rooms[code];
        }
      }
      renderRooms();
    });
  } catch (e) {
    S.directoryReady = false;
    S.directorySubscribed = false;
    S.directoryLastError = String(e && e.message ? e.message : e || 'unknown');
    lobbyMsg('공개 방 목록 서버에 연결할 수 없어.');
  }
}

function publishRoom() {
  if (!S.mq || !S.isHost || !S.code || !S.mq.connected || !S.directorySubscribed) return;
  const peerId = String((S.hostPeer && S.hostPeer.id) || '').trim();
  if (!peerId) return;
  S.mq.publish(TOPIC + S.code, JSON.stringify({
    v: 3,
    public: true,
    code: S.code,
    name: S.roomName,
    gen: S.gen,
    peerId,
    count: clamp(Object.keys(S.players).length, 0, 12),
    ts: Date.now()
  }), { retain: true, qos: 0 });
}

function unpublishRoom() {
  if (S.mq && S.isHost && S.code && S.mq.connected) {
    try { S.mq.publish(TOPIC + S.code, '', { retain: true, qos: 0 }); } catch (e) {}
  }
}

function renderRooms() {
  const box = $('rooms'), now = Date.now();
  const list = Object.values(S.rooms)
    .filter(r => now - r.ts < 30000)
    .sort((a, b) => (b.ts - a.ts) || a.name.localeCompare(b.name, 'ko'));
  box.textContent = '';
  if (!list.length) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = '열린 방이 없습니다. 방을 만들어 보세요!';
    box.appendChild(d);
    return;
  }
  list.forEach(r => {
    const row = document.createElement('div'); row.className = 'room';
    const info = document.createElement('div');
    info.textContent = String(r.name || '이름 없는 방').slice(0, 16);
    const sub = document.createElement('span');
    sub.textContent = ' · ' + r.count + '명';
    info.appendChild(sub);
    const b = document.createElement('button'); b.textContent = '입장';
    b.disabled = r.code === S.code && S.started;
    b.onclick = () => joinRoom(r.code, r.gen, r.peerId);
    row.appendChild(info); row.appendChild(b); box.appendChild(row);
  });
}

/* ============================================================
   방 만들기 / 들어가기
   ============================================================ */
function b64UrlEncode(text) {
  const bytes = new TextEncoder().encode(String(text));
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64UrlDecode(text) {
  const raw = String(text||'').replace(/-/g,'+').replace(/_/g,'/');
  const pad = raw.length % 4 ? '='.repeat(4-(raw.length%4)) : '';
  const bin = atob(raw + pad);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function quickHash(text) {
  let h1=0x811c9dc5, h2=0x9e3779b9;
  const str=String(text);
  for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i); h1=Math.imul(h1^c,16777619); h2=Math.imul(h2^((c<<1)|1),2246822519); }
  return ((h1>>>0).toString(36)+ (h2>>>0).toString(36)).toUpperCase().padStart(13,'0').slice(0,13);
}
function playerAccountData(p){
  if(!p) return null;
  normalizePlayer(p);
  return {v:1,name:String(p.name||'모험가').slice(0,10),emoji:EMOJIS.includes(p.emoji)?p.emoji:EMOJIS[0],friendCode:String(p.friendCode||'').toUpperCase(),lv:p.lv,xp:p.xp,hp:p.hp,gold:p.gold,atk:p.atk,def:p.def,inv:{...(p.inv||{})},equip:{...(p.equip||{})},quest:{...(p.quest||{})}};
}
function makeRecoveryCode(p){
  const session={code:String(S.code||'').toUpperCase().slice(0,5),gen:Math.max(0,Number(S.gen)||0),roomName:String(S.roomName||'').slice(0,16),ts:Date.now()};
  const payload={v:2,ts:Date.now(),nonce:(globalThis.crypto&&globalThis.crypto.randomUUID)?globalThis.crypto.randomUUID().replace(/-/g,''):Math.random().toString(36).slice(2),session,data:playerAccountData(p)};
  const packed=b64UrlEncode(JSON.stringify(payload));
  return 'ERPG2-'+packed+'-'+quickHash(packed);
}
function parseRecoveryCode(code){
  const raw=String(code||'').trim();
  if(!/^ERPG[12]-/.test(raw)) throw new Error('지원하지 않는 복구 코드');
  const parts=raw.split('-'); if(parts.length<3) throw new Error('복구 코드 형식이 올바르지 않아');
  const checksum=parts.pop().toUpperCase(); parts.shift(); const packed=parts.join('-');
  if(quickHash(packed)!==checksum) throw new Error('복구 코드 검증에 실패했어');
  const payload=JSON.parse(b64UrlDecode(packed));
  if(!payload||!([1,2].includes(Number(payload.v)))||!payload.data) throw new Error('복구 데이터가 없어');
  const data=payload.data;
  if(!data.name||!EMOJIS.includes(data.emoji)||!/^[A-Z0-9]{6,8}$/.test(String(data.friendCode||''))) throw new Error('복구 데이터가 손상됐어');
  const p=starterPlayer('recovered',String(data.name).slice(0,10),data.emoji,0,String(data.friendCode));
  Object.assign(p,{lv:clamp(+data.lv||1,1,99),xp:Math.max(0,Math.floor(+data.xp||0)),hp:Math.max(0,Math.floor(+data.hp||1)),gold:Math.max(0,Math.floor(+data.gold||0)),atk:Math.max(0,Math.floor(+data.atk||10)),def:Math.max(0,Math.floor(+data.def||0)),inv:data.inv&&typeof data.inv==='object'?{...data.inv}:{},equip:data.equip&&typeof data.equip==='object'?{...data.equip}:{weapon:null,armor:null},quest:data.quest&&typeof data.quest==='object'?{...data.quest}:{id:'slime_hunt',progress:0,claimed:false},appearance:sanitizeAppearance(data.appearance)});
  normalizePlayer(p);
  const session=payload.session&&typeof payload.session==='object'?payload.session:null;
  p.recoverySession=session?{code:String(session.code||'').toUpperCase().slice(0,5),gen:Math.max(0,Number(session.gen)||0),roomName:String(session.roomName||'').slice(0,16),ts:Math.max(0,Number(session.ts)||0)}:null;
  return p;
}
function isRecoveryCodeDuplicate(code){ return (S.recoveryIssued||[]).includes(String(code||'').trim()); }
function saveRecoveryLedger(){ try{localStorage.setItem('emoji-rpg-recovery-ledger',JSON.stringify((S.recoveryIssued||[]).slice(-30)));}catch(e){} }
function issueRecoveryCode(forceNew=false){
  const p=S.players[S.uid]||newPlayer(S.uid,S.name,S.emoji,S.score,S.friendCode);
  normalizePlayer(p);
  if(!forceNew && S.recoveryCode) return S.recoveryCode;
  let code='',guard=0;
  do { code=makeRecoveryCode(p); guard++; } while(isRecoveryCodeDuplicate(code)&&guard<8);
  S.recoveryCode=code;
  S.recoveryIssued.push(code); if(S.recoveryIssued.length>30)S.recoveryIssued=S.recoveryIssued.slice(-30);
  saveRecoveryLedger(); S.recoveryLastIssuedAt=Date.now();
  try{localStorage.setItem('emoji-rpg-recovery-code',code);}catch(e){}
  updateRecoveryUI(); return code;
}
function saveLocalAccountSnapshot(){ const p=S.players[S.uid]; if(!p)return; const data=playerAccountData(p); if(!data)return; S.accountSnapshot=data; try{localStorage.setItem('emoji-rpg-account',JSON.stringify(data));}catch(e){} }
function loadLocalAccountSnapshot(){ try{const raw=JSON.parse(localStorage.getItem('emoji-rpg-account')||'null');if(raw&&raw.name&&raw.friendCode){const p=starterPlayer('local',raw.name,raw.emoji,0,raw.friendCode);Object.assign(p,raw);normalizePlayer(p);return p;}}catch(e){} return null; }
function findLatestRoomForRecovery(session){
  if(!session||!session.code) return null;
  const r=S.rooms[String(session.code).toUpperCase()];
  return r && (Date.now()-Number(r.ts||0)<35000) ? {...r} : null;
}
function resumeRecoveredSession(session){
  if(!session||!session.code){ lobbyMsg('✅ 계정은 복구됐어. 마지막 온라인 방 정보가 없어서 방을 직접 선택하면 돼.'); return; }
  const latest=findLatestRoomForRecovery(session);
  if(latest){ lobbyMsg('🔎 마지막 방을 찾았어. 마지막 공개 세션으로 접속하는 중…'); joinRoom(latest.code,latest.gen); return; }
  lobbyMsg('🔎 마지막 방 '+session.code+' 을 찾는 중…');
  let tries=0;
  const timer=setInterval(()=>{
    tries++; const r=findLatestRoomForRecovery(session);
    if(r){clearInterval(timer);lobbyMsg('🔎 마지막 방을 찾았어. 마지막 공개 세션으로 접속하는 중…');joinRoom(r.code,r.gen);return;}
    if(tries>=10){
      clearInterval(timer);
      lobbyMsg('📡 공개 방 목록에 마지막 방이 아직 안 보여서 저장된 세션 주소로 직접 접속해.');
      joinRoom(session.code,session.gen);
    }
  },500);
}
function recoverAccountFromInput(){
  const input=$('recoveryInput'),code=input?input.value.trim():'';
  if(!code){lobbyMsg('복구 코드를 붙여넣어줘.');return;}
  try{
    const p=parseRecoveryCode(code);
    const data=playerAccountData(p);
    S.accountSnapshot=data; S.name=p.name; S.emoji=p.emoji; S.friendCode=p.friendCode; S.recoveryCode=code; S.recoverySession=p.recoverySession||null;
    try{localStorage.setItem('emoji-rpg-account',JSON.stringify(S.accountSnapshot));localStorage.setItem('emoji-rpg-profile',JSON.stringify({n:S.name,e:S.emoji,fc:S.friendCode}));localStorage.setItem('emoji-rpg-recovery-code',code);}catch(e){}
    updateRecoveryUI();
    const hint=$('recoverySessionHint');
    if(S.recoverySession&&S.recoverySession.code){ if(hint)hint.textContent='✅ 복구 코드 인식 · '+(S.recoverySession.roomName||'마지막 방')+' · '+S.recoverySession.code+' · 마지막 공개 세션 찾는 중…'; resumeRecoveredSession(S.recoverySession); }
    else { if(hint)hint.textContent='✅ 계정 복구 완료 · 마지막 온라인 세션 정보는 없어.'; lobbyMsg('✅ 계정 데이터를 복구했어. 공개 방 목록에서 방을 선택하면 돼.'); }
  }catch(e){ const hint=$('recoverySessionHint');if(hint)hint.textContent='복구 코드를 확인해줘.';lobbyMsg('복구 실패: '+e.message); }
}

  const fc=String(prof.fc||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8); S.friendCode=/^[A-Z0-9]{6,8}$/.test(fc)?fc:Math.random().toString(36).slice(2,10).toUpperCase();
  try{S.friends=JSON.parse(localStorage.getItem('emoji-rpg-friends')||'{}')||{};}catch(e){S.friends={};} try{S.blocked=JSON.parse(localStorage.getItem('emoji-rpg-blocked')||'{}')||{};}catch(e){S.blocked={};}

  const localAccount=loadLocalAccountSnapshot(); if(localAccount){S.accountSnapshot=localAccount;S.name=localAccount.name;S.emoji=localAccount.emoji;S.friendCode=localAccount.friendCode;}

  if(/^ERPG[12]-/.test(knownRecovery)){S.recoveryCode=knownRecovery;try{S.recoverySession=parseRecoveryCode(knownRecovery).recoverySession||null;}catch(e){S.recoverySession=null;}}
}
function starterPlayer(id, name, emoji, score, friendCode) {
  return { id, name, emoji, friendCode: String(friendCode || '').toUpperCase().slice(0,8), score, x: 48, y: 32,
    hp: 80, lv: 1, xp: 0, gold: 40, atk: 10, def: 0,
    inv: { potion: 3, leather: 1 }, equip: { weapon: null, armor: 'leather' },
    quest: { id:'slime_hunt', progress:0, claimed:false } };
}
function newPlayer(id, name, emoji, score, friendCode) {
  const p=starterPlayer(id,name,emoji,score,friendCode);
  if(id===S.uid && S.accountSnapshot){ const a=playerAccountData(S.accountSnapshot); if(a){ Object.assign(p,a); p.id=id; p.score=score; } }
  normalizePlayer(p);
  return p;
}
function itemCount(p, id) { return Math.max(0, Math.floor(Number((p && p.inv && p.inv[id]) || 0))); }
function addItem(p, id, n) {
  const def=ITEMS[id]; if(!def || !Number.isFinite(n) || n<=0) return 0;
  const cur=itemCount(p,id), add=Math.max(0,Math.min(Math.floor(n),(def.max||99)-cur));
  if(add) p.inv[id]=cur+add; return add;
}
function removeItem(p,id,n){
  const cur=itemCount(p,id), take=Math.max(0,Math.min(cur,Math.floor(n)));
  if(!take) return 0; p.inv[id]=cur-take; if(p.inv[id]<=0) delete p.inv[id]; return take;
}
function equipStats(p){ const w=p.equip&&ITEMS[p.equip.weapon],a=p.equip&&ITEMS[p.equip.armor]; return {atk:(w&&w.atk)||0,def:(a&&a.def)||0}; }
function effectiveAtk(p){ return 10+p.lv*3+equipStats(p).atk; }
function effectiveDef(p){ return equipStats(p).def; }
function normalizePlayer(p){
  p.friendCode=String(p.friendCode||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
  p.inv=p.inv&&typeof p.inv==='object'?p.inv:{}; p.equip=p.equip&&typeof p.equip==='object'?p.equip:{weapon:null,armor:null};
  p.quest=p.quest&&typeof p.quest==='object'?p.quest:{id:'slime_hunt',progress:0,claimed:false};
  p.gold=Math.max(0,Math.floor(Number(p.gold)||0)); p.lv=clamp(Math.floor(Number(p.lv)||1),1,99);
  p.xp=Math.max(0,Math.floor(Number(p.xp)||0)); p.hp=clamp(Math.floor(Number(p.hp)||maxHp(p)),0,maxHp(p));
  if(!ITEMS[p.equip.weapon]) p.equip.weapon=null; if(!ITEMS[p.equip.armor]) p.equip.armor=null;
  Object.keys(p.inv).forEach(k=>{ if(!ITEMS[k]||itemCount(p,k)<=0) delete p.inv[k]; else p.inv[k]=Math.min(itemCount(p,k),ITEMS[k].max||99); });
  return p;
}

const _baseNormalizePlayer = normalizePlayer;
function sanitizeAppearance(a){
  a=a&&typeof a==='object'?a:{};
  const aura=CHARACTER_AURAS.includes(a.aura)?a.aura:CHARACTER_AURAS[0];
  const hat=CHARACTER_HATS.includes(a.hat)?a.hat:'';
  const title=CHARACTER_TITLES.includes(a.title)?a.title:CHARACTER_TITLES[0];
  return {aura,hat,title};
}
normalizePlayer=function(p){ const out=_baseNormalizePlayer(p); out.appearance=sanitizeAppearance(out.appearance); return out; };

const _basePlayerAccountData = playerAccountData;
playerAccountData=function(p){ const d=_basePlayerAccountData(p); if(!d)return d; d.appearance=sanitizeAppearance(p.appearance); return d; };

const _baseStarterPlayer = starterPlayer;
starterPlayer=function(id,name,emoji,score,friendCode){ const p=_baseStarterPlayer(id,name,emoji,score,friendCode); p.appearance=(id===S.uid?sanitizeAppearance(S.characterStyle):sanitizeAppearance(null)); normalizePlayer(p); return p; };

const _baseParseRecoveryCode = parseRecoveryCode;
parseRecoveryCode=function(code){
  const p=_baseParseRecoveryCode(code);
  p.appearance=sanitizeAppearance(p.appearance);
  return p;
};

const _baseReadProfile = readProfile;
readProfile=function(){

const _baseNewPlayer = newPlayer;
newPlayer=function(id,name,emoji,score,friendCode){
  const p=_baseNewPlayer(id,name,emoji,score,friendCode);
  if(id===S.uid) p.appearance=sanitizeAppearance(S.characterStyle);
  normalizePlayer(p);
  return p;
};

/* 빠른 입장: 현재 살아 있는 모든 공개 방을 확인하고 하나를 선택한다. 없으면 새 공개 방을 만든다. */
function getLivePublicRooms(excludeCode='') {
  const now = Date.now();
  const excluded = String(excludeCode || '').trim().toUpperCase();
  return Object.values(S.rooms || {})
    .filter(r => r && r.public !== false && r.code && r.code !== excluded && (now - Number(r.ts || 0) < 45000) && Number(r.count || 0) < 12 && (r.peerId || hostId(r.code, r.gen)))
    .sort((a,b) => (Number(b.ts || 0) - Number(a.ts || 0)) || (Number(a.count || 0) - Number(b.count || 0)));
}

function finishQuickJoinSearch() {
  S.quickJoinPending = false;
  if (S.quickJoinTimer) { clearTimeout(S.quickJoinTimer); S.quickJoinTimer = null; }
  const rooms = getLivePublicRooms();
  const picked = rooms[0];

  if (picked) {
    S.quick = true;
    S.quickTried = true;
    S.quickFallbackUsed = false;
    S.code = String(picked.code).toUpperCase();
    S.gen = Math.max(0, Number(picked.gen) || 0);
    S.roomName = String(picked.name || '공개 방');
    S.targetHid = String(picked.peerId || hostId(S.code, S.gen));
    S.retry = 3;
    lobbyMsg('공개 방을 찾았어. 접속 중…');
    ensurePeer(() => connectToHost(String(picked.peerId || hostId(S.code, S.gen))));
    return;
  }

  lobbyMsg('공개 방이 없어서 새 공개 방을 만들고 있어…');
  createRoom(true);
}

function quickJoin() {
  readProfile();
  S.quick = true;
  S.quickTried = false;
  S.quickFallbackUsed = false;
  S.retry = 3;
  if (S.quickJoinTimer) clearTimeout(S.quickJoinTimer);

  /* MQTT 목록이 아직 연결/구독되기 전이면 최대 3초 동안 기다렸다가 판단한다. */
  if (!(S.mq && S.mq.connected && S.directoryReady && S.directorySubscribed)) {
    S.quickJoinPending = true;
    const startedAt = Date.now();
    const poll = () => {
      if (!S.quickJoinPending || !S.quick) return;
      if (S.mq && S.mq.connected && S.directoryReady && S.directorySubscribed) {
        S.quickJoinTimer = setTimeout(finishQuickJoinSearch, 300);
        return;
      }
      if (Date.now() - startedAt >= 3000) {
        finishQuickJoinSearch();
        return;
      }
      S.quickJoinTimer = setTimeout(poll, 150);
    };
    lobbyMsg('공개 방 목록 확인 중…');
    poll();
    return;
  }

  S.quickJoinPending = true;
  S.quickJoinTimer = setTimeout(finishQuickJoinSearch, 300);
}

function createRoom(isPublic=false) {
  readProfile();
  S.isHost = false;
  S.targetHid = '';
  S.hostUid = '';
  S.quickFallbackUsed = !!S.quickFallbackUsed;
  S.quick = !!isPublic;
  /* 공개 빠른 참가 세션은 고정 코드로 경쟁 생성을 방지한다.
     일반 방만 매번 새 코드를 사용한다. */
  S.code = isPublic ? 'PUB01' : Math.random().toString(36).slice(2, 7).toUpperCase();
  S.roomName = isPublic ? '🌍 공개 광장' : ($('roomName').value.trim() || S.name + '의 방').slice(0, 16);
  S.recoverySession={code:S.code,gen:0,roomName:S.roomName,ts:Date.now()};
  S.players = {}; S.mons = []; S.trades = {}; S.tradeSeq = 1; S.chat = []; S.chatGuard = {}; S.parties = {}; S.partyInvites = {}; S.reports = []; S.reportGuard = {};
  S.moveSeq = 0; S.moveAck = {}; S.pendingMoves = [];
  S.players[S.uid] = newPlayer(S.uid, S.name, S.emoji, S.score, S.friendCode);
  becomeHost(0, true);
}

function joinRoom(code, gen, peerId) {
  readProfile();
  code = String(code || '').trim().toUpperCase();
  if (code.length !== 5) { lobbyMsg('세션 코드가 올바르지 않아.'); return; }
  const known = S.rooms[code];
  S.quick = false;
  S.code = code;
  S.gen = known ? known.gen : (gen || 0);
  S.roomName = known ? known.name : '';
  const target = String((known && known.peerId) || peerId || hostId(S.code, S.gen)).trim();
  if (!target) { lobbyMsg('공개 방의 연결 주소를 찾지 못했어.'); return; }
  S.targetHid = target;
  S.recoverySession={code:S.code,gen:S.gen,roomName:S.roomName,ts:Date.now()};
  S.moveSeq = 0; S.moveAck = {}; S.pendingMoves = [];
  S.retry = 4; lobbyMsg('📡 '+(S.roomName||'공개 방')+' 연결 중…');
  ensurePeer(() => connectToHost(target));
}

/* ============================================================
   클라이언트 측 네트워크
   ============================================================ */
function setNetState(state) {
  S.netState = state;
  updateBadge();
}

function ensurePeer(cb) {
  if (S.peer && !S.peer.destroyed && S.peer.open) {
    cb();
    return;
  }
  if (S.peer && !S.peer.destroyed && !S.peer.open) {
    if (!S.peerWaiters.includes(cb)) S.peerWaiters.push(cb);
    return;
  }

  S.peerWaiters = [cb];
  S.peer = new Peer(undefined, PEER_OPTIONS);
  S.peer.on('open', () => {
    setNetState('ready');
    const waiters = S.peerWaiters.splice(0);
    waiters.forEach(fn => { try { fn(); } catch (e) { log('연결 준비 오류: ' + e.message); } });
    if (S.players[S.uid]) S.players[S.uid].peerId = S.peer.id;
    ensureDirectLinks();
  });
  S.peer.on('connection', acceptDirectConnection);
  S.peer.on('error', e => {
    if (e.type === 'peer-unavailable') retryConnect();
    else {
      setNetState('error');
      if (S.started) log('네트워크 오류: ' + e.type);
      else lobbyMsg('네트워크 오류: ' + e.type);
    }
  });
  S.peer.on('disconnected', () => setNetState('degraded'));
  S.peer.on('close', () => setNetState('offline'));
}

function retryConnect() {
  if (S.retry > 0) {
    S.retry--;
    setNetState('degraded');
    setTimeout(() => {
      if (S.started || S.code) ensurePeer(() => connectToHost(S.targetHid || hostId(S.code, S.gen)));
    }, 1200);
  } else {
    failJoin();
  }
}

function cleanupGameTimers() {
  if (S.renderHealthTimer) { clearTimeout(S.renderHealthTimer); S.renderHealthTimer = null; }
  S.gameTimers.forEach(t => clearInterval(t));
  S.gameTimers = [];
  if (S.hostTimer) { clearInterval(S.hostTimer); S.hostTimer = null; }
  if (S.hudTimer) { clearInterval(S.hudTimer); S.hudTimer = null; }
  if (S.moveTimer) { clearInterval(S.moveTimer); S.moveTimer = null; }
  if (S.roomPublishTimer) { clearInterval(S.roomPublishTimer); S.roomPublishTimer = null; }
  if (S.hostProbeTimer) { clearInterval(S.hostProbeTimer); S.hostProbeTimer = null; }
  if (S.hostElectionTimer) { clearInterval(S.hostElectionTimer); S.hostElectionTimer = null; }
  if (S.capReportTimer) { clearInterval(S.capReportTimer); S.capReportTimer = null; }
  S.drawStarted=false;
}

function cleanupNetwork() {
  if (S.hostConnectTimer) { clearTimeout(S.hostConnectTimer); S.hostConnectTimer = null; }
  if (S.quickJoinTimer) { clearTimeout(S.quickJoinTimer); S.quickJoinTimer = null; }
  S.quickJoinPending = false;
  cleanupGameTimers();
  try { if (S.hostPeer && !S.hostPeer.destroyed) S.hostPeer.destroy(); } catch (e) {}
  try { if (S.peer && !S.peer.destroyed) S.peer.destroy(); } catch (e) {}
  Object.values(S.directConns || {}).forEach(c => { try { c.close(); } catch (e) {} });
  Object.values(S.directConnecting || {}).forEach(c => { try { c.close(); } catch (e) {} });
  S.directConns = {};
  S.directConnecting = {};
  S.directFailures = {};
  S.directPeerUids = {};
  S.hostPeer = null;
  S.peer = null;
  S.hostConn = null;
  S.conns = {};
  S.peerWaiters = [];
}

function showConnectionError(title, message, retryFn) {
  const box = $('networkError');
  if (!box) return;
  $('networkErrorTitle').textContent = title || '⚠️ 연결 오류';
  $('networkErrorText').textContent = message || '연결을 설정하지 못했습니다.';
  S.netErrorRetry = typeof retryFn === 'function' ? retryFn : null;
  box.hidden = false;
}
function hideConnectionError() { if ($('networkError')) $('networkError').hidden = true; }
function failJoin() {
  const wasStarted = S.started;
  const code = S.code;
  const shouldQuickFallback = !!(S.quick && !S.quickFallbackUsed && !wasStarted);
  if (shouldQuickFallback) {
    S.quickFallbackUsed = true;
    cleanupNetwork();
    S.isHost = false;
    S.migrating = false;
    S.targetHid = '';
    S.hostUid = '';
    S.code = '';
    S.gen = 0;
    S.roomName = '';
    hideConnectionError();
    lobbyMsg('공개 방 접속에 실패해서 새 공개 방을 만들고 있어…');
    setTimeout(() => createRoom(true), 0);
    return;
  }
  cleanupNetwork();
  S.isHost = false;
  S.migrating = false;
  S.targetHid = '';
  S.hostUid = '';
  S.pendingMoves = [];
  S.walkPath = []; S.walkTo = null;
  if (wasStarted) {
    S.started = false;
    $('game').hidden = true;
    $('lobby').hidden = false;
  }
  updateBadge();
  showConnectionError('⚠️ 연결 오류', wasStarted ? '세션 연결과 재연결에 모두 실패했습니다.\n공개 방 ' + code + ' 연결을 종료합니다.' : '세션 P2P 연결에 실패했습니다.\n공개 방을 다시 찾아 주세요.', () => {
    hideConnectionError();
    S.retry = 4;
    ensurePeer(() => connectToHost(hostId(S.code, S.gen)));
  });
}

function selfRecord() {
  const p = S.players[S.uid] || newPlayer(S.uid, S.name, S.emoji, S.score, S.friendCode);
  p.friendCode = S.friendCode;
  p.score = S.score;
  p.peerId = (S.peer && !S.peer.destroyed && S.peer.open) ? S.peer.id : String(p.peerId || '');
  p.caps = {
    cores: S.caps.cores,
    ram: S.caps.ram,
    cpuPerf: S.caps.cpuPerf,
    browserRtt: S.caps.browserRtt
  };
  p.recoveryCode = S.recoveryCode || '';
  p.accountData = playerAccountData(p);
  return p;
}

const _baseSelfRecord = selfRecord;
selfRecord=function(){
  const p=_baseSelfRecord();
  p.appearance=sanitizeAppearance(S.characterStyle||p.appearance);
  p.accountData=playerAccountData({...p,appearance:p.appearance});
  return p;
};

function connectToHost(hid) {
  hid = String(hid || '').trim();
  if (!hid || !S.peer || S.peer.destroyed) { if(!hid) lobbyMsg('연결할 공개 방 주소가 없어.'); return; }
  if (S.peer.id && hid === S.peer.id) { lobbyMsg('내가 만든 공개 방이야.'); return; }
  S.targetHid = hid;
  if (S.hostConn && S.hostConn.open) {
    try { S.hostConn.close(); } catch (e) {}
  }
  if (S.hostConnectTimer) { clearTimeout(S.hostConnectTimer); S.hostConnectTimer = null; }
  if (S.peer.disconnected) { try { S.peer.reconnect(); } catch (e) {} }
  setNetState('connecting');
  const c = S.peer.connect(hid, { reliable: true, serialization:'json' });
  S.hostConnectTimer = setTimeout(() => {
    S.hostConnectTimer = null;
    if (!c.open && !S.started) {
      try { c.close(); } catch (e) {}
      lobbyMsg('📡 공개 방 응답이 없어서 다시 찾는 중…');
      retryConnect();
    }
  }, 12000);
  c.on('open', () => {
    if (S.hostConnectTimer) { clearTimeout(S.hostConnectTimer); S.hostConnectTimer = null; }
    if (S.hostConn && S.hostConn !== c) {
      try { S.hostConn.close(); } catch (e) {}
    }
    S.hostConn = c;
    setNetState('connected');
    c.send({ t: 'hello', p: selfRecord(), peerTarget: hid });
  });
  c.on('data', onClientData);
  c.on('close', () => {
    if (S.hostConn === c) onHostLost();
  });
  c.on('error', e => {
    if (S.hostConnectTimer) { clearTimeout(S.hostConnectTimer); S.hostConnectTimer = null; }
    if (!S.started && (e && (e.type === 'peer-unavailable' || e.type === 'network' || e.type === 'socket-error'))) retryConnect();
  });
}

const _baseOnClientData = onClientData;
onClientData=function(m){
  if(m&&m.t==='teleport_ok'){ const d=TELEPORTS[m.dest]; if(d){const p=S.players[S.uid];if(p){p.x=d.x;p.y=d.y;S.discoveredTeleports[m.dest]=true;}log('🌀 '+d.name+' 도착');updateZoneHud();}return; }
  if(m&&m.t==='ev'&&m.k==='appearance'){ return; }
  _baseOnClientData(m);
};

function applyPendingFrom(serverX, serverY, ackSeq) {
  let x = serverX, y = serverY;
  S.pendingMoves = S.pendingMoves.filter(m => m.s > ackSeq);
  for (const m of S.pendingMoves) {
    x = clamp(x + m.dx, 0, W - 1);
    y = clamp(y + m.dy, 0, H - 1);
  }
  return { x, y };
}

function handleMoveAck(m) {
  const p = S.players[S.uid];
  if (!p) return;
  const seq = Math.max(0, +m.s || 0);
  const x = clamp(+m.x | 0, 0, W - 1);
  const y = clamp(+m.y | 0, 0, H - 1);
  const pos = applyPendingFrom(x, y, seq);
  p.x = pos.x;
  p.y = pos.y;
}

function onClientData(m) {
  if (!m || typeof m !== 'object') return;
  if (m.t === 'snap') {
    const serverMe = m.p && m.p[S.uid];
    const ackSeq = Math.max(0, +(m.a && m.a[S.uid]) || 0);
    S.players = m.p || {};
    S.mons = Array.isArray(m.m) ? m.m : [];
    S.gen = Math.max(0, +m.g || 0);
    S.hostUid = String(m.h || '');
    S.moveAck = m.a && typeof m.a === 'object' ? m.a : {};
    if (m.hs && typeof m.hs === 'object') S.hostStats = m.hs;
    if (m.pt && typeof m.pt === 'object') S.parties = m.pt;
    ensureDirectLinks();
    if (Array.isArray(m.chat)) S.chat = m.chat.slice(-40);
    if (serverMe) {
      const pos = applyPendingFrom(
        clamp(+serverMe.x | 0, 0, W - 1),
        clamp(+serverMe.y | 0, 0, H - 1),
        ackSeq
      );
      S.players[S.uid].x = pos.x;
      S.players[S.uid].y = pos.y;
    }
    if (S.migrating) {
      S.migrating = false;
      log('✅ 새 세션 연결 완료');
    }
    if (!S.started) enterGame();
    setNetState('connected');
  } else if (m.t === 'ack') {
    handleMoveAck(m);
  } else if (m.t === 'trade_request') {
    const who=String(m.from||''), nm=String(m.name||'플레이어');
    window.rpgGameConfirm?.('🤝 거래 요청',nm+' 님이 거래를 요청했어.\n거래 창을 열고 서로 확인한 뒤 교환할 수 있어.','수락','거절').then(ok=>{ if(ok){ const msg={t:'trade_accept',from:who}; if(S.isHost) hostRecv({uid:S.uid,open:true,send:()=>{}},msg); else if(S.hostConn&&S.hostConn.open) S.hostConn.send(msg); }});
  } else if (m.t === 'trade_state') { S.activeTrades=[m.trade]; renderTradeFromEvent();
  } else if (m.t === 'trade_end') { S.activeTrades=[]; closePanel(); log(m.reason||'거래 종료');
  } else if (m.t === 'chat') { if(m.m&&!isBlockedChatMessage(m.m)){ S.chat.push(m.m); if(S.chat.length>60) S.chat.shift(); } if($('overlayPanel').classList.contains('open')&&$('panelTitle').textContent.includes('채팅')) renderChat();
  } else if (m.t === 'party_invite') {
    const from=String(m.from||''),nm=String(m.name||'플레이어');
    if(!isBlockedUid(from)) window.rpgGameConfirm?.('👥 파티 초대',nm+' 님이 파티에 초대했어.\n수락하면 파티에 합류해.','참가','거절').then(ok=>{if(ok)sendLocalHost({t:'party_accept',from});});
  } else if (m.t === 'party_state'||m.t === 'party_end') {
    S.parties=m.parties&&typeof m.parties==='object'?m.parties:{}; if(m.reason)log(m.reason); renderSocialIfOpen(); updateHud();
  } else if (m.t === 'report_ack') { log(m.s||'🚩 신고가 접수되었습니다.');
  } else if (m.t === 'shop_result') { log(m.s||'상점 처리 완료'); updateHud(); if($('overlayPanel').classList.contains('open')&&$('panelTitle').textContent.includes('상점')) renderShop();
  } else if (m.t === 'ping') {
    if (S.hostConn && S.hostConn.open) {
      try { S.hostConn.send({ t: 'pong', ts: m.ts }); } catch (e) {}
    }
  } else if (m.t === 'handoff_state') {
    S.players = m.p || S.players;
    S.mons = Array.isArray(m.m) ? m.m : S.mons;
    S.moveAck = m.a && typeof m.a === 'object' ? m.a : S.moveAck;
    S.monSeq = Math.max(1, +m.ms || S.monSeq);
    S.nextSpawn = +m.ns || Date.now() + 1500;
    S.trades = m.tr && typeof m.tr === 'object' ? m.tr : S.trades;
    S.tradeSeq = Math.max(1, +m.tq || S.tradeSeq);
    S.chat = Array.isArray(m.ch) ? m.ch.slice(-60) : S.chat; S.activeTrades = Object.values(S.trades).filter(t=>t.a===S.uid||t.b===S.uid);
    S.parties = m.pt && typeof m.pt === 'object' ? m.pt : S.parties;
    S.reports = Array.isArray(m.rp) ? m.rp.slice(-100) : S.reports;
    S.hostUid = String(m.h || S.uid);
    S.gen = Math.max(S.gen, +m.g || S.gen);
    S.handoffBusy = true;
    if (String(m.h) === S.uid) becomeHost(S.gen, false);
  } else if (m.t === 'ev') {
    if (m.k === 'handoff') {
      const target = String(m.to || '');
      const gen = Math.max(S.gen, +m.g || S.gen);
      S.gen = gen;
      if (target !== S.uid) {
        S.migrating = true;
        S.hostUid = target;
        if (S.hostConn && S.hostConn.open) { try { S.hostConn.close(); } catch (e) {} }
        S.hostConn = null;
        ensurePeer(() => connectToHost(hostId(S.code, gen)));
      }
    }
    handleEvent(m);
  }
}

/* ============================================================
   직접 P2P 메시망 + 호스트 릴레이 폴백
   - 가능한 경우 플레이어끼리 직접 연결
   - 직접 연결이 없거나 실패하면 호스트 P2P로 릴레이
   - 두 경로가 모두 실패하면 연결 오류 창 표시
   ============================================================ */
const DIRECT_REQUEST_TYPES = new Set(['trade_request', 'party_invite']);
const DIRECT_HOST_TYPES = new Set(['trade_state', 'trade_end', 'party_state', 'party_end', 'chat', 'report_ack', 'shop_result']);

function expectedUidForPeer(peerId) {
  const id = String(peerId || '');
  const found = Object.values(S.players || {}).find(p => p && p.id !== S.uid && String(p.peerId || '') === id);
  return found ? found.id : '';
}
function rememberDirect(uid, c) {
  if (!uid || !c) return false;
  const p = S.players[uid];
  if (!p || String(p.peerId || '') !== String(c.peer || '')) return false;
  const old = S.directConns[uid];
  if (old && old !== c) { try { old.close(); } catch (e) {} }
  c._uid = uid;
  S.directConns[uid] = c;
  delete S.directConnecting[uid];
  delete S.directFailures[uid];
  return true;
}
function bindDirectConnection(c, outgoingUid) {
  if (!c) return;
  c.on('open', () => {
    try { c.send({ t:'direct_hello', code:S.code, gen:S.gen, uid:S.uid, peerId:S.peer && S.peer.id }); } catch (e) {}
  });
  c.on('data', m => onDirectData(c, m));
  c.on('close', () => {
    const uid = c._uid || outgoingUid || expectedUidForPeer(c.peer);
    if (uid && S.directConns[uid] === c) delete S.directConns[uid];
    if (uid) { delete S.directConnecting[uid]; S.directFailures[uid] = Date.now(); }
  });
  c.on('error', () => {
    const uid = c._uid || outgoingUid || expectedUidForPeer(c.peer);
    if (uid) S.directFailures[uid] = Date.now();
  });
}
function acceptDirectConnection(c) { bindDirectConnection(c, ''); }
function onDirectData(c, m) {
  if (!m || typeof m !== 'object') return;
  if (m.t === 'direct_hello') {
    if (String(m.code || '') !== String(S.code || '') || String(m.gen || S.gen) !== String(S.gen)) return;
    const uid = String(m.uid || '');
    const known = S.players[uid];
    if (!known || uid === S.uid || String(known.peerId || '') !== String(c.peer || '')) return;
    if (!rememberDirect(uid, c)) return;
    try { c.send({ t:'direct_hello_ack', uid:S.uid, code:S.code, gen:S.gen }); } catch (e) {}
    return;
  }
  const uid = c._uid || expectedUidForPeer(c.peer);
  if (!uid || !S.players[uid]) return;
  if (m.t === 'direct_hello_ack') return;
  if (DIRECT_REQUEST_TYPES.has(m.t)) {
    if (String(m.from || '') !== uid || String(m.to || '') !== S.uid) return;
    if (isBlockedUid(uid)) return;
    if (m.t === 'trade_request') {
      const nm = String(m.name || S.players[uid].name || '플레이어');
      window.rpgGameConfirm?.('🤝 거래 요청',nm+' 님이 거래를 요청했어.\n거래 요청을 수락할까?','수락','거절').then(ok=>{if(ok)sendLocalHost({ t:'trade_accept', from:uid });});
    } else if (m.t === 'party_invite') {
      const nm = String(m.name || S.players[uid].name || '플레이어');
      window.rpgGameConfirm?.('👥 파티 초대',nm+' 님이 파티에 초대했어.\n참가할까?','참가','거절').then(ok=>{if(ok)sendLocalHost({ t:'party_accept', from:uid });});
    }
    return;
  }
  if (DIRECT_HOST_TYPES.has(m.t) && uid === S.hostUid) onClientData(m);
}
function ensureDirectLinks() {
  if (!S.peer || S.peer.destroyed || !S.peer.open || !S.players[S.uid]) return;
  S.players[S.uid].peerId = S.peer.id;
  Object.values(S.players).forEach(p => {
    if (!p || p.id === S.uid || !p.peerId) return;
    if (String(S.uid) > String(p.id)) return;
    if (S.directConns[p.id] && S.directConns[p.id].open) return;
    if (S.directConnecting[p.id]) return;
    if (Date.now() - (S.directFailures[p.id] || 0) < 5000) return;
    try {
      const c = S.peer.connect(String(p.peerId), { reliable:true });
      S.directConnecting[p.id] = c;
      bindDirectConnection(c, p.id);
    } catch (e) { S.directFailures[p.id] = Date.now(); }
  });
}
function relayThroughHost(targetUid, msg) {
  if (S.isHost) return !!sendTo(targetUid, msg);
  if (!S.hostConn || !S.hostConn.open) return false;
  try { S.hostConn.send({ t:'relay', to:String(targetUid), msg }); return true; } catch (e) { return false; }
}
function sendPeerOrHost(targetUid, msg) {
  const uid = String(targetUid || '');
  if (!uid || uid === S.uid) return false;
  const direct = S.directConns[uid];
  if (direct && direct.open) { try { direct.send(msg); return true; } catch (e) {} }
  ensureDirectLinks();
  if (relayThroughHost(uid, msg)) return true;
  showConnectionError('⚠️ 플레이어 연결 오류', '상대 플레이어와 직접 P2P 연결에 실패했고\n세션 릴레이 연결도 사용할 수 없습니다.');
  return false;
}

/* 방장 이탈 → 우선순위 점수 기반 결정론적 선출 (모든 클라이언트가 같은 결과 도출) */
function onHostLost() {
  if (S.migrating || S.isHost) return;
  S.migrating = true;
  S.hostConn = null;
  S.pendingMoves = [];
  playSound('sys');
  setNetState('degraded');
  log('⚠️ 연결 역할이 바뀌었습니다. 세션을 다시 정리하는 중…');

  const cands = Object.values(S.players)
    .filter(p => p && p.id !== S.hostUid);
  if (!cands.find(p => p.id === S.uid)) cands.push(selfRecord());

  cands.sort((a, b) => {
    const ca = a.caps || {};
    const cb = b.caps || {};
    const sa = capabilityScore(ca);
    const sb = capabilityScore(cb);
    return (sb - sa) || (a.id < b.id ? -1 : 1);
  });
  const winner = cands[0];
  const gen = S.gen + 1;
  const next = {};
  cands.forEach(p => { next[p.id] = p; });
  S.players = next;
  S.hostUid = '';

  if (winner && winner.id === S.uid) {
    log('🔄 연결 역할이 전환되었습니다.');
    becomeHost(gen, false);
  } else if (winner) {
    log('🔄 세션 연결 역할이 전환되었습니다.');
    S.gen = gen; S.retry = 10;
    ensurePeer(() => connectToHost(hostId(S.code, gen)));
  } else {
    failJoin();
  }
}

/* ============================================================
   방장(호스트) 로직
   ============================================================ */
function becomeHost(gen, fresh) {
  ensurePeer(() => {
    if (S.players[S.uid]) S.players[S.uid].peerId = S.peer.id;
    ensureDirectLinks();
  });
  if (S.hostPeer && !S.hostPeer.destroyed) {
    try { S.hostPeer.destroy(); } catch (e) {}
  }
  if (S.hostTimer) { clearInterval(S.hostTimer); S.hostTimer = null; }

  S.isHost = true;
  S.gen = gen;
  S.hostUid = S.uid;
  S.graceUntil = fresh ? 0 : Date.now() + 10000;
  S.migrating = false;
  S.handoffBusy = false;
  S.handoffReady = false;
  S.betterHostUid = '';
  S.betterHostSince = 0;
  S.hostSwitchCooldownUntil = Date.now() + (fresh ? 5000 : 30000);
  if (!S.moveAck || typeof S.moveAck !== 'object') S.moveAck = {};
  S.moveAck[S.uid] = S.moveSeq;

  S.hostPeer = new Peer(hostId(S.code, gen), PEER_OPTIONS);
  S.hostPeer.on('connection', acceptClient);
  S.hostPeer.on('error', e => {
    const type = String(e && e.type || 'unknown');
    if (fresh && !S.started && S.quick && type === 'unavailable-id') {
      try { if (S.hostPeer && !S.hostPeer.destroyed) S.hostPeer.destroy(); } catch (_) {}
      S.isHost = false; S.hostPeer = null;
      if (S.code === 'PUB01') {
        /* 이미 다른 플레이어가 공개 광장을 만들고 있다는 뜻이다.
           새 공개방을 계속 생성하지 말고 기존 고정 세션으로 합류한다. */
        lobbyMsg('🔄 공개 광장이 이미 열려 있어. 기존 공개 광장에 접속하는 중…');
        setTimeout(() => {
          try { joinRoom('PUB01', 0, hostId('PUB01', 0)); }
          catch (_) {}
        }, 650);
      } else {
        S.code = Math.random().toString(36).slice(2, 7).toUpperCase();
        S.gen = 0;
        lobbyMsg('🔄 공개 방 주소가 충돌해서 새 방 주소를 발급하는 중…');
        setTimeout(() => createRoom(true), 0);
      }
      return;
    }
    log('세션 채널 오류: ' + type);
    if (fresh && !S.started) {
      S.isHost = false;
      showConnectionError('⚠️ 공개 P2P 서버 연결 오류', '공개 P2P 신호 서버에 연결하지 못했어 (' + type + '). 네트워크를 확인하고 다시 시도해줘.', () => { hideConnectionError(); cleanupNetwork(); createRoom(true); });
    }
  });
  S.hostPeer.on('disconnected', () => {
    if (S.isHost && S.hostPeer && !S.hostPeer.destroyed) {
      try { S.hostPeer.reconnect(); } catch (_) {}
    }
  });

  S.hostPeer.on('open', () => {
    S.migrating = false;
    if (S.players[S.uid]) S.players[S.uid].peerId = S.hostPeer.id;
    setNetState('connected');
    if (!S.started) enterGame();
    if (!fresh && S.hostConn && S.hostConn.open) {
      try { S.hostConn.send({ t: 'handoff_ready', g: S.gen }); } catch (e) {}
    }
    if (!fresh) broadcastEvent({ k: 'host', s: '🔄 세션 연결 역할이 전환되었습니다.' });
    else log('🏰 방을 열었습니다. 코드 ' + S.code + ' 를 친구에게 알려주세요.');
    S.hostTimer = setInterval(hostTick, 100);
    startHostMonitoring();
    if (S.capReportTimer) clearInterval(S.capReportTimer);
    startCapabilityReporting();
    S.recoverySession={code:String(S.code||'').toUpperCase(),gen:Number(S.gen)||0,roomName:String(S.roomName||'').slice(0,16),ts:Date.now()};
    if (S.roomPublishTimer) clearInterval(S.roomPublishTimer);
    S.roomPublishTimer = setInterval(publishRoom, 4000);
    publishRoom();
    updateBadge();
  });
}

function acceptClient(c) {
  c.on('data', m => hostRecv(c, m));
  c.on('close', () => {
    if (c.uid && S.conns[c.uid] === c) {
      const p = S.players[c.uid];
      delete S.conns[c.uid];
      delete S.players[c.uid];
      delete S.moveAck[c.uid];
      delete S.hostStats[c.uid];
      const tr=tradeForPlayer(c.uid);if(tr)clearTrade(tr,'상대방이 나가 거래가 취소되었습니다.');
      partyLeaveHost(c.uid, '👥 '+(p?p.name:'유저')+' 님이 나가 파티가 변경되었습니다.');
      Object.keys(S.partyInvites||{}).forEach(k=>{const inv=S.partyInvites[k];if(k===c.uid||(inv&&inv.from===c.uid))delete S.partyInvites[k];});
      broadcastEvent({ k: 'log', s: '👋 ' + (p ? p.name : '유저') + ' 님이 퇴장했습니다.' });
      publishRoom();
    }
  });
}

function sendTo(uid,msg){
  const d=S.directConns[uid];
  if(d&&d.open){try{d.send(msg);return true;}catch(e){}}
  const c=S.conns[uid];
  if(c&&c.open){try{c.send(msg);return true;}catch(e){}}
  return false;
}
function tradeForPlayer(uid){ return Object.values(S.trades).find(t=>t.a===uid||t.b===uid)||null; }
function sanitizeTrade(t){ return {id:t.id,a:t.a,b:t.b,ai:{...t.ai},bi:{...t.bi},ag:t.ag,bg:t.bg,ar:!!t.ar,br:!!t.br}; }
function pushTrade(t){ if(!t)return; const clean=sanitizeTrade(t), msg={t:'trade_state',trade:clean}; S.activeTrades=S.activeTrades||[]; if(t.a===S.uid){S.activeTrades=[clean];renderTradeFromEvent();} else sendTo(t.a,msg); if(t.b===S.uid){S.activeTrades=[clean];renderTradeFromEvent();} else sendTo(t.b,msg); }
function clearTrade(t,reason){ if(!t)return; delete S.trades[t.id]; if(t.a===S.uid) {closePanel();log(reason||'거래가 종료되었습니다.');} else sendTo(t.a,{t:'trade_end',reason:reason||'거래가 종료되었습니다.'}); if(t.b===S.uid) {closePanel();log(reason||'거래가 종료되었습니다.');} else sendTo(t.b,{t:'trade_end',reason:reason||'거래가 종료되었습니다.'}); }
function tradeValidateOffers(t){ const a=S.players[t.a],b=S.players[t.b]; if(!a||!b)return false; for(const [id,n] of Object.entries(t.ai)){if(!ITEMS[id]||n<0||n>itemCount(a,id))return false;} for(const [id,n] of Object.entries(t.bi)){if(!ITEMS[id]||n<0||n>itemCount(b,id))return false;} return t.ag>=0&&t.ag<=a.gold&&t.bg>=0&&t.bg<=b.gold; }
function executeTrade(t){
  if(!t)return;
  const a=S.players[t.a],b=S.players[t.b];
  if(!a||!b){clearTrade(t,'거래 상대가 나가 거래가 취소되었습니다.');return;}
  if(!tradeValidateOffers(t)){clearTrade(t,'거래 조건이 변경되어 취소되었습니다.');return;}

  /* 거래는 먼저 양쪽 가방에서 제거한 상태를 가상 적용한다.
     어느 한쪽이라도 공간/스택 제한을 통과하지 못하면 실제 상태는 건드리지 않는다. */
  const ia={...(a.inv||{})}, ib={...(b.inv||{})};
  const simCount=(inv,id)=>Math.max(0,Number(inv[id]||0));
  const simRemove=(inv,id,n)=>{const cur=simCount(inv,id);if(cur<n)return false;const left=cur-n;if(left)inv[id]=left;else delete inv[id];return true;};
  const simAdd=(inv,id,n)=>{
    const d=ITEMS[id]; if(!d||n<=0)return false;
    const cur=simCount(inv,id), maxStack=Math.max(1,Number(d.max)||99);
    if(cur+n>maxStack)return false;
    if(cur===0){
      const slots=Object.keys(inv).length;
      if(slots>=BAG_SLOTS)return false;
    }
    inv[id]=cur+n; return true;
  };
  for(const [id,n0] of Object.entries(t.ai||{})){const n=Math.max(0,Math.floor(Number(n0)||0));if(n&&!simRemove(ia,id,n))return clearTrade(t,'거래 조건이 변경되어 취소되었습니다.');if(n&&!simAdd(ib,id,n))return clearTrade(t,'상대방 가방 공간이 부족해 거래할 수 없습니다.');}
  for(const [id,n0] of Object.entries(t.bi||{})){const n=Math.max(0,Math.floor(Number(n0)||0));if(n&&!simRemove(ib,id,n))return clearTrade(t,'거래 조건이 변경되어 취소되었습니다.');if(n&&!simAdd(ia,id,n))return clearTrade(t,'내 가방 공간이 부족해 거래할 수 없습니다.');}
  const ag=Math.max(0,Math.floor(Number(t.ag)||0)),bg=Math.max(0,Math.floor(Number(t.bg)||0));
  if(ag>a.gold||bg>b.gold)return clearTrade(t,'골드가 변경되어 거래가 취소되었습니다.');

  a.inv=ia; b.inv=ib;
  a.gold=a.gold-ag+bg; b.gold=b.gold-bg+ag;
  normalizePlayer(a); normalizePlayer(b);
  delete S.trades[t.id];
  if(t.a===S.uid||t.b===S.uid){closePanel();log('✅ 거래 완료');}
  if(t.a!==S.uid)sendTo(t.a,{t:'trade_end',reason:'✅ 거래 완료'});
  if(t.b!==S.uid)sendTo(t.b,{t:'trade_end',reason:'✅ 거래 완료'});
  broadcastEvent({k:'log',s:'🤝 '+a.name+' ↔ '+b.name+' 거래 완료!'});
}

function addMonsterReward(p,e){ const drop=MON_DROPS[e]; if(drop&&Math.random()<drop.chance){const n=drop.min+rnd(drop.max-drop.min+1),got=addItem(p,drop.item,n);if(got)broadcastEvent({k:'log',s:'📦 '+p.name+' 님이 '+ITEMS[drop.item].icon+' '+ITEMS[drop.item].name+' x'+got+' 획득'});} if(e==='🦠'&&p.quest&&!p.quest.claimed){p.quest.progress=Math.min(QUESTS.slime_hunt.need,(p.quest.progress||0)+1);if(p.quest.progress>=QUESTS.slime_hunt.need)broadcastEvent({k:'log',s:'📜 '+p.name+' 님의 퀘스트 완료!'});} }
const CHAT_BAD_WORDS = [
  '씨발','시발','ㅆㅂ','ㅅㅂ','병신','ㅂㅅ','븅신','등신','개새끼','개새키','ㄱㅅㄲ','새끼','미친놈','미친년','ㅁㅊㄴ','꺼져','닥쳐','좆','ㅈㄴ','존나','졸라','섹스','sex','fuck','shit','bitch','asshole','nigger','retard'
];
const CHAT_LINK_RE = /(https?:\/\/|www\.|[a-z0-9-]+\.(com|net|org|kr|io|gg|me|tv)(?:\/|$))/i;
const CHAT_SPAM_WINDOW = 5000;
const CHAT_SPAM_LIMIT = 4;
const CHAT_REPEAT_LIMIT = 3;

function normalizeChatForFilter(text){
  return String(text||'')
    .normalize('NFKC')
    .toLowerCase()
    .replace(/[\u200b-\u200f\u202a-\u202e\ufeff]/g,'')
    .replace(/[\s._\-~`!@#$%^&*()=+\[\]{}<>|\\/\:;,'\"`·•…]+/g,'')
    .replace(/0/g,'o').replace(/1/g,'i').replace(/3/g,'e').replace(/4/g,'a').replace(/5/g,'s').replace(/7/g,'t')
    .replace(/ㅆ+/g,'ㅆ').replace(/ㅅ+/g,'ㅅ').replace(/ㅂ+/g,'ㅂ').replace(/ㅈ+/g,'ㅈ');
}

function censorChatText(text){
  let clean=String(text||'').replace(/\s+/g,' ').trim().slice(0,80);
  if(!clean)return {ok:false,text:''};
  if(CHAT_LINK_RE.test(clean))return {ok:false,text:''};
  const normalized=normalizeChatForFilter(clean);
  for(const bad of CHAT_BAD_WORDS){
    const b=normalizeChatForFilter(bad);
    if(b && normalized.includes(b)) return {ok:false,text:''};
  }
  // 반복 문자 도배 완화: 같은 글자/기호가 과도하게 반복되면 축약
  clean=clean.replace(/(.)\1{5,}/gu,'$1$1$1');
  // 과도한 이모지/기호 도배 방지
  if((clean.match(/[!！?？]{5,}/g)||[]).length) clean=clean.replace(/[!！?？]{4,}/g,'!!!');
  return {ok:true,text:clean};
}

function allowChatMessage(uid,text){
  const now=Date.now();
  const g=S.chatGuard[uid]||(S.chatGuard[uid]={times:[],last:'',repeat:0});
  g.times=g.times.filter(t=>now-t<CHAT_SPAM_WINDOW);
  if(g.times.length>=CHAT_SPAM_LIMIT)return false;
  if(text===g.last){g.repeat++;if(g.repeat>=CHAT_REPEAT_LIMIT)return false;}else{g.last=text;g.repeat=1;}
  g.times.push(now);
  return true;
}

function publicChatText(text){ return censorChatText(text).ok ? censorChatText(text).text : ''; }

function hostRecv(c, m) {
  if (!m || typeof m !== 'object') return;

  if (m.t === 'relay' && c.uid) {
    const target = String(m.to || '');
    const inner = m.msg && typeof m.msg === 'object' ? { ...m.msg } : null;
    if (!target || !inner || !S.players[target] || target === c.uid) return;
    if (!DIRECT_REQUEST_TYPES.has(inner.t)) return;
    inner.from = c.uid; inner.to = target;
    sendTo(target, inner);
  } else if (m.t === 'hello' && m.p) {
    if (Object.keys(S.players).length >= 12 && !S.players[String(m.p.id)]) {
      c.close(); return;
    }

    const id = String(m.p.id || '').slice(0, 12);
    if (!/^[a-z0-9_-]{4,12}$/i.test(id)) {
      c.close(); return;
    }

    const oldConn = S.conns[id];
    if (oldConn && oldConn !== c) {
      try { oldConn.close(); } catch (e) {}
    }

    const old = S.players[id];
    const rawCaps = m.p.caps && typeof m.p.caps === 'object' ? m.p.caps : {};
    const caps = {
      cores: clamp(+rawCaps.cores || 2, 1, 256),
      ram: clamp(+rawCaps.ram || 4, 0.25, 1024),
      cpuPerf: clamp(+rawCaps.cpuPerf || 1, 1, 1e9),
      browserRtt: clamp(+rawCaps.browserRtt || 80, 1, 5000),
      measuredRtt: null,
      lastPongAt: 0,
      updatedAt: Date.now()

    const incomingFriendCode = String(m.p.friendCode || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0,8);
    const safeFriendCode = /^[A-Z0-9]{6,8}$/.test(incomingFriendCode) ? incomingFriendCode : ('FC' + id.slice(0,6).toUpperCase());
    const p = old ? { ...old } : newPlayer(
      id,
      String(m.p.name || '모험가').slice(0, 10),
      EMOJIS.includes(m.p.emoji) ? m.p.emoji : EMOJIS[0],
      capabilityScore(caps),
      safeFriendCode

    p.caps = caps;
    p.score = capabilityScore(caps);
    S.hostStats[id] = caps;

    // 진행 상태(HP/XP/골드)는 클라이언트가 임의로 올려 보내지 못하도록 서버 값을 사용한다.
    if (!old) {

        const incoming = m.p.accountData && typeof m.p.accountData === 'object' ? m.p.accountData : null;
        const recovery = String(m.p.recoveryCode || '');

          let verified = false;
          try {
            const decoded = parseRecoveryCode(recovery);
            const inc = starterPlayer(id, String(incoming.name||p.name), EMOJIS.includes(incoming.emoji)?incoming.emoji:p.emoji, capabilityScore(caps), safeFriendCode);
            Object.assign(inc,incoming); inc.id=id; normalizePlayer(inc);
            verified = JSON.stringify(playerAccountData(decoded)) === JSON.stringify(playerAccountData(inc));
          } catch(e) { verified = false; }
          if (verified) {
            const snap = starterPlayer(id, String(incoming.name||p.name), EMOJIS.includes(incoming.emoji)?incoming.emoji:p.emoji, capabilityScore(caps), safeFriendCode);
            Object.assign(snap,incoming); snap.id=id; snap.name=String(incoming.name||p.name).slice(0,10); snap.emoji=EMOJIS.includes(incoming.emoji)?incoming.emoji:p.emoji; snap.friendCode=/^[A-Z0-9]{6,8}$/.test(String(incoming.friendCode||''))?String(incoming.friendCode).toUpperCase():safeFriendCode;
            normalizePlayer(snap); Object.assign(p,snap);

    const list=m.items&&typeof m.items==='object'?m.items:{};const next={};Object.entries(list).forEach(([id,n])=>{if(ITEMS[id]){const q=Math.max(0,Math.min(itemCount(p,id),Math.floor(Number(n)||0)));if(q)next[id]=q;}});
    t[mine]=next;t[goldKey]=Math.max(0,Math.min(p.gold,Math.floor(Number(m.gold)||0)));t.a===c.uid?(t.ar=false):(t.br=false);pushTrade(t);
  } else if (m.t === 'trade_ready' && c.uid) {

  } else if (m.t === 'trade_cancel' && c.uid) {

    S.chat.push(msg);if(S.chat.length>60)S.chat.shift();

    else {bcast({t:'chat',m:msg});if(S.overlayOpenChat)renderChat();}
  } else if (m.t === 'party_invite' && c.uid && S.players[c.uid]) {
    const to=String(m.to||'');if(to===c.uid||!S.players[to])return;const own=partyForPlayer(c.uid);if(own&&own.leader!==c.uid)return;const tp=partyForPlayer(to);if(tp)return;if(own&&own.members.length>=4)return;S.partyInvites[to]={from:c.uid,ts:Date.now()};sendTo(to,{t:'party_invite',from:c.uid,name:S.players[c.uid].name});
  } else if (m.t === 'party_accept' && c.uid && S.players[c.uid]) {

  } else if (m.t === 'party_leave' && c.uid) {

  } else if (m.t === 'party_promote' && c.uid) {
    const pt=partyForPlayer(c.uid),target=String(m.target||'');if(!pt||pt.leader!==c.uid||!pt.members.includes(target))return;pt.leader=target;broadcastPartyState();

  } else if (m.t === 'shop_buy' && c.uid && S.players[c.uid]) {

function snapshot() {
  return {t:'snap',p:S.players,m:S.mons,g:S.gen,h:S.uid,a:S.moveAck,hs:S.hostStats,chat:S.chat.slice(-40),tr:Object.values(S.trades).map(sanitizeTrade),pt:S.parties};
}

function bcast(msg) {
  Object.values(S.conns).forEach(c => {
    if (c.open) {
      try { c.send(msg); } catch (e) {}
    }
  });
}

function broadcastEvent(ev) {
  ev.t = 'ev';
  bcast(ev);
  handleEvent(ev);
}

function spawnMon() {
  const r = Math.random();
  for (let attempt = 0; attempt < 80; attempt++) {
    let x, y, e;
    if(r < 0.18){
      const dr=MAP_REGIONS.dungeon; x=dr.x+1+rnd(dr.w-2); y=dr.y+1+rnd(dr.h-2);
      e = Math.random()<0.55 ? '👺' : (Math.random()<0.75 ? '🐉' : '🦠');
    } else {
      x=4+rnd(W-8); y=3+rnd(H-6);
      const zone=regionAt(x,y); if(zone.safe||zone.key==='dungeon') continue;
      e = Math.random()<0.6 ? '🦠' : (Math.random()<0.9 ? '👺' : '🐉');
    }
    if(isBlocked(x,y)||isSafeZone(x,y)) continue;
    const playerBusy=Object.values(S.players).some(p=>p.x===x&&p.y===y);
    const monsterBusy=S.mons.some(m=>m.x===x&&m.y===y);
    if(playerBusy||monsterBusy) continue;
    S.mons.push({id:S.monSeq++,e,x,y,hp:MONS[e].hp,mx:MONS[e].hp,next:Date.now()+1200});
    return;
  }
}

function tryMove(dx, dy) {
  const p = S.players[S.uid], now = Date.now();
  if (!p || S.migrating || now - S.lastMove < 85) return;
  dx = clamp(dx | 0, -1, 1); dy = clamp(dy | 0, -1, 1);
  if (Math.abs(dx) + Math.abs(dy) !== 1) return;
  const nx = clamp(p.x + dx, 0, W - 1), ny = clamp(p.y + dy, 0, H - 1);
  if (nx === p.x && ny === p.y) return;
  if (isBlocked(nx,ny)) return;
  const monster = S.mons.find(m => m.x===nx && m.y===ny);
  if (monster) { attack(); return; }
  if (Object.values(S.players).some(q=>q.id!==S.uid&&q.x===nx&&q.y===ny)) return;
  S.lastMove = now; playSound('move');
  if (S.isHost) { p.x=nx; p.y=ny; S.moveSeq++; S.moveAck[S.uid]=S.moveSeq; }
  else if (S.hostConn && S.hostConn.open) {
    const seq=++S.moveSeq; S.pendingMoves.push({s:seq,dx,dy}); p.x=nx; p.y=ny; S.hostConn.send({t:'mv',s:seq,dx,dy});
  }
}

function findPath(start,target){
  if(!start||!target||isBlocked(target.x,target.y)) return [];
  const key=(x,y)=>x+','+y, startK=key(start.x,start.y), targetK=key(target.x,target.y);
  const open=[{x:start.x,y:start.y,g:0,f:0}], came=new Map(), cost=new Map([[startK,0]]);
  while(open.length){
    open.sort((a,b)=>a.f-b.f); const cur=open.shift(); const ck=key(cur.x,cur.y);
    if(ck===targetK){ const path=[]; let k=ck; while(k!==startK){ const q=came.get(k); if(!q) break; path.push(q.step); k=q.from; } return path.reverse(); }
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=cur.x+dx,ny=cur.y+dy,nk=key(nx,ny);
      if(isBlocked(nx,ny)) continue;
      const occupied=Object.values(S.players).some(p=>p.id!==S.uid&&p.x===nx&&p.y===ny); if(occupied) continue;
      const ng=cur.g+1; if(ng>50) continue; if(cost.has(nk)&&ng>=cost.get(nk)) continue;
      cost.set(nk,ng); const h=Math.abs(target.x-nx)+Math.abs(target.y-ny); open.push({x:nx,y:ny,g:ng,f:ng+h}); came.set(nk,{from:ck,step:[dx,dy]});
    }
  }
  return [];
}

function setWalkTarget(x,y){
  const p=S.players[S.uid]; if(!p) return;
  x=clamp(x,0,W-1); y=clamp(y,0,H-1); S.walkTo={x,y}; S.walkPath=findPath({x:p.x,y:p.y},{x,y});
  if(!S.walkPath.length && (p.x!==x||p.y!==y)) S.walkTo=null;
}

function attack() {
  const now = Date.now();
  if (now - S.lastAtk < 350 || S.migrating) return;
  S.lastAtk = now;
  if (S.isHost) doAttack(S.uid);
  else if (S.hostConn && S.hostConn.open) S.hostConn.send({ t: 'atk', targetId: String(S.targetMonsterId || '') });
}

function bindInput() {
  if (S.inputBound) return;
  S.inputBound = true;
  const keys = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1] };
  const held = new Map();
  const isTyping = el => {
    if(!el) return false;
    const tag=String(el.tagName||'').toUpperCase();
    return tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||el.isContentEditable;
  };
  const keyName = key => String(key||'').toLowerCase();
  const stopHeld = key => {
    const k=keyName(key), rec=held.get(k);
    if(!rec) return;
    clearInterval(rec.timer);
    held.delete(k);
  };
  const stopAllHeld = () => Array.from(held.keys()).forEach(stopHeld);
  const startHeld = key => {
    const k=keyName(key), dir=keys[key]||keys[k];
    if(!dir || held.has(k) || !S.started || isTyping(document.activeElement)) return;
    S.walkTo=null;
    // 첫 칸은 기다리지 않고 꾹 누르는 순간 즉시 이동
    tryMove(dir[0],dir[1]);
    const timer=setInterval(()=>{
      if(!S.started || isTyping(document.activeElement)){ stopHeld(k); return; }
      S.walkTo=null;
      tryMove(dir[0],dir[1]);
    },90);
    held.set(k,{timer});
  };
  window.addEventListener('keydown', e => {
    if (!S.started || isTyping(e.target)) return;
    const k = keys[e.key] || keys[e.key.toLowerCase()];
    if (k) {
      e.preventDefault();
      if(!e.repeat) startHeld(e.key);
    } else if (e.key === ' ') {
      e.preventDefault();
      attack();
    }
  }, true);
  window.addEventListener('keyup', e => {
    if(keys[e.key] || keys[e.key.toLowerCase()]) {
      stopHeld(e.key);
      e.preventDefault();

function tradeForPlayerClient(uid){if(!S.activeTrades)return null;return S.activeTrades.find(t=>t.a===uid||t.b===uid)||null;}
function renderChat(){
  S.overlayOpenChat=true;
  const ch=S.chatChannel||'all';
  const msgs=(S.chat||[]).slice(-50).filter(m=>!isBlockedChatMessage(m)&&(ch==='all'||m.ch===ch));
  let html='<div class="chatTabs"><button class="chatTab '+(ch==='all'?'active':'')+'" data-ch="all">🌐 전체</button><button class="chatTab '+(ch==='party'?'active':'')+'" data-ch="party">👥 파티</button></div>';
  html+='<div class="chatLog" id="chatLog">';
  msgs.forEach(m=>{html+='<div class="chatMsg"><b>'+escapeHtml((m.ch==='party'?'👥 ':'')+m.name)+':</b> '+escapeHtml(m.s)+'</div>';});
  if(!msgs.length)html+='<div class="empty">아직 대화가 없어.</div>';
  html+='</div><div class="chatNotice">채팅은 욕설·우회 표현·링크·도배를 자동 차단해. 👥 파티 채팅은 같은 파티원에게만 전달돼.</div><div class="chatInput"><input id="chatInput" maxlength="80" placeholder="'+(ch==='party'?'파티에게 메시지':'모두에게 메시지')+'"><button id="chatSend">전송</button></div>';
  openPanel('💬 채팅',html);
  $('panelBody').querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{S.chatChannel=b.dataset.ch;renderChat();});
  const send=()=>{const r=publicChatTextClient($('chatInput').value);if(!r.ok){$('chatInput').value='';return;}sendLocalHost({t:'chat',s:r.text,ch:S.chatChannel||'all'});$('chatInput').value='';};
  $('chatSend').onclick=send;$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
  setTimeout(()=>{const el=$('chatLog');if(el)el.scrollTop=el.scrollHeight;},0);
}
function renderQuest(){const p=S.players[S.uid],q=p&&p.quest,d=q&&QUESTS[q.id];if(!p||!d)return;const done=q.progress>=d.need;let html='<div class="quest"><b>'+d.name+'</b><div style="margin-top:5px">'+d.text+'</div><progress max="'+d.need+'" value="'+Math.min(q.progress,d.need)+'"></progress><div style="margin-top:6px">'+q.progress+' / '+d.need+'</div><div style="margin-top:7px">보상: 💰 '+d.gold+' + '+ITEMS[d.item].icon+' '+ITEMS[d.item].name+' x'+d.count+'</div>';if(done&&!q.claimed)html+='<button id="questClaim" style="margin-top:8px">🎁 보상 받기</button>';else if(q.claimed)html+='<div style="margin-top:8px;color:var(--ok)">보상 완료</div>';html+='</div>';openPanel('📜 퀘스트',html);if($('questClaim'))$('questClaim').onclick=()=>sendLocalHost({t:'quest_claim'});}
