<script>
(function installRpgTutorialV49(){
  'use strict';
  if(typeof window==='undefined'||typeof S==='undefined')return;

  const KEY='emoji-rpg-tutorial-v49';
  const STEP_COUNT=6;
  let state={step:0,moved:0,talked:false,portalOpened:false,fieldReached:false,attacked:false,townReturned:false,active:false};
  let lastPos=null;
  let moveAccumulator=0;
  let wrapped={talk:false,teleportOpen:false,teleport:false,attack:false,guide:false};
  let uiTimer=null;

  /* 구형 페이지형 튜토리얼은 단계형 v49가 대신 담당한다. */
  S._tutorialShown=true;
  try{const old=document.getElementById('rpgTutorialV32');if(old)old.remove();}catch(_e){}

  function readSaved(){
    try{
      const raw=localStorage.getItem(KEY)||'';if(!raw)return null;
      const o=JSON.parse(raw);if(!o||o.done)return null;return o;
    }catch(_e){return null;}
  }
  function saveState(){
    try{localStorage.setItem(KEY,JSON.stringify({step:state.step,moved:state.moved,done:false}));}catch(_e){}
  }
  function markDone(){
    state.active=false;state.step=STEP_COUNT;hideUi();
    try{localStorage.setItem(KEY,JSON.stringify({done:true,completedAt:Date.now()}));}catch(_e){}
    try{log('🎉 튜토리얼 완료! 이제 루미나 마을과 바람초원을 자유롭게 탐험해 봐.');}catch(_e){}
  }
  function stageEl(){return document.getElementById('stage');}
  function ensureUi(){
    const st=stageEl();if(!st)return;
    if(!document.getElementById('rpgTutorialV49')){
      const box=document.createElement('div');box.id='rpgTutorialV49';box.innerHTML=
        '<div class="tutorialV49Card">'+
          '<div class="tutorialV49Icon" id="tutorialV49Icon">🧭</div>'+
          '<div><div class="tutorialV49Top"><div class="tutorialV49Title" id="tutorialV49Title"></div><div class="tutorialV49Count" id="tutorialV49Count"></div></div>'+ 
          '<div class="tutorialV49Text" id="tutorialV49Text"></div>'+
          '<div class="tutorialV49Objective" id="tutorialV49Objective"></div>'+
          '<div class="tutorialV49Foot"><div class="tutorialV49Progress"><i id="tutorialV49Progress"></i></div><button class="tutorialV49Skip" id="tutorialV49Skip">튜토리얼 종료</button></div></div></div>';
      st.appendChild(box);
    }
    if(!document.getElementById('rpgTutorialMarkerV49')){
      const marker=document.createElement('div');marker.id='rpgTutorialMarkerV49';marker.innerHTML='<div class="tutorialV49MarkerRing"></div><div class="tutorialV49MarkerLabel" id="tutorialV49MarkerLabel"></div>';st.appendChild(marker);
    }
  }
  function hideUi(){
    const a=document.getElementById('rpgTutorialV49'),m=document.getElementById('rpgTutorialMarkerV49');
    if(a)a.classList.remove('show');if(m)m.classList.remove('show');
    if(uiTimer){clearInterval(uiTimer);uiTimer=null;}
  }
  function currentPlayer(){return S.players&&S.players[S.uid]||null;}
  function mapName(id){try{return RPG_MAPS[id]?.name||id||'';}catch(_e){return id||'';}}
  function npc(id){try{return RPG_NPCS?.[id]||null;}catch(_e){return null;}}
  function portal(id){
    try{for(const arr of Object.values(RPG_PORTALS||{})){const p=arr.find(x=>x.id===id);if(p)return p;}}catch(_e){}
    return null;
  }
  function nearestSlime(p){
    if(!p||!Array.isArray(S.mons))return null;let best=null,d=1e9;
    for(const m of S.mons){if(m.map!==p.map||m.e!=='🦠')continue;const dd=Math.abs(m.x-p.x)+Math.abs(m.y-p.y);if(dd<d){d=dd;best=m;}}
    return best;
  }
  function nearTarget(p,t,range=2){return !!(p&&t&&String(p.map)===String(t.map)&&Math.max(Math.abs(p.x-t.x),Math.abs(p.y-t.y))<=range);}

  const steps=[
    {icon:'🎮',title:'움직임부터 익혀 보자',text:'루미나 마을은 안전한 시작 마을이야. 설명만 읽지 말고 직접 이동해 보자.',objective:'WASD 또는 방향키로 4칸 이상 실제로 이동하기',kind:'move'},
    {icon:'💬',title:'NPC에게 말을 걸어 보자',text:'NPC 가까이에 다가가면 화면 아래에 "💬 NPC 이름 · E를 눌러 말 걸기" 안내가 나타나.\n그 표시가 뜬 상태에서 E를 누르면 바로 NPC와 대화가 열려.',objective:'주민 소리에게 다가가서 E를 눌러 대화창 열기',kind:'talk'},
    {icon:'🌀',title:'이동석을 사용해 보자',text:'마을 중앙의 이동석은 지역을 연결해 줘. 이동석 가까이에서 M을 누르면 이동 메뉴가 열려.',objective:'중앙 텔레포트석 근처에서 M을 눌러 이동 메뉴 열기',kind:'portal'},
    {icon:'🌿',title:'첫 사냥터로 나가자',text:'이제 직접 바람초원으로 가 보자. 이동 메뉴에서 바람초원을 선택하면 돼.',objective:'이동 메뉴에서 "바람초원"을 선택해 실제로 이동하기',kind:'field'},
    {icon:'⚔️',title:'첫 전투를 해 보자',text:'바람초원에서는 몬스터와 싸울 수 있어. 슬라임 하나를 찾아 공격 버튼이나 Space를 사용해 보자.',objective:'🦠 슬라임을 향해 기본 공격을 1회 사용하기',kind:'attack'},
    {icon:'🏠',title:'마을로 돌아오면 끝!',text:'모험은 나갔다가 돌아오는 것까지가 한 세트야.\n바람초원 이동석에서 마을로 돌아오면 튜토리얼을 마칠 수 있어.',objective:'이동석을 이용해 루미나 마을로 돌아오기',kind:'return'}
  ];

  function render(){
    ensureUi();const s=steps[state.step];if(!s)return markDone();
    const a=document.getElementById('rpgTutorialV49');if(!a)return;
    a.classList.add('show');
    document.getElementById('tutorialV49Icon').textContent=s.icon;
    document.getElementById('tutorialV49Title').textContent=s.title;
    document.getElementById('tutorialV49Count').textContent='단계 '+(state.step+1)+' / '+STEP_COUNT;
    document.getElementById('tutorialV49Text').textContent=s.text;
    document.getElementById('tutorialV49Objective').textContent='🎯 '+s.objective;
    document.getElementById('tutorialV49Progress').style.width=Math.round((state.step/STEP_COUNT)*100)+'%';
  }

  function markerTarget(){
    const p=currentPlayer();if(!p)return null;
    const s=steps[state.step];if(!s)return null;
    if(s.kind==='talk')return npc('villagerSori');
    if(s.kind==='portal')return portal('town_core');
    if(s.kind==='attack')return nearestSlime(p);
    if(s.kind==='return'){
      const list=RPG_PORTALS?.[p.map]||[];return list.find(x=>x.dest?.includes('town'))||list[0]||null;
    }
    return null;
  }
  function updateMarker(){
    const el=document.getElementById('rpgTutorialMarkerV49');if(!el)return;
    const t=markerTarget(),p=currentPlayer();
    if(!state.active||!t||!p||String(t.map)!==String(p.map)||typeof worldToScreen!=='function'||typeof boardMetrics!=='function'){
      el.classList.remove('show');return;
    }
    try{
      const m=boardMetrics(),q=worldToScreen(t.x,t.y,m),cv=document.getElementById('board'),st=stageEl();
      if(!cv||!st)return;
      const cr=cv.getBoundingClientRect(),sr=st.getBoundingClientRect();
      el.style.left=Math.round(cr.left-sr.left+q.x+m.tw/2)+'px';
      el.style.top=Math.round(cr.top-sr.top+q.y+m.th/2-6)+'px';
      const lab=document.getElementById('tutorialV49MarkerLabel');
      if(lab)lab.textContent=state.step===1?'E · 말 걸기':state.step===2?'M · 이동 메뉴':state.step===4?'⚔️ · 공격':'목표';
      el.classList.add('show');
    }catch(_e){el.classList.remove('show');}
  }

  function resetStartPosition(){const p=currentPlayer();lastPos=p?{map:p.map,x:p.x,y:p.y}:null;moveAccumulator=0;}
  function startTutorial(manual=false){
    const saved=manual?null:readSaved();
    state={step:0,moved:0,talked:false,portalOpened:false,fieldReached:false,attacked:false,townReturned:false,active:true};
    if(saved){state.step=Math.max(0,Math.min(STEP_COUNT-1,Number(saved.step)||0));state.moved=Math.max(0,Number(saved.moved)||0);}
    resetStartPosition();S._tutorialV49Active=true;S._tutorialShown=true;closePanel?.();ensureUi();render();
    if(!uiTimer)uiTimer=setInterval(tick,120);
    try{log(manual?'🧭 튜토리얼을 다시 시작했어. 목표를 하나씩 직접 따라가면 돼.':'🧭 루미나 모험가 튜토리얼을 시작할게. 설명만 읽지 말고 직접 움직여 봐.');}catch(_e){}
  }
  function stopTutorial(save=true){
    if(save)saveState();state.active=false;S._tutorialV49Active=false;hideUi();
    try{log('🧭 튜토리얼을 종료했어. 게임 설명에서 다시 시작할 수 있어.');}catch(_e){}
  }

  function advance(next){
    state.step=Math.max(0,Math.min(STEP_COUNT,next));saveState();
    if(state.step>=STEP_COUNT){markDone();return;}
    render();
    try{playSound?.('quest');}catch(_e){}
  }

  function objectiveSatisfied(){
    const p=currentPlayer();if(!p)return false;
    switch(steps[state.step].kind){
      case 'move': return state.moved>=4;
      case 'talk': return state.talked;
      case 'portal': return state.portalOpened;
      case 'field': return state.fieldReached;
      case 'attack': return state.attacked;
      case 'return': return state.townReturned;
    }
    return false;
  }

  function tick(){
    if(!state.active){if(uiTimer){clearInterval(uiTimer);uiTimer=null;}return;}
    const p=currentPlayer();if(!p)return;
    if(steps[state.step].kind==='move'&&lastPos&&String(lastPos.map)===String(p.map)){
      if(p.x!==lastPos.x||p.y!==lastPos.y){moveAccumulator++;state.moved=Math.max(state.moved,moveAccumulator);lastPos={map:p.map,x:p.x,y:p.y};saveState();}
    }else if(!lastPos||String(lastPos.map)!==String(p.map)){lastPos={map:p.map,x:p.x,y:p.y};}

    const kind=steps[state.step].kind;
    if(kind==='portal'){
      const t=portal('town_core');if(nearTarget(p,t,2)&&!state.portalOpened){/* 근처 도달은 표시만 하고 M으로 실제 메뉴를 열게 함 */}
    }
    if(kind==='field'&&String(p.map)==='field')state.fieldReached=true;
    if(kind==='return'&&String(p.map)==='town')state.townReturned=true;

    if(objectiveSatisfied()){
      if(kind==='move'){state.moved=4;advance(1);return;}
      if(kind==='talk'){advance(2);return;}
      if(kind==='portal'){advance(3);return;}
      if(kind==='field'){advance(4);return;}
      if(kind==='attack'){advance(5);return;}
      if(kind==='return'){advance(6);return;}
    }
    render();updateMarker();
  }

  function wrapHooks(){
    if(!wrapped.talk&&typeof window.showNpcDialogueV32==='function'){
      const old=window.showNpcDialogueV32;wrapped.talk=true;
      window.showNpcDialogueV32=function(id){
        const out=old.apply(this,arguments);
        if(state.active&&steps[state.step]?.kind==='talk'&&String(id)==='villagerSori')state.talked=true;
        return out;
      };
    }
    if(!wrapped.teleportOpen){
      const names=['renderTeleportPanelRpg','renderTeleportPanel'];
      for(const name of names){
        if(typeof window[name]!=='function')continue;
        const old=window[name];
        window[name]=function(){const out=old.apply(this,arguments);if(state.active&&steps[state.step]?.kind==='portal')state.portalOpened=true;return out;};
      }
      wrapped.teleportOpen=true;
    }
    if(!wrapped.teleport&&typeof window.requestTeleportRpg==='function'){
      const old=window.requestTeleportRpg;wrapped.teleport=true;
      window.requestTeleportRpg=function(dest){
        const out=old.apply(this,arguments);
        if(state.active&&steps[state.step]?.kind==='field'&&String(dest)==='field')state.fieldReached=true;
        return out;
      };
      window.requestTeleport=window.requestTeleportRpg;
    }
    if(!wrapped.attack&&typeof window.attack==='function'){
      const old=window.attack;wrapped.attack=true;
      window.attack=function(){const out=old.apply(this,arguments);if(state.active&&steps[state.step]?.kind==='attack')state.attacked=true;return out;};
    }
    if(!wrapped.guide&&typeof window.renderGuide==='function'){
      /* 기존 initLobby가 저장한 원본 click 핸들러가 있을 수 있으므로
         함수 교체만 믿지 않고 btnGuide 클릭에서도 restart 버튼을 주입한다. */
      wrapped.guide=true;
      const gb=document.getElementById('btnGuide');
      if(gb&&!gb.dataset.tutorialV49GuideHook){
        gb.dataset.tutorialV49GuideHook='1';
        gb.addEventListener('click',()=>setTimeout(injectGuideRestart,120),true);
      }
    }
  }

  document.addEventListener('click',e=>{
    const t=e.target;
    if(t?.id==='tutorialV49Skip'){e.preventDefault();stopTutorial(true);return;}
    if(state.active&&steps[state.step]?.kind==='talk'){
      const el=t?.closest?t.closest('#mobileNpcTalkV32,#btnNpc'):null;
      if(el){
        const p=currentPlayer(),n=npc('villagerSori');
        if(nearTarget(p,n,2))state.talked=true;
      }
    }
    if(t?.closest&&t.closest('#btnGuide')){
      setTimeout(()=>injectGuideRestart(),120);
    }
    if(state.active&&steps[state.step]?.kind==='attack'){
      const el=t?.closest?t.closest('#btnAtk,[data-action="attack"]'):null;
      if(el){
        const p=currentPlayer(),m=nearestSlime(p);
        if(m&&Math.max(Math.abs(m.x-p.x),Math.abs(m.y-p.y))<=2)state.attacked=true;
      }
    }
  },true);

  document.addEventListener('keydown',e=>{
    if(!state.active)return;
    const k=String(e.key||'').toLowerCase();
    if(steps[state.step]?.kind==='talk'&&k==='e'){
      const p=currentPlayer(),n=npc('villagerSori');
      if(nearTarget(p,n,2))state.talked=true;
    }
    if(steps[state.step]?.kind==='portal'&&k==='m'){
      const p=currentPlayer(),n=portal('town_core');
      if(nearTarget(p,n,2))state.portalOpened=true;
    }
    if(steps[state.step]?.kind==='attack'&&(k===' '||k==='space')){
      const p=currentPlayer(),m=nearestSlime(p);
      if(m&&Math.max(Math.abs(m.x-p.x),Math.abs(m.y-p.y))<=2)state.attacked=true;
    }
  },true);

  function injectGuideRestart(){
    const body=document.getElementById('panelBody');
    if(!body||document.getElementById('tutorialRestartV49'))return;
    const b=document.createElement('button');b.id='tutorialRestartV49';b.type='button';b.textContent='🧭 단계형 튜토리얼 다시 시작';
    b.style.width='100%';b.style.marginTop='8px';
    b.onclick=()=>{try{closePanel();}catch(_e){}startTutorial(true);};
    body.appendChild(b);
  }

  /* 항상 하나뿐인 E 상호작용 안내를 더 명확하게 만든다. */
  const promptTimer=setInterval(()=>{
    try{
      const p=currentPlayer();const el=document.getElementById('rpgInteractionHintV48');if(!p||!el)return;
      const n=typeof nearestActiveNpc==='function'?nearestActiveNpc():null;
      if(n){el.textContent='💬 '+String(n.name||'NPC')+' · E를 눌러 말 걸기';el.classList.add('show');}
    }catch(_e){}
  },180);

  const bootTimer=setInterval(()=>{
    try{
      wrapHooks();
      const p=currentPlayer();
      if(S.started&&p){
        if(!state.active){
          let fresh=false;
          try{fresh=!!S._firstTimePlayer && !JSON.parse(localStorage.getItem(KEY)||'null')?.done;}catch(_e){fresh=!!S._firstTimePlayer;}
          if(fresh&&Number(p.lv||1)<=1&&!readSaved())startTutorial(false);
        }
        if(state.active){tick();}
      }
      if(wrapped.guide && bootTimer){}
    }catch(_e){}
  },250);
  window.__rpgTutorialV49Start=()=>startTutorial(true);
  window.__rpgTutorialV49Stop=()=>stopTutorial(false);
  window.__rpgTutorialV49State=()=>({...state});
  window.__rpgTutorialV49CompleteTalk=()=>{
    try{
      if(!state.active || steps[state.step]?.kind!=='talk')return false;
      state.talked=true;
      advance(2);
      return true;
    }catch(_e){return false;}
  };
  window.__rpgTutorialV49CompletePortal=()=>{
    try{
      if(!state.active || steps[state.step]?.kind!=='portal')return false;
      state.portalOpened=true;
      advance(3);
      return true;
    }catch(_e){return false;}
  };
  window.__rpgTutorialV49CompleteField=()=>{
    try{
      if(!state.active || steps[state.step]?.kind!=='field')return false;
      state.fieldReached=true;
      advance(4);
      return true;
    }catch(_e){return false;}
  };
  window.__rpgTutorialV49CompleteAttack=()=>{
    try{
      if(!state.active || steps[state.step]?.kind!=='attack')return false;
      state.attacked=true;
      advance(5);
      return true;
    }catch(_e){return false;}
  };
})();
</script>


<!-- RPG v87: 안정 기준(v71) 위에 안전하게 추가한 UI/세션 개선 -->

  /* 공개 광장은 목록에서 하나의 논리 세션처럼 보이게 한다. */

</style>
<script id="rpgV87SafePatch">
(function(){
  'use strict';
  if(window.__rpgV87SafePatch)return;
  window.__rpgV87SafePatch=true;

  function isPhone(){
    const ua=navigator.userAgent||'';
    const phone=/Android.+Mobile|iPhone|iPod|Windows Phone|Mobile/i.test(ua);
    return phone && Math.min(screen.width||innerWidth,innerWidth)>=0 && Math.min(innerWidth,innerHeight)<=720;
  }
  function syncPhoneClass(){
    const phone=isPhone();
    document.body.classList.toggle('rpg-phone-ui',phone);
    document.body.classList.toggle('rpg-phone-portrait',phone && innerHeight>innerWidth && !!(S.started));
  }
  function makePhoneUi(){
    if(document.getElementById('rpgV87PhoneToggle'))return;
    const stage=document.getElementById('stage'); if(!stage)return;
    const b=document.createElement('button');b.id='rpgV87PhoneToggle';b.type='button';b.setAttribute('aria-label','모바일 메뉴');b.textContent='☰';
    const menu=document.createElement('div');menu.id='rpgV87PhoneMenu';
    const items=[
      ['🎒 가방','btnInv'],['🤝 거래','btnTrade'],['💬 채팅','btnChat'],['📜 퀘스트','btnQuest'],
      ['👥 친구/파티','btnSocial'],['🗺️ 월드맵','btnMap'],['🧑 캐릭터','btnCharacter'],['❔ 도움말','btnGuide'],
      ['🗝️ 복구','btnRecovery']
    ];
    items.forEach(([label,id])=>{const x=document.createElement('button');x.type='button';x.textContent=label;x.onclick=()=>{document.getElementById(id)?.click();menu.classList.remove('open');};menu.appendChild(x);});
    const close=document.createElement('button');close.type='button';close.textContent='닫기';close.className='wide';close.onclick=()=>menu.classList.remove('open');menu.appendChild(close);
    b.onclick=()=>menu.classList.toggle('open');
    stage.appendChild(b);stage.appendChild(menu);
  }
  function makeRotateGuard(){
    if(document.getElementById('rpgV87RotateGuard'))return;
    const g=document.createElement('div');g.id='rpgV87RotateGuard';g.innerHTML='<div class="box"><div class="ico">📱↔️</div><h2>가로 화면으로 플레이해 줘</h2><p>스마트폰 세로 화면에서는 게임 조작 공간이 너무 좁아. 휴대폰을 가로로 돌리거나 전체화면으로 전환해 줘.</p><div class="actions"><button type="button" id="rpgV87Fullscreen">⛶ 전체화면 + 가로</button></div></div>';
    document.body.appendChild(g);
    g.querySelector('#rpgV87Fullscreen').onclick=async()=>{
      try{await document.documentElement.requestFullscreen?.();}catch(_e){}
      try{await screen.orientation?.lock?.('landscape');}catch(_e){}
      syncPhoneClass();
    };
  }
  function update(){syncPhoneClass();makePhoneUi();makeRotateGuard();}
  window.addEventListener('resize',update,{passive:true});
  window.addEventListener('orientationchange',()=>setTimeout(update,100),{passive:true});
  window.addEventListener('pageshow',update,{passive:true});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setTimeout(update,80)},{passive:true});
  setTimeout(update,80);

  /* 공개 방 목록은 코드 기준 중복 제거 + 공개 광장 중복 표시 억제 */
  const oldRenderRooms=window.renderRooms;
  if(typeof oldRenderRooms==='function'){
    window.renderRooms=function(){
      try{
        const seen=new Map(),rooms=Object.values(S.rooms||{}).filter(r=>r&&r.code);
        rooms.forEach(r=>{
          const code=String(r.code).toUpperCase();
          if(!seen.has(code)||Number(r.ts||0)>Number(seen.get(code).ts||0))seen.set(code,r);
        });
        const publicRooms=[...seen.values()].filter(r=>String(r.name||'').trim()==='🌍 공개 광장').sort((a,b)=>Number(b.ts||0)-Number(a.ts||0));
        if(publicRooms.length>1){
          publicRooms.slice(1).forEach(r=>{delete S.rooms[r.code];});
        }
      }catch(_e){}
      return oldRenderRooms.apply(this,arguments);
    };
    globalThis.renderRooms=window.renderRooms;
  }

<!-- RPG v44: 건물별 NPC 위치 정합성 + avatar/colors 초기화 오류 수정 -->
<script>
(function(){
  'use strict';
  if(typeof RPG_BUILDINGS==='undefined'||typeof RPG_NPCS==='undefined'||typeof RPG_MAPS==='undefined') return;

  /*
   * 각 건물별로 "누가 어디에 서 있어야 하는가"를 고정한다.
   * 이전 패치에서는 마을 좌표(예: x=78)가 실내 맵에 그대로 들어가서
   * 18~26칸짜리 실내에서 NPC가 벽 끝/구석으로 튀는 문제가 있었다.
   */
  const layout={
    inn:[
      ['innkeeper',10,5],
      ['innGuestA',6,9],
      ['innGuestB',14,9]
    ],
    market:[
      ['merchant',12,6],

    ],
    warehouse:[
      ['storage',9,5],
      ['warehouseWorker',14,7]
    ],
    townhall:[
      ['mayor',9,5],
      ['secretary',13,7],
      ['townhallGuard',5,7]
    ],
    bakery:[
      ['bakerNell',10,5],
      ['bakeryHelper',6,9]
    ],
    flowerShop:[
      ['floristMori',10,5],
      ['flowerHelper',14,8]
    ],
    musicHall:[
      ['bardLio',11,6],
      ['musicGuestA',6,10],
      ['musicGuestB',16,10]
    ],
    guestHouse:[
      ['guestkeeperIra',10,5],
      ['guestA',5,8],
      ['guestB',15,8]
    ],
    farmBarn:[
      ['farmerOdel',9,5],
      ['farmWorker',13,8]
    ],
    house_w1:[
      ['residentHana',8,5],
      ['residentHanaChild',12,8]
    ],
    house_w2:[
      ['residentGon',8,5],
      ['residentGonFamily',13,8]
    ],
    house_e1:[
      ['residentEun',9,5],
      ['residentEunFamily',14,8]
    ],
    house_e2:[
      ['residentDae',9,6],
      ['residentDaeFamily',14,9]
    ]
  };

  const info={
    innGuestA:['🧑','투숙객 아라','투숙객'],innGuestB:['👨','투숙객 민','투숙객'],
    marketHelper:['🧑‍💼','시장 보조 린','시장 직원'],marketCustomer:['👩','시장 손님','손님'],
    smithApprentice:['🧑‍🔧','대장간 견습 카이','견습 대장장이'],smithCustomer:['🛡️','장비를 보러 온 모험가','손님'],
    guildAdventurer:['🧙','길드 모험가 로크','모험가'],
    clinicNurse:['👩‍⚕️','간호사 벨','간호사'],clinicPatient:['🧑‍🦽','치료받는 주민','환자'],
    warehouseWorker:['🧑‍🌾','창고 직원 미오','창고 직원'],townhallGuard:['💂','마을회관 경비','경비'],
    bakeryHelper:['🧑‍🍳','제빵 견습 유나','제빵 견습'],flowerHelper:['🌱','정원사 피오','정원사'],
    musicGuestA:['🧑','관객 하나','관객'],musicGuestB:['👩','관객 둘','관객'],
    guestA:['🧳','투숙객 하루','투숙객'],guestB:['🧑‍🦱','투숙객 레오','투숙객'],
    farmWorker:['🧑‍🌾','농장 일꾼 준','농장 일꾼'],
    residentHanaChild:['🧒','하나의 아이','주민'],residentGonFamily:['👩','곤의 가족','주민'],
    residentEunFamily:['🧑','은의 가족','주민'],residentDaeFamily:['🧒','다온의 아이','농가 주민']
  };

  function makeNpc(id,map,x,y){
    const n=RPG_NPCS[id];
    const meta=info[id]||['🧑','주민','주민'];
    if(n){ n.map=map; n.x=x; n.y=y; return n; }
    const obj={id,map,x,y,name:meta[1],icon:meta[0],role:meta[2]};
    RPG_NPCS[id]=obj;
    return obj;
  }

  function freeInside(map,x,y,used){
    const md=RPG_MAPS[map];
    if(!md) return false;
    if(x<1||y<1||x>=md.w-1||y>=md.h-1) return false;
    if(used.has(x+','+y)) return false;
    try { if(isMapBlocked(map,x,y)) return false; } catch(e) {}
    return true;
  }

  function nearestFree(map,want,used){
    const md=RPG_MAPS[map];
    if(!md) return want;
    const wx=Math.max(1,Math.min(md.w-2,Math.round(want[0])));
    const wy=Math.max(1,Math.min(md.h-2,Math.round(want[1])));
    if(freeInside(map,wx,wy,used)) return {x:wx,y:wy};
    for(let r=1;r<=Math.max(md.w,md.h);r++){
      for(let dy=-r;dy<=r;dy++){
        for(let dx=-r;dx<=r;dx++){
          if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue;
          const x=wx+dx,y=wy+dy;
          if(freeInside(map,x,y,used)) return {x,y};
        }
      }
    }
    return {x:Math.max(1,Math.min(md.w-2,wx)),y:Math.max(1,Math.min(md.h-2,wy))};
  }

  /* 건물별 NPC를 먼저 배치하고, 기존 NPC는 자기 건물의 레이아웃을 따른다. */
  for(const [map,entries] of Object.entries(layout)){
    if(!RPG_MAPS[map]) continue;
    const used=new Set();
    const placed=[];
    for(const [id,x,y] of entries){
      const pos=nearestFree(map,[x,y],used);
      const n=makeNpc(id,map,pos.x,pos.y);
      used.add(pos.x+','+pos.y);
      placed.push(n);
    }
    /* 이 건물에 남아 있는 기존 NPC도 같은 건물 안에 있으면 겹치지 않게 정리 */
    for(const n of Object.values(RPG_NPCS)){
      if(!n||n.map!==map||placed.includes(n)) continue;
      const pos=nearestFree(map,[n.x,n.y],used);
      n.x=pos.x;n.y=pos.y;used.add(n.x+','+n.y);
    }
  }

  /* town NPC는 건물 내부 NPC와 섞이지 않도록 정리하고, 각 기능 건물 문 근처에 생활 NPC를 분산 */
  const townLife={
    villagerSori:[25,20], villagerDoran:[48,20], childNavi:[53,34],
    courierPip:[93,25], oldFarmer:[18,62], librarianEris:[88,27],
    guardWest:[3,38], guardEast:[100,38]
  };
  for(const [id,p] of Object.entries(townLife)){
    const n=RPG_NPCS[id];
    if(!n) continue;
    n.map='town';
    const near=nearestFree('town',p,new Set());
    n.x=near.x;n.y=near.y;
  }

  /* 별도 도구 함수로 현재 건물의 NPC 목록을 확인할 수 있게 한다. */
  window.rpgBuildingNpcRoster=function(buildingId){
    const b=RPG_BUILDINGS.find(x=>String(x.id)===String(buildingId)&&x.map==='town');
    if(!b||!b.interior) return [];
    return Object.values(RPG_NPCS).filter(n=>n&&String(n.map)===String(b.interior)).map(n=>({id:n.id,name:n.name,x:n.x,y:n.y,role:n.role}));
  };

  window.__rpgV44NpcLayout=true;
})();
</script>

      '아침에는 밭을 보고, 점심에는 창고를 정리하고, 해 질 무렵에는 가축을 살피지. 농사도 꽤 바쁜 일이야.',
      '올해는 곡식이 잘 자랐어. 대신 동문 쪽 몬스터가 가까워지면 밭부터 지켜야 하지.',

      '오늘은 가족이 다 같이 저녁을 먹기로 했어요. 평소에는 시간을 맞추기 어렵거든요.',

    ],
    residentDaeFamily:[
      '저쪽 창고에는 수확한 곡식이 있어요. 아버지가 하나하나 세어 두셨대요.',
      '나는 농장 냄새가 좋아. 흙 냄새가 나면 집에 왔다는 느낌이 들거든.',

  /* v45에 이미 있는 데이터가 있으면 우선 사용하되,
     이번 패치의 실내 전용 대사가 비어 있으면 EXTRA를 사용한다. */
  function linesFor(id){
    const key=String(id||'');
    if(EXTRA[key]) return EXTRA[key];
    const n=RPG_NPCS?.[key];
    if(!n) return ['잠깐만, 지금은 할 말이 잘 떠오르지 않네.','다음에 다시 이야기하자.','마을을 조금 더 돌아보고 와.'];
    const name=String(n.name||'주민');
    const role=String(n.role||'주민');
    const map=String(n.map||'');
    const def=RPG_MAPS?.[map];
    const mapName=def?.name||map||'이곳';
    return [
      `${name}이라고 해. 나는 ${mapName}에서 ${role} 일을 하고 있어.`,
      `${mapName}에서 지내다 보면 생각보다 많은 사람과 이야기를 나누게 돼.`,
      '다음에 다시 들르면 오늘과는 다른 이야기를 들려줄게.'
    ];
  }

  function actionFor(id){
    const actions={
      merchant:[['🛒 상점 열기',()=>{try{window.renderShop?.();}catch(_){}}]],
      innkeeper:[
        ['🛏️ 여기서 쉬기',()=>send({t:'npc_action',npc:'innkeeper',action:'rest'})],
        ['🏠 귀환 지점 저장',()=>send({t:'npc_action',npc:'innkeeper',action:'home'})]
      ],
      smith:[['⚒️ 대장간 열기',()=>{try{window.__rpgNpcApiV32?.open?.('smith');}catch(_){}}]],
      guide:[['🗺️ 월드맵 열기',()=>{try{window.renderTeleportPanelRpg?.();}catch(_){}}]],
      healer:[['❤️ 치료받기',()=>send({t:'npc_action',npc:'healer',action:'heal'})]],
      classmaster:[['🎓 전직 확인',()=>{try{window.renderJobPanel?.(false);}catch(_){}}]],
      guildmaster:[['📜 길드 의뢰',()=>{try{window.__rpgNpcApiV32?.guild?.();}catch(_){}}]],
      storage:[['📦 창고 열기',()=>{try{window.__rpgNpcApiV32?.storage?.();}catch(_){}}]],
      mayor:[['🏛️ 마을 현황 보기',()=>showResponse('🏘️ 마을회관 기록을 확인했어. 루미나는 안전구역을 중심으로 상점가, 주거지, 길드, 치유소가 운영되고 있어.')]],
      bakerNell:[['🍞 빵 1개 · 💰10',()=>send({t:'town_service',npc:'bakerNell',action:'bread'})]],
      floristMori:[['🍵 허브차 1개 · 💰8',()=>send({t:'town_service',npc:'floristMori',action:'tea'})]],
      bardLio:[['🎵 연주 듣기 · 5분 버프',()=>send({t:'town_service',npc:'bardLio',action:'music'})]],
      guestkeeperIra:[
        ['🛏️ 푹 쉬기',()=>send({t:'town_service',npc:'guestkeeperIra',action:'guest-rest'})],
        ['🏠 귀환 지점 저장',()=>send({t:'town_service',npc:'guestkeeperIra',action:'guest-home'})]
      ],
      farmerOdel:[['🌽 농장 식량 1개 · 💰9',()=>send({t:'town_service',npc:'farmerOdel',action:'farm'})]]
    };
    return actions[String(id)]||[];
  }

  let active='', page=0;
  function send(msg){
    try{sendLocalHost?.(msg);}catch(_){/* 연결 상태가 바뀌는 동안은 조용히 실패 */}
  }
  function getStage(){return document.getElementById('stage');}
  function makeBox(){
    let box=document.getElementById('npcDialogueV39');
    if(box)return box;
    const st=getStage(); if(!st)return null;
    box=document.createElement('div');box.id='npcDialogueV39';
    box.className='npcDialogueV39';
    box.innerHTML='<div class="npcCardV39"><div class="npcPortraitV39"><div class="ico" id="npcIconV39"></div><b id="npcNameV39"></b><small id="npcRoleV39"></small></div><div><div class="npcHeadV39"><div class="npcNameV39" id="npcHeadNameV39"></div><div class="npcPageV39" id="npcPageV39"></div></div><div class="npcTextV39" id="npcTextV39"></div><div class="npcChoicesV39" id="npcChoicesV39"></div></div></div>';
    st.appendChild(box);return box;
  }
  function hideOther(){
    for(const id of ['npcDialogueV32','npcDialogueV35']){const e=document.getElementById(id);if(e)e.classList.remove('show');}
    const box=document.getElementById('npcDialogueV39');if(box)box.classList.remove('npcDialogueHiddenV39');
  }
  function render(){
    const n=RPG_NPCS?.[active]; const box=makeBox();if(!n||!box)return;
    hideOther();box.classList.add('show');
    const icon=document.getElementById('npcIconV39'),name=document.getElementById('npcNameV39'),role=document.getElementById('npcRoleV39'),head=document.getElementById('npcHeadNameV39'),pageEl=document.getElementById('npcPageV39'),text=document.getElementById('npcTextV39'),choices=document.getElementById('npcChoicesV39');
    if(icon)icon.textContent=n.icon||'🧑';
    if(name)name.textContent=n.name||'주민';
    if(role)role.textContent=n.role||'주민';
    if(head)head.textContent=n.name||'주민';
    const lines=linesFor(active);
    if(page===99){
      if(pageEl)pageEl.textContent='처리 완료';
      if(text)text.textContent=window.__rpgNpcV46Response||'처리가 끝났어.';
      if(choices){choices.innerHTML='';addBtn(choices,'닫기',()=>close());}
      return;
    }
    page=Math.max(0,Math.min(2,page));
    if(pageEl)pageEl.textContent=`대화 ${page+1}/3`;
    if(text)text.textContent=lines[page]||lines[0];
    if(choices){
      choices.innerHTML='';
      if(page<2) addBtn(choices,'💬 이야기 더 듣기',()=>{page++;render();});
      if(page===2){for(const [label,fn] of actionFor(active)){addBtn(choices,label,()=>{try{fn();}catch(_){} });}}
      addBtn(choices,'닫기',()=>close());
    }
  }
  function addBtn(parent,label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();fn();});parent.appendChild(b);}
  function close(){const box=document.getElementById('npcDialogueV39');if(box)box.classList.remove('show');active='';page=0;window.__rpgNpcV46Response=null;}
  function show(id){
    const n=RPG_NPCS?.[id],p=S?.players?.[S?.uid];
    if(!n)return;
    /* 기존 코드의 S가 전역 노출되지 않는 경우도 있으므로 거리 검사는 가능한 범위에서만 한다. */
    if(p && String(p.map)!==String(n.map)){
      try{log?.('📍 다른 지역에 있는 NPC야.');}catch(_){};return;
    }
    active=String(id);page=0;window.__rpgNpcV46Response=null;S.walkTo=null;render();
  }
  /* 기존 전역 진입점을 보존하면서 실제 구현을 v46로 교체 */
  window.showNpcDialogueV32=show;
  window.showNpcDialogueV35=show;
  window.showNpcDialogueV46=show;
  window.__rpgNpcDialogueV46={lines:linesFor,show};

  /* NPC 행동 결과를 대화창의 처리 완료 문구로 연결한다. */
  const oldClient=window.onClientData;
  if(typeof oldClient==='function'){
    window.onClientData=function(m){
      try{
        if(m && (m.t==='npc_result'||m.t==='town_service_result') && active){
          window.__rpgNpcV46Response=String(m.s||'처리가 끝났어.');
          page=99;render();
        }
      }catch(_){}
      return oldClient(m);
    };
  }
})();
</script>



<!-- RPG v48: 상호작용 UI 통합 + 미니맵 위치 + 커스터마이즈 해금 시스템 -->
<style id="rpgV48UiStyle">
  /* 상단 HUD/메뉴와 미니맵을 분리 */
  #minimapWrap{
    top:112px !important;
    right:12px !important;

  }
  @media (max-width:720px){
    #minimapWrap{top:112px !important;right:8px !important;}
  }

  /* 오래된 중복 안내는 하나만 남긴다. */
  #npcQuick{display:none !important;}
  #buildingPrompt{display:none !important;}

  /* NPC 버튼은 사람 얼굴과 구분 */
  #btnNpc{font-size:16px !important;}

  #rpgInteractionHintV48{
    position:absolute;
    left:50%;
    bottom:calc(max(78px,env(safe-area-inset-bottom)) + 12px);
    transform:translateX(-50%);
    z-index:7;
    display:none;
    align-items:center;
    gap:7px;
    padding:7px 11px;
    max-width:min(460px,calc(100vw - 24px));
    border:1px solid var(--line);
    border-radius:10px;
    background:color-mix(in srgb,var(--card) 94%,transparent);
    color:var(--fg);
    box-shadow:0 8px 22px rgba(0,0,0,.18);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    font-size:12px;
    font-weight:800;
    pointer-events:none;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  #rpgInteractionHintV48.show{display:flex;}
  @media (hover:none), (pointer:coarse){
    #rpgInteractionHintV48{display:none !important;}
  }

  .rpgUnlockGridV48{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
  .rpgUnlockBtnV48{
    position:relative;
    min-height:68px;
    padding:8px;
    text-align:left;
    background:var(--bg);
    color:var(--fg);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .rpgUnlockBtnV48 b{display:block;font-size:20px;line-height:1.05;margin-bottom:3px;}
  .rpgUnlockBtnV48 small{display:block;color:var(--sub);line-height:1.35;}
  .rpgUnlockBtnV48.locked{opacity:.56;cursor:not-allowed;}
  .rpgUnlockBtnV48.locked::after{content:'🔒';position:absolute;right:7px;top:7px;font-size:14px;}
  .rpgUnlockBtnV48.active{border-color:var(--acc);box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 35%,transparent);}
  .rpgUnlockTitleV48{margin-top:4px;color:var(--sub);font-size:11px;}
  @media(max-width:520px){.rpgUnlockGridV48{grid-template-columns:1fr;}}
</style>
<script>
(function installRpgV48(){
  'use strict';

  if(typeof window==='undefined'||typeof S==='undefined')return;

  /* ---------------------------------------------------------
     1. 상호작용 안내는 한 군데에서만 표시
     --------------------------------------------------------- */
  function ensureInteractionHint(){
    let el=document.getElementById('rpgInteractionHintV48');
    if(el)return el;
    const stage=document.getElementById('stage');
    if(!stage)return null;
    el=document.createElement('div');
    el.id='rpgInteractionHintV48';
    el.setAttribute('aria-live','polite');
    stage.appendChild(el);
    return el;
  }
  function updateInteractionHint(){
    const el=ensureInteractionHint();
    if(!el||!S.started){if(el)el.classList.remove('show');return;}
    const p=S.players&&S.players[S.uid];
    if(!p){el.classList.remove('show');return;}

    const n=typeof nearestActiveNpc==='function'?nearestActiveNpc():null;
    const door=typeof nearestBuildingDoor==='function'?nearestBuildingDoor(p):null;
    const portal=typeof nearestRpgPortal==='function'?nearestRpgPortal(p):null;
    let text='';
    if(n) text='💬 '+String(n.name||'NPC')+' · E 대화';
    else if(door) text='🚪 '+String(door.name|| (p.map==='town'?'건물':'출구'))+' · E '+(p.map==='town'?'입장':'나가기');
    else if(portal) text='🌀 '+String(portal.name||'이동석')+' · M 이동';
    if(text){el.textContent=text;el.classList.add('show');}
    else{el.textContent='';el.classList.remove('show');}
  }
  window.__rpgUpdateInteractionHintV48=updateInteractionHint;
  if(!window.__rpgV48HintTimer){
    window.__rpgV48HintTimer=setInterval(()=>{try{updateInteractionHint();}catch(_e){}},140);
  }

  /* ---------------------------------------------------------
     2. 캐릭터 장식 해금 조건
     - 기본값(맨머리/초보 모험가)만 항상 사용 가능
     - 그 외는 조건 달성 전 선택/장착 불가
     --------------------------------------------------------- */
  const HAT_RULES={
    '':      {ok:()=>true,                    text:'기본 장식'},
    '🎩':   {ok:p=>(Number(p?.lv)||1)>=5,     text:'Lv.5 달성'},
    '🧢':   {ok:p=>(Number(p?.lv)||1)>=10&&jobStage(p)>=1, text:'Lv.10 달성 + 1차 전직'},
    '⛑️':  {ok:p=>(Number(p?.lv)||1)>=15&&jobStage(p)>=1, text:'Lv.15 달성 + 1차 전직'},
    '🎓':   {ok:p=>jobStage(p)>=2,            text:'2차 전직 완료'},
    '🪄':   {ok:p=>jobStage(p)>=2&&jobRoot(p)==='mage', text:'2차 전직 + 마법사 계열'},
    '🌿':   {ok:p=>(Number(p?.lv)||1)>=20,    text:'Lv.20 달성'},
    '👑':   {ok:p=>jobStage(p)>=4&&(Number(p?.lv)||1)>=100, text:'Lv.100 + 4차 전직'}
  };
  const TITLE_RULES={
    '초보 모험가': {ok:()=>true, text:'기본 칭호'},
    '루미나 주민': {ok:p=>(Number(p?.lv)||1)>=5, text:'Lv.5 달성'},
    '초원 탐험가': {ok:p=>(Number(p?.lv)||1)>=10&&jobStage(p)>=1, text:'Lv.10 달성 + 1차 전직'},
    '광산 도전자': {ok:p=>(Number(p?.lv)||1)>=30&&jobStage(p)>=2, text:'Lv.30 + 2차 전직'},
    '별빛 수호자': {ok:p=>(Number(p?.lv)||1)>=100&&jobStage(p)>=4, text:'Lv.100 + 4차 전직'}
  };

  function jobStage(p){
    try{
      if(typeof jobData==='function')return Math.max(0,Math.min(4,Number(jobData(p).stage)||0));
    }catch(_e){}
    return Math.max(0,Math.min(4,Number(p&&p.job&&p.job.stage)||0));
  }
  function jobRoot(p){
    try{
      const j=typeof jobData==='function'?jobData(p):p?.job;
      const c=String(j?.root||j?.code||'');
      if(['fighter','guardian','berserker','swordmaster'].includes(c))return 'fighter';
      if(['mage','elementalist','sage'].includes(c))return 'mage';
      if(['archer','ranger','sniper'].includes(c))return 'archer';
      if(['rogue','assassin','trickster'].includes(c))return 'rogue';
      return c;
    }catch(_e){return ''}
  }
  function unlockedHat(p,hat){
    const r=HAT_RULES[hat];return !!(r&&r.ok(p));
  }
  function unlockedTitle(p,title){
    const r=TITLE_RULES[title];return !!(r&&r.ok(p));
  }
  function hatRule(hat){return HAT_RULES[hat]||{text:'조건 없음'};}
  function titleRule(title){return TITLE_RULES[title]||{text:'조건 없음'};}
  window.rpgHatUnlockedV48=unlockedHat;
  window.rpgTitleUnlockedV48=unlockedTitle;
  window.rpgHatRulesV48=HAT_RULES;
  window.rpgTitleRulesV48=TITLE_RULES;

  function sanitizeV48(a,p){
    const cur=a&&typeof a==='object'?a:{};
    const player=p||S.players?.[S.uid]||{};
    const aura=CHARACTER_AURAS.includes(cur.aura)?cur.aura:CHARACTER_AURAS[0];
    const hat=CHARACTER_HATS.includes(cur.hat)&&unlockedHat(player,cur.hat)?cur.hat:'';
    const title=CHARACTER_TITLES.includes(cur.title)&&unlockedTitle(player,cur.title)?cur.title:'초보 모험가';
    return {aura,hat,title};
  }

  /* 기존 저장/정규화 경로에도 해금 검사를 강제 */
  const oldNormalizeV48=normalizePlayer;
  normalizePlayer=function(p){
    const out=oldNormalizeV48(p||{});
    if(out){
      out.appearance=sanitizeV48(out.appearance,out);
    }
    return out;
  };
  window.normalizePlayer=normalizePlayer;

  const oldPlayerAccountV48=playerAccountData;
  playerAccountData=function(p){
    const d=oldPlayerAccountV48(p);
    if(d&&p)d.appearance=sanitizeV48(p.appearance,p);
    return d;
  };
  window.playerAccountData=playerAccountData;

  const oldSanitizeV48=typeof sanitizeAppearance==='function'?sanitizeAppearance:null;
  sanitizeAppearance=function(a,p){
    /* v48 해금 검사가 최종 권한이다. aura만 구형 함수 결과를 참고한다. */
    let base={aura:CHARACTER_AURAS[0],hat:'',title:'초보 모험가'};
    try{if(oldSanitizeV48)base={...base,...oldSanitizeV48(a)};}catch(_e){}
    return sanitizeV48({...base,...(a||{})},p);
  };
  window.sanitizeAppearance=sanitizeAppearance;

  /* 복구 직후에도 잠긴 장식이 되살아나지 않도록 최종 검사 */
  if(typeof parseRecoveryCode==='function'){
    const oldParseRecoveryV48=parseRecoveryCode;
    parseRecoveryCode=function(code){
      const out=oldParseRecoveryV48(code);
      if(out&&typeof out==='object')out.appearance=sanitizeV48(out.appearance,out);
      return out;
    };
    window.parseRecoveryCode=parseRecoveryCode;
  }

  /* ---------------------------------------------------------
     3. 캐릭터 꾸미기 패널을 최종 버전으로 단일화
     --------------------------------------------------------- */
  function renderCharacterPanelV48(){
    const p=S.players[S.uid]||newPlayer(S.uid,S.name,S.emoji,S.score,S.friendCode);
    normalizePlayer(p);
    const j=typeof jobData==='function'?jobData(p):{name:'견습 모험가',icon:p.emoji||'🧑',stage:0};
    const cur=sanitizeV48(p.appearance||S.characterStyle,p);
    p.appearance=cur;
    S.characterStyle={...cur};

    const hats=(Array.isArray(CHARACTER_HATS)?CHARACTER_HATS:[]).map(h=>{
      const open=unlockedHat(p,h),r=hatRule(h),active=cur.hat===h;
      const label=h||'🙂';
      return '<button type="button" class="rpgUnlockBtnV48 '+(open?'':'locked ') +(active?'active':'')+'" '+(open?'data-hat="'+escapeHtml(h)+'"':'disabled')+'>'+
        '<b>'+escapeHtml(label)+(open?'':' 🔒')+'</b><small>'+(open?'사용 가능':escapeHtml(r.text))+'</small></button>';
    }).join('');

    const titles=(Array.isArray(CHARACTER_TITLES)?CHARACTER_TITLES:[]).map(t=>{
      const open=unlockedTitle(p,t),r=titleRule(t),active=cur.title===t;
      return '<button type="button" class="rpgUnlockBtnV48 '+(open?'':'locked ')+(active?'active':'')+'" '+(open?'data-title="'+escapeHtml(t)+'"':'disabled')+'>'+
        '<b>🏷️ '+escapeHtml(t)+(open?'':' 🔒')+'</b><small>'+(open?'장착 가능':escapeHtml(r.text))+'</small></button>';
    }).join('');

    const html=
      '<div class="characterPreview"><div class="characterAvatar" id="charPreview">'+escapeHtml(j.icon||p.emoji||'🧑')+' '+escapeHtml(cur.hat||'')+'</div><div><b>'+escapeHtml(S.name||p.name||'모험가')+'</b><div class="socialSub">직업 · '+escapeHtml(j.name||'견습 모험가')+' · '+Number(j.stage||0)+'차</div><div class="socialSub">칭호 · <span id="charPreviewTitle">'+escapeHtml(cur.title)+'</span></div></div></div>'+ 
      '<div class="section"><div class="sectionTitle">🎓 현재 직업</div><div class="npcHint"><b style="font-size:18px">'+escapeHtml(j.icon||'🧑')+'</b> '+escapeHtml(j.name||'견습 모험가')+' · '+Number(j.stage||0)+'차 전직</div></div>'+ 
      '<div class="section"><div class="sectionTitle">🎩 모자 / 장식</div><div class="socialSub" style="margin-bottom:7px">조건을 달성한 장식만 장착할 수 있어.</div><div class="rpgUnlockGridV48">'+hats+'</div></div>'+ 
      '<div class="section"><div class="sectionTitle">🏷️ 칭호</div><div class="socialSub" style="margin-bottom:7px">칭호도 조건을 달성해야 해금돼.</div><div class="rpgUnlockGridV48">'+titles+'</div></div>'+ 
      '<div class="section"><input id="charName" maxlength="10" value="'+escapeHtml(S.name||p.name||'모험가')+'" placeholder="캐릭터 이름"><button id="charSave" style="width:100%;margin-top:7px">✅ 저장하고 게임에 적용</button></div>';

    openPanel('🧑 캐릭터 꾸미기',html);

    const refresh=()=>{
      const cp=document.getElementById('charPreview'),ct=document.getElementById('charPreviewTitle');
      if(cp)cp.textContent=(j.icon||p.emoji||'🧑')+' '+(cur.hat||'');
      if(ct)ct.textContent=cur.title;
      document.querySelectorAll('#panelBody [data-hat]').forEach(b=>b.classList.toggle('active',cur.hat===b.dataset.hat));
      document.querySelectorAll('#panelBody [data-title]').forEach(b=>b.classList.toggle('active',cur.title===b.dataset.title));
    };

    document.querySelectorAll('#panelBody [data-hat]').forEach(b=>b.onclick=()=>{
      const h=String(b.dataset.hat||'');
      if(unlockedHat(p,h)){cur.hat=h;refresh();}
    });
    document.querySelectorAll('#panelBody [data-title]').forEach(b=>b.onclick=()=>{
      const t=String(b.dataset.title||'');
      if(unlockedTitle(p,t)){cur.title=t;refresh();}
    });
    const save=document.getElementById('charSave');
    if(save)save.onclick=()=>{
      S.name=String(document.getElementById('charName')?.value||'모험가').trim().slice(0,10)||'모험가';
      p.name=S.name;
      const aura=(typeof JOB_VISUAL_AURA_V28!=='undefined'&&JOB_VISUAL_AURA_V28[j.code])?JOB_VISUAL_AURA_V28[j.code]:(p.appearance?.aura||CHARACTER_AURAS[0]);
      const safe=sanitizeV48({...cur,aura},p);
      p.appearance={...safe};
      S.characterStyle={...safe};
      p.emoji=j.icon||p.emoji;S.emoji=p.emoji;
      saveCharacterStyle();saveLocalAccountSnapshot();
      if(S.isHost)bcast({t:'ev',k:'appearance',id:S.uid});
      else if(S.hostConn&&S.hostConn.open)S.hostConn.send({t:'appearance_update',appearance:S.characterStyle,name:S.name,emoji:S.emoji});
      updateHud();closePanel();log('🧑 캐릭터 설정을 저장했어.');
    };
    refresh();
  }

  window.renderCharacterPanel=renderCharacterPanelV48;
  renderCharacterPanel=renderCharacterPanelV48;
  const charBtn=document.getElementById('btnCharacter');
  if(charBtn)charBtn.onclick=renderCharacterPanelV48;

  /* 구형 NPC 메뉴 아이콘이 다시 사람 얼굴로 나타나지 않도록 최종 정리 */
  const npcBtn=document.getElementById('btnNpc');
  if(npcBtn){npcBtn.textContent='💬';npcBtn.title='NPC 상호작용';npcBtn.setAttribute('aria-label','NPC 상호작용');}

  /* 저장된 구형 데이터가 이미 잠긴 장식을 들고 있어도 즉시 정리 */
  try{
    const me=S.players&&S.players[S.uid];
    if(me){me.appearance=sanitizeV48(me.appearance,me);S.characterStyle={...me.appearance};}
  }catch(_e){}

  window.__rpgV48Ready=true;
})();
</script>


<!-- RPG v50: 튜토리얼 대화 진행 + E 상호작용 안내 최종 런타임 수정 -->
<style id="rpgV50TutorialFixStyle">
  /* 구형 상호작용 힌트가 사라지지 않도록 최종 표시 레이어를 하나만 사용한다. */
  #rpgInteractionHintV48{
    display:none !important;
    left:50% !important;
    bottom:max(82px,calc(env(safe-area-inset-bottom) + 76px)) !important;
    top:auto !important;
    z-index:40 !important;
    pointer-events:none !important;
  }
  #rpgInteractionHintV48.show{
    display:flex !important;
  }
  @media (max-width:720px),(pointer:coarse){
    #rpgInteractionHintV48.show{display:flex !important;}
  }
  #rpgInteractionHintV50{
    position:absolute;
    left:50%;
    bottom:max(82px,calc(env(safe-area-inset-bottom) + 76px));
    transform:translateX(-50%);
    z-index:40;
    display:none;
    max-width:min(520px,calc(100% - 20px));
    padding:7px 12px;
    border:1px solid var(--line);
    border-radius:10px;
    background:color-mix(in srgb,var(--card) 96%,transparent);
    color:var(--fg);
    box-shadow:0 8px 24px rgba(0,0,0,.2);
    font-size:12px;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    pointer-events:none;
  }
  #rpgInteractionHintV50.show{display:block;}
</style>
<script>
(function installRpgV50FinalFix(){
  'use strict';
  if(typeof window==='undefined'||typeof S==='undefined')return;

  function player(){try{return S.players&&S.players[S.uid]||null;}catch(_e){return null;}}
  function nearNpc(){
    const p=player();
    if(!p)return null;
    try{
      if(typeof nearestActiveNpc==='function'){
        const n=nearestActiveNpc();
        if(n)return n;
      }
    }catch(_e){}
    try{
      let best=null,d=999;
      Object.values(RPG_NPCS||{}).forEach(n=>{
        if(String(n.map)!==String(p.map))return;
        const dd=Math.max(Math.abs(Number(n.x)-Number(p.x)),Math.abs(Number(n.y)-Number(p.y)));
        if(dd<d){d=dd;best=n;}
      });
      return d<=2?best:null;
    }catch(_e){return null;}
  }

  function ensureHint(){
    let el=document.getElementById('rpgInteractionHintV48');
    if(!el){
      const st=document.getElementById('stage');
      if(!st)return null;
      el=document.createElement('div');el.id='rpgInteractionHintV48';st.appendChild(el);
    }
    return el;
  }

  function updateHint(){
    const el=ensureHint();
    if(!el)return;
    const p=player();
    if(!S.started||!p){el.textContent='';el.classList.remove('show');return;}
    const n=nearNpc();
    if(n){
      el.textContent='💬 '+String(n.name||'NPC')+' · E를 눌러 말 걸기';
      el.classList.add('show');
    }else{
      el.textContent='';
      el.classList.remove('show');
    }
  }

  /* 마지막으로 설치된 실제 NPC 대화 함수를 감싸야 튜토리얼이 덮어써진
     이전 v32/v35 래퍼 때문에 진행이 끊기지 않는다. */
  const wrappedNames=new Set();
  function wrapDialogue(name){
    try{
      if(wrappedNames.has(name))return;
      const old=window[name];
      if(typeof old!=='function')return;
      wrappedNames.add(name);
      window[name]=function(){
        const id=arguments[0];
        const out=old.apply(this,arguments);
        try{
          if(String(id)==='villagerSori' && typeof window.__rpgTutorialV49CompleteTalk==='function'){
            const p=player(),n=RPG_NPCS?.villagerSori;
            if(p&&n&&String(p.map)===String(n.map)&&Math.max(Math.abs(p.x-n.x),Math.abs(p.y-n.y))<=2){
              window.__rpgTutorialV49CompleteTalk();
            }
          }
        }catch(_e){}
        return out;
      };
      window[name].__rpgV50Wrapped=true;
    }catch(_e){}
  }

  function tick(){
    updateHint();
    wrapDialogue('showNpcDialogueV46');
    wrapDialogue('showNpcDialogueV35');
    wrapDialogue('showNpcDialogueV32');
  }

  /* E키를 누른 시점에도 즉시 처리한다. 기존 핸들러가 stopImmediatePropagation을
     사용하더라도 최종 대화 함수 래퍼에서 튜토리얼 진행이 확정된다. */
  document.addEventListener('keydown',e=>{
    if(String(e.key||'').toLowerCase()!=='e')return;
    try{
      const st=typeof window.__rpgTutorialV49State==='function'?window.__rpgTutorialV49State():null;
      if(!st?.active||st.step!==1)return;
      const p=player(),n=RPG_NPCS?.villagerSori;
      if(p&&n&&String(p.map)===String(n.map)&&Math.max(Math.abs(p.x-n.x),Math.abs(p.y-n.y))<=2){
        /* 대화 함수가 이미 같은 키 이벤트에서 호출되므로 여기서는 fallback만 남긴다. */
        setTimeout(()=>{
          try{
            const now=typeof window.__rpgTutorialV49State==='function'?window.__rpgTutorialV49State():null;
            if(now?.active&&now.step===1&&typeof window.__rpgTutorialV49CompleteTalk==='function'){
              window.__rpgTutorialV49CompleteTalk();
            }
          }catch(_e){}
        },40);
      }
    }catch(_e){}
  },false);

  /* 튜토리얼이 실제로 열린 직후에도 힌트를 즉시 보이게 한다. */
  const timer=setInterval(()=>{try{tick();}catch(_e){}},120);
  window.__rpgV50UpdateHint=updateHint;
  window.__rpgV50Timer=timer;
})();
</script>

<!-- RPG v51: 상호작용 힌트 단일화 + NPC 대화 튜토리얼 진행 확정 -->
<style id="rpgV51FinalStyle">
  /* 구형 V48/V50 힌트는 완전히 숨기고 V51 하나만 사용 */
  #rpgInteractionHintV48,
  #rpgInteractionHintV50{display:none !important;}
  #rpgInteractionHintV51{
    position:absolute;
    left:50%;
    bottom:max(82px,calc(env(safe-area-inset-bottom) + 76px));
    transform:translateX(-50%);
    z-index:46;
    display:none;
    align-items:center;
    justify-content:center;
    max-width:min(520px,calc(100% - 20px));
    min-height:34px;
    padding:7px 13px;

    font-weight:900;
    line-height:1.2;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    pointer-events:none;
    opacity:1;
  }
  #rpgInteractionHintV51.show{display:flex !important;}
  @media(max-width:720px){
    #rpgInteractionHintV51{bottom:max(88px,calc(env(safe-area-inset-bottom) + 82px));font-size:11px;}
  }
</style>
<script id="rpgV51FinalFix">
(function installRpgV51FinalFix(){
  'use strict';
  if(typeof window==='undefined'||typeof S==='undefined')return;

  /* 이전 힌트 타이머가 같은 DOM을 깜빡이게 만드는 것을 차단 */
  try{
    if(window.__rpgV48HintTimer){clearInterval(window.__rpgV48HintTimer);window.__rpgV48HintTimer=null;}
  }catch(_e){}
  try{
    if(window.__rpgV50Timer){clearInterval(window.__rpgV50Timer);window.__rpgV50Timer=null;}
  }catch(_e){}

  const state=()=>{
    try{return typeof window.__rpgTutorialV49State==='function'?window.__rpgTutorialV49State():null;}catch(_e){return null;}
  };
  const player=()=>{try{return S.players&&S.players[S.uid]||null;}catch(_e){return null;}};

  function nearestNpcV51(){
    const p=player();
    if(!p||typeof RPG_NPCS==='undefined')return null;
    let best=null,bestD=999;
    for(const n of Object.values(RPG_NPCS||{})){
      if(!n||String(n.map)!==String(p.map))continue;
      const x=Number(n.x),y=Number(n.y),px=Number(p.x),py=Number(p.y);
      if(!Number.isFinite(x)||!Number.isFinite(y)||!Number.isFinite(px)||!Number.isFinite(py))continue;
      const d=Math.max(Math.abs(px-x),Math.abs(py-y));
      if(d<bestD){bestD=d;best=n;}
    }
    return bestD<=2?best:null;
  }

  function ensureHint(){
    let el=document.getElementById('rpgInteractionHintV51');
    if(el)return el;
    const st=document.getElementById('stage');
    if(!st)return null;
    el=document.createElement('div');
    el.id='rpgInteractionHintV51';
    st.appendChild(el);
    return el;
  }

  let lastHint='';
  function updateHint(){
    const el=ensureHint();
    if(!el)return;
    const p=player();
    const n=p?nearestNpcV51():null;
    const text=(S.started&&p&&n)?('💬 '+String(n.name||'NPC')+' · E를 눌러 말 걸기'):'';
    if(text===lastHint && ((!!text)==el.classList.contains('show')))return;
    lastHint=text;
    if(text){
      el.textContent=text;
      el.classList.add('show');
    }else{
      el.textContent='';
      el.classList.remove('show');
    }
  }

  /* 튜토리얼 2단계는 특정 주민을 요구하지 않고
     "실제로 NPC에게 말을 걸었는가"만 확인한다. */
  let talkLock=false;
  function completeTalk(){
    const st=state();
    if(!st||!st.active||st.step!==1)return false;
    if(talkLock)return true;
    talkLock=true;
    try{
      if(typeof window.__rpgTutorialV49CompleteTalk==='function'){
        const ok=window.__rpgTutorialV49CompleteTalk();
        if(ok)return true;
      }
    }catch(_e){}
    try{talkLock=false;}catch(_e){}
    return false;
  }

  function dialogueIsOpen(){
    const ids=['npcDialogueV39','npcDialogueV35','npcDialogueV32'];
    for(const id of ids){
      const el=document.getElementById(id);
      if(el&&el.classList.contains('show'))return true;
    }
    return false;
  }

  /* E키를 가장 앞단에서 확실하게 감지한다. 기존 V39의
     capture 핸들러가 다른 함수를 호출해도 튜토리얼은 독립적으로 진행된다. */
  window.addEventListener('keydown',function(e){
    if(String(e.key||'').toLowerCase()!=='e')return;
    const t=e.target;
    const tag=String(t&&t.tagName||'').toUpperCase();
    if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable))return;
    const st=state();
    if(!st||!st.active||st.step!==1)return;
    const n=nearestNpcV51();
    if(!n)return;

    /* 실제 대화창이 열리는 기존 동작은 그대로 두고, 튜토리얼 완료만 독립 처리 */
    setTimeout(function(){
      try{
        completeTalk();
        updateHint();
        if(!dialogueIsOpen() && typeof window.showNpcDialogueV32==='function'){
          window.showNpcDialogueV32(n.id);
        }
      }catch(_e){}
    },0);
  },false);

  /* 모바일/버튼 방식으로 말을 걸어도 같은 단계가 완료되게 한다. */
  document.addEventListener('click',function(e){
    const st=state();
    if(!st||!st.active||st.step!==1)return;
    const el=e.target&&e.target.closest?e.target.closest('#btnNpc,#mobileNpcTalkV32,[data-action="npc-talk"]'):null;
    if(!el)return;
    const n=nearestNpcV51();
    if(!n)return;
    setTimeout(function(){try{completeTalk();updateHint();}catch(_e){}},0);
  },true);

  /* 게임이 자체적으로 NPC 대화 함수를 호출하는 경우도 잡는다. */
  const wrapped=new Set();
  function wrap(name){
    if(wrapped.has(name))return;
    const old=window[name];
    if(typeof old!=='function')return;
    wrapped.add(name);
    window[name]=function(){
      const id=arguments[0];
      const out=old.apply(this,arguments);
      try{
        const st=state();
        if(st&&st.active&&st.step===1&&RPG_NPCS&&RPG_NPCS[id])completeTalk();
      }catch(_e){}
      return out;
    };
  }

  function loop(){
    try{
      wrap('showNpcDialogueV32');
      wrap('showNpcDialogueV35');
      wrap('showNpcDialogueV46');
      updateHint();
    }catch(_e){}
  }

  /* 매 프레임 DOM을 갈아끼우지 않고 일정 주기로 동일 문자열일 때는 그대로 둔다. */
  window.__rpgV51HintTimer=setInterval(loop,120);
  loop();

<script>
(function installRpgV52Overhaul(){
  'use strict';
  if(typeof window==='undefined'||typeof S==='undefined'||typeof ITEMS==='undefined')return;

  const BAG_SLOTS=24;
  /* v65 scope fix: later polish IIFEs need the same bag capacity. */
  globalThis.BAG_SLOTS=24;
  const BGM_KEY='emoji-rpg-bgm-v52';
  const invUsed=p=>Object.keys((p&&p.inv)||{}).filter(id=>ITEMS[id]&&Number(p.inv[id])>0).length;
  const invFree=p=>Math.max(0,BAG_SLOTS-invUsed(p));
  const safeInt=v=>Math.max(0,Math.floor(Number(v)||0));

  /* ---------------------------------------------------------
     1) 실제 캐릭터 인벤토리
     - 24칸
     - 아이템 종류마다 1스택
     - ITEMS[id].max가 스택 상한
     - 초과 획득은 자동 폐기하지 않고 실패 처리

  const _normalizeV52=normalizePlayer;
  normalizePlayer=function(p){
    const out=_normalizeV52(p);
    if(!out)return out;
    out.lv=clamp(safeInt(out.lv)||1,1,120);
    out.xp=safeInt(out.xp);
    out.enhance=out.enhance&&typeof out.enhance==='object'?out.enhance:{weapon:0,armor:0};
    out.storage=out.storage&&typeof out.storage==='object'?out.storage:{};
    out.inv=out.inv&&typeof out.inv==='object'?out.inv:{};
    Object.keys(out.inv).forEach(id=>{
      if(!ITEMS[id]){delete out.inv[id];return;}
      const n=safeInt(out.inv[id]);
      if(!n)delete out.inv[id];
      else out.inv[id]=Math.min(n,Math.max(1,safeInt(ITEMS[id].max)||99));
    });
    const keys=Object.keys(out.inv);
    if(keys.length>BAG_SLOTS){
      keys.slice(BAG_SLOTS).forEach(id=>delete out.inv[id]);
    }
    out.equip=out.equip&&typeof out.equip==='object'?out.equip:{weapon:null,armor:null};
    if(out.equip.weapon&&!ITEMS[out.equip.weapon])out.equip.weapon=null;
    if(out.equip.armor&&!ITEMS[out.equip.armor])out.equip.armor=null;
    const hpRaw=Number(out.hp); out.hp=clamp(Number.isFinite(hpRaw)?safeInt(hpRaw):maxHp(out),0,maxHp(out));
    return out;
  };

  const _addItemV52=addItem;
  addItem=function(p,id,n){
    const def=ITEMS[id];
    if(!p||!def||!Number.isFinite(Number(n))||Number(n)<=0)return 0;
    normalizePlayer(p);
    const cur=itemCount(p,id);
    const maxStack=Math.max(1,safeInt(def.max)||99);
    if(cur>=maxStack)return 0;
    if(cur===0 && invFree(p)<=0)return 0;
    const amount=Math.min(safeInt(n),maxStack-cur);
    if(amount>0)p.inv[id]=cur+amount;
    return amount;
  };

  function removeItemV52(p,id,n){
    const cur=itemCount(p,id),take=Math.min(cur,safeInt(n));
    if(!take)return 0;
    p.inv[id]=cur-take;
    if(p.inv[id]<=0)delete p.inv[id];
    return take;
  }

  function inventoryMessage(msg){
    try{log(msg);}catch(_){}
  }

  function refreshInventory52(){
    try{renderInventory();updateHud();saveLocalAccountSnapshot();}catch(_){}
  }

  function invItemHtmlV52(p,id,n){
    const d=ITEMS[id];
    if(!d||n<=0)return '';
    const equipped=(p.equip.weapon===id||p.equip.armor===id);
    const action=d.type==='consumable'?'사용':((d.type==='weapon'||d.type==='armor')?(equipped?'장착 중':'장착'):'사용 불가');
    const stat=d.type==='weapon'?('⚔️ +'+(d.atk||0)):d.type==='armor'?('🛡️ +'+(d.def||0)):d.type==='consumable'?('❤️ +'+(d.heal||0)):'재료';
    const useBtn=(d.type==='consumable')?'<button data-inv52="use" data-id="'+escapeHtml(id)+'">'+action+'</button>':(d.type==='weapon'||d.type==='armor')?('<button data-inv52="equip" data-id="'+escapeHtml(id)+'" '+(equipped?'disabled':'')+'>'+action+'</button>'):'<button disabled>'+action+'</button>';
    const discardClass='inv52Discard';
    return '<div class="inv52Item '+(equipped?'equipped':'')+'">'+
      '<div class="inv52ItemHead"><span class="inv52ItemIcon">'+d.icon+'</span><span class="inv52Count">x'+n+'/'+(d.max||99)+'</span></div>'+
      '<div class="inv52ItemName" title="'+escapeHtml(d.name)+'">'+escapeHtml(d.name)+'</div>'+
      '<small>'+stat+(equipped?' · 장착 중':'')+'</small>'+
      '<div class="inv52Actions">'+useBtn+'<button class="'+discardClass+'" data-inv52="drop1" data-id="'+escapeHtml(id)+'">1개 버리기</button>'+(n>1?'<button class="'+discardClass+'" data-inv52="dropAll" data-id="'+escapeHtml(id)+'">전부 버리기</button><span></span>':'<span></span><span></span>')+'</div>'+

  renderInventory=function(){

    const w=p.equip&&p.equip.weapon&&ITEMS[p.equip.weapon]?ITEMS[p.equip.weapon]:null;
    const a=p.equip&&p.equip.armor&&ITEMS[p.equip.armor]?ITEMS[p.equip.armor]:null;
    let html='';
    html+='<div class="inv52Top"><div><b>🎒 캐릭터 인벤토리</b><div class="inv52Hint">아이템 종류당 1스택 · 장비도 가방 칸을 사용해.</div></div><div class="inv52Slots">'+invUsed(p)+' / '+BAG_SLOTS+' 칸</div></div>';
    html+='<div class="section"><div class="sectionTitle">⚔️ 장비 슬롯</div><div class="inv52EquipGrid">';
    [['weapon','무기',w,'⚔️'],['armor','방어구',a,'🛡️']].forEach(([slot,label,d,empty])=>{
      html+='<div class="inv52Equip"><div class="inv52EquipIcon">'+(d?d.icon:empty)+'</div><div><b>'+(d?escapeHtml(d.name):'장비 없음')+'</b><small>'+label+(d?' · '+(slot==='weapon'?'공격 +'+(d.atk||0):'방어 +'+(d.def||0)):'')+'</small></div>'+(d?'<button data-inv52="unequip" data-slot="'+slot+'">해제</button>':'<span></span>')+'</div>';
    });
    html+='</div></div>';
    html+='<div class="section"><div class="sectionTitle">📦 가방</div><div class="inv52Bag">';
    const entries=Object.entries(p.inv||{}).filter(([id,n])=>ITEMS[id]&&n>0);
    if(!entries.length)html+='<div class="inv52Empty">가방이 비어 있어.</div>';
    else entries.forEach(([id,n])=>{html+=invItemHtmlV52(p,id,n);});
    html+='</div></div>';
    html+='<div class="statGrid"><div class="statBox">❤️ '+p.hp+' / '+maxHp(p)+'</div><div class="statBox">⚔️ '+effectiveAtkRpg(p)+' · 🛡️ '+effectiveDefRpg(p)+'</div></div>';
    openPanel('🎒 인벤토리',html);
    $('panelBody').querySelectorAll('[data-inv52]').forEach(btn=>btn.onclick=()=>{
      const action=btn.dataset.inv52,id=btn.dataset.id,slot=btn.dataset.slot;
      if(action==='use')sendLocalHost({t:'use_item',id});
      else if(action==='equip')sendLocalHost({t:'equip_item',id});
      else if(action==='drop1')sendLocalHost({t:'discard_item',id,count:1});
      else if(action==='dropAll')sendLocalHost({t:'discard_item',id,count:itemCount(p,id)});
      else if(action==='unequip')sendLocalHost({t:'unequip_item',slot});

  };

  /* 호스트 권위 인벤토리 처리: 사용/착용/해제/버리기 */
  const _hostInventoryV52=hostRecv;
  hostRecv=function(c,m){
    if(m&&c&&c.uid&&S.players[c.uid]&&(m.t==='use_item'||m.t==='equip_item'||m.t==='unequip_item'||m.t==='discard_item')){
      const p=S.players[c.uid],id=String(m.id||''),d=ITEMS[id];
      if(m.t==='use_item') {
        if(!d||d.type!=='consumable'||!itemCount(p,id)){sendTo(c.uid,{t:'npc_result',s:'🎒 사용할 아이템이 없어.'});return;}
        removeItemV52(p,id,1);
        p.hp=Math.min(maxHp(p),p.hp+(d.heal||0));
        broadcastEvent({k:'heal',id:c.uid,d:d.heal||0});
        broadcastEvent({k:'log',s:'🧪 '+p.name+'이(가) '+d.name+'을(를) 사용했어. (+'+(d.heal||0)+' HP)'});
      } else if(m.t==='equip_item') {
        if(!d||((d.type!=='weapon')&&(d.type!=='armor'))||!itemCount(p,id)){sendTo(c.uid,{t:'npc_result',s:'⚔️ 가방에 해당 장비가 없어.'});return;}

        broadcastEvent({k:'log',s:'⚔️ '+p.name+'이(가) '+d.icon+' '+d.name+'을(를) 장착했어.'});
      } else if(m.t==='unequip_item') {

    steelSword:{id:'steelSword',name:'강철검',icon:'🗡️',type:'weapon',max:1,atk:12,price:180},

    chainmail:{id:'chainmail',name:'사슬 갑옷',icon:'🥋',type:'armor',max:1,def:8,price:200},
    dragonScaleArmor:{id:'dragonScaleArmor',name:'용비늘 갑옷',icon:'🐲',type:'armor',max:1,def:16,price:480},

  const GEAR_DROPS_V52={

  const _rewardV52=addMonsterReward;
  addMonsterReward=function(p,e){

    const defs=GEAR_DROPS_V52[e]||[];
    defs.forEach(drop=>{
      if(Math.random()>=drop.chance)return;

      if(got){
        broadcastEvent({k:'item_drop',x:p.x,y:p.y,s:ITEMS[drop.item].icon,c:'#ffe08a',life:1200});

  };

  /* ---------------------------------------------------------
     2) 공격 모션 / 피격 / 스킬 연출

  S.combatFx=S.combatFx||[];
  function pushCombatFx(fx){S.combatFx.push({...fx,t0:Date.now()});if(S.combatFx.length>80)S.combatFx.splice(0,S.combatFx.length-80);}

    } else if(ev&&ev.k==='levelup_fx'){
      const p=S.players[S.uid];
      if(p)pushCombatFx({kind:'level',x:p.x,y:p.y,icon:'✨',c:'#ffe08a',life:1500});
      playSound('level');
    }
    _handleEventV52(ev);
  };

  function drawCombatFxV52(){
    if(!S.started||!S.combatFx.length)return;
    const m=boardMetrics(),now=Date.now();
    S.combatFx=S.combatFx.filter(f=>now-f.t0<(f.life||900));
    for(const f of S.combatFx){
      const life=f.life||900,a=clamp((now-f.t0)/life,0,1),fade=1-a;
      const q=worldToScreen(Number(f.x)||0,Number(f.y)||0,m),cx=q.x+m.tw/2,cy=q.y+m.th/2;

      ctx.globalAlpha=fade;

        const fx=worldToScreen(Number(f.fromX)||0,Number(f.fromY)||0,m),sx=fx.x+m.tw/2,sy=fx.y+m.th/2;

        ctx.shadowColor='rgba(255,236,145,.95)';ctx.shadowBlur=18;ctx.strokeStyle='#fff3a4';ctx.lineWidth=Math.max(3,m.unit*.09);

        ctx.shadowBlur=0;ctx.translate(cx,cy);ctx.rotate(ang+Math.PI/2);
        ctx.strokeStyle='#ffffff';ctx.lineWidth=Math.max(2,m.unit*.055);
        ctx.beginPath();ctx.arc(0,0,m.unit*(.45+.45*clamp(a,.0,1)),Math.PI*.15,Math.PI*.85);ctx.stroke();

      } else if(f.kind==='skill'){
        const radius=m.unit*(.35+a*1.35);
        ctx.strokeStyle=f.c||'#c6b2ff';ctx.lineWidth=Math.max(2,m.unit*.07);ctx.shadowColor=f.c||'#c6b2ff';ctx.shadowBlur=18;

        ctx.font='bold '+clamp(m.unit*.48,20,38)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(f.icon||'✨',cx,cy);
        if(Array.isArray(f.targets))f.targets.forEach((tgt,i)=>{
          const tq=worldToScreen(Number(tgt.x)||0,Number(tgt.y)||0,m);ctx.globalAlpha=fade*(1-i*.08);ctx.strokeStyle=f.c||'#c6b2ff';ctx.lineWidth=Math.max(2,m.unit*.05);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(tq.x+m.tw/2,tq.y+m.th/2);ctx.stroke();
        });
      } else if(f.kind==='drop'){
        ctx.font='bold '+clamp(m.unit*.48,20,38)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(f.icon||'✨',cx,cy-m.unit*(a*.8));
      } else if(f.kind==='level'){
        const r=m.unit*(.45+a*1.6);ctx.strokeStyle='#ffe08a';ctx.lineWidth=Math.max(2,m.unit*.06);ctx.shadowColor='#ffe08a';ctx.shadowBlur=20;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;ctx.font='900 '+clamp(m.unit*.36,16,30)+'px sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff3b0';ctx.fillText('LEVEL UP!',cx,cy-m.unit*(.9+a*.2));
      }

  /* 스킬은 최종 hostRecv에서 실제 쿨다운 변경 여부를 확인하여 연출 생성 */
  const SKILL_ICONS_V52={fireball:'🔥',frost_nova:'❄️',meteor:'☄️',novice_strike:'✦',novice_burst:'💥',shield_bash:'🛡️',rage_slash:'🪓',blade_wave:'⚔️',cross_slash:'✖️',blade_storm:'🌪️',heavy_strike:'🔨',cleave:'💥',aimed_shot:'🎯',volley:'🏹',arrow_rain:'🌧️',snipe:'🎯',rapid_shot:'🏹',wind_volley:'🌪️',storm_rain:'⛈️',holy_pulse:'✨',greater_heal:'💚',prophecy:'🔯',ambush:'🗡️',poison_flurry:'☠️',shadow_cloak:'🌑'};
  const _hostSkillV52=hostRecv;

<!-- V56 CHARACTER COMBAT MOTION OVERRIDE -->
<script>
(function(){
  'use strict';
  const M56 = window.__rpgV56MotionState || (window.__rpgV56MotionState={});
  function key(kind,id){return kind+':'+String(id);}
  function setMotion(kind,id,data){
    if(id==null)return;
    M56[key(kind,id)]={...data,t0:Date.now(),life:Number(data.life)||420};
  }
  function getMotion(kind,id){
    const k=key(kind,id),m=M56[k];if(!m)return null;
    if(Date.now()-m.t0>m.life){delete M56[k];return null;}
    return m;
  }
  function transform(m,actor,q,metrics){
    if(!m)return {x:0,y:0,rot:0,scale:1,alpha:1};
    const p=Math.min(1,Math.max(0,(Date.now()-m.t0)/m.life));
    const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
    const e=ease(p),u=metrics.unit;
    let x=0,y=0,rot=0,scale=1,alpha=1;
    if(m.action==='attack'){
      const hit=p<.62?Math.sin((p/.62)*Math.PI):0;
      const dir=m.ang||0;
      x=Math.cos(dir)*u*.24*hit; y=Math.sin(dir)*u*.24*hit;
      rot=Math.sin((p/.62)*Math.PI)*(-0.16);
      scale=1+0.11*hit;
    }else if(m.action==='hurt'){
      const shake=(1-p)*u*.10*Math.sin(p*Math.PI*10);
      const dir=m.ang||0;
      x=Math.cos(dir)*shake;y=Math.sin(dir)*shake;
      rot=Math.sin(p*Math.PI*8)*.10*(1-p);
      scale=1+.035*(1-p);
    }else if(m.action==='skill'){
      const pulse=Math.sin(Math.min(1,p)*Math.PI);
      y=-u*.11*pulse;scale=1+.07*pulse;rot=Math.sin(p*Math.PI*2)*.05;
    }else if(m.action==='death'){
      y=-u*.28*p;rot=(m.spin||1)*1.9*p;scale=1-.72*p;alpha=1-p;
    }
    return {x,y,rot,scale,alpha,p,ang:m.ang||0};
  }
  window.__rpgV56GetMotion=getMotion;
  window.__rpgV56MotionTransform=transform;

  function inferMonsterId(ev){
    if(ev.actorId!=null)return String(ev.actorId);
    try{
      const mons=S.mons||[];
      const m=mons.find(x=>String(x.map)===String(ev.map) && Math.abs(x.x-Number(ev.fromX))<.1 && Math.abs(x.y-Number(ev.fromY))<.1);
      return m?String(m.id):null;
    }catch(_){return null;}
  }
  function angle(fromX,fromY,x,y){return Math.atan2((Number(y)||0)-(Number(fromY)||0),(Number(x)||0)-(Number(fromX)||0));}

  const oldHandle=window.handleEvent;
  if(typeof oldHandle==='function'){
    window.handleEvent=function(ev){
      try{
        if(ev&&ev.k==='combat_fx'){
          const kind=String(ev.kind||'');
          if(kind==='playerAttack' || kind==='attack'){
            setMotion('player',ev.id,{action:'attack',x:ev.x,y:ev.y,ang:angle(ev.fromX,ev.fromY,ev.x,ev.y),life:360,color:ev.c||'#fff0a0'});
          }else if(kind==='monsterAttack' || kind==='enemyLunge'){
            const id=inferMonsterId(ev);
            if(id)setMotion('monster',id,{action:'attack',x:ev.x,y:ev.y,ang:angle(ev.fromX,ev.fromY,ev.x,ev.y),life:390,color:ev.c||'#ff9d55'});
          }else if(kind==='playerHit' || kind==='hitFlash'){
            if(ev.id)setMotion('player',ev.id,{action:'hurt',x:ev.x,y:ev.y,ang:0,life:300,color:ev.c||'#ff667a'});
          }else if(kind==='monsterSkill' || kind==='skillBeam'){
            const id=inferMonsterId(ev);
            if(id)setMotion('monster',id,{action:'skill',icon:ev.icon||'🔥',life:620,color:ev.c||'#ff9d55'});
          }else if(kind==='skill' || kind==='skillNova'){
            if(ev.id)setMotion('player',ev.id,{action:'skill',icon:ev.icon||'✨',life:500,color:ev.c||'#c7b4ff'});
          }
        }else if(ev&&ev.k==='death_fx'){
          const kind=ev.kind==='player'?'player':'monster';
          const id=ev.kind==='player'?ev.id:null;
          if(id)setMotion('player',id,{action:'death',life:800,spin:1});
          else{
            const mid=ev.id!=null?String(ev.id):inferMonsterId(ev);
            if(mid)setMotion('monster',mid,{action:'death',life:850,spin:ev.boss?-1:1});
          }
        }else if(ev&&ev.k==='hit'&&ev.id){
          const target=S.mons?.find(m=>String(m.id)===String(ev.id));
          if(target)setMotion('monster',String(target.id),{action:'hurt',life:260,color:'#fff0a0'});
          const me=S.players?.[String(ev.id)];
          if(me)setMotion('player',String(ev.id),{action:'attack',life:260,ang:0,color:'#fff0a0'});
        }else if(ev&&ev.k==='hurt'&&ev.id){
          const me=S.players?.[String(ev.id)];
          if(me)setMotion('player',String(ev.id),{action:'hurt',life:300,color:'#ff667a'});
        }
      }catch(_){ }
      return oldHandle.apply(this,arguments);
    };
  }

  // Also give the event producers stable actor ids for remote clients.
  try{
    const oldAttack=window.monsterBasicAttack;
    if(typeof oldAttack==='function'){
      window.monsterBasicAttack=function(mon,target,now,mult){

        }
        return out;
      };
    }
  }catch(_){ }

  // Reuse the final renderer already patched above; just make sure our helpers are visible.
  window.__rpgV56CombatMotion=true;
})();
</script>
