function enterGame() {
  S.started=true; S.migrating=false;
  $('lobby').hidden=true; $('game').hidden=false;
  updateBadge();

  // 렌더링은 네트워크/복구/성능 측정과 독립적으로 즉시 시작한다.
  // 후속 기능 하나가 실패해도 월드맵 자체는 계속 보이게 한다.
  startRenderLoop();

  try{bindInput();}catch(e){log('입력 초기화 경고: '+(e&&e.message||e));}
  try{
    if(S.peer&&S.peer.open&&S.players[S.uid]) S.players[S.uid].peerId=S.peer.id;
    ensureDirectLinks();
  }catch(e){log('직접 P2P 초기화 경고: '+(e&&e.message||e));}
  try{updateHud();}catch(e){log('HUD 초기화 경고: '+(e&&e.message||e));}
  if(!S.hudTimer) S.hudTimer=setInterval(()=>{try{updateHud();}catch(e){} try{saveLocalAccountSnapshot();}catch(e){}},400);
  try{saveLocalAccountSnapshot();}catch(e){}
  try{issueRecoveryCode(true);}catch(e){log('복구 코드 발급 경고: '+(e&&e.message||e));}
  if(!S.recoveryNoticeShown){S.recoveryNoticeShown=true;log('🗝️ 새 계정 복구 코드는 🗝️ 복구 메뉴에서 확인할 수 있어.');}
  try{startCapabilityReporting();}catch(e){log('성능 측정 경고: '+(e&&e.message||e));}
  if(S.renderHealthTimer)clearTimeout(S.renderHealthTimer);
  S.renderHealthTimer=setTimeout(()=>{
    try{
      const rc=cv.getBoundingClientRect();
      if(rc.width<=1||rc.height<=1){S.renderFallback=true;return;}
      const px=ctx.getImageData(Math.max(0,Math.min(cv.width-1,Math.floor(cv.width/2))),Math.max(0,Math.min(cv.height-1,Math.floor(cv.height/2))),1,1).data;
      if(!px||px[3]<10)S.renderFallback=true;
    }catch(e){S.renderFallback=true;}
  },700);
}

function initLobby() {
  S.score = capabilityScore(S.caps);
  readProfile();
  $('btnCreate').onclick=()=>createRoom(false);
  $('btnQuick').onclick=quickJoin;
  $('btnInv').onclick=renderInventory;$('btnTrade').onclick=openTradePanel;$('btnChat').onclick=renderChat;$('btnQuest').onclick=renderQuest;$('btnSocial').onclick=renderSocial;$('btnMap').onclick=renderTeleportPanel;$('btnCharacter').onclick=renderCharacterPanel;$('btnGuide').onclick=renderGuide;$('btnRecovery').onclick=renderRecoveryPanel;$('btnClosePanel').onclick=closePanel;
  $('btnCopyRecovery').onclick=copyRecoveryCode;
  $('btnNewRecovery').onclick=()=>{saveLocalAccountSnapshot();const code=issueRecoveryCode(true);updateRecoveryUI();lobbyMsg('🔄 최신 계정 데이터로 새 복구 코드를 발급했어.');};
  $('btnRecover').onclick=recoverAccountFromInput;
  $('recoveryInput').addEventListener('input',()=>{const v=$('recoveryInput').value.trim(),hint=$('recoverySessionHint');if(!v){if(hint)hint.textContent='복구 코드를 입력하면 계정 데이터를 복원하고 마지막 방도 찾아줄게.';return;}try{const rp=parseRecoveryCode(v),rs=rp.recoverySession;if(rs&&rs.code){if(hint)hint.textContent='✅ 복구 코드 인식 · '+(rs.roomName||'마지막 방')+' · '+rs.code;}else if(hint)hint.textContent='✅ 계정 복구 코드 인식 · 세션 정보 없음';}catch(e){if(hint)hint.textContent='복구 코드를 확인하는 중…';}});
  updateRecoveryUI();
  $('networkErrorRetry').onclick=()=>{hideConnectionError();if(S.netErrorRetry){const fn=S.netErrorRetry;S.netErrorRetry=null;fn();}};
  $('networkErrorLobby').onclick=()=>{hideConnectionError();cleanupNetwork();S.started=false;$('game').hidden=true;$('lobby').hidden=false;lobbyMsg('연결 오류로 방을 종료했어.');updateBadge();};
  window.addEventListener('keydown',e=>{if(!S.started||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;const k=e.key.toLowerCase();if(k==='i')renderInventory();else if(k==='t')openTradePanel();else if(k==='q')renderQuest();else if(k==='f')renderSocial();else if(k==='m')renderTeleportPanel();else if(k==='c')renderCharacterPanel();else if(k==='h')renderGuide();else if(k==='e'){/* RPG v48: E 상호작용은 후단 통합 핸들러 하나만 처리한다. */}else if(k==='b'){if(nearNpc(S.players[S.uid],NPCS.merchant))renderShop();else log('🏪 상인 루루에게 2칸 이내로 이동해줘.');}});
  initDirectory();
  if (!S.roomTimer) S.roomTimer = setInterval(()=>{ renderRooms(); if(S.isHost) publishRoom(); }, 3000);
  window.addEventListener('resize', () => {
    if (S.started) resizeCanvas();
  }, { passive: true });
  window.addEventListener('pagehide', () => {
    unpublishRoom();
    cleanupNetwork();
  });
}

function monsterBasicAttack(mon,target,now,mult=1){

  broadcastEvent({k:'monster_fx',x:mon.x,y:mon.y,s:d.ai==='boss'?'💥':'✦',c:d.ai==='boss'?'#ff6b6b':'#ffd166',life:520});
  if(target.hp<=0)monsterDefeatPlayer(target);

}
function monsterSpecial(mon,target,now){
  const d=MONS[mon.e];

  mon.state='telegraph';mon.telegraphUntil=now+380;
  broadcastEvent({k:'monster_fx',x:mon.x,y:mon.y,s:d.skill==='breath'?'🔥':d.skill==='roar'?'⚡':d.skill==='charge'?'💨':'💫',c:d.skill==='roar'?'#ff5b6e':'#ffb347',life:650});
  mon.skillReadyAt=now+(d.ai==='boss'?4800:3400);
  mon.attackCount=0;
  if(d.skill==='pounce'){
    if(cheb(mon,target)<=3){monsterStepPath(mon,target);monsterBasicAttack(mon,target,now,1.35);return true;} return false;
  }
  if(d.skill==='charge'){
    if(cheb(mon,target)<=4){monsterStepPath(mon,target);if(cheb(mon,target)<=1)monsterBasicAttack(mon,target,now,1.7);return true;} return false;
  }
  if(d.skill==='breath'){
    if(cheb(mon,target)<=d.range){
      Object.values(S.players).filter(p=>p.map===mon.map&&p.hp>0&&cheb(p,target)<=2).forEach(p=>{const dmg=Math.max(2,Math.floor(d.dmg*1.15)-effectiveDefRpg(p));p.hp=Math.max(0,p.hp-dmg);broadcastEvent({k:'hurt',id:p.id,dmg});if(p.hp<=0)monsterDefeatPlayer(p);});
      return true;
    } return false;
  }
  if(d.skill==='roar'){
    if(cheb(mon,target)<=4){
      Object.values(S.players).filter(p=>p.map===mon.map&&p.hp>0&&cheb(p,mon)<=2).forEach(p=>{const dmg=Math.max(4,Math.floor(d.dmg*1.1)-Math.floor(effectiveDefRpg(p)*0.6));p.hp=Math.max(0,p.hp-dmg);broadcastEvent({k:'hurt',id:p.id,dmg});if(p.hp<=0)monsterDefeatPlayer(p);});
      broadcastEvent({k:'monster_fx',x:mon.x,y:mon.y,s:'💥',c:'#c084fc',life:800});

}
function monsterPatrol(mon,now){

  mon.patrolUntil=now+1200+rnd(2200);
  if(Math.random()<0.32){mon.state='idle';return;}
  const homeDist=Math.abs(mon.x-mon.homeX)+Math.abs(mon.y-mon.homeY);
  if(homeDist>Math.max(3,(MONS[mon.e].leash||10)-2)){monsterStepPath(mon,{x:mon.homeX,y:mon.homeY});mon.state='return';return;}
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>Math.random()-0.5);
  for(const [dx,dy] of dirs)if(monsterStep(mon,dx,dy)){mon.state='patrol';return;}
  mon.state='idle';
}
function hostTickRpg(){
  if(!S.isHost)return;
  const now=Date.now();
  ensureDungeonBoss(now);
  if(now-S.nextSpawn>1400){S.nextSpawn=now;spawnMon();if(S.mons.filter(m=>m.map==='field').length<6)spawnMon();}
  for(const mon of S.mons){
    const d=MONS[mon.e];if(!d)continue;
    if(now<(mon.nextThink||0))continue;
    mon.nextThink=now+(mon.enraged?Math.max(300,d.spd*0.52):Math.max(450,d.spd*0.82));
    if(!Number.isFinite(mon.homeX)){mon.homeX=mon.x;mon.homeY=mon.y;}
    if(mon.hp<=d.hp*0.35&&!mon.enraged){mon.enraged=true;mon.state='enraged';broadcastEvent({k:'log',s:'⚠️ '+mon.e+'가 분노했습니다!'});broadcastEvent({k:'monster_fx',x:mon.x,y:mon.y,s:'‼️',c:'#ff5c5c',life:900});}
    let target=mon.targetId?S.players[mon.targetId]:null;
    if(!target||target.hp<=0||target.map!==mon.map||cheb(mon,target)>(d.leash||10)){target=monsterNearestTarget(mon);mon.targetId=target?target.id:'';}
    if(!target){mon.targetId='';monsterPatrol(mon,now);continue;}
    const dist=cheb(mon,target);
    if(d.ai==='ranged'&&dist<3){
      const ax=mon.x-target.x,ay=mon.y-target.y;
      const dx=Math.abs(ax)>=Math.abs(ay)?Math.sign(ax):0,dy=Math.abs(ax)<Math.abs(ay)?Math.sign(ay):0;
      if(monsterStep(mon,dx||1,dy))mon.state='retreat';else mon.state='chase';
    }else if(mon.attackCount>0&&mon.attackCount%(d.skillEvery||3)===0&&monsterSpecial(mon,target,now)){
    }else if(dist<=1&&d.range<=1){
      monsterBasicAttack(mon,target,now,mon.enraged?1.22:1);
    }else if(dist<=d.range){
      if(!monsterSpecial(mon,target,now))monsterBasicAttack(mon,target,now,mon.enraged?1.12:.86);
    }else if(dist<=d.aggro){
      monsterStepPath(mon,target);mon.state='chase';
    }else{
      mon.targetId='';mon.state='return';monsterStepPath(mon,{x:mon.homeX,y:mon.homeY});
    }

}

function interiorDefByMap(map){
  return Object.values(buildingInteriorDefs).find(d=>d.interior===map)||null;
}
function buildingDoorAt(map,x,y){
  if(map!=='town') return null;
  return RPG_BUILDINGS.find(b=>b.map==='town' && b.door && b.door.x===x && b.door.y===y) || null;
}
function nearestBuildingDoor(p){
  if(!p) return null;
  if(p.map==='town'){
    let best=null,d=999;
    for(const b of RPG_BUILDINGS.filter(b=>b.interior)){
      const q=b.door,dd=cheb(p,q);
      if(dd<d){d=dd;best=b;}
    }
    return d<=1?{...best,dist:d}:null;
  }
  const d=interiorDefByMap(p.map);
  if(!d)return null;
  const dd=cheb(p,d.exit);
  if(dd<=1)return {...d,dist:dd};
  return null;
}
function canEnterBuilding(p,b){
  return !!p && p.map==='town' && b && b.interior && b.door && cheb(p,b.door)<=1 && RPG_MAPS[b.interior];
}
function canExitBuilding(p,d){
  return !!p && d && p.map===d.interior && cheb(p,d.exit)<=1;
}
function requestBuildingTransition(){
  const p=S.players[S.uid]; if(!p)return;
  if(p.map==='town'){
    const b=nearestBuildingDoor(p);
    if(!b){log('🚪 건물 입구 근처에서 E를 눌러줘.');return;}
    sendLocalHost({t:'building_enter',building:b.id});
  }else{
    const d=interiorDefByMap(p.map);
    if(!d){log('🚪 출구를 찾을 수 없어.');return;}
    if(!canExitBuilding(p,d)){log('🚪 건물 출구 근처로 이동해줘.');return;}
    sendLocalHost({t:'building_exit',interior:p.map});
  }
}

/* 실내 맵 충돌 규칙 */
const _buildingIsMapBlocked=isMapBlocked;
isMapBlocked=function(map,x,y){
  const md=mapDef(map);
  if(md.kind==='interior'){
    if(x<0||y<0||x>=md.w||y>=md.h)return true;
    const d=interiorDefByMap(map);
    if(d && x===d.exit.x && y===d.exit.y)return false;
    if(x===0||y===0||x===md.w-1||y===md.h-1)return true;
    const decor=(d&&d.decor)||[];
    for(const o of decor){
      if(x>=o.x&&x<o.x+o.w&&y>=o.y&&y<o.y+o.h)return true;
    }
    /* 실내 벽/가구형 통로 */
    if(map==='guild' && ((x===5&&y>=3&&y<=12)||(x===15&&y>=3&&y<=8))) return true;
    if(map==='market' && ((x===5&&y>=2&&y<=9)||(x===17&&y>=2&&y<=8))) return true;
    if(map==='smith' && ((x===5&&y>=3&&y<=10)||(x===13&&y>=3&&y<=8))) return true;
    return false;
  }
  return _buildingIsMapBlocked(map,x,y);
};

/* 더 '마을'처럼 보이도록 도로/광장/가로등/나무를 추가 */
function isTownRoadRpg(x,y){
  return (y>=18&&y<=22) || (x>=26&&x<=30) || (y>=25&&y<=27&&x>=3&&x<=52) || (x>=43&&x<=45&&y>=20&&y<=36);
}
function isTownPlazaRpg(x,y){return x>=24&&x<=32&&y>=16&&y<=24;}

const _oldMapTileColorRpg=mapTileColor;
mapTileColor=function(map,x,y,css){
  const md=mapDef(map);
  if(md.kind==='interior'){
    if(x===0||y===0||x===md.w-1||y===md.h-1)return '#776857';
    if(y>=md.h-3)return '#b89d7e';
    if(map==='smith')return ((x+y)%2)?'#b6aaa1':'#c0b4ab';
    if(map==='market')return ((x+y)%2)?'#d6c59f':'#ddcdaa';
    if(map==='guild')return ((x+y)%2)?'#b9c7d9':'#c7d1df';
    if(map==='clinic')return ((x+y)%2)?'#cbd8c9':'#d5e0d4';
    if(map==='warehouse')return ((x+y)%2)?'#cabb9d':'#d2c2a5';
    return ((x+y)%2)?'#cdbb9f':'#d7c6aa';
  }
  if(map==='town'){
    if(isTownPlazaRpg(x,y))return ((x+y)%2)?'#d7c18f':'#e1cd9e';
    if(isTownRoadRpg(x,y))return ((x+y)%2)?'#cbb98f':'#d3c39c';
    if((x===4||x===51)&&(y>=14&&y<=35)&&!isTownRoadRpg(x,y))return '#7e9e6f';
  }
  return _oldMapTileColorRpg(map,x,y,css);
};

/* 이벤트 표시 함수가 일부 이전 리비전에서 빠져 있던 문제를 보강.
   호스트 전환/맵 이동/전투 이벤트가 UI 예외로 게임 루프를 깨지 않게 한다. */
function handleEvent(ev){
  if(!ev||typeof ev!=='object')return;
  if(ev.k==='log'&&ev.s)log(String(ev.s));
  else if(ev.k==='hit'&&ev.x!=null&&ev.y!=null&&ev.dmg!=null){S.fx.push({x:+ev.x,y:+ev.y,s:'-'+(+ev.dmg||0),c:'#ffca5c',t0:Date.now(),life:700});}
  else if(ev.k==='hurt'&&ev.id&&ev.dmg!=null){S.fx.push({id:String(ev.id),s:'-'+(+ev.dmg||0),c:'#ff6b7a',t0:Date.now(),life:700});}
  else if(ev.k==='monster_fx'&&ev.x!=null&&ev.y!=null){S.fx.push({x:+ev.x,y:+ev.y,s:String(ev.s||'✦'),c:String(ev.c||'#ffd166'),t0:Date.now(),life:Math.max(300,+(ev.life||650))});}
  else if(ev.k==='appear'&&ev.id){log('👋 '+String(ev.name||'플레이어')+' 님이 들어왔습니다.');}
  else if(ev.k==='leave'&&ev.id){log('🚪 플레이어가 나갔습니다.');}
}

   - 신규 필드 / 던전 / 몬스터 / 보스
   - 넓은 맵 스폰 밀도 보정
   - 채팅 클라이언트 검증 함수 누락 수정

(function installRpgExpansionV17(){
  'use strict';

  /* ---------- 채팅: v16에서 빠진 클라이언트 함수 보완 ---------- */
  function publicChatTextClientV17(text){
    const r=censorChatText(text);
    return r&&r.ok ? {ok:true,text:r.text} : {ok:false,text:''};
  }

  /* ---------- 레벨 / 스탯 ---------- */
  const XP_MAX_LEVEL=120;
  function xpNeedRpg(lv){
    const n=clamp(Math.floor(Number(lv)||1),1,XP_MAX_LEVEL), d=Math.max(0,n-1);
    return Math.floor(120 + d*38 + Math.pow(d,1.3)*3);
  }
  globalThis.xpNeedRpg=xpNeedRpg;

  function awardXpRpg(p,amount){
    if(!p)return;
    amount=Math.max(0,Math.floor(Number(amount)||0));
    p.xp=Math.max(0,Math.floor(Number(p.xp)||0))+amount;
    let leveled=0, oldLv=Math.max(1,Math.floor(Number(p.lv)||1));
    while(p.lv<XP_MAX_LEVEL && p.xp>=xpNeedRpg(p.lv)){
      p.xp-=xpNeedRpg(p.lv);
      p.lv++;
      p.hp=maxHp(p);
      leveled++;
    }
    if(leveled){
      broadcastEvent({k:'log',s:'✨ '+p.name+' 님이 Lv.'+p.lv+'로 레벨업!'});
      broadcastEvent({k:'levelup_fx',s:'✨ LEVEL '+p.lv+'!'});

      }
      if(p.id===S.uid)updateHud();
    }
    return leveled;
  }
  globalThis.awardXpRpg=awardXpRpg;

  function effectiveAtkRpg(p){
    if(!p)return 1;
    const lv=Math.max(1,Number(p.lv)||1);
    const jb=jobBonus(p), eq=equipStats(p);

    return Math.max(1,Math.floor(12 + lv*1.15 + Math.sqrt(lv)*3 + (Number(eq.atk)||0) + (Number(jb.atk)||0)*0.58));

    const h=Math.max(1,Math.round(rect.height||window.innerHeight));
    const dpr=Math.max(1,Math.min(3,Number(window.devicePixelRatio)||1));
    const bw=Math.max(1,Math.round(w*dpr));
    const bh=Math.max(1,Math.round(h*dpr));
    if(cv.width!==bw)cv.width=bw;
    if(cv.height!==bh)cv.height=bh;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.globalAlpha=1;
    ctx.filter='none';
    ctx.imageSmoothingEnabled=true;
    return {w,h,dpr};
  }

  function stableBoardMetrics(){
    const rect=cv.getBoundingClientRect();
    const w=Math.max(1,Math.round(rect.width||window.innerWidth));
    const h=Math.max(1,Math.round(rect.height||window.innerHeight));
    const tw=clamp(Math.min(w/22,h/14),24,48);
    return {w,h,tw,th:tw,unit:tw,cols:Math.ceil(w/tw)+2,rows:Math.ceil(h/tw)+2};
  }

  function drawCoreFallback(reason){
    try{
      const m=stableBoardMetrics();
      const p=S.players[S.uid];
      ctx.setTransform((Number(window.devicePixelRatio)||1),0,0,(Number(window.devicePixelRatio)||1),0,0);
      ctx.globalAlpha=1;ctx.filter='none';ctx.fillStyle='#a9c77d';ctx.fillRect(0,0,m.w,m.h);
      if(!p)return;
      const md=mapDef(p.map||'town');
      updateCamera(m);
      const sx0=Math.max(0,Math.floor(S.camera.x-m.w/(2*m.tw))-2);
      const sx1=Math.min(md.w-1,Math.ceil(S.camera.x+m.w/(2*m.tw))+2);
      const sy0=Math.max(0,Math.floor(S.camera.y-m.h/(2*m.th))-2);
      const sy1=Math.min(md.h-1,Math.ceil(S.camera.y+m.h/(2*m.th))+2);
      for(let y=sy0;y<=sy1;y++)for(let x=sx0;x<=sx1;x++){
        const q=worldToScreen(x,y,m);
        try{drawMapTileRpg(md.id,x,y,q.x,q.y,m,{c1:'#a9c77d',c2:'#b4cf8a'});}
        catch(e){ctx.fillStyle=md.id==='dungeon'?'#5b4659':'#a9c77d';ctx.fillRect(q.x,q.y,m.tw+1,m.th+1);}
      }
      const q=worldToScreen(p.x,p.y,m);
      ctx.font=(m.unit*.68)+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#ffffff';ctx.fillText(p.emoji||'⚔️',q.x+m.tw/2,q.y+m.th/2);
      if(reason){
        ctx.font='700 11px sans-serif';ctx.fillStyle='rgba(0,0,0,.55)';
        ctx.fillText('렌더링 보정 중',m.w/2,m.h-18);
      }
    }catch(e){
      try{const r=cv.getBoundingClientRect();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#9fbe8c';ctx.fillRect(0,0,r.width,r.height);}catch(_){}
    }
  }

  function drawStableFrame(){
    if(!S.started){S.drawStarted=false;return;}
    try{
      stableResizeCanvas();
      const p=S.players[S.uid];
      if(!p){drawCoreFallback('player');return;}
      /* 기존 최종 RPG 렌더러를 우선 사용 */
      try{
        drawSceneRpgBetter();
        S.drawError='';
        return;
      }catch(e){
        S.drawError=String(e&&e.message||e||'render error');
        console.warn('[emoji-rpg render]',S.drawError);
        drawCoreFallback(S.drawError);
      }
    }catch(e){
      S.drawError=String(e&&e.message||e||'render error');
      drawCoreFallback(S.drawError);
    }
  }

  function startStableRenderLoop(){
    if(S.drawStarted)return;
    S.drawStarted=true;
    S.renderFallback=false;
    S.drawError='';
    try{stableResizeCanvas();}catch(e){}
    const frame=()=>{
      try{drawStableFrame();}catch(e){S.drawError=String(e&&e.message||e||'render loop error');}
      if(S.started)requestAnimationFrame(frame);else S.drawStarted=false;
    };
    requestAnimationFrame(frame);
  }

  /* enterGame()가 호출하는 이름을 교체하면 기존 시작 코드는 그대로 유지된다. */
  globalThis.resizeCanvas=stableResizeCanvas;
  globalThis.boardMetrics=stableBoardMetrics;
  globalThis.startRenderLoop=startStableRenderLoop;

  /* 캔버스 자체에 브라우저 필터/변형이 적용되지 않도록 고정 */
  const style=document.createElement('style');
  style.textContent='#cv{filter:none!important;opacity:1!important;transform:none!important;}';
  document.head.appendChild(style);

  window.addEventListener('resize',()=>{try{stableResizeCanvas();}catch(e){}},{passive:true});
  if(window.ResizeObserver){
    const ro=new ResizeObserver(()=>{try{stableResizeCanvas();}catch(e){}});
    ro.observe(cv);
  }

  /* 마지막 초기화 이후 함수가 실제 존재하는지 확인 */
  globalThis.__rpgStabilityPatch=true;
})();


/* =========================
   V26 RPG VISUAL PASS
   - remove checkerboard floors
   - cleaner terrain palettes
   - proper raised/overhanging roofs
   - clearer buildings/roads
   - non-checkerboard minimap
   ========================= */
(function(){
  const visualHash=(x,y,n=0)=>Math.abs(Math.sin((x*127.1+y*311.7+n*74.3)*0.01723)*43758.5453)%1;

  mapTileColor=function(map,x,y,css){
    const md=mapDef(map),k=md.kind;
    if(k==='town'){
      if(isTownPlazaRpg(x,y)){
        const v=visualHash(x,y,2);
        return v>.82?'#d5bb76':v>.45?'#ddc88f':'#e1ce99';
      }
      if(isTownRoadRpg(x,y)){
        const v=visualHash(x,y,4);
        return v>.78?'#c0ae82':v>.38?'#c8b68a':'#cfbe96';
      }
      const v=visualHash(x,y,1);
      return v>.9?'#789b63':v>.52?'#82a76a':'#8aad72';
    }
    if(k==='field'){
      if(md.id==='forest'){
        const v=visualHash(x,y,10);
        return v>.86?'#6f956b':v>.45?'#789f72':'#81a979';
      }
      if(md.id==='canyon'){
        const v=visualHash(x,y,11);
        return v>.86?'#9d604a':v>.45?'#aa6a50':'#b57459';
      }
      const v=visualHash(x,y,12);
      return v>.88?'#93b96f':v>.45?'#a0c37a':'#a9c980';
    }
    if(k==='dungeon'){
      if(md.id==='catacombs'){
        const v=visualHash(x,y,20);
        return v>.9?'#4a394f':v>.5?'#51405a':'#59455f';
      }
      if(md.id==='abyss'){
        const v=visualHash(x,y,21);
        return v>.9?'#2b2138':v>.5?'#332740':'#3a2c47';
      }
      const v=visualHash(x,y,22);
      return v>.9?'#51424f':v>.5?'#594958':'#604e60';
    }
    if(k==='interior'){
      const palette={smith:['#aaa09a','#b7aca5'],market:['#d1bf98','#dbcaa7'],guild:['#b8c4d5','#c3cfde'],clinic:['#c9d6c9','#d3dfd3'],warehouse:['#c2b194','#cdbd9f']};
      const pair=palette[md.id]||['#c5b299','#d0bea6'];
      const v=visualHash(x,y,30);
      return v>.48?pair[0]:pair[1];
    }
    return '#7f9f6b';
  };

  drawMapTileRpg=function(map,x,y,sx,sy,m,css){
    const md=mapDef(map),blocked=isMapBlocked(map,x,y),base=mapTileColor(map,x,y,css);
    ctx.fillStyle=base;
    ctx.fillRect(sx,sy,m.tw+1,m.th+1);
    if(!blocked){
      const hv=visualHash(x,y,md.id==='town'?40:md.id==='field'?41:42);
      if(md.kind==='field' && hv>.88){
        ctx.fillStyle=md.id==='canyon'?'rgba(70,45,30,.17)':'rgba(58,95,55,.12)';
        ctx.beginPath();
        ctx.arc(sx+m.tw*(.25+.5*visualHash(x,y,43)),sy+m.th*(.28+.44*visualHash(x,y,44)),Math.max(1,m.tw*.035),0,Math.PI*2);
        ctx.fill();
      }
      if(md.kind==='dungeon' && hv>.82){
        ctx.fillStyle='rgba(255,210,120,.10)';
        ctx.fillRect(sx+m.tw*.18,sy+m.th*.18,Math.max(1,m.tw*.055),Math.max(1,m.th*.055));
      }
      return;
    }
    const wall=md.kind==='town'?'#63584b':md.kind==='field'?'#586f4e':'#302833';
    ctx.fillStyle=wall;
    ctx.fillRect(sx+m.tw*.055,sy+m.th*.055,m.tw*.89,m.th*.89);
    ctx.strokeStyle=md.kind==='town'?'rgba(255,239,190,.16)':'rgba(255,255,255,.08)';
    ctx.lineWidth=Math.max(1,m.unit*.025);
    ctx.strokeRect(sx+m.tw*.055,sy+m.th*.055,m.tw*.89,m.th*.89);
    if(md.kind==='field'){
      const icon=md.id==='forest'?'🌲':md.id==='canyon'?'🪨':null;
      if(icon){ctx.font=(m.unit*.35)+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(icon,sx+m.tw/2,sy+m.th*.64);}
    }
  };

  drawTownBuildingsRpgBetter=function(m,fg){
    for(const b of RPG_BUILDINGS.filter(b=>b.map==='town')){
      const q=worldToScreen(b.x,b.y,m),w=b.w*m.tw,h=b.h*m.th;
      const roofH=Math.max(m.th*.72,m.th*1.02);
      const wallY=q.y+roofH*.42;
      const wallH=h-roofH*.05;
      const door=worldToScreen(b.door.x,b.door.y,m);
      ctx.save();
      ctx.fillStyle='rgba(33,29,24,.18)';
      ctx.fillRect(q.x+4,q.y+h-2,w-2,m.th*.16);
      ctx.fillStyle=b.wall;
      ctx.strokeStyle='rgba(47,38,31,.45)';
      ctx.lineWidth=1.6;
      ctx.fillRect(q.x+3,wallY,w-6,wallH);
      ctx.strokeRect(q.x+3,wallY,w-6,wallH);
      const eaveY=wallY+m.th*.08;
      const peakY=q.y-roofH*.46;
      ctx.fillStyle=b.roof;
      ctx.beginPath();
      ctx.moveTo(q.x-m.th*.13,eaveY);
      ctx.lineTo(q.x+w/2,peakY);
      ctx.lineTo(q.x+w+m.th*.13,eaveY);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle='rgba(42,31,28,.52)';
      ctx.lineWidth=1.8;
      ctx.stroke();
      ctx.fillStyle='rgba(54,39,31,.34)';
      ctx.fillRect(q.x-m.th*.09,eaveY-m.th*.02,w+m.th*.18,m.th*.11);
      const wx=m.tw*Math.min(1.9,Math.max(1.2,b.w/4.2));
      const wy=m.th*.62;
      const count=b.w>=10?2:1;
      for(let i=0;i<count;i++){
        const frac=(i+1)/(count+1);
        const cx=q.x+w*frac;
        if(Math.abs(cx-door.x-m.tw*.5)<m.tw*.8 && count===1)continue;
        ctx.fillStyle='rgba(151,204,229,.88)';
        ctx.fillRect(cx-wx*.24,wallY+m.th*.52,wx*.48,wy*.48);
        ctx.strokeStyle='rgba(72,82,88,.48)';
        ctx.strokeRect(cx-wx*.24,wallY+m.th*.52,wx*.48,wy*.48);
      }
      ctx.font=(m.unit*.43)+'px '+FONT;
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillStyle=fg;
      ctx.fillText(b.icon,q.x+w/2,wallY+m.th*1.0);
      ctx.font='800 '+clamp(m.unit*.17,10,14)+'px sans-serif';
      ctx.fillText(b.name.split(' · ')[0],q.x+w/2,wallY+m.th*1.52);
      ctx.fillStyle='rgba(92,62,43,.92)';
      ctx.fillRect(door.x+3,door.y+m.th*.16,m.tw-6,m.th*.84);
      ctx.fillStyle='rgba(244,225,176,.96)';
      ctx.beginPath();ctx.arc(door.x+m.tw*.72,door.y+m.th*.57,Math.max(1,m.unit*.035),0,Math.PI*2);ctx.fill();
      ctx.fillStyle=fg;
      ctx.font='800 '+clamp(m.unit*.14,8,11)+'px sans-serif';
      ctx.fillText('E',door.x+m.tw*.5,door.y+m.th*.38);
      ctx.restore();
    }
    drawTownDetailsRpg(m,fg);
  };
  drawTownBuildingsRpg=drawTownBuildingsRpgBetter;

  drawMinimapRpgBetter=function(){
    const p=S.players[S.uid];if(!p)return;
    const map=p.map||'town',md=mapDef(map),mc=$('minimap');if(!mc)return;
    const mx=mc.getContext('2d'),sx=mc.width/md.w,sy=mc.height/md.h;
    mx.clearRect(0,0,mc.width,mc.height);
    for(let y=0;y<md.h;y++)for(let x=0;x<md.w;x++){
      let col=mapTileColor(map,x,y,null);
      if(isMapBlocked(map,x,y)) col=md.kind==='dungeon'?'#302833':md.kind==='town'?'#63584b':'#586f4e';
      mx.fillStyle=col;mx.fillRect(x*sx,y*sy,Math.ceil(sx+.5),Math.ceil(sy+.5));
    }
    if(map==='town')for(const b of RPG_BUILDINGS.filter(b=>b.map==='town')){
      mx.fillStyle='#8e6a4d';mx.fillRect(b.x*sx,b.y*sy,b.w*sx,b.h*sy);
      mx.fillStyle='#e2c67c';mx.fillRect(b.door.x*sx,b.door.y*sy,Math.max(2,sx+1),Math.max(2,sy+1));
    }
    Object.values(S.players).filter(q=>q.map===map).forEach(q=>{
      mx.fillStyle=q.id===S.uid?'#ffd54a':'#eaf1ff';
      mx.fillRect(q.x*sx,q.y*sy,Math.max(2,sx+1),Math.max(2,sy+1));
    });
    S.mons.filter(mm=>mm.map===map).forEach(mm=>{
      mx.fillStyle=mm.isBoss?'#ff5b6e':'#e86a6a';
      mx.fillRect(mm.x*sx,mm.y*sy,Math.max(1,sx),Math.max(1,sy));
    });
    (RPG_PORTALS[map]||[]).forEach(t=>{
      mx.fillStyle='#67d6ff';mx.fillRect(t.x*sx,t.y*sy,Math.max(2,sx+1),Math.max(2,sy+1));
    });
    const d=interiorDefByMap(map);if(d){
      mx.fillStyle='#ffe2a6';mx.fillRect(d.exit.x*sx,d.exit.y*sy,Math.max(2,sx+1),Math.max(2,sy+1));
    }
    const view=boardMetrics(),hx=Math.min(md.w/2,Math.ceil(view.w/(2*view.tw))),hy=Math.min(md.h/2,Math.ceil(view.h/(2*view.th)));
    mx.strokeStyle='rgba(255,255,255,.9)';mx.lineWidth=1;
    mx.strokeRect(Math.max(0,(p.x-hx)*sx),Math.max(0,(p.y-hy)*sy),Math.min(mc.width,hx*2*sx),Math.min(mc.height,hy*2*sy));
  };
  drawMinimapRpg=drawMinimapRpgBetter;drawMinimap=drawMinimapRpgBetter;
})();



/* ============================================================
   RPG 정식화 패치 v27
   - 캐릭터 외형은 직업 아이콘으로 고정
   - 커스터마이징은 모자 / 칭호 중심
   - 맵은 고정된 설계 + 좌표 기반 지면 색 변화
   - 필드/숲/협곡/던전에 고정 장식과 횃불 추가
   - 신규 던전도 방/복도 구조를 사용
   ============================================================ */
(function(){
  const JOB_VISUAL_AURA={
    novice:'#8a8f98',fighter:'#d95b4f',mage:'#9b6cff',archer:'#4fa86b',rogue:'#4f86d9',
    guardian:'#5b86c9',berserker:'#cf4f45',elementalist:'#8c63d9',sage:'#6c7fd0',ranger:'#4e9a68',sniper:'#5b83b8',assassin:'#5a63a9',trickster:'#7e6ab2'
  };

  function validHatTitleStyle(style){
    const a=style&&typeof style==='object'?style:{};
    return {
      aura: typeof a.aura==='string' ? a.aura : '#8a8f98',
      hat: CHARACTER_HATS.includes(a.hat)?a.hat:'',
      title: CHARACTER_TITLES.includes(a.title)?a.title:CHARACTER_TITLES[0]
    };
  }
  function syncJobAppearance(p){
    if(!p)return p;
    const j=jobData(p);
    const aura=JOB_VISUAL_AURA[j.code]||JOB_VISUAL_AURA.novice;
    const cur=validHatTitleStyle(p.appearance||S.characterStyle);
    p.appearance={aura,hat:cur.hat,title:cur.title};
    p.emoji=j.icon;
    if(p.id===S.uid){
      S.emoji=j.icon;
      S.characterStyle={aura,hat:cur.hat,title:cur.title};
    }
    return p;
  }

  const _jobDataForV27=jobData;
  jobData=function(p){
    const j=_jobDataForV27(p);
    if(p){
      p.emoji=j.icon;
      const a=validHatTitleStyle(p.appearance||S.characterStyle);
      const aura=JOB_VISUAL_AURA[j.code]||JOB_VISUAL_AURA.novice;
      p.appearance={aura,hat:a.hat,title:a.title};
      if(p.id===S.uid){S.emoji=j.icon;S.characterStyle={aura,hat:a.hat,title:a.title};}
    }
    return j;
  };
  globalThis.jobData=jobData;

  const _normalizeForV27=normalizePlayer;
  normalizePlayer=function(p){
    const out=_normalizeForV27(p);
    return syncJobAppearance(out||p);
  };
  globalThis.normalizePlayer=normalizePlayer;

  /* 캐릭터 패널: 이름 + 모자 + 칭호만 변경 가능. 얼굴/색상 선택은 제거. */
  renderCharacterPanel=function(){
    const p=S.players[S.uid]||newPlayer(S.uid,S.name,S.emoji,S.score,S.friendCode);
    normalizePlayer(p);
    const j=jobData(p);
    syncJobAppearanceV28(p);
    const a=validHatTitleStyle(p.appearance||S.characterStyle);
    const hats=CHARACTER_HATS.map((h,i)=>'<button class="itemBtn '+(a.hat===h?'active':'')+'" data-hat="'+i+'"><strong>'+(h||'🙂')+'</strong><small>'+(h||'없음')+'</small></button>').join('');
    const titles=CHARACTER_TITLES.map(t=>'<option '+(a.title===t?'selected':'')+'>'+escapeHtml(t)+'</option>').join('');
    const html=
      '<div class="characterPreview"><div class="characterAvatar" id="charPreview">'+escapeHtml(j.icon)+' '+escapeHtml(a.hat||'')+'</div><div><b id="charPreviewName">'+escapeHtml(S.name)+'</b><div class="socialSub">직업 · '+escapeHtml(j.name)+'</div><div class="socialSub">칭호 · <span id="charPreviewTitle">'+escapeHtml(a.title)+'</span></div><div class="socialSub">캐릭터 외형은 직업에 따라 자동으로 바뀌고, 꾸미기는 모자와 칭호만 가능해.</div></div></div>'+ 
      '<div class="section"><div class="sectionTitle">🎓 현재 직업</div><div class="npcHint"><b style="font-size:18px">'+escapeHtml(j.icon)+'</b> '+escapeHtml(j.name)+' · '+j.stage+'차 전직</div></div>'+ 
      '<div class="section"><div class="sectionTitle">🎩 모자</div><div class="panelGrid">'+hats+'</div></div>'+ 
      '<div class="section"><div class="sectionTitle">🏷️ 칭호</div><select id="charTitle" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)">'+titles+'</select></div>'+ 
      '<div class="section"><input id="charName" maxlength="10" value="'+escapeHtml(S.name)+'" placeholder="캐릭터 이름"><button id="charSave" style="width:100%;margin-top:7px">✅ 저장하고 게임에 적용</button></div>';
    openPanel('🧑 캐릭터 꾸미기',html);
    const refresh=()=>{
      const cp=$('charPreview'); if(cp)cp.textContent=j.icon+' '+a.hat;
      const ct=$('charPreviewTitle'); if(ct)ct.textContent=a.title;
      $('panelBody').querySelectorAll('[data-hat]').forEach(b=>b.classList.toggle('active',a.hat===CHARACTER_HATS[Number(b.dataset.hat)||0]));
    };
    $('panelBody').querySelectorAll('[data-hat]').forEach(b=>b.onclick=()=>{a.hat=CHARACTER_HATS[Number(b.dataset.hat)||0]||'';refresh();});
    $('charTitle').onchange=()=>{a.title=CHARACTER_TITLES.includes($('charTitle').value)?$('charTitle').value:CHARACTER_TITLES[0];refresh();};
    $('charSave').onclick=()=>{
      S.name=String($('charName').value||'모험가').trim().slice(0,10)||'모험가';
      p.name=S.name;
      a.aura=JOB_VISUAL_AURA[j.code]||JOB_VISUAL_AURA.novice;
      p.appearance={aura:a.aura,hat:a.hat,title:a.title};
      p.emoji=j.icon;S.emoji=j.icon;S.characterStyle={...p.appearance};
      saveCharacterStyle();saveLocalAccountSnapshot();
      if(S.isHost){bcast({t:'ev',k:'appearance',id:S.uid});}
      else if(S.hostConn&&S.hostConn.open){S.hostConn.send({t:'appearance_update',appearance:S.characterStyle,name:S.name,emoji:j.icon});}
      updateHud();closePanel();log('🧑 캐릭터 설정을 저장했어.');
    };
  };

  /* 직업을 바꾸는 순간 외형도 즉시 직업 외형으로 변경 */
  const _hostRecvForV27=hostRecv;
  hostRecv=function(c,m){
    _hostRecvForV27(c,m);
    if(m&&m.t==='job_choose'&&c&&c.uid&&S.players[c.uid])syncJobAppearance(S.players[c.uid]);
  };
  globalThis.hostRecv=hostRecv;

  const _onClientDataForV27=onClientData;
  onClientData=function(m){
    if(m&&m.t==='job_done'&&m.job){

    const dx=(Number(f.x)||0)-(Number(f.fromX)||0), dy=(Number(f.y)||0)-(Number(f.fromY)||0);
    const len=Math.hypot(dx,dy)||1;
    return {dx:dx/len,dy:dy/len,ang:Math.atan2(dy,dx)};
  }

  function v55Burst(x,y,color,count=10,power=1){
    for(let i=0;i<count;i++){
      const a=Math.random()*Math.PI*2, speed=(.35+Math.random()*1.1)*power;
      v55Fx({kind:'particle',x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,size:.06+Math.random()*.10,color,life:260+Math.random()*350,t0:Date.now()});
    }
  }

  function v55InstallEvents(){
    if(CombatV55.initialized) return;
    CombatV55.initialized=true;

    const oldHandle=handleEvent;
    handleEvent=function(ev){
      try{
        if(ev&&ev.k==='combat_fx'){
          const kind=String(ev.kind||'');
          if(kind==='playerAttack'){
            v55Fx({...ev,kind:'slashLunge',life:360});
            v55Burst(Number(ev.x)||0,Number(ev.y)||0,ev.c||'#fff0a0',8,.9);
            v55Shake(2.5);
            try{playSound('attack');}catch(_){ }
          }else if(kind==='monsterAttack'){
            v55Fx({...ev,kind:'enemyLunge',life:390});
            v55Burst(Number(ev.x)||0,Number(ev.y)||0,ev.c||'#ff8b6b',9,1);
            v55Shake(3.5);
          }else if(kind==='impact'){
            v55Fx({...ev,kind:'impactRing',life:300});
            v55Burst(Number(ev.x)||0,Number(ev.y)||0,ev.c||'#fff',12,1.15);
          }else if(kind==='playerHit'){
            v55Fx({...ev,kind:'hitFlash',life:380});
            v55Burst(Number(ev.x)||0,Number(ev.y)||0,ev.c||'#ff5d73',10,1);
            v55Shake(5);
          }else if(kind==='monsterSkill'){
            v55Fx({...ev,kind:'skillBeam',life:760});
            v55Burst(Number(ev.x)||0,Number(ev.y)||0,ev.c||'#ffab61',14,1.15);
            v55Shake(6);
          }else if(kind==='skill'){
            v55Fx({...ev,kind:'skillNova',life:700});
            v55Burst(Number(ev.x)||0,Number(ev.y)||0,ev.c||'#c7b4ff',18,1.25);
            v55Shake(4);
          }
        } else if(ev&&ev.k==='death_fx'){
          const x=Number(ev.x)||0,y=Number(ev.y)||0;
          v55Fx({kind:'deathNova',x,y,c:ev.kind==='player'?'#a9b9ff':'#ffd76e',icon:ev.icon||'💥',life:1050});
          v55Burst(x,y,ev.kind==='player'?'#a9b9ff':'#ffd76e',24,1.8);
          v55Shake(ev.kind==='player'?8:6);
        } else if(ev&&ev.k==='world_drop_spawn'){
          v55Fx({kind:'lootDrop',x:Number(ev.x)||0,y:Number(ev.y)||0,icon:ITEMS[ev.item]?.icon||'✨',c:'#ffe08a',life:1100});
          v55Burst(Number(ev.x)||0,Number(ev.y)||0,'#ffe08a',8,.8);
        } else if(ev&&ev.k==='world_drop_pickup'){
          v55Fx({kind:'lootPickup',x:Number(ev.x)||0,y:Number(ev.y)||0,icon:ITEMS[ev.item]?.icon||'✨',c:'#8ff7b6',life:700});
          try{playSound('equip');}catch(_){ }
        }
      }catch(_){ }
      return oldHandle(ev);
    };
    globalThis.handleEvent=handleEvent;
  }

  function v55RenderFx(){
    if(!S.started) return;
    const m=boardMetrics(), now=Date.now();
    S.combatFx=S.combatFx.filter(f=>now-(f.t0||now)<(f.life||600));

    /* 화면 흔들림은 캔버스 자체를 건드리지 않고 FX 레이어에만 적용 */
    CombatV55.shake*=.84;
    if(CombatV55.shake>.15){
      const j=(Math.random()-.5)*CombatV55.shake;
      ctx.save();
      ctx.translate(j,(Math.random()-.5)*CombatV55.shake);
    }

    for(const f of S.combatFx){
      const life=f.life||600, a=clamp((now-f.t0)/life,0,1), fade=1-a;
      if(!Number.isFinite(f.x)||!Number.isFinite(f.y)) continue;
      const q=worldToScreen(f.x,f.y,m),cx=q.x+m.tw/2,cy=q.y+m.th/2;
      ctx.save();
      ctx.globalAlpha=fade;
      ctx.textAlign='center';ctx.textBaseline='middle';

      if(f.kind==='slashLunge'||f.kind==='enemyLunge'){
        const st=worldToScreen(f.fromX,f.fromY,m),sx=st.x+m.tw/2,sy=st.y+m.th/2;
        const t=clamp(a/.52,0,1),xx=sx+(cx-sx)*t,yy=sy+(cy-sy)*t;
        const ang=Math.atan2(cy-sy,cx-sx);
        const scale=f.kind==='enemyLunge'?1.0:1.05;
        ctx.strokeStyle=f.c||'#fff0a0';ctx.shadowColor=f.c||'#fff0a0';ctx.shadowBlur=18;ctx.lineWidth=Math.max(3,m.unit*.11);
        ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(xx,yy);ctx.stroke();ctx.shadowBlur=0;
        ctx.save();ctx.translate(xx,yy);ctx.rotate(ang);
        ctx.font='900 '+clamp(m.unit*.54*scale,22,42)+'px sans-serif';ctx.fillText(f.icon||'⚔️',0,0);
        ctx.strokeStyle=f.c||'#fff0a0';ctx.lineWidth=Math.max(2,m.unit*.065);
        ctx.beginPath();ctx.arc(0,0,m.unit*(.30+.40*t),-1.15,1.15);ctx.stroke();
        ctx.restore();
      } else if(f.kind==='impactRing'){
        const r=m.unit*(.12+a*.78);
        ctx.strokeStyle=f.c||'#fff';ctx.lineWidth=Math.max(2,m.unit*.065);ctx.shadowColor=f.c||'#fff';ctx.shadowBlur=14;
        ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
        for(let i=0;i<10;i++){
          const ang=i*Math.PI*2/10, r1=r*.65,r2=r*(1.05+.28*Math.sin(a*Math.PI));
          ctx.beginPath();ctx.moveTo(cx+Math.cos(ang)*r1,cy+Math.sin(ang)*r1);ctx.lineTo(cx+Math.cos(ang)*r2,cy+Math.sin(ang)*r2);ctx.stroke();
        }
      } else if(f.kind==='hitFlash'){
        ctx.fillStyle=f.c||'#ff6075';ctx.globalAlpha=fade*.22;ctx.beginPath();ctx.arc(cx,cy,m.unit*.58,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=fade;
        ctx.font='900 '+clamp(m.unit*.38,17,28)+'px sans-serif';
        ctx.fillText(f.icon||'💢',cx,cy-m.unit*(.25+.45*a));
        ctx.strokeStyle=f.c||'#ff6075';ctx.lineWidth=Math.max(2,m.unit*.06);
        for(let i=0;i<6;i++){const ang=i*Math.PI/3;ctx.beginPath();ctx.moveTo(cx+Math.cos(ang)*m.unit*.12,cy+Math.sin(ang)*m.unit*.12);ctx.lineTo(cx+Math.cos(ang)*m.unit*(.42+.28*a),cy+Math.sin(ang)*m.unit*(.42+.28*a));ctx.stroke();}
      } else if(f.kind==='skillNova'){
        const r=m.unit*(.25+a*1.45);
        ctx.strokeStyle=f.c||'#c7b4ff';ctx.lineWidth=Math.max(2,m.unit*.075);ctx.shadowColor=f.c||'#c7b4ff';ctx.shadowBlur=22;
        ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
        ctx.font='900 '+clamp(m.unit*(.48+.12*(1-a)),20,40)+'px sans-serif';ctx.fillText(f.icon||'✨',cx,cy);
        for(let i=0;i<8;i++){const ang=i*Math.PI/4+a*2;const rr=r*(.72+.20*Math.sin(i));ctx.beginPath();ctx.moveTo(cx+Math.cos(ang)*r*.25,cy+Math.sin(ang)*r*.25);ctx.lineTo(cx+Math.cos(ang)*rr,cy+Math.sin(ang)*rr);ctx.stroke();}
      } else if(f.kind==='skillBeam'){
        const st=worldToScreen(f.fromX,f.fromY,m),sx=st.x+m.tw/2,sy=st.y+m.th/2;
        const t=clamp(a/.62,0,1),xx=sx+(cx-sx)*t,yy=sy+(cy-sy)*t;
        ctx.strokeStyle=f.c||'#ff9b54';ctx.shadowColor=f.c||'#ff9b54';ctx.shadowBlur=22;ctx.lineWidth=Math.max(4,m.unit*.12);
        ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(xx,yy);ctx.stroke();ctx.shadowBlur=0;
        ctx.font='900 '+clamp(m.unit*.52,22,42)+'px sans-serif';ctx.fillText(f.icon||'🔥',xx,yy);
        ctx.globalAlpha=fade*.25;ctx.fillStyle=f.c||'#ff9b54';ctx.beginPath();ctx.arc(xx,yy,m.unit*.45,0,Math.PI*2);ctx.fill();
      } else if(f.kind==='deathNova'){
        const r=m.unit*(.25+a*1.35), color=f.c||'#ffd76e';
        ctx.strokeStyle=color;ctx.lineWidth=Math.max(2,m.unit*.075);ctx.shadowColor=color;ctx.shadowBlur=20;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
        ctx.font='900 '+clamp(m.unit*(.52+.08*(1-a)),23,42)+'px sans-serif';ctx.fillText(f.icon||'💥',cx,cy-m.unit*.05);
        ctx.font='900 '+clamp(m.unit*.20,10,16)+'px sans-serif';ctx.fillStyle='#fff4c2';ctx.fillText('DEFEATED',cx,cy+m.unit*.66);
      } else if(f.kind==='lootDrop'){
        const bob=Math.sin((now-f.t0)/115)*m.unit*.10;
        ctx.shadowColor='#ffe08a';ctx.shadowBlur=24;ctx.font='900 '+clamp(m.unit*.52,22,42)+'px sans-serif';ctx.fillText(f.icon||'✨',cx,cy-bob);ctx.shadowBlur=0;
        ctx.strokeStyle='#ffe08a';ctx.lineWidth=2;
        for(let i=0;i<6;i++){const ang=i*Math.PI/3+(now-f.t0)/400;const rr=m.unit*(.4+.18*Math.sin(a*Math.PI));ctx.beginPath();ctx.moveTo(cx+Math.cos(ang)*rr*.4,cy+Math.sin(ang)*rr*.4);ctx.lineTo(cx+Math.cos(ang)*rr,cy+Math.sin(ang)*rr);ctx.stroke();}
      } else if(f.kind==='lootPickup'){
        const yy=cy-m.unit*(.8*a);ctx.font='900 '+clamp(m.unit*.40,18,34)+'px sans-serif';ctx.fillStyle=f.c||'#8ff7b6';ctx.fillText(f.icon||'✨',cx,yy);
        ctx.font='900 '+clamp(m.unit*.18,10,15)+'px sans-serif';ctx.fillText('획득!',cx,yy+m.unit*.42);
      } else if(f.kind==='particle'){
        const dt=(now-f.t0)/220;const px=cx+(f.vx||0)*m.unit*dt*4;const py=cy+(f.vy||0)*m.unit*dt*4+m.unit*.22*dt*dt;
        ctx.globalAlpha=fade;ctx.fillStyle=f.color||'#fff';ctx.shadowColor=f.color||'#fff';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(px,py,Math.max(1,m.unit*(f.size||.07)*(1-a)),0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
    }
    if(CombatV55.shake>.15)ctx.restore();
  }

  /* 최종 렌더 훅: 기존 FX가 없어도 항상 이 레이어가 실행된다. */
  const _drawSceneV55 = drawSceneRpg;
  drawSceneRpg=function(){
    _drawSceneV55();
    try{v55RenderFx();}catch(_){ }
  };
  drawScene=drawSceneRpg;

  /* 기존 전투 호출이 결과값을 반환하지 않는 경우에도 모션은 보여준다. */
  const _attackV55 = doAttackRpg;
  doAttackRpg=function(uid){
    const p=S.players[uid];
    const target=p?nearestRpgMonsterFor(p,classProfile(p).range):null;
    const tx=target?target.x:p?.x, ty=target?target.y:p?.y;
    const out=_attackV55(uid);
    if(p&&target){
      const sameMap=target.map===p.map;
      if(sameMap){
        v55Fx({kind:'slashLunge',fromX:p.x,fromY:p.y,x:tx,y:ty,icon:'⚔️',c:'#fff0a0',life:360});
        v55Fx({kind:'impactRing',x:tx,y:ty,icon:'✦',c:'#fff4b0',life:300});
        v55Burst(tx,ty,'#fff0a0',10,1);
      }
    }
    return out;
  };
  globalThis.doAttackRpg=doAttackRpg;doAttack=doAttackRpg;

  const _monsterAtkV55 = monsterBasicAttack;
  monsterBasicAttack=function(mon,target,now,mult=1){
    const out=_monsterAtkV55(mon,target,now,mult);
    if(mon&&target){
      v55Fx({kind:'enemyLunge',fromX:mon.x,fromY:mon.y,x:target.x,y:target.y,icon:mon.e==='👹'?'💥':'⚡',c:mon.e==='👹'?'#ff765f':'#ffb05c',life:390});
      v55Fx({kind:'hitFlash',x:target.x,y:target.y,icon:'💢',c:'#ff667a',life:380});
      v55Burst(target.x,target.y,'#ff667a',9,1);
      v55Shake(mon.e==='👹'?7:4);
    }
    return out;
  };
  globalThis.monsterBasicAttack=monsterBasicAttack;

  const _monsterSpecialV55 = monsterSpecial;
  monsterSpecial=function(mon,target,now){
    const out=_monsterSpecialV55(mon,target,now);
    if(mon&&target){
      const icon=mon.e==='🐉'?'🔥':mon.e==='👹'?'⚡':'💨';
      v55Fx({kind:'skillBeam',fromX:mon.x,fromY:mon.y,x:target.x,y:target.y,icon,c:(mon.e==='👹'?'#ff5d5d':'#ff9d55'),life:760});
      v55Burst(target.x,target.y,mon.e==='👹'?'#ff5d5d':'#ff9d55',16,1.25);
      v55Shake(mon.e==='👹'?8:5);
    }
    return out;
  };
  globalThis.monsterSpecial=monsterSpecial;

  v55InstallEvents();
  try{window.__rpgV55CombatFx=true;}catch(_){ }

})();
</script>

<script>
(function(){
  'use strict';
  const TUTORIAL_KEY='emoji-rpg-tutorial-v32';
  const stage=()=>document.getElementById('stage');
  const isMobileV32=()=>window.matchMedia('(max-width:720px)').matches||window.matchMedia('(pointer:coarse)').matches;
  const nearestNpcV32=()=>{
    const p=S.players&&S.players[S.uid];if(!p)return null;
    let best=null,d=999;const list=typeof RPG_NPCS!=='undefined'?Object.values(RPG_NPCS):[];
    list.forEach(n=>{if(String(n.map)!==String(p.map))return;const dd=cheb(p,n);if(dd<d){d=dd;best=n;}});
    return d<=2?best:null;
  };

  const tutorialSteps=[
    {title:'1. 먼저 움직여 보자',text:`PC에서는 WASD 또는 방향키를 사용해.
스마트폰에서는 화면의 방향키를 눌러 이동하면 돼.
루미나 마을 안에서는 전투 없이 천천히 익숙해질 수 있어.`},
    {title:'2. 몬스터와 싸우기',text:`전투가 시작되면 스페이스로 기본 공격을 할 수 있어.
직업마다 공격 사거리와 전투 방식이 달라.
처음에는 바람초원의 약한 몬스터부터 상대해 봐.`},
    {title:'3. 직업 스킬 익히기',text:`전직하면 직업에 맞는 스킬을 배워.
스킬바에서 이름과 쿨타임을 확인하고, 전투 중 필요한 스킬을 골라 사용해.`},
    {title:'4. NPC에게 말을 걸자',text:`NPC 가까이 가면 대화 안내가 나타나.

<script>
(function installRpgQualityV33(){
  'use strict';

  /* -----------------------------------------------------------
     1. 복구 코드에 실제 RPG 진행 데이터를 빠뜨리지 않기
     ----------------------------------------------------------- */
  const _accountV33 = playerAccountData;
  playerAccountData = function(p){
    const d = _accountV33(p);
    if(!d || !p) return d;
    normalizePlayer(p);
    d.job = p.job ? {...p.job} : {stage:0,code:'novice',name:'견습 모험가',icon:'🧑'};
    d.appearance = sanitizeAppearance(p.appearance);
    d.enhance = {...(p.enhance||{weapon:0,armor:0})};
    d.storage = {...(p.storage||{})};
    d.home = {...(p.home||{})};
    d.guildQuest = p.guildQuest ? {
      ...p.guildQuest,
      completed:{...((p.guildQuest && p.guildQuest.completed)||{})}
    } : {active:null,progress:0,claimed:false,completed:{}};
    return d;
  };
  globalThis.playerAccountData = playerAccountData;

  const _parseRecoveryV33 = parseRecoveryCode;
  parseRecoveryCode = function(code){
    const p = _parseRecoveryV33(code);
    try{
      const raw=String(code||'').trim(),parts=raw.split('-');
      const packed=parts.slice(1,-1).join('-');
      const payload=JSON.parse(b64UrlDecode(packed));
      const d=payload&&payload.data||{};

      if(d.job && typeof d.job==='object'){
        p.job={
          stage:clamp(Math.floor(Number(d.job.stage)||0),0,4),
          code:String(d.job.code||'novice'),
          name:String(d.job.name||'견습 모험가').slice(0,24),
          icon:String(d.job.icon||'🧑')
        };
      }
      if(d.appearance && typeof d.appearance==='object') p.appearance=sanitizeAppearance(d.appearance);
      p.enhance=d.enhance&&typeof d.enhance==='object'?{...d.enhance}:{weapon:0,armor:0};
      p.storage=d.storage&&typeof d.storage==='object'?{...d.storage}:{};
      p.home=d.home&&typeof d.home==='object'?{...d.home}:({map:'town',x:RPG_MAPS.town.spawn.x,y:RPG_MAPS.town.spawn.y});
      p.guildQuest=d.guildQuest&&typeof d.guildQuest==='object'
        ? {...d.guildQuest,completed:{...((d.guildQuest&&d.guildQuest.completed)||{})}}
        : {active:null,progress:0,claimed:false,completed:{}};

      p.lv=clamp(Math.floor(Number(d.lv)||p.lv||1),1,120);
      p.xp=Math.max(0,Math.floor(Number(d.xp)||p.xp||0));
      p.gold=Math.max(0,Math.floor(Number(d.gold)||p.gold||0));
      p.hp=clamp(Math.floor(Number(d.hp)||p.hp||maxHp(p)),1,maxHp(p));

      normalizePlayer(p);
    }catch(_e){}
    return p;
  };
  globalThis.parseRecoveryCode = parseRecoveryCode;

  /* -----------------------------------------------------------
     2. 전투 타겟: Tab으로 현재 맵의 몬스터를 순환 선택
     ----------------------------------------------------------- */
  if(typeof S.targetMonsterId!=='string') S.targetMonsterId='';

  function currentCombatTarget(){
    const p=S.players&&S.players[S.uid];
    if(!p) return null;
    const focus=String(S.targetMonsterId||'');
    if(focus){
      const found=(S.mons||[]).find(m=>String(m.id)===focus&&m.map===p.map&&m.hp>0);
      if(found) return found;
    }
    return null;
  }

  function selectNextTarget(){
    const p=S.players&&S.players[S.uid];
    if(!p)return;
    const list=(S.mons||[])
      .filter(m=>m.map===p.map&&m.hp>0)
      .sort((a,b)=>cheb(a,p)-cheb(b,p));
    if(!list.length){
      S.targetMonsterId='';
      return;
    }
    const idx=list.findIndex(m=>String(m.id)===String(S.targetMonsterId||''));
    const next=list[(idx+1+list.length)%list.length];
    S.targetMonsterId=String(next.id);
    playSound('sys');
    updateCombatTargetV33();
  }

  function clearInvalidTarget(){
    const t=currentCombatTarget();
    if(!t) S.targetMonsterId='';
    return t;
  }

  function ensureCombatTargetUi(){
    if($('combatTargetV33')||!$('stage'))return;
    const box=document.createElement('div');
    box.id='combatTargetV33';
    box.innerHTML=
      '<div class="targetTopV33"><div class="targetNameV33" id="combatTargetNameV33"></div><div class="targetMetaV33" id="combatTargetMetaV33"></div></div>'+
      '<div class="targetBarV33"><div class="targetFillV33" id="combatTargetFillV33"></div></div>';
    $('stage').appendChild(box);
  }

  function updateCombatTargetV33(){
    ensureCombatTargetUi();
    const box=$('combatTargetV33');
    const t=clearInvalidTarget();
    if(!box){return;}
    if(!t){
      box.classList.remove('show');
      return;
    }
    const p=S.players[S.uid],dist=cheb(t,p);
    const def=MONS[t.e]||{};
    const label=t.isBoss?(t.bossName||'던전 보스'):String(t.e||'몬스터');
    $('combatTargetNameV33').textContent=(t.isBoss?'👑 ':'')+label;
    $('combatTargetMetaV33').textContent='거리 '+dist+' · HP '+Math.max(0,Math.floor(t.hp))+'/'+Math.max(1,Math.floor(t.mx||def.hp||1));
    $('combatTargetFillV33').style.width=(Math.max(0,Math.min(1,t.hp/Math.max(1,t.mx||def.hp||1)))*100).toFixed(1)+'%';
    box.classList.add('show');
  }

  ensureCombatTargetUi();
  window.addEventListener('keydown',e=>{
    if(!S.started)return;
    const t=e.target,tag=String(t&&t.tagName||'').toUpperCase();
    if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable))return;
    if(e.key==='Tab'){
      e.preventDefault();
      e.stopPropagation();
      selectNextTarget();
    }else if(e.key==='Escape'){
      const panel=$('overlayPanel');
      if(panel&&panel.classList.contains('open'))return;
      S.targetMonsterId='';
      updateCombatTargetV33();
    }
  },true);

  /* -----------------------------------------------------------
     3. 퀘스트 추적기: 현재 의뢰를 화면에 고정 표시
     ----------------------------------------------------------- */
  function ensureQuestTrackerV33(){
    if($('questTrackerV33')||!$('stage'))return;
    const el=document.createElement('div');
    el.id='questTrackerV33';
    el.innerHTML=
      '<div class="questTrackTitleV33" id="questTrackTitleV33"></div>'+
      '<div class="questTrackTextV33" id="questTrackTextV33"></div>'+
      '<div class="questTrackBarV33"><div class="questTrackFillV33" id="questTrackFillV33"></div></div>';
    $('stage').appendChild(el);
  }

  function updateQuestTrackerV33(){
    ensureQuestTrackerV33();
    const el=$('questTrackerV33'),p=S.players&&S.players[S.uid];
    if(!el||!p){return;}
    const q=p.guildQuest,defs=window.QUEST_DEFS_V3||{};
    const d=q&&q.active?defs[q.active]:null;
    if(!d){
      el.classList.remove('show');
      return;
    }
    const prog=Math.min(d.count,Math.max(0,Number(q.progress)||0));
    $('questTrackTitleV33').textContent='📜 '+d.name+(prog>=d.count?' · 완료':'');
    $('questTrackTextV33').textContent=(d.text||'')+' · '+prog+'/'+d.count;
    $('questTrackFillV33').style.width=((prog/d.count)*100).toFixed(1)+'%';
    el.classList.add('show');
  }

  /* -----------------------------------------------------------
     4. 마지막 세션/진행 상태를 로컬에도 주기적으로 백업
     ----------------------------------------------------------- */
  if(!S._qualityAutosaveTimer){
    S._qualityAutosaveTimer=setInterval(()=>{
      try{
        if(S.started && S.players[S.uid]){
          saveLocalAccountSnapshot();
          if(typeof saveSocial==='function')saveSocial();
        }
      }catch(_e){}
    },5000);
  }

  /* -----------------------------------------------------------
     5. 원격 공격/스킬의 타겟을 호스트에서도 정확히 사용
     ----------------------------------------------------------- */
  const _hostRecvV33=hostRecv;
  hostRecv=function(c,m){
    if(m&&c&&c.uid&&(m.t==='atk'||m.t==='skill')){
      const prev=String(S.targetMonsterId||'');
      const requested=String(m.targetId||'');
      if(requested)S.targetMonsterId=requested;
      try{
        return _hostRecvV33(c,m);
      }finally{
        S.targetMonsterId=prev;
      }
    }
    return _hostRecvV33(c,m);
  };
  globalThis.hostRecv=hostRecv;

  /* -----------------------------------------------------------
     6. 몬스터가 죽거나 맵을 떠나면 타겟 자동 해제
     ----------------------------------------------------------- */
  const _drawSceneV33=drawSceneRpg;
  drawSceneRpg=function(){
    clearInvalidTarget();
    _drawSceneV33();
    updateCombatTargetV33();
    updateQuestTrackerV33();
  };
  drawScene=drawSceneRpg;
  globalThis.drawSceneRpg=drawSceneRpg;

  if(!S._qualityUiTimer){
    S._qualityUiTimer=setInterval(()=>{
      try{
        if(S.started){
          updateCombatTargetV33();
          updateQuestTrackerV33();
        }
      }catch(_e){}
    },250);
  }

  globalThis.__rpgQualityV33=true;
})();
</script>

    const blocked=isMapBlocked(map,x,y);
    let base=mapTileColor(map,x,y,css);

    ctx.fillRect(sx,sy,m.tw+1,m.th+1);

        ctx.fillRect(sx,sy,m.tw+1,m.th+1);
        ctx.fillStyle='rgba(255,255,255,.16)';
        ctx.fillRect(sx,sy,m.tw+1,Math.max(1,m.th*.08));

        ctx.fillRect(sx,sy,m.tw+1,m.th+1);

      const h=hash2(x+71,y+113)%100;

    }
  }

  drawMapTileRpg=function(map,x,y,sx,sy,m,css){
    const blocked=isMapBlocked(map,x,y);

      openPanel(info.icon+' '+info.name,'<div class="npcCard"><div class="npcCardHead"><div class="npcAvatar">'+info.icon+'</div><div><b>'+escapeHtml(info.name)+'</b><div class="socialSub">'+escapeHtml(info.role)+'</div></div></div><div class="npcSpeech">'+escapeHtml(info.text)+'</div><div class="rpgActionGrid"><button id="newNpcActionV40">'+actionLabel+'</button><button id="newNpcCloseV40">👋 닫기</button></div></div>');
      const act=$('newNpcActionV40'),close=$('newNpcCloseV40');
      if(act)act.onclick=()=>{actionFn(); if(act)act.disabled=true; log('✅ '+info.name+'에게 요청했어. 결과 메시지를 확인해줘.');};
      if(close)close.onclick=closePanel;
      return;
    }
    _showNpcDialogueV38&&_showNpcDialogueV38(id);
  };

  /* ============================================================
     3) 호스트 검증: 음식/버프/숙소 기능을 실제 게임 상태에 반영
     ============================================================ */
  const _hostRecvV38=hostRecv;
  hostRecv=function(c,m){
    if(m&&m.t==='town_service'&&c&&c.uid&&S.players[c.uid]){
      const p=S.players[c.uid],n=RPG_NPCS[String(m.npc||'')],id=String(m.npc||''),act=String(m.action||'');
      if(!n||!NEW_NPC_INFO[id]||!rpgNearNpc(p,n))return;
      const buy=(item,price)=>{if(p.gold<price){sendTo(c.uid,{t:'town_service_result',s:'💰 골드가 부족해.'});return false;}if(!addItem(p,item,1)){sendTo(c.uid,{t:'town_service_result',s:'🎒 가방 공간이 부족해.'});return false;}p.gold-=price;return true;};
      if(id==='bakerNell'&&act==='bread'&&buy('bread',ITEMS.bread.price)){sendTo(c.uid,{t:'town_service_result',s:'🍞 갓 구운 빵 1개를 샀어.'});saveLocalAccountSnapshot();return;}
      if(id==='floristMori'&&act==='tea'&&buy('flowerTea',ITEMS.flowerTea.price)){sendTo(c.uid,{t:'town_service_result',s:'🍵 허브차 1개를 샀어.'});saveLocalAccountSnapshot();return;}
      if(id==='farmerOdel'&&act==='farm'&&buy('farmRation',ITEMS.farmRation.price)){sendTo(c.uid,{t:'town_service_result',s:'🌽 농장 식량 1개를 샀어.'});saveLocalAccountSnapshot();return;}
      if(id==='bardLio'&&act==='music'){p.musicBuffUntil=Date.now()+300000;sendTo(c.uid,{t:'town_service_result',s:'🎵 음악 버프를 받았어! 5분 동안 획득 XP가 10% 증가해.'});saveLocalAccountSnapshot();return;}
      if(id==='guestkeeperIra'&&(act==='guest-rest'||act==='guest-home')){
        if(act==='guest-rest')p.hp=maxHp(p);
        p.home={map:'town',x:52,y:40};
        sendTo(c.uid,{t:'town_service_result',s:act==='guest-rest'?'🛏️ 푹 쉬었어. HP가 모두 회복됐어.':'🏠 루미나 마을이 귀환 지점으로 저장됐어.'});
        saveLocalAccountSnapshot();return;
      }
      return;
    }
    _hostRecvV38(c,m);
  };
  globalThis.hostRecv=hostRecv;

  /* 음악당 버프: 호스트의 XP 계산에만 반영 */
  if(!globalThis.__rpgMusicBuffV38){
    const _awardXpV38=awardXpRpg;
    awardXpRpg=function(p,amount){
      let a=amount;
      if(p&&Number(p.musicBuffUntil||0)>Date.now()) a=Math.ceil(Number(amount||0)*1.1);
      return _awardXpV38(p,a);
    };
    globalThis.awardXpRpg=awardXpRpg;
    globalThis.__rpgMusicBuffV38=true;
  }

  const _onClientDataV38=onClientData;
  onClientData=function(m){
    if(m&&m.t==='town_service_result'){log(String(m.s||'처리가 완료됐어.'));updateHud();saveLocalAccountSnapshot();return;}
    _onClientDataV38(m);
  };
  globalThis.onClientData=onClientData;

  /* ============================================================
     4) 미니맵을 실제 내비게이션 맵으로 교체
     ============================================================ */
  const v38Pond=(x,y)=>(x>=30&&x<=35&&y>=4&&y<=10)||(x>=91&&x<=98&&y>=43&&y<=48);
  const v38TownRoad=(x,y)=> (y>=28&&y<=41)||(x>=48&&x<=55)||(y>=17&&y<=19&&x>=18&&x<=78)||(y>=58&&y<=60&&x>=18&&x<=85)||(x>=20&&x<=22&&y>=18&&y<=35)||(x>=84&&x<=86&&y>=17&&y<=51);
  const v38Plaza=(x,y)=>x>=37&&x<=67&&y>=28&&y<=48;
  const v38Farm=(x,y)=>x>=2&&x<=17&&y>=53&&y<=69;

  function drawMinimapV38(){
    const p=S.players[S.uid],mc=$('minimap');if(!p||!mc)return;
    const map=p.map||'town',md=mapDef(map),mx=mc.getContext('2d');
    const sx=mc.width/md.w,sy=mc.height/md.h;
    mx.clearRect(0,0,mc.width,mc.height);
    mx.imageSmoothingEnabled=false;
    for(let y=0;y<md.h;y++){
      for(let x=0;x<md.w;x++){
        let col='#5c4b5e';
        if(md.kind==='interior') col=((x+y)&1)?'#cbb998':'#d8c6a5';
        else if(map==='town'){
          if(v38Pond(x,y)) col='#72abc1';
          else if(v38TownRoad(x,y)) col='#d7c499';
          else if(v38Plaza(x,y)) col='#e9d9ad';
          else if(v38Farm(x,y)) col='#c9b06f';
          else col=((x+y)&1)?'#9fc083':'#aac98c';
        }else if(map==='field') col=((x+y)&1)?'#a7c57c':'#b1cd85';
        if(isMapBlocked(map,x,y) && !v38Pond(x,y)) col=md.kind==='interior'?'#806d58':(map==='town'?'#796851':map==='field'?'#58764f':'#302735');
        mx.fillStyle=col;mx.fillRect(Math.floor(x*sx),Math.floor(y*sy),Math.ceil(sx+0.3),Math.ceil(sy+0.3));
      }
    }
    const buildings=RPG_BUILDINGS.filter(b=>b.map===map);
    buildings.forEach(b=>{
      const colors=b.interior?{fill:'#9a7656',door:'#ffe4a5'}:{fill:'#8b7861',door:'#c9b99e'};
      mx.fillStyle=colors.fill;mx.fillRect(b.x*sx,b.y*sy,Math.max(2,b.w*sx),Math.max(2,b.h*sy));
      if(b.door){mx.fillStyle=colors.door;mx.fillRect(b.door.x*sx,b.door.y*sy,Math.max(2,sx*1.3),Math.max(2,sy*1.3));}
    });
    (RPG_PORTALS[map]||[]).forEach(t=>{mx.fillStyle='#3ec8ff';mx.fillRect(t.x*sx,t.y*sy,Math.max(4,sx*2),Math.max(4,sy*2));});
    Object.values(RPG_NPCS).filter(n=>n.map===map).forEach(n=>{mx.fillStyle=['merchant','smith','healer','classmaster','guildmaster','storage','bakerNell','floristMori','bardLio','guestkeeperIra','farmerOdel'].includes(n.id)?'#f2a93b':'#f6df67';mx.fillRect(n.x*sx,n.y*sy,Math.max(2,sx*1.2),Math.max(2,sy*1.2));});
    S.mons.filter(m=>m.map===map).forEach(mon=>{mx.fillStyle=mon.isBoss?'#a23ee6':'#e05252';mx.fillRect(mon.x*sx,mon.y*sy,Math.max(2,sx*1.1),Math.max(2,sy*1.1));});
    Object.values(S.players).filter(q=>q.map===map).forEach(q=>{mx.fillStyle=q.id===S.uid?'#ffe33b':'#f0f4ff';mx.fillRect(q.x*sx,q.y*sy,Math.max(2,sx*1.5),Math.max(2,sy*1.5));});
    const px=p.x*sx+sx/2,py=p.y*sy+sy/2;mx.strokeStyle='#fff';mx.lineWidth=1.5;mx.beginPath();mx.arc(px,py,Math.max(3,sx*1.8),0,Math.PI*2);mx.stroke();
    if(S.walkTo){mx.strokeStyle='#ffe56b';mx.lineWidth=1;mx.beginPath();mx.arc(S.walkTo.x*sx+sx/2,S.walkTo.y*sy+sy/2,Math.max(2,sx*1.5),0,Math.PI*2);mx.stroke();}
    const bm=boardMetrics(),hx=Math.ceil(bm.w/(2*bm.tw)),hy=Math.ceil(bm.h/(2*bm.th));
    const vx=Math.max(0,Math.min(md.w-hx*2,p.x-hx)),vy=Math.max(0,Math.min(md.h-hy*2,p.y-hy));
    mx.strokeStyle='rgba(255,255,255,.92)';mx.lineWidth=1;mx.strokeRect(vx*sx,vy*sy,Math.min(md.w,hx*2)*sx,Math.min(md.h,hy*2)*sy);
    const leg=$('minimapLegend');if(leg)leg.innerHTML='<span>🏠 건물</span><span>🟨 NPC</span><span>🔵 이동석</span><span>🔴 몬스터</span><span>🟡 나</span>';
  }
  globalThis.drawMinimapRpgBetter=drawMinimapV38;

  /* 미니맵 크기/조작 */
  if(!$('rpgMinimapStyleV38')){
    const st=document.createElement('style');st.id='rpgMinimapStyleV38';st.textContent=`
      #minimapWrap{width:246px;padding:7px}
      #minimap{width:100%;height:auto;cursor:crosshair}
      #minimapWrap::before{content:'🗺️ 미니맵 · 클릭 이동 · 더블클릭 월드맵';display:block;font-weight:800;font-size:11px;color:var(--fg);padding:2px 3px 6px}
      @media(max-width:720px){#minimapWrap{width:190px}}
    `;document.head.appendChild(st);
  }
  const mc=$('minimap');
  if(mc&&!mc.__v38Bound){
    mc.__v38Bound=true;
    mc.title='클릭: 해당 위치로 이동 · 더블클릭: 월드맵 열기';
    const mapPoint=e=>{
      const p=S.players[S.uid];if(!p)return null;const md=mapDef(p.map||'town'),r=mc.getBoundingClientRect();
      const x=clamp(Math.floor(((e.clientX-r.left)/Math.max(1,r.width))*md.w),0,md.w-1);
      const y=clamp(Math.floor(((e.clientY-r.top)/Math.max(1,r.height))*md.h),0,md.h-1);return {x,y};
    };
    mc.addEventListener('click',e=>{const q=mapPoint(e);if(!q)return;if(isMapBlocked(S.players[S.uid].map,q.x,q.y)){log('🚧 그 위치는 이동할 수 없어.');return;}setWalkTarget(q.x,q.y);});
    mc.addEventListener('dblclick',()=>{if(typeof renderTeleportPanelRpg==='function')renderTeleportPanelRpg();else if(typeof renderTeleportPanel==='function')renderTeleportPanel();});
  }

  window.__rpgWorldCompleteV38=true;
})();
</script>

  function linesForV39(id){

  function closeV39(){const box=$('npcDialogueV39');if(box)box.classList.remove('show');activeIdV39='';pageV39=0;responseV39=null;const q=qV39();if(q)q.classList.remove('npcDialogueHiddenV39');S._npcActionContextV39=null;}
  function setResponseV39(text){responseV39=String(text||RESPONSE_DEFAULTS[activeIdV39]||'처리가 끝났어.');pageV39=99;renderV39();}
  function runActionV39(a){
    if(a.send){S._npcActionContextV39={id:activeIdV39,action:String(a.send.action||'')};sendLocalHost(a.send);return;}
    if(a.local){setResponseV39(a.local);return;}
    if(a.run){try{a.run();}catch(_e){}closeV39();return;}

  function renderV39(){
    const id=activeIdV39,n=RPG_NPCS?.[id];if(!n)return;ensureV39();hideOldV39();const box=$('npcDialogueV39');box.classList.add('show');

    if(pageV39<max-1){const b=document.createElement('button');b.textContent='💬 이야기 더 듣기';b.onclick=()=>{pageV39++;renderV39();};choices.appendChild(b);}
    if(pageV39===max-1){for(const a of (ACTIONS[id]||[])){const b=document.createElement('button');b.textContent=a.label;b.onclick=()=>runActionV39(a);choices.appendChild(b);}}
    const close=document.createElement('button');close.textContent='닫기';close.onclick=closeV39;choices.appendChild(close);

  function showV39(id){
    const p=S.players?.[S.uid],n=RPG_NPCS?.[id];
    if(!p||!n||String(p.map)!==String(n.map)||cheb(p,n)>2){log('📍 NPC에게 2칸 이내로 가까이 가줘.');return;}
    activeIdV39=id;pageV39=0;responseV39=null;S.walkTo=null;renderV39();

  globalThis.showNpcDialogueV32=showV39;globalThis.showNpcDialogueV35=showV39;
  function v39Nearest(){const p=S.players?.[S.uid];if(!p)return null;let best=null,d=999;Object.values(RPG_NPCS||{}).forEach(n=>{if(String(n.map)!==String(p.map))return;const dd=cheb(p,n);if(dd<d){d=dd;best=n;}});return d<=2?best:null;}

<script>

  function buildingKey(b){ return b ? [String(b.id||''),Math.floor(Number(b.x)||0),Math.floor(Number(b.y)||0),Math.floor(Number(b.w)||0),Math.floor(Number(b.h)||0)].join(':') : ''; }

    if(Number.isFinite(x)&&Number.isFinite(y)){
      const exact=list.find(b=>Math.floor(Number(b.x))===Math.floor(x)&&Math.floor(Number(b.y))===Math.floor(y));
      if(exact) return exact;

      {x:b.door.x+1,y:b.door.y},

        if(!Number.isFinite(out.x)||!Number.isFinite(out.y)||isMapBlocked('town',Math.floor(out.x),Math.floor(out.y))) out=town&&town.returnPos?town.returnPos:{x:1,y:1};

  function drawJobProjectileFx(){
    if(!S.started)return;

    S.jobFx=S.jobFx.filter(f=>now-f.t0<(f.life||900));

        ctx.strokeStyle=f.color||'#b8a1ff';ctx.globalAlpha*=.65;ctx.lineWidth=Math.max(2,unit*.035);ctx.beginPath();ctx.moveTo(-unit*.55,0);ctx.lineTo(-unit*.1,0);ctx.stroke();

<script>
/* ============================================================
   RPG v60 scope safety patch
   - 직업 전투/FX 블록에서 사용하는 몬스터 탐색 함수를 전역에 안전하게 노출
   - 이전 IIFE 지역 스코프에 의존하지 않도록 독립 구현
   ============================================================ */
(function installV60ScopeSafety(){
  'use strict';
  function distance(a,b){
    if(!a||!b)return Infinity;
    return Math.max(Math.abs(Number(a.x)||0-Math.abs(Number(b.x)||0),0));
  }
  function nearestRpgMonsterForV60(p, range){
    try{
      if(!p || !Array.isArray(S.mons)) return null;
      const maxRange=Math.max(0,Number(range)||0);
      const sameMap=S.mons.filter(m=>m&&String(m.map)===String(p.map)&&Number(m.hp||0)>0);
      let list=sameMap.filter(m=>Math.max(Math.abs((Number(m.x)||0)-(Number(p.x)||0)),Math.abs((Number(m.y)||0)-(Number(p.y)||0)))<=maxRange);
      const focus=String(S.targetMonsterId||'');
      if(focus){
        const locked=list.find(m=>String(m.id)===focus);
        if(locked)return locked;
      }
      list.sort((a,b)=>{
        const da=Math.max(Math.abs((Number(a.x)||0)-(Number(p.x)||0)),Math.abs((Number(a.y)||0)-(Number(p.y)||0)));
        const db=Math.max(Math.abs((Number(b.x)||0)-(Number(p.x)||0)),Math.abs((Number(b.y)||0)-(Number(p.y)||0)));
        return da-db;
      });
      return list[0]||null;
    }catch(_){ return null; }
  }
  globalThis.nearestRpgMonsterFor=nearestRpgMonsterForV60;
  if(typeof window!=='undefined')window.nearestRpgMonsterFor=nearestRpgMonsterForV60;
})();
</script>

      input.className=req.multiline?'rpgV67ModalCode':'rpgV67ModalInput';
      if(!req.multiline)input.placeholder=req.placeholder||'';
      if(req.maxLength)input.maxLength=req.maxLength;
      input.value=req.value||'';
      field.appendChild(input);
      setTimeout(()=>input.focus(),0);
    }
    const finish=(value)=>{wrap.classList.remove('open');modalBusy=false;try{req.resolve(value);}catch(_){}setTimeout(nextModal,0);};
    if(req.kind==='confirm'){
      const no=document.createElement('button');no.textContent=req.noText||'거절';no.onclick=()=>finish(false);
      const yes=document.createElement('button');yes.textContent=req.yesText||'수락';yes.onclick=()=>finish(true);yes.autofocus=true;
      actions.append(no,yes);
      setTimeout(()=>yes.focus(),0);
    }else if(req.kind==='input'){
      const cancel=document.createElement('button');cancel.textContent='취소';cancel.onclick=()=>finish(null);
      const ok=document.createElement('button');ok.textContent=req.okText||'확인';ok.onclick=()=>finish(input?input.value:null);actions.append(cancel,ok);setTimeout(()=>ok.focus(),0);
      if(input)input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!req.multiline){e.preventDefault();ok.click();}if(e.key==='Escape'){e.preventDefault();cancel.click();}});
    }else{
      const ok=document.createElement('button');ok.textContent='확인';ok.onclick=()=>finish(true);actions.append(ok);setTimeout(()=>ok.focus(),0);
    }
  }
  function gameConfirm(title,text,yesText='수락',noText='거절'){
    return new Promise(resolve=>{modalQueue.push({kind:'confirm',title,text,yesText,noText,resolve});nextModal();});
  }
  function gameInput(title,text,opts){
    opts=opts||{};
    return new Promise(resolve=>{modalQueue.push({kind:'input',title,text,placeholder:opts.placeholder||'',value:opts.value||'',maxLength:opts.maxLength||200,multiline:!!opts.multiline,okText:opts.okText||'확인',resolve});nextModal();});
  }
  function gameInfo(title,text){return new Promise(resolve=>{modalQueue.push({kind:'info',title,text,resolve});nextModal();});}
  window.rpgGameNotice=notice;window.rpgGameConfirm=gameConfirm;window.rpgGameInput=gameInput;window.rpgGameInfo=gameInfo;

  function localFriendRecord(p,fc,name,emoji){
    fc=String(fc||p?.friendCode||'').toUpperCase();
    if(!/^[A-Z0-9]{6,8}$/.test(fc))return false;
    S.friends=S.friends||{};S.friends[fc]={name:String(name||p?.name||('친구 '+fc)).slice(0,10),emoji:emoji||p?.emoji||'👤'};saveSocial();
    return true;
  }
  function friendlyName(uid, fallback){
    const p=S.players&&S.players[uid];return p?String(p.name||fallback||'플레이어'):String(fallback||'플레이어');
  }
  function showFriendRequest(m){
    const from=String(m.from||'');if(!from||from===S.uid)return;
    if(isBlockedUid(from))return;
    const fc=String(m.friendCode||'').toUpperCase();
    const nm=String(m.name||friendlyName(from,'플레이어'));
    gameConfirm('👥 친구 요청',nm+' 님이 친구 추가를 요청했어.\n수락하면 서로 친구 목록에 추가돼.', '수락','거절').then(ok=>{
      sendLocalHost({t:ok?'friend_accept':'friend_decline',from,friendCode:fc,name:nm,emoji:String(m.emoji||'👤')});
    });
  }
  function showFriendResult(m){
    const msg=String(m.s||'');
    if(m.ok&&m.friendCode){
      localFriendRecord(null,m.friendCode,m.name,m.emoji);renderSocialIfOpen();notice(msg||'⭐ 친구 추가가 완료됐어.','success','sys');
    }else notice(msg||'친구 요청 처리 결과를 확인해줘.','warn','error');
  }

  // 모든 브라우저 confirm/prompt 대신 게임 내부 UI 사용
  const oldOnClientData=onClientData;
  onClientData=function(m){
    if(m&&m.t==='friend_request'){showFriendRequest(m);return;}
    if(m&&m.t==='friend_result'){showFriendResult(m);return;}
    if(m&&m.t==='trade_request'){
      const from=String(m.from||''),nm=String(m.name||'플레이어');
      gameConfirm('🤝 거래 요청',nm+' 님이 거래를 요청했어.\n거래 창을 열고 서로 확인한 뒤 교환할 수 있어.', '수락','거절').then(ok=>{if(ok)sendLocalHost({t:'trade_accept',from});});
      return;
    }
    if(m&&m.t==='party_invite'){
      const from=String(m.from||''),nm=String(m.name||'플레이어');
      if(isBlockedUid(from))return;
      gameConfirm('👥 파티 초대',nm+' 님이 파티에 초대했어.\n수락하면 파티에 합류해.', '참가','거절').then(ok=>{if(ok)sendLocalHost({t:'party_accept',from});});
      return;
    }
    return oldOnClientData.apply(this,arguments);
  };
  globalThis.onClientData=onClientData;

  const oldOnDirectData=onDirectData;
  onDirectData=function(c,m){
    if(m&&m.t==='friend_request'){showFriendRequest(m);return;}
    if(m&&m.t==='trade_request'){
      const from=String(m.from||c?._uid||''),nm=String(m.name||friendlyName(from,'플레이어'));
      gameConfirm('🤝 거래 요청',nm+' 님이 거래를 요청했어.\n거래 요청을 수락할까?', '수락','거절').then(ok=>{if(ok)sendLocalHost({t:'trade_accept',from});});
      return;
    }
    if(m&&m.t==='party_invite'){
      const from=String(m.from||c?._uid||''),nm=String(m.name||friendlyName(from,'플레이어'));
      if(isBlockedUid(from))return;
      gameConfirm('👥 파티 초대',nm+' 님이 파티에 초대했어.\n참가할까?', '참가','거절').then(ok=>{if(ok)sendLocalHost({t:'party_accept',from});});
      return;
    }
    return oldOnDirectData.apply(this,arguments);
  };
  globalThis.onDirectData=onDirectData;

  // 친구 요청은 상대방이 수락해야만 친구 목록에 들어간다.
  const oldSendPeerOrHost=sendPeerOrHost;
  window.requestFriend=function(uid){
    uid=String(uid||'');
    const p=S.players&&S.players[uid];
    if(!p||uid===S.uid)return;
    const fc=String(p.friendCode||'').toUpperCase();
    if(!/^[A-Z0-9]{6,8}$/.test(fc)){notice('상대방의 친구 코드가 아직 준비되지 않았어.','warn','error');return;}
    if(S.friends&&S.friends[fc]){notice(p.name+' 님은 이미 친구 목록에 있어.','info');return;}
    const msg={t:'friend_request',to:uid,from:S.uid,name:S.name,emoji:S.emoji,friendCode:S.friendCode};
    let ok=false;
    const direct=S.directConns&&S.directConns[uid];
    if(direct&&direct.open){try{direct.send(msg);ok=true;}catch(_){} }
    if(!ok&&S.isHost){
      try{hostRecv({uid:S.uid,open:true,send:()=>{}},msg);ok=true;}catch(_){}
    }else if(!ok&&S.hostConn&&S.hostConn.open){try{S.hostConn.send(msg);ok=true;}catch(_){}
    }
    if(ok){notice('👥 '+p.name+' 님에게 친구 요청을 보냈어. 상대방이 수락하면 친구가 돼.','success','sys');}
    else{notice('친구 요청을 보낼 연결이 없어.','error','error');}
  };
  addFriend=window.requestFriend;
  globalThis.addFriend=window.requestFriend;

  // 친구 코드 입력도 즉시 저장하지 않고 친구 요청으로 처리한다.
  addFriendCode=function(){
    const input=$('friendCodeInput');
    const fc=String(input&&input.value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
    if(!/^[A-Z0-9]{6,8}$/.test(fc)){notice('친구 코드는 6~8자리 영문/숫자야.','warn','error');return;}
    if(fc===String(S.friendCode||'').toUpperCase()){notice('자기 자신에게는 친구 요청을 보낼 수 없어.','warn','error');return;}
    const p=findPlayerByFriendCode(fc);
    if(!p){notice('현재 같은 방에 있는 온라인 플레이어의 친구 코드만 요청할 수 있어.','warn','error');return;}
    window.requestFriend(p.id);if(input)input.value='';
  };
  globalThis.addFriendCode=addFriendCode;

  // 신고 사유 입력도 브라우저 prompt가 아닌 게임 내부 창에서 받는다.
  reportPlayer=function(uid){
    const p=S.players&&S.players[uid];if(!p||uid===S.uid)return;
    gameInput('🚩 플레이어 신고','신고 사유를 입력해줘.\n욕설 / 괴롭힘 / 스팸 / 사칭 / 기타',{
      placeholder:'신고 사유',maxLength:80,okText:'신고 보내기'
    }).then(reason=>{
      const r=String(reason||'').trim().slice(0,80);if(!r)return;
      sendLocalHost({t:'report',to:uid,reason:r});
      notice('🚩 신고를 접수했어.','success','sys');
    });
  };
  globalThis.reportPlayer=reportPlayer;

  // 복구 코드 복사 실패 시에도 브라우저 prompt 대신 게임 내부 창 사용.
  copyRecoveryCode=function(){
    const code=issueRecoveryCode(false);
    navigator.clipboard?.writeText(code).then(()=>notice('📋 복구 코드를 클립보드에 복사했어.','success','sys')).catch(()=>{
      gameInput('🗝️ 복구 코드','자동 복사가 막혀서 아래 코드를 직접 복사해줘.',{value:code,maxLength:12000,multiline:true,okText:'닫기'});
    });
  };
  globalThis.copyRecoveryCode=copyRecoveryCode;

  // 서버 권위: 친구 요청/수락/거절 처리
  const oldHostRecv=hostRecv;
  hostRecv=function(c,m){
    if(m&&c&&c.uid&&m.t==='friend_request'){
      const to=String(m.to||'');
      if(!to||to===c.uid||!S.players[to]||!S.players[c.uid]||isBlockedUid(to))return;
      S.friendRequests=S.friendRequests||{};
      if(S.friendRequests[to]&&Date.now()-S.friendRequests[to].ts<30000)return;
      const req={from:c.uid,ts:Date.now(),friendCode:String(S.players[c.uid].friendCode||'').toUpperCase(),name:S.players[c.uid].name,emoji:S.players[c.uid].emoji};
      S.friendRequests[to]=req;
      const packet={t:'friend_request',from:c.uid,name:S.players[c.uid].name,emoji:S.players[c.uid].emoji,friendCode:S.players[c.uid].friendCode};
      if(to===S.uid) onClientData(packet); else sendTo(to,packet);
      return;
    }
    if(m&&c&&c.uid&&(m.t==='friend_accept'||m.t==='friend_decline')){
      const from=String(m.from||'');const inv=S.friendRequests&&S.friendRequests[c.uid];
      if(!inv||inv.from!==from||Date.now()-inv.ts>30000||!S.players[from]){if(S.friendRequests)delete S.friendRequests[c.uid];return;}
      delete S.friendRequests[c.uid];
      const target=S.players[c.uid],sender=S.players[from];
      if(m.t==='friend_decline'){
        const deny={t:'friend_result',ok:false,s:'👥 '+target.name+' 님이 친구 요청을 거절했어.'};
        if(from===S.uid) onClientData(deny); else sendTo(from,deny);
        return;
      }
      const toSender={t:'friend_result',ok:true,friendCode:target.friendCode,name:target.name,emoji:target.emoji,s:'⭐ '+target.name+' 님과 친구가 됐어.'};
      const toTarget={t:'friend_result',ok:true,friendCode:sender.friendCode,name:sender.name,emoji:sender.emoji,s:'⭐ '+sender.name+' 님과 친구가 됐어.'};
      if(from===S.uid) onClientData(toSender); else sendTo(from,toSender);
      if(c.uid===S.uid) onClientData(toTarget); else sendTo(c.uid,toTarget);
      return;
    }
    return oldHostRecv.apply(this,arguments);
  };
  globalThis.hostRecv=hostRecv;

  // 장비 직업 제한을 최종적으로 적용하고, 실패 시 경고음 + 게임내 알림.
  const oldEquipHostRecv=hostRecv;
  hostRecv=function(c,m){
    if(m&&m.t==='equip_item'&&c&&c.uid&&S.players[c.uid]){
      const p=S.players[c.uid],id=String(m.id||''),d=ITEMS[id];
      if(d&&d.type==='weapon'&&typeof window.__rpgV57CanEquip==='function'&&!window.__rpgV57CanEquip(p,id)){
        const jobName=(p.job&&p.job.label)||'현재 직업';
        sendTo(c.uid,{t:'npc_result',s:'🚫 '+d.icon+' '+d.name+'은(는) 현재 직업에서 사용할 수 없는 무기야.\n이 직업에서는 장착할 수 없어. 거래하거나 다른 플레이어에게 넘기거나 상점에서 판매해 줘.'});
        return;
      }
    }
    return oldEquipHostRecv.apply(this,arguments);
  };
  globalThis.hostRecv=hostRecv;

  // 위의 hostRecv를 거친 npc_result도 게임 내부 알림으로 강조한다.
  const oldClientForResult=onClientData;
  onClientData=function(m){
    if(m&&m.t==='npc_result'){
      const msg=String(m.s||'');
      if(/사용할 수 없는|장착할 수 없어|현재 직업/.test(msg)){
        notice(msg,'warn','error');
        return;
      }
    }
    return oldClientForResult.apply(this,arguments);
  };
  globalThis.onClientData=onClientData;

  // friend_request는 relay에서도 허용돼야 한다.
  try{DIRECT_REQUEST_TYPES.add('friend_request');}catch(_){ }

  // 마지막으로 친구 버튼이 다시 렌더링되어도 request 함수가 연결되도록 한 번 갱신.
  try{renderSocialIfOpen();}catch(_){ }
  try{ensureUi();}catch(_){ }
})();
</script>

    .tutorialV49Card{padding:9px 10px;grid-template-columns:36px 1fr;gap:8px}.tutorialV49Icon{width:36px;height:36px;font-size:20px}

    #rpgTutorialMarkerV49{z-index:30}
  }
