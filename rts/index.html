<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미니지 - RTS</title>
  <style>
    :root { --bg: #f8f9fa; --text: #333; --canvas-bg: #05070a; --border: #e9ecef; --btn-bg: #fff; }
    [data-theme="dark"] { --bg: #0d1117; --text: #c9d1d9; --canvas-bg: #020305; --border: #30363d; --btn-bg: #21262d; }
    [data-theme="beige"] { --bg: #f5ebe0; --text: #4e3d30; --canvas-bg: #14100c; --border: #ddcbbb; --btn-bg: #eddfd0; }
    body { background-color: var(--bg) !important; color: var(--text) !important; text-align: center; font-family: sans-serif; padding-top: 15px; margin: 0; transition: 0.3s; overflow-x: hidden; }
    button { background-color: var(--btn-bg) !important; color: var(--text) !important; border: 1px solid var(--border) !important; padding: 8px 16px; font-size: 0.9rem; border-radius: 8px; cursor: pointer; margin: 4px; font-weight: bold; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #rts-panel { font-size: 1.2rem; font-weight: bold; color: #fcc419; margin-bottom: 4px; }
    .build-bar { margin: 8px 0; }
    .active-mode { border: 2px solid #4dadf7 !important; }
    #game-canvas { background: var(--canvas-bg); border: 2px solid var(--border); border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); cursor: crosshair; }
    .help-text { font-size: 0.85rem; opacity: 0.8; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>⚔️ 우주 전쟁: 미니 RTS 완전판</h1>
  
  <div id="rts-panel">
    💎 광물: <span id="res-min">50</span> | 🌋 가스: <span id="res-gas">0</span> | 🌊 웨이브: <span id="wave-num">1</span> | 🏰 아군HQ: <span id="hp-player">500</span> | 🏯 적군HQ: <span id="hp-enemy">500</span>
  </div>

  <div class="build-bar">
    <button id="btn-barracks" onclick="toggleBuildBarracks()">🏭 전술 병영 (💎40)</button>
    <button id="btn-scv" onclick="produceSCV()">🛸 SCV (💎20)</button>
    <button id="btn-fighter" onclick="produceFighter()" disabled>🚀 전투기 (💎30)</button>
    <button id="btn-cruiser" onclick="produceCruiser()" disabled>🛩️ 중순양함 (💎50/🌋15)</button>
  </div>

  <canvas id="game-canvas" width="600" height="440"></canvas>
  <div class="help-text">방향키 또는 WASD로 지도 스크롤 | 병영 건설 선택 후 캔버스 땅을 클릭하여 배치</div>

  <script>
    const savedTheme = localStorage.getItem('minig-theme');
    if (savedTheme && savedTheme !== 'white') { document.documentElement.setAttribute('data-theme', savedTheme); }

    // World & Viewport Configuration
    const WORLD_W = 1500;
    const WORLD_H = 1100;
    const VIEW_W = 600;
    const VIEW_H = 440;

    let camX = 0;
    let camY = WORLD_H - VIEW_H; // Initial camera focused at bottom-left

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    // Game Resources & Tech State
    let resources = { min: 50, gas: 0, enemyMin: 50, enemyGas: 0 };
    let wave = 1;
    let waveTimer = 0;
    let buildMode = null; // 'barracks' or null
    let hasBarracks = false;
    let gameOver = false;

    // Entities Arrays
    let entities = [];
    let bullets = [];
    let particles = [];
    let keys = {};

    // Web Audio Synthesizer
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioCtx();
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'produce') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'laser') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'explode') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(30, now + 0.25);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch (e) {}
    }

    // Input Listeners
    window.addEventListener('keydown', (e) => { keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    canvas.addEventListener('click', (e) => {
      initAudio();
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left + camX;
      const clickY = e.clientY - rect.top + camY;

      if (buildMode === 'barracks') {
        if (resources.min >= 40) {
          resources.min -= 40;
          spawnEntity('barracks', 'player', clickX, clickY);
          hasBarracks = true;
          playSound('produce');
          buildMode = null;
          document.getElementById('btn-barracks').classList.remove('active-mode');
          updateUI();
        }
      }
    });

    function toggleBuildBarracks() {
      initAudio();
      if (resources.min < 40) return;
      if (buildMode === 'barracks') {
        buildMode = null;
        document.getElementById('btn-barracks').classList.remove('active-mode');
      } else {
        buildMode = 'barracks';
        document.getElementById('btn-barracks').classList.add('active-mode');
      }
    }

    function produceSCV() {
      initAudio();
      if (resources.min >= 20) {
        const playerHQ = entities.find(e => e.type === 'hq' && e.faction === 'player');
        if (playerHQ) {
          resources.min -= 20;
          spawnEntity('scv', 'player', playerHQ.x + (Math.random() * 60 - 30), playerHQ.y + (Math.random() * 60 - 30));
          playSound('produce');
          updateUI();
        }
      }
    }

    function produceFighter() {
      initAudio();
      if (!hasBarracks || resources.min < 30) return;
      const playerHQ = entities.find(e => e.type === 'hq' && e.faction === 'player');
      if (playerHQ) {
        resources.min -= 30;
        spawnEntity('fighter', 'player', playerHQ.x + (Math.random() * 60 - 30), playerHQ.y + (Math.random() * 60 - 30));
        playSound('produce');
        updateUI();
      }
    }

    function produceCruiser() {
      initAudio();
      if (!hasBarracks || resources.min < 50 || resources.gas < 15) return;
      const playerHQ = entities.find(e => e.type === 'hq' && e.faction === 'player');
      if (playerHQ) {
        resources.min -= 50;
        resources.gas -= 15;
        spawnEntity('cruiser', 'player', playerHQ.x + (Math.random() * 60 - 30), playerHQ.y + (Math.random() * 60 - 30));
        playSound('produce');
        updateUI();
      }
    }

    function updateUI() {
      document.getElementById('res-min').innerText = resources.min;
      document.getElementById('res-gas').innerText = resources.gas;
      document.getElementById('wave-num').innerText = wave;

      const playerHQ = entities.find(e => e.type === 'hq' && e.faction === 'player');
      const enemyHQ = entities.find(e => e.type === 'hq' && e.faction === 'enemy');

      document.getElementById('hp-player').innerText = playerHQ ? Math.max(0, playerHQ.hp) : 0;
      document.getElementById('hp-enemy').innerText = enemyHQ ? Math.max(0, enemyHQ.hp) : 0;

      document.getElementById('btn-fighter').disabled = !hasBarracks || resources.min < 30;
      document.getElementById('btn-cruiser').disabled = !hasBarracks || resources.min < 50 || resources.gas < 15;
    }

    // Entity Factory
    function spawnEntity(type, faction, x, y) {
      let e = {
        id: Math.random().toString(),
        type: type,
        faction: faction,
        x: x,
        y: y,
        hp: 100,
        maxHp: 100,
        speed: 0,
        radius: 15,
        emoji: '🛸',
        cooldown: 0,
        cooldownMax: 40,
        attackRange: 0,
        cargo: null,
        target: null
      };

      if (type === 'hq') {
        e.hp = e.maxHp = 500;
        e.radius = 32;
        e.emoji = (faction === 'player') ? '🏰' : '🏯';
      } else if (type === 'barracks') {
        e.hp = e.maxHp = 300;
        e.radius = 26;
        e.emoji = '🏭';
      } else if (type === 'resource_min') {
        e.radius = 20;
        e.emoji = '💎';
        e.resType = 'min';
      } else if (type === 'resource_gas') {
        e.radius = 20;
        e.emoji = '🌋';
        e.resType = 'gas';
      } else if (type === 'scv') {
        e.hp = e.maxHp = 60;
        e.speed = 2.0;
        e.radius = 12;
        e.emoji = '🛸';
      } else if (type === 'fighter') {
        e.hp = e.maxHp = 100;
        e.speed = 2.4;
        e.radius = 14;
        e.emoji = '🚀';
        e.attackRange = 130;
        e.cooldownMax = 35;
      } else if (type === 'cruiser') {
        e.hp = e.maxHp = 250;
        e.speed = 1.1;
        e.radius = 20;
        e.emoji = '🛩️';
        e.attackRange = 170;
        e.cooldownMax = 65;
      } else if (type === 'boss') {
        e.hp = e.maxHp = 380;
        e.speed = 0.9;
        e.radius = 22;
        e.emoji = '🪐';
        e.attackRange = 190;
        e.cooldownMax = 50;
      }

      entities.push(e);
      return e;
    }

    // Game Initialization
    function initGame() {
      entities = [];
      bullets = [];
      particles = [];
      resources = { min: 50, gas: 0, enemyMin: 50, enemyGas: 0 };
      wave = 1;
      waveTimer = 0;
      hasBarracks = false;
      gameOver = false;

      // Player Base Setup (Bottom-Left)
      spawnEntity('hq', 'player', 160, 940);
      spawnEntity('resource_min', 'neutral', 90, 1010);
      spawnEntity('resource_gas', 'neutral', 260, 1010);
      for (let i = 0; i < 4; i++) {
        spawnEntity('scv', 'player', 150 + (i * 20), 880);
      }

      // Enemy Base Setup (Top-Right)
      spawnEntity('hq', 'enemy', 1340, 160);
      spawnEntity('resource_min', 'neutral', 1410, 90);
      spawnEntity('resource_gas', 'neutral', 1240, 90);
      for (let i = 0; i < 4; i++) {
        spawnEntity('scv', 'enemy', 1300 + (i * 20), 220);
      }

      updateUI();
    }

    // Camera Handler
    function updateCamera() {
      const speed = 8;
      if (keys['ArrowLeft'] || keys['KeyA']) camX -= speed;
      if (keys['ArrowRight'] || keys['KeyD']) camX += speed;
      if (keys['ArrowUp'] || keys['KeyW']) camY -= speed;
      if (keys['ArrowDown'] || keys['KeyS']) camY += speed;

      camX = Math.max(0, Math.min(WORLD_W - VIEW_W, camX));
      camY = Math.max(0, Math.min(WORLD_H - VIEW_H, camY));
    }

    // AI Logic & Wave Management
    let aiTimer = 0;
    function updateAI() {
      aiTimer++;
      if (aiTimer % 60 !== 0) return;

      const enemyHQ = entities.find(e => e.type === 'hq' && e.faction === 'enemy');
      if (!enemyHQ) return;

      const enemyBarracks = entities.find(e => e.type === 'barracks' && e.faction === 'enemy');
      const enemySCVs = entities.filter(e => e.type === 'scv' && e.faction === 'enemy');

      // AI Construction Logic
      if (!enemyBarracks && resources.enemyMin >= 40) {
        resources.enemyMin -= 40;
        spawnEntity('barracks', 'enemy', enemyHQ.x - 80, enemyHQ.y + 60);
      } else if (enemySCVs.length < 4 && resources.enemyMin >= 20) {
        resources.enemyMin -= 20;
        spawnEntity('scv', 'enemy', enemyHQ.x - 30, enemyHQ.y + 30);
      } else if (enemyBarracks) {
        if (wave < 6) {
          // Low waves: produce Fighters only
          if (resources.enemyMin >= 30) {
            resources.enemyMin -= 30;
            spawnEntity('fighter', 'enemy', enemyBarracks.x + (Math.random() * 40 - 20), enemyBarracks.y + 40);
          }
        } else {
          // Wave >= 6: Produce Heavy Units
          if (resources.enemyMin >= 50 && resources.enemyGas >= 15) {
            resources.enemyMin -= 50;
            resources.enemyGas -= 15;
            spawnEntity('cruiser', 'enemy', enemyBarracks.x + (Math.random() * 40 - 20), enemyBarracks.y + 40);
          } else if (resources.enemyMin >= 40 && Math.random() < 0.4) {
            resources.enemyMin -= 40;
            spawnEntity('boss', 'enemy', enemyBarracks.x + (Math.random() * 40 - 20), enemyBarracks.y + 40);
          } else if (resources.enemyMin >= 30) {
            resources.enemyMin -= 30;
            spawnEntity('fighter', 'enemy', enemyBarracks.x + (Math.random() * 40 - 20), enemyBarracks.y + 40);
          }
        }
      }
    }

    // Update Entities Engine
    function updateEntities() {
      waveTimer++;
      if (waveTimer % 1000 === 0) {
        wave++;
        updateUI();
      }

      for (let i = entities.length - 1; i >= 0; i--) {
        let e = entities[i];
        if (e.hp <= 0) {
          // Spawn explosion particles on death
          for (let p = 0; p < 5; p++) {
            particles.push({
              x: e.x,
              y: e.y,
              vx: (Math.random() - 0.5) * 4,
              vy: (Math.random() - 0.5) * 4,
              life: 20,
              text: '💥'
            });
          }
          playSound('explode');
          entities.splice(i, 1);
          updateUI();

          // Victory / Loss Check
          if (e.type === 'hq') {
            gameOver = true;
            setTimeout(() => {
              if (e.faction === 'enemy') {
                alert("🎉 우주 대승리! 적 사령부를 완전히 파괴했습니다!");
              } else {
                alert("💥 아군 사령부가 파괴되었습니다! 게임 오버!");
              }
              initGame();
            }, 100);
          }
          continue;
        }

        // SCV Resource Gathering Cycle
        if (e.type === 'scv') {
          const hq = entities.find(h => h.type === 'hq' && h.faction === e.faction);
          if (!e.cargo) {
            // Find Resource Node
            let nodes = entities.filter(n => n.type === 'resource_min' || n.type === 'resource_gas');
            let closestNode = null;
            let minDist = 999999;
            nodes.forEach(n => {
              let d = Math.hypot(n.x - e.x, n.y - e.y);
              if (d < minDist) { minDist = d; closestNode = n; }
            });

            if (closestNode) {
              if (minDist > 15) {
                let angle = Math.atan2(closestNode.y - e.y, closestNode.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;
              } else {
                e.cargo = closestNode.resType;
              }
            }
          } else {
            // Return to HQ
            if (hq) {
              let dist = Math.hypot(hq.x - e.x, hq.y - e.y);
              if (dist > 25) {
                let angle = Math.atan2(hq.y - e.y, hq.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;
              } else {
                if (e.faction === 'player') {
                  if (e.cargo === 'min') resources.min += 10;
                  if (e.cargo === 'gas') resources.gas += 5;
                } else {
                  if (e.cargo === 'min') resources.enemyMin += 10;
                  if (e.cargo === 'gas') resources.enemyGas += 5;
                }
                e.cargo = null;
                updateUI();
              }
            }
          }
        }

        // Tactical Attack Units Logic
        if (e.type === 'fighter' || e.type === 'cruiser' || e.type === 'boss') {
          if (e.cooldown > 0) e.cooldown--;

          // Find target
          let targets = entities.filter(t => t.faction !== 'neutral' && t.faction !== e.faction);
          let closestTarget = null;
          let minDist = 999999;
          targets.forEach(t => {
            let d = Math.hypot(t.x - e.x, t.y - e.y);
            if (d < minDist) { minDist = d; closestTarget = t; }
          });

          if (closestTarget) {
            if (minDist > e.attackRange) {
              let angle = Math.atan2(closestTarget.y - e.y, closestTarget.x - e.x);
              e.x += Math.cos(angle) * e.speed;
              e.y += Math.sin(angle) * e.speed;
            } else if (e.cooldown <= 0) {
              // Fire Weapon
              bullets.push({
                x: e.x,
                y: e.y,
                targetX: closestTarget.x,
                targetY: closestTarget.y,
                targetId: closestTarget.id,
                faction: e.faction,
                speed: 7,
                damage: e.type === 'cruiser' ? 30 : (e.type === 'boss' ? 25 : 12),
                splash: (e.type === 'cruiser' || e.type === 'boss')
              });
              playSound('laser');
              e.cooldown = e.cooldownMax;
            }
          }
        }
      }

      // Update Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        let angle = Math.atan2(b.targetY - b.y, b.targetX - b.x);
        b.x += Math.cos(angle) * b.speed;
        b.y += Math.sin(angle) * b.speed;

        if (Math.hypot(b.targetX - b.x, b.targetY - b.y) < 8) {
          // Impact Event
          if (b.splash) {
            playSound('explode');
            particles.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 12, text: '💥' });
            entities.forEach(t => {
              if (t.faction !== 'neutral' && t.faction !== b.faction) {
                if (Math.hypot(t.x - b.x, t.y - b.y) <= 45) {
                  t.hp -= b.damage;
                }
              }
            });
          } else {
            let target = entities.find(e => e.id === b.targetId);
            if (target) {
              target.hp -= b.damage;
            }
          }
          bullets.splice(i, 1);
          updateUI();
        }
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    // Main Canvas Render Engine
    function render() {
      ctx.clearRect(0, 0, VIEW_W, VIEW_H);

      ctx.save();
      ctx.translate(-camX, -camY);

      // Render Grid Lines & Stars
      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 1;
      for (let x = 0; x < WORLD_W; x += 100) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_H); ctx.stroke();
      }
      for (let y = 0; y < WORLD_H; y += 100) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_W, y); ctx.stroke();
      }

      // Render Bullets
      bullets.forEach(b => {
        ctx.fillStyle = b.faction === 'player' ? '#4dadf7' : '#ff6b6b';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.splash ? 4 : 3, 0, Math.PI * 2);
        ctx.fill();
      });

      // Render Entities & Emojis
      entities.forEach(e => {
        ctx.font = `${e.radius * 1.5}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(e.emoji, e.x, e.y);

        // Draw Cargo for SCV
        if (e.cargo) {
          ctx.font = '12px sans-serif';
          ctx.fillText('📦', e.x + 10, e.y - 10);
        }

        // Draw HP Bars for Units/Buildings
        if (e.type !== 'resource_min' && e.type !== 'resource_gas') {
          const barW = e.radius * 1.8;
          const barH = 4;
          const barX = e.x - barW / 2;
          const barY = e.y - e.radius - 8;
          const hpRatio = Math.max(0, e.hp / e.maxHp);

          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(barX, barY, barW, barH);
          ctx.fillStyle = e.faction === 'player' ? '#51cf66' : '#ff6b6b';
          ctx.fillRect(barX, barY, barW * hpRatio, barH);
        }
      });

      // Render Explosions / Particles
      particles.forEach(p => {
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.text, p.x, p.y);
      });

      ctx.restore();

      // Render Minimap Overlay (Fixed Screen Space)
      const miniW = 110;
      const miniH = 80;
      const miniX = 10;
      const miniY = VIEW_H - miniH - 10;

      ctx.fillStyle = 'rgba(5, 7, 10, 0.85)';
      ctx.fillRect(miniX, miniY, miniW, miniH);
      ctx.strokeStyle = '#30363d';
      ctx.lineWidth = 1;
      ctx.strokeRect(miniX, miniY, miniW, miniH);

      const scaleX = miniW / WORLD_W;
      const scaleY = miniH / WORLD_H;

      // Radar Dots
      entities.forEach(e => {
        if (e.type === 'resource_min' || e.type === 'resource_gas') {
          ctx.fillStyle = '#fcc419';
        } else {
          ctx.fillStyle = e.faction === 'player' ? '#51cf66' : '#ff6b6b';
        }
        ctx.fillRect(miniX + e.x * scaleX, miniY + e.y * scaleY, 2, 2);
      });

      // Camera Box Guide
      ctx.strokeStyle = '#4dadf7';
      ctx.lineWidth = 1;
      ctx.strokeRect(
        miniX + camX * scaleX,
        miniY + camY * scaleY,
        VIEW_W * scaleX,
        VIEW_H * scaleY
      );
    }

    // Main Loop
    function gameLoop() {
      if (!gameOver) {
        updateCamera();
        updateAI();
        updateEntities();
      }
      render();
      requestAnimationFrame(gameLoop);
    }

    // Start Game Engine
    initGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
