    `;document.head.appendChild(st);
  }
  function invCategory(d){if(d.type==='weapon')return '⚔️ 무기';if(d.type==='armor')return '🛡️ 방어구';if(d.type==='consumable')return '🧪 소비 아이템';return '📦 재료 / 기타';}
  function invCardV63(p,id,n){
    const d=ITEMS[id];if(!d||n<=0)return '';
    const equipped=p.equip&&((d.type==='weapon'&&p.equip.weapon===id)||(d.type==='armor'&&p.equip.armor===id));
    const stat=d.type==='weapon'?'공격 +'+(d.atk||0):d.type==='armor'?'방어 +'+(d.def||0):d.type==='consumable'?'회복 +'+(d.heal||0):'재료';
    const action=d.type==='consumable'?'<button data-inv63="use" data-id="'+escapeHtml(id)+'">사용</button>':(d.type==='weapon'||d.type==='armor')?(equipped?'<button data-inv63="unequip" data-slot="'+(d.type==='weapon'?'weapon':'armor')+'">해제</button>':'<button data-inv63="equip" data-id="'+escapeHtml(id)+'">장착</button>'):'<button disabled>재료</button>';
    return '<div class="inv63Card'+(equipped?' equipped':'')+'"><div class="inv63Head"><span class="inv63Icon">'+d.icon+'</span><span class="inv63Count">x'+n+'/'+(d.max||99)+'</span></div><div class="inv63Name">'+escapeHtml(d.name)+'</div><div class="inv63Meta">'+stat+(equipped?' · 장착 중':'')+'</div><div class="inv63Actions">'+action+'<button data-inv63="drop" data-id="'+escapeHtml(id)+'">버리기</button></div></div>';
  }
  renderInventory=function(){
    const p=S.players[S.uid];if(!p)return;normalizePlayer(p);
    const w=p.equip&&ITEMS[p.equip.weapon]?ITEMS[p.equip.weapon]:null;
    const a=p.equip&&ITEMS[p.equip.armor]?ITEMS[p.equip.armor]:null;
    const used=typeof invUsed==='function'?invUsed(p):Object.values(p.inv||{}).filter(n=>n>0).length;
    const entries=Object.entries(p.inv||{}).filter(([id,n])=>ITEMS[id]&&n>0);
    const cats=['weapon','armor','consumable','material'];
    const labels={weapon:'⚔️ 무기',armor:'🛡️ 방어구',consumable:'🧪 소비 아이템',material:'📦 재료 / 기타'};
    let html='<div class="inv63">';
    html+='<div class="inv63Top"><div><div class="inv63Title">🎒 캐릭터 인벤토리</div><div class="inv63Sub">아이템은 종류별로 정리되며 각 스택 제한을 따로 적용해.</div></div><div class="inv63Slots">'+used+' / '+(globalThis.BAG_SLOTS||24)+'칸</div></div>';
    html+='<div class="inv63Stats"><div class="inv63Stat"><b>❤️ '+p.hp+'/'+maxHp(p)+'</b>체력</div><div class="inv63Stat"><b>⚔️ '+effectiveAtkRpg(p)+'</b>공격</div><div class="inv63Stat"><b>🛡️ '+effectiveDefRpg(p)+'</b>방어</div><div class="inv63Stat"><b>💰 '+p.gold+'</b>골드</div></div>';
    html+='<div class="section"><div class="sectionTitle">장착 중인 장비</div><div class="inv63Equip">';
    [['weapon','무기','⚔️',w],['armor','방어구','🛡️',a]].forEach(([slot,label,empty,d])=>{html+='<div class="inv63Slot"><div class="inv63SlotIcon">'+(d?d.icon:empty)+'</div><div><b>'+escapeHtml(d?d.name:'장비 없음')+'</b><small>'+label+(d?' · '+(slot==='weapon'?'공격 +'+(d.atk||0):'방어 +'+(d.def||0)):'')+'</small></div>'+(d?'<button data-inv63="unequip" data-slot="'+slot+'">해제</button>':'')+'</div>';});
    html+='</div></div>';
    if(!entries.length){html+='<div class="inv63Empty">가방이 비어 있어.</div>';}else{
      for(const type of cats){const group=entries.filter(([id])=>ITEMS[id].type===type);if(!group.length)continue;html+='<div><div class="inv63GroupTitle"><span>'+labels[type]+'</span><span>'+group.reduce((s,[,n])=>s+n,0)+'개</span></div><div class="inv63Grid">';for(const [id,n] of group)html+=invCardV63(p,id,n);html+='</div></div>';}
    }
    html+='</div>';openPanel('🎒 인벤토리',html);
    $('panelBody').querySelectorAll('[data-inv63]').forEach(btn=>btn.onclick=()=>{const a=btn.dataset.inv63,id=btn.dataset.id,slot=btn.dataset.slot;if(a==='use')sendLocalHost({t:'use_item',id});else if(a==='equip')sendLocalHost({t:'equip_item',id});else if(a==='unequip')sendLocalHost({t:'unequip_item',slot});else if(a==='drop'){const cnt=itemCount(p,id);sendLocalHost({t:'discard_item',id,count:cnt>1?1:1});}setTimeout(renderInventory,100);});
  };

  /* 아이템/장비 변경 시 HUD와 최신 UI 유지 */
  const oldUpdateHudV63=updateHud;
  updateHud=function(){oldUpdateHudV63();try{if($('overlayPanel').classList.contains('open')&&$('panelTitle').textContent.includes('인벤토리'))renderInventory();}catch(_){}};

  /* 최종 진행 곡선을 UI에도 바로 반영 */
  try{globalThis.xpNeedRpg=xpNeedRpg;}catch(_){ }
  try{globalThis.effectiveAtkRpg=effectiveAtkRpg;globalThis.effectiveDefRpg=effectiveDefRpg;}catch(_){ }
  window.__rpgV63FinalPolish=true;
})();
</script>

<!-- V65 REAL RANGED PROJECTILES VISUAL FIX -->
<script>
(function installRangedCombatV65(){
  'use strict';
  if(typeof window==='undefined'||typeof S==='undefined')return;
  if(window.__rpgV65RealRanged)return;

  const REAL_PROJECTILES=S.realProjectiles||[];
  S.realProjectiles=REAL_PROJECTILES;
  const clientProjectiles=[];
  const rangedStyle={
    '🐉':{icon:'🔥',color:'#ff5a1f',trail:'#ffd166',speed:6.4,size:.28},
    '🦇':{icon:'🩸',color:'#ff3f70',trail:'#ff9ab2',speed:7.2,size:.24},
    '🦂':{icon:'☠️',color:'#a855f7',trail:'#e9d5ff',speed:6.8,size:.24},
    '👿':{icon:'💜',color:'#8b5cf6',trail:'#ddd6fe',speed:5.8,size:.30}
  };

  function styleFor(mon){
    return rangedStyle[String(mon&&mon.e||'')]||{icon:'◆',color:'#ffe066',trail:'#fff4b3',speed:6.5,size:.24};
  }

  function addClientProjectile(ev){
    if(!ev)return;
    const id=String(ev.projectileId||('rpv65-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)));
    for(const old of clientProjectiles) if(old.id===id)return;
    const sx=Number(ev.fromX),sy=Number(ev.fromY),ex=Number(ev.x),ey=Number(ev.y);
    if(!Number.isFinite(sx)||!Number.isFinite(sy)||!Number.isFinite(ex)||!Number.isFinite(ey))return;
    const dx=ex-sx,dy=ey-sy,dist=Math.max(.35,Math.hypot(dx,dy));
    const speed=Math.max(3.5,Number(ev.speed)||6.5);
    const life=Math.max(380,Math.min(1800,dist/speed*1000));
    clientProjectiles.push({
      id,monsterId:String(ev.monsterId||''),targetId:String(ev.targetId||''),map:String(ev.map||''),
      sx,sy,ex,ey,icon:String(ev.icon||'◆'),color:String(ev.c||'#ffe066'),
      trail:String(ev.trail||ev.c||'#fff4b3'),size:Math.max(.22,Number(ev.size)||.24),
      t0:performance.now(),life,speed
    });
    while(clientProjectiles.length>80)clientProjectiles.shift();
  }

  function removeClientProjectile(id){
    if(!id)return;
    for(let i=clientProjectiles.length-1;i>=0;i--)if(clientProjectiles[i].id===String(id))clientProjectiles.splice(i,1);
  }

  function launchRealProjectile(mon,target,mult=1,skill=false){
    if(!mon||!target||target.hp<=0||mon.map!==target.map)return false;
    const d=MONS[mon.e]||{};
    const st=styleFor(mon);
    const now=Date.now();
    const dist=Math.max(.35,Math.hypot(target.x-mon.x,target.y-mon.y));
    const speed=Math.max(3.5,st.speed*(skill?.92:1));
    const life=Math.max(380,Math.min(1800,dist/speed*1000));
    const base=Math.max(1,Math.floor((d.dmg||1)*mult));
    const id='rp'+Math.random().toString(36).slice(2,10)+now;
    const proj={
      id,monsterId:String(mon.id),targetId:String(target.id),map:String(mon.map),
      sx:Number(mon.x),sy:Number(mon.y),x:Number(target.x),y:Number(target.y),
      speed,damage:base,created:now,last:now,life,
      icon:skill&&d.skill==='breath'?'🔥':skill&&d.skill==='roar'?'💜':st.icon,
      color:st.color,trail:st.trail,size:st.size+(skill?.05:0),skill:!!skill
    };
    REAL_PROJECTILES.push(proj);
    while(REAL_PROJECTILES.length>80)REAL_PROJECTILES.shift();

    const ev={k:'ranged_launch',projectileId:id,monsterId:String(mon.id),targetId:String(target.id),
      fromX:proj.sx,fromY:proj.sy,x:proj.x,y:proj.y,map:proj.map,icon:proj.icon,c:proj.color,
      trail:proj.trail,size:proj.size,speed:proj.speed,life:proj.life};

    // 호스트/피격 대상은 즉시 로컬 표시.
    addClientProjectile(ev);
    try{broadcastEvent(ev);}catch(_){ }
    return true;
  }

  function renderRealProjectiles(){
    if(!S.started||!clientProjectiles.length)return;
    const me=S.players[S.uid];
    const m=boardMetrics();
    const now=performance.now();
    for(let i=clientProjectiles.length-1;i>=0;i--){
      const f=clientProjectiles[i];
      const age=now-f.t0;
      if(age>f.life+120){clientProjectiles.splice(i,1);continue;}
      if(me&&f.map&&String(me.map)!==String(f.map))continue;

      const progress=clamp(age/f.life,0,1);
      const ease=progress<.5?2*progress*progress:1-Math.pow(-2*progress+2,2)/2;
      const dx=f.ex-f.sx,dy=f.ey-f.sy;
      const len=Math.max(.001,Math.hypot(dx,dy));
      const nx=dx/len,ny=dy/len;
      const wx=f.sx+dx*ease,wy=f.sy+dy*ease;
      const q=worldToScreen(wx,wy,m);
      const cx=q.x+m.tw/2,cy=q.y+m.th/2;
      const tx=worldToScreen(f.sx,f.sy,m),tail=worldToScreen(wx-nx*.75,wy-ny*.75,m);
      const txc=tx.x+m.tw/2,tyc=tx.y+m.th/2;
      const tailcX=tail.x+m.tw/2,tailcY=tail.y+m.th/2;

      ctx.save();
      ctx.globalCompositeOperation='source-over';
      ctx.globalAlpha=age>f.life ? Math.max(0,(f.life+120-age)/120) : 1;

      // 긴 광선 꼬리
      const grad=ctx.createLinearGradient(tailcX,tailcY,cx,cy);
      grad.addColorStop(0,'rgba(255,255,255,0)');
      grad.addColorStop(.45,f.trail);
      grad.addColorStop(1,f.color);
      ctx.strokeStyle=grad;
      ctx.shadowColor=f.color;
      ctx.shadowBlur=18;
      ctx.lineWidth=Math.max(3,m.unit*.11);
      ctx.beginPath();ctx.moveTo(tailcX,tailcY);ctx.lineTo(cx,cy);ctx.stroke();

      // 밝은 중심점
      ctx.fillStyle='#ffffff';
      ctx.beginPath();ctx.arc(cx,cy,Math.max(3,m.unit*.09),0,Math.PI*2);ctx.fill();

      // 실제 이모지 투사체
      const angle=Math.atan2(dy,dx);
      ctx.translate(cx,cy);ctx.rotate(angle);
      ctx.shadowColor=f.color;ctx.shadowBlur=24;
      ctx.font='900 '+clamp(m.unit*f.size,20,38)+'px "Segoe UI Emoji","Apple Color Emoji",sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(f.icon,0,0);
      ctx.restore();
    }
  }

  function updateRealProjectiles(){
    if(!S.isHost||!REAL_PROJECTILES.length)return;
    const now=Date.now();
    for(let i=REAL_PROJECTILES.length-1;i>=0;i--){
      const q=REAL_PROJECTILES[i];
      const target=S.players[q.targetId];
      const mon=S.mons.find(m=>String(m.id)===q.monsterId);
      if(!target||target.hp<=0||target.map!==q.map||!mon){
        try{broadcastEvent({k:'ranged_hit',projectileId:q.id,map:q.map,x:q.x,y:q.y,miss:true});}catch(_){ }
        REAL_PROJECTILES.splice(i,1);continue;
      }
      const dt=Math.min(.2,Math.max(.01,(now-q.last)/1000));q.last=now;
      const dx=target.x-q.x,dy=target.y-q.y,dist=Math.hypot(dx,dy);
      const step=q.speed*dt;
      if(dist<=Math.max(.2,step)){
        q.x=target.x;q.y=target.y;
        const dmg=Math.max(1,q.damage-Math.floor(effectiveDefRpg(target)*.45));
        target.hp=Math.max(0,target.hp-dmg);
        broadcastEvent({k:'ranged_hit',projectileId:q.id,map:q.map,x:q.x,y:q.y,dmg,targetId:target.id,icon:q.icon,c:q.color});
        broadcastEvent({k:'hurt',id:target.id,dmg});
        broadcastEvent({k:'monster_fx',x:q.x,y:q.y,s:q.skill?'💥':'✦',c:q.color,life:q.skill?620:420});
        if(target.hp<=0)monsterDefeatPlayer(target);
        REAL_PROJECTILES.splice(i,1);continue;
      }
      q.x+=dx/dist*step;q.y+=dy/dist*step;
      if(now-q.created>q.life+450){
        broadcastEvent({k:'ranged_hit',projectileId:q.id,map:q.map,x:q.x,y:q.y,miss:true});
        REAL_PROJECTILES.splice(i,1);
      }
    }
  }

  const oldBasic=monsterBasicAttack;
  monsterBasicAttack=function(mon,target,now,mult=1){
    const d=MONS[mon&&mon.e];
    if(mon&&target&&d&&d.ai==='ranged'){
      if(now-(mon.lastAtk||0)<1200)return false;
      mon.lastAtk=now;mon.attackCount=(mon.attackCount||0)+1;mon.state='attack';
      return launchRealProjectile(mon,target,mult,false);
    }
    return oldBasic.apply(this,arguments);
  };
  globalThis.monsterBasicAttack=monsterBasicAttack;

  const oldSpecial=monsterSpecial;
  monsterSpecial=function(mon,target,now){
    const d=MONS[mon&&mon.e];
    if(mon&&target&&d&&d.ai==='ranged'){
      if(!d.skill||now<(mon.skillReadyAt||0)||target.hp<=0)return false;
      mon.state='telegraph';mon.telegraphUntil=now+360;
      mon.skillReadyAt=now+3600;mon.attackCount=0;
      try{broadcastEvent({k:'monster_fx',x:mon.x,y:mon.y,s:d.skill==='breath'?'🔥':'✨',c:'#ff9d55',life:520});}catch(_){ }
      return launchRealProjectile(mon,target,d.skill==='breath'?1.22:1.08,true);
    }
    return oldSpecial.apply(this,arguments);
  };
  globalThis.monsterSpecial=monsterSpecial;

  const oldTick=hostTick;
  hostTick=function(){const out=oldTick.apply(this,arguments);try{updateRealProjectiles();}catch(_){}return out;};
  globalThis.hostTick=hostTick;

  // 핵심: window.handleEvent가 아니라 실제 전역 함수 바인딩 자체를 후킹한다.
  try{
    const oldHandle=handleEvent;
    handleEvent=function(ev){
      try{
        if(ev&&ev.k==='ranged_launch')addClientProjectile(ev);
        else if(ev&&ev.k==='ranged_hit'&&ev.projectileId)removeClientProjectile(ev.projectileId);
      }catch(_){}
      return oldHandle.apply(this,arguments);
    };
    globalThis.handleEvent=handleEvent;
  }catch(_){
    const oldWindowHandle=window.handleEvent;
    if(typeof oldWindowHandle==='function'){
      window.handleEvent=function(ev){
        if(ev&&ev.k==='ranged_launch')addClientProjectile(ev);
        else if(ev&&ev.k==='ranged_hit')removeClientProjectile(ev.projectileId);
        return oldWindowHandle.apply(this,arguments);
      };
    }
  }

  const oldDraw=drawSceneRpg;
  drawSceneRpg=function(){
    oldDraw.apply(this,arguments);
    try{renderRealProjectiles();}catch(_){ }
  };
  globalThis.drawSceneRpg=drawSceneRpg;
  drawScene=drawSceneRpg;

  window.__rpgV65RealRanged=true;
})();
</script>

<!-- RPG v68: final equipment authority + novice feedback + QoL -->
<script>
(function installRpgV68FinalQoL(){
  'use strict';
  if(globalThis.__RPG_V68_FINAL_QOL__) return;
  globalThis.__RPG_V68_FINAL_QOL__=true;

  try{
    const st=document.createElement('style');
    st.id='rpgV68EquipStyle';
    st.textContent='.rpgV68BlockedEquip{opacity:.8;border-color:var(--warn,#e3a63a)!important}.rpgV68BlockedEquip::after{content:" 🚫"}.inv63Card[title]{cursor:help}';
    document.head.appendChild(st);
  }catch(_){}

  const canEquip=globalThis.__rpgV57CanEquip || function(p,id){
    const d=ITEMS&&ITEMS[id];
    if(!d) return false;
    if(d.type!=='weapon') return d.type==='armor';
    return false;
  };

  function jobNameOf(p){
    try{
      const j=jobData(p);
      return String(j&&j.name||p&&p.job&&p.job.name||'현재 직업');
    }catch(_){return String(p&&p.job&&p.job.name||'현재 직업');}
  }

  function blockedWeaponText(p,d){
    const job=jobNameOf(p);
    return '🚫 '+d.icon+' '+d.name+'\n'+job+'에서는 사용할 수 없는 무기입니다. 장착할 수 없어요. 거래하거나 다른 플레이어에게 넘기거나 상점에서 판매해 주세요.';
  }

  // 마지막 장비 권한 검사: 파일 아래쪽의 오래된 hostRecv가 다시 덮어써도 여기서 차단.
  const previousHostRecv=hostRecv;
  hostRecv=function(c,m){
    if(m&&m.t==='equip_item'&&c&&c.uid&&S.players&&S.players[c.uid]){
      const p=S.players[c.uid];
      const id=String(m.id||'');
      const d=ITEMS&&ITEMS[id];
      if(d&&d.type==='weapon'&&!canEquip(p,id)){
        sendTo(c.uid,{t:'npc_result',s:blockedWeaponText(p,d),restrictedWeapon:true,weaponId:id,jobName:jobNameOf(p)});
        return;
      }
    }
    return previousHostRecv.apply(this,arguments);
  };
  globalThis.hostRecv=hostRecv;
  try{globalThis.hostRecv=hostRecv;}catch(_){ }

  // 잘못된 장비는 로드/직업 변경 이후에도 즉시 해제되도록 마지막 정규화 검사.
  function sanitizeEquippedWeapons(){
    try{
      Object.values(S.players||{}).forEach(p=>{
        const id=p&&p.equip&&p.equip.weapon;
        if(id&&ITEMS[id]&&ITEMS[id].type==='weapon'&&!canEquip(p,id)) p.equip.weapon=null;
      });
    }catch(_){ }
  }
  sanitizeEquippedWeapons();

  // 게임 내부 경고 + 경고음. 기존 알림 체인보다 마지막에 설치해서 반드시 실행되게 한다.
  const previousClientData=onClientData;
  onClientData=function(m){
    if(m&&m.t==='npc_result'&&m.restrictedWeapon){
      const msg=String(m.s||'현재 직업에서는 이 무기를 사용할 수 없어.');
      try{rpgGameNotice(msg,'warn','error');}catch(_){try{notice(msg,'warn','error');}catch(_){}}
      try{playSound('error');}catch(_){ }
      try{log(msg);}catch(_){ }
      return;
    }
    return previousClientData.apply(this,arguments);
  };
  globalThis.onClientData=onClientData;

  // 인벤토리에서 제한 무기를 눈에 띄게 표시하고, 장착 시도 자체는 가능하게 둔다.

    if(hint){
      hint.textContent=rooms.length
        ? '✅ 계정 복구 완료 · 마지막 방 없음 · 일반 공개 세션도 없음 · 아래 공개 방 목록에서 원하는 방을 선택하거나 새 방을 만들어 접속해 줘.'
        : '✅ 계정 복구 완료 · 마지막 방 없음 · 현재 공개 세션 없음 · 「방 만들기」로 새 방을 만들 수 있어.';
    }
  }

  function resumeRecoveredSessionV70(session){
    if(!session||!session.code){
      const rooms=liveRoomsV70();
      const publicRoom=preferredPublicV70(rooms,'');
      if(publicRoom){
        lobbyMsg('🔎 마지막 방 정보가 없어 일반 공개 세션으로 접속하는 중…');
        joinRoom(publicRoom.code,publicRoom.gen,publicRoom.peerId);
      }else{
        showRecoveryLobbyChoiceV70('✅ 계정은 복구됐어.');
      }
      return;
    }

    S.recoveryResumePending=true;
    const lastCode=String(session.code||'').toUpperCase();
    const tryFind=()=>findLatestRoomForRecovery(session);
    const first=tryFind();
    if(first){
      S.recoveryResumePending=false;
      lobbyMsg('🔎 마지막 방을 찾았어. 마지막 공개 세션으로 접속하는 중…');
      joinRoom(first.code,first.gen,first.peerId);
      return;
    }

    lobbyMsg('🔎 마지막 방 '+lastCode+' 확인 중…');
    let tries=0;
    const timer=setInterval(()=>{
      tries++;
      if(!S.recoveryResumePending){clearInterval(timer);return;}
      const last=tryFind();
      if(last){
        clearInterval(timer);
        S.recoveryResumePending=false;
        lobbyMsg('🔎 마지막 방을 찾았어. 마지막 공개 세션으로 접속하는 중…');
        joinRoom(last.code,last.gen,last.peerId);
        return;
      }
      if(tries>=10){
        clearInterval(timer);
        S.recoveryResumePending=false;
        const rooms=liveRoomsV70();
        const publicRoom=preferredPublicV70(rooms,lastCode);
        if(publicRoom){
          lobbyMsg('📡 마지막 방은 종료됐어. 일반 공개 세션으로 접속하는 중…');
          joinRoom(publicRoom.code,publicRoom.gen,publicRoom.peerId);
          const hint=$('recoverySessionHint');
          if(hint)hint.textContent='✅ 계정 복구 완료 · 마지막 방은 종료됨 · 일반 공개 세션으로 전환 중…';
        }else{
          showRecoveryLobbyChoiceV70('📡 마지막 방은 종료됐고 일반 공개 세션도 없어.');
        }
      }
    },500);
  }

  globalThis.resumeRecoveredSession=resumeRecoveredSessionV70;
  resumeRecoveredSession=resumeRecoveredSessionV70;

  // 복구 후 안내 문구도 실제 동작 순서와 맞춘다.
  try{
    const hint=$('recoverySessionHint');
    if(hint && !S.recoverySession) hint.textContent='복구 코드를 입력하면 계정 데이터를 복원한 뒤, 마지막 방 → 일반 공개 세션 → 방 선택/생성 순서로 접속을 도와줄게.';
  }catch(_e){}

  globalThis.__rpgV70RecoverySessionFlow=true;
})();
</script>

<script id="rpg-v71-live-entry-refresh">
(function(){
  'use strict';
  if(globalThis.__rpgV71EntryRefreshInstalled) return;
  globalThis.__rpgV71EntryRefreshInstalled=true;

  const oldInitDirectoryV71 = (typeof initDirectory==='function') ? initDirectory : null;
  let refreshBusy=false;
  let lastRefreshAt=0;

  function resetDirectoryViewV71(){
    try{ S.rooms={}; }catch(_e){}
    try{ if(typeof renderRooms==='function') renderRooms(); }catch(_e){}
  }

  if(oldInitDirectoryV71){
    initDirectory=function(){
      resetDirectoryViewV71();
      try{
        if(S.mq){
          try{S.mq.removeAllListeners?.();}catch(_e){}
          try{S.mq.end?.(true);}catch(_e){}
        }
      }catch(_e){}
      S.mq=null;
      S.directoryReady=false;
      S.directorySubscribed=false;
      S.directoryLastError='';
      return oldInitDirectoryV71();
    };
  }

  function refreshEntryStateV71(force){
    if(refreshBusy) return;
    if(S.started && !$('lobby')?.hidden) return;
    const now=Date.now();
    if(!force && now-lastRefreshAt<5000) return;
    refreshBusy=true;
    lastRefreshAt=now;
    try{ readProfile(); }catch(_e){}
    resetDirectoryViewV71();
    try{ if(typeof lobbyMsg==='function') lobbyMsg('📡 최신 공개 방 목록을 불러오는 중…'); }catch(_e){}
    try{
      if(typeof initDirectory==='function') initDirectory();
      setTimeout(()=>{
        try{renderRooms();}catch(_e){}
        try{
          if(S.mq?.connected && S.directorySubscribed && typeof lobbyMsg==='function') lobbyMsg('✅ 최신 공개 방 목록을 불러왔어.');
        }catch(_e){}
      },700);
    }catch(_e){}
    setTimeout(()=>{refreshBusy=false;},1200);
  }

  // 최초 페이지 표시와 BFCache 복귀 모두 최신 목록을 다시 읽는다.
  window.addEventListener('pageshow',function(e){
    setTimeout(()=>refreshEntryStateV71(!!e.persisted),120);
  },{passive:true});

  // 다른 탭에서 계정/방 상태가 바뀐 뒤 돌아왔을 때도 갱신한다.
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible') setTimeout(()=>refreshEntryStateV71(false),120);
  },{passive:true});

  // 브라우저가 일반 새로고침 없이 같은 문서를 다시 표시하는 경우를 보정한다.
  setTimeout(()=>refreshEntryStateV71(true),350);
})();
</script>


<!-- RPG v88: 친구/파티 요청 호스트 권위화 + 거래 제안 실시간 표시 -->
<style id="rpgV88SocialTradeStyle">
  .tradeLiveBadge{display:inline-flex;align-items:center;gap:5px;margin-left:6px;padding:2px 7px;border:1px solid var(--line);border-radius:999px;font-size:10px;color:var(--sub);background:var(--bg)}

  @media(max-width:520px){.tradeSummaryV88{grid-template-columns:1fr}}
</style>
<script>
(function installRpgV88SocialTradeFix(){
  'use strict';
  if(typeof window==='undefined'||typeof S==='undefined')return;

  /* ---------------------------------------------------------
     1) 친구/파티 초대는 직접 P2P가 아니라 항상 호스트를 거친다.
        그래야 호스트가 요청 상태를 기억하고 수락/거절을 검증할 수 있다.
     --------------------------------------------------------- */
  try{
    if(typeof DIRECT_REQUEST_TYPES!=='undefined'){
      DIRECT_REQUEST_TYPES.delete('friend_request');
      DIRECT_REQUEST_TYPES.delete('party_invite');
    }
  }catch(_e){}

  function sendHostAuthoritativeRequest(uid,msg){
    const target=String(uid||'');
    if(!target||target===S.uid||!msg||typeof msg!=='object')return false;
    try{
      if(S.isHost){
        hostRecv({uid:S.uid,open:true,send:()=>{}},msg);
        return true;
      }
      if(S.hostConn&&S.hostConn.open){
        S.hostConn.send(msg);
        return true;
      }
    }catch(_e){}
    return false;
  }

  function requestFriendV88(uid){
    uid=String(uid||'');
    const p=S.players&&S.players[uid];
    if(!p||uid===S.uid)return;
    const fc=String(p.friendCode||'').toUpperCase();
    if(!/^[A-Z0-9]{6,8}$/.test(fc)){
      window.rpgGameNotice?.('친구 추가','상대방의 친구 코드가 아직 준비되지 않았어.','warn');
      return;
    }
    if(S.friends&&S.friends[fc]){
      window.rpgGameNotice?.('친구 추가',p.name+' 님은 이미 친구 목록에 있어.','info');
      return;
    }
    const msg={t:'friend_request',to:uid,from:S.uid,name:S.name,emoji:S.emoji,friendCode:S.friendCode};
    if(sendHostAuthoritativeRequest(uid,msg)){
      window.rpgGameNotice?.('친구 요청','👥 '+p.name+' 님에게 친구 요청을 보냈어. 상대방이 수락하면 친구가 돼.','success');
    }else{
      window.rpgGameNotice?.('친구 요청','현재 방장과 연결되어 있지 않아서 요청을 보낼 수 없어.','warn');
    }
  }
  window.requestFriend=requestFriendV88;
  addFriend=requestFriendV88;
  globalThis.addFriend=requestFriendV88;

  function partyInviteV88(uid){
    uid=String(uid||'');
    const p=S.players&&S.players[uid];
    if(!p||uid===S.uid)return;
    const pt=partyForPlayer(S.uid);
    if(pt&&pt.leader!==S.uid){
      window.rpgGameNotice?.('파티','현재 파티장은 너가 아니야.','warn');
      return;
    }
    if(pt&&pt.members.length>=4){
      window.rpgGameNotice?.('파티','파티가 이미 4명으로 가득 찼어.','warn');
      return;
    }
    if(partyForPlayer(uid)){
      window.rpgGameNotice?.('파티',p.name+' 님은 이미 다른 파티에 있어.','warn');
      return;
    }
    const msg={t:'party_invite',to:uid,from:S.uid,name:S.name,emoji:S.emoji};
    if(sendHostAuthoritativeRequest(uid,msg)){
      window.rpgGameNotice?.('파티 초대','👥 '+p.name+' 님에게 파티 초대를 보냈어.','success');
    }else{
      window.rpgGameNotice?.('파티 초대','현재 방장과 연결되어 있지 않아서 초대를 보낼 수 없어.','warn');
    }
  }
  partyInvite=partyInviteV88;
  globalThis.partyInvite=partyInviteV88;

  /* ---------------------------------------------------------
     2) 거래 상태가 들어오면 거래창을 항상 실시간 갱신한다.
     --------------------------------------------------------- */
  renderTradeFromEvent=function(){
    const t=tradeForPlayerClient(S.uid);
    if(!t){return;}
    try{openTradePanel();}catch(_e){}
  };
  globalThis.renderTradeFromEvent=renderTradeFromEvent;

  /* 거래창 최종 렌더러: 내 제안/상대 제안을 명확히 분리하고,
     상대가 보낸 아이템과 골드를 항상 보여준다. */
  openTradePanel=function(){
    const p=S.players[S.uid],t=tradeForPlayerClient(S.uid);
    if(!p)return;
    if(!t){
      let html='<div class="section"><div class="sectionTitle">거래할 플레이어</div>';
      Object.values(S.players).filter(x=>x.id!==S.uid).forEach(x=>{
        html+='<div class="tradeTarget"><span>'+escapeHtml(x.emoji+' '+x.name+' · Lv.'+x.lv)+'</span><button data-trade="'+escapeHtml(x.id)+'">요청</button></div>';
      });
      html+='</div>';
      openPanel('🤝 거래',html);
      $('panelBody').querySelectorAll('[data-trade]').forEach(b=>b.onclick=()=>requestTrade(b.dataset.trade));
      return;
    }

    const mine=t.a===S.uid?t.ai:t.bi;
    const other=t.a===S.uid?t.bi:t.ai;
    const mg=t.a===S.uid?t.ag:t.bg;
    const og=t.a===S.uid?t.bg:t.ag;
    const otherId=t.a===S.uid?t.b:t.a;
    const otherP=S.players[otherId];
    if(!otherP){return;}

    const renderItemLines=(obj)=>{
      const entries=Object.entries(obj||{}).filter(([,n])=>Number(n)>0);
      if(!entries.length)return '<div class="empty">없음</div>';
      return entries.map(([id,n])=>{
        const d=ITEMS[id];
        return d?'<div class="tradeSummaryRowV88"><span>'+escapeHtml(d.icon+' '+d.name)+'</span><b>x'+Math.max(0,Math.floor(Number(n)||0))+'</b></div>':'';
      }).join('')||'<div class="empty">없음</div>';
    };

    let html='<div class="section"><div class="sectionTitle">거래 상대</div><div class="tradeOffer live">'+escapeHtml(otherP.emoji+' '+otherP.name)+' <span class="tradeLiveBadge">실시간 동기화</span></div></div>';
    html+='<div class="tradeSummaryV88">';
    html+='<div class="tradeSummaryBoxV88"><b>📦 내가 주는 것</b>'+renderItemLines(mine)+'<div class="tradeSummaryRowV88"><span>💰 골드</span><b>'+mg+'</b></div></div>';
    html+='<div class="tradeSummaryBoxV88"><b>🎁 상대가 주는 것</b>'+renderItemLines(other)+'<div class="tradeSummaryRowV88"><span>💰 골드</span><b>'+og+'</b></div></div>';
    html+='</div>';

    html+='<div class="section"><div class="sectionTitle">내 제안 · 아이템을 클릭해서 수량 변경</div><div class="panelGrid">';
    Object.entries(p.inv||{}).forEach(([id,n])=>{
      const d=ITEMS[id];if(!d)return;
      html+='<button class="itemBtn" data-item="'+escapeHtml(id)+'"><strong>'+escapeHtml(d.icon)+'</strong><span>'+escapeHtml(d.name)+'</span><small>x'+(mine[id]||0)+'</small></button>';
    });
    html+='</div><div class="tradeLine">💰 골드 <input id="tradeGold" type="number" min="0" max="'+Math.max(0,p.gold)+'" value="'+Math.max(0,Math.floor(Number(mg)||0))+'"></div></div>';

    html+='<div class="tradeActions"><button id="tradeSend">제안 갱신</button><button id="tradeReady">'+((t.a===S.uid?t.ar:t.br)?'확정 취소':'✅ 확정')+'</button><button id="tradeCancel">취소</button></div>';
    html+='<div class="npcHint">상대방 제안은 서버에서 실시간으로 갱신돼. 한쪽이 제안을 바꾸면 다시 확정해야 해.</div>';

    openPanel('🤝 거래',html);
    let selected={...mine};
    $('panelBody').querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.item,cur=selected[id]||0,max=itemCount(p,id);
      selected[id]=cur>=max?0:cur+1;
      b.querySelector('small').textContent='x'+selected[id];
      if(!selected[id])delete selected[id];
    });
    $('tradeSend').onclick=()=>sendLocalHost({t:'trade_offer',items:selected,gold:Math.max(0,Math.floor(Number($('tradeGold').value)||0))});
    $('tradeReady').onclick=()=>sendLocalHost({t:'trade_ready',ready:!(t.a===S.uid?t.ar:t.br)});
    $('tradeCancel').onclick=()=>sendLocalHost({t:'trade_cancel'});
  };
  globalThis.openTradePanel=openTradePanel;

  /* trade_state가 직접/호스트 어느 경로로 와도 바로 최신 화면으로 반영 */
  const _onClientDataV88=onClientData;
  onClientData=function(m){
    if(m&&m.t==='trade_state'){
      if(m.trade&& (m.trade.a===S.uid||m.trade.b===S.uid)){
        S.activeTrades=[m.trade];
        try{openTradePanel();}catch(_e){}
      }
      return;
    }
    if(m&&m.t==='trade_end'){
      S.activeTrades=[];
      closePanel();
      log(m.reason||'거래 종료');
      return;
    }
    return _onClientDataV88.apply(this,arguments);
  };
  globalThis.onClientData=onClientData;

  /* 거래 요청도 가능하면 호스트 상태를 만들도록 일관되게 보낸다. */
  requestTrade=function(uid){
    uid=String(uid||'');
    if(!uid||uid===S.uid||!S.players[uid])return;
    const msg={t:'trade_request',to:uid,from:S.uid,name:S.name,emoji:S.emoji};
    if(sendHostAuthoritativeRequest(uid,msg)) notice('🤝 '+S.players[uid].name+' 님에게 거래 요청을 보냈어.','success','sys');
    else notice('거래 요청을 보낼 방장 연결이 없어.','warn','error');
  };
  globalThis.requestTrade=requestTrade;

  try{renderSocialIfOpen();}catch(_e){}
})();
</script>

<!-- RPG v90: 시장터 + 결투장 + 불안정한 워프석 / stray-text cleanup -->
<script id="rpgV90MarketArenaWarp">
(function installRpgV90(){
  'use strict';
  if(typeof RPG_MAPS==='undefined'||typeof RPG_PORTALS==='undefined'||typeof ITEMS==='undefined'||typeof S==='undefined')return;

  /* ==========================================================
     1) 새 지역
     ========================================================== */
  Object.assign(RPG_MAPS,{
    market:{id:'market',name:'시장터',meta:'상시 공개 장터 · 플레이어 간 거래',w:84,h:56,bg:'#cbb98e',kind:'town',minLv:1,spawn:{x:8,y:28}},
    arena:{id:'arena',name:'결투장',meta:'2~4명 · 2팀 결투',w:64,h:44,bg:'#4f596a',kind:'town',minLv:1,spawn:{x:32,y:22}}
  });

  const addPortal=(map,p)=>{
    RPG_PORTALS[map]=Array.isArray(RPG_PORTALS[map])?RPG_PORTALS[map]:[];
    if(!RPG_PORTALS[map].some(x=>x.id===p.id))RPG_PORTALS[map].push(p);
  };
  const townPortal=RPG_PORTALS.town&&RPG_PORTALS.town.find(x=>x.id==='town_core');
  if(townPortal){
    townPortal.dest=Array.from(new Set([...(townPortal.dest||[]),'market','arena']));
  }else addPortal('town',{id:'town_market_gate',map:'town',x:28,y:20,name:'시장터·결투장 이동석',icon:'🌀',desc:'시장터와 결투장으로 이동',dest:['market','arena']});
  addPortal('market',{id:'market_gate',map:'market',x:8,y:28,name:'시장터 출구 이동석',icon:'🌀',desc:'루미나 마을로 귀환',dest:['town','arena']});
  addPortal('arena',{id:'arena_gate',map:'arena',x:5,y:22,name:'결투장 출구 이동석',icon:'🌀',desc:'시장터와 루미나 마을로 귀환',dest:['town','market']});

  /* 불안정한 워프석: 어디서든 M으로 사용할 수 있는 1회용 워프 */
  Object.assign(ITEMS,{
    unstableWarpStone:{id:'unstableWarpStone',name:'불안정한 워프석',icon:'🌀',type:'consumable',max:5,price:180,warpStone:true}
  });
  globalThis.ITEMS=ITEMS;
  S.marketListings=S.marketListings&&typeof S.marketListings==='object'?S.marketListings:{};
  S.marketPayouts=S.marketPayouts&&typeof S.marketPayouts==='object'?S.marketPayouts:{};
  S.arenaState=S.arenaState&&typeof S.arenaState==='object'?S.arenaState:{players:{},started:false,winner:null,round:0,updatedAt:0};

  /* ==========================================================
     2) 지역 렌더링 / 충돌 / 미니맵
     ========================================================== */
  const _mapColorV90=mapTileColor;
  mapTileColor=function(map,x,y,css){
    if(map==='market')return ((x+y)%2)?'#d7c69d':'#cdb98b';
    if(map==='arena')return ((x+y)%2)?'#5b6678':'#515c6d';
    return _mapColorV90(map,x,y,css);
  };
  const _blockedV90=isMapBlocked;
  isMapBlocked=function(map,x,y){
    const md=RPG_MAPS[map];
    if(map==='market'||map==='arena'){
      if(!md||x<0||y<0||x>=md.w||y>=md.h)return true;
      if(portalAt(map,x,y))return false;
      if(x===0||y===0||x===md.w-1||y===md.h-1)return true;
      if(map==='market'){
        /* 시장 가판대/중앙 통로 */
        if(y>=10&&y<=15&&(x%9)<3)return true;
      }else{
        /* 결투장 외곽 안전벽 + 중앙 장애물 */
        if((x===20||x===21||x===42||x===43)&&y>=8&&y<=35)return true;
        if(y===10||y===33){if(x<8||x>55)return true;}
      }
      return false;
    }
    return _blockedV90(map,x,y);
  };
  globalThis.isMapBlocked=isMapBlocked;
  isBlocked=isMapBlocked;

  const _drawTileV90=drawMapTileRpg;
  drawMapTileRpg=function(map,x,y,sx,sy,m,css){
    _drawTileV90(map,x,y,sx,sy,m,css);

  function marketVisible(){return S.players[S.uid]&&S.players[S.uid].map==='market';}

  function marketCanAdd(p,id,n){
    const def=ITEMS[id],cur=itemCount(p,id); if(!def||n<=0)return false;

  }
  function marketListHost(uid,msg){
    const p=S.players[uid],id=String(msg.id||''),def=ITEMS[id],n=Math.floor(Number(msg.count)||0),price=Math.floor(Number(msg.price)||0);
    if(!p||p.map!=='market'||!def||n<1||n>99||price<1||price>999999)return;
    if(itemCount(p,id)<n||p.equip.weapon===id||p.equip.armor===id)return;
    if(!removeItem(p,id,n))return;
    const listingId='mkt-'+(S.marketSeq=(Number(S.marketSeq)||0)+1);
    S.marketListings[listingId]={id:listingId,seller:uid,sellerFc:String(p.friendCode||''),sellerName:String(p.name||'모험가').slice(0,10),item:id,count:n,price,ts:Date.now()};
    sendTo(uid,{t:'market_notice',s:'📦 '+def.icon+' '+def.name+' x'+n+'을 '+price+'골드에 시장터에 등록했어.'});
    broadcastEvent({k:'log',s:'🏪 '+p.name+' 님이 시장터에 물품을 등록했습니다.'});
    marketPush();
  }
  function marketBuyHost(uid,msg){
    const buyer=S.players[uid],listing=S.marketListings[String(msg.listing)||''];
    if(!buyer||buyer.map!=='market'||!listing||listing.seller===uid)return;
    const def=ITEMS[listing.item];
    if(!def){delete S.marketListings[listing.id];marketPush();return;}
    if(buyer.gold<listing.price){sendTo(uid,{t:'market_notice',s:'💰 골드가 부족해.'});return;}
    if(!marketCanAdd(buyer,listing.item,listing.count)){sendTo(uid,{t:'market_notice',s:'🎒 가방 공간 또는 스택 한도가 부족해.'});return;}
    if(!addItem(buyer,listing.item,listing.count)){sendTo(uid,{t:'market_notice',s:'🎒 가방에 물품을 넣을 수 없어.'});return;}
    buyer.gold-=listing.price;
    delete S.marketListings[listing.id];
    const seller=S.players[listing.seller];
    if(seller){seller.gold+=listing.price;sendTo(seller.id,{t:'market_notice',s:'💰 시장터 판매 완료! '+def.icon+' '+def.name+' x'+listing.count+' · +'+listing.price+' 골드'});}
    else if(listing.sellerFc){S.marketPayouts[listing.sellerFc]=(Number(S.marketPayouts[listing.sellerFc])||0)+listing.price;}
    sendTo(uid,{t:'market_notice',s:'🛒 구매 완료! '+def.icon+' '+def.name+' x'+listing.count+'을 '+listing.price+'골드에 구매했어.'});
    broadcastEvent({k:'log',s:'🛒 '+buyer.name+' 님이 시장터 물품을 구매했습니다.'});
    marketPush();
  }

  function arenaPublicState(){

  function arenaReset(){S.arenaState={players:{},started:false,winner:null,round:(Number(S.arenaState.round)||0)+1,updatedAt:Date.now()};arenaSendState();}
  function arenaJoinHost(uid){
    const p=S.players[uid];if(!p||p.map!=='arena')return;
    if(S.arenaState.players[uid])return arenaSendState();
    const ids=arenaLiveIds();if(ids.length>=4){sendTo(uid,{t:'arena_notice',s:'⚔️ 결투장은 최대 4명까지야.'});return;}
    const a=ids.filter(id=>S.arenaState.players[id].team==='A').length,b=ids.filter(id=>S.arenaState.players[id].team==='B').length;
    const team=a<=b?'A':'B';
    S.arenaState.players[uid]={team,hp:100,max:100,alive:true,name:p.name,emoji:p.emoji};
    if(ids.length+1>=2&&['A','B'].every(t=>Object.values(S.arenaState.players).some(x=>x.team===t)))S.arenaState.started=true;
    S.arenaState.winner=null;S.arenaState.updatedAt=Date.now();arenaSendState();
  }
  function arenaLeaveHost(uid){if(S.arenaState.players[uid]){delete S.arenaState.players[uid];if(arenaLiveIds().length<2)S.arenaState.started=false;arenaSendState();}}
  function arenaAttackHost(uid){
    const p=S.players[uid],me=S.arenaState.players[uid];if(!p||!me||!S.arenaState.started||!me.alive)return;
    const now=Date.now();me.lastAtk=Number(me.lastAtk)||0;if(now-me.lastAtk<500)return;me.lastAtk=now;
    const enemies=arenaLiveIds().filter(id=>S.arenaState.players[id].team!==me.team&&S.arenaState.players[id].alive).map(id=>S.players[id]).filter(Boolean);
    const range=typeof classProfile==='function'?Math.max(1,Number(classProfile(p).range)||1):1;
    const target=enemies.sort((a,b)=>cheb(a,p)-cheb(b,p))[0];if(!target||cheb(target,p)>range)return;
    const tm=S.arenaState.players[target.id];
    const atk=Math.max(1,Number(effectiveAtkRpg(p)||1));
    const def=Math.max(0,Number(effectiveDefRpg(target)||0));
    const power=typeof classProfile==='function'?Math.max(.9,Number(classProfile(p).power)||1):1;
    const dmg=Math.max(1,Math.floor(atk*power-def*.25+Math.random()*4));
    tm.hp=Math.max(0,tm.hp-dmg);
    broadcastEvent({k:'hit',id:target.id,x:target.x,y:target.y,dmg});
    if(tm.hp<=0){tm.alive=false;broadcastEvent({k:'log',s:'⚔️ '+target.name+' 님이 결투에서 쓰러졌어!'});}
    const teamAlive=t=>arenaLiveIds().some(id=>S.arenaState.players[id].team===t&&S.arenaState.players[id].alive);
    if(!teamAlive('A')||!teamAlive('B')){S.arenaState.winner=teamAlive('A')?'A':'B';S.arenaState.started=false;broadcastEvent({k:'log',s:'🏆 결투 종료! '+S.arenaState.winner+'팀 승리!'});}
    S.arenaState.updatedAt=Date.now();arenaSendState();
  }

  const _hostRecvV90=hostRecv;
  hostRecv=function(c,m){
    if(!m||!c)return;
    if(m.t==='market_list'&&c.uid&&S.players[c.uid]){marketListHost(c.uid,m);return;}
    if(m.t==='market_buy'&&c.uid&&S.players[c.uid]){marketBuyHost(c.uid,m);return;}
    if(m.t==='market_cancel'&&c.uid&&S.players[c.uid]){marketCancelHost(c.uid,m);return;}
    if(m.t==='arena_join'&&c.uid&&S.players[c.uid]){arenaJoinHost(c.uid);return;}
    if(m.t==='arena_leave'&&c.uid){arenaLeaveHost(c.uid);return;}
    if(m.t==='arena_attack'&&c.uid){arenaAttackHost(c.uid);return;}
    if(m.t==='use_unstable_warp'&&c.uid&&S.players[c.uid]){
      const p=S.players[c.uid],dest=String(m.dest||''),md=mapDef(dest),n=itemCount(p,'unstableWarpStone');
      if(!md||!n||!RPG_MAPS[dest])return;

      if(!removeItem(p,'unstableWarpStone',1))return;
      p.map=dest;p.x=md.spawn.x;p.y=md.spawn.y;p._lastTeleport=Date.now();S.moveAck[c.uid]=(S.moveAck[c.uid]||0)+1;
      sendTo(c.uid,{t:'map_teleport_ok',map:dest,x:p.x,y:p.y});broadcastEvent({k:'log',s:'🌀 '+p.name+' 님이 불안정한 워프석으로 '+md.name+'에 도착했습니다.'});bcast(snapshot());return;
    }
    if(m.t==='map_teleport'&&c.uid&&S.players[c.uid]&&S.players[c.uid].map==='arena')arenaLeaveHost(c.uid);
    const beforeMap=c.uid&&S.players[c.uid]?S.players[c.uid].map:'';
    const out=_hostRecvV90(c,m);
    if(m.t==='hello'&&c.uid&&S.players[c.uid]){
      const p=S.players[c.uid],fc=String(p.friendCode||'');const payout=Math.floor(Number(S.marketPayouts[fc])||0);
      if(payout>0){p.gold+=payout;delete S.marketPayouts[fc];sendTo(c.uid,{t:'market_notice',s:'💰 오프라인 시장 판매 정산으로 '+payout+'골드를 받았어.'});bcast(snapshot());}
    }
    if(m.t==='map_teleport'&&beforeMap==='arena'&&c.uid)arenaLeaveHost(c.uid);
    return out;
  };
  globalThis.hostRecv=hostRecv;

  /* 기존 공격 루프를 결투장에서는 PVP 공격으로 전환 */
  const _doAttackV90=doAttackRpg;
  doAttackRpg=function(uid){
    const p=S.players[uid];
    if(p&&p.map==='arena'){arenaAttackHost(uid);return true;}
    return _doAttackV90(uid);
  };
  globalThis.doAttackRpg=doAttackRpg;doAttack=doAttackRpg;

  /* 방 생성/세션 초기화 시 장터·결투장 상태 초기화 */
  const _createRoomV90=createRoom;
  createRoom=function(isPublic){
    S.marketListings={};S.marketPayouts={};S.marketSeq=0;S.arenaState={players:{},started:false,winner:null,round:0,updatedAt:Date.now()};
    return _createRoomV90(isPublic);
  };
  globalThis.createRoom=createRoom;

  /* 호스트가 5초마다 결투장 유령 참가자를 정리 */
  if(S.__v90ArenaCleanup)clearInterval(S.__v90ArenaCleanup);
  S.__v90ArenaCleanup=setInterval(()=>{
    if(!S.isHost)return;
    let changed=false;for(const id of Object.keys(S.arenaState.players||{})){if(!S.players[id]||S.players[id].map!=='arena'){delete S.arenaState.players[id];changed=true;}}
    if(changed){if(arenaLiveIds().length<2)S.arenaState.started=false;arenaSendState();}
  },5000);

  /* 상점 구매 목록에 불안정한 워프석 추가 */
  const _renderShopV90=renderShop;
  renderShop=function(){
    _renderShopV90();
    const box=$('panelBody');if(!box)return;
    const grid=box.querySelector('.shopGrid');if(!grid)return;
    if(!grid.querySelector('[data-buy="unstableWarpStone"]')){
      const p=S.players[S.uid],d=ITEMS.unstableWarpStone;
      const row=document.createElement('div');row.className='shopRow';row.innerHTML='<div class="shopIcon">'+d.icon+'</div><div class="shopInfo"><b>'+escapeHtml(d.name)+'</b><small>💰 '+d.price+' · 보유 x'+itemCount(p,'unstableWarpStone')+'</small></div><button data-buy="unstableWarpStone">구매</button>';
      row.querySelector('button').disabled=!(p&&p.gold>=d.price&&itemCount(p,'unstableWarpStone')<d.max);
      row.querySelector('button').onclick=()=>sendLocalHost({t:'shop_buy',id:'unstableWarpStone'});grid.appendChild(row);
    }
  };
  globalThis.renderShop=renderShop;

  /* 기존 favicon/stray text와 독립된 안전한 최종 상태 */
  window.__rpgV90MarketArenaWarp=true;
})();
</script>

<script id="rpgV91WorldMapFix">
(function installRpgV91(){
  'use strict';
  if(window.__RPG_V91_WORLD_MAP__) return;
  window.__RPG_V91_WORLD_MAP__=true;
  if(typeof RPG_MAPS==='undefined'||typeof S==='undefined') return;

  const ICONS={town:'🏘️',field:'🌿',forest:'🌙',canyon:'🪨',dungeon:'🟥',catacombs:'💀',abyss:'🌑',market:'🏪',arena:'⚔️'};
  const ORDER=['town','field','forest','canyon','dungeon','catacombs','abyss','market','arena'];
  const TYPE={town:'마을 · 안전구역',field:'필드 · 사냥터',forest:'필드 · 중급',canyon:'필드 · 고급',dungeon:'던전 · 위험지역',catacombs:'던전 · 언데드',abyss:'던전 · 최종지역',market:'생활 · 공개 장터',arena:'PvP · 결투장'};

  function worldMaps(){
    const seen=new Set(),out=[];
    for(const id of ORDER){const md=RPG_MAPS[id];if(md&&md.kind!=='interior'){seen.add(id);out.push(md);}}
    Object.values(RPG_MAPS).forEach(md=>{if(md&&md.kind!=='interior'&&!seen.has(md.id)){seen.add(md.id);out.push(md);}});
    return out;
  }

  function currentPortal(p){
    try{return typeof nearestRpgPortal==='function'?nearestRpgPortal(p):null;}catch(_e){return null;}
  }

  function levelAllowed(p,md){return Number(p&&p.lv||1)>=Number(md&&md.minLv||1);}
  function reachableFrom(near,id){return !!near && Array.isArray(near.dest) && near.dest.includes(id);}
  function peopleCount(id){
    let n=0;try{Object.values(S.players||{}).forEach(q=>{if(q&&q.map===id)n++;});}catch(_e){}
    return n;
  }

  function sig(p,near){
    const warp=typeof itemCount==='function'?Number(itemCount(p,'unstableWarpStone')||0):0;
    const portalId=near&&near.id||'none';
    const dest=near&&Array.isArray(near.dest)?near.dest.join(','):'';
    return [p&&p.map||'town',p&&p.x||0,p&&p.y||0,p&&p.lv||1,portalId,dest,warp,worldMaps().map(x=>x.id).join(',')].join('|');
  }

  function startWatcher(){
    if(S.__rpgV91WorldMapTimer)clearInterval(S.__rpgV91WorldMapTimer);
    S.__rpgV91WorldMapTimer=setInterval(()=>{
      try{
        const panel=$('overlayPanel'),title=$('panelTitle');
        if(!panel||!panel.classList.contains('open')||!title||!title.textContent.includes('월드 맵')){clearInterval(S.__rpgV91WorldMapTimer);S.__rpgV91WorldMapTimer=null;return;}
        const p=S.players[S.uid];if(!p)return;
        const near=currentPortal(p),next=sig(p,near);
        if(next!==S.__rpgV91WorldMapSig)renderWorldMapV91();
      }catch(_e){}
    },250);
  }

  function renderWarpSectionV91(p,maps){
    const n=typeof itemCount==='function'?Number(itemCount(p,'unstableWarpStone')||0):0;
    if(n<=0)return '';
    let html='<div class="section worldMapWarpV91"><div class="sectionTitle">🌀 불안정한 워프석 ×'+n+'</div><div class="socialSub">이동석이 없어도 바로 이동할 수 있는 1회용 워프야. 지역 레벨 제한은 그대로 적용돼.</div><div class="teleportGrid">';
    maps.forEach(md=>{
      const ok=levelAllowed(p,md),same=md.id===p.map;
      const label=same?'현재 위치':(!ok?'🔒 Lv.'+md.minLv+' 필요':'워프');
      html+='<button class="teleportBtn" data-warp-v91="'+escapeHtml(md.id)+'" '+((!ok||same)?'disabled':'')+'><b>'+(ICONS[md.id]||'🗺️')+' '+escapeHtml(md.name)+'</b><small>'+escapeHtml(md.meta)+(same?' · 현재 위치':(!ok?' · Lv.'+md.minLv+' 필요':''))+'</small></button>';
    });
    html+='</div></div>';
    return html;
  }

  function renderWorldMapV91(){
    const p=S.players[S.uid];if(!p)return;
    const near=currentPortal(p),maps=worldMaps(),current=RPG_MAPS[p.map]||RPG_MAPS.town;
    let html='<div class="worldMapHeroV91"><div class="icon">'+(ICONS[current.id]||'🗺️')+'</div><div><b>'+escapeHtml(current.name)+'</b><small>'+escapeHtml(current.meta||'')+'</small></div><div class="worldMapLevelV91">Lv.'+(Number(p.lv)||1)+'</div></div>';
    if(near){
      html+='<div class="worldMapPortalV91">'+near.icon+' 현재 이동석 <b>'+escapeHtml(near.name)+'</b><br>'+escapeHtml(near.desc||'')+'</div>';
    }else{
      html+='<div class="worldMapPortalV91">📍 <b>이동석에서 떨어져 있어.</b> 지역 선택은 미리 볼 수 있지만, 일반 이동은 해당 지역의 이동석 근처에서 가능해.</div>';
    }
    html+='<div class="section worldMapSectionV91"><div class="sectionTitle">🌍 전체 지역</div><div class="worldMapGridV91">';
    maps.forEach(md=>{
      const isCurrent=md.id===p.map;
      const lvOk=levelAllowed(p,md);
      const canReach=!isCurrent&&lvOk&&reachableFrom(near,md.id);
      let cls='worldMapCardV91';
      let label='이동석 필요';
      if(isCurrent){cls+=' current';label='현재 위치';}
      else if(!lvOk){cls+=' locked';label='🔒 Lv.'+md.minLv;}
      else if(near&&!canReach){cls+=' unreachable';label='📍 다른 이동석';}
      else if(canReach){label='🌀 이동';}
      const people=peopleCount(md.id);
      html+='<div class="'+cls+'">'+
        '<div class="mapIcon">'+(ICONS[md.id]||'🗺️')+'</div>'+ 
        '<div class="mapMain"><div class="mapName"><b>'+escapeHtml(md.name)+'</b><span class="mapType">'+escapeHtml(TYPE[md.id]||md.kind||'지역')+'</span></div><div class="mapMeta">'+escapeHtml(md.meta||'')+(md.minLv>1?' · 권장 Lv.'+md.minLv:'')+'</div></div>'+
        '<div class="mapAction"><span class="mapPeople">👥 '+people+'명</span><button type="button" data-world-dest="'+escapeHtml(md.id)+'" '+((isCurrent||!canReach)?'disabled':'')+'>'+label+'</button></div>'+
      '</div>';
    });
    html+='</div></div>';
    html+=renderWarpSectionV91(p,maps);
    if(p.map==='market')html+='<div class="tradeActions"><button id="openMarketV91">🏪 시장터 게시판</button></div>';
    if(p.map==='arena')html+='<div class="tradeActions"><button id="openArenaV91">⚔️ 결투장 열기</button></div>';
    html+='<div class="worldMapHintV91">💡 지역 카드를 누르면 가능한 경우 바로 이동해. 잠긴 지역은 레벨을 올리면 열리고, 연결되지 않은 지역은 다른 이동석에서 접근해야 해.</div>';

    openPanel('🗺️ 월드 맵 · 지역 선택',html);
    const panel=$('overlayPanel');if(panel)panel.classList.add('worldMapPanelV91');
    S.__rpgV91WorldMapSig=sig(p,near);
    $('panelBody').querySelectorAll('[data-world-dest]').forEach(b=>b.onclick=()=>requestTeleportRpg(b.dataset.worldDest));
    $('panelBody').querySelectorAll('[data-warp-v91]').forEach(b=>b.onclick=()=>sendLocalHost({t:'use_unstable_warp',dest:b.dataset.warpV91}));
    if($('openMarketV91'))$('openMarketV91').onclick=renderMarketPanel;
    if($('openArenaV91'))$('openArenaV91').onclick=renderArenaPanel;
    startWatcher();
  }

  const oldClose=closePanel;
  closePanel=function(){
    if(S.__rpgV91WorldMapTimer){clearInterval(S.__rpgV91WorldMapTimer);S.__rpgV91WorldMapTimer=null;}
    S.__rpgV91WorldMapSig='';
    const panel=$('overlayPanel');if(panel)panel.classList.remove('worldMapPanelV91');
    return oldClose.apply(this,arguments);
  };
  globalThis.closePanel=closePanel;

  renderTeleportPanel=renderWorldMapV91;
  globalThis.renderTeleportPanel=renderWorldMapV91;

  /* 시장터/결투장에 다시 생긴 바둑판 느낌을 완화하고, 같은 계열의 자연스러운 톤 차이만 남긴다. */
  const oldMapColor=mapTileColor;
  mapTileColor=function(map,x,y,css){
    if(map==='market'){
      const n=hash2(Number(x)||0,Number(y)||0)%100;
      return n<38?'#d1bd91':n<72?'#d7c69d':'#c9b487';
    }
    if(map==='arena'){
      const n=hash2((Number(x)||0)+91,(Number(y)||0)+37)%100;
      return n<40?'#515b6c':n<75?'#586375':'#4b5567';
    }
    return oldMapColor(map,x,y,css);
  };
  globalThis.mapTileColor=mapTileColor;

  window.addEventListener('resize',()=>{
    try{if($('overlayPanel')?.classList.contains('open')&&$('panelTitle')?.textContent.includes('월드 맵'))renderWorldMapV91();}catch(_e){}
  },{passive:true});

  window.__rpgV91Ready=true;
})();
</script>
