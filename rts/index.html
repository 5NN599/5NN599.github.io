<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>미니지 - RTS</title>
    <style>
        :root {
            --bg: #f8f9fa; --text: #333;
            --canvas-bg: #05070a; --border: #e9ecef;
            --btn-bg: #fff;
        }
        [data-theme="dark"] {
            --bg: #0d1117; --text: #c9d1d9;
            --canvas-bg: #020305; --border: #30363d;
            --btn-bg: #21262d;
        }
        [data-theme="beige"] {
            --bg: #f5ebe0; --text: #4e3d30;
            --canvas-bg: #14100c; --border: #ddcbbb;
            --btn-bg: #eddfd0;
        }
        body {
            background-color: var(--bg) !important;
            color: var(--text) !important;
            text-align: center; font-family: sans-serif;
            padding-top: 15px; margin: 0; transition: 0.3s;
            overflow-x: hidden;
        }
        canvas {
            background-color: var(--canvas-bg);
            display: block; margin: 10px auto;
            border: 4px solid var(--border); border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        button {
            background-color: var(--btn-bg) !important;
            color: var(--text) !important;
            border: 1px solid var(--border) !important;
            padding: 8px 16px; font-size: 0.9rem;
            border-radius: 8px; cursor: pointer; margin: 4px;
            font-weight: bold;
        }
        #rts-panel {
            font-size: 1.2rem; font-weight: bold;
            color: #fcc419; margin-bottom: 4px;
        }
        .build-bar { margin: 8px 0; }
        #guide-txt { font-size: 0.85rem; color: #8b949e; margin-bottom: 5px; }
        .active-mode { border: 2px solid #4dadf7 !important; }
    </style>
</head>
<body>
    <h1>⚔️ 우주 전쟁: 미니 RTS 완전판</h1>
    <div id="rts-panel">💎 광물: 50 | 🌋 가스: 0 | 🚀 아군: 4대 | 🌊 웨이브: 1</div>
    <div id="guide-txt">⌨️ WASD/방향키: 지도 스크롤 | 🛠️ 건물 건설 버튼 클릭 후 캔버스 땅을 누르세요!</div>
    
    <div class="build-bar">
        <button id="btn-scv" onclick="produceUnit('scv')">🛸 수집선 생산 (💎20)</button>
        <button id="btn-barracks" onclick="toggleBuildMode()">🏭 전술 병영 건설 (💎40)</button>
        <button id="btn-fighter" onclick="produceUnit('fighter')">🚀 전투기 생산 (💎30) [병영 필요]</button>
        <button id="btn-cruiser" onclick="produceUnit('cruiser')">🛩️ 중순양함 생산 (💎50 🌋15) [병영 필요]</button>
        <button onclick="location.href='../'">🏠 오락실 메인</button>
    </div>
    <canvas id="rtsCanvas" width="600" height="440"></canvas>
    <script>
        const savedTheme = localStorage.getItem('minig-theme');
        if (savedTheme && savedTheme !== 'white') document.documentElement.setAttribute('data-theme', savedTheme);

        let audioCtx = null;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playSound(type) {
            initAudio(); try {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime;
                if (type === 'produce') { osc.type = 'sine'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(550, now+0.12); gain.gain.setValueAtTime(0.02, now); gain.gain.linearRampToValueAtTime(0, now+0.12); osc.start(now); osc.stop(now+0.12); }
                else if (type === 'laser') { osc.type = 'square'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(350, now+0.04); gain.gain.setValueAtTime(0.005, now); gain.gain.linearRampToValueAtTime(0, now+0.04); osc.start(now); osc.stop(now+0.04); }
                else if (type === 'explode') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(160, now); gain.gain.setValueAtTime(0.04, now); gain.gain.linearRampToValueAtTime(0, now+0.15); osc.start(now); osc.stop(now+0.15); }
            } catch(e) {}
        }

        const canvas = document.getElementById('rtsCanvas'); const ctx = canvas.getContext('2d');
        const MAP_W = 1500, MAP_H = 1100;
        let camX = 0, camY = 330; let keys = {};

        let minerals = 50, gas = 0, enemyMinerals = 50, enemyGas = 0;
        let units = [], enemies = [], bullets = [], explosions = [], playerBuildings = [], enemyBuildings = [];
        let isGameOver = false, frameCount = 0, isBuildMode = false;

        const playerCC = { x: 150, y: 900, emoji: "🏰", hp: 500, maxHp: 500, type: 'cc' };
        const playerM = { x: 80, y: 750, emoji: "💎" };
        const playerG = { x: 260, y: 1000, emoji: "🌋" };

        const enemyCC = { x: 1300, y: 200, emoji: "🏯", hp: 500, maxHp: 500, type: 'cc' };
        const enemyM = { x: 1400, y: 350, emoji: "💎" };
        const enemyG = { x: 1200, y: 80, emoji: "🌋" };

        playerBuildings.push(playerCC);
        enemyBuildings.push(enemyCC);

        for(let i=0; i<4; i++) {
            units.push({ x: playerCC.x + (i*25-30), y: playerCC.y - 60, type: 'scv', state: 'mine', target: i%2===0?playerM:playerG, res: null, hp: 30, maxHp: 30, spd: 1.5 });
            enemies.push({ x: enemyCC.x + (i*25-30), y: enemyCC.y + 70, type: 'scv', state: 'mine', target: i%2===0?enemyM:enemyG, res: null, hp: 30, maxHp: 30, spd: 1.5 });
        }

        document.addEventListener('keydown', e => keys[e.key] = true);
        document.addEventListener('keyup', e => keys[e.key] = false);

        function toggleBuildMode() {
            isBuildMode = !isBuildMode;
            document.getElementById('btn-barracks').classList.toggle('active-mode', isBuildMode);
        }

        canvas.addEventListener('click', e => {
            if (!isBuildMode || isGameOver) return;
            const rect = canvas.getBoundingClientRect();
            const mouseWorldX = e.clientX - rect.left + camX;
            const mouseWorldY = e.clientY - rect.top + camY;

            if (minerals >= 40) {
                minerals -= 40;
                playerBuildings.push({ x: mouseWorldX, y: mouseWorldY, emoji: "🏭", hp: 300, maxHp: 300, type: 'barracks' });
                playSound('produce'); toggleBuildMode(); updateHUD();
            }
        });

        function produceUnit(type) {
            if (isGameOver) return;
            let hasBarracks = playerBuildings.some(b => b.type === 'barracks');
            if (type === 'scv' && minerals >= 20) { minerals -= 20; let nd = Math.random()<0.5?playerM:playerG; units.push({ x: playerCC.x+40, y: playerCC.y-40, type: 'scv', state: 'mine', target: nd, res: null, hp: 30, maxHp: 30, spd: 1.5 }); playSound('produce'); }
            else if (type === 'fighter') {
                if (!hasBarracks) { alert("🏭 아군 전투기를 생산하려면 먼저 '전술 병영' 건물을 지어야 합니다!"); return; }
                if (minerals >= 30) { minerals -= 30; units.push({ x: playerCC.x+40, y: playerCC.y-40, type: 'fighter', state: 'patrol', hp: 45, maxHp: 45, cool: 0, spd: 2.3 }); playSound('produce'); }
            }
            else if (type === 'cruiser') {
                if (!hasBarracks) { alert("🏭 중순양함을 생산하려면 먼저 '전술 병영' 건물을 지어야 합니다!"); return; }
                if (minerals >= 50 && gas >= 15) { minerals -= 50; gas -= 15; units.push({ x: playerCC.x+40, y: playerCC.y-40, type: 'cruiser', state: 'patrol', hp: 120, maxHp: 120, cool: 0, spd: 1.2 }); playSound('produce'); }
            }
            updateHUD();
        }

        function updateHUD() {
            let uCount = units.filter(u=>u.type!=='scv').length; let eCount = enemies.filter(e=>e.type!=='scv').length;
            document.getElementById('rts-panel').innerText = `💎 광물: ${minerals} | 🌋 가스: ${gas} | 🚀 아군군대: ${uCount}대 | 🌊 웨이브: ${wave}`;
        }
        function loop() {
            if (isGameOver) return; requestAnimationFrame(loop);
            if (keys['ArrowLeft'] || keys['a']) camX = Math.max(0, camX - 5);
            if (keys['ArrowRight'] || keys['d']) camX = Math.min(MAP_W - canvas.width, camX + 5);
            if (keys['ArrowUp'] || keys['w']) camY = Math.max(0, camY - 5);
            if (keys['ArrowDown'] || keys['s']) camY = Math.min(MAP_H - canvas.height, camY + 5);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save(); ctx.translate(-camX, -camY);

            ctx.font = "50px sans-serif";
            ctx.fillText(playerM.emoji, playerM.x-20, playerM.y+20); ctx.fillText(playerG.emoji, playerG.x-20, playerG.y+20);
            ctx.fillText(enemyM.emoji, enemyM.x-20, enemyM.y+20); ctx.fillText(enemyG.emoji, enemyG.x-20, enemyG.y+20);

            playerBuildings.forEach(b => {
                ctx.font = "50px sans-serif"; ctx.fillText(b.emoji, b.x-20, b.y+20);
                ctx.fillStyle = "#ff6b6b"; ctx.fillRect(b.x-30, b.y-30, 80, 5);
                ctx.fillStyle = "#51cf66"; ctx.fillRect(b.x-30, b.y-30, (b.hp/b.maxHp)*80, 5);
            });
            enemyBuildings.forEach(b => {
                ctx.font = "50px sans-serif"; ctx.fillText(b.emoji, b.x-20, b.y+20);
                ctx.fillStyle = "#ff6b6b"; ctx.fillRect(b.x-30, b.y-30, 80, 5);
                ctx.fillStyle = "#51cf66"; ctx.fillRect(b.x-30, b.y-30, (b.hp/b.maxHp)*80, 5);
            });

            if(frameCount % 100 === 0) { enemyMinerals += 15; enemyGas += 5; }
            if(frameCount % 320 === 0) {
                let enemyHasBarracks = enemyBuildings.some(b => b.type === 'barracks');
                if (!enemyHasBarracks && enemyMinerals >= 40) {
                    enemyMinerals -= 40; enemyBuildings.push({ x: enemyCC.x-70, y: enemyCC.y+80, emoji: "🏭", hp: 300, maxHp: 300, type: 'barracks' });
                }
                if (enemyHasBarracks) {
                    if(wave >= 6 && enemyMinerals >= 50 && enemyGas >= 15 && Math.random()<0.4) {
                        enemyMinerals -= 50; enemyGas -= 15; enemies.push({ x: enemyCC.x-40, y: enemyCC.y+40, type: 'cruiser', state: 'attack', hp: 120, maxHp: 120, cool: 0, spd: 1.2 });
                    } else if(enemyMinerals >= 30) {
                        enemyMinerals -= 30; enemies.push({ x: enemyCC.x-40, y: enemyCC.y+40, type: 'fighter', state: 'attack', hp: 45, maxHp: 45, cool: 0, spd: 2.3 });
                    }
                }
            }

            units.forEach((u, idx) => {
                let fEnemies = enemies.filter(e=>e.type!=='scv');
                if (u.type === 'scv') {
                    let dx = u.target.x - u.x; let dy = u.target.y - u.y; let d = Math.sqrt(dx*dx + dy*dy);
                    if (d > 25) { u.x += (dx/d)*u.spd; u.y += (dy/d)*u.spd; }
                    else {
                        if (u.target === playerM) { u.res = 'm'; u.target = playerCC; }
                        else if (u.target === playerG) { u.res = 'g'; u.target = playerCC; }
                        else if (u.target === playerCC) { if(u.res==='m') minerals+=8; else if(u.res==='g') gas+=4; u.res=null; u.target=Math.random()<0.6?playerM:playerG; updateHUD(); }
                    }
                    ctx.save(); ctx.font = "16px sans-serif"; ctx.fillText(u.res?"📦":"🛸", u.x-8, u.y+6); ctx.restore();
                } else {
                    let aliveEnemyB = enemyBuildings.filter(b => b.hp > 0);
                    let target = fEnemies.length > 0 ? fEnemies[0] : (aliveEnemyB.length > 0 ? aliveEnemyB[0] : enemyCC);
                    let dx = target.x - u.x; let dy = target.y - u.y; let d = Math.sqrt(dx*dx + dy*dy);
                    if (d > 140) { u.x += (dx/d)*u.spd; u.y += (dy/d)*u.spd; }
                    else if (u.cool <= 0) { bullets.push({ x: u.x, y: u.y, target: target, isEnemy: false, dmg: u.type==='cruiser'?15:7, type: u.type }); u.cool = u.type==='cruiser'?35:18; playSound('laser'); }
                    if (u.cool > 0) u.cool--;
                    ctx.save(); ctx.font = u.type==='cruiser'?"24px sans-serif":"18px sans-serif"; ctx.fillText(u.type==='cruiser'?"🛩️":"🚀", u.x-8, u.y+6);
                    ctx.fillStyle = "#ff6b6b"; ctx.fillRect(u.x-10, u.y-14, 20, 3); ctx.fillStyle = "#51cf66"; ctx.fillRect(u.x-10, u.y-14, (u.hp/u.maxHp)*20, 3); ctx.restore();
                }
            });
            for (let i = enemies.length - 1; i >= 0; i--) {
                let en = enemies[i]; let fUnits = units.filter(u=>u.type!=='scv');
                if (en.type === 'scv') {
                    let dx = en.target.x - en.x; let dy = en.target.y - en.y; let d = Math.sqrt(dx*dx + dy*dy);
                    if (d > 25) { en.x += (dx/d)*en.spd; en.y += (dy/d)*en.spd; }
                    else {
                        if (en.target === enemyM) { en.res = 'm'; en.target = enemyCC; }
                        else if (en.target === enemyG) { en.res = 'g'; en.target = enemyCC; }
                        else if (en.target === enemyCC) { if(en.res==='m') enemyMinerals+=8; else if(en.res==='g') enemyGas+=4; en.res=null; en.target=Math.random()<0.6?enemyM:enemyG; }
                    }
                    ctx.save(); ctx.font = "16px sans-serif"; ctx.fillText(en.res?"📦":"🛸", en.x-8, en.y+6); ctx.restore();
                } else {
                    let alivePlayerB = playerBuildings.filter(b => b.hp > 0);
                    let target = fUnits.length > 0 ? fUnits[0] : (alivePlayerB.length > 0 ? alivePlayerB[0] : playerCC);
                    let dx = target.x - en.x; let dy = target.y - en.y; let d = Math.sqrt(dx*dx + dy*dy);
                    if (d > 140) { en.x += (dx/d)*en.spd; en.y += (dy/d)*en.spd; }
                    else if (en.cool <= 0) { bullets.push({ x: en.x, y: en.y, target: target, isEnemy: true, dmg: en.type==='cruiser'?15:7, type: en.type }); en.cool = en.type==='cruiser'?35:18; playSound('laser'); }
                    if (en.cool > 0) en.cool--;
                    ctx.save(); ctx.font = en.type==='cruiser'?"24px sans-serif":"18px sans-serif"; ctx.fillText(en.type==='cruiser'?"🛩️":"🛸", en.x-8, en.y+6);
                    ctx.fillStyle = "#ff6b6b"; ctx.fillRect(en.x-10, en.y-14, 20, 3); ctx.fillStyle = "#fa5252"; ctx.fillRect(en.x-10, en.y-14, (en.hp/en.maxHp)*20, 3); ctx.restore();
                }
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                let isBuilding = b.target.type === 'cc' || b.target.type === 'barracks';
                if (!isBuilding && !units.includes(b.target) && !enemies.includes(b.target) && !playerBuildings.includes(b.target) && !enemyBuildings.includes(b.target)) { bullets.splice(i, 1); continue; }
                let dx = b.target.x - b.x; let dy = b.target.y - b.y; let d = Math.sqrt(dx*dx + dy*dy);

                if (d < 12) {
                    b.target.hp -= b.dmg;
                    if (b.target === playerCC && playerCC.hp <= 0) { isGameOver = true; playSound('explode'); alert("💥 아군 사령부가 함락되었습니다! 패배"); location.reload(); return; }
                    if (b.target === enemyCC && enemyCC.hp <= 0) { isGameOver = true; playSound('explode'); alert("🏆 외계인 기지를 완전히 소멸시켰습니다! 우주 대승리!"); location.reload(); return; }
                    
                    if (b.target.hp <= 0) {
                        explosions.push({ x: b.target.x, y: b.target.y, rad: 5 }); playSound('explode');
                        if (isBuilding) {
                            let bList = b.isEnemy ? playerBuildings : enemyBuildings; let bIdx = bList.indexOf(b.target); if(bIdx > -1) bList.splice(bIdx, 1);
                        } else {
                            let tList = b.isEnemy ? units : enemies; let idx = tList.indexOf(b.target); if (idx > -1) tList.splice(idx, 1);
                        }
                        updateHUD();
                    }
                    bullets.splice(i, 1);
                } else { b.x += (dx/d)*6; b.y += (dy/d)*6; ctx.fillStyle = b.isEnemy?'#ff4d4d':'#00ffcc'; ctx.beginPath(); ctx.arc(b.x, b.y, b.type==='cruiser'?3.5:2, 0, Math.PI * 2); ctx.fill(); }
            }

            for (let i = explosions.length - 1; i >= 0; i--) { let exp = explosions[i]; exp.rad += 2; ctx.save(); ctx.font = "20px sans-serif"; ctx.fillText("💥", exp.x-10, exp.y+8); ctx.restore(); if (exp.rad >= 20) explosions.splice(i, 1); }
            ctx.restore();

            ctx.save(); ctx.fillStyle = "rgba(0, 0, 0, 0.85)"; ctx.fillRect(10, canvas.height - 90, 110, 80); ctx.strokeStyle = "var(--border)"; ctx.lineWidth = 1; ctx.strokeRect(10, canvas.height - 90, 110, 80);
            ctx.fillStyle = "#51cf66"; playerBuildings.forEach(b => ctx.fillRect(10 + (b.x/MAP_W)*110, (canvas.height - 90) + (b.y/MAP_H)*80, 4, 4)); units.forEach(u => ctx.fillRect(10 + (u.x/MAP_W)*110, (canvas.height - 90) + (u.y/MAP_H)*80, 2, 2));
            ctx.fillStyle = "#fa5252"; enemyBuildings.forEach(b => ctx.fillRect(10 + (b.x/MAP_W)*110, (canvas.height - 90) + (b.y/MAP_H)*80, 4, 4)); enemies.forEach(e => ctx.fillRect(10 + (e.x/MAP_W)*110, (canvas.height - 90) + (e.y/MAP_H)*80, 2, 2));
            ctx.strokeStyle = "#fff"; ctx.strokeRect(10 + (camX/MAP_W)*110, (canvas.height - 90) + (camY/MAP_H)*80, (canvas.width/MAP_W)*110, (canvas.height/MAP_H)*80); ctx.restore();

            waveTimer++; if (waveTimer >= 900) { wave++; waveTimer = 0; updateHUD(); }
            frameCount++;
        }

        updateHUD(); loop();
    </script>
</body>
</html>
