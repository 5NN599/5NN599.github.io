<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>HTML5 RTS - 밸런스 패치 버전</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #121212; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    
    #game-container { display: flex; flex-direction: column; gap: 10px; background: #1e1e1e; padding: 15px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    
    /* 상단 자원 및 정보 UI */
    .header-ui { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 10px 20px; border-radius: 8px; font-weight: bold; }
    .resource-box { display: flex; gap: 20px; }
    .res-item { display: flex; align-items: center; gap: 6px; font-size: 16px; }
    .res-icon { width: 14px; height: 14px; display: inline-block; border-radius: 2px; }
    .mineral-icon { background: #00d2ff; }
    .supply-icon { background: #ffcc00; }
    
    /* 캔버스 영역 */
    canvas { background: #111; border: 2px solid #333; border-radius: 6px; cursor: crosshair; }
    
    /* 하단 조작 UI */
    .controls-ui { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 10px; border-radius: 8px; }
    .btn-group { display: flex; gap: 8px; }
    button { background: #3a3a3a; color: #fff; border: 1px solid #555; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    button:hover { background: #4a4a4a; border-color: #00d2ff; }
    button:disabled { background: #222; color: #666; border-color: #333; cursor: not-allowed; }
    
    /* 난이도 선택 버튼 */
    .diff-btn.active { background: #007acc; border-color: #00d2ff; }
    
    /* 로그 박스 */
    #log-box { width: 800px; height: 80px; background: #000; color: #00ff66; font-family: monospace; font-size: 12px; padding: 8px; border-radius: 6px; overflow-y: auto; border: 1px solid #333; margin-top: 5px; }
  </style>
</head>
<body>

<div id="game-container">
  <!-- 상단 자원 및 인구수 UI -->
  <div class="header-ui">
    <div class="resource-box">
      <div class="res-item"><span class="res-icon mineral-icon"></span> 미네랄: <span id="p-mineral">400</span></div>
      <div class="res-item"><span class="res-icon supply-icon"></span> 인구수: <span id="p-supply">0 / 10</span></div>
    </div>
    <div>
      난이도: 
      <button class="diff-btn active" onclick="setDifficulty('EASY')">쉬움</button>
      <button class="diff-btn" onclick="setDifficulty('NORMAL')">보통</button>
      <button class="diff-btn" onclick="setDifficulty('HARD')">어려움</button>
    </div>
  </div>

  <!-- 게임 화면 Canvas -->
  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <!-- 하단 컨트롤 UI -->
  <div class="controls-ui">
    <div class="btn-group">
      <button onclick="buildSupplyDepot()">서플라이 디포 (미네랄 100)</button>
      <button onclick="produceUnit()">유닛 생산 (미네랄 50 / 인구 1)</button>
    </div>
    <div>
      <span style="font-size: 13px; color: #aaa;">AI 미네랄: <b id="ai-mineral">200</b> | AI 인구: <b id="ai-supply">0/10</b></span>
    </div>
  </div>

  <!-- 게임 로그 -->
  <div id="log-box"></div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // ==========================================
  // 1. 난이도 및 데이터 설정 (Step 1 & 2)
  // ==========================================
  const DIFFICULTY_SETTINGS = {
    EASY:   { name: "쉬움",   aiStartMinerals: 200, aiGatherRate: 1, aiBuildInterval: 4000 },
    NORMAL: { name: "보통",   aiStartMinerals: 400, aiGatherRate: 2, aiBuildInterval: 2500 },
    HARD:   { name: "어려움", aiStartMinerals: 600, aiGatherRate: 4, aiBuildInterval: 1200 }
  };

  let currentDiff = DIFFICULTY_SETTINGS.EASY;

  // 플레이어 & AI 데이터
  const player = {
    color: '#00d2ff',
    minerals: 400,
    currentSupply: 0,
    maxSupply: 10,
    buildings: [{ type: 'HQ', x: 80, y: 250, hp: 1000, maxHp: 1000 }],
    units: []
  };

  const ai = {
    color: '#ff4444',
    minerals: currentDiff.aiStartMinerals,
    currentSupply: 0,
    maxSupply: 10,
    buildings: [{ type: 'HQ', x: 720, y: 250, hp: 1000, maxHp: 1000 }],
    units: []
  };

  // ==========================================
  // 2. 인구수 계산 로직 (Step 2)
  // ==========================================
  function updateSupply(faction) {
    const depotCount = faction.buildings.filter(b => b.type === 'SUPPLY_DEPOT').length;
    faction.maxSupply = Math.min(200, 10 + (depotCount * 8)); // 기본 10 + 디포당 8 (최대 200)
    faction.currentSupply = faction.units.length; // 유닛당 인구 1 소비
  }

  // ==========================================
  // 3. 생산 및 건설 기능
  // ==========================================
  function log(msg) {
    const box = document.getElementById('log-box');
    box.innerHTML += `<div>> ${msg}</div>`;
    box.scrollTop = box.scrollHeight;
  }

  function setDifficulty(level) {
    currentDiff = DIFFICULTY_SETTINGS[level];
    ai.minerals = currentDiff.aiStartMinerals;
    document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    log(`난이도가 [${currentDiff.name}] (으)로 변경되었습니다.`);
  }

  // 플레이어: 서플라이 건설
  function buildSupplyDepot() {
    if (player.minerals < 100) { log("미네랄이 부족합니다! (100 필요)"); return; }
    
    player.minerals -= 100;
    const hq = player.buildings[0];
    const offsetX = (Math.random() - 0.5) * 120;
    const offsetY = (Math.random() - 0.5) * 120;
    
    player.buildings.push({
      type: 'SUPPLY_DEPOT',
      x: hq.x + offsetX,
      y: hq.y + offsetY,
      hp: 400, maxHp: 400
    });
    
    updateSupply(player);
    log(`서플라이 디포 건설 완료! (최대 인구수: ${player.maxSupply})`);
  }

  // 플레이어: 유닛 생산
  function produceUnit() {
    if (player.minerals < 50) { log("미네랄이 부족합니다! (50 필요)"); return; }
    if (player.currentSupply + 1 > player.maxSupply) { log("인구수가 가득 찼습니다! 서플라이 디포를 지으세요."); return; }

    player.minerals -= 50;
    const hq = player.buildings[0];
    player.units.push({
      x: hq.x + 30, y: hq.y + (Math.random() - 0.5) * 40,
      hp: 100, maxHp: 100, speed: 1.5, attackPower: 8, target: null
    });

    updateSupply(player);
    log(`유닛 생산 완료! (인구수: ${player.currentSupply}/${player.maxSupply})`);
  }

  // ==========================================
  // 4. AI 자원 계산 및 생산 알고리즘 (Step 1)
  // ==========================================
  setInterval(() => {
    // 자원 자동 획득 (플레이어 10, AI는 난이도 비례)
    player.minerals += 10;
    ai.minerals += 10 * currentDiff.aiGatherRate;
  }, 1000);

  setInterval(() => {
    updateSupply(ai);

    // AI 판단 1: 인구수 한계에 도달하면 자원이 되는 대로 서플라이 디포 건설
    if (ai.currentSupply + 2 >= ai.maxSupply && ai.minerals >= 100 && ai.maxSupply < 200) {
      ai.minerals -= 100;
      const hq = ai.buildings[0];
      ai.buildings.push({
        type: 'SUPPLY_DEPOT',
        x: hq.x + (Math.random() - 0.5) * 120,
        y: hq.y + (Math.random() - 0.5) * 120,
        hp: 400, maxHp: 400
      });
      updateSupply(ai);
      log(`[AI] 서플라이 디포 건설! (최대 인구: ${ai.maxSupply})`);
      return;
    }

    // AI 판단 2: 자원과 인구수가 허용될 때만 유닛 생산 (무한 생산 차단)
    if (ai.minerals >= 50 && ai.currentSupply + 1 <= ai.maxSupply) {
      ai.minerals -= 50;
      const hq = ai.buildings[0];
      ai.units.push({
        x: hq.x - 30, y: hq.y + (Math.random() - 0.5) * 40,
        hp: 100, maxHp: 100, speed: 1.5, attackPower: 8, target: null
      });
      updateSupply(ai);
      log(`[AI] 유닛 생산 완료! (남은 AI 미네랄: ${ai.minerals})`);
    }
  }, currentDiff.aiBuildInterval);

  // ==========================================
  // 5. 전투 & 이동 루프
  // ==========================================
  function gameUpdate() {
    // 플레이어 유닛 -> AI 본진으로 이동 및 공격
    player.units.forEach(u => {
      const target = ai.buildings[0]; // 적 본진 타겟
      if (target) {
        const dist = Math.hypot(target.x - u.x, target.y - u.y);
        if (dist > 35) {
          u.x += ((target.x - u.x) / dist) * u.speed;
          u.y += ((target.y - u.y) / dist) * u.speed;
        } else {
          target.hp -= u.attackPower * 0.05; // 공격
        }
      }
    });

    // AI 유닛 -> 플레이어 본진으로 이동 및 공격
    ai.units.forEach(u => {
      const target = player.buildings[0]; // 플레이어 본진 타겟
      if (target) {
        const dist = Math.hypot(target.x - u.x, target.y - u.y);
        if (dist > 35) {
          u.x += ((target.x - u.x) / dist) * u.speed;
          u.y += ((target.y - u.y) / dist) * u.speed;
        } else {
          target.hp -= u.attackPower * 0.05; // 공격
        }
      }
    });

    // 파괴된 건물 제거 판정
    player.buildings = player.buildings.filter(b => b.hp > 0);
    ai.buildings = ai.buildings.filter(b => b.hp > 0);

    // 승패 체크
    if (player.buildings.length === 0) {
      alert("모든 사령부가 전멸했습니다! 패배!");
      location.reload();
    } else if (ai.buildings.length === 0) {
      alert("적의 모든 사령부를 파괴했습니다! 승리!");
      location.reload();
    }
  }

  // ==========================================
  // 6. 렌더링 (Canvas 렌더링)
  // ==========================================
  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 그리드 배경
    ctx.strokeStyle = '#1e1e1e';
    for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
    for(let i=0; i<canvas.height; i+=40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

    // 건물 및 유닛 그리기 함수
    function drawFaction(faction) {
      // 건물
      faction.buildings.forEach(b => {
        ctx.fillStyle = faction.color;
        if (b.type === 'HQ') {
          ctx.fillRect(b.x - 25, b.y - 25, 50, 50);
          ctx.fillStyle = '#fff';
          ctx.fillText("HQ", b.x - 8, b.y + 4);
        } else if (b.type === 'SUPPLY_DEPOT') {
          ctx.fillRect(b.x - 15, b.y - 15, 30, 30);
          ctx.fillStyle = '#fff';
          ctx.fillText("DEPOT", b.x - 18, b.y + 4);
        }

        // 체력바
        ctx.fillStyle = 'red';
        ctx.fillRect(b.x - 25, b.y - 32, 50, 4);
        ctx.fillStyle = '#00ff00';
        ctx.fillRect(b.x - 25, b.y - 32, (b.hp / b.maxHp) * 50, 4);
      });

      // 유닛
      faction.units.forEach(u => {
        ctx.fillStyle = faction.color;
        ctx.beginPath();
        ctx.arc(u.x, u.y, 8, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    drawFaction(player);
    drawFaction(ai);

    // UI 텍스트 업데이트
    document.getElementById('p-mineral').innerText = Math.floor(player.minerals);
    document.getElementById('p-supply').innerText = `${player.currentSupply} / ${player.maxSupply}`;
    document.getElementById('ai-mineral').innerText = Math.floor(ai.minerals);
    document.getElementById('ai-supply').innerText = `${ai.currentSupply} / ${ai.maxSupply}`;
  }

  // 메인 게임 루프
  function gameLoop() {
    gameUpdate();
    render();
    requestAnimationFrame(gameLoop);
  }

  // 게임 시작
  log("게임을 시작합니다. 난이도를 선택하거나 유닛을 생산하세요.");
  updateSupply(player);
  updateSupply(ai);
  gameLoop();
</script>

</body>
</html>
