<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니지 - 틱택토 (초간단 P2P 멀티플레이)</title>
    <!-- PeerJS CDN (자동 신호 중계 라이브러리) -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #f8f9fa; --text: #333; --canvas-bg: #fff; --border: #e9ecef; --btn-bg: #fff; --win-color: #ffd43b; }
        [data-theme="beige"] { --bg: #f5ebe0; --text: #4e3d30; --canvas-bg: #eddfd0; --border: #ddcbbb; --btn-bg: #eddfd0; --win-color: #f7d070; }
        [data-theme="dark"] { --bg: #0d1117; --text: #c9d1d9; --canvas-bg: #161b22; --border: #30363d; --btn-bg: #21262d; --win-color: #f08c00; }
        
        body { text-align: center; background-color: var(--bg); color: var(--text); font-family: sans-serif; padding-top: 20px; margin: 0; transition: 0.3s; }
        .controls { margin-bottom: 15px; display: flex; justify-content: center; gap: 10px; align-items: center; flex-wrap: wrap; }
        select, input, button { padding: 8px 14px; font-size: 0.95rem; border-radius: 6px; border: 1px solid var(--border); background: var(--canvas-bg); color: var(--text); cursor: pointer; transition: 0.2s; }
        button:hover { filter: brightness(0.95); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .board { display: grid; grid-template-columns: repeat(3, 100px); grid-gap: 8px; justify-content: center; margin: 15px auto; }
        .cell { width: 100px; height: 100px; background-color: var(--canvas-bg); border: 2px solid var(--border); border-radius: 12px; font-size: 2.5rem; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); user-select: none; transition: transform 0.1s, background-color 0.2s; }
        .cell:hover { opacity: 0.9; transform: scale(1.02); }
        .cell.win { background-color: var(--win-color); animation: pulse 0.6s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
        
        .status-container { font-size: 1.1rem; margin-bottom: 10px; font-weight: bold; min-height: 28px; }
        .ping-badge { font-size: 0.85rem; color: #12b886; font-weight: normal; margin-left: 8px; }

        /* P2P 모달 디자인 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: var(--canvas-bg); padding: 25px; border-radius: 16px; border: 2px solid var(--border); text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-width: 420px; width: 90%; }
        .p2p-card { background: rgba(0,0,0,0.03); border-radius: 12px; padding: 15px; margin: 12px 0; border: 1px solid var(--border); }
        .room-code-display { font-size: 2.2rem; font-weight: bold; letter-spacing: 5px; color: #4dadf7; margin: 8px 0; user-select: all; }
        .code-input { font-size: 1.3rem; text-align: center; letter-spacing: 4px; width: 140px; }
        .divider { margin: 15px 0; border-top: 1px dashed var(--border); position: relative; }
        .divider span { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--canvas-bg); padding: 0 10px; font-size: 0.8rem; color: #888; }
    </style>
</head>
<body>
    <h1>❌ 틱택토</h1>
    
    <div class="controls">
        <label for="gameMode">모드: </label>
        <select id="gameMode" onchange="switchGameMode()">
            <option value="ai">VS 컴퓨터 (싱글)</option>
            <option value="p2p">1:1 온라인 (P2P)</option>
        </select>

        <span id="aiDiffContainer">
            <label for="difficulty">난이도: </label>
            <select id="difficulty" onchange="resetGame()">
                <option value="easy">쉬움 (랜덤)</option>
                <option value="normal" selected>보통</option>
                <option value="hard">어려움</option>
                <option value="expert">극한 🔥 (무적)</option>
            </select>
        </span>

        <button id="p2pSetupBtn" style="display:none; background:#4dadf7; color:#fff;" onclick="openP2PModal()">📡 방 설정</button>
    </div>

    <div class="status-container">
        <span id="status">당신의 차례입니다 (O)</span>
        <span id="ping-display" class="ping-badge"></span>
    </div>

    <div class="board" id="board"></div>

    <button onclick="resetGame()">🔄 게임 리셋</button>
    <button onclick="location.href='../'">🏠 메인으로 가기</button>

    <!-- 결과 안내 모달 -->
    <div class="modal" id="overModal">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-top:0;">결과</h2>
            <button onclick="resetGame()">🔄 다시 하기</button>
            <button onclick="closeModal('overModal')">닫기</button>
        </div>
    </div>

    <!-- P2P 자동 연결 모달 -->
    <div class="modal" id="p2pModal">
        <div class="modal-content">
            <h3 style="margin-top:0;">🌐 1:1 온라인 접속</h3>
            
            <!-- 방 생성 (방장) -->
            <div class="p2p-card">
                <strong>🏠 방 만들기 (방장)</strong><br>
                <button id="btnCreateRoom" onclick="handleCreateRoom()" style="margin-top:10px; background:#4dadf7; color:#fff;">방 번호 생성</button>
                <div id="roomCodeArea" style="display:none;">
                    <div style="font-size:0.85rem; color:#666; margin-top:8px;">상대방에게 아래 6자리 숫자를 알려주세요</div>
                    <div id="displayRoomCode" class="room-code-display">------</div>
                    <div id="hostWaitStatus" style="font-size:0.85rem; color:#e03131;">⏳ 상대방 접속 대기 중...</div>
                </div>
            </div>

            <div class="divider"><span>또는</span></div>

            <!-- 방 참가 (참가자) -->
            <div class="p2p-card">
                <strong>🎮 방 참가하기 (참가자)</strong><br>
                <div style="margin-top:10px;">
                    <input type="text" id="inputRoomCode" class="code-input" maxlength="6" placeholder="000000">
                    <button id="btnJoinRoom" onclick="handleJoinRoom()">입장</button>
                </div>
            </div>

            <button onclick="closeModal('p2pModal')">❌ 닫기</button>
        </div>
    </div>

    <script>
        // 테마 로드
        const savedTheme = localStorage.getItem('minig-theme');
        if (savedTheme && savedTheme !== 'white') document.documentElement.setAttribute('data-theme', savedTheme);

        // 사운드 효과
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'hit_o') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(600, now); osc.frequency.linearRampToValueAtTime(300, now + 0.05);
                    gain.gain.setValueAtTime(0.04, now); gain.gain.linearRampToValueAtTime(0, now + 0.05); osc.start(now); osc.stop(now + 0.05);
                } else if (type === 'hit_x') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(450, now); osc.frequency.linearRampToValueAtTime(200, now + 0.05);
                    gain.gain.setValueAtTime(0.04, now); gain.gain.linearRampToValueAtTime(0, now + 0.05); osc.start(now); osc.stop(now + 0.05);
                } else if (type === 'win') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.06); osc.frequency.setValueAtTime(783.99, now + 0.12); osc.frequency.setValueAtTime(1046.5, now + 0.18);
                    gain.gain.setValueAtTime(0.03, now); gain.gain.linearRampToValueAtTime(0, now + 0.3); osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'lose') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(250, now); osc.frequency.linearRampToValueAtTime(60, now + 0.3);
                    gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0, now + 0.3); osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'draw') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(350, now); osc.frequency.setValueAtTime(350, now + 0.08);
                    gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0, now + 0.16); osc.start(now); osc.stop(now + 0.16);
                }
            } catch(e){}
        }

        // 게임 상태
        const boardElement = document.getElementById("board");
        let board = ["", "", "", "", "", "", "", "", ""];
        let isGameActive = true;
        let currentGameMode = 'ai';
        let mySymbol = 'O';
        let currentTurn = 'O';

        // PeerJS P2P 통신 관리
        let peer = null;
        let conn = null;
        let pingTimer = null;
        let currentPing = 0;

        const winPatterns = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function checkWin(b, p) { return winPatterns.some(pattern => pattern.every(index => b[index] === p)); }
        function getWinningPattern(b, p) { return winPatterns.find(pattern => pattern.every(index => b[index] === p)); }
        function checkDraw(b) { return b.every(cell => cell !== ""); }

        function updateStatusUI() {
            const statusEl = document.getElementById("status");
            if (currentGameMode === 'ai') {
                statusEl.innerText = isGameActive ? `당신의 차례입니다 (${currentTurn})` : "게임 종료";
            } else {
                if (!conn || !conn.open) {
                    statusEl.innerText = "📡 P2P 연결 대기 중...";
                } else if (currentTurn === mySymbol) {
                    statusEl.innerText = `당신의 차례입니다 (${mySymbol})`;
                } else {
                    statusEl.innerText = `상대방 차례입니다 (${currentTurn})`;
                }
            }
        }

        function createBoard(winPattern = null) {
            boardElement.innerHTML = "";
            board.forEach((val, i) => {
                const cell = document.createElement("div");
                cell.classList.add("cell");
                cell.innerText = val;
                if (val === "O") cell.style.color = "#4dadf7";
                if (val === "X") cell.style.color = "#ff6b6b";
                if (winPattern && winPattern.includes(i)) cell.classList.add("win");
                cell.addEventListener("click", () => makeMove(i));
                boardElement.appendChild(cell);
            });
        }

        function makeMove(i, isRemote = false) {
            if (!isGameActive || board[i] !== "") return;

            if (currentGameMode === 'p2p') {
                if (!conn || !conn.open) {
                    alert("상대방과 연결이 완료되지 않았습니다.");
                    return;
                }
                if (!isRemote && currentTurn !== mySymbol) return;
            }

            const symbol = currentTurn;
            board[i] = symbol;
            playSound(symbol === 'O' ? 'hit_o' : 'hit_x');

            if (currentGameMode === 'p2p' && !isRemote) {
                conn.send({ type: 'MOVE', index: i });
            }

            const winPattern = getWinningPattern(board, symbol);
            if (winPattern) {
                createBoard(winPattern);
                isGameActive = false;
                const isIWin = (currentGameMode === 'ai' && symbol === 'O') || (currentGameMode === 'p2p' && symbol === mySymbol);
                playSound(isIWin ? 'win' : 'lose');
                setTimeout(() => showEndModal(isIWin ? "🎉 승리했습니다!" : "💻 패배했습니다...", isIWin ? "#4dadf7" : "#ff6b6b"), 200);
                return;
            }

            if (checkDraw(board)) {
                createBoard();
                playSound('draw');
                isGameActive = false;
                setTimeout(() => showEndModal("🤝 무승부입니다!", "#777"), 200);
                return;
            }

            currentTurn = currentTurn === 'O' ? 'X' : 'O';
            createBoard();
            updateStatusUI();

            if (currentGameMode === 'ai' && currentTurn === 'X' && isGameActive) {
                isGameActive = false;
                document.getElementById("status").innerText = "컴퓨터가 생각 중...";
                setTimeout(computerMove, 300);
            }
        }

        function computerMove() {
            const diff = document.getElementById("difficulty").value;
            let move;
            if (diff === "easy") move = getRandomMove();
            else if (diff === "normal") move = Math.random() < 0.4 ? getBestMove() : getRandomMove();
            else if (diff === "hard") move = Math.random() < 0.8 ? getBestMove() : getRandomMove();
            else move = getBestMove();

            isGameActive = true;
            if (move !== undefined) makeMove(move, true);
        }

        function getRandomMove() {
            let empties = board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
            return empties[Math.floor(Math.random() * empties.length)];
        }

        function getBestMove() {
            let bestScore = -Infinity;
            let move;
            for (let i = 0; i < 9; i++) {
                if (board[i] === "") {
                    board[i] = "X";
                    let score = minimax(board, 0, false);
                    board[i] = "";
                    if (score > bestScore) {
                        bestScore = score;
                        move = i;
                    }
                }
            }
            return move;
        }

        function minimax(b, depth, isMaximizing) {
            if (checkWin(b, "X")) return 10 - depth;
            if (checkWin(b, "O")) return depth - 10;
            if (b.every(c => c !== "")) return 0;

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (b[i] === "") {
                        b[i] = "X";
                        let score = minimax(b, depth + 1, false);
                        b[i] = "";
                        bestScore = Math.max(score, bestScore);
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (b[i] === "") {
                        b[i] = "O";
                        let score = minimax(b, depth + 1, true);
                        b[i] = "";
                        bestScore = Math.min(score, bestScore);
                    }
                }
                return bestScore;
            }
        }

        // --- P2P (PeerJS) 자동 처리 핵심 로직 ---

        function disconnectP2P() {
            if (pingTimer) clearInterval(pingTimer);
            if (conn) conn.close();
            if (peer) peer.destroy();
            conn = null;
            peer = null;
            document.getElementById("ping-display").innerText = "";
        }

        function setupConnectionEvents() {
            conn.on('open', () => {
                closeModal('p2pModal');
                alert("✅ 상대방과 연결되었습니다! 게임을 시작합니다.");
                resetGame(false);
                startHeartbeat();
            });

            conn.on('data', (data) => {
                if (data.type === 'MOVE') makeMove(data.index, true);
                else if (data.type === 'RESET') resetGame(false);
                else if (data.type === 'PING') conn.send({ type: 'PONG', time: data.time });
                else if (data.type === 'PONG') {
                    currentPing = Date.now() - data.time;
                    document.getElementById("ping-display").innerText = `📶 ${currentPing}ms`;
                }
            });

            conn.on('close', () => {
                alert("❌ 상대방과의 연결이 끊어졌습니다.");
                disconnectP2P();
                updateStatusUI();
            });
        }

        function startHeartbeat() {
            if (pingTimer) clearInterval(pingTimer);
            pingTimer = setInterval(() => {
                if (conn && conn.open) {
                    conn.send({ type: 'PING', time: Date.now() });
                }
            }, 1000);
        }

        function handleCreateRoom() {
            disconnectP2P();
            mySymbol = 'O';
            const roomCode = Math.floor(100000 + Math.random() * 900000).toString(); // 6자리 방 번호
            
            document.getElementById("btnCreateRoom").disabled = true;
            document.getElementById("btnCreateRoom").innerText = "⏳ 서버 등록 중...";

            peer = new Peer('minig-ttt-' + roomCode);

            peer.on('open', () => {
                document.getElementById("roomCodeArea").style.display = "block";
                document.getElementById("displayRoomCode").innerText = roomCode;
                document.getElementById("btnCreateRoom").style.display = "none";
            });

            peer.on('connection', (c) => {
                conn = c;
                setupConnectionEvents();
            });

            peer.on('error', (err) => {
                alert("방 생성 오류: " + err.type + "\n다시 시도해 주세요.");
                document.getElementById("btnCreateRoom").disabled = false;
                document.getElementById("btnCreateRoom").innerText = "방 번호 생성";
            });
        }

        function handleJoinRoom() {
            const roomCode = document.getElementById("inputRoomCode").value.trim();
            if (roomCode.length !== 6) return alert("6자리 방 번호를 올바르게 입력해주세요.");

            disconnectP2P();
            mySymbol = 'X';

            const btn = document.getElementById("btnJoinRoom");
            btn.disabled = true;
            btn.innerText = "⏳ 접속 중...";

            peer = new Peer();

            peer.on('open', () => {
                conn = peer.connect('minig-ttt-' + roomCode);
                setupConnectionEvents();
            });

            peer.on('error', (err) => {
                alert("방을 찾을 수 없거나 연결 실패했습니다. 방 번호를 확인해 주세요.");
                btn.disabled = false;
                btn.innerText = "입장";
            });
        }

        function switchGameMode() {
            currentGameMode = document.getElementById("gameMode").value;
            const diffBox = document.getElementById("aiDiffContainer");
            const p2pBtn = document.getElementById("p2pSetupBtn");

            if (currentGameMode === 'p2p') {
                diffBox.style.display = "none";
                p2pBtn.style.display = "inline-block";
                openP2PModal();
            } else {
                diffBox.style.display = "inline-block";
                p2pBtn.style.display = "none";
                disconnectP2P();
                mySymbol = 'O';
            }
            resetGame();
        }

        function showEndModal(text, color) {
            const title = document.getElementById("modalTitle");
            title.innerText = text;
            title.style.color = color;
            document.getElementById("overModal").style.display = "flex";
        }

        function openP2PModal() { document.getElementById("p2pModal").style.display = "flex"; }
        function closeModal(id) { document.getElementById(id).style.display = "none"; }

        function resetGame(sendNetworkSync = true) {
            closeModal('overModal');
            board = ["", "", "", "", "", "", "", "", ""];
            isGameActive = true;
            currentTurn = 'O';

            if (currentGameMode === 'p2p' && sendNetworkSync && conn && conn.open) {
                conn.send({ type: 'RESET' });
            }

            updateStatusUI();
            createBoard();
        }

        createBoard();
    </script>
</body>
</html>
