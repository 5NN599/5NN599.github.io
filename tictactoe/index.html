<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>미니지 - 틱택토</title>
    <style>
        :root { --bg: #f8f9fa; --text: #333; --canvas-bg: #fff; --border: #e9ecef; --btn-bg: #fff; }
        [data-theme="beige"] { --bg: #f5ebe0; --text: #4e3d30; --canvas-bg: #eddfd0; --border: #ddcbbb; --btn-bg: #eddfd0; }
        [data-theme="dark"] { --bg: #0d1117; --text: #c9d1d9; --canvas-bg: #161b22; --border: #30363d; --btn-bg: #21262d; }
        
        body { text-align: center; background-color: var(--bg); color: var(--text); font-family: sans-serif; padding-top: 30px; margin:0; transition: 0.3s; }
        .controls { margin-bottom: 15px; }
        select { padding: 6px 12px; font-size: 1rem; border-radius: 6px; border: 1px solid var(--border); background: var(--canvas-bg); color: var(--text); }
        .board { display: grid; grid-template-columns: repeat(3, 100px); grid-gap: 5px; justify-content: center; margin: 20px auto; }
        .cell { width: 100px; height: 100px; background-color: var(--canvas-bg); border: 2px solid var(--border); border-radius: 12px; font-size: 2.5rem; font-weight: bold; line-height: 100px; cursor: pointer; color: var(--text); }
        .cell:hover { opacity: 0.8; }
        button { background-color: var(--btn-bg); color: var(--text); border: 1px solid var(--border); padding: 10px 20px; font-size: 1rem; border-radius: 8px; cursor: pointer; margin:5px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: var(--canvas-bg); padding: 30px; border-radius: 16px; border: 2px solid var(--border); text-align: center; }
    </style>
</head>
<body>
    <h1>❌ 틱택토 (난이도 선택)</h1>
    <div class="controls">
        <label for="difficulty">난이도: </label>
        <select id="difficulty" onchange="resetGame()">
            <option value="easy">쉬움</option>
            <option value="normal" selected>보통</option>
            <option value="hard">어려움</option>
            <option value="expert">극한 🔥</option>
        </select>
    </div>
    <div id="status" style="font-size:1.2rem; margin-bottom:10px;">당신의 차례입니다 (O)</div>
    <div class="board" id="board"></div>
    <button onclick="location.href='../'">🏠 메인으로 가기</button>

    <div class="modal" id="overModal">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-top:0;">결과</h2>
            <button onclick="resetGame()">🔄 다시 하기</button>
            <button onclick="location.href='../'">🏠 메인 메뉴</button>
        </div>
    </div>

    <script>
        const savedTheme = localStorage.getItem('minig-theme');
        if (savedTheme && savedTheme !== 'white') document.documentElement.setAttribute('data-theme', savedTheme);

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playClick(f) {
            try {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(f, audioCtx.currentTime); gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05); osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } catch(e){}
        }

        const boardElement = document.getElementById("board");
        let board = ["", "", "", "", "", "", "", "", ""];
        let isGameActive = true;
        const winPatterns = [[0,1,2], [3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6]];
        
        function checkWin(b, p) { return winPatterns.some(pattern => pattern.every(index => b[index] === p)); }
        function checkDraw(b) { return b.every(cell => cell !== ""); }

        function createBoard() {
            boardElement.innerHTML = "";
            board.forEach((val, i) => {
                const cell = document.createElement("div"); cell.classList.add("cell"); cell.innerText = val;
                if(val === "O") cell.style.color = "#4dadf7";
                if(val === "X") cell.style.color = "#ff6b6b";
                cell.addEventListener("click", () => makeMove(i)); boardElement.appendChild(cell);
            });
        }

        function makeMove(i) {
            if (!isGameActive || board[i] !== "") return;
            board[i] = "O"; playClick(523); createBoard();
            
            if (checkWin(board, "O")) { showEndModal("🎉 당신의 승리!", "#4dadf7"); return; }
            if (checkDraw(board)) { showEndModal("🤝 무승부입니다!", var(--text)); return; }
            
            isGameActive = false;
            document.getElementById("status").innerText = "컴퓨터가 생각 중...";
            setTimeout(computerMove, 400);
        }

        function computerMove() {
            const diff = document.getElementById("difficulty").value;
            let move;
            
            if (diff === "easy") {
                move = getRandomMove();
            } else if (diff === "normal") {
                move = Math.random() < 0.4 ? getBestMove() : getRandomMove();
            } else if (diff === "hard") {
                move = Math.random() < 0.75 ? getBestMove() : getRandomMove();
            } else {
                move = getBestMove(); // 절대 안짐
            }

            if (move !== undefined) {
                board[move] = "X"; playClick(392); createBoard();
                if (checkWin(board, "X")) { showEndModal("💻 컴퓨터 승리!", "#ff6b6b"); return; }
                if (checkDraw(board)) { showEndModal("🤝 무승부입니다!", "#777"); return; }
            }
            isGameActive = true;
            document.getElementById("status").innerText = "당신의 차례입니다 (O)";
        }

        function getRandomMove() {
            let empties = board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
            return empties[Math.floor(Math.random() * empties.length)];
        }

        function getBestMove() {
            let bestScore = -Infinity; let move;
            for (let i = 0; i < 9; i++) {
                if (board[i] === "") {
                    board[i] = "X"; let score = minimax(board, 0, false); board[i] = "";
                    if (score > bestScore) { bestScore = score; move = i; }
                }
            }
            return move;
        }

        function minimax(b, depth, isMaximizing) {
            if (checkWin(b, "X")) return 10 - depth;
            if (checkWin(b, "O")) return depth - 10;
            if (b.every(c => c !== "")) return 0;

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (b[i] === "") { b[i] = "X"; let score = minimax(b, depth + 1, false); b[i] = ""; bestScore = Math.max(score, bestScore); }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (b[i] === "") { b[i] = "O"; let score = minimax(b, depth + 1, true); b[i] = ""; bestScore = Math.min(score, bestScore); }
                }
                return bestScore;
            }
        }

        function showEndModal(text, color) {
            const title = document.getElementById("modalTitle");
            title.innerText = text; title.style.color = color;
            document.getElementById("overModal").style.display = "flex";
        }

        function resetGame() {
            document.getElementById("overModal").style.display = "none";
            board = ["", "", "", "", "", "", "", "", ""]; isGameActive = true;
            document.getElementById("status").innerText = "당신의 차례입니다 (O)";
            createBoard();
        }
        createBoard();
    </script>
</body>
</html>
